const L=()=>window.MuharrarL.get();
const t=window.MuharrarL.make(TX);
const dowName=(i,low)=>TX[low?'everyDowLow':'everyDowCap'][L()][i];

function createPoemModule(opts){
  const DATA=opts.data.map((d,i)=>Object.assign({idx:i+1},d));
  const N=DATA.length, PACE=opts.pace||7, EXAM_DOW=opts.examDow;
  const KEY=opts.storageKey, dkey=k=>KEY+':'+k;
  const INT=[1,1,2,4,7,14,30];
  const blank=()=>({learned:{},prog:{},streak:0,last:null,reviews:0,start:null,plan:null});
  const fresh=()=>({learned:{},prog:{},streak:0,last:null,reviews:0,start:dayNum(),plan:null});
  let cur=null, S=blank();

  function save(){ if(!cur) return; S.ts=Date.now(); try{localStorage.setItem(dkey(cur.key),JSON.stringify(S));}catch(e){} }
  function loadProfile(p){
    cur=p; let o=null;
    try{const v=localStorage.getItem(dkey(p.key)); if(v) o=JSON.parse(v);}catch(e){}
    S=Object.assign(blank(),o||{});
    if(!S.start){ S.start=dayNum(); save(); }
  }
  const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)};
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const learnedItems=()=>DATA.filter(d=>S.learned[d.idx]);
  const dueItems=()=>{const d=dayNum();return learnedItems().filter(x=>!S.prog[x.idx]||S.prog[x.idx].due<=d)};
  function curStreak(){return (S.last!==null && S.last>=dayNum()-1)?S.streak:0}

  /* ---------- план / экзамен ---------- */
  const ksaNow=()=>Date.now()+3*36e5; // KSA UTC+3
  function cycleInfo(){
    const t0=ksaNow(), n=Math.floor(t0/864e5), h=Math.floor((t0%864e5)/36e5), dow=(n+4)%7;
    const cyc=(dow===EXAM_DOW&&h>=13)?n+1:n, cd=(cyc+4)%7;
    return {n,dow,exam:cyc+(EXAM_DOW-cd+7)%7};
  }
  function planInfo(){
    const {n,exam}=cycleInfo(), days=exam-n, per=(S.plan&&S.plan.per)||PACE;
    const weeksToExam=Math.max(1,Math.round((exam-(S.start||n))/7));
    const b=Math.max(0,Math.min(N,weeksToExam*per)), a=Math.max(1,Math.min(N,(weeksToExam-1)*per+1));
    return {days,exam,per,week:{a,b}};
  }
  function weekLabelCard(){
    const P=planInfo(), w=P.week; if(w.b<w.a) return '';
    return `<div class="card wkl"><div class="muted" style="font-size:.85rem">${t('wkMaterial')}</div>
      <div class="big" style="font-size:2rem;margin:4px 0">${t('numPrefix')} <bdi>${DATA[w.a-1].n}–${DATA[w.b-1].n}</bdi></div>
      <div class="muted">${t('baytsPace',w.b-w.a+1,P.per)}</div></div>`;
  }
  function planCard(){
    const P=planInfo(), w=P.week, has=w.b>=w.a;
    const ok=has?DATA.filter(d=>d.idx>=w.a&&d.idx<=w.b&&S.learned[d.idx]).length:0;
    const title=P.days===0?t('examToday'):P.days===1?t('examTomorrow'):t('examInN',P.days);
    return `<div class="card"><h2>${esc(title)}</h2><div class="muted">${dowName(EXAM_DOW)}</div>
      ${has?`<p style="margin:10px 0 2px"><b>${t('needKnow',DATA[w.a-1].n,DATA[w.b-1].n)}</b></p>
      <div class="muted">${t('markedOf',ok,w.b-w.a+1)}</div>
      ${ok<(w.b-w.a+1)?`<button class="btn sec" id="markEx" style="margin-top:8px;padding:8px 12px">${t('markAll')}</button>`:''}`:''}
      <button class="btn" id="goLearn" style="width:100%;margin-top:10px">${t('studyBtn')}</button></div>`;
  }
  function examCard(){
    const P=planInfo(), w=P.week; if(w.b<w.a) return '';
    return `<div class="card"><h2>${t('examDrill')}</h2>
      <label class="f" style="margin-bottom:10px"><select id="exScope">
        <option value="all">${t('scopeAll',DATA[w.b-1].n)}</option>
        <option value="week">${t('scopeWeek',DATA[w.a-1].n,DATA[w.b-1].n)}</option>
      </select></label>
      <button class="btn" id="exStart" style="width:100%">${t('startBtn')}</button></div>`;
  }
  function ring(pct,color,big,small){
    const p=Math.max(0,Math.min(100,pct));
    return `<svg viewBox="0 0 120 120" class="rg" role="img" aria-label="${esc(big+' '+small)}">
      <circle cx="60" cy="60" r="48" fill="none" stroke="var(--chip)" stroke-width="11"/>
      <circle cx="60" cy="60" r="48" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="${p>0?'round':'butt'}" pathLength="100" stroke-dasharray="${p} 100" transform="rotate(-90 60 60)"/>
      <text x="60" y="${small?64:69}" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)" font-family="IBM Plex Sans,IBM Plex Sans Arabic,sans-serif">${esc(big)}</text>
      ${small?`<text x="60" y="84" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="IBM Plex Sans,IBM Plex Sans Arabic,sans-serif">${esc(small)}</text>`:''}</svg>`;
  }
  function ringsCard(){
    const k=learnedItems().length, P=planInfo(), w=P.week, has=w.b>=w.a;
    const n2=has?w.b-w.a+1:0, k2=has?DATA.filter(d=>d.idx>=w.a&&d.idx<=w.b&&S.learned[d.idx]).length:0;
    return `<div class="card"><div class="rings">
      <div class="rc">${ring(k/N*100,'var(--accent)',String(k),t('ofN',N))}<div class="rt">${t('totalLearned')}</div><div class="muted rs">${t('leftN',N-k)}</div></div>
      ${has?`<div class="rc">${ring(k2/n2*100,'var(--gold)',k2+'/'+n2,'')}<div class="rt">${t('thisWeek')}</div><div class="muted rs">${P.days===0?t('examTodayS'):t('daysToExam',P.days)}</div></div>`:''}
    </div></div>`;
  }

  /* ---------- проверка письменного ответа ---------- */
  function normAr(s){
    return String(s).replace(/[ً-ْٰـۖ-ۭ]/g,'').replace(/[آأإٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
      .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي\s]/g,' ').replace(/\s+/g,' ').trim();
  }
  function arPairs(s){ const raw=String(s).split(/\s+/).filter(Boolean), out=[]; for(const r of raw){const n=normAr(r); if(n) out.push([r,n]);} return out; }
  function alignWords(exp,got){
    const n=exp.length,m=got.length,D=[];
    for(let i=0;i<=n;i++) D.push(new Array(m+1).fill(0));
    for(let i=1;i<=n;i++)for(let j=1;j<=m;j++) D[i][j]=exp[i-1]===got[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);
    const out=[]; let i=n,j=m;
    while(i>0&&j>0){ if(exp[i-1]===got[j-1]){out.push({t:'k',w:exp[i-1]});i--;j--;} else if(D[i-1][j]>=D[i][j-1]){out.push({t:'mi',w:exp[i-1]});i--;} else {out.push({t:'x',w:got[j-1]});j--;} }
    while(i>0){out.push({t:'mi',w:exp[i-1]});i--;} while(j>0){out.push({t:'x',w:got[j-1]});j--;}
    return out.reverse();
  }
  function checkWritten(expected,typed,prompt){
    const E=arPairs(expected); let Gt=arPairs(typed);
    if(prompt){ const P=arPairs(prompt); if(P.length&&Gt.length>=P.length&&P.every((p,k)=>p[1]===Gt[k][1])) Gt=Gt.slice(P.length); }
    const e=E.map(x=>x[1]), g=Gt.map(x=>x[1]), al=alignWords(e,g);
    let ei=0,gi=0; const out=[];
    for(const step of al){
      if(step.t==='k'){out.push({t:'k',w:E[ei][0]});ei++;gi++;}
      else if(step.t==='mi'){out.push({t:'mi',w:E[ei][0]});ei++;}
      else {out.push({t:'x',w:Gt[gi]?Gt[gi][0]:step.w});gi++;}
    }
    const ok=out.filter(x=>x.t==='k').length, den=Math.max(e.length,g.length)||1;
    return {al:out, ok, total:e.length, pct:Math.round(ok/den*100)};
  }

  /* ---------- заучивание ---------- */
  const bare=s=>String(s).replace(/[ً-ْٰـ]/g,'');
  let learnIdx=null, learnCut=null, learnBare=false, learnReturn=false;
  function planStart(){
    for(let i=1;i<=N;i++) if(!S.learned[i]) return i;
    return 1;
  }
  function full(item){
    return `<div class="reveal"><div class="meta"><span class="chip">№ ${item.n}</span>${item.sec?`<span class="chip wk">${esc(item.sec)}</span>`:''}</div>
      <div class="ar">${esc(item.h1)}</div><div class="ar" style="color:var(--muted)">${esc(item.h2)}</div></div>`;
  }
  function renderLearn(){
    if(learnIdx===null) learnIdx=Math.min(N,Math.max(1,S.learnIdx||planStart()));
    const i=learnIdx, item=DATA[i-1];
    const full1=learnBare?bare(item.h1):item.h1, full2=learnBare?bare(item.h2):item.h2;
    const txt=full1+'  ...  '+full2, words=txt.split(/\s+/);
    const shown=(learnCut===null)?txt:(words.slice(0,learnCut).join(' ')+' …');
    const pct=Math.round(i/N*100);
    app.innerHTML=`
    <div class="qhead"><span class="muted">${t('iOfN',i,N)}</span>
      <span class="nvb"><button id="pv" ${i<=1?'disabled':''}>‹</button><button id="nx" ${i>=N?'disabled':''}>›</button></span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card">
      <div class="meta"><span class="chip">№ ${item.n}</span>${item.sec?`<span class="chip wk">${esc(item.sec)}</span>`:''}${S.learned[i]?'<span class="chip ok">✓ '+t('learnedChip')+'</span>':''}</div>
      <div class="ar matn ${learnCut===null?'':'hid'}" id="matn" style="margin-top:12px">${esc(shown)}</div>
      <div class="lrow">
        ${learnCut===null?`<button class="btn sec" id="hide">${t('hideCheck')}</button>`
          :`<button class="btn sec" id="more" ${learnCut>=words.length?'disabled':''}>${t('moreWord')}</button><button class="btn sec" id="full">${t('showAll')}</button>`}
        <button class="btn sec" id="tsk">${learnBare?t('showTashkil'):t('hideTashkil')}</button>
      </div>
      <p class="muted" style="margin:10px 0 0;font-size:.84rem">${t('learnHint')}</p>
    </div>
    <div class="actions">
      <button class="btn sec" id="qz">${t('testMe')}</button>
      <button class="btn ${S.learned[i]?'sec':''}" id="mk">${S.learned[i]?t('unmark'):t('markLearned')}</button>
    </div>
    <div class="card" style="margin-top:14px"><div class="jump">
      <label class="f" style="min-width:0">${t('goToNum')}<input type="number" id="jn" min="1" max="${N}" value="${i}" inputmode="numeric"></label>
      <button class="btn sec" id="jg">${t('goBtn')}</button>
      <button class="btn sec" id="jt">${t('toCurrent')}</button>
    </div></div>`;
    const $=id=>document.getElementById(id);
    const go=n=>{learnIdx=Math.min(N,Math.max(1,n));learnCut=null;S.learnIdx=learnIdx;save();render();};
    $('pv').onclick=()=>go(i-1); $('nx').onclick=()=>go(i+1);
    if($('hide')) $('hide').onclick=()=>{learnCut=1;renderLearn()};
    if($('more')) $('more').onclick=()=>{learnCut=Math.min(words.length,learnCut+1);renderLearn()};
    if($('full')) $('full').onclick=()=>{learnCut=null;renderLearn()};
    $('tsk').onclick=()=>{learnBare=!learnBare;renderLearn()};
    $('mk').onclick=()=>{ if(S.learned[i]) delete S.learned[i]; else S.learned[i]=true; save(); if(S.learned[i]&&i<N) go(i+1); else renderLearn(); };
    $('qz').onclick=()=>{ learnReturn=true; tab='quiz'; startWith([item,item,item],'mix',true); };
    $('jg').onclick=()=>go(+$('jn').value||1);
    $('jt').onclick=()=>go(planStart());
    $('jn').addEventListener('keydown',ev=>{if(ev.key==='Enter')go(+$('jn').value||1)});
  }

  /* ---------- викторина ---------- */
  const MODES=['mix','flash','write','choice','full'];
  const MNAME=()=>({mix:t('mMix'),flash:t('mFlash'),write:t('mWrite'),choice:t('mChoice'),full:t('mFull')});
  let cfg={mode:'mix',count:'10',practice:false};
  let tab='quiz', Q=null;
  const app=document.getElementById(opts.containerId);
  const WMIN=2;
  const canWrite=item=>item.h2.split(/\s+/).filter(Boolean).length>=WMIN;

  function renderHome(){
    const Ln=learnedItems().length, due=dueItems().length;
    let html=weekLabelCard()+planCard()+ringsCard()+examCard();
    if(!Ln){
      html+=`<div class="card empty"><h2>${t('nothingLearned')}</h2><p class="muted">${t('startOnLearn')}</p>
        <button class="btn" id="go">${t('goToLearn')}</button></div>`;
    }else{
      html+=`<div class="card"><div class="row" style="justify-content:space-between">
        <div><div class="big">${due}</div><div class="muted">${t('dueToday')}</div></div>
        <div style="text-align:end"><div class="big" style="font-size:1.6rem;color:var(--ink)">${Ln}</div><div class="muted">${t('learnedOfN',N)}</div></div>
      </div></div>
      <div class="card"><h2>${t('quizSetup')}</h2>
        <div class="row" style="margin-bottom:10px">
          <label class="f">${t('qTypeL')}<select id="mode">${MODES.map(m=>`<option value="${m}">${esc(MNAME()[m])}</option>`).join('')}</select></label>
          <label class="f">${t('howMany')}<select id="count"><option>5</option><option>10</option><option>20</option><option value="all">${t('allOpt')}</option></select></label>
        </div>
        <label class="row muted" style="gap:8px;margin-bottom:12px"><input type="checkbox" id="practice" style="width:20px;height:20px"> ${t('practiceLbl')}</label>
        <button class="btn" id="start" style="width:100%">${t('startBtn')}</button>
        <p class="muted" id="hint" style="margin:10px 0 0"></p>
      </div>`;
    }
    app.innerHTML=html;
    const $=id=>document.getElementById(id);
    const gl=$('goLearn'); if(gl) gl.onclick=()=>{tab='learn';learnIdx=null;render()};
    const mb=$('markEx'); if(mb) mb.onclick=()=>{const w=planInfo().week;for(let i=w.a;i<=w.b;i++)S.learned[i]=true;save();render();};
    const eb=$('exStart');
    if(eb) eb.onclick=()=>{
      const w=planInfo().week, a=$('exScope').value==='week'?w.a:1;
      startWith(shuffle(DATA.filter(d=>d.idx>=a&&d.idx<=w.b)),'mix',true);
    };
    if(!Ln){ $('go').onclick=()=>{tab='learn';render()}; return; }
    $('mode').value=cfg.mode; $('count').value=cfg.count; $('practice').checked=cfg.practice;
    const upd=()=>{
      cfg={mode:$('mode').value,count:$('count').value,practice:$('practice').checked};
      const n=cfg.practice?Ln:due; $('start').disabled=n===0; $('hint').textContent=n===0?t('allReviewed'):'';
    };
    ['mode','count','practice'].forEach(id=>$(id).addEventListener('change',upd)); upd();
    $('start').onclick=startQuiz;
  }
  function startWith(pool,mode,exam){
    Q={active:true,done:false,mode,exam:!!exam,queue:pool.map(item=>({item,retry:false})),idx:0,total:pool.length,correct:0,wrong:[],answered:false};
    render();
  }
  function startQuiz(){
    let pool=cfg.practice?shuffle(learnedItems()):dueItems().sort((a,b)=>((S.prog[a.idx]||{due:0}).due)-((S.prog[b.idx]||{due:0}).due)||Math.random()-.5);
    if(cfg.count!=='all') pool=pool.slice(0,+cfg.count);
    startWith(pool,cfg.mode,false);
  }
  function buildQ(item){
    let ty=Q.mode||cfg.mode;
    if(ty==='mix'){ const pool=['flash','choice','full']; if(canWrite(item)) pool.push('write'); ty=pool[Math.floor(Math.random()*pool.length)]; }
    if(ty==='write'&&!canWrite(item)) ty='choice';
    const q={item,type:ty};
    if(ty==='choice'){
      q.correct=item.h2; const seen=new Set([item.h2]), out=[item.h2];
      for(const d of shuffle(DATA)){ if(out.length>=4)break; if(!seen.has(d.h2)){seen.add(d.h2);out.push(d.h2);} }
      q.opts=shuffle(out);
    }
    if(ty==='write') q.correct=item.h2;
    if(ty==='full'){ const w=item.h1.split(' '); q.hint=w.slice(0,Math.min(3,w.length)).join(' '); q.correct=item.h1+' '+item.h2; }
    return q;
  }
  function renderQuestion(){
    const cur=Q.queue[Q.idx];
    if(!cur.q) cur.q=buildQ(cur.item);
    const q=cur.q, item=q.item;
    Q.answered=false;
    const pct=Math.round(Q.idx/Q.queue.length*100);
    let body='';
    if(q.type==='flash'){
      body=`<p class="qtype">${t('qRecall2nd')}</p>
        <div class="ar">${esc(item.h1)}</div><div class="ar" id="hint"></div>
        <div id="fb"><div class="actions"><button class="btn sec" id="more">${t('hintBtn')}</button><button class="btn" id="show">${t('showAnswer')}</button></div></div>`;
    }else if(q.type==='write'){
      body=`<p class="qtype">${t('qWrite2nd')}</p>
        <div class="ar">${esc(item.h1)}</div>
        <textarea id="wtxt" class="wr" dir="rtl" placeholder="…" spellcheck="false"></textarea>
        <p class="muted" style="margin:4px 0 0;font-size:.8rem">${t('tashkilNote')}</p>
        <div id="fb"><div class="actions"><button class="btn sec" id="skip">${t('dontKnow')}</button><button class="btn" id="chk">${t('checkBtn')}</button></div></div>`;
    }else if(q.type==='full'){
      body=`<p class="qtype">${t('qWriteFull')}</p>
        <p class="muted" style="margin:2px 0 6px;font-size:.85rem">${t('startsWith')} <span class="ar sm" style="display:inline">${esc(q.hint)} …</span></p>
        <textarea id="wtxt" class="wr" dir="rtl" placeholder="…" spellcheck="false" style="min-height:160px"></textarea>
        <p class="muted" style="margin:4px 0 0;font-size:.8rem">${t('tashkilNote')}</p>
        <div id="fb"><div class="actions"><button class="btn sec" id="skip">${t('dontKnow')}</button><button class="btn" id="chk">${t('checkBtn')}</button></div></div>`;
    }else{
      body=`<p class="qtype">${t('qChoose2nd')}</p><div class="ar">${esc(item.h1)}</div>
        <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>
        <div id="fb"></div>`;
    }
    app.innerHTML=`<div class="qhead"><span class="muted">${t('iOfN',Q.idx+1,Q.queue.length)}${cur.retry?t('retryMark'):''}</span>
        <button class="btn sec" id="stop" style="padding:6px 12px;font-size:.85rem">${t('finishBtn')}</button></div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="card">${body}</div>`;
    document.getElementById('stop').onclick=finish;
    if(q.type==='write'||q.type==='full'){
      const ta=document.getElementById('wtxt'); setTimeout(()=>{try{ta.focus()}catch(e){}},60);
      const verdict=res=>{
        const good=res.pct>=85;
        document.getElementById('fb').innerHTML=
          `<div class="scorebar"><b>${res.pct}%</b><span class="b"><i style="width:${res.pct}%"></i></span><span class="muted">${t('wordMatch')}</span></div>
           <div class="dif">${res.al.map(x=>`<span class="${x.t}">${esc(x.w)}</span>`).join('')}</div>
           <div class="legend"><span><i style="background:var(--ok)"></i>${t('legOk')}</span><span><i style="background:var(--bad)"></i>${t('legBad')}</span><span><i style="background:var(--goldline)"></i>${t('legMiss')}</span></div>
           <div class="reveal"><div class="muted">${t('correctText')}</div>${full(item)}</div>
           <div class="actions"><button class="btn ${good?'sec':'danger'}" id="wno">${t('dontCount')}</button><button class="btn ${good?'':'sec'}" id="wyes">${t('countIt')}</button></div>`;
        document.getElementById('wyes').onclick=()=>answer(true);
        document.getElementById('wno').onclick=()=>answer(false);
      };
      document.getElementById('chk').onclick=()=>{ if(Q.answered)return; verdict(checkWritten(q.correct,ta.value||'',q.type==='write'?item.h1:'')); };
      document.getElementById('skip').onclick=()=>{
        if(Q.answered)return;
        document.getElementById('fb').innerHTML=full(item)+`<div class="actions"><button class="btn" id="next">${t('nextBtn')}</button></div>`;
        document.getElementById('next').onclick=next; answer(false,true);
      };
      ta.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();document.getElementById('chk').click();} });
    }
    if(q.type==='flash'){
      const w=item.h2.split(' '); let k=0;
      const more=document.getElementById('more');
      const hint=()=>{document.getElementById('hint').textContent=k?w.slice(0,k).join(' ')+' …':''; if(k>=w.length-1) more.disabled=true;};
      more.onclick=()=>{ if(k<w.length){k++;hint();} };
      document.getElementById('show').onclick=()=>{
        document.getElementById('fb').innerHTML=full(item)+`<div class="actions"><button class="btn danger" id="no">${t('didntRecall')}</button><button class="btn" id="yes">${t('recalled')}</button></div>`;
        document.getElementById('yes').onclick=()=>answer(true);
        document.getElementById('no').onclick=()=>answer(false);
      };
    }else if(q.type==='choice'){
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        if(Q.answered)return;
        const val=q.opts[+b.dataset.i], ok=String(val)===String(q.correct);
        app.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(String(q.opts[+x.dataset.i])===String(q.correct)) x.classList.add('ok'); });
        if(!ok) b.classList.add('bad');
        document.getElementById('fb').innerHTML=full(item)+`<div class="actions"><button class="btn" id="next">${t('nextBtn')}</button></div>`;
        document.getElementById('next').onclick=next; answer(ok,true);
      });
    }
  }
  function answer(ok,noAdvance){
    if(Q.answered)return; Q.answered=true;
    const cur=Q.queue[Q.idx], item=cur.item;
    if(!cur.retry){
      const p=S.prog[item.idx]||{box:0,due:0,ok:0,bad:0};
      p.box=ok?Math.min(6,p.box+1):0; p.due=dayNum()+INT[p.box]; ok?p.ok++:p.bad++;
      S.prog[item.idx]=p; S.reviews=(S.reviews||0)+1; save();
      if(ok)Q.correct++;
    }
    if(!ok&&!cur.retry){ Q.wrong.push(item); Q.queue.push({item,retry:true}); }
    if(!noAdvance) next();
  }
  function next(){ Q.idx++; if(Q.idx>=Q.queue.length) finish(); else renderQuestion(); }
  function finish(){
    if(Q.queue.length && Q.idx>0){ const d=dayNum(); if(S.last!==d){S.streak=(S.last===d-1)?(S.streak||0)+1:1;S.last=d;save();} }
    Q.active=false;Q.done=true;render();
  }
  function renderDone(){
    const first=Q.queue.filter(x=>!x.retry).length;
    app.innerHTML=`<div class="card empty">
      <div class="big">${Q.correct}<span style="font-size:1.2rem;color:var(--muted)"> / ${Math.min(first,Q.total)}</span></div>
      <p class="muted">${t('firstTry')}</p><p>${Q.wrong.length?t('payAttention'):t('noMistakes')}</p></div>
      ${Q.wrong.length?`<div class="card"><div class="mist">${Q.wrong.map(w=>`<div><div class="meta"><span class="chip">№ ${w.n}</span></div><div class="ar sm">${esc(w.h1)}</div><div class="ar sm" style="color:var(--muted)">${esc(w.h2)}</div></div>`).join('')}</div></div>`:''}
      <button class="btn" id="again" style="width:100%">${t('backBtn')}</button>`;
    document.getElementById('again').onclick=()=>{Q=null;if(learnReturn){learnReturn=false;tab='learn';}render()};
  }

  /* ---------- выбор выученного ---------- */
  let pickFilter='';
  function renderPick(){
    app.innerHTML=`<div class="sticky"><div class="card" style="margin-bottom:0">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="cnt"></b>
        <span class="row"><button class="btn sec" id="all" style="padding:6px 12px">${t('allOpt')}</button><button class="btn sec" id="none" style="padding:6px 12px">${t('clearBtn')}</button></span></div>
      <div class="row" style="margin-bottom:8px">
        <label class="f" style="min-width:90px">${t('fromNum')}<input type="number" id="from" min="1" max="${N}" value="1" inputmode="numeric"></label>
        <label class="f" style="min-width:90px">${t('toNum')}<input type="number" id="to" min="1" max="${N}" value="${N}" inputmode="numeric"></label>
        <button class="btn" id="rOn" style="align-self:flex-end">${t('markBtn')}</button>
        <button class="btn sec" id="rOff" style="align-self:flex-end">${t('unmarkBtn')}</button>
      </div>
      <input type="search" id="q" placeholder="${esc(t('searchPh'))}" value="${esc(pickFilter)}" dir="rtl">
    </div></div><div class="list" id="list" style="margin-top:12px"></div>`;
    const $=id=>document.getElementById(id);
    const cnt=()=>{$('cnt').textContent=t('learnedCount',learnedItems().length,N)};
    const draw=()=>{
      const f=pickFilter.trim();
      const items=DATA.filter(d=>!f||d.h1.includes(f)||d.h2.includes(f)||String(d.n)===f);
      $('list').innerHTML=items.length?items.map(d=>`<label class="pick ${S.learned[d.idx]?'on':''}"><input type="checkbox" data-i="${d.idx}" ${S.learned[d.idx]?'checked':''}>
        <div><div class="top"><span class="chip">№ ${d.n}</span>${d.sec?`<span class="chip wk">${esc(d.sec)}</span>`:''}</div>
        <div class="ar">${esc(d.h1)}</div><div class="ar sm" style="color:var(--muted)">${esc(d.h2)}</div></div></label>`).join('')
        :`<div class="card empty muted">${t('nothingFound')}</div>`;
      $('list').querySelectorAll('input').forEach(c=>c.onchange=()=>{
        const i=+c.dataset.i; if(c.checked)S.learned[i]=true; else delete S.learned[i];
        c.closest('.pick').classList.toggle('on',c.checked); save(); cnt();
      });
    };
    const setRange=v=>{
      let a=Math.max(1,Math.min(N,+$('from').value||1)), b=Math.max(1,Math.min(N,+$('to').value||N));
      if(a>b)[a,b]=[b,a]; for(let i=a;i<=b;i++){ if(v)S.learned[i]=true; else delete S.learned[i]; }
      save();cnt();draw();
    };
    $('rOn').onclick=()=>setRange(true); $('rOff').onclick=()=>setRange(false);
    $('all').onclick=()=>{DATA.forEach(d=>S.learned[d.idx]=true);save();cnt();draw()};
    $('none').onclick=()=>{S.learned={};save();cnt();draw()};
    $('q').oninput=e=>{pickFilter=e.target.value;draw()};
    cnt();draw();
  }

  /* ---------- прогресс ---------- */
  let resetArmed=false;
  /* ---------- аналитика ---------- */
  function accuracy(){
    let ok=0,bad=0;
    Object.keys(S.prog||{}).forEach(k=>{ok+=S.prog[k].ok||0;bad+=S.prog[k].bad||0;});
    return {ok,bad,total:ok+bad,pct:(ok+bad)?Math.round(ok/(ok+bad)*100):null};
  }
  function weakItems(){
    return learnedItems().map(d=>{
      const p=S.prog[d.idx]||{ok:0,bad:0,box:0}, tot=(p.ok||0)+(p.bad||0);
      return {d,p,tot,rate:tot?(p.bad||0)/tot:0};
    }).filter(x=>(x.p.bad||0)>0)
      .sort((a,b)=>b.rate-a.rate||(b.p.bad||0)-(a.p.bad||0)||a.d.idx-b.d.idx);
  }
  function dueForecast(days){
    const n=dayNum(), L=learnedItems(), out=[];
    for(let i=0;i<days;i++){
      const d=n+i; let c=0;
      L.forEach(x=>{const due=(S.prog[x.idx]||{due:n}).due; if(i===0?due<=d:due===d) c++;});
      out.push(c);
    }
    return out;
  }
  function sectionRows(){
    const map=new Map(); let sec=null;
    DATA.forEach(d=>{
      if(d.sec) sec=d.sec;
      const k=sec||'المقدمة';
      if(!map.has(k)) map.set(k,{label:k,done:0,total:0,rtl:true});
      const r=map.get(k); r.total++; if(S.learned[d.idx]) r.done++;
    });
    return [...map.values()];
  }
  const LVNAMES=()=>t('lvNames');

  function renderStats(){
    const MC=window.MuharrarCharts;
    const Li=learnedItems(), cnts=new Array(7).fill(0);
    Li.forEach(d=>cnts[(S.prog[d.idx]||{box:0}).box]++);
    const P=planInfo(), acc=accuracy(), weak=weakItems().slice(0,8);
    const due=dueItems().length, n0=dayNum(), LV=LVNAMES();
    const fc=dueForecast(14).map((v,i)=>({
      value:v, hl:i===0,
      label:window.MuharrarL.dowShort(n0+i),
      tip:(i===0?t('todayWord'):t('inDaysS',i)+' · '+window.MuharrarL.dowShort(n0+i))+'\n'+v+' '+t('dueSuffix')
    }));
    const carpet=MC.carpet({
      items:DATA, dense:N>90,
      level:d=>S.learned[d.idx]?((S.prog[d.idx]||{box:0}).box||0):null,
      tip:d=>{
        const p=S.prog[d.idx]; const tot=(p?(p.ok||0)+(p.bad||0):0);
        return '№ '+d.n+'\n'+(S.learned[d.idx]?LV[(p||{box:0}).box||0]:t('notLearned'))
          +(tot?'\n'+t('corrOf',p.ok||0,tot):'');
      }
    });
    app.innerHTML=`
    <div class="card">
      <p class="eyebrow">${t('sumTitle')}</p>
      ${MC.statRow([
        {value:Li.length,unit:'/'+N,label:t('kLearnedB')},
        {value:due,label:t('kDue')},
        {value:acc.pct==null?'—':acc.pct,unit:acc.pct==null?'':'%',label:t('kAcc'),sub:acc.total?t('corrOf',acc.ok,acc.total):''},
        {value:curStreak(),label:t('kStreak')}
      ])}
    </div>

    <div class="card">
      <p class="eyebrow">${t('mapTitle')}</p>
      ${Li.length?`${carpet}
      <p class="mc-note">${t('mapNoteB')}</p>
      ${MC.levelStrip(cnts,LV,{unit:t('unitBaytN')})}`
      :`<p class="muted" style="margin:0">${t('mapEmptyB')}</p>`}
    </div>

    ${Li.length?`<div class="card">
      <p class="eyebrow">${t('loadTitle')}</p>
      ${MC.columns({rows:fc,note:t('loadNoteB')})}
    </div>`:''}

    <div class="card">
      <p class="eyebrow">${t('secTitle')}</p>
      ${MC.sections({rows:sectionRows()})}
    </div>

    ${weak.length?`<div class="card">
      <p class="eyebrow">${t('weakTitle')}</p>
      <p class="muted" style="margin:0 0 11px">${t('weakNoteB')}</p>
      <div class="weak">${weak.map(w=>`<div class="weak-i">
        <span class="weak-n">№ ${w.d.n}</span>
        <span class="weak-t">${esc(w.d.h1)}</span>
        <span class="weak-p" data-tip="${esc(t('errOf',w.p.bad||0,w.tot))}" tabindex="0">${Math.round(w.rate*100)}%</span>
      </div>`).join('')}</div>
      <button class="btn" id="drill" style="width:100%;margin-top:12px">${t('drillBtn',Math.min(weak.length,20))}</button>
    </div>`:''}

    <div class="card">
      <p class="eyebrow">${t('paceTitle')}</p>
      <label class="f" style="margin-bottom:9px">${t('perWeekB')}<input type="number" id="pl1" min="1" max="30" value="${P.per}" inputmode="numeric"></label>
      <p class="muted" style="margin-top:0">${t('paceNote',opts.pace,dowName(EXAM_DOW,true))}</p>
      <div class="actions"><button class="btn sec" id="plSave">${t('saveBtn')}</button><button class="btn sec" id="plReset">${t('restartWeeks')}</button></div></div>
    <div class="card">
      <p class="eyebrow">${t('bkTitle')}</p>
      <p class="muted" style="margin-top:0">${t('bkNoteSubj')}</p>
      <textarea id="bk">${esc(JSON.stringify(S))}</textarea>
      <div class="actions"><button class="btn sec" id="imp">${t('loadBtn')}</button><button class="btn danger" id="rst">${t('resetSubj')}</button></div>
      <p class="muted" id="msg" style="margin:8px 0 0"></p></div>`;
    const $=id=>document.getElementById(id);
    if($('drill')) $('drill').onclick=()=>{ tab='quiz'; startWith(shuffle(weak.slice(0,20).map(w=>w.d)),'mix',false); };
    $('plSave').onclick=()=>{ const per=Math.max(1,Math.min(30,+$('pl1').value||PACE)); S.plan=Object.assign({},S.plan,{per}); save(); render(); };
    $('plReset').onclick=()=>{ S.start=dayNum(); save(); render(); };
    $('imp').onclick=()=>{
      try{const o=JSON.parse($('bk').value); if(!o||typeof o!=='object'||!o.learned) throw 0; S=Object.assign(fresh(),o); save(); render();}
      catch(e){$('msg').textContent=t('readErr');}
    };
    $('rst').onclick=()=>{
      if(!resetArmed){resetArmed=true;$('rst').textContent=t('pressAgain');setTimeout(()=>{resetArmed=false;if($('rst'))$('rst').textContent=t('resetSubj')},4000);return;}
      S=fresh();save();resetArmed=false;render();
    };
  }

  /* ---------- шапка/рендер ---------- */
  const titleOf=()=>typeof opts.title==='string'?opts.title:(opts.title[L()]||opts.title.ru);
  function applyHeader(){
    window.MuharrarL.apply([app,document.getElementById('hero-'+opts.key)]);
    const ttlEl=document.getElementById(opts.ttlId); if(ttlEl) ttlEl.innerHTML=esc(titleOf())+(opts.subtitle?'<small>'+esc(opts.subtitle)+'</small>':'');
    const stk=document.getElementById(opts.streakId); if(stk) stk.textContent=cur?t('streakLbl',curStreak()):'';
  }
  function render(){
    applyHeader();
    if(!cur) return;
    if(tab==='learn') renderLearn();
    else if(tab==='quiz') Q&&Q.active?renderQuestion():(Q&&Q.done?renderDone():renderHome());
    else if(tab==='pick') renderPick();
    else renderStats();
    window.scrollTo(0,0);
  }

  return {
    key: opts.key,
    get title(){ return titleOf(); },
    setProfile(p){ loadProfile(p); },
    render(){ render(); },
    setTab(tt){ tab=tt; Q=null; render(); },
    getTab(){ return tab; },
    summary(){
      const P=planInfo(), w=P.week, has=w.b>=w.a;
      return {
        learned:learnedItems().length, total:N,
        due:dueItems().length,
        examDays:P.days, examDow:EXAM_DOW,
        streak:curStreak(),
        unit:t('unitBayt'),
        week:has?{a:DATA[w.a-1].n,b:DATA[w.b-1].n,
                  done:DATA.filter(d=>d.idx>=w.a&&d.idx<=w.b&&S.learned[d.idx]).length,
                  total:w.b-w.a+1}:null
      };
    },
    exportState(){ return S; },
    importState(o){ if(!o||typeof o!=='object'||!o.learned) return false; S=Object.assign(fresh(),o); save(); return true; }
  };
}

window.MuharrarPoemFactory = createPoemModule;
})();
</script>
<script>
(function(){

{n:1,h1:'يَقُولُ رَاجِي رَبِّهِ الْمُقْتَدِرِ',h2:'عَبْدُ الرَّحِيمِ بْنُ الْحُسَيْنِ الْأَثَرِي',sec:null},
{n:2,h1:'مِنْ بَعْدِ حَمْدِ اللَّهِ ذِي الْآلَاءِ',h2:'عَلَى امْتِنَانٍ جَلَّ عَنْ إِحْصَاءِ',sec:null},
{n:3,h1:'ثُمَّ صَلَاةٍ وَسَلَامٍ دَائِمِ',h2:'عَلَى نَبِيِّ الْخَيْرِ ذِي الْمَرَاحِمِ',sec:null},
{n:4,h1:'فَهَذِهِ الْمَقَاصِدُ الْمُهِمَّهْ',h2:'تُوضِحُ مِنْ عِلْمِ الْحَدِيثِ رَسْمَهْ',sec:null},
{n:5,h1:'نَظَمْتُهَا تَبْصِرَةً لِلْمُبْتَدِي',h2:'تَذْكِرَةً لِلْمُنْتَهِي وَالْمُسْنِدِ',sec:null},
{n:6,h1:'لَخَّصْتُ فِيهَا ابْنَ الصَّلَاحِ أَجْمَعَهْ',h2:'وَزِدْتُهَا عِلْماً تَرَاهُ مَوْضِعَهْ',sec:null},
{n:7,h1:'فَحَيْثُ جَاءَ الْفِعْلُ وَالضَّمِيرُ',h2:'لِوَاحِدٍ وَمَنْ لَهُ مَسْتُورُ',sec:null},
{n:8,h1:'كَـ «قَالَ» أَوْ أَطْلَقْتُ لَفْظَ «الشَّيْخِ» مَا',h2:'أُرِيدُ إِلَّا ابْنَ الصَّلَاحِ مُبْهَمَا',sec:null},
{n:9,h1:'وَإِنْ يَكُنْ لِاثْنَيْنِ نَحْوُ: «الْتَزَمَا»',h2:'فَمُسْلِمٌ مَعَ الْبُخَارِيِّ هُمَا',sec:null},
{n:10,h1:'وَاللَّهَ أَرْجُو فِي أُمُورِي كُلِّهَا',h2:'مُعْتَصَماً فِي صَعْبِهَا وَسَهْلِهَا',sec:null},
{n:11,h1:'وَأَهْلُ هَذَا الشَّأْنِ قَسَّمُوا السُّنَنْ',h2:'إِلَى «صَحِيحٍ» وَ «ضَعِيفٍ» وَ «حَسَنْ»',sec:'أقسام الحديث'},
{n:12,h1:'فَالْأَوَّلُ: الْمُتَّصِلُ الْإِسْنَادِ',h2:'بِنَقْلِ عَدْلٍ ضَابِطِ الْفُؤَادِ',sec:'القسم الأول: الصحيح'},
{n:13,h1:'عَنْ مِثْلِهِ، مِنْ غَيْرِ مَا شُذُوذِ',h2:'وَعِلَّةٍ قَادِحَةٍ فَتُوذِي',sec:null},
{n:14,h1:'وَبِالصَّحِيحِ وَالضَّعِيفِ قَصَدُوا',h2:'فِي ظَاهِرٍ لَا الْقَطْعَ، وَالْمُعْتَمَدُ',sec:null},
{n:15,h1:'إِمْسَاكُنَا عَنْ حُكْمِنَا عَلَى سَنَدْ',h2:'بِأَنَّهُ أَصَحُّ مُطْلَقاً، وَقَدْ',sec:null},
{n:16,h1:'خَاضَ بِهِ قَوْمٌ فَقِيلَ: مَالِكُ',h2:'عَنْ نَافِعٍ بِمَا رَوَاهُ النَّاسِكُ',sec:null},
{n:17,h1:'مَوْلَاهُ، وَاخْتَرْ حَيْثُ عَنْهُ يُسْنِدُ',h2:'الشَّافِعِي؛ قُلْتُ: وَعَنْهُ أَحْمَدُ',sec:null},
{n:18,h1:'وَجَزَمَ ابْنُ حَنْبَلٍ بِالزُّهْرِي',h2:'عَنْ سَالِمٍ؛ أَيْ: عَنْ أَبِيهِ الْبَرِّ',sec:null},
{n:19,h1:'وَقِيلَ: زَيْنُ الْعَابِدِينَ عَنْ أَبِهْ',h2:'عَنْ جَدِّهِ، وَابْنُ شِهَابٍ عَنْهُ بِهْ',sec:null},
{n:20,h1:'أَوْ فَابْنُ سِيرِينَ عَنِ السَّلْمَانِي',h2:'عَنْهُ، أَوِ الْأَعْمَشُ عَنْ ذِي الشَّانِ',sec:null},
{n:21,h1:'النَّخَعِي عَنِ ابْنِ قَيْسٍ عَلْقَمَهْ',h2:'عَنِ ابْنِ مَسْعُودٍ، وَلُمْ مَنْ عَمَّمَهْ',sec:null},
{n:22,h1:'أَوَّلُ مَنْ صَنَّفَ فِي الصَّحِيحِ',h2:'«مُحَمَّدٌ»، وَخُصَّ بِالتَّرْجِيحِ',sec:'أصح كتب الحديث'},
{n:23,h1:'وَ «مُسْلِمٌ» بَعْدُ، وَبَعْضُ الْغَرْبِ مَعْ',h2:'«أَبِي عَلِيٍّ» فَضَّلُوا ذَا، لَوْ نَفَعْ',sec:null},
{n:24,h1:'وَلَمْ يَعُمَّاهُ، وَلَكِنْ قَلَّ مَا',h2:'عِنْدَ ابْنِ الَاخْرَمْ مِنْهُ قَدْ فَاتَهُمَا',sec:null},
{n:25,h1:'وَرُدَّ، لَكِنْ قَالَ يَحْيَى الْبَرُّ:',h2:'لَمْ يَفُتِ الْخَمْسَةَ إِلَّا النَّزْرُ',sec:null},
{n:26,h1:'وَفِيهِ مَا فِيهِ؛ لِقَوْلِ الْجُعْفِي:',h2:'«أَحْفَظُ مِنْهُ عُشْرَ أَلْفِ أَلْفِ»',sec:null},
{n:27,h1:'وَعَلَّهُ أَرَادَ بِالتَّكْرَارِ',h2:'لَهَا، وَمَوْقُوفٍ، وَفِي «الْبُخَارِي»',sec:null},
{n:28,h1:'أَرْبَعَةُ الْآلَافِ، وَالْمُكَرَّرُ',h2:'فَوْقَ ثَلَاثَةٍ أُلُوفاً؛ ذَكَرُوا',sec:null},
{n:29,h1:'وَخُذْ زِيَادَةَ الصَّحِيحِ إِذْ تُنَصّْ',h2:'صِحَّتُهُ، أَوْ مِنْ مُصَنَّفٍ يُخَصّْ',sec:'الصحيح الزائد على الصحيحين'},
{n:30,h1:'بِجَمْعِهِ؛ نَحْوُ «ابْنِ حِبَّانَ» الزَّكِي',h2:'وَ «ابْنِ خُزَيْمَةَ»، وَكَـ «الْمُسْتَدْرَكِ»',sec:null},
{n:31,h1:'عَلَى تَسَاهُلٍ، وَقَالَ: مَا انْفَرَدْ',h2:'بِهِ فَذَاكَ حَسَنٌ مَا لَمْ يُرَدّْ',sec:null},
{n:32,h1:'بِعِلَّةٍ، وَالْحَقُّ: أنْ يُحْكَمْ بِمَا',h2:'يَلِيقُ، وَالْبُسْتِيْ يُدَانِي الْحَاكِمَا',sec:null},
{n:33,h1:'وَاسْتَخْرَجُوا عَلَى الصَّحِيحِ؛ كَـ «أَبِي',h2:'عَوَانَةٍ» وَنَحْوِهِ، وَاجْتَنِبِ',sec:'المستخرجات'},
{n:34,h1:'عَزْوَكَ أَلْفَاظَ الْمُتُونِ لَهُمَا',h2:'إِذْ خَالَفَتْ لَفْظاً، وَمَعْنىً رُبَّمَا',sec:null},
{n:35,h1:'وَمَا تَزِيدُ فَاحْكُمَنْ بِصِحَّتِهْ',h2:'فَهْوَ مَعَ الْعُلُوِّ مِنْ فَائِدَتِهْ',sec:null},
{n:36,h1:'وَالْأَصْلَ يَعْنِي الْبَيْهَقِيْ وَمَنْ عَزَا',h2:'وَلَيْتَ إِذْ زَادَ الْحُمَيْدِي مَيّزَا',sec:null},
{n:37,h1:'وَأَرْفَعُ الصَّحِيحِ «مَرْوِيُّهُمَا»',h2:'ثُمَّ «الْبُخَارِيِّ»، فَـ «مُسْلِمٍ»، فَـ «مَا',sec:'مراتب الصحيح'},
{n:38,h1:'شَرْطَهُمَا حَوَى»، فَـ «شَرْطَ الْجُعْفِي»',h2:'فَـ «مُسْلِمٍ»، فَـ «شَرْطَ غَيْرٍ» يَكْفِي',sec:null},
{n:39,h1:'وَعِنْدَهُ التَّصْحِيحُ لَيْسَ يُمْكِنُ',h2:'فِي عَصْرِنَا، وَقَالَ يَحْيَى: مُمْكِنُ',sec:null},
{n:40,h1:'وَاقْطَعْ بِصِحَّةٍ لِمَا قَدْ أَسْنَدَا',h2:'كَذَا لَهُ، وَقِيلَ: ظَنّاً، وَلَدَى',sec:'حكم الصحيحين والتعليق'},
{n:41,h1:'مُحَقِّقِيهِمْ قَدْ عَزَاهُ النَّوَوِي',h2:'وَفِي الصَّحِيحِ بَعْضُ شَيْءٍ قَدْ رُوِي',sec:null},
{n:42,h1:'مُضَعَّفٌ، وَلَهُمَا بِلَا سَنَدْ',h2:'أَشْيَا، فَإِنْ يُجْزَمْ فَصَحِّحْ، أَوْ وَرَدْ',sec:null},
{n:43,h1:'مُمَرَّضاً فَلَا، وَلَكِنْ يُشْعِرُ',h2:'بِصِحَّةِ الْأَصْلِ لَهُ؛ كَـ «يُذْكَرُ»',sec:null},
{n:44,h1:'وَإِنْ يَكُنْ أَوَّلُ الِاسْنَادِ حُذِفْ',h2:'مَعْ صِيغَةِ الْجَزْمِ فَـ «تَعْلِيقاً» عُرِفْ',sec:null},
{n:45,h1:'وَلَوْ إِلَى آخِرِهِ، أَمَّا الَّذِي',h2:'لِشَيْخِهِ عَزَا بِـ «قَالَ» فَكَذِي',sec:null},
{n:46,h1:'عَنْعَنَةٍ؛ كَخَبَرِ الْمَعَازِفِ',h2:'لَا تَصْغَ لِابْنِ حَزْمٍ الْمُخَالِفِ',sec:null},
{n:50,h1:'وَ «الْحَسَنُ»: الْمَعْرُوفُ مَخْرَجاً وَقَدْ',h2:'اشْتَهَرَتْ رِجَالُهُ، بِذَاكَ حَدّْ',sec:'القسم الثاني: الحسن'},
{n:51,h1:'حَمْدٌ، وَقَالَ التِّرمِذِيُّ: مَا سَلِمْ',h2:'مِنَ الشُّذُوذِ مَعَ رَاوٍ مَا اتُّهِمْ',sec:null},
{n:52,h1:'بِكَذِبٍ، وَلَمْ يَكُنْ فَرْداً وَرَدْ',h2:'قُلْتُ: وَقَدْ حَسَّنَ بَعْضَ مَا انْفَرَدْ',sec:null},
{n:53,h1:'وَقِيلَ: مَا ضَعْفٌ قَرِيبٌ مُحْتَمَلْ',h2:'فِيهِ، وَمَا بِكُلّ ذَا حَدٌّ حَصَلْ',sec:null},
{n:54,h1:'وَقَالَ: بَانَ لِي بِإِمْعَانِ النَّظَرْ',h2:'أَنَّ لَهُ قِسْمَيْنِ، كُلٌّ قَدْ ذُكِرْ',sec:null},
{n:55,h1:'قِسْماً، وَزَادَ كَوْنَهُ مَا عُلِّلَا',h2:'وَلَا بِنُكْرٍ أَوْ شُذُوذٍ شُمِلَا',sec:null},
{n:56,h1:'وَالْفُقَهَاءُ كُلُّهُمْ تَسْتَعْمِلُهْ',h2:'وَالْعُلَمَاءُ الْجُلُّ مِنْهُمْ يَقْبَلُهْ',sec:null},
{n:57,h1:'وَهْوَ بِأَقْسَامِ الصَّحِيحِ مُلْحَقُ',h2:'حُجِّيَّةً، وَإِنْ يَكُنْ لَا يَلْحَقُ',sec:null},
{n:58,h1:'فَإِنْ يُقَلْ: يُحْتَجُّ بِالضَّعِيفِ',h2:'فَقُلْ: إِذَا كَانَ مِنَ الْمَوْصُوفِ',sec:null},
{n:59,h1:'رُوَاتُهُ بِسُوءِ حِفْظٍ يُجْبَرُ',h2:'بِكَوْنِهِ مِنْ غَيْرِ وَجْهٍ يُذْكَرُ',sec:null},
{n:60,h1:'وَإِنْ يَكُنْ لِكَذِبٍ أَوْ شَذَّا',h2:'أَوْ قَوِيَ الضَّعْفُ فَلَمْ يُجْبَرْ ذَا',sec:null},
{n:61,h1:'أَلَا تَرَى الْمُرْسَلَ حَيْثُ أُسْنِدَا',h2:'أَوْ أَرْسَلُوا - كَمَا يَجِيءُ - اعْتَضَدَا',sec:null},
{n:62,h1:'وَالْحَسَنُ الْمَشْهُورُ بِالْعَدَالَهْ',h2:'وَالصِّدْقِ رَاوِيهِ إِذَا أَتَى لَهْ',sec:null},
{n:63,h1:'طُرُقٌ اخْرَى نَحْوُهَا مِنَ الطُّرُقْ',h2:'صَحَّحْتَهُ؛ كَمَتْنِ: «لَوْلَا أَنْ أَشُقّْ»',sec:null},
{n:64,h1:'إِذْ تَابَعُوا مُحَمَّدَ بْنَ عَمْرِو',h2:'عَلَيْهِ فَارْتَقَى الصَّحِيحَ يَجْرِي',sec:null},
{n:65,h1:'قَالَ: وَمِنْ مَظِنَّةٍ لِلْحَسَنِ',h2:'جَمْعُ أَبِي دَاوُدَ؛ أَيْ فِي السُّنَنِ',sec:null},
{n:66,h1:'فَإِنَّهُ قَالَ: ذَكَرْتُ فِيهِ',h2:'مَا صَحَّ أَوْ قَارَبَ أَوْ يَحْكِيهِ',sec:null},
{n:67,h1:'وَمَا بِهِ وَهْنٌ شَدِيدٌ قُلْتُهُ',h2:'وَحَيْثُ لَا فَصَالِحٌ خَرَّجْتُهُ',sec:null},
{n:68,h1:'فَمَا بِهِ وَلَمْ يُصَحَّحْ وَسَكَتْ',h2:'عَلَيْهِ؛ عِنْدَهُ لَهُ الْحُسْنُ ثَبَتْ',sec:null},
{n:69,h1:'وَابْنُ رُشَيْدٍ قَالَ - وَهْوَ مُتَّجِهْ -:',h2:'قَدْ يَبْلُغُ الصِّحَّةَ عِنْدَ مُخْرِجِهْ',sec:null},
{n:70,h1:'وَلِلْإِمَامِ الْيَعْمُرِيِّ: إِنَّمَا',h2:'قَوْلُ أَبِي دَاوُدَ يَحْكِي مُسْلِمَا',sec:null},
{n:71,h1:'حَيْثُ يَقُولُ: جُمْلَةُ الصَّحِيحِ لَا',h2:'تُوجَدُ عِنْدَ مَالِكٍ وَالنُّبَلَا',sec:null},
{n:72,h1:'فَاحْتَاجَ أَنْ يَنْزِلَ فِي الْإِسْنَادِ',h2:'إِلَى يَزِيدَ بْنِ أَبِي زِيَادِ',sec:null},
{n:73,h1:'وَنَحْوِهِ، وَإِنْ يَكُنْ ذُو السَّبْقِ',h2:'قَدْ فَاتَهُ أَدْرَكَ بِاسْمِ الصِّدْقِ',sec:null},
{n:74,h1:'هَلَّا قَضَى عَلَى كِتَابِ مُسْلِمِ',h2:'بِمَا قَضَى عَلَيْهِ بِالتَّحَكُّمِ',sec:null},
{n:75,h1:'وَالْبَغَوِيْ إِذْ قَسَّمَ «الْمَصَابِحَا»',h2:'إِلَى الصِّحَاحِ وَالْحِسَانِ جَانِحَا',sec:null},
{n:76,h1:'أَنَّ الْحِسَانَ مَا رَوَوْهُ فِي السُّنَنْ',h2:'رُدَّ عَلَيْهِ؛ إِذْ بِهَا غَيْرُ الْحَسَنْ',sec:null},
{n:77,h1:'كَانَ أَبُو دَاوُدَ أَقْوَى مَا وُجِدْ',h2:'يَرْوِيهِ، وَالضَّعِيفَ حَيْثُ لَا يَجِدْ',sec:null},
{n:78,h1:'فِي الْبَابِ غَيْرَهُ؛ فَذَاكَ عِنْدَهْ',h2:'مِنْ رَأْيٍ اقْوَى؛ قَالَهُ ابْنُ مَنْدَهْ',sec:null},
{n:79,h1:'وَالنَّسَئِيْ يُخْرِجُ مَنْ لَمْ يُجْمِعُوا',h2:'عَلَيْهِ تَرْكاً؛ مَذْهَبٌ مُتَّسِعُ',sec:null},
{n:80,h1:'وَمَنْ عَلَيْهَا أَطْلَقَ الصَّحِيحَا',h2:'فَقَدْ أَتَى تَسَاهُلاً صَرِيحَا',sec:null},
{n:81,h1:'وَدُونَهَا فِي رُتْبَةٍ: مَا جُعِلَا',h2:'عَلَى الْمَسَانِيدِ، فَيُدْعَى الْجَفَلَى',sec:null},
{n:82,h1:'كَـ «مُسْنَدِ الطَّيَالِسِي» وَ «أَحْمَدَا»',h2:'وَعَدُّهُ لِـ «الدَّارِمِيِّ» انْتُقِدَا',sec:null},
{n:83,h1:'وَالْحُكْمَ لِلْإِسْنَادِ بِالصِّحَّةِ أَوْ',h2:'بِالْحُسْنِ دُونَ الْحُكْمِ لِلْمَتْنِ رَأَوْا',sec:null},
{n:84,h1:'وَاقْبَلْهُ إِنْ أَطْلَقَهُ مَنْ يُعْتَمَدْ',h2:'وَلَمْ يُعَقِّبْهُ بِضَعْفٍ يُنْتَقَدْ',sec:null},
{n:85,h1:'وَاسْتُشْكِلَ الْحُسْنُ مَعَ الصِّحَّةِ فِي',h2:'مَتْنٍ، فَإِنْ لَفْظاً يُرِدْ فَقُلْ: صِفِ',sec:null},
{n:86,h1:'بِهِ الضَّعِيفَ، أَوْ يُرِدْ مَا يَخْتَلِفْ',h2:'سَنَدُهُ، فَكَيْفَ إِنْ فَرْدٌ وُصِفْ',sec:null},
{n:87,h1:'وَلِأَبِي الْفَتْحِ فِي «الِاقْتِرَاحِ»: أَنَّ',h2:'انْفِرَادَ الْحُسْنِ ذُو اصْطِلَاحِ',sec:null},
{n:88,h1:'وَإِنْ يَكُنْ صَحَّ فَلَيْسَ يَلْتَبِسْ',h2:'كُلُّ صَحِيحٍ حَسَنٌ لَا يَنْعَكِسْ',sec:null},
{n:89,h1:'وَأَوْرَدُوا مَا صَحَّ مِنْ أَفْرَادِ',h2:'حَيْثُ اشْتَرَطْنَا غَيْرَ مَا إِسْنَادِ',sec:null}
];

{n:799,h1:'الْحَجَّ أَرْبَعُونَ أَلْفاً، وَقُبِضْ',h2:'عَنْ ذَيْنِ مَعْ أَرْبَعِ آلَافٍ تَنِضّْ',sec:null},

{n:818,h1:'وَهُمْ طِبَاقٌ؛ قِيلَ: خَمْسَ عَشِرَهْ',h2:'أَوَّلُهُمْ: رُوَاةُ كُلِّ الْعَشَرَهْ',sec:null},
{n:819,h1:'وَقَيْسٌ الْفَرْدُ بِهَذَا الْوَصْفِ',h2:'وَقِيلَ: لَمْ يَسْمَعْ مِنِ ابْنِ عَوْفِ',sec:null},

{n:824,h1:'وَفِي الْكِبَارِ: الْفُقَهَاءُ السَّبْعَةُ',h2:'خَارِجَةُ، الْقَاسِمُ، ثُمَّ عُرْوَةُ',sec:null},
{n:825,h1:'ثُمَّ سُلَيْمَانُ، عُبَيْدُ اللَّهِ',h2:'سَعِيدُ، وَالسَّابِعُ ذُو اشْتِبَاهِ',sec:null},

{n:829,h1:'الْحَمْلَ عَنْهُمْ كَأَبِي الزِّنَادِ',h2:'وَالْعَكْسُ جَاءَ؛ وَهْوَ ذُو فَسَادِ',sec:null},

{n:866,h1:'نَحْوُ أَبِي بَكْرِ بْنِ حَزْمٍ قَدْ كُنِي',h2:'أَبَا مُحَمَّدٍ بِخُلْفٍ فَافْطُنِ',sec:null},

{n:870,h1:'ثُمَّ ذَوُو الْخُلْفِ كُنىً وَعُلِمَا',h2:'أَسْمَاؤُهُمْ، وَعَكْسُهُ، وَفِيهِمَا',sec:null},

{n:873,h1:'نَحْوُ الضَّعِيفِ أَيْ: بِجِسْمِهِ، وَمَنْ',h2:'ضَلَّ الطَّرِيقَ بِاسْمِ فَاعِلٍ، وَلَنْ',sec:null},

'2:203':'وَٱذْكُرُوا۟ ٱللَّهَ فِىٓ أَيَّامٍۢ مَّعْدُودَٰتٍۢ ۚ فَمَن تَعَجَّلَ فِى يَوْمَيْنِ فَلَآ إِثْمَ عَلَيْهِ وَمَن تَأَخَّرَ فَلَآ إِثْمَ عَلَيْهِ ۚ لِمَنِ ٱتَّقَىٰ ۗ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُمْ إِلَيْهِ تُحْشَرُونَ',
'2:204':'وَمِنَ ٱلنَّاسِ مَن يُعْجِبُكَ قَوْلُهُۥ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا وَيُشْهِدُ ٱللَّهَ عَلَىٰ مَا فِى قَلْبِهِۦ وَهُوَ أَلَدُّ ٱلْخِصَامِ',
'2:205':'وَإِذَا تَوَلَّىٰ سَعَىٰ فِى ٱلْأَرْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ ٱلْحَرْثَ وَٱلنَّسْلَ ۗ وَٱللَّهُ لَا يُحِبُّ ٱلْفَسَادَ',
'2:206':'وَإِذَا قِيلَ لَهُ ٱتَّقِ ٱللَّهَ أَخَذَتْهُ ٱلْعِزَّةُ بِٱلْإِثْمِ ۚ فَحَسْبُهُۥ جَهَنَّمُ ۚ وَلَبِئْسَ ٱلْمِهَادُ',
'2:207':'وَمِنَ ٱلنَّاسِ مَن يَشْرِى نَفْسَهُ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ ۗ وَٱللَّهُ رَءُوفٌۢ بِٱلْعِبَادِ',
'2:208':'يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱدْخُلُوا۟ فِى ٱلسِّلْمِ كَآفَّةًۭ وَلَا تَتَّبِعُوا۟ خُطُوَٰتِ ٱلشَّيْطَٰنِ ۚ إِنَّهُۥ لَكُمْ عَدُوٌّۭ مُّبِينٌۭ',
'2:209':'فَإِن زَلَلْتُم مِّنۢ بَعْدِ مَا جَآءَتْكُمُ ٱلْبَيِّنَٰتُ فَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌ',
'2:210':'هَلْ يَنظُرُونَ إِلَّآ أَن يَأْتِيَهُمُ ٱللَّهُ فِى ظُلَلٍۢ مِّنَ ٱلْغَمَامِ وَٱلْمَلَٰٓئِكَةُ وَقُضِىَ ٱلْأَمْرُ ۚ وَإِلَى ٱللَّهِ تُرْجَعُ ٱلْأُمُورُ',
'2:211':'سَلْ بَنِىٓ إِسْرَٰٓءِيلَ كَمْ ءَاتَيْنَٰهُم مِّنْ ءَايَةٍۭ بَيِّنَةٍۢ ۗ وَمَن يُبَدِّلْ نِعْمَةَ ٱللَّهِ مِنۢ بَعْدِ مَا جَآءَتْهُ فَإِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ',
'2:212':'زُيِّنَ لِلَّذِينَ كَفَرُوا۟ ٱلْحَيَوٰةُ ٱلدُّنْيَا وَيَسْخَرُونَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ ۘ وَٱلَّذِينَ ٱتَّقَوْا۟ فَوْقَهُمْ يَوْمَ ٱلْقِيَٰمَةِ ۗ وَٱللَّهُ يَرْزُقُ مَن يَشَآءُ بِغَيْرِ حِسَابٍۢ',
'2:213':'كَانَ ٱلنَّاسُ أُمَّةًۭ وَٰحِدَةًۭ فَبَعَثَ ٱللَّهُ ٱلنَّبِيِّۦنَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ ٱلْكِتَٰبَ بِٱلْحَقِّ لِيَحْكُمَ بَيْنَ ٱلنَّاسِ فِيمَا ٱخْتَلَفُوا۟ فِيهِ ۚ وَمَا ٱخْتَلَفَ فِيهِ إِلَّا ٱلَّذِينَ أُوتُوهُ مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ بَغْيًۢا بَيْنَهُمْ ۖ فَهَدَى ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ لِمَا ٱخْتَلَفُوا۟ فِيهِ مِنَ ٱلْحَقِّ بِإِذْنِهِۦ ۗ وَٱللَّهُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍ',
'2:214':'أَمْ حَسِبْتُمْ أَن تَدْخُلُوا۟ ٱلْجَنَّةَ وَلَمَّا يَأْتِكُم مَّثَلُ ٱلَّذِينَ خَلَوْا۟ مِن قَبْلِكُم ۖ مَّسَّتْهُمُ ٱلْبَأْسَآءُ وَٱلضَّرَّآءُ وَزُلْزِلُوا۟ حَتَّىٰ يَقُولَ ٱلرَّسُولُ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ مَتَىٰ نَصْرُ ٱللَّهِ ۗ أَلَآ إِنَّ نَصْرَ ٱللَّهِ قَرِيبٌۭ',
'2:215':'يَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ ۖ قُلْ مَآ أَنفَقْتُم مِّنْ خَيْرٍۢ فَلِلْوَٰلِدَيْنِ وَٱلْأَقْرَبِينَ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ ۗ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍۢ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌۭ',
'2:216':'كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ وَهُوَ كُرْهٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تَكْرَهُوا۟ شَيْـًۭٔا وَهُوَ خَيْرٌۭ لَّكُمْ ۖ وَعَسَىٰٓ أَن تُحِبُّوا۟ شَيْـًۭٔا وَهُوَ شَرٌّۭ لَّكُمْ ۗ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ',
'2:217':'يَسْـَٔلُونَكَ عَنِ ٱلشَّهْرِ ٱلْحَرَامِ قِتَالٍۢ فِيهِ ۖ قُلْ قِتَالٌۭ فِيهِ كَبِيرٌۭ ۖ وَصَدٌّ عَن سَبِيلِ ٱللَّهِ وَكُفْرٌۢ بِهِۦ وَٱلْمَسْجِدِ ٱلْحَرَامِ وَإِخْرَاجُ أَهْلِهِۦ مِنْهُ أَكْبَرُ عِندَ ٱللَّهِ ۚ وَٱلْفِتْنَةُ أَكْبَرُ مِنَ ٱلْقَتْلِ ۗ وَلَا يَزَالُونَ يُقَٰتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَن دِينِكُمْ إِنِ ٱسْتَطَٰعُوا۟ ۚ وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَيَمُتْ وَهُوَ كَافِرٌۭ فَأُو۟لَٰٓئِكَ حَبِطَتْ أَعْمَٰلُهُمْ فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۖ وَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ',
'2:218':'إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَٱلَّذِينَ هَاجَرُوا۟ وَجَٰهَدُوا۟ فِى سَبِيلِ ٱللَّهِ أُو۟لَٰٓئِكَ يَرْجُونَ رَحْمَتَ ٱللَّهِ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ',
'2:219':'يَسْـَٔلُونَكَ عَنِ ٱلْخَمْرِ وَٱلْمَيْسِرِ ۖ قُلْ فِيهِمَآ إِثْمٌۭ كَبِيرٌۭ وَمَنَٰفِعُ لِلنَّاسِ وَإِثْمُهُمَآ أَكْبَرُ مِن نَّفْعِهِمَا ۗ وَيَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلِ ٱلْعَفْوَ ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْءَايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ',
'2:220':'فِى ٱلدُّنْيَا وَٱلْءَاخِرَةِ ۗ وَيَسْـَٔلُونَكَ عَنِ ٱلْيَتَٰمَىٰ ۖ قُلْ إِصْلَاحٌۭ لَّهُمْ خَيْرٌۭ ۖ وَإِن تُخَالِطُوهُمْ فَإِخْوَٰنُكُمْ ۚ وَٱللَّهُ يَعْلَمُ ٱلْمُفْسِدَ مِنَ ٱلْمُصْلِحِ ۚ وَلَوْ شَآءَ ٱللَّهُ لَأَعْنَتَكُمْ ۚ إِنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌۭ',
'2:221':'وَلَا تَنكِحُوا۟ ٱلْمُشْرِكَٰتِ حَتَّىٰ يُؤْمِنَّ ۚ وَلَأَمَةٌۭ مُّؤْمِنَةٌ خَيْرٌۭ مِّن مُّشْرِكَةٍۢ وَلَوْ أَعْجَبَتْكُمْ ۗ وَلَا تُنكِحُوا۟ ٱلْمُشْرِكِينَ حَتَّىٰ يُؤْمِنُوا۟ ۚ وَلَعَبْدٌۭ مُّؤْمِنٌ خَيْرٌۭ مِّن مُّشْرِكٍۢ وَلَوْ أَعْجَبَكُمْ ۗ أُو۟لَٰٓئِكَ يَدْعُونَ إِلَى ٱلنَّارِ ۖ وَٱللَّهُ يَدْعُوٓا۟ إِلَى ٱلْجَنَّةِ وَٱلْمَغْفِرَةِ بِإِذْنِهِۦ ۖ وَيُبَيِّنُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَ',
'2:222':'وَيَسْـَٔلُونَكَ عَنِ ٱلْمَحِيضِ ۖ قُلْ هُوَ أَذًۭى فَٱعْتَزِلُوا۟ ٱلنِّسَآءَ فِى ٱلْمَحِيضِ ۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَ ۖ فَإِذَا تَطَهَّرْنَ فَأْتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ ٱللَّهُ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلتَّوَّٰبِينَ وَيُحِبُّ ٱلْمُتَطَهِّرِينَ',
'2:223':'نِسَآؤُكُمْ حَرْثٌۭ لَّكُمْ فَأْتُوا۟ حَرْثَكُمْ أَنَّىٰ شِئْتُمْ ۖ وَقَدِّمُوا۟ لِأَنفُسِكُمْ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّكُم مُّلَٰقُوهُ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ',
'2:224':'وَلَا تَجْعَلُوا۟ ٱللَّهَ عُرْضَةًۭ لِّأَيْمَٰنِكُمْ أَن تَبَرُّوا۟ وَتَتَّقُوا۟ وَتُصْلِحُوا۟ بَيْنَ ٱلنَّاسِ ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌۭ',
'2:225':'لَّا يُؤَاخِذُكُمُ ٱللَّهُ بِٱللَّغْوِ فِىٓ أَيْمَٰنِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا كَسَبَتْ قُلُوبُكُمْ ۗ وَٱللَّهُ غَفُورٌ حَلِيمٌۭ',
'2:226':'لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ',
'2:227':'وَإِنْ عَزَمُوا۟ ٱلطَّلَٰقَ فَإِنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌۭ',
'2:228':'وَٱلْمُطَلَّقَٰتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَٰثَةَ قُرُوٓءٍۢ ۚ وَلَا يَحِلُّ لَهُنَّ أَن يَكْتُمْنَ مَا خَلَقَ ٱللَّهُ فِىٓ أَرْحَامِهِنَّ إِن كُنَّ يُؤْمِنَّ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۚ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِى ذَٰلِكَ إِنْ أَرَادُوٓا۟ إِصْلَٰحًۭا ۚ وَلَهُنَّ مِثْلُ ٱلَّذِى عَلَيْهِنَّ بِٱلْمَعْرُوفِ ۚ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٌۭ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌ',
'2:229':'ٱلطَّلَٰقُ مَرَّتَانِ ۖ فَإِمْسَاكٌۢ بِمَعْرُوفٍ أَوْ تَسْرِيحٌۢ بِإِحْسَٰنٍۢ ۗ وَلَا يَحِلُّ لَكُمْ أَن تَأْخُذُوا۟ مِمَّآ ءَاتَيْتُمُوهُنَّ شَيْـًٔا إِلَّآ أَن يَخَافَآ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ ۖ فَإِنْ خِفْتُمْ أَلَّا يُقِيمَا حُدُودَ ٱللَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا ٱفْتَدَتْ بِهِۦ ۗ تِلْكَ حُدُودُ ٱللَّهِ فَلَا تَعْتَدُوهَا ۚ وَمَن يَتَعَدَّ حُدُودَ ٱللَّهِ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ',
'2:230':'فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ ۗ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَآ أَن يَتَرَاجَعَآ إِن ظَنَّآ أَن يُقِيمَا حُدُودَ ٱللَّهِ ۗ وَتِلْكَ حُدُودُ ٱللَّهِ يُبَيِّنُهَا لِقَوْمٍۢ يَعْلَمُونَ',
'2:231':'وَإِذَا طَلَّقْتُمُ ٱلنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ أَوْ سَرِّحُوهُنَّ بِمَعْرُوفٍۢ ۚ وَلَا تُمْسِكُوهُنَّ ضِرَارًۭا لِّتَعْتَدُوا۟ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَقَدْ ظَلَمَ نَفْسَهُۥ ۚ وَلَا تَتَّخِذُوٓا۟ ءَايَٰتِ ٱللَّهِ هُزُوًۭا ۚ وَٱذْكُرُوا۟ نِعْمَتَ ٱللَّهِ عَلَيْكُمْ وَمَآ أَنزَلَ عَلَيْكُم مِّنَ ٱلْكِتَٰبِ وَٱلْحِكْمَةِ يَعِظُكُم بِهِۦ ۚ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ بِكُلِّ شَىْءٍ عَلِيمٌۭ',
'2:232':'وَإِذَا طَلَّقْتُمُ ٱلنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَلَا تَعْضُلُوهُنَّ أَن يَنكِحْنَ أَزْوَٰجَهُنَّ إِذَا تَرَٰضَوْا۟ بَيْنَهُم بِٱلْمَعْرُوفِ ۗ ذَٰلِكَ يُوعَظُ بِهِۦ مَن كَانَ مِنكُمْ يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۗ ذَٰلِكُمْ أَزْكَىٰ لَكُمْ وَأَطْهَرُ ۗ وَٱللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ',
'2:233':'وَٱلْوَٰلِدَٰتُ يُرْضِعْنَ أَوْلَٰدَهُنَّ حَوْلَيْنِ كَامِلَيْنِ ۖ لِمَنْ أَرَادَ أَن يُتِمَّ ٱلرَّضَاعَةَ ۚ وَعَلَى ٱلْمَوْلُودِ لَهُۥ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِٱلْمَعْرُوفِ ۚ لَا تُكَلَّفُ نَفْسٌ إِلَّا وُسْعَهَا ۚ لَا تُضَآرَّ وَٰلِدَةٌۢ بِوَلَدِهَا وَلَا مَوْلُودٌۭ لَّهُۥ بِوَلَدِهِۦ ۚ وَعَلَى ٱلْوَارِثِ مِثْلُ ذَٰلِكَ ۗ فَإِنْ أَرَادَا فِصَالًا عَن تَرَاضٍۢ مِّنْهُمَا وَتَشَاوُرٍۢ فَلَا جُنَاحَ عَلَيْهِمَا ۗ وَإِنْ أَرَدتُّمْ أَن تَسْتَرْضِعُوٓا۟ أَوْلَٰدَكُمْ فَلَا جُنَاحَ عَلَيْكُمْ إِذَا سَلَّمْتُم مَّآ ءَاتَيْتُم بِٱلْمَعْرُوفِ ۗ وَٱتَّقُوا۟ ٱللَّهَ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌۭ',
'2:234':'وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٍۢ وَعَشْرًۭا ۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ بِٱلْمَعْرُوفِ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ',
'2:235':'وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُم بِهِۦ مِنْ خِطْبَةِ ٱلنِّسَآءِ أَوْ أَكْنَنتُمْ فِىٓ أَنفُسِكُمْ ۚ عَلِمَ ٱللَّهُ أَنَّكُمْ سَتَذْكُرُونَهُنَّ وَلَٰكِن لَّا تُوَاعِدُوهُنَّ سِرًّا إِلَّآ أَن تَقُولُوا۟ قَوْلًۭا مَّعْرُوفًۭا ۚ وَلَا تَعْزِمُوا۟ عُقْدَةَ ٱلنِّكَاحِ حَتَّىٰ يَبْلُغَ ٱلْكِتَٰبُ أَجَلَهُۥ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ يَعْلَمُ مَا فِىٓ أَنفُسِكُمْ فَٱحْذَرُوهُ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَفُورٌ حَلِيمٌۭ',
'2:236':'لَّا جُنَاحَ عَلَيْكُمْ إِن طَلَّقْتُمُ ٱلنِّسَآءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُوا۟ لَهُنَّ فَرِيضَةًۭ ۚ وَمَتِّعُوهُنَّ عَلَى ٱلْمُوسِعِ قَدَرُهُۥ وَعَلَى ٱلْمُقْتِرِ قَدَرُهُۥ مَتَٰعًۢا بِٱلْمَعْرُوفِ ۖ حَقًّا عَلَى ٱلْمُحْسِنِينَ',
'2:237':'وَإِن طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةًۭ فَنِصْفُ مَا فَرَضْتُمْ إِلَّآ أَن يَعْفُونَ أَوْ يَعْفُوَا۟ ٱلَّذِى بِيَدِهِۦ عُقْدَةُ ٱلنِّكَاحِ ۚ وَأَن تَعْفُوٓا۟ أَقْرَبُ لِلتَّقْوَىٰ ۚ وَلَا تَنسَوُا۟ ٱلْفَضْلَ بَيْنَكُمْ ۚ إِنَّ ٱللَّهَ بِمَا تَعْمَلُونَ بَصِيرٌ',
'2:238':'حَٰفِظُوا۟ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ وَقُومُوا۟ لِلَّهِ قَٰنِتِينَ',
'2:239':'فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًۭا ۖ فَإِذَآ أَمِنتُمْ فَٱذْكُرُوا۟ ٱللَّهَ كَمَا عَلَّمَكُم مَّا لَمْ تَكُونُوا۟ تَعْلَمُونَ',
'2:240':'وَٱلَّذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجًۭا وَصِيَّةًۭ لِّأَزْوَٰجِهِم مَّتَٰعًا إِلَى ٱلْحَوْلِ غَيْرَ إِخْرَاجٍۢ ۚ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِى مَا فَعَلْنَ فِىٓ أَنفُسِهِنَّ مِن مَّعْرُوفٍۢ ۗ وَٱللَّهُ عَزِيزٌ حَكِيمٌۭ',
'2:241':'وَلِلْمُطَلَّقَٰتِ مَتَٰعٌۢ بِٱلْمَعْرُوفِ ۖ حَقًّا عَلَى ٱلْمُتَّقِينَ',
'2:242':'كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمْ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَ',
'2:243':'أَلَمْ تَرَ إِلَى ٱلَّذِينَ خَرَجُوا۟ مِن دِيَٰرِهِمْ وَهُمْ أُلُوفٌ حَذَرَ ٱلْمَوْتِ فَقَالَ لَهُمُ ٱللَّهُ مُوتُوا۟ ثُمَّ أَحْيَٰهُمْ ۚ إِنَّ ٱللَّهَ لَذُو فَضْلٍ عَلَى ٱلنَّاسِ وَلَٰكِنَّ أَكْثَرَ ٱلنَّاسِ لَا يَشْكُرُونَ',
'2:244':'وَقَٰتِلُوا۟ فِى سَبِيلِ ٱللَّهِ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ سَمِيعٌ عَلِيمٌۭ',
'2:245':'مَّن ذَا ٱلَّذِى يُقْرِضُ ٱللَّهَ قَرْضًا حَسَنًۭا فَيُضَٰعِفَهُۥ لَهُۥٓ أَضْعَافًۭا كَثِيرَةًۭ ۚ وَٱللَّهُ يَقْبِضُ وَيَبْصُۜطُ وَإِلَيْهِ تُرْجَعُونَ',
'2:246':'أَلَمْ تَرَ إِلَى ٱلْمَلَإِ مِنۢ بَنِىٓ إِسْرَٰٓءِيلَ مِنۢ بَعْدِ مُوسَىٰٓ إِذْ قَالُوا۟ لِنَبِىٍّۢ لَّهُمُ ٱبْعَثْ لَنَا مَلِكًۭا نُّقَٰتِلْ فِى سَبِيلِ ٱللَّهِ ۖ قَالَ هَلْ عَسَيْتُمْ إِن كُتِبَ عَلَيْكُمُ ٱلْقِتَالُ أَلَّا تُقَٰتِلُوا۟ ۖ قَالُوا۟ وَمَا لَنَآ أَلَّا نُقَٰتِلَ فِى سَبِيلِ ٱللَّهِ وَقَدْ أُخْرِجْنَا مِن دِيَٰرِنَا وَأَبْنَآئِنَا ۖ فَلَمَّا كُتِبَ عَلَيْهِمُ ٱلْقِتَالُ تَوَلَّوْا۟ إِلَّا قَلِيلًۭا مِّنْهُمْ ۗ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّٰلِمِينَ',
'2:247':'وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ ٱللَّهَ قَدْ بَعَثَ لَكُمْ طَالُوتَ مَلِكًۭا ۚ قَالُوٓا۟ أَنَّىٰ يَكُونُ لَهُ ٱلْمُلْكُ عَلَيْنَا وَنَحْنُ أَحَقُّ بِٱلْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ سَعَةًۭ مِّنَ ٱلْمَالِ ۚ قَالَ إِنَّ ٱللَّهَ ٱصْطَفَىٰهُ عَلَيْكُمْ وَزَادَهُۥ بَسْطَةًۭ فِى ٱلْعِلْمِ وَٱلْجِسْمِ ۖ وَٱللَّهُ يُؤْتِى مُلْكَهُۥ مَن يَشَآءُ ۚ وَٱللَّهُ وَٰسِعٌ عَلِيمٌۭ',
'2:248':'وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ ءَايَةَ مُلْكِهِۦٓ أَن يَأْتِيَكُمُ ٱلتَّابُوتُ فِيهِ سَكِينَةٌۭ مِّن رَّبِّكُمْ وَبَقِيَّةٌۭ مِّمَّا تَرَكَ ءَالُ مُوسَىٰ وَءَالُ هَٰرُونَ تَحْمِلُهُ ٱلْمَلَٰٓئِكَةُ ۚ إِنَّ فِى ذَٰلِكَ لَءَايَةًۭ لَّكُمْ إِن كُنتُم مُّؤْمِنِينَ',
'2:249':'فَلَمَّا فَصَلَ طَالُوتُ بِٱلْجُنُودِ قَالَ إِنَّ ٱللَّهَ مُبْتَلِيكُم بِنَهَرٍۢ فَمَن شَرِبَ مِنْهُ فَلَيْسَ مِنِّى وَمَن لَّمْ يَطْعَمْهُ فَإِنَّهُۥ مِنِّىٓ إِلَّا مَنِ ٱغْتَرَفَ غُرْفَةًۢ بِيَدِهِۦ ۚ فَشَرِبُوا۟ مِنْهُ إِلَّا قَلِيلًۭا مِّنْهُمْ ۚ فَلَمَّا جَاوَزَهُۥ هُوَ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ قَالُوا۟ لَا طَاقَةَ لَنَا ٱلْيَوْمَ بِجَالُوتَ وَجُنُودِهِۦ ۚ قَالَ ٱلَّذِينَ يَظُنُّونَ أَنَّهُم مُّلَٰقُوا۟ ٱللَّهِ كَم مِّن فِئَةٍۢ قَلِيلَةٍ غَلَبَتْ فِئَةًۭ كَثِيرَةًۢ بِإِذْنِ ٱللَّهِ ۗ وَٱللَّهُ مَعَ ٱلصَّٰبِرِينَ',
'2:250':'وَلَمَّا بَرَزُوا۟ لِجَالُوتَ وَجُنُودِهِۦ قَالُوا۟ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْرًۭا وَثَبِّتْ أَقْدَامَنَا وَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ',
'2:251':'فَهَزَمُوهُم بِإِذْنِ ٱللَّهِ وَقَتَلَ دَاوُۥدُ جَالُوتَ وَءَاتَىٰهُ ٱللَّهُ ٱلْمُلْكَ وَٱلْحِكْمَةَ وَعَلَّمَهُۥ مِمَّا يَشَآءُ ۗ وَلَوْلَا دَفْعُ ٱللَّهِ ٱلنَّاسَ بَعْضَهُم بِبَعْضٍۢ لَّفَسَدَتِ ٱلْأَرْضُ وَلَٰكِنَّ ٱللَّهَ ذُو فَضْلٍ عَلَى ٱلْعَٰلَمِينَ',
'2:252':'تِلْكَ ءَايَٰتُ ٱللَّهِ نَتْلُوهَا عَلَيْكَ بِٱلْحَقِّ ۚ وَإِنَّكَ لَمِنَ ٱلْمُرْسَلِينَ',
'2:253':'تِلْكَ ٱلرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍۢ ۘ مِّنْهُم مَّن كَلَّمَ ٱللَّهُ ۖ وَرَفَعَ بَعْضَهُمْ دَرَجَٰتٍۢ ۚ وَءَاتَيْنَا عِيسَى ٱبْنَ مَرْيَمَ ٱلْبَيِّنَٰتِ وَأَيَّدْنَٰهُ بِرُوحِ ٱلْقُدُسِ ۗ وَلَوْ شَآءَ ٱللَّهُ مَا ٱقْتَتَلَ ٱلَّذِينَ مِنۢ بَعْدِهِم مِّنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ وَلَٰكِنِ ٱخْتَلَفُوا۟ فَمِنْهُم مَّنْ ءَامَنَ وَمِنْهُم مَّن كَفَرَ ۚ وَلَوْ شَآءَ ٱللَّهُ مَا ٱقْتَتَلُوا۟ وَلَٰكِنَّ ٱللَّهَ يَفْعَلُ مَا يُرِيدُ',
'2:254':'يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِمَّا رَزَقْنَٰكُم مِّن قَبْلِ أَن يَأْتِىَ يَوْمٌۭ لَّا بَيْعٌۭ فِيهِ وَلَا خُلَّةٌۭ وَلَا شَفَٰعَةٌۭ ۗ وَٱلْكَٰفِرُونَ هُمُ ٱلظَّٰلِمُونَ',
'2:255':'ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌۭ وَلَا نَوْمٌۭ ۚ لَّهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍۢ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ',
'2:256':'لَآ إِكْرَاهَ فِى ٱلدِّينِ ۖ قَد تَّبَيَّنَ ٱلرُّشْدُ مِنَ ٱلْغَىِّ ۚ فَمَن يَكْفُرْ بِٱلطَّٰغُوتِ وَيُؤْمِنۢ بِٱللَّهِ فَقَدِ ٱسْتَمْسَكَ بِٱلْعُرْوَةِ ٱلْوُثْقَىٰ لَا ٱنفِصَامَ لَهَا ۗ وَٱللَّهُ سَمِيعٌ عَلِيمٌ',
'2:257':'ٱللَّهُ وَلِىُّ ٱلَّذِينَ ءَامَنُوا۟ يُخْرِجُهُم مِّنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِ ۖ وَٱلَّذِينَ كَفَرُوٓا۟ أَوْلِيَآؤُهُمُ ٱلطَّٰغُوتُ يُخْرِجُونَهُم مِّنَ ٱلنُّورِ إِلَى ٱلظُّلُمَٰتِ ۗ أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ',
'2:258':'أَلَمْ تَرَ إِلَى ٱلَّذِى حَآجَّ إِبْرَٰهِۦمَ فِى رَبِّهِۦٓ أَنْ ءَاتَىٰهُ ٱللَّهُ ٱلْمُلْكَ إِذْ قَالَ إِبْرَٰهِۦمُ رَبِّىَ ٱلَّذِى يُحْىِۦ وَيُمِيتُ قَالَ أَنَا۠ أُحْىِۦ وَأُمِيتُ ۖ قَالَ إِبْرَٰهِۦمُ فَإِنَّ ٱللَّهَ يَأْتِى بِٱلشَّمْسِ مِنَ ٱلْمَشْرِقِ فَأْتِ بِهَا مِنَ ٱلْمَغْرِبِ فَبُهِتَ ٱلَّذِى كَفَرَ ۗ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ',
'2:259':'أَوْ كَٱلَّذِى مَرَّ عَلَىٰ قَرْيَةٍۢ وَهِىَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا قَالَ أَنَّىٰ يُحْىِۦ هَٰذِهِ ٱللَّهُ بَعْدَ مَوْتِهَا ۖ فَأَمَاتَهُ ٱللَّهُ مِا۟ئَةَ عَامٍۢ ثُمَّ بَعَثَهُۥ ۖ قَالَ كَمْ لَبِثْتَ ۖ قَالَ لَبِثْتُ يَوْمًا أَوْ بَعْضَ يَوْمٍۢ ۖ قَالَ بَل لَّبِثْتَ مِا۟ئَةَ عَامٍۢ فَٱنظُرْ إِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْ ۖ وَٱنظُرْ إِلَىٰ حِمَارِكَ وَلِنَجْعَلَكَ ءَايَةًۭ لِّلنَّاسِ ۖ وَٱنظُرْ إِلَى ٱلْعِظَامِ كَيْفَ نُنشِزُهَا ثُمَّ نَكْسُوهَا لَحْمًۭا ۚ فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ',
'2:260':'وَإِذْ قَالَ إِبْرَٰهِۦمُ رَبِّ أَرِنِى كَيْفَ تُحْىِ ٱلْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِن ۖ قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِى ۖ قَالَ فَخُذْ أَرْبَعَةًۭ مِّنَ ٱلطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ ٱجْعَلْ عَلَىٰ كُلِّ جَبَلٍۢ مِّنْهُنَّ جُزْءًۭا ثُمَّ ٱدْعُهُنَّ يَأْتِينَكَ سَعْيًۭا ۚ وَٱعْلَمْ أَنَّ ٱللَّهَ عَزِيزٌ حَكِيمٌۭ',
'2:261':'مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتْ سَبْعَ سَنَابِلَ فِى كُلِّ سُنۢبُلَةٍۢ مِّا۟ئَةُ حَبَّةٍۢ ۗ وَٱللَّهُ يُضَٰعِفُ لِمَن يَشَآءُ ۗ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ',
'2:262':'ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ ثُمَّ لَا يُتْبِعُونَ مَآ أَنفَقُوا۟ مَنًّۭا وَلَآ أَذًۭى ۙ لَّهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ',
'2:263':'قَوْلٌۭ مَّعْرُوفٌۭ وَمَغْفِرَةٌ خَيْرٌۭ مِّن صَدَقَةٍۢ يَتْبَعُهَآ أَذًۭى ۗ وَٱللَّهُ غَنِىٌّ حَلِيمٌۭ',
'2:264':'يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُبْطِلُوا۟ صَدَقَٰتِكُم بِٱلْمَنِّ وَٱلْأَذَىٰ كَٱلَّذِى يُنفِقُ مَالَهُۥ رِئَآءَ ٱلنَّاسِ وَلَا يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۖ فَمَثَلُهُۥ كَمَثَلِ صَفْوَانٍ عَلَيْهِ تُرَابٌۭ فَأَصَابَهُۥ وَابِلٌۭ فَتَرَكَهُۥ صَلْدًۭا ۖ لَّا يَقْدِرُونَ عَلَىٰ شَىْءٍۢ مِّمَّا كَسَبُوا۟ ۗ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلْكَٰفِرِينَ',
'2:265':'وَمَثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمُ ٱبْتِغَآءَ مَرْضَاتِ ٱللَّهِ وَتَثْبِيتًۭا مِّنْ أَنفُسِهِمْ كَمَثَلِ جَنَّةٍۭ بِرَبْوَةٍ أَصَابَهَا وَابِلٌۭ فَـَٔاتَتْ أُكُلَهَا ضِعْفَيْنِ فَإِن لَّمْ يُصِبْهَا وَابِلٌۭ فَطَلٌّۭ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ',
'2:266':'أَيَوَدُّ أَحَدُكُمْ أَن تَكُونَ لَهُۥ جَنَّةٌۭ مِّن نَّخِيلٍۢ وَأَعْنَابٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ لَهُۥ فِيهَا مِن كُلِّ ٱلثَّمَرَٰتِ وَأَصَابَهُ ٱلْكِبَرُ وَلَهُۥ ذُرِّيَّةٌۭ ضُعَفَآءُ فَأَصَابَهَآ إِعْصَارٌۭ فِيهِ نَارٌۭ فَٱحْتَرَقَتْ ۗ كَذَٰلِكَ يُبَيِّنُ ٱللَّهُ لَكُمُ ٱلْءَايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ',
'2:267':'يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِن طَيِّبَٰتِ مَا كَسَبْتُمْ وَمِمَّآ أَخْرَجْنَا لَكُم مِّنَ ٱلْأَرْضِ ۖ وَلَا تَيَمَّمُوا۟ ٱلْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِـَٔاخِذِيهِ إِلَّآ أَن تُغْمِضُوا۟ فِيهِ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ',
'2:268':'ٱلشَّيْطَٰنُ يَعِدُكُمُ ٱلْفَقْرَ وَيَأْمُرُكُم بِٱلْفَحْشَآءِ ۖ وَٱللَّهُ يَعِدُكُم مَّغْفِرَةًۭ مِّنْهُ وَفَضْلًۭا ۗ وَٱللَّهُ وَٰسِعٌ عَلِيمٌۭ',
'2:269':'يُؤْتِى ٱلْحِكْمَةَ مَن يَشَآءُ ۚ وَمَن يُؤْتَ ٱلْحِكْمَةَ فَقَدْ أُوتِىَ خَيْرًۭا كَثِيرًۭا ۗ وَمَا يَذَّكَّرُ إِلَّآ أُو۟لُوا۟ ٱلْأَلْبَٰبِ',
'2:270':'وَمَآ أَنفَقْتُم مِّن نَّفَقَةٍ أَوْ نَذَرْتُم مِّن نَّذْرٍۢ فَإِنَّ ٱللَّهَ يَعْلَمُهُۥ ۗ وَمَا لِلظَّٰلِمِينَ مِنْ أَنصَارٍ',
'2:271':'إِن تُبْدُوا۟ ٱلصَّدَقَٰتِ فَنِعِمَّا هِىَ ۖ وَإِن تُخْفُوهَا وَتُؤْتُوهَا ٱلْفُقَرَآءَ فَهُوَ خَيْرٌۭ لَّكُمْ ۚ وَيُكَفِّرُ عَنكُم مِّن سَيِّـَٔاتِكُمْ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ',
'2:272':'لَّيْسَ عَلَيْكَ هُدَىٰهُمْ وَلَٰكِنَّ ٱللَّهَ يَهْدِى مَن يَشَآءُ ۗ وَمَا تُنفِقُوا۟ مِنْ خَيْرٍۢ فَلِأَنفُسِكُمْ ۚ وَمَا تُنفِقُونَ إِلَّا ٱبْتِغَآءَ وَجْهِ ٱللَّهِ ۚ وَمَا تُنفِقُوا۟ مِنْ خَيْرٍۢ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَ',
'2:273':'لِلْفُقَرَآءِ ٱلَّذِينَ أُحْصِرُوا۟ فِى سَبِيلِ ٱللَّهِ لَا يَسْتَطِيعُونَ ضَرْبًۭا فِى ٱلْأَرْضِ يَحْسَبُهُمُ ٱلْجَاهِلُ أَغْنِيَآءَ مِنَ ٱلتَّعَفُّفِ تَعْرِفُهُم بِسِيمَٰهُمْ لَا يَسْـَٔلُونَ ٱلنَّاسَ إِلْحَافًۭا ۗ وَمَا تُنفِقُوا۟ مِنْ خَيْرٍۢ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٌ',
'2:274':'ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُم بِٱلَّيْلِ وَٱلنَّهَارِ سِرًّۭا وَعَلَانِيَةًۭ فَلَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ',
'2:275':'ٱلَّذِينَ يَأْكُلُونَ ٱلرِّبَوٰا۟ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ ٱلَّذِى يَتَخَبَّطُهُ ٱلشَّيْطَٰنُ مِنَ ٱلْمَسِّ ۚ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓا۟ إِنَّمَا ٱلْبَيْعُ مِثْلُ ٱلرِّبَوٰا۟ ۗ وَأَحَلَّ ٱللَّهُ ٱلْبَيْعَ وَحَرَّمَ ٱلرِّبَوٰا۟ ۚ فَمَن جَآءَهُۥ مَوْعِظَةٌۭ مِّن رَّبِّهِۦ فَٱنتَهَىٰ فَلَهُۥ مَا سَلَفَ وَأَمْرُهُۥٓ إِلَى ٱللَّهِ ۖ وَمَنْ عَادَ فَأُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ',
'2:276':'يَمْحَقُ ٱللَّهُ ٱلرِّبَوٰا۟ وَيُرْبِى ٱلصَّدَقَٰتِ ۗ وَٱللَّهُ لَا يُحِبُّ كُلَّ كَفَّارٍ أَثِيمٍ',
'2:277':'إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ وَأَقَامُوا۟ ٱلصَّلَوٰةَ وَءَاتَوُا۟ ٱلزَّكَوٰةَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ',
'2:278':'يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَذَرُوا۟ مَا بَقِىَ مِنَ ٱلرِّبَوٰٓا۟ إِن كُنتُم مُّؤْمِنِينَ',
'2:279':'فَإِن لَّمْ تَفْعَلُوا۟ فَأْذَنُوا۟ بِحَرْبٍۢ مِّنَ ٱللَّهِ وَرَسُولِهِۦ ۖ وَإِن تُبْتُمْ فَلَكُمْ رُءُوسُ أَمْوَٰلِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَ',
'2:280':'وَإِن كَانَ ذُو عُسْرَةٍۢ فَنَظِرَةٌ إِلَىٰ مَيْسَرَةٍۢ ۚ وَأَن تَصَدَّقُوا۟ خَيْرٌۭ لَّكُمْ ۖ إِن كُنتُمْ تَعْلَمُونَ',
'2:281':'وَٱتَّقُوا۟ يَوْمًۭا تُرْجَعُونَ فِيهِ إِلَى ٱللَّهِ ۖ ثُمَّ تُوَفَّىٰ كُلُّ نَفْسٍۢ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَ',
'2:282':'يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰٓ أَجَلٍۢ مُّسَمًّۭى فَٱكْتُبُوهُ ۚ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبٌۢ بِٱلْعَدْلِ ۚ وَلَا يَأْبَ كَاتِبٌ أَن يَكْتُبَ كَمَا عَلَّمَهُ ٱللَّهُ ۚ فَلْيَكْتُبْ وَلْيُمْلِلِ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَيْـًۭٔا ۚ فَإِن كَانَ ٱلَّذِى عَلَيْهِ ٱلْحَقُّ سَفِيهًا أَوْ ضَعِيفًا أَوْ لَا يَسْتَطِيعُ أَن يُمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِٱلْعَدْلِ ۚ وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ ۖ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٌۭ وَٱمْرَأَتَانِ مِمَّن تَرْضَوْنَ مِنَ ٱلشُّهَدَآءِ أَن تَضِلَّ إِحْدَىٰهُمَا فَتُذَكِّرَ إِحْدَىٰهُمَا ٱلْأُخْرَىٰ ۚ وَلَا يَأْبَ ٱلشُّهَدَآءُ إِذَا مَا دُعُوا۟ ۚ وَلَا تَسْـَٔمُوٓا۟ أَن تَكْتُبُوهُ صَغِيرًا أَوْ كَبِيرًا إِلَىٰٓ أَجَلِهِۦ ۚ ذَٰلِكُمْ أَقْسَطُ عِندَ ٱللَّهِ وَأَقْوَمُ لِلشَّهَٰدَةِ وَأَدْنَىٰٓ أَلَّا تَرْتَابُوٓا۟ ۖ إِلَّآ أَن تَكُونَ تِجَٰرَةً حَاضِرَةًۭ تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ أَلَّا تَكْتُبُوهَا ۗ وَأَشْهِدُوٓا۟ إِذَا تَبَايَعْتُمْ ۚ وَلَا يُضَآرَّ كَاتِبٌۭ وَلَا شَهِيدٌۭ ۚ وَإِن تَفْعَلُوا۟ فَإِنَّهُۥ فُسُوقٌۢ بِكُمْ ۗ وَٱتَّقُوا۟ ٱللَّهَ ۖ وَيُعَلِّمُكُمُ ٱللَّهُ ۗ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۭ',
'2:283':'وَإِن كُنتُمْ عَلَىٰ سَفَرٍۢ وَلَمْ تَجِدُوا۟ كَاتِبًۭا فَرِهَٰنٌۭ مَّقْبُوضَةٌۭ ۖ فَإِنْ أَمِنَ بَعْضُكُم بَعْضًۭا فَلْيُؤَدِّ ٱلَّذِى ٱؤْتُمِنَ أَمَٰنَتَهُۥ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ ۗ وَلَا تَكْتُمُوا۟ ٱلشَّهَٰدَةَ ۚ وَمَن يَكْتُمْهَا فَإِنَّهُۥٓ ءَاثِمٌۭ قَلْبُهُۥ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌۭ',
'2:284':'لِّلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ وَإِن تُبْدُوا۟ مَا فِىٓ أَنفُسِكُمْ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ ٱللَّهُ ۖ فَيَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۗ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ',
'2:285':'ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍۢ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ',
'2:286':'لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ',
'3:1':'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ الٓمٓ',
'3:2':'ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ',
'3:3':'نَزَّلَ عَلَيْكَ ٱلْكِتَٰبَ بِٱلْحَقِّ مُصَدِّقًۭا لِّمَا بَيْنَ يَدَيْهِ وَأَنزَلَ ٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ',
'3:4':'مِن قَبْلُ هُدًۭى لِّلنَّاسِ وَأَنزَلَ ٱلْفُرْقَانَ ۗ إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِ ٱللَّهِ لَهُمْ عَذَابٌۭ شَدِيدٌۭ ۗ وَٱللَّهُ عَزِيزٌۭ ذُو ٱنتِقَامٍ',
'3:5':'إِنَّ ٱللَّهَ لَا يَخْفَىٰ عَلَيْهِ شَىْءٌۭ فِى ٱلْأَرْضِ وَلَا فِى ٱلسَّمَآءِ',
'3:6':'هُوَ ٱلَّذِى يُصَوِّرُكُمْ فِى ٱلْأَرْحَامِ كَيْفَ يَشَآءُ ۚ لَآ إِلَٰهَ إِلَّا هُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ',

const blank=()=>({picked:[],done:{},prog:{},streak:0,last:null,reviews:0});

let cur=null, S=blank();

function save(){ if(!cur) return; S.ts=Date.now(); try{localStorage.setItem(dkey(cur.key),JSON.stringify(S));}catch(e){} }
function loadProfile(p){
  cur=p; let o=null;
  try{const v=localStorage.getItem(dkey(p.key)); if(v) o=JSON.parse(v);}catch(e){}
  S=Object.assign(blank(),o||{});
  if(!Array.isArray(S.picked)) S.picked=[];
  // перенос со старой модели (свободный выбор суры): прогресс по аятам сохраняется,
  // т.к. done/prog хранятся по ссылке «сура:аят»
  if(Array.isArray(S.assignments)&&S.assignments.length&&!S.picked.length){
    S.assignments.forEach(a=>{
      const hit=SYLLABUS.find(r=>r.mode===a.mode&&r.segs.some(s=>s[0]===a.surah&&s[1]<=a.from&&s[2]>=a.from));
      if(hit&&S.picked.indexOf(hit.id)<0) S.picked.push(hit.id);
    });
    delete S.assignments; save();
  }
}
const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function curStreak(){return (S.last!==null && S.last>=dayNum()-1)?S.streak:0}

const surahName=n=>{const s=SURAHS[n-1]; return s?s[1]:'?'};
function refsOfRow(r){
  const out=[];
  r.segs.forEach(sg=>{ for(let i=sg[1];i<=sg[2];i++) out.push(sg[0]+':'+i); });
  return out;
}
function rowLabel(r){
  return r.segs.map(sg=>esc(surahName(sg[0]))+' <bdi>'+sg[1]+'–'+sg[2]+'</bdi>').join(' + ');
}
const rowById=id=>SYLLABUS.find(r=>r.id===id)||null;
const pickedRows=()=>S.picked.map(rowById).filter(Boolean);
function hifzRefs(){ const o=[]; pickedRows().forEach(r=>{if(r.mode==='hifz') o.push.apply(o,refsOfRow(r));}); return [...new Set(o)]; }
function qiraahRefs(){ const o=[]; pickedRows().forEach(r=>{if(r.mode==='qiraah') o.push.apply(o,refsOfRow(r));}); return [...new Set(o)]; }
function allRefs(){ const o=[]; pickedRows().forEach(r=>o.push.apply(o,refsOfRow(r))); return [...new Set(o)]; }
function doneHifz(){ return hifzRefs().filter(r=>S.done[r]); }
function dueItems(){ const d=dayNum(); return doneHifz().filter(r=>!S.prog[r]||S.prog[r].due<=d); }
function refInfo(ref){ const p=ref.split(':'); return {ref,surah:+p[0],ayah:+p[1],text:QTEXT[ref],gharib:GHARIB[ref]}; }

/* ---------- сверка письменного ответа ---------- */
function normAr(s){
  return String(s).replace(/[ً-ْٰـۖ-ۭ]/g,'').replace(/[آأإٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي\s]/g,' ').replace(/\s+/g,' ').trim();
}
function arPairs(s){ const raw=String(s).split(/\s+/).filter(Boolean), out=[]; for(const r of raw){const n=normAr(r); if(n) out.push([r,n]);} return out; }
function alignWords(exp,got){
  const n=exp.length,m=got.length,D=[];
  for(let i=0;i<=n;i++) D.push(new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++) D[i][j]=exp[i-1]===got[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);
  const out=[]; let i=n,j=m;
  while(i>0&&j>0){ if(exp[i-1]===got[j-1]){out.push({t:'k',w:exp[i-1]});i--;j--;} else if(D[i-1][j]>=D[i][j-1]){out.push({t:'mi',w:exp[i-1]});i--;} else {out.push({t:'x',w:got[j-1]});j--;} }
  while(i>0){out.push({t:'mi',w:exp[i-1]});i--;} while(j>0){out.push({t:'x',w:got[j-1]});j--;}
  return out.reverse();
}
function checkWritten(expected,typed){
  const E=arPairs(expected), Gt=arPairs(typed);
  const e=E.map(x=>x[1]), g=Gt.map(x=>x[1]), al=alignWords(e,g);
  let ei=0,gi=0; const out=[];
  for(const step of al){
    if(step.t==='k'){out.push({t:'k',w:E[ei][0]});ei++;gi++;}
    else if(step.t==='mi'){out.push({t:'mi',w:E[ei][0]});ei++;}
    else {out.push({t:'x',w:Gt[gi]?Gt[gi][0]:step.w});gi++;}
  }
  const ok=out.filter(x=>x.t==='k').length, den=Math.max(e.length,g.length)||1;
  return {al:out, ok, total:e.length, pct:Math.round(ok/den*100)};
}
const bare=s=>String(s).replace(/[ً-ْٰـ]/g,'');
const canWrite=ref=>{const x=QTEXT[ref]; return !!x && x.split(/\s+/).length<=45;};

/* ---------- экзамен (каждое воскресенье) ---------- */
const ksaNow=()=>Date.now()+3*36e5;
function cycleInfo(){
  const t0=ksaNow(), n=Math.floor(t0/864e5), h=Math.floor((t0%864e5)/36e5), dow=(n+4)%7;
  const cyc=(dow===0&&h>=13)?n+1:n, cd=(cyc+4)%7;
  return {n,dow,exam:cyc+(0-cd+7)%7};
}

/* список программы курса с отметками */
function planCard(){
  const groups=[['hifz',t('hifzGroup')],['qiraah',t('qiraahGroup')]];
  return `<div class="card">
    <p class="eyebrow">${esc(t('planTitle'))}</p>
    <p class="muted" style="margin:0 0 12px">${esc(t('planNote'))}</p>
    ${groups.map(g=>`<p class="muted ar sm" dir="rtl" style="margin:10px 0 6px;font-weight:700">${esc(g[1])}</p>
      <div class="list">${SYLLABUS.filter(r=>r.mode===g[0]).map(r=>{
        const refs=refsOfRow(r), d=refs.filter(x=>S.done[x]).length, on=S.picked.indexOf(r.id)>=0;
        return `<label class="pick ${on?'on':''}">
          <input type="checkbox" data-id="${r.id}" ${on?'checked':''}>
          <div><div class="ar sm" dir="rtl" style="line-height:1.6">${rowLabel(r)}</div>
          <div class="top"><span>${refs.length} ${esc(t('unitAyah'))}</span>${d?`<span class="chip ok">${d}/${refs.length}</span>`:''}</div></div>
        </label>`;
      }).join('')}</div>`).join('')}
  </div>`;
}
function wirePlan(){
  app.querySelectorAll('.pick input[data-id]').forEach(b=>b.onchange=()=>{
    const id=b.dataset.id, i=S.picked.indexOf(id);
    if(b.checked){ if(i<0) S.picked.push(id); } else if(i>=0) S.picked.splice(i,1);
    showPlan=true;           // список остаётся открытым, чтобы отметить несколько заданий
    save(); render();
  });
}

  }else if(tot){
    html+=`<div class="card"><div class="row" style="justify-content:space-between">
      <div><div class="big">${due}</div><div class="muted">${esc(t('dueToday'))}</div></div>
      <div style="text-align:end"><div class="big" style="font-size:1.6rem;color:var(--ink)">${tot}</div><div class="muted">${esc(t('learnedTotal'))}</div></div>

      <label class="f">${esc(t('qTypeL'))}<select id="mode">
        <option value="mix">${esc(t('mMix'))}</option>
        <option value="flash">${esc(t('mFlash'))}</option>
        <option value="write">${esc(t('mWrite'))}</option></select></label>
      <label class="f">${esc(t('howMany'))}<select id="count"><option>5</option><option>10</option><option>20</option><option value="all">${esc(t('allOpt'))}</option></select></label>
    </div>
    ${due?`<button class="btn" id="start" style="width:100%;margin-top:10px">${esc(t('startReview'))}</button>`:''}</div>`;
  }
  if(hifzRefs().length){
    html+=`<div class="card"><p class="eyebrow">${esc(t('examDrill'))}</p>

      <button class="btn" id="exStart" style="width:100%">${esc(t('startBtn'))}</button></div>`;
  }
  if(showPlan) html+=planCard();
  app.innerHTML=html;
  if(showPlan) wirePlan();
  const $=id=>document.getElementById(id);

  if($('start')) $('start').onclick=()=>{
    let pool=shuffle(dueItems());

    startWith(pool,false,cfg.mode);
  };
