نفرد، وأما المأموم فإنه يقول: ربنا ولك الحمد، لحديث أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «إذا قال الإمام سمع الله لمن حمده فقولوا: اللهم ربنا لك الحمد، فإن من وافق قوله قول الملائكة غفر له ما تقدم من ذنبه»، وإنما عدل عن التكبير إلى هذا الذكر عند الرفع من الركوع، لأن القيام الذي بعده محل تحميد لل عز وجل يصدر من الإمام والمأموم.", "ج- الحديث دليل على مشروعية قول: ربنا ولك الحمد بعد القيام من الركوع، وهذا في حق الإمام والمنفرد، إلا المأموم فيقولها حين الرفع من الركوع بدلاً عن: سمع الله لمن حمده.", "وبهذا يتبين أن الإمام والمنفرد يقولان الجملة الأولى حين الرفع من الركوع والثانية بعد القيام، وأما المأموم فيقول الجملة الثانية فقط حين الرفع من الركوع، وهذا على أحد القولين لأهل العلم، وهو الراجح، لأن حديث أبي هريرة نص في الموضوع: (إذا قال الإمام سمع الله لمن حمده فقولوا: اللهم ربنا لك الحمد..)، ولم يقل فقولوا: سمع الله لمن حمده، كما قال: إذا كبر الإمام فكبروا..، والله تعالى أعلم."]}, "35": {"m": "وَفِي المُتّفَقِ عَلَيْهِ عَنْهُ رضي الله عنه أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «إِذَا قَالَ الإِمَامُ: سَمِعَ اللَّهُ لمَِنْ حَمِدَهُ، فَقُولُوا: اللّهُمّ رَبّنَا لَكَ الحَمْدُ؛ فَإِنّهُ مَنْ وَ افَقَ قَوْلُهُ قَوْلَ المَلائِكَةِ غُفِرَلَهُ مَا تَقَدّمَ مِنْ ذَنْبِهِ».", "s": ["أ- الحديث دليل على مشروعية قول: «سمع الله لمن حمده» حين الرفع من الركوع، وهذا في حق الإمام والمنفرد. وأما المأموم، فإنه يقول: اللهم ربنا لك الحمد، وإنما عدل عن التكبير إلى هذا الذكر عند الرفع من الركوع؛ لأن القيام الذي بعده محل تحميد الله ﷺ يصدر من الإمام والمأموم.", "ب- ظاهر الحديث أن الإمام لا يقول: (ربنا لك الحمد)، وأن المأموم لا يقول: (سمع الله لمن حمده)؛ لأنه في الحديث فَرقََّ الجملتين بين الإمام والمنفرد. أما الإمام، فقد ثبت أنه ﷺ كان يجمع بين التسميع والتحميد، وهو الإمام لأصحابه، وذلك في حديث أبي هريرة، في صفة صلاته، وفيه: «ثم يكبر حين يركع، ثم يقول: سمع الله لمن حمده، حين يرفع صلبه من الركوع، ثم يقول وهو قائم: ربنا ولك الحمد»، وبهذا أخذ الجمهور. وأما المأموم، فلم يَرِد ما يدل على أنه يجمع بينهما، وإنما يقول: «ربنا ولك الحمد». ونقل ابن المنذر عن ابن سيرين، والشافعي، وإسحاق، وعطاء وغيرهم أن المأموم يجمع بين التسميع والتحميد؛ لعموم قوله ﷺ: «صلوا كما رأيتموني أصلي». والأول هو الأظهر، وبهذا يتبين أن الإمام والمنفرد يقولان الجملة الأولى حين الرفع من الركوع، والثانية بعد القيام. وأما المأموم، فيقول الجملة الثانية فقط حين الرفع من الركوع؛ لأن حديث أبي هريرة نص في الموضوع: «إذا قال الإمام سمع الله لمن حمده، فقولوا: اللهم ربنا لك الحمد...»، فجعل التسميع للإمام، والتحميد للمأموم، ولولا حديث أبي هريرة المتقدم في ثبوت الجمع بينهما عنه ﷺ، وهو إمام؛ لكان الإمام يقتصر على التسميع فقط.", "ج- فيه الحثُّ على موافقة الملائكة في التحميد، وذلك بمتابعة تسميع الإمام واتباع التحميد بعده مباشرة؛ لأن الملائكة لا غفلة عندهم، فمن وافقهم كان متيقظاً، وهذا على القول بأن المأموم يجمع بين التسميع والتحميد.", "د- فضل موافقة الملائكة في التحميد، وأن ذلك سبب لغفران ما تقدم من الذنوب، وهذا فضل عظيم على عمل يسير.", "ه- في الحديث دليل على زيادة شرف هذا الركن من أركان الصلاة؛ لأنه لم يجئأن الملائكة تشارك الآدمي في هذه العبادة بالموافقة إلا في هذا الركن وهو الرفع من الركوع، وتأمينهم عند آخر الفاتحة كما تقدم. قاله ابن أبي جمرة، لكن هل الحديث صريح في هذا؟ لأن الحديث فيه المشاركة بالقول، وهل يلزم من قول الملائكة أداؤهم للفعل؟", "و- الحديث دليل على فضل صلاة الجماعة؛ لأن موافقة الملائكة في التحميد إنما هي لقول المأموم الذي قال بعد إمامه: (ربنا ولك الحمد)، ولم يَرِد ما يدل على أنها تحمد على قول الفذِّ، والله تعالى أعلم."]}, "36": {"m": "وَعَنْ أَبِي سَعِيدٍ الخُدْرِيِ رضي اللهَ عنه قَالَ: «كَانَ رَسُولُ اللَّهِ صلى الله عَليه وسلم إِذَا رَفَعَ رأََْسَهُ مِنَ الرُّكُوعِ قَالَ: اللّهُمّ رَبّنَا لَكَ الحَمْدُ، مِلْءَ السّمََوَاتِ وَالأرْضِ، وَمِلْءَ مَا شِئْتَ مِنْ شَيْءٍ بَعْدُ، أهْلَ الثّنَاءِ وَالمَجْدِ، أحَقُّ مَا قَالَ العَبْدُ - وَكُلُّنَا لَكَ عَبْدٌ -. اللّهُمّ لَا مَانِعَ لمَِا أعْطَيْتَ، وََلَا مُعْطِيَ لمَِا مَنَعْتَ، وََلَا يَنْفَعُ ذَا الجَدِ مِنْكَ الجَدُّ» رَوَاهُ مُسْلِمٌ. وَلَهُ مِنْ حَدِيثِ ابْنِ عَبّاسٍ رضي الله عنهما نَحْوُهُ.", "w": ["قوله: (ملء السماوات وملء الأرض) ملء: بالنصب والرفع، والنصب أشهر، على أنه صفة لموصوف محذوف، وهذا الموصوف منصوب على المصدر، والعامل فيه المصدر قبله، والتقدير: حمداً ملء السماوات.", "والمعنى: حمداً لو كان أجساماً لملأ السماوات والأرض، والمقصود به التمثيل والتقريب، لا حقيقة ذلك، لأن الكلام لا يقدر بالمكاييل ولا تحشى به الظروف، وإنما المراد به: تكثير العدد وتعظيم الحمد وتفخيم شأنه، وأن الله تعالى محمود على كل فعل أو خلق في السماوات والأرض وما بينهما، ذكر معنى هذا الخطابي.", "وأما الرفع فعلى أنه خبر لمبتدأ محذوف تقديره: هو.", "والسماوات بلفظ الجمع، وقد جاء في حديث ابن أبي أوفى بلفظ الإفراد (ملء السماء والأرض)، وفي حديث ابن عباس: (ملء السماوات وملء الأرض وما بينهما) بزيادة: (بينهما)، ولعل تركها في الأحاديث الأخرى لإرادة العلويات والسفليات منهما، وهي شاملة لما بينهما، لأنه لا يخلو عنهما، ومنه قوله تعالى: {إن ربكم الله الذي خلق السماوات والأرض في ستة أيام} [الأعراف: 5٤]، وقوله تعالى: {ولقد خلقنا السماوات والأرض وما بينهما في ستة أيام} [ق: ٣8].", "قوله: (وملء ما شئت من شيء بعد) ظرف مبني على الضم لقطعه عن الإضافة مع إرادة المضاف إليه، وهو السماوات والأرض.", "وهذا إشارة إلى أن حمد الله تعالى لا منتهى له ولا يحصيه عاد، ولا يجمعه كتاب، فأحال الأمر فيه على مشيئة الله تعالى، وليس وراء ذلك للحمد منتهى.", "قوله: (أهل الثناء والمجد) بالنصب على الاختصاص، أو على النداء ويجوز رفعه على أنه خبر لمبتدأ محذوف أي: أنت أهل الثناء والمجد.", "والثناء: هو المدح بالأوصاف الكاملة، والمجد: هو العظمة ونهاية الشرف.", "قوله: (أحق ما قال العبد) بالرفع إما أنه خبر مبتدأ محذوف، أي: ذلك أحق ما قال العبد، والمراد ما سبق من الثناء والحمد، أحق ما قال العبد: أي: أصدقه وأثبته، وإنما جعل خبرا ليكون ما بعده مستأنفا يتم الكلام بدونه، أو مبتدأ وجملة (لا مانع لما أعطيت) خبره، وجملة (وكلنا لك عبد) معترضة، لتأكيد التفويض لل تعالى.", "و (أل) في العبد إما للجنس، أو للعهد، والمراد الرسول صلى الله عليه وسلم، والأول أظهر، لقوله: (وكلنا لك عبد).", "قوله: (وكلنا لك عبد) فيها التنبيه على أنه تعالى مالك لجميع العباد، فإليه يرجع الأمر كله، ولم يقل: عبيد، مع عود الضمير على جمع، لأن القصد أن يكون الخلق بمنزلة عبد واحد وقلب واحد، قال تعالى: {إن كل من في السماوات والأرض إلا آتي الرحمان عبدا} [مريم: 9٣].", "قوله: (لا مانع لما أعطيت) أي: أردت إعطاءه، فإن من أعطى شيئا لا مانع له، إذ الواقع لا يرتفع، ولا معطي لمن منعه الله، لأن قضاءه نافذ سبحانه وتعالى، فما قدر عطاءه وجد، وما قدر منعه لا يوجد، فلا يستطيع أحد أن يغير شيئا من ذلك، قال تعالى: {ما يفتح الله للناس من رحمة فلا ممسك لها وما يمسك فلا مرسل له من بعده وهو العزيز الحكيم} [فاطر: ٢].", "قوله: (ولا ينفع ذا الجد منك الجد) الجد: بفتح الجيم، هو الحظ والغنى والبخت، و (من) بمعنى: عند، والمعنى: لا ينفع صاحب الغنى عندك غناه ولا حظه، وإنما ينفعه العمل بطاعتك، وإنما كان هذا أحق ما قال العبد لأن فيه التفويض إلى الله تعالى والإذعان له، والاعتراف بوحدانيته، وأن الحول والقوة والخير وغيره منه تعالى."], "s": ["الحديث دليل على مشروعية هذا الذكر بعد الرفع من الركوع، للإمام والمنفرد والمأموم، في الفرض والنفل، لما فيه من حمد الله تعالى والثناء عليه، وكمال التفويض له سبحانه، والاعتراف بكمال قدرته وعظمته وانفراده بالوحدانية وتدبير مخلوقاته، والله تعالى أعلم."]}, "37": {"m": "وَعَنْ شَرِيكٍ، عَنْ عَاصِمِ بْنِ كُلَيْبٍ، عَنْ أَبِيهِ، عَنْ وَ ائِلِ بْنِ حُجْرٍرضي الله عنه قَالَ: «رَأَيْتُ النّبِيّ صلى الله عليه وسلم إِذَا سَجَدَ وَضَعَ رُكْبَتَيْهِ قَبْلَ يَدَيْهِ، وَإِذَا نَهَضَ رَفَعَ يَدَيْهِ قَبَلَ رُكْبَتَيْهِ» رَوَاهُ أَبُو دَاوُدَ، وَالتِرْمِذِيُّ، وَالنّسَائِيُّ، وَ ابْنُ مَاجَهْ، وَالدّارَقُطْنِيُّ، وَالحَاكِمُ - وَقَالَ: «عَلَى شَرْطِ مُسْلِمٍ». وَقَالَ التِرْمِذِيُّ: «حَسَنٌ غَرِيبٌ، وَرَوَى هَمّامٌ عَنْ عَاصِمٍ هَذَا مُرْسَلا». وَشَرِيكٌ: كَثِيرُالغَلَطِ وَالوَهَمِ. وَقَالَ الدّارَقُطْنِيُّ: «تَفَرّدَ بِهِ يَزِيدُ بْنُ هَارُونَ عَنْ شَرِيكٍ، وَلَمْ يُحَدِثْ بِهِ عَنْ عَاصِمٍ غَيْرُ شَرِيكٍ، وَشَرِيكٌ لَيْسَ بِالقَوِيِ فِيمَا يَتَفَرّدُ بِهِ». وَقَالَ الخَطّابِيُّ: «حَدِيثُ وَ ائِلٍ أَصَحُّ مِنْ حَدِيثِ أَبِي هُرَْيرَةَ رضي الله عنهما».", "r": 38}, "38": {"m": "وَعَنْ مُحَمّدِ بْنِ عَبْدِ اللَّهِ بْنِ حََسَنٍ، عَنْ أَبِي الزَِنادِ، عَنِ الأَعْرَجِ، عَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ:َ قَالَ رَسُوَلُ اللَّهِ صلى الله عليه وسلم: «إِذَا سَجَدَ أحَدُكُمْ؛ فَلا يَبْرُكْ كَمَا يَبْرُكُ البَعِيَرُ، وَلْيَضَعْ يَدَيْهِ قَبْلَ رُكْبَتَيْهِ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ، وَالبُخَارِيُّ فِي «تَارِيخِهِ»، وَالنّسَائِيُّ، وَالتِرْمِذِيُّ - وَلَفْظُهُ: «يَعْمِدُ أحَدُكُمْ فَيَبْرُكُ فِي صَلاتِهِ بَرْكَ الجَمَلِ!»، وَقَالَ: «حَدِيثٌ غَرِيبٌ». وَمُحَمّدٌ: وَثّقَهُ النّسَائِيُّ، وَقَالَ البُخَارِيُّ: «لَا يُتَابَعُ عَلَيْهِ، وََلَا أَدْرِي: سَمِعَ مِنْ أَبِي الزَِنادِ أَمْ لَا». وَقَالَ البُخَارِيُّ: «وَقَالَ نَافِعٌ: كَانَ ابْنُ عُمَرَرضي الله عنهما يَضَعُ يَدَيْهِ قَبَلَ رُكْبَتَيْهِ». وَقَدْ رَوَاهُ ابْنُ خُزَْيمَةَ فِي «صَحِيحِهِ» مَرْفُوعا.", "s": ["هذه الأحاديث فيها بيان صفة الهوي في السجود، وهي من المسائل التي كثر فيها الكلام، حتى قال الشوكاني: (إن المقام من معارك الأنظار، ومضايق الأفكار)، وقال النووي: (ولا يظهر ترجيح أحد المذهبين من السنة)، وقد اختلف العلماء في هذه المسألة على ثلاثة أقوال:", "الأول: أن المصلي يهوي إلى السجود بتقديم الركبتين ثم اليدين، وقد عزاه ابن المنذر إلى عمر بن الخطاب رضي الله عنه وإلى إبراهيم النخعي، ومسلم بن يسار، وسفيان الثوري، وإلى الشافعي، وأحمد، وإسحاق وأصحاب الرأي، واستدلوا بحديث وائل بن حجر رضي الله عنه.", "والقول الثاني: أن المصلي يهوي إلى السجود بتقديم يديه قبل ركبتيه، وهو قول مالك، والأوزاعي، ورواية عن أحمد، واستدلوا بحديث أبي هريرة رضي الله عنه.", "القول الثالث: أنه مخير في تقديم أيهما شاء، وهو مروي عن مالك، كما ذكر النووي، وقد أجمعوا على أن الصلاة بكلتا الصفتين جائزة، وإنما الخلاف في الأفضل.", "والذي يظهر - والله أعلم - هو القول الأول، وقد اختاره جمع من أهل العلم، منهم ابن المنذر، فإنه قال: (وحديث وائل بن حجر ثابت، وبه نقول) وقال الطحاوي: (فلما اختلف عن النبي صلى الله عليه وسلم فيما يبدأ بوضعه في ذلك، نظرنا في ذلك، فكان سبيل تصحيح معاني الآثار: أن وائلاً لم يختلف عنه، وإنما الاختلاف عن أبي هريرة رضي الله عنه، فكان ينبغي أن يكون ما روي عنه لما تكافأت الروايات فيه ارتفع، وثبت ما روى وائل، فهذا حكم تصحيح معاني الآثار في ذلك …)، وكذا اختار هذا القول الخطابي، وابن القيم، والشيخ عبد العزيز بن باز إضافة إلى ما تقدم من أنه قول أكثر أهل العلم.", "ووجه ذلك ما يلي:", "١ - أن الحديث له متابع وشواهد، وإن كان فيها مقال فأقل أحوالها أن تفيد أن هذا الحكم له أصل مع تعدد الطرق والرواة، وحديث أبي هريرة رضي الله عنه فيه ضعف، ولا متابع له على التحقيق.", "٢ - أن حديث وائل يوافق حديث أبي هريرة الذي فيه نهي المصلي عن بروك كبروك الجمل، لأن المصلي إذا قدم ركبتيه لم يشابه الجمل الذي يقدم يديه، والنهي في الحديث عن الكيفية، لأنه قال: (كما يبرك الجمل)، وفي رواية: (كبروك البعير)، والبعير إذا برك يقدم يديه، بدليل أنه يثني خفيه أولا قبل ركبتيه، فيبرك مقدمه قبل مؤخره، وهذا مشاهد، وركبتا البعير وكل ذوات الأربع في اليدين، ولو كان المراد بالحديث نهي المصلي أن يقدم ركبتيه وأمره بأن يقدم يديه لكان لفظه: (فلا يبرك على ركبتيه اللتين في رجليه كما يبرك البعير على ركبتيه اللتين في يديه)، وبهذا يكون حديث أبي هريرة موافقا لحديث وائل من حيث المعنى، فكل منهما دال على النهي عن الكيفية والصفة، لا عن العضو الذي يسجد عليه، ولا ريب أن الجمع بين الروايات أولى من اختلافها وتضادها، أما آخر حديث أبي هريرة وهو قوله: (وليضع يديه قبل ركبتيه) فقد ذكر ابن القيم أنه انقلب على بعض الرواة، وأن صحته (وليضع ركبتيه قبل يديه) حتى يوافق آخره أوله وحتى يتفق الحديثان، وقد ورد بهذا اللفظ كما تقدم.", "٣ - أن تقديم الركبتين أرفق بالمصلي، وأقرب إلى الوضع المناسب للبدن، فإن أول ما يلي الأرض منه ركبتاه ثم يداه ثم جبهته وأنفه، والنهوض بعكس ذلك، قال الخطابي: (هذا أرفق بالمصلي وأحسن في الشكل، وفي رأي العين)، ومن المقرر أن أفعال الصلاة وهيئاتها لا تخالف الجبلة ولا طبيعة البدن.", "٤ - أن هذا هو الموافق للمنقول عن الصحابة رضي الله عنهم كعمر بن الخطاب وابنه وعبد الله بن مسعود، وكذا جماعة من التابعين، كما تقدم فيما نقله ابن المنذر، وقد روى ابن أبي شيبة شيئا من ذلك، أكثرها بأسانيد صحيحة.", "وهذا مع القدرة على تقديم الركبتين، فإن كان عاجزًا لكبر أو مرض قدم ما هو أهون عليه، والله أعلم."], "t": ["حديث وائل بن حجر ضعفه قوم، وصححه آخرون، فممن ضعفه البيهقي والدارقطني والألباني وغيرهم، وحجتهم: تفرد شريك بن عبد الله القاضي به، وليس هو بالقوي، وممن صححه الترمذي والطحاوي والخطابي والبغوي وابن القيم وغيرهم، وهذا هو الأظهر إن شاء الله، فإن شريك بن عبد الله تكلم فيه علماء الجرح والتعديل ما بين مضعف له وهم قلة، وموثق له مطلقاً، أو موثق له مع جواز الغلط والوهم عليه، فيكون ثقة ضعيف الضبط، والأكثرون على هذا، وخلاصة ما قيل فيه: أنه ثقة صدوق يهم، فإن حدث من كتابه فصحيح، وإن حدث من حفظه فإن كان قبل ولايته القضاء فصحيح أيضا إذا لم يعنعن، وإن كان بعدها ففي حديثه تخليط واضطراب، لأنه تغير وساء حفظه، لكن ما ذكر في هذا الحديث ليس مما يضيع، فإنه يتردد عليه في اليوم والليلة خمس مرات غير النوافل، فمثل هذا يحفظ، على أنه قد روى هذا الحديث عنه يزيد بن هارون الواسطي - كما تقدم - وسماعه منه قديم قبل ولايته القضاء، كما صرح بذلك ابن حبان وغيره، وقد رواه بالعنعنة، لكن تابعه همام بن يحيى البصري من ثلاث طرق عند أبي داود (8٣9) والبيهقي (٢/ 98 - 99) والطحاوي في «شرح معاني الآثار» (١/ ٢55) والطريق الثالث مرسل صحيح.", "والحديث له شاهد من حديث أنس رضي الله عنه قال: (رأيت رسول الله صلى الله عليه وسلم كبر فحاذى بإبهامه أذنيه، ثم ركع حتى استقر كل مفصل منه، وانحط بالتكبير حتى سبقت ركبتاه يديه)، أخرجه الدارقطني (١/ ٣٤5) والحاكم (١/ ٢٢6) والبيهقي (٢/ 99) وقال الحاكم: (هذا إسناد صحيح على شرط الشيخين ولا أعرف له علة) وسكت عنه الذهبي، وقد أخرجه ابن حزم في المحلى (٤/ ١٢9) محتجا به في مقام المعارضة لمذهبه - وهو وجوب تقديم اليدين قبل الركبتين - ولم يذكر له علة، ولو علمها لبادر بذكرها، لأن ذلك ينفعه في مقام تضعيف الدليل المعارض.", "وقد ضعفه بعض العلماء بجهالة العلاء بن إسماعيل، وقد تفرد به، وبقية رجاله رجال الصحيح، فالحديث فيه مقال، ولحديث وائل شاهدان آخران عن أبي هريرة وسعد بن أبي وقاص رضي الله عنهما، وهما ضعيفان.", "وأما حديث أبي هريرة فقد اختلف العلماء فيه أيضاً فصححه قوم، وضعفه آخرون، فممن صححه عبد الحق، والسيوطي، وأحمد شاكر، والألباني والحافظ كما هنا في «بلوغ المرام».", "وضعفه الأئمة الكبار أمثال: البخاري والترمذي والدارقطني والبيهقي، وأعلوه بتفرد الدراوردي، عن شيخه محمد بن عبد الله بن الحسن، المعروف بالنفس الزكية، وتفرد شيخه به، نص على ذلك الدارقطني، والبيهقي وغيرهما.", "فأما الدراوردي ففيه كلام لأهل العلم، وأعدل الأقوال فيه أنه ثقة، فإن حدث من كتابه فهو صحيح، وإن حدث من حفظه أو من كتب غيره فإنه يهم ويجيء ببواطيل من القلب وغيره، ذكر ذلك الإمام أحمد وغيره، وعليه فما تفرد به فهو محل نظر. وأما محمد بن الحسن فقد وثقه النسائي، وذكره ابن حبان في «الثقات»، لكن قال البخاري بعد أن ساق حديثه هذا: (ولا يتابع عليه، ولا أدري أسمع من أبي الزناد أم لا؟)، وقال ابن عدي: (لا يتابع عليه، لم يسمع، سمعت ابن حماد يذكره عن البخاري)، وذكر ابن سعد أنه كان قليل الحديث، وكان يلزم البادية، ومن هذه صفته فإنه يتوقف في حديثه، فلا يقبل عند التفرد.", "فإن قيل: إنه لم يتفرد به، فقد تابعه عبد الله بن نافع، عن محمد بن عبد الله به، أخرجه أبو داود (8٤١) والترمذي (٢/ 56) والنسائي (٢/ ٢07) ولفظه عند أبي داود والنسائي: (يعمد أحدكم في صلاته فيبرك كما يبرك الجمل)، وعند الترمذي: (يعمد أحدكم فيبرك في صلاته برك الجمل).", "فالجواب: أن هذا الحديث ليس فيه ذكر تقديم اليدين على الركبتين من هذا الطريق، والمتابعة في علم المصطلح هي رواية الحديث بلفظه أو معناه، وهذا غير متحقق في رواية عبد الله بن نافع، ثم إن غاية ما يدل عليه هو النهي عن بروك كبروك الجمل، وبروكه معروف عنه الجميع بالمعاينة، وهو أنه يقدم يديه في البروك قبل رجليه، بدليل أنه يثني خفيه أولا قبل ركبتيه، فإذا قدم المصلي يديه قبل ركبتيه في السجود - كما في رواية الدراوردي - فقد شابه البعير.", "وأما الشاهد الذي ذكره المصنف هنا، فقد أخرجه ابن خزيمة (6٢7) والدارقطني (١/ ٣٤٤) والحاكم (١/ ٢66) والبيهقي (٢/ ١00) وذكره البخاري تعليقا (٢/ ٢90 فتح) من طريق عبد العزيز بن محمد الدراوردي، عن عبيد الله بن عمر، عن نافع، عن ابن عمر رضي الله عنهما أنه كان يضع يديه قبل ركبتيه، وقال: كان النبي صلى الله عليه وسلم يفعل ذلك، قال الحاكم: (صحيح على شرط مسلم)، وسكت عنه الذهبي.", "وهذا الشاهد فيه نظرمن وجهين:", "الأول: أنه جاء من طريق الدراوردي، ورواية الدراوردي عن شيخه عبيد الله بن عمر ضعيفة، بل منكرة، كما نص على ذلك الحفاظ، كالإمام أحمد، وأبي حاتم، والنسائي، وابن رجب وغيرهم، وقد نقل المزي عن أبي داود أنه قال: (روى عبد العزيز عن عبيد الله أحاديث منكرة)، ثم إن هذا المروي عن ابن عمر قد روي عنه خلافه، كما أخرجه ابن أبي شيبة من طريق ابن أبي ليلى، عن نافع، عن ابن عمر أنه كان يضع ركبتيه إذا سجد قبل يديه، ويرفع يديه إذا رفع قبل ركبتيه.", "الثاني: أن رفع الحديث إلى النبي صلى الله عليه وسلم ضعفه أهل العلم، كالبيهقي وغيره، فإنه قال بعد أن ذكر حديث أبي هريرة بسنده: (ولعبد العزيز الدراوردي إسناد آخر ولا أراه إلا وهماً)، وبهذا يتبين أن حديث أبي هريرة لا شاهد له، ثم إن متنه فيه اضطراب، فقد روي باللفظ المذكور، وروي بلفظ: (إذا سجد أحدكم فليبدأ بركبتيه قبل يديه، ولا يبرك بروك الفحل)."]}, "39": {"m": "وَعَنِ ابَْنِ عَبّاسٍ رضيَ الله عنهما قَالَ: قَالَ رَسُولُ اللَّهَِ صلى الله عليه وسلم: «أُمِرْتُ أَنْ أَسْجُدَ عَلَى سَبْعَةِ أَعْظُمٍ: عَلَى الجَبْهَةِ - وَأشَارَبِيَدِهِ عَلَى أنْفِهِ -، وَاليَدَيْنِ، وَالرُّكْبَتَيْنِ، وَأطْرَافِ القَدَمَيْنِ، وََلَا نَكْفِتَ الثِيَابَ وَالشّعَرَ» مُتّفَقٌ عَلَيْهِ، وَلَفْظُهُ لِلْبُخَارِي.ِ", "w": ["قوله: (أمرت) أي: أمرني الله عز وجل، وفي رواية للبخاري: (أمر النبي صلى الله عليه وسلم)، وفي رواية له - أيضا ـ: (أمرنا)، قال الحافظ: (لما كان هذا السياق يحتمل الخصوصية عقبه المصنف بلفظ آخر دال على أنه لعموم الأمة).", "قوله: (على سبعة أعظم) جمع عظم، وفي رواية للبخاري (أعضاء)، جمع عضو، وهو الجزء المستقل من الجسد.", "وقد ذكرها النبي صلى الله عليه وسلم إجمالاً، ثم فصلها ليكون أبلغ في حفظها وأشوق إلى تلقيها.", "قوله: (على الجبهة) هي أعلى الوجه، وقال الأصمعي: (هي موضع السجود).", "قوله: (وأشار بيده إلى أنفه) أي: ولم يقل: والأنف، إشارة أنه ليس عضوًا مستقلاً، بل تابع للجبهة وأنهما عضو واحد، وإلا لكانت الأعضاء ثمانية، وقد ورد في حديث العباس بن عبد المطلب رضي الله عنه عند مسلم: (الجبهة والأنف) وسيأتي.", "قوله: (واليدين) أي: الكفين، كما في رواية مسلم.", "وهذا التفسير متعين، لئلا يعارضه حديث: (لا يبسط أحدكم ذراعيه انبساط الكلب)، كما سيأتي.", "قوله: (ولا نكفت الثياب ولا الشعر)، الكفت: هو الضم والكف والجمع، يقال: كفت الشيء يكفته، من باب «ضرب»: ضمه وقبضه، وفي رواية: (ولا أكف ثوباً ولا شعرًا)، والمراد: شعر الرأس، والمعنى: لا نضمها ولا نجمعها، وذلك بأن يرفع ثوبه من أسفل عند السجود، أو يطويه حتى يحزمه على بطنه."], "s": ["أ- الحديث دليل على وجوب السجود على هذه الأعضاء السبعة وهي: الجبهة، ويتبعها الأنف، والكفان، والركبتان، وأطراف القدمين، وهذا على الراجح من قولي أهل العلم.", "لأن الله تعالى أمر نبيه صلى الله عليه وسلم بذلك، والأمر يقتضي الوجوب، والأمة تبع له في ذلك، ويؤيده رواية (أمرنا) - كما تقدم - وهذا هو الأصل، أن الأوامر والنواهي توجه إليه، والأمة تبع له في ذلك، إلا ما دل الدليل على تخصيصه به.", "والحكمة من السجود على هذه الأعضاء لأجل أن يشمل السجود أعالي الجسد وأسافله، وأعضاء كسبه وسعيه، فيكمل ذل العبد وعبادته لل عز وجل، لأن السجود عليها إذلال لها لل رب العالمين.", "ويستثنى من ذلك من عجز عن السجود ببعض الأعضاء كإحدى يديه أو أنفه ونحو ذلك فإنه يسجد على بقية الأعضاء، لقوله تعالى: {فاتقوا الله ما استطعتم} [التغابن: ١6].", "ب- دل الحديث بمفهومه أنه لا يجوز للمصلي أن يرفع عضوًا من أعضائه حال سجوده، كاليد والرجل أو الأنف ونحو ذلك، فإن فعل لم يصح سجوده؛ لأنه لم يسجد على هذا العضو الذي رفعه، وبه يتبين خطأ من يسجد على جبهته ويرفع أنفه، أو يرفع قدميه أو أحدهما، أو يضع أحدهما على الأخرى.", "وهذا إن كان الرفع من ابتداء السجدة إلى آخرها، فإن رفع العضو ثم وضعه في أثناء السجدة فقد أدى الركن، لكن لا ينبغي له ذلك، لأن الأصل أن تبقى الأعضاء على الأرض مدة السجود.", "وقد ورد في حديث العباس بن عبد المطلب رضي الله عنه عن النبي صلى الله عليه وسلم قال: «أمرت أن أسجد على سبع: الجبهة والأنف واليدين والركبتين والقدمين».", "وعن ابن عباس رضي الله عنهما أن النبي صلى الله عليه وسلم قال: «لا صلاة لمن لم يمس أنفه الأرض».", "ج- ظاهر الحديث أنه لا يجب على المصلي كشف شيء من هذه الأعضاء لو كان مستورًا، بل يسجد على العضو ولو مع الساتر، كشراب الرجلين أو اليدين، أو ما يلبس في الشتاء غطاء للرأس والجبهة ونحو ذلك، لأمرين:", "الأول: أن مسمى السجود يحصل بوضع الأعضاء على الأرض دون كشفها.", "الثاني: ما ذكره البخاري معلقاً بصيغة الجزم عن الحسن أنه قال: (كان القوم يسجدون على العمامة والقلنسوة ويداه في كمه).", "أما سجود المصلي على حائل من غيرأعضاء السجود فلا يخلو:", "١ - إما أن يكون منفصلا، كسجادة فلا بأس به ولا كراهة فيه، لما ورد عن ميمونة رضي الله عنها أن النبي صلى الله عليه وسلم صلى على الخمرة، والخمرة: بالضم، على وزن غرفة، مصلى صغير يعمل من سعف النخل، سميت بذلك لسترها الوجه والكفين من حر الأرض وبردها.", "لكن يستثنى من ذلك أن يخص جبهته بشيء يسجد عليه دون بقية بدنه، فهذا ينهى عنه لأمرين:", "الأول: أن في ذلك موافقة للرافضة وتشبهاً بهم؛ لأنهم يسجدون على قطعة من المدر، كالفخار.", "الثاني: رفع التهمة، والذي ينبغي للمسلم اتقاء مواضع التهم.", "٢ - وإن كان الحائل متصلاً بالمصلي كثوبه أو طرف عمامته أو طرف غطاء رأسه، فهذا يكره السجود عليه، إلا لحاجة كشدة حر، ونحوه، لحديث أنس رضي الله عنه قال: كنا نصلي مع النبي صلى الله عليه وسلم فيضع أحدنا طرف الثوب من شدة الحر في مكان السجود.", "وفي لفظ: (كنا نصلي مع رسول الله صلى الله عليه وسلم في شدة الحر، فإذا لم يستطع أحدنا أن يمكن جبهته من الأرض بسط ثوبه فسجد عليه)، قال الحافظ ابن حجر: (فيه إشارة إلى أن مباشرة الأرض عند السجود هو الأصل، لأنه علق بسط الثوب بعدم الاستطاعة).", "وبهذا تبين أن ما يفعله بعض المصلين من بسط طرف غطاء رأسه على الأرض عند السجود مع وجود الفرش في المساجد أن هذا لا ينبغي، لعدم الحاجة إليه، مع ما فيه من كثرة الحركة كلما أراد أن يبسط ذلك، ولأن الصحابة رضي الله عنهم لم يفعلوا ما ذكروا إلا عند الحاجة، ولا حاجة مع فرش المساجد، اللهم إلا أن تكون الفرش فيها غبار والمصلي عنده حساسية فمثل ذلك عذر إن شاء الله تعالى.", "د- الحديث دليل على أن المصلي منهي عن كف ثوبه عند السجود، وذلك بأن يرفعه من أسفل، أو يطويه حتى يربطه على بطنه، لأن ذلك ليس من تمام الزينة التي تطلب من المصلي، وقد يكون من باب الكبر، لئلا يتلوث ثوبه إذا باشر التراب. وقد ذكر النووي أن هذا النهي يراد به التنزيه، فلو صلى كذلك فقد أساء، وصحت صلاته، وذكر أن الطبري احتج على ذلك بالإجماع، لكن حكى ابن المنذر عن الحسن البصري أن عليه الإعادة.", "ولا يدخل في ذلك كف الغترة حول العنق يميناً أو شمالاً، لأنها تلبس على هذه الصفة، والله أعلم."]}, "40": {"m": "وَعَنْ عَبْدِ اللَّهِ بْنِ مَالِكٍ ابْنِ بُحَيْنَةَ رضي الله عنهم: «أَنّ النّبِيّ صلى الله عليه وسلم كَانَ إِذَا صَلّى فَرّجَ بَيْنَ يَدَيْهِ حَتّى يَبْدُوَ بَيَاضُ إِبْطَيْهِ» مُتّفَقٌ عَلَيْهِ.", "r": 41}, "41": {"m": "وَعَنِ البَرَاءِ بْنِ عَازِبٍ رضي الله عنهما قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إِذَا سَجَدْتَ؛ فَضَعْ كَفّيْكَ، وَارْفَعْ مِرْفَقَيْكَ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (إذا صلى) أي: إذا سجد، وقد ورد بهذا اللفظ عند مسلم من طريق آخر.", "قوله: (فرج بين يديه) بتشديد الراء، أي: باعد بين يديه، أي: عضديه مثنى عضد، وهو ما بين المرفق إلى الكتف، والمراد فرج بينهما وبين جنبيه، فنحى كل يد عن الجانب الذي يليها، بدليل ما بعده.", "قوله: (حتى يبدو بياض إبطيه) أي: يظهر، وقوله: (إبطيه) مثنى: إبط، بكسر الهمزة وسكون الباء، وهو باطن المنكب، ويكون لونه أبيض من لون بقية الجلد غالبا لاختفائه عن المؤثرات الخارجية من الهواء والشمس، وإنما كان يرى بياضهما، لاحتمال أن شعر إبطيه صلى الله عليه وسلم كان خفيفاً، فلا يتضح للناظر من بعد سوى بياض الإبطين، أو أنه كان صلى الله عليه وسلم ينتف إبطيه حتى تبقى بيضاء."], "s": ["الحديث دليل على هيئة السجود الموافقة للسنة، وهو ما اجتمع فيه ثلاث صفات:", "الأولى: إبعاد العضدين عن الجنبين حال السجود والمبالغة في ذلك، وذلك لتنال اليدان حظهما من الاعتماد والاعتدال في السجود، ويبتعد الساجد عن مظاهر الكسل والفتور.", "وهذه السنة مشروعة ما لم يؤذ من بجانبه، فإن حصل ذلك ترك المجافاة، لأن درء المفاسد بإشغال المصلين أو إيذائهم أولى من جلب المصالح بهذه الصفة.", "وقد ورد في حديث ميمونة رضي الله عنها قالت: (كان النبي صلى الله عليه وسلم إذا سجد لو شاءت بهمة أن تمر بين يديه لمرت).", "الصفة الثانية: وضع الكفين على الأرض، وهما من أعضاء السجود، كما تقدم، وقد دلت السنة على بسطهما مضمومتي الأصابع إلى القبلة، كما سيأتي.", "الصفة الثالثة: رفع الذراعين عن الأرض، لأن الرسول صلى الله عليه وسلم أمر برفعهما ونهى عن بسطهما، وقال: «اعتدلوا في السجود، ولا يبسط أحدكم ذراعيه انبساط الكلب».", "وقد ذكر بعض الفقهاء أنه إذا طال السجود وراء الإمام فله أن يعتمد بمرفقيه على فخذيه، لحديث أبي هريرة رضي الله عنه قال: اشتكى أصحاب النبي صلى الله عليه وسلم إلى النبي صلى الله عليه وسلم مشقة السجود عليهم إذا تفرجوا، فقال: «استعينوا بالركب»، والصواب أنه مرسل، لكن يعضده عموم قوله تعالى: {فاتقوا الله ما استطعتم} [التغابن: ١6] والله تعالى أعلم."]}, "42": {"m": "وَعَنْ وَ ائِلٍ رضي الله عنه: «أَنّ النّبِيّ صلى الله عليه وسلم كَانَ إِذَا رَكَعَ فَرّجَ بَيْنَ أَصَابِعِهِ، وَإِذَا سَجَدَ ضَمّ أَصَابِعَهُ» رَوَاهُ البَيْهَقِيُّ، وَالحَاكِمُ - وَقَالَ: «عَلَى شَرْطِ مُسْلِمٍ» -.", "s": ["الحديث دليل على أن السنة في أصابع اليدين حال الركوع تفريجهما فوق الركبة كالقابض عليها، لأن ذلك أمكن من الركوع وأثبت لحصول تسوية ظهره برأسه، وهي سنة مطلوبة، كما تقدم.", "أما في حال السجود فالسنة ضم الأصابع مع بسطها، ليحصل بذلك كمال استقبال القبلة بها، وهو أعون على تحملها في أثناء السجود، والله تعالى أعلم."], "t": ["هذا الحديث أخرجه الحاكم مفرقاً في موضعين من المستدرك:", "الأول: (١/ ٢٢٤) من طريق عمرو بن عون، ثنا هشيم، عن عاصم بن كليب، عن علقمة بن وائل، عن أبيه رضي الله عنه: (أن النبي صلى الله عليه وسلم كان إذا ركع فرج بين أصابعه).", "والثاني: (١/ ٢٢6) من طريق الحارث بن عبد الله الخازن، ثنا هشيم به، بلفظ: (أن النبي صلى الله عليه وسلم كان إذا سجد ضم أصابعه).", "وقال الحاكم عن كلا الإسنادين: (هذا حديث صحيح على شرط مسلم ولم يخرجه).", "وأخرجه بهذه الصفة ابن خزيمة (59٤، 6٤٢) من طريق الحارث بن عبد الله بهذا الإسناد.", "وأخرجه ابن حبان (5/ ٢٤7، ٢٤8) في موضع واحد من طريق الحارث بن عبد الله بهذا الإسناد، وعلى هذا فلفظ «البلوغ» مثل لفظ ابن حبان، ولو عزاه إليه الحافظ لكان أحسن، أو جمع بينهما فقدم ابن حبان ثم الحاكم.", "وقول الحاكم: (صحيح على شرط مسلم …) صحيح بالنسبة للإسناد الأول، وفيه نظر بالنسبة للإسناد الثاني، فإن الحارث بن عبد الله لم يخرج له مسلم، ولا أحد من أصحاب الكتب الستة، وقد ذكره ابن حبان في «الثقات» وقال: (مستقيم الحديث)، وقال الذهبي: (صدوق).", "وفي الإسناد هشيم، وهو ابن بشير، مدلس، وقد عنعنه، وقد نقل الحافظ عن الإمام أحمد أنه قال: (لم يسمع هشيم من عاصم بن كليب وذكر جماعة آخرين، وقد حدث عنهم).", "وقد حسن هذا الحديث الهيثمي وقال الألباني: (صحيح، لولا عنعنة هشيم)، وسكت عنه الحافظ في «البلوغ».", "وله شاهد من حديث أبي مسعود البدري رضي الله عنه في صفة صلاة النبي صلى الله عليه وسلم وفيه: (ثم ركع فجافى يديه، ووضع يديه على ركبتيه، وفرج بين أصابعه)."]}, "43": {"m": "وَعَنْ كَامِلٍ أَبِي العَلاءِ، عَنْ حَبِيبِ بْنِ أَبِي ثَابِتٍ، عَنْ سَعِيدِ بْنِ جُبَيْرٍ، عَنِ ابْنِ عَبّاسٍ رضي الله عنَهما: «أَنّ النّبِيّ صلى الله عليه وسلم كَانَ يَقُولُ بَيْنَ السّجْدَتَيْنِ: اللّهُمّ اغْفِرْلِي، وَارحَْمْنِي، وَاهْدِنِي، وَعَافِنِي، وَارْزُقْنِي» رَوَاهُ أبُودَاوُدَ، وَ ابْنُ مَاجَهْ، وَالتِرْمِذِيُّ، وَالحَاكِمُ - وَصَحّحَهُ -، وَهَذَا لَفْظُ أبِي دَاوُدَ وَالحَاكِمِ. وَعِنْدَ التِرْمِذِيِ، وَ ابْنِ مَاجَهْ: «وَاجْبُرِْني» بَدَلَ: «وَعَافِنِي». وَعِنْدَ ابْنِ مَاجَهْ أَيْضا: «وَارْفَعْنِي» بَدَلَ: «وَاهْدِنِي». وَقَالَ التِرْمِذِيُّ: «غَرِيبٌ، وَرَوَاهُ بَعْضُهُمْ عَنْ كَامِلٍ أَبِي العَلاءِ مُرْسَلا». وَقَدْ وَثّقَ كَامِلا ابْنُ مَعِينٍ، وَقَالَ النّسَائِيُّ: «لَيْسَ بِالقَوِي»ِ، وَقَالَ ابْنُ عَدِيٍ: «أَرْجُو أَنّهُ لَا بَأْسَ بِهِ، وَرَوَى هَذَا الحَدِيثَ وَلَفْظُهُ: اللّهُمّ اغْفِرْلِي، وَارْحَمْنِي، وَاجْبُرِْني، وَعَافِنِي، وَارْزُقْنِي، وَاهْدِنِي».", "w": ["قوله: (اغفر لي) فعل دعاء من: غفر يغفر غفرا، من باب «ضرب» وأصل الغفر: الستر والتغطية، والمغفرة من الله تعالى ستره للذنوب، ووقاية العبد آثامها، بعفوه عنها بفضله ورحمته.", "قوله: (وارحمني) فيه طلب رحمة الله عز وجل التي يتم بها حصول المطلوب، بعد أن سأل المغفرة التي يتم بها زوال المرهوب. والرحمة صفة من صفات الله تعالى تقتضي إنعامه وإحسانه على عبده من إيجاده، ثم هدايته في الدنيا إلى ما يصلحه، ثم إسعاده في الآخرة إن آمن واتقى، وكل ما لل تعالى على خلقه من الإحسان والإنعام فهو شاهد برحمة تامة وسعت كل شيء، فلا حدود ولا منتهى لرحمة الله تعالى.", "قوله: (واهدني) فعل دعاء يراد به طلب الهداية، والمعنى: دلني وألزمني، وهذا يشمل هداية الدلالة إلى طريق الحق والصواب، وهداية التوفيق للإيمان والعلم النافع والعمل الصالح.", "قوله: (وعافني) فعل دعاء يراد به طلب العافية، وذلك بأن يرفع الله عنه الأسقام والبلايا، فإن كان مريضا في بدنه فعليه أن يستحضر ذلك حال الدعاء، وأعظم الأمراض وأكثرها مرض القلوب إما بالشهوات المهلكة، أو بالشبهات المضلة، وذلك - والعياذ بالل - سبب شقاوة العبد، فعلى العبد أن يستحضر ذلك - أيضا ـ.", "قوله: (وارزقني) فعل دعاء يراد به طلب الرزق، وهو اسم عام لما يقوم به الدين من العلم والإيمان والعمل الصالح، وما يقوم به البدن من طعام وشراب ولباس وسكن، فعلى العبد أن يستحضر هذه المعاني العظيمة عند هذا الدعاء.", "قوله: (واجبرني) الجبر: مأخوذ من جبرت الوهن والكسر إذا أصلحته، فالجبر يكون من النقص الذي يعتري العبد في جميع أحواله، وهذا دعاء بالجبر الذي حقيقته إصلاح العبد ودفع جميع المكاره عنه، والله جل وعلا.", "يجبر ضعف الضعفاء من عباده، ويجبر كسر القلوب المنكسرة من أجله، الخاضعة لعظمته وجلاله، بما يفيض عليها من أنواع كراماته وأصناف المعارف والأحوال الإيمانية، ويجبر المصاب فيوفقه للثبات والصبر ويعوضه من مصابه أعظم الأجر إذا قام بواجب ذلك.", "قوله: (وارفعني) دعاء بطلب الرفعة، وهذا شامل للرفعة في الدنيا بعلو المنزلة والذكر الحسن، والرفعة في الآخرة بعلو المنزلة في الجنة."], "s": ["استدل الفقهاء بهذا الحديث على مشروعية هذا الدعاء في الجلسة بين السجدتين، وقد ورد في حديث حذيفة رضي الله عنه أنه صلى الله عليه وسلم كان يقول بين السجدتين: «رب اغفر لي، رب اغفر لي»، فالجلوس بين السجدتين محل دعاء، فينبغي للمصلي أن يدعو بهذا الدعاء المأثور، وإن أضاف إليه دعاء بسؤال الجنة أو النجاة من النار أو صلاح قلبه أو عمله أو صلاح المسلمين وما أشبه ذلك فلا بأس به.", "وقد جاء في بعض الروايات تقييده بصلاة الليل، وهذا لا ينفي مشروعية هذا الدعاء في الفريضة، لما تقدم من أن ما جاز في النفل جاز في الفرض، إلا ما دل الدليل على تخصيصه به، وقد حكى الترمذي ذلك عن الشافعي وأحمد وإسحاق، وقال: (إنهم يرون هذا جائزًا في المكتوبة والتطوع).", "وقد نص الفقهاء - ومنهم الحنابلة - على أن الواجب من ذلك مرة واحدة، والأفضل أن يكررها، لحديث حذيفة رضي الله عنه.", "والدعاء بما جاء في هذا الحديث يتضمن جلب خير الدنيا والآخرة، ودفع شر الدنيا والآخرة، فإن الرحمة تحصل الخير، والمغفرة تقي الشر، والهداية توصل إلى هذا وهذا، والرزق ما به قوام البدن والروح والقلب، كما تقدم."], "t": ["فقد أخرجه أبو داود (850) في كتاب «الصلاة»، باب «الدعاء بين السجدتين» والترمذي (٢8٤) وابن ماجه (898) والحاكم (١/ ٢6٢، ٢7١) من طريق كامل أبي العلاء، حدثني حبيب بن أبي ثابت، عن سعيد بن جبير، عن ابن عباس رضي الله عنهما أن النبي صلى الله عليه وسلم.. فذكره، وهذا لفظ أبي داود إلا أن فيه: (وعافني واهدني وارزقني) وعند الترمذي وابن ماجه: (واجبرني) بدل (عافني) وعند ابن ماجه: (وارفعني) بدل (اهدني) فتكون الكلمات بمجموع الروايات سبع كلمات.", "قال الحاكم: (هذا حديث صحيح الإسناد ولم يخرجاه، وكامل بن العلاء التميمي ممن يجمع حديثه).", "وقد تفرد أبو العلاء بهذا الحديث، وهو مختلف فيه، فقد وثقه ابن معين، ويعقوب بن سفيان، وقال ابن عدي: (أرجو أن لا بأس به)، وقال النسائي: (ليس بالقوي)، وقال في موضع آخر: (ليس به بأس)، وقال الحافظ في «التقريب»: (صدوق يخطئ)، وبقية رجاله رجال الشيخين."]}, "44": {"m": "وَعَنْ مَالِكِ بْنِ الحُوَيْرِثِ اللّيْثِيِ رضي الله عنه: «أَنّهُ رأََى النّبِيّ صلى الله عليه وسلم يُصَلِي، فَإِذَا كَانَ فِي وِتْرٍمِنْ صَلاتِهِ لَمْ يَنْهَضْ حَتّى يَسْتَوِيَ قَاعِدا» رَوَاهُ البُخَارِيُّ.", "s": ["الحديث دليل على مشروعية الجلوس قليلا إذا نهض من السجود إلى القيام عقب الفراغ من الركعة الأولى والثالثة، وهو المراد بقوله: (فإذا كان في وتر من صلاته..)، وتسمى هذه الجلسة جلسة الاستراحة، وهي جلسة لطيفة تسكن فيها حركة الجوارح سكونا بينا، كالجلوس بين السجدتين، وليس فيها ذكر ولا دعاء.", "وقد اختلف العلماء فيها هل هي من سنن الصلاة وهيئاتها كالتجافي وغيره، أو أنها لا تشرع إلا عند الحاجة، على قولين: الأول: أنها سنة من سنن الصلاة، وهذا هو المشهور عن الإمام الشافعي، ورواية عن الإمام أحمد، وانتصر له النووي، واختاره الشيخ عبد العزيز ابن باز لحديث مالك هذا، ولحديث أبي حميد الساعدي عندما وصف صلاة النبي صلى الله عليه وسلم في عشرة من الصحابة، فقد ورد فيه ثم عاد فسجد، ثم رفع رأسه، وقال: (الله أكبر، ثم ثنى رجله اليسرى، ثم قعد عليها حتى رجع كل عظم إلى موضعه، ثم قام …).", "فتكون هذه الجلسة ثبتت في المعنى عن أحد عشر صحابياً، أبو حميد وتسعة معه، ورواية مالك بن الحويرث التي معنا. وقد ورد ذكر جلسة الاستراحة في حديث المسيء صلاته من طريق ابن نمير، في حديث أبي هريرة رضي الله عنه وفيه: (ثم اسجد حتى تطمئن ساجدا، ثم ارفع حتى تطمئن جالسا، ثم اسجد حتى تطمئن ساجدا، ثم ارفع حتى تطمئن جالسا، ثم افعل ذلك في صلاتك كلها).", "ولو أخذ على ظاهره لدل على وجوب جلسة الاستراحة، وهذا لم يقل به أحد - كما ذكر الحافظ - لكن نبه البخاري على وهم هذه اللفظة، فإنه عقبه بقوله: قال أبو أسامة في الأخير: (حتى تستوي قائما)، وأخرجه البيهقي من طريق أبي أسامة بهذا اللفظ، وأشار إلى الوهم، ثم إن جلسة الاستراحة ليس فيها طمأنينة، فهذا مما يدل على ضعفها، وعلى فرض أن هذه اللفظة محفوظة فإنها تحمل على الجلوس للتشهد، فهو الذي يناسبه الطمأنينة، والله أعلم.", "القول الثاني: أنها ليست بسنة من سنن الصلاة، وإنما السنة أن ينهض على صدر قدميه ولا يجلس، وهذا القول حكاه ابن المنذر عن ابن مسعود وابن عمر وابن عباس رضي الله عنهم، وهؤلاء من أحرص الناس على مشاهدة أفعال النبي صلى الله عليه وسلم وهيئاته في الصلاة، وقد ساق ابن المنذر، ومن قبله ابن أبي شيبة ما ورد عن هؤلاء الصحابة رضي الله عنهم بأسانيد صحيحة.", "قال النعمان بن أبي عياش: أدركت غير واحد من أصحاب النبي صلى الله عليه وسلم، فكان إذا رفع رأسه من السجدة في أول ركعة والثالثة قام هو ولم يجلس.", "وهذا قول أبي حنيفة، ومالك، والمشهور من مذهب أحمد، وعزاه النووي إلى الكثيرين أو الأكثرين.", "وحملوا الأحاديث الواردة فيها على أنها فعلت بسبب الضعف للكبر، لا لأنها مقصودة للقربة، لأن مالك بن الحويرث إنما قدم على النبي صلى الله عليه وسلم بعد أن كبر صلى الله عليه وسلم، وذلك أثناء تجهزه لغزوة تبوك، وهي سنة تسع، فكان يجلس هذه الجلسة لكبره، فمع هذا الاحتمال لا تثبت المشروعية على وجه الإطلاق.", "قالوا: ولأنها لو كانت سنة دائمة لذكرها كل من وصف صلاة النبي صلى الله عليه وسلم لتوفر الهمم والدواعي على نقلها، ومن هؤلاء صحابة ملازمون للنبي صلى الله عليه وسلم، كما تقدم.", "وقد ذكر الأصوليون في مبحث الأفعال النبوية أن النبي صلى الله عليه وسلم قد يفعل العبادة بأجزائها الواجبة والمندوبة كالصلاة - مثلا - بيانا لقوله تعالى: {وأقيموا الصلاة} [البقرة: ٤٣]، ويفعل في أثنائها بعض الأفعال المباحة، كما وقع في الحج، ولذا قال أبو الحسن التميمي: (الذي انتهى إلي من قول أبي عبد الله - يعني الإمام أحمد - أن فعل النبي صلى الله عليه وسلم موقوف على ما يضامه من الدليل).", "وهذا كلام دقيق، فقد تكون جلسة الاستراحة مما فعله صلى الله عليه وسلم بياناً، وقد تكون من الأفعال المباحة للحاجة إليها - كما تقدم - ويكون دليل ذلك ما انضم إليه من أن واصفي صلاة النبي صلى الله عليه وسلم لم يذكروها.", "قال القاضي عياض بعد حكايته قول الشافعي المتقدم: (وقال مالك في كافة الفقهاء.. لا يجلس ولكن ينهض كما هو، وحملوا حديث ابن الحويرث على أنه كان من فعله عليه السلام ليدل على الجواز أو لشكوى).", "قال الحافظ قاسم بن قطلوبغا لما ذكر ما ورد عن الصحابة أنهم ينهضون على صدور أقدامهم: قال الشيخ الإمام مجد الدين عبد السلام بن تيمية الحراني في شرح «هداية أبي الخطاب»: (وقد أجمع الصحابة على ذلك، فلا جرم حمل حديث مالك بن الحويرث وما في معناه على ما ذكر القاضي رحمه الله عن كافة الفقهاء رحمهم الله).", "وقد اختار هذا القول جمع من أهل العلم منهم ابن القيم، والشيخ عبد الرحمن السعدي، والشيخ محمد بن إبراهيم. لكن من أخذ بالقول الأول وهو أنها سنة فله ذلك، إلا إذا كان مأموماً فإنه لا يجلس جلسة الاستراحة، بل يتابع إمامه فيقوم معه، لأن أفعال المأموم تقع بعد أفعال الإمام بدون مهلة، لقوله صلى الله عليه وسلم: «إذا ركع فاركعوا وإذا سجد فسجدوا وإذا كبر فكبروا …».", "ولهذا إذا ترك الإمام التشهد الأول وجب على المأموم متابعته في ترك الواجب، ولا يجوز له أن يتأخر عنه ليفعله، فإذا كان يتابعه في ترك الواجب فلأن يتابعه في ترك المستحب من باب أولى، قال شيخ الإسلام ابن تيمية: (الأقوى أن متابعة الإمام أولى من التخلف لفعل مستحب، والله أعلم)."]}, "45": {"m": "وَعَنْ أَبِي جَعْفَرٍالرّازِي،ِ عَنِ الرِّبيعِ بْنِ أَنَسٍَ، عَنْ أَنَسِ بْنِ مَالِكٍ رضي الله عنه قَالَ: «مَا زالَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَقْنُتُ فِي الفَجْرِحَتّى فَارَقَ الدُّنْيَا» رَوَاهُ أحْمَدُ، وَالدّارَقُطْنِيُّ، وَصَحّحَهُ الحَاكِمُ. وَ أَبُوجَعْفَرٍ: وَثّقَهُ غَيْرُوَاحِدٍ، وَقَالَ أَبُوزُرْعَةَ: «شَيْخٌ يَهِمُ كَثِيرا»، وَقَالَ الفَلاّسُ: «فِيهِ ضَعْفٌ، وَهُوَمِنْ أَهْلِ الصِدْقِ، سَيِئُ الحِفْظِ»، وَقَالَ النّسَائِيُّ: «لَيْسَ بِالقَوِي»ِ، وَقَالَ ابْنُ حِبّانَ: «يَنْفَرِدُ بِالمَنَاكِيرِعَنِ المَشَاهِيرِ».", "r": 46}, "46": {"m": "وَعَنْ سَعْدِ بْنِ طَارِقٍ الأَشْجَعِيِ قَالَ: «قُلْتُ لأَِبِي: يَا أَبَتِ! إِنّكَ قَدْ صَلّيْتَ خَلْفَ رَسُولِ اللَّهِ صلى اللهَ عليه وسلم، وَ أَبِي بََكْرٍ، وَعُمَرَ، وَعُثْمَانَ، وَعَلِيٍ هَاهُنَا بِالكُوفَةِ نَحْوا مِنْ خَمْسِ سِنِينَ؛ فَكَانُوا يَقْنُتُونَ فِي الفَجْرِ؟ قَالَ: أيْ بُنَيّ! مُحْدَثٌ» رَوَاهُ أحْمَدُ، وَ ابْنُ مَاجَهْ، وَالنّسَائِيُّ، وَالتِرْمِذِيُّ - وَصَحّحَهُ -. وَسَعْدٌ: رَوَى لَهُ مُسْلِمٌ. وَ أَبُوهُ طَارِقٌ رضي الله عنه: صَحَابِيٌّ مَعْرُوفٌ، وََلَا وَجْهَ لِقَوْلِ الخَطِيبِ: «فِي صُحْبَةِ طَارِقٍ نَظَرٌ».", "r": 47}, "47": {"m": "وَعَنْ أَنَسِ بْنِ مَالِكٍ رضي الله عنه: «أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَنَتَ شَهْرا بَعْدَ الرُّكُوعِ يَدْعُوعَلَى أَحْيَاءٍ مِنْ أَحْيَاءِ العَرَبِ، ثُمّ تَرَكَهُ» مُتّفَقٌ عَلَيْهِ.", "s": ["أ- الأحاديث الثلاثة دليل على مشروعية القنوت في النوازل، وقد نقل ابن منظور عن ابن سيده أنه قال: النازلة: الشدة من شدائد الدهر تنزل بالناس، نسأل الله العافية، وقد مثل لها العلماء بالزلازل والجدب والسيول والمجاعات ونحو ذلك، والظاهر أن هذه لا قنوت فيها، لأنها أمر نزل من الله تعالى، بل يشرع له ما دلت عليه السنة من صلاة الاستسقاء عند الجدب، وما ورد من بعض الآثار عن الصحابة رضي الله عنهم في الصلاة عند الزلزلة.", "وإنما يشرع القنوت عند تسلط الأعداء على المسلمين وديارهم، فيدعو لهم ويدعو على أعدائهم، لفعل النبي صلى الله عليه وسلم، فقد دعا النبي صلى الله عليه وسلم على من قتل القراء في بئر معونة، ودعا للمستضعفين من أهل مكة، كما ورد في حديث أبي هريرة رضي الله عنه قال: (كان رسول الله صلى الله عليه وسلم يقول حين يفرغ من صلاة الفجر من القراءة ويكبر ويرفع رأسه: «سمع الله لمن حمده، ربنا ولك الحمد»، ثم يقول وهو قائم: «اللهم أنج الوليد بن الوليد، وسلمة بن هشام، وعياش بن أبي ربيعة، والمستضعفين من المؤمنين، اللهم اشدد وطأتك على مضر، واجعلها عليهم كسني يوسف، اللهم العن لحيان ورعلاً وذكوان»).", "قال شيخ الإسلام ابن تيمية: (وينبغي للقانت أن يدعو عند كل نازلة بالدعاء المناسب لتلك النازلة، وإذا سمى من يدعو لهم من المؤمنين ومن يدعو عليهم من الكافرين المحاربين كان ذلك حسناً).", "فعلى الإمام في قنوت النازلة أن يلزم الاختصار وأن يدعو بالدعاء المناسب لذلك، وأن يبتعد عن الإطالة أو التفاصيل التي لا داعي لها، لأن ذلك أجمع للقلب، وأقرب إلى المراد، وأبعد عن المشقة على المأمومين.", "ب- الحديث دليل على أن القنوت يكون بعد الرفع من الركوع، وعلى هذا أكثر الأحاديث، ويجوز القنوت قبل الركوع، لما ورد عن أنس بن مالك رضي الله عنه وقد سئل عن القنوت بعد الركوع أو عند فراغه من القراءة؟ قال: (لا، بل عند الفراغ من القراءة).", "وعن أنس أنه سئل عن القنوت فقال: (قبل الركوع وبعده)، ومن أبواب البخاري باب (القنوت قبل الركوع وبعده).", "ولعل الحكمة - والله أعلم - في كون القنوت في حال الاعتدال دون حال السجود الذي هو مظنة الإجابة، لأن المطلوب في قنوت النازلة أن يشارك المأموم إمامه في الدعاء ولو بالتأمين، ولهذا اتفقوا على أنه يجهر به.", "ج- المتتبع للسنة يجد أن أكثر الأحاديث تدل على أنه صلى الله عليه وسلم كان يقنت عند الحاجة والنازلة في صلاة الفجر، وقد تقدم في حديث أنس في قصة القراء الذين قتلوا في بئر معونة (فدعا النبي صلى الله عليه وسلم شهرًا في صلاة الغداة). وكذا ورد في حديث ابن عمر رضي الله عنهما، وحديث أبي هريرة رضي الله عنه.", "وقد وقع الخلاف بين العلماء في هذه المسألة، وهي تعيين الصلاة التي يقنت فيها، والتحقيق في ذلك أنه يقنت بعد الرفع من الركوع في آخر ركعة من كل فريضة من الصلوات الخمس التي ورد القنوت فيها، لا سيما أول نزول النازلة، لأن الناس أحوج إلى كثرة الدعاء، فإذا خفت النازلة قنت في الفجر والمغرب، فإذا خفت قنت في الفجر، فإذا أقلعت أمسك عن القنوت. فقد ورد في حديث أنس رضي الله عنه أن النبي صلى الله عليه وسلم كان يقنت في صلاة المغرب والفجر، وعن أبي هريرة رضي الله عنه قال: (لأقربن لكم صلاة رسول الله صلى الله عليه وسلم، فكان أبو هريرة يقنت في الركعة الأخيرة من صلاة الظهر والعشاء الأخيرة، وصلاة الصبح بعدما يقول: «سمع الله لمن حمده»، فيدعو للمؤمنين، ويلعن الكفار).", "د- حديث أبي مالك الأشجعي فيه دليل على أن الاستمرار في القنوت في صلاة الفجر محدث وليس بمشروع، وإنما يفعل ذلك عند الحاجة في بعض الأحيان، لأن أباه قد صلى خلف النبي صلى الله عليه وسلم وهو ابن عشر سنين، وصلى وراء الخلفاء الراشدين رضي الله عنهم ولم يسمع أحداً منهم يقنت في الفجر بغير سبب، ولو كان سنة راتبة لكانت الهمم والدواعي متوفرة على نقله، ولم يتركه الصحابة رضي الله عنهم، ولا سيما الخلفاء الراشدون الذين يؤمون الناس، فمثل ذلك لا يخفى.", "وما ورد من أحاديث تدل على المداومة فهي ضعيفة لا تقوم بها حجة، ثم هي معارضة بما هو أقوى منها، والله تعالى أعلم."], "t": ["حديث أنس الأول: أخرجه من ذكرهم المصنف من طريق أبي جعفر الرازي، عن الربيع بن أنس، عن أنس بن مالك رضي الله عنه به، ولفظ أحمد: (ما زال رسول الله صلى الله عليه وسلم يقنت في الفجر حتى فارق الدنيا).", "وعند الدارقطني: قال الربيع بن أنس: (كنت جالساً عند أنس بن مالك فقيل له: إنما قنت رسول الله صلى الله عليه وسلم شهرًا، فقال: ما زال رسول الله يقنت الغداة حتى فارق الدنيا)، وهذا الحديث ضعيف، لأن فيه ثلاث علل:", "الأولى: سوء حفظ أبي جعفر الرازي، وهو عيسى بن ماهان، قال ابن حجر في «التقريب»: (صدوق سيئالحفظ).", "الثانية: أن الربيع بن أنس البكري صدوق له أوهام، كما قال الحافظ في «التقريب»، قال ابن حبان: (الناس يتقون من حديثه ما كان من رواية أبي جعفر عنه، لأن في حديثه اضطراباً كثيرًا).", "الثالثة: نكارته؛ لمخالفته ما ثبت في الصحيحين، كما في حديث أنس الآخر الدال على أنه صلى الله عليه وسلم قنت شهرًا يدعو على أحياء من أحياء العرب ثم تركه، فيكون متنه مخالفاً لرواية الثقات ممن هم أكثر عدداً، وأوثق رواية، وهم الذين نفوا قنوته صلى الله عليه وسلم على الدوام.", "وأما حديث سعد بن طارق فقد أخرجه من ذكرهم المصنف من طريق يزيد بن هارون، عن أبي مالك الأشجعي، سعد بن طارق قال: قلت لأبي.. فذكره، وقال الترمذي: (حديث حسن صحيح)."]}, "48": {"m": "وَعَنِ الحَسَنِ بْنِ عَلِيٍ رضي الله عنهما قَالَ: «عَلّمَنِي رَسُولُ اللَّهِ صلى الله عليه وسلم كَلِمََاتٍ أَقُولُهُنّ فِي قُنُوتِ الوِتْرِ: اللّهُمّ اهْدِنِي فِيمَنْ هَدَيْتَ، وَعَافِنِي فِيمَنْ عَافَيْتَ، وَتَوَلّنِي فِيمَنْ تَوَلّيْتَ، وَبَارِكْ لِي فَِيمَا أعْطَيْتَ، وَقِنِي شَرَّ مَا قَضَيْتَ، فَإِنّكَ تَقْضِي وََلَا يُقْضَى عَلَيْكَ، إِنّهُ لَا يَذِلُّ مَنْ وَالَيْتَ، تَبَارَكْتَ رَبّنَا وَتَعَالَيْتَ» رَوَاهُ أحْمَدُ - وَهَذَا لَفْظُهُ -، وَ أبُو دَاوُدَ، وَ ابْنُ مَاجَهْ، وَالنّسَائِيُّ، وَالتِرْمِذِيُّ - وَحَسّنَهُ -. وَهُوَ مِمّا أُلْزِمَ الشّيْخَانِ تَخْرِيجَه. وَرَوَاهُ البَيْهَقِيُّ، وَزَادَ فِيهِ - فِي بَعْضِ رِوَ ايَاتِهِ - بَعْدَ: «وَالَيْتَ»: «وََلَا يَعِزُّمَنْ عَادَيْتَ».", "s": ["استدل بهذا الحديث من قال: بمشروعية القنوت في صلاة الوتر واستحبابه فيه، وأن يدعو بهذا الدعاء الجامع لخيري الدنيا والآخرة، ويدعو به الإمام بصيغة الجمع، مراعاة لحال المأمومين وتأمينهم عليه.", "ويصلي على النبي صلى الله عليه وسلم في آخر دعائه، وهذا وإن لم يثبت في دعاء القنوت متصلا به؛ فقد ثبت ذلك عن بعض الصحابة رضي الله عنهم.", "فقد أخرج إسماعيل القاضي بسنده عن عبد الله بن الحارث أن أبا حليمة - معاذ الأنصاري - كان يصلي على النبي صلى الله عليه وسلم في القنوت.", "وكذا ورد عن أبي بن كعب عندما صلى بالناس قيام رمضان في عهد عمر رضي الله عنه أنه صلى على النبي صلى الله عليه وسلم في آخر القنوت.", "وإن زاد الإمام بعض الأدعية المأثورة فحسن، وإن دعا بما يناسب بعض الأحوال العارضة، كالاستغاثة حال الجدب، أو الدعاء بنصرة المسلمين عند تسلط الأعداء، ونحو ذلك جاز، لكن على الإمام في دعاء القنوت في رمضان مراعاة ثلاثة أمور:", "الأول: أن يحرص على الأدعية الواردة في الكتاب والسنة، وأن يجتنب السجع المتكلف، والدعاء المخترع، والتفاصيل الدقيقة التي تجعل الدعاء إلى الوعظ والترهيب أقرب، وعليه أن يختار الجوامع من الأدعية، لقول عائشة رضي الله عنها: (كان رسول الله صلى الله عليه وسلم يستحب الجوامع من الدعاء، ويدع ما سوى ذلك)، وإن بدأه بحمد الله تعالى والثناء عليه، ثم الصلاة على النبي صلى الله عليه وسلم فهو أولى، لحديث فضالة بن عبيد رضي الله عنه قال: (سمع رسول الله صلى الله عليه وسلم رجلاً يدعو في صلاته لم يمجد الله تعالى، ولم يصل على النبي صلى الله عليه وسلم، فقال رسول الله صلى الله عليه وسلم: «عَجِلَ هذا»، ثم دعاه فقال له أو لغيره: «إذا صلى أحدكم فليبدأ بتحميد ربه جل وعز والثناء عليه، ثم يصلي على النبي صلى الله عليه وسلم ثم يدعو بعد بما شاء».", "الثاني: ألا يطيل إطالة تشق على المأمومين، تؤدي إلى فتورهم وتسبب شكواهم، وقد قال النبي صلى الله عليه وسلم لمعاذ رضي الله عنه لما أطال في صلاة الفريضة: «أفتان أنت يا معاذ»؟ فكيف بالإطالة في دعاء القنوت، بل في أدعية مخترعة وأساليب مسجوعة؟!.", "الثالث: أن يدعو الإمام بصوته المعتاد؛ فإنه أقرب إلى الإخلاص والتضرع، وأعظم في الأدب والتعظيم، وأدل على إحساس الداعي بقربه من ربه، وعليه أن يبتعد عن كل ما ينافي الضراعة والابتهال، أو يدعو إلى الرياء والإعجاب وتكثير المصلين خلفه من التلحين والتطريب أو التمطيط أو تصنع البكاء ونحو ذلك.", "واعلم أنه لم يصح عنه صلى الله عليه وسلم أنه قنت في الوتر. وإنما أخذت سنية القنوت من تعليم النبي صلى الله عليه وسلم الحسن بن علي رضي الله عنهما الدعاء المأثور، كما تقدم - على القول بثبوت لفظة: (قنوت الوتر) - ولهذا لا ينبغي للإنسان أن يداوم عليه.", "قال الحافظ ابن حجر: (قال الخلال عن أحمد: لا يصح فيه عن النبي صلى الله عليه وسلم شيء، ولكن عمر كان يقنت)، وقال الإمام ابن خزيمة: (ولست أحفظ خبرًا ثابتاً عن النبي صلى الله عليه وسلم في القنوت في الوتر …).", "وعلى هذا فمداومة أئمة المساجد على القنوت في رمضان بحيث لا يتركونه إلا قليلاً يحتاج إلى دليل، والله تعالى أعلم."], "t": ["حديث الحسن بن علي رضي الله عنهما فقد أخرجه أصحاب السنن وأحمد من طريق أبي إسحاق، عن بريد بن أبي مريم، عن أبي الحوراء السعدي قال: (قال الحسن بن علي: … فذكره).", "وإسناده صحيح، رجاله كلهم ثقات، قال الترمذي: (هذا حديث حسن لا نعرفه إلا من هذا الوجه.. ولا نعرف عن النبي صلى الله عليه وسلم في القنوت في الوتر شيئاً أحسن من هذا).", "لكن طعن بعض الحفاظ كابن خزيمة في لفظة: (في قنوت الوتر) وذلك لأن شعبة رواه عن بريد بن أبي مريم كما في ولم يذكر القنوت ولا الوتر، ولفظه: (كان يعلمنا هذا الدعاء: اللهم اهدني فيمن هديت …)، وشعبة أوثق من كل من رواه عن بريد، كأبي إسحاق وابنه يونس، وعلى قاعدة المحققين في زيادة الثقة يحكم على هذه اللفظة بالشذوذ، ولا يكون هذا الدعاء مختصاً بالقنوت.", "وأخرجه الطبراني من طريق عمرو بن مرزوق، عن شعبة به، بزيادة: (ولا يعز من عاديت)، وهي زيادة شاذة تفرد بها عمرو بن مرزوق عن جميع من رووه عن شعبة."]}, "49": {"m": "وَعَنِ ابْنِ عُمَرَ رضي الله عنهما: «أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ إِذَا قَعَدَ لِلتّشَهُّدِ وَضَعَ يَدَهُ اليُسْرَى عَلَى رُكْبَتِهِ اليُسْرى، وَوَضَعَ يَدَهُ اليُمْنَى عَلَى رُكْبَتَِهِ اليُمْنَى، وَعَقَدََ ثَلاثَةا وَخَمْسِينَ، وَأشَارَبِإِصْبَعِهِ - بِالسّبّابَةِ -». وَفِي رِوَ ايَةٍ: «وَضَعَ كَفّهُ اليُمْنَى عَلَى فَخِذِهِ اليُمْنَى، وَقَبَضَ أصَابِعَهُ كُلّهَا، وَأشَارَبِإِصْبَعِهِ الّتِي تَلِي الإِبْهَامَ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (وعقد ثلاثة وخمسين) صورة هذا العقد أن يقبض الخنصر مع البنصر إلى الراحة قبضاً متساوياً، ويحلق حلقةً بالوسطى مع الإبهام، وهذه طريقة حسابية معروفة عند العرب، فالثلاثة لها حلقة بين الإبهام والوسطى، والخمسين يقبض لها الخنصر والبنصر.", "قوله: (وأشار بإصبعه السبابة) الإصبع: بكسر الهمزة وفتح الباء على المشهور، والسبابة: هي الإصبع التي تلي الإبهام، سميت بذلك لأنهم كانوا يشيرون بها عند السب والمخاصمة، وتسمى أيضا: المسبحة والسباحة؛ لأنه يشير بها المسبح عند التهليل إشارة إلى التوحيد.", "قوله: (وقبض أصابعه كلها) أي: أصابع يده اليمنى، والمراد قبضها على الراحة.", "قوله: (وأشار بالتي تلي الإبهام) أي: الإصبع التي تلي الإبهام، وهي السبابة، وهذا وصف كاشف لتحقيق السبابة."], "s": ["أ- الحديث دليل على صفة اليدين حال جلوس التشهد، وأن المصلي يضع يده اليمنى على فخذه اليمنى، ويده اليسرى على اليسرى، أما هيئة الأصابع فإن أصابع اليمنى لها صفتان، كما في حديث ابن عمررضي الله عنهما برو ايتيه:", "الأولى: أن يقبض الخنصر والبنصر، ويحلق حلقة بالوسطى مع الإبهام ويرفع السبابة يدعو بها.", "الثانية: أن يقبض الخنصر والبنصر والوسطى، ويضم إليها الإبهام، وتبقى السبابة مرفوعة يدعو بها.", "أما أصابع اليسرى فإنها تكون مبسوطة مضمومة غير مفرجة، وأطرافها إلى القبلة، وقد ورد في حديث ابن عمر رضي الله عنهما من طريق معمر، عن عبيد الله بن عمر، عن نافع، عن ابن عمر، وفي آخره: (ويده اليسرى على ركبته اليسرى باسطها عليها).", "والصفة الثانية لأصابع اليسرى: أن يعطف أصابعها على الركبة، لحديث عبد الله بن الزبير قال: (كان رسول الله صلى الله عليه وسلم إذا قعد يدعو وضع يده اليمنى على فخذه اليمنى، ويده اليسرى على فخذه اليسرى، وأشار بإصبعه السبابة، ووضع إبهامه على إصبعه الوسطى، ويلقم كفه اليسرى على ركبته).", "ب- الحديث دليل على أن المصلي يرفع سبابته يشير بها، ولعل الحكمة في ذلك - والله أعلم - أن يجمع في توحيده بين القول والفعل والاعتقاد، وقد روى نافع قال: كان ابن عمر رضي الله عنهما إذا جلس في الصلاة وضع يديه على ركبتيه، وأشار بإصبعه، وأشبعها بصره، ثم قال: قال رسول الله صلى الله عليه وسلم: «لهي أشد على الشيطان من الحديد» يعني السبابة. لكن إذا أشار بها هل يحركها أو لا؟ اختلفت الأحاديث في هذا، ففي حديث وائل بن حجر: (ثم رفع إصبعه فرأيته يحركها، يدعو بها).", "وقد نص ابن خزيمة على أنه ليس في شيء من الأخبار يحركها، إلا في هذا الخبر، زائدة ذكره، وعليه فهو لفظ شاذ، انفرد به زائدة بن قدامة من بين أصحاب عاصم بن كليب، وعدها بعض العلماء من زيادة الثقة، وقد قال عنه الحافظ في «التقريب»: (ثقة ثبت)، ومن هؤلاء الألباني، وهذا هو الذي يشعر به صنيع الإمام البيهقي، فإنه قال: (يحتمل أن المراد بالتحريك: الإشارة، لا تكرير تحريكها)، ومعلوم أن التأويل فرع التصحيح، وإلا لبادر بالحكم عليها بالشذوذ، وقد أفتى بمقتضاها الشيخ عبد العزيز بن باز.", "لكن قد يقال: إن زائدة بن قدامة قد انفرد بهذه اللفظة من بين أصحاب عاصم بن كليب، وهم ثقات أثبات، يزيدون على عشرة أنفس، كلهم يقتصر على ذكر الإشارة بالسبابة دون تحريكها، مما يدل على أن زائدة وهم فيها، ثم إن روايتهم مؤيدة بالأحاديث الصحيحة التي فيها الإشارة بالسبابة بدون تحريك، وفي حديث ابن الزبير: (وكان يشير بإصبعه إذا دعا، ولا يحركها)، وكذا ورد في حديث ابن عمر عند مسلم بلفظ: (ورفع إصبعه اليمنى التي تلي الإبهام فدعا بها)، وعليه فالثابت هو رفع السبابة أو الإشارة بها، كما في صحيح مسلم، وأما التحريك نفياً أو إثباتاً فلم يثبت منه شيء، إلا على قول من أخذ بزيادة (يحركها) في حديث وائل كما تقدم، بناء على قاعدة المثبت مقدم على النافي، وعلى قاعدة الأخذ بزيادة الثقة مطلقاً، ولو خالف العدد الكثير.", "وقد قال بعدم تحريكها الحنابلة - في الصحيح من المذهب - وكذا الشافعية، وهو قول الحنفية، واختاره بعض المالكية، ومنهم: ابن رشد، وابن العربي، واختاره ابن حزم.", "والقول الثاني: مشروعية تحريك الإصبع، وهو قول بعض الشافعية والحنابلة، والمالكية، وبه قال ابن القيم، والألباني، وابن باز، وابن عثيمين، واستدلوا بحديث وائل، و أيدوا ذلك بأمورثلاثة:", "١ - أن وائل بن حجر له عناية خاصة بنقل صفة صلاة النبي صلى الله عليه وسلم، ولا سيما جلوس التشهد، فإنه ذكر مكان المرفق على الفخذ وصفة أصابع اليد اليمنى ورفع السبابة وغير ذلك.", "٢ - أن زائدة بن قدامة ثقة ثبت شديد التثبت في روايته عن شيوخه، قال عنه ابن حبان: (كان من الحفاظ المتقنين، وكان لا يعد السماع حتى يسمعه ثلاث مرات، وكان لا يحدث أحداً حتى يشهد عنه عدل أنه من أهل السنة)، وقال الدارقطني: (من الأثبات الأئمة)، وهو وإن خالفه الأكثر فقد تكون هذه الزيادة منه تفسيرًا للإشارة الواردة في الروايات الأخرى.", "٣ - أن التعبير بالمضارع (يشير بها) قد يستفاد منه التحريك، لأنه يفيد التجدد والحدوث، ثم إن الإشارة نفسها لا تنافي التحريك كما يفهم من معاجم اللغة.", "والقول الثالث: جواز الأمرين: التحريك، أو الإشارة بدون تحريك، لأن كُلاً منهما ورد في الآثار الصحاح المسندة عن النبي صلى الله عليه وسلم، واختار ذلك القرطبي والصنعاني.", "والذي تبين من بحث هذه المسألة أن تحريك السباحة تفرد به زائدة بن قدامة، فمن أخذ بها مشى على قاعدة قبول الزيادة إذا كانت من عدل حافظ متقن ضابط، كزائدة بن قدامة، ومن ردها مشى على قاعدة: قبول الزيادة وردها متوقف على القرائن، ومنها: كثرة العدد، وقد خالف - هنا - زائدة بن قدامة الجم الغفير من الأئمة الثقات عن عاصم بن كليب، فلم يذكرها أحد منهم، مما يدل على أنه قد وهم فيها.", "ج- دل قوله: (كان إذا قعد للتشهد …)، أن هذه الصفة في اليد اليمنى، وهي القبض والتحليق خاصة بجلوس التشهد، دون الجلسة بين السجدتين، وهذا هو الذي فهمه العلماء المتقدمون، فلم يقل بمشروعيتها فيها أحد من السلف، ولم يعقد لها أي ترجمة في كتب الحديث، ولم يرد لها ذكر في كتب الفقه، وهذا يدل على أنه لم يرد نص صريح في مشروعيتها، وما ورد من نصوص عامة فهي من العام الذي أريد به الخصوص، أو أنها من باب حمل المطلق على المقيد، وما أحسن ما قاله ابن رشيد رحمه الله: (إذا أطلق في الأحاديث الجلوس في الصلاة من غير تقييد فالمراد جلوس التشهد)، ويؤيد ذلك بعض روايات حديث ابن الزبير رضي الله عنه قال: (كان إذا جلس في اثنتين أو في الأربع يضع يديه على ركبتيه، ثم أشار بإصبعه)، فقيد الإشارة في جلسة التشهد الأول والأخير، فدل على عدم الإشارة في غير ذلك.", "ومن قال بها من المتأخرين أخذ بظاهر كلام لابن القيم، واستدل بعموم الأحاديث التي ورد فيها تحريك السبابة في الجلوس في الصلاة، كما في حديث وائل، وفيه: (ثم جلس، فافترش رجله اليسرى، ثم وضع يده اليسرى على ركبته اليسرى، وذراعه اليمنى على فخذه اليمنى، ثم أشار بسبابته ووضع الإبهام على الوسطى، حلق بها، وقبض سائر أصابعه، ثم سجد …) والله تعالى أعلم."]}, "50": {"m": "وَرَوَى عَنْ عَبْدِ اللَّهِ بْنِ الزَُّبيْرِرضي الله عنهما قَالَ: «كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِذَا قَعَدَ فِي الصّلاةِ جَعَلَ قَدَمَهُ اليُسْرى بَيَْنَ فَخِذِهِ وَسَاقِهِ، وَفَرَشَ قَدَمَهُ اليُمْنَى. وَوَضَعَ يَدَهُ اليُسْرى عَلَى رُكْبَتِهِ اليُسْرى، وَوَضَعَ يَدَهُ اليُمْنَى عَلَى فَخِذِهِ اليُمْنَى، وَأشَارَبِإِصْبَعِهِ السّبّابَةِ، وَوَضَعَ إِبْهَامَهُ عَلَى إِصْبَعِهِ الوُسْطَى.", "w": ["قوله: (إذا قعد في الصلاة)؛ أي: شرع في القعود للتشهد في صلاته، وفي رواية ابن عجلان المذكورة: «إذا قعد يدعو»؛ أي: يتشهد.", "قوله: (جعل قدمه اليسرى بين فخذه وساقه، وفرش قدمه اليمنى) الفعل (فرش) من باب (قتل) وفي لغة من باب (ضرب)؛ أي: بسط. والمعنى: لم ينصب قدمه اليمنى كما هو المعروف فيها، وإنما فرشها على الأرض؛ أي: بسطها، فجعل ظهرها على الأرض، وجعل قدمه اليسرى بين فخذه وساقه، ومقعدته على الأرض، وهذا هو ظاهر الحديث. وهذه الصفة مخالفة للصفة المشهورة في التورك، وهي نصب اليمنى، وإخراج اليسرى تحتها من جانبه الأيمن، والحق أن هذا لا ينافي ما ثبت في الروايات الأخرى التي ذكر فيها نصب اليمنى؛ لاحتمال أنه ﷺ فعل هذا الافتراش لبيان الجواز. قال ابن القيم: (ولعله كان يفعل هذا تارة، وهذا تارة، وهذا أظهر، ويحتمل أن تكون من اختلاف الرواة). فإن قيل بالترجيح، فالذي يظهر ـ والله أعلم ـ أن المعوَّل على ما في «الصحيح»."], "s": ["أ- في الحديث بيان لصفة الجلوس للتشهد الأخير، وذلك بأن يجعل قدمه اليسرى بين فخذه وساقه. ويفرش اليمنى، وهذه صفة من صفات التورك، وفيها ما تقدم. والصفة الثانية: أن ينصب قدمه اليمنى، ويجعل باطن رجله اليسرى تحت ساقه اليمنى، ويفضي بوركه الأيسر إلى الأرض، وهي أوضح صفات التورك، وهذه دل عليها حديث أبي حميد الساعدي. والصفة الثالثة: أن يفرش اليمنى واليسرى، ويخرجهما عن يمينه، ويجلس بأليتيه على الأرض، وهذا عند أبي داود من حديث أبي حميد ـ أيضاً ـ. والفرق بين هذه والتي قبلها أن القدم اليمنى في هذه الصفة مفروشة، وفي التي قبلها منصوبة. أما اليسرى فهي تحت ساقه. والأظهر أن هذه الصفات الثلاث كلها سنَّة، فيعمل بها في أوقات مختلفة، وهذا مذهب الحنابلة، واختاره القرطبي وابن القيم، والشوكاني.", "ب- في الحديث دليل على استحباب وضع اليد اليسرى على الركبة اليسرى، وفي رواية ابن عجلان: «ويلقم كفه اليسرى ركبته»؛ أي: يدخل ركبته في راحة كفه اليسرى حتى صارت ركبته كاللقمة في كفه، وهذا لا ينافي صفة الوضع، بل يفعل هذا تارة وهذا تارة، كما تقدم.", "ج- في الحديث دليل على استحباب وضع اليد اليمنى على الركبة اليمنى."]}, "51": {"m": "وَعَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ رضي الله عنه قَالَ: «كُنّا إِذَا صَلّيْنَا خَلْفَ النّبِيِ صلى الله عليه وسلم قُلْنَا: السّلامُ عَلَى جِبْرِيلََ وَمِيكَائِيلَ، السّلامُ عَلَى فُلانٍ وَفُلانٍ. فَالْتَفَتَ إِلَيْنَا رَسُولُ اللَّهِ صلى اللهَ عليه وسلم فَقَالَ: إِنّ اللَّهَ هُوَالسّلامُ، فَإِذَا صَلّى أحَدُكُمْ فَلْيَقُلِ: التّحِيّاتُ للَّهِِ، وَالصّلَوَاتُ،َ وَالطّيِبَاتُ. السّلامُ عَلَيْكَ أيُّهَا النّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ. السّلامُ عَلَيْنَا وَعَلَى عِبَادِ اللَّهِ الصّالِحِينَ - فَإِنّكُمْ إِذَا قُلْتُمُوهَا أصَابَتْ كُلّ عَبْدٍ صَالِحٍ فِي السّمَاءِ وَالأَرْضِ -. أَشهَدُ أَن لا إِلَهَ إِلاَّ اللَّهَُّ، وََأشهَدُ أَنَّ مُحَمَّداً عَبدُهُ وَرَسُوُلهُ. ثُمَّ ليَتَخَيَّر مِنَ الدُّعَاءِ أَعجَبَهُ إِلَيهِ فَيَدعُو» مُتَّفَق عَلَيهِ، وَاللَّفظُ لِلبُخَارِيّ.ِ وَلَهُ أَيضاً قَالَ: «كُنَّا إِذَا كُنَّا مَعَ النَّبِيِّ صلى الله عليه وسلم فِي الصَّلاةِ قُلنَا: السَّلامُ عَلَى اللَّهَِّ مِن عِبَادِهِ، السَّلامُ عَلَى فُلانٍ وَفُلانٍ، فَقَالَ النَّبِيُّ صلى الله عليه وسلم: لا تَقُوُلوا: السَّلامُ عَلَى اللَّهَِّ؛ فَإِنَّ اللَّهََّ هُوَ السَّلامُ».", "s": ["أ- الحديث دليل على وجوب التشهد في آخر الصلاة، لقوله: (إذا صلى أحدكم فليقل التحيات..) وهذا أمر، والأصل فيه الوجوب، ولقول ابن مسعود رضي الله عنه: (قبل أن يفرض علينا التشهد) وهو ركن من أركان الصلاة، وهذا بالنسبة للتشهد الأخير، أما الأول فليس بركن، بدليل أن النبي صلى الله عليه وسلم عندما نسيه جبره بسجود السهو، وهذا هو المشهور عند الفقهاء.", "ب- ورد في السنة صيغ كثيرة للتشهد، عن ابن مسعود وابن عباس وعائشة وابن عمر وغيرهم رضي الله عنهم وليس بينها إلا اختلاف يسير، وبأي تشهد تشهد مما صح عن النبي صلى الله عليه وسلم جاز، نص الإمام أحمد على ذلك، وقد أثنى العلماء على تشهد ابن مسعود، لأنه متفق عليه، قال البزار: (أصح حديث في التشهد عندي حديث ابن مسعود، روي عنه من نيف وعشرين طريقاً …) ثم سرد أكثرها، وقال: (لا أعلم في التشهد أثبت منه ولا أصح أسانيد ولا أشهر رجالا …)، قال الحافظ: (ولا خلاف بين أهل الحديث في ذلك).", "وقد اعتنى النبي صلى الله عليه وسلم بهذا التشهد وعلمه ابن مسعود ولقنه إياه كما يلقنه السورة من القرآن، كما ورد في بعض الروايات، وذلك لما يشتمل عليه من تعظيم الله تعالى وتمجيده والإخلاص له والشهادة بوحدانيته وصدق رسوله صلى الله عليه وسلم والتسليم والترحم والتبريك عليه صلى الله عليه وسلم وما يتضمنه من السلام الخاص بالمصلي والأمة الإسلامية وجميع عباد الله الصالحين في السماء والأرض.", "ج- الحديث دليل على أن للمصلي أن يدعو في آخر التشهد بما أحب لقوله: (ثم ليتخير من الدعاء أعجبه) فهو إطلاق للداعي أن يدعو بما أراد، وأفضل ذلك الأدعية الواردة في هذا الموضع، وله أن يدعو بما أحب من خيري الدنيا والآخرة، فإن الدعاء عموما عبادة.", "د- ظاهر الحديث أن الأمر بالدعاء بعد التشهد كان قبل فرض الصلاة على النبي صلى الله عليه وسلم في التشهد، لأن الأحاديث دلت على أن الصلاة مقدمة على الدعاء، كما سيأتي إن شاء الله، والله تعالى أعلم."]}, "52": {"m": "وَقَالَ عُمَرُرضي الله عنه: «لَا تَجُوزُصَلاةٌ إِلَاّ بِتَشَهُّدٍ» رَوَاهُ سَعِيدٌ، وَغَيْرُهُ.", "s": ["يستدل الفقهاء بهذا الأثر على وجوب التشهد الأخير في الصلاة، وهذا لا يكون حجة إلا على رأي من يقول: إن قول الصحابي حجة؛ لأنه قد يكون رأياً للصحابي لا رواية، والحجة على أن التشهد واجب هو حديث ابن مسعود مرفوعاً، وفيه: «إذا صلى أحدكم فليقل: التحيات لل...» الحديث، وعند النسائي: «كنا نقول في الصلاة قبل أن يفرض علينا التشهد: السلام على الله... الحديث»، والله تعالى أعلم."], "t": ["هذا الأثر رواه سعيد بن منصور ـ كما ذكر المؤلف ـ من طريق شعبة، قال: سمعت مسلماً أبا النظر الشامي، قال: سمعت حُملَةَ بن عبد الرحمن قال: «سمعت عمر بن الخطاب يقول: لا تجوز صلاة إلا بتشهد». ولفظه عند البخاري في «تاريخه»: «لا صلاة إلا بتشهد». ومسلم بن عبد الله أبو النظر الشامي ذكره ابن أبي حاتم، وكذا حُملَة بن عبد الرحمن العكي، ولم يذكر فيهما جرحاً ولا تعديلاً. أما ابن حبان، فقد ذكرهما في «الثقات»، ونقل الذهبي في «الميزان» في ترجمة «حملة» عن ابن خزيمة قوله فيهما: (لست أعرفهما)، وهذا الأثر ذكره المجد ابن تيمية في «المنتقى»، كما فعل المؤلف هنا."]}, "53": {"m": "وَعَنْ فَضَالَةَ بْنِ عُبَيْدٍ رضي الله عنه قَالَ: «سَمِعَ رَسُولُ اللَّهِ صلى الله عليه وسلم رجَُلا يَدْعُو فِي صَلاتِهِ؛ لَمْ يُمََجِدِ اللَّهَ وَلَمْ يُصَلِ عََلَى النّبِيِ صلى الله عليه وسلم. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: عَجِلَ هَذَا. ثُمّ دَعَاهُ فَقَالَ لَهُ - أوْ لِغَيْرِهِ -: إِذَا صََلّى أحَدَُكُمْ؛ فَلْيَبْدَأْ بِتَمْجِيدِ رَِبهِ وَالثّنَاءِ عَلَيْهِ، ثُمّ يُصَلِي عَلَى النّبِيِ صلى الله عليه وسلم، ثُمّ يَدْعُو بَعْدُ بِمَا شَاءَ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ - وَهَذَا لَفْظُهُ -، وَالنّسَائِيُّ، وَالتِرْمِذِيُّ - وَصَحّحَهُ -، وَ ابْنُ حِبّانَ، وَالحَاكِمُ - وَقَالَ: «صَحِيحٌ عَلَى شَرْطِ مُسْلِمٍ»، وَفِي مَوْضِعٍ: «عَلَى شَرْطِهِمَا» -. وَفِي لَفْظِ بَعْضِهِمْ: «إِذَا صَلّى أَحَدُكُمْ؛ فَلْيَبْدَأْ بِتَحْمِيدِ اللَّهِ وَالثّنَاءِ عَلَيْهِ، ثُمّ لْيُصَلِ عَلَى النّبِيِ صلى الله عليه وسلم».", "s": ["الحديث دليل على أدب من آداب الدعاء، وهو تقديم الحمد والثناء على الله تعالى، والصلاة على النبي صلى الله عليه وسلم ثم الدعاء بما شاء، وهذا الأدب متحقق في التشهد، كما في حديث ابن مسعود وغيره، فإن أحاديث التشهد تتضمن ما ذكر من الحمد والثناء في أول التشهد، ثم الصلاة على النبي صلى الله عليه وسلم، ثم الدعاء بعد ذلك، والدعاء بهذه الصفة أفضل وأقرب إلى الإجابة.", "وظاهر سياق المصنف لهذا الحديث في هذا الموضع أن هذا الدعاء الذي سمعه الرسول الله صلى الله عليه وسلم من هذا الرجل كان في جلوس التشهد، قال ابن القيم: (لأنه ليس في الصلاة موضع يشرع فيه الثناء على الله ثم الصلاة على رسوله، ثم الدعاء إلا في التشهد آخر الصلاة، فإن ذلك لا يشرع في القيام ولا في الركوع ولا السجود اتفاقاً، فعلم أنه إنما أراد به آخر الصلاة حال الجلوس في التشهد).", "ولا مانع من الأخذ بعمومه في كل دعاء سواء كان ذلك في الصلاة أو خارجها، ولا سيما حال السجود إذا طال كما في صلاة التهجد.", "وقد ذكر المجد ابن تيمية أن في هذه الأحاديث حجة لمن لا يرى الصلاة على النبي صلى الله عليه وسلم فرضاً في التشهد، حيث لم يأمر تاركها بالإعادة، ويعضده قوله - في حديث ابن مسعود بعد ذكر التشهد - (ثم ليتخير من المسألة ما شاء) لكن قد يقال: إنه لا يلزم من وجوبها الأمر بإعادة الصلاة لمن تركها، والله أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق عبد الله بن يزيد المقرئ، عن حيوة بن شريح، عن أبي هانئ حميد بن هانئ عن أبي علي عمرو بن مالك عن فضالة بن عبيد به، وقال الترمذي: (حديث حسن صحيح)، وقال الحاكم: (هذا حديث صحيح على شرط مسلم، ولم يخرجاه) وهذا فيه نظر، فإن عمرو بن مالك لم يخرج له مسلم، وهو ثقة، روى له أصحاب السنن والبخاري في «الأدب المفرد»."]}, "54": {"m": "وَعَنْ أَبِي مَسْعُودٍ الأَنْصَارِيِ رضي اللهَ عنه قَالَ: «أَتَانَا رَسُولُ اللَّهِ صلى الله عليه وسلم وَنَحْنُ فِي مَجْلِسِ سَعْدِ بْنِ عُبَادَةَ، فَقَالَ لَهُ بَشِيرُ بْنُ سَعْدٍ: أَمََرََنا اللَّهُ أنَْ نُصَلِيَ عَلَيْكَ يَا رَسُولَ اللَّهِ، فَكَيْفَ نُصَلِي عَلَيْكَ؟ قَالَ: فَسَكَتَ رَسُولُ اللَّهِ صلى الله عليه وسلم حَتّى تَمَنّيْنَا أنّهُ لَمْ يَسْألْهُ، ثُمّ قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: قُولُوا: اللّهُمّ صَلِ عَلَى مُحَمّدٍ، وَعَلَى آلِ مُحَمّدٍ، كَمَا صَلّيْتَ عَلَى آلِ إِبْرَاهِيمَ. وَبَارِكْ عَلَى مُحَمّدٍ، وَعَلَى آلِ مُحَمّدٍ كَمَا بَارَكْتَ عَلَى آلِ إِبْرَاهِيمَ، فِي العَالمَِينَ، إِنّكَ حَمِيدٌ مَجِيدٌ، وَالسّلامُ كَمَا قَدْ عُلِمْتُمْ» رَوَاهُ مُسْلِمٌ. وَرَوَاهُ أَحْمَدُ، وَالدّارَقُطْنِيُّ، وَالحَاكِمُ بِنَحْوِهِ، وَعِنْدَهُمْ: «فَكَيْفَ نُصَلِي عَلَيْكَ إِذَا نَحْنُ صَلّيْنَا عَلَيْكَ فِي صَلاتِنَا؟». وَهَذِهِ الزَِيادَةُ تَفَرّدَ بِهَا ابْنُ إِسْحَاقَ، وَهُوَ صَدُوقٌ، وَقَدْ صَرّحَ بِالتّحْدِيثِ فَزَالَ مَا يُخَافُ مِنْ تَدْلِيسِهِ. وَقَدْ صَحّحَهَا ابْنُ خُزَْيمَةَ، وَ ابْنُ حِبّانَ، وَالحَاكِمُ، وَالبَيْهَقِيُّ، وَغَيْرُهُمْ.", "s": ["أ-الحديث دليل على كيفية الصلاة على النبي صلى الله عليه وسلم في الصلاة، وقد ورد في ذلك أحاديث اشتملت على صيغ متنوعة، فإن أمكن للمصلي أن يأتي بهذه الصيغ وينوع في صلاته فيأتي بهذه الصفة تارة وبغيرها تارة أخرى فهذا أفضل، لما تقدم في قاعدة العبادات الواردة على وجوه متعددة، وإن اقتصر على صيغة واحدة فلا بأس، لكن على المسلم أن يتقيد بالوارد دون زيادة أو نقصان، وقد نقل ابن القيم إجماع المسلمين على مشروعية الصلاة على النبي صلى الله عليه وسلم في التشهد الأخير، وقال: (هو أهم مواطن الصلاة وآكدها).", "ب- استدل بهذا الحديث من قال بوجوب الصلاة على النبي صلى الله عليه وسلم بعد التشهد الأخير، لقوله: (قولوا: اللهم صل على محمد) وهذا أمر، والأمر للوجوب، وهذا قول الشافعي، ورواية عن أحمد، اختارها الخرقي، وهو قول أبي عوانة حيث بوب بما يفيد الوجوب، وهو اختيار ابن العربي، وقد نصره ابن القيم، كما اختار ذلك الصنعاني، ورجحه الألباني، والشيخ عبد العزيز ابن باز، والمشهور في مذهب الحنابلة أنها ركن.", "واعترض على الاستدلال بهذا الحديث بأن فيه الأمر بمطلق الصلاة عليه وهو يقتضي الوجوب في الجملة، فيحصل الامتثال ولو خارج الصلاة، وأجيب عنه: بأن الرواية الأخرى المذكورة تَعيَّنَ فيها محل الصلاة عليه صلى الله عليه وسلم، وهو مطلق الصلاة، لكن ليس فيها ما يفيد إيقاعها بعد التشهد.", "وأجاب عن ذلك الحافظ البيهقي، فقال: (وقوله في الحديث: «قد علمنا كيف نسلم عليك» إشارة إلى السلام على النبي صلى الله عليه وسلم في التشهد، فقوله: «كيف نصلي عليك» أيضاً يكون المراد به في القعود للتشهد)، وكذا قال ابن القيم.", "وهذا الحديث من أقوى أدلة القائلين بالوجوب، ولهم أدلة أخرى كلها معلولة.", "القول الثاني: أن الصلاة على النبي صلى الله عليه وسلم لا تجب بعد التشهد، بل هي سنة، وهذا قول مالك، وأبي حنيفة، ورواية عن أحمد، وحكاه النووي عن الجمهور واختاره ابن المنذر، والشوكاني.", "واستدلوا بحديث ابن مسعود المتقدم في بيان التشهد، وفي آخره قال: (ثم ليتخير من الدعاء أعجبه إليه) ولو كانت الصلاة عليه صلى الله عليه وسلم بعد التشهد واجبة لعلمهم إياها، ولم يتركهم حتى يسألوا عنها، لأن هذا موضع تعليم وبيان، وموضع التعليم لا يؤخر فيه بيان الواجب، كما أشار إلى معنى ذلك ابن المنذر.", "فالأقوال ثلاثة: أنها واجبة، وقيل: ركن، وقيل: سنة، ومعلوم اصطلاح الفقهاء في التفريق بين واجبات الصلاة وأركانها، والقول بالوجوب قوي - في نظري - فإنه يتحصل من مجموع الأدلة الأمر بالصلاة على النبي صلى الله عليه وسلم في الصلاة؛ لصحة الرواية الأخرى المبينة للمراد، بناء على أن المراد بالصلاة الحقيقة الشرعية، وقد تقدم في حديث فضالة بن عبيد الأمر بالدعاء والصلاة على النبي صلى الله عليه وسلم قبل، والأدلة إذا اجتمعت شد بعضها بعضاً.", "ج- ظاهر هذا الحديث يدل على مشروعية الصلاة على النبي صلى الله عليه وسلم في التشهد الأول - أيضا - لقول الصحابة رضي الله عنهم: (فكيف نصلي عليك إذا نحن صلينا عليك في صلاتنا)، فقال: (قولوا اللهم صل على محمد …) فلم يخص تشهداً دون تشهد.", "وبه قال الإمام الشافعي، وهو الصحيح عند أصحابه، كما صرح به النووي، واختاره الوزير ابن هبيرة الحنبلي، ورجحه الشيخ عبد العزيز ابن باز، والألباني.", "والقول الثاني: أن الصلاة على النبي صلى الله عليه وسلم لا تشرع في التشهد الأول، وهو القول القديم للشافعي، وهو الذي صححه كثير من أصحابه، وهو قول أبي حنيفة ومالك وأحمد، واستدلوا بما تقدم في حديث ابن مسعود من عدم ذكر الصلاة على النبي صلى الله عليه وسلم بعد التشهد.", "وقد ورد في حديث ابن مسعود في التشهد، وفي آخره: (ثم إن كان في وسط الصلاة نهض حين يفرغ من تشهده، وإن كان في آخرها دعا بعد تشهده بما شاء الله أن يدعو ثم يسلم).", "والقول الأول قوي، فإن التشهد الأول وإن كان مبنياً على التخفيف، كما في حديث ابن مسعود رضي الله عنه لا سيما في حق الإمام، لكن التخفيف قد يحصل مع الإتيان بالصلاة على النبي ﷺ، ومن تركه فلا حرج عليه أخذاً بقول الجمهور، فإن فرغ المأموم من التشهد الأول قبل قيام إمامه تأكد في حقه الصلاة على النبي صلى الله عليه وسلم، لأن الصلاة ليس فيها سكوت إلا في حال قراءة الإمام، والله أعلم."]}, "55": {"m": "وَعَنْ أَبِي بَكْرٍالصِدِيقِ رضي الله عنه أَنّهُ قَالَ لِرَسُولِ اللَّهِ صَلى الله عليه وسلم: «عَلِمْنِي دُعَاءا أَدْعُوبِهِ فِي صَلاَتِي، قَالَ: قُلِ: اللّهُمّ إِنِي ظَلَمْتُ نَفْسِي ظُلْما كَثِيرا، وََلَا يَغْفِرُالذُّنُوبَ إِلَاّ أنْتَ؛ فَاغْفِرْلِي مَغْفِرَةا مِنْ عِنْدِكَ، وَارحَْمْنِي إِنّكَ أنْتَ الغَفُورُالرّحِيمُ» مُتّفَقٌ عَلَيْهِ.", "s": ["الحديث دليل على مشروعية الدعاء بهذا الدعاء في الصلاة، إما في السجود، أو في آخر التشهد قبل السلام، وهو دعاء عظيم علمه النبي صلى الله عليه وسلم الصديق رضي الله عنه.", "وهو دعاء شامل جامع لأنواع الأدعية، ففيه الاعتراف بالذنب وأن جميع الخلق عاجزون عن مغفرته، ثم إظهار الافتقار إلى الله بسؤال المغفرة والرحمة منه، ثم الثناء عليه تعالى بما يناسب المطلوب، وهذا كمال الدعاء.", "ومع كون الصديق رضي الله عنه أفضل الصحابة رضي الله عنهم وأكملهم علماً وعملاً، وهو من العشرة المشهود لهم بالجنة ومع ذلك يقال له قل: (اللهم إني ظلمت نفسي ظلما كثيرا)، فهذا يدل على أنه ينبغي للمؤمن أن يعترف بالتقصير وظلمه لنفسه وأن يقوم مقام الذل والانكسار بين يدي ربه، فإن هذا من أعظم الأسباب في قبول دعائه وتوبة الله عليه ونجاته وإصلاح قلبه، والله تعالى أعلم."]}, "56": {"m": "وَعَنْ أَبِي هُرَْيرَةََ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إِذَا تَشَهّدَ أَحَدُكُمْ؛ فَلْيَسْتَعِذْ بِاللَّهِ مِنْ أَرْبَعٍ؛ يَقُولُ: اللّهُمّ إِنِي أعُوذُ بِكَ مِنْ عَذَابِ جَهَنّمَ، وَمِنْ عَذَابَِ القَبْرِ، وَمِنْ فِتْنَةِ المَحْيَا وَالمَمَاتِ، وَمِنْ شَرِ فَِتْنَةِ المَسِيحِ الدّجّالِ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ. وَفِي لَفْظٍ لَهُ: «إِذَا فَرَغَ أحَدُكُمْ مِنَ التّشَهُّدِ الأَخِيرِ؛ فَلْيَتَعَوّذْ بِاللَّهِ مِنْ أرْبَعٍ».", "s": ["الحديث دليل على أن المصلي مأمور بالاستعاذة بالل تعالى من هذه الأربع في التشهد الأخير من كل صلاة فرضاً ونفلاً، وقد كان النبي صلى الله عليه وسلم يستعيذ من هذه الأربع، وأمر الأمة بها، فاجتمع فيها القول والفعل.", "والأمر بالدعاء بالاستعاذة منها في الصلاة دليل العناية بها، فإن وقاية العبد منها سبب للفلاح في الدنيا والآخرة، فإنها أمور عظيمة يشتد البلاء ويعظم الخطر في وقوعها.", "والجمهور من أهل العلم على استحباب هذا الدعاء، فيكون الأمر للندب، والنبي صلى الله عليه وسلم قد علم الأمة دعوات كثيرة يدعون بها بعد التشهد الأخير.", "وقالت الظاهرية بالوجوب، وبه قال طاوس بن كيسان اليماني؛ لفعل النبي صلى الله عليه وسلم وأمره به، وقد قال: «صلوا كما رأيتموني أصلي»، وقوّى هذا القول الشيخ عبد العزيز ابن باز.", "وقد أخرج مسلم من طريق أبي الزبير، عن طاوس، عن ابن عباس رضي الله عنهما: (أن رسول الله صلى الله عليه وسلم كان يعلمهم هذا الدعاء كما يعلمهم السورة من القرآن، يقول «قولوا: اللهم إنا نعوذ بك من عذاب جهنم …» الحديث)، قال مسلم بن الحجاج: (بلغني أن طاوساً قال لابنه: أدعوت بها في صلاتك؟ فقال: لا، قال: أعد صلاتك، لأن طاوساً رواه عن ثلاثة أو أربعة أو كما قال).", "وظاهر ذلك أن طاوساً يعتقد وجوب هذا الدعاء، وكأنه تمسك بظاهر الأمر به، كما تقدم، ويحتمل أن يكون أمر ابنه بالإعادة تغليظاً عليه، لئلا يتهاون بتلك الدعوات فيتركها، فيحرم فائدتها وثوابها، والله تعالى أعلم."]}, "57": {"m": "وَعَنْ وَ ائِلِ بْنِ حُجْرٍرضي الله عنه قَالَ: «صَلّيْتُ مَعَ النّبِيِ صلى اللهَ عليه وسلم فَكَانَ يُسَلِمُ عَنْ يَمِينِهِ: السّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ، وَعَنْ شِمَالِهِ: السّلامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ» رَوَاهُ أبُو دَاوُدَ بِإِسْنَادٍ صَحِيحٍ.", "s": ["أ- دلت السنة على أنه صلى الله عليه وسلم كان يسلم تسليمتين عن يمينه وعن شماله، وهذا مروي عن جماعة من الصحابة والتابعين، كما ذكر ذلك ابن المنذر، وهو قول ابن المبارك والإمام أحمد وإسحاق.", "وقد بلغت الأحاديث في إثبات التسليمتين مبلغ التواتر، حيث روى ذلك تسعة عشر صحابياً، كما ذكر ذلك في «نظم المتناثر» وسرد أسماءهم، وأوصلها المعلق على «سبل السلام» إلى تسعة وعشرين، ومن ذلك حديث ابن مسعود رضي الله عنه عن النبي صلى الله عليه وسلم أنه كان يسلم عن يمينه وعن يساره: «السلام عليكم ورحمة الله، السلام عليكم ورحمة الله».", "وعن سعد بن أبي وقاص رضي الله عنه قال: (كنت أرى رسول الله صلى الله عليه وسلم يسلم عن يمينه وعن يساره حتى أرى بياض خديه).", "وعند الطبراني من حديث المغيرة، وفيه: (.. وكان يسلم عن يمينه حتى يرى بياض خده الأيمن، وعن يساره حتى يرى بياض خده الأيسر)، والمشهور في مذهب الحنابلة أن التسليمتين من أركان الصلاة.", "والقول الثاني: أن التسليمة الثانية ليست بواجبة، وهذا قول المالكية، والشافعية، ورواية عن أحمد، اختارها الموفق ابن قدامة، وصاحب «الشرح الكبير» عبد الرحمن ابن قدامة، وقد نقل ابن المنذر الإجماع على أن صلاة من اقتصر على تسليمة واحدة أنها جائزة.", "واستدلوا بأحاديث عن عائشة وسلمة بن الأكوع وسهل بن سعد وغيرهم رضي الله عنهم فيها الاقتصار على تسليمة واحدة، وقد طعن العلماء في بعض هذه الأحاديث، وهي لا تصل إلى درجة أحاديث التسليمتين، فإن رواتها أكثر عدداً - كما تقدم - وهي أصح سنداً.", "فالقول بأن المصلي يسلم تسليمتين أحوط وأبرأ للذمة، فإن من سلم تسليمتين فصلاته جائزة على جميع الأقوال، والنبي صلى الله عليه وسلم قد واظب عليهما، وقال: «صلوا كما رأيتموني أصلي»، وقد تكون أحاديث التسليمة الواحدة محمولة على بيان الجواز، وأحاديث التسليمتين لبيان الأكمل والأفضل، كما قال النووي. والله أعلم.", "ب- صيغة السلام: (السلام عليكم ورحمة الله، السلام عليكم ورحمة الله)، هذا هو المحفوظ الذي نقله عدد من الصحابة رضي الله عنهم كما تقدم عن ابن مسعود رضي الله عنه.", "وعن جابر بن سمرة رضي الله عنه قال: (كنا إذا صلينا مع رسول الله صلى الله عليه وسلم قلنا: السلام عليكم ورحمة الله، السلام عليكم ورحمة الله.. الحديث)، وفي رواية عنه قال: (صليت مع رسول الله صلى الله عليه وسلم فكنا إذا سلمنا قلنا بأيدينا: السلام عليكم، السلام عليكم … الحديث).", "وهذا فيه دليل على جواز الاقتصار على قول: (السلام عليكم)، وهو قول الجمهور من أهل العلم، وجاء في حديث الباب زيادة: (وبركاته)، وفيها قولَان:", "الأول: أن الأفضل عدم زيادتها، وهذا هو المشهور من مذهب الإمام أحمد، لأن أكثر الرواة لم يذكروها، كابن مسعود وجابر بن سمرة وغيرهما رضي الله عنهما.", "الثاني: أنه يجوز زيادتها، بناء على ثبوتها في رواية أبي داود من حديث وائل، والله تعالى أعلم."], "t": ["أخرجه أبو داود من طريق موسى بن قيس الحضرمي، عن سلمة بن كهيل، عن علقمة بن وائل، عن أبيه رضي الله عنه قال: (صليت مع النبي صلى الله عليه وسلم …) الحديث.", "وقد اختلفت كلمة العلماء في ثبوت لفظة: (وبركاته) في التسليمة الثانية، وهذا الحديث صححه الحافظ ابن حجر مع أنه ذكر في «التقريب» أن علقمة بن وائل لم يسمع من أبيه، وقد نقل ذلك عن العسكري عن ابن معين، فيكون في هذا السند انقطاع، وصححه النووي، وقال: (وأشار بعضهم إلى تضعيفه).", "والصواب تصحيحه، وأما قول الحافظ: (إن علقمة لم يسمع من أبيه) ففيه نظر، فقد نص البخاري والترمذي على أنه سمع منه، والدليل على ذلك تصريحه بالتحديث في أحاديث رواها عن أبيه، منها في «صحيح مسلم»."]}, "58": {"m": "وَعَنْ أَبِي الزَُّبيْرِ قَالَ: «كَانَ ابْنُ الزَُّبيْرِ رضي الله عنهما يَقُولُ فِي دُبُرِ كُلِ صَلاةٍ حِينَ يُسَلِمُ: لَا إِلَهَ إِلَاّ اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِ شَيْءٍ قَدِيرٌ، لَا حَوْلَ وََلَا قُوّةَ إِلَاّ بِاللَّهِ. لَا إِلَهَ إِلَاّ اللَّهُ، وََلَا نَعْبُدُ إِلَاّ إِيّاهُ، لَهُ النِعْمَةُ وَلَهُ الفَضْلُ وَلَهُ الثّنَاءُ الحَسَنُ. لَا إِلَهَ إِلَاّ اللَّهُ مُخْلِصِينَ لَهُ الدِينَ وَلَوْ كَرِهَ الكَافِرُونَ. وَقَالَ: كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُهَلِلُ بِهِنّ دُبُرَكُلِ صَلاةٍ» رَوَاهُ مُسْلِمٌ.", "s": ["أ-الحديث دليل على مشروعية ذكر الله تعالى بعد الصلاة المكتوبة بهذا الذكر الجامع للمعاني العظيمة، وللذكر بعد الصلاة شأن عظيم، حث عليه النبي ﷺ ورغَّب فيه قولاً وفعلاً، قال النووي: (أجمع العلماء على استحباب الذكر بعد الصلاة، وجاء فيه أحاديث كثيرة صحيحة في أنواع منه متعددة).", "ب- في الحديث دليل على مشروعية الجهر بالذكر؛ لقوله: «كان رسول الله ﷺ يهلل بهن دبر كل صلاة». والإهلال: رفع الصوت ـ كما تقدم ـ. وعن ابن عباس: أن رفع الصوت بالذكر حين ينصرف الناس من المكتوبة، كان على عهد النبي ﷺ. قال ابن عباس: «كنت أعلم إذا انصرفوا بذلك إذا سمعته»، وفي لفظ: «كنت أعرف انقضاء صلاة النبي ﷺ بالتكبير»، فهذا يدل على مشروعية رفع الصوت بالتكبير عقب الصلاة المفروضة، والتكبير من الذكر الذي كانوا يجهرون به. قال الشيخ عبد الرحمن السعدي: (في هذا الحديث رفع الصوت بالذكر، بحيث يُسمع مَن هو قريب من المسجد في سوق أو بيت ونحوه، ويستحب رفع الصوت بكل الذكر: التكبير والتهليل والتسبيح؛ ليتعلم الصغير من الكبير، والجاهل من العالم، إلى غير ذلك من الفوائد. ولا يختص رفع الصوت بالتهليل وحده، كما يفعله أكثر الناس اليوم، ولكن يحصل به إدراك السُّنَّة). وأما الدعاء، فالسُّنَّة إخفاؤه، قال تعالى: ﴿ٱدۡعُوا رَبَّكُمۡ تَضَرُّعٗا وَخُفۡيَةً﴾ [الأعراف: 55]، وقال تعالى: ﴿وََلا تَجۡهَرۡ بِصَلاتِكَ وََلا تُخَافِتۡ بِهَا﴾ [الإسراء: ١١0]، وقد ثبت في «الصحيحين» عن عائشة أنها نزلت في الدعاء."]}, "59": {"m": "وَعَنَْ ثَوْبَانَ رضي الله عنه قَالَ: «كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِذَا انْصَرَفَ مِنْ صَلاتِهِ: اسَْتَغْفَرَ ثَلاثا، وَقَالَ: اللّهُمّ أنْتَ السّلامَُ، وَمِنْكَ السّلاَمُ، تَبَارَكْتَ ذَا الجَلالِ وَالإِكْرَامِ. قَالَ الوَلِيدُ بْنُ مُسْلِمٍ: فَقُلْتُ لِلَاوْزَاعِيِ: كَيْفَ الَاسْتِغْفَارُ؟ قَالَ: يَقُولُ: أسْتَغْفِرُاللَّهَ، أسْتَغْفِرُاللَّهَ» رَوَاهُ مُسْلِمٌ.", "s": ["الحديث دليل على أنه يشرع للمصلي إذا سلم من صلاته أن يقول: (أستغفر الله، أستغفر الله، أستغفر الله، اللهم أنت السلام ومنك السلام، تباركت يا ذا الجلال والإكرام). وظاهر الحديث أن هذا الذكر هو أول ما يبدأ به المصلي بعد الانصراف، وهذا الذكر بعد السلام في غاية المناسبة، فإن فيه إشارة إلى أن المصلي لم يقم بحق عبادة ربه، لأنه لا يخلو غالباً من الوساوس والخواطر في صلاته، فشرع له الاستغفار بعد انتهاء صلاته، تداركاً لما فاته من الخشوع، وجبرًا لما حصل فيها من الخلل.", "وقد دلت السنة على أن الإمام يقول ذلك قبل أن يستقبل المأمومين، كما في حديث عائشة رضي الله عنها قالت: (كان رسول الله صلى الله عليه وسلم إذا سلم لم يقعد إلا مقدار ما يقول: «اللهم أنت السلام، ومنك السلام، تباركت ذا الجلال والإكرام»، وفي رواية: «يا ذا الجلال والإكرام»).", "وأما زيادة لفظ: (وتعاليت) بعد لفظ: (تباركت)، فهي وإن كانت من ألفاظ الثناء على الله تعالى ووردت في أحاديث أخرى - كما تقدم في دعاء القنوت - إلا أنه لا أصل لها في هذا الموضع، والله أعلم."]}, "60": {"m": "وَرَوَى عَنْ أَبِي هُرَْيرَةَ رضي الله عنه، عَنْ رَسُولِ اللَّهِ صلى الله عليه وسلم قَالَ: «مَنْ سَبّحَ اللَّهَ دُبُرَكُلِ صَلاةٍ ثَلاثا وَثَلاثِينَ، وَحَمِدَ اللَّهَ ثَلاثا وَثَلاثِينَ، وَكَبّرَ اللَّهَ ثَلاثا وَثَلاثِينَ، فَتِلْكَ تِسْعٌ وَتِسْعُونَ، وَقَالَ تَمَامَ المِئَةِ: لَا إِلَهَ إِلَاّ اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ المُلْكُ وَلَهُ الحَمْدُ، وَهُوَ عَلَى كُلِ شَيْءٍ قَدِيرٌ؛ غُفِرَتْ خَطَايَاهُ وَإِنْ كَانَتْ مِثْلَ زَبَدِ البَحْرِ».", "s": ["الحديث دليل على مشروعية هذا الذكر بعد الصلاة المفروضة، وظاهر الحديث الإطلاق، لكنه محمول على الصلاة المفروضة، بدليل حديث كعب بن عجرة من باب حمل المطلق على المقيد، وصفته أن يقول: سبحان الله ثلاثا وثلاثين، والحمد لل ثلاثا وثلاثين، والله أكبر ثلاثا وثلاثين، وتمام المائة: لا إله إلا الله وحده لا شريك له، له الملك، وله الحمد، وهو على كل شيء قدير.", "الصفة الثانية: أن يقول سبحان الله ثلاثا وثلاثين، والحمد لل ثلاثا وثلاثين، والله أكبر أربعا وثلاثين، وهاتان في صحيح مسلم.", "والصفة الثالثة: وردت في حديث أبي هريرة رضي الله عنه في قصة فقراء المهاجرين، وفيه: (تسبحون، وتكبرون، وتحمدون دبر كل صلاة ثلاثا وثلاثين مرة.. الحديث).", "والصفة الر ابعة: ما ورد في حديث أبي هريرة رضي الله عنه وفيه: (تسبحون في دبر كل صلاة عشرا، وتحمدون عشرا، وتكبرون عشرا)، وفي حديث عبد الله بن عمرو رضي الله عنهما قال: (قال: رسول الله صلى الله عليه وسلم: «خلتان لا يحصيهما رجل مسلم إلا دخل الجنة، ألا وهما يسير، ومن يعمل بهما قليل: يسبح الله في دبر كل صلاة عشرا، ويحمده عشرا، ويكبره عشرا»، قال: فأنا رأيت رسول الله صلى الله عليه وسلم يعقد بيده، قال: «فتلك خمسون ومئة باللسان، وألف وخمس مئة في الميزان …») الحديث.", "ومعنى (خلتان) خصلتان، ومعنى (خمسون ومئة باللسان) أي: في يوم وليلة (وألف وخمس مئة في الميزان) أي: لقوله تعالى: {من جاء بالحسنة فله عشر أمثالها} [الأنعام: ١60].", "والصفة الخامسة: ما ورد في حديث زيد بن ثابت رضي الله عنه قال: أمروا أن يسبحوا دبر كل صلاة ثلاثا وثلاثين، ويحمدوا ثلاثا وثلاثين، ويكبروا أربعا وثلاثين، فأتي رجل من الأنصار في منامه فقيل له: (أمركم رسول الله صلى الله عليه وسلم أن تسبحوا دبر كل صلاة ثلاثا وثلاثين، وتحمدوا الله ثلاثا وثلاثين، وتكبروا ثلاثا وثلاثين؟ قال: نعم، قال: فاجعلوها خمسا وعشرين، واجعلوا فيها التهليل، فلما أصبح أتى النبي صلى الله عليه وسلم فذكر ذلك له)، فقال: (اجعلوها كذلك).", "والأفضل أن يأتي المصلي بهذه الصفة تارة، وبهذه تارة أخرى؛ لما تقدم في العبادات الواردة على صفات متعددة، والله تعالى أعلم."]}, "61": {"m": "وَعَنْ مُعَاذٍ رضي الله عنه: «أَنّ رَسُولَ اللَّهِ صَلى الله عليه وسلم أَخَذَ بِيَدِهِ وَقَالَ: يَا مُعَاذُ! وََاللَّهِ إِنِي لأََُحِبُّكَ، أُوصِيكَ يَا مُعَاذُ؛ لَا تَدَعَنّ فِي دُبُرِكُلِ صَلاةٍ تَقُولُ: اللّهُمّ أعِنِي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ» رَوَاهُ أحْمَدُ، وَ أبُودَاوُدَ - وَهَذَا لَفْظُهُ -، وَالنّسَائِيُّ.", "s": ["أ-الحديث دليل على مشروعية هذا الدعاء في دبر الصلاة، وهو دعاء جامع شامل مع إيجازه وقلة ألفاظه، فإن من رزقه الله الإعانة على ذكره وشكره وحسن عبادته فقد تم أمره، وكملت أسباب سعادته، لأن الدين متضمن ذلك كله، فإنه ذكر لل تعالى، وثناء عليه، وشكر لإنعامه وجزيل إفضاله، ومن تمام ذلك أن يحسن عبادة ربه ويؤديها على الوجه الأكمل.", "والدبر في هذا الحديث يحتمل أن يكون مرادا به ما قبل السلام، أو ما بعد السلام، والأفضل أن يكون ما قبل السلام لأمرين. الأول: ما تقدم أن الدبر هو آخر الشيء وطرفه ومؤخرته، وطرف الصلاة هو التشهد الأخير ما قبل السلام.", "الثاني: أن ما قبل السلام موضع دعاء، كما تقدم في حديث ابن مسعود رضي الله عنه، فيكون الأنسب لهذا الدعاء ما قبل السلام، ويؤيد ذلك رواية النسائي: (فلا تدع أن تقول في كل صلاة …) فإن نسيه قبل السلام وأتى به بعده فلا بأس؛ لأن كلا منهما يسمى دبرا، كما تقدم.", "ب- في الحديث فضيلة ومنقبة لمعاذ رضي الله عنه حيث خصه الرسول صلى الله عليه وسلم بهذا الدعاء، وقبل ذلك قال له: «والله إني لأحبك»، ففيه مزيد تشريف منه صلى الله عليه وسلم لمعاذ وترغيب له في ما يريد أن يلقي عليه من هذا التوجيه.", "ووصية النبي صلى الله عليه وسلم لواحد من الصحابة وصية للأمة كلها، لأن شريعته عامة، ولكن ذلك يدل على مزية لهذا الشخص حيث خصه بهذا العلم حتى يعمل به ويحمله ويبلغه الناس، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق عقبة بن مسلم، حدثني أبو عبد الرحمن الحبلي، عن الصنابحي، عن معاذ بن جبل رضي الله عنه به.", "وإسناده صحيح، صححه النووي، والحافظ ابن حجر، والشيخ عبد العزيز بن باز.", "والحديث له شاهد من حديث أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «أتحبون أن تجتهدوا في الدعاء؟ قولوا: اللهم أعنا على ذكرك وشكرك وحسن عبادتك»، أخرجه أحمد (١٣/ ٣60) ومن طريقه أبو نعيم في الحلية (9/ ٢٢٣)، وإسناده صحيح."]}, "62": {"m": "وَعَنْ أَبِي أُمَامَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَنْ قَرََأ آيَةَ الكُرْسِيِ، وَ {قُلْ هُوَ اللَّهُ أَحَدٌ} دُبُرَكُلِ صَلاةٍ مَكْتُوبَةٍ؛ لَمْ يَمْنَعْهُ مِنْ دُخُولِ الجَنّةِ إِلَاّ المَوْتُ» رَوَاهُ النّسَائِيُّ، وَالرُّويَانِيُّ، وَ ابْنُ حِبّانَ، وَالدّارَقُطْنِيُّ فِي «الأَفْرَادِ»، وَالطّبَرَ انِيُّ - وَهَذَا لَفْظُهُ -. وَلَمْ يُصِبْ مَنْ ذَكَرَهُ فِي «المَوْضُوعَاتِ»؛ فَإِنّهُ حَدِيثٌ صَحِيحٌ.", "s": ["الحديث دليل على فضل قراءة آية الكرسي دبر كل صلاة، وهي: {الله لا إله إلا هو الحي القيوم} إلى قوله: {وهو العلي العظيم} [البقرة: ٢55]، وأن قراءتها سبب من أسباب دخول الجنة، ومع أن الدبر يحتمل ما قبل السلام أو ما بعد السلام - كما تقدم - إلا أن المراد هنا ما بعد السلام، لأن ما قبل السلام ليس محلاً للقرآن، وإنما محله القيام، فهذه قرينة على أن المراد ما بعد السلام.", "وكذا يشرع قراءة المعوذتين {قل أعوذ برب الفلق} [الفلق: ١]، {قل أعوذ برب الناس} [الناس: ١]، لحديث عقبة بن عامر رضي الله عنه قال: (أمرني رسول الله صلى الله عليه وسلم أن أقرأ بالمعوذات دبر كل صلاة).", "قال العيني: (والحكمة في هذا أن الشيطان - عليه اللعنة - لم يزل يوسوس به وهو في الصلاة، وما قدر على قطعه عن الصلاة، ثم لما فرغ يقبل إليه إقبالا كليا حتى يرفعه في معصميه، فأمر عند ذلك أن يستعيذ بالمعوذات من الشيطان حتى لا يظفر عليه، ولا يتمكن منه)،", "و (المعوذات) بالكسر جمع معوذة بصيغة اسم الفاعل، أي: محصنة، ونسبة التحصين إليها مجاز، والمراد: سورة الفلق وسورة الناس، - كما مر - فالمراد بالجمع ما فوق الواحد، أو جمعهما باعتبار أن ما يستعاذ منه كثير فيهما، أو باعتبار آيات السورتين وأما على رواية الترمذي: (بالمعوذتين) فلا إشكال، والله تعالى أعلم.", "* * *"], "t": ["فقد أخرجه النسائي في «الكبرى» من طريق محمد بن حمير، حدثني محمد بن زياد الألهاني، قال: (سمعت أبا أمامة يقول: …) فذكره.", "والحديث تفرد به النسائي من بين أصحاب الكتب الستة، ولم يذكره في «الصغرى» ومحمد بن حمير: وثقه ابن معين، وقال النسائي والدارقطني: (لا بأس به)، وقال أبو حاتم: (يكتب حديثه، ولا يحتج به)، وقال يعقوب بن سفيان: (ليس بالقوي). والحديث مروي عن محمد بن حمير من عدة طرق، وله شواهد ذكرها الألباني، وقد صححه المنذري، وابن عبد الهادي، وابن القيم، وابن كثير، والألباني، وضعفه ابن تيمية، وعبد الرحمن المعلمي، ولعل من ضعفه نظر إلى تفرد محمد بن حمير به، وأن شواهده معلولة.", "وقد ذكر ابن الجوزي هذا الحديث في «الموضوعات» وقد أخطأ في ذلك، ولذا انتقده العلماء كابن حجر، وابن عبدالهادي. وأخرجه بزيادة: \"وَ{قُل هُوَ اللَّهَُّ أَحَد} \" الطبراني في «الكبير» من طريق محمد بن إبراهيم، حدثنا محمد بن حمير به، وهي زيادة منكرة تفرد بها محمد بن إبراهيم الحمص ي - كما ذكر الطبراني - وهو متهم، كما يستفاد من «الكامل» لابن عدي، و «المقتنى» للذهبي، وغيرهما. وأما قول المنذري: (وإسناده بهذه الزيادة جيد)، وكذا قول الهيثمي فهو مردود، لما تقدم."]}, "63": {"m": "عَنْ عُقْبَةَ بْنِ عَامِرٍرضي الله عنه قََالَ: كَانَتْ عَلَيْنَا رِعَايَةُ الإِبِلِ، فَجَاءَتْ نَُوْبَتِي فَرَوّحْتُهَا بِعَشِيٍ، فَأَدْرَكْتُ النّبِيّ صلى الله عليه وسلم قَائِما يُحَدِثُ النّاسَ، فَ
