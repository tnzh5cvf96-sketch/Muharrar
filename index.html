<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Повторение хадисов — аль-Мухарраар</title>
<meta name="theme-color" content="#0a6aa1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f3f7fa; --card:#ffffff; --ink:#14283a; --muted:#56697b; --line:#d7e2ea;
  --accent:#0a6aa1; --accent-2:#08507c; --accent-ink:#ffffff; --tint:#e8f2f9;
  --gold:#8a6a1f; --goldbg:#f6eedb; --goldline:#c0a05a;
  --ok:#1b7f4b; --okbg:#dff2e6; --bad:#b3372b; --badbg:#f8e1dd; --chip:#e6eff5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1520; --card:#112232; --ink:#e5eef6; --muted:#93a8ba; --line:#233a4f;
    --accent:#4aa3d8; --accent-2:#6bb7e6; --accent-ink:#05121d; --tint:#15304a;
    --gold:#e3bf72; --goldbg:#2e2714; --goldline:#c0a05a;
    --ok:#5cc98a; --okbg:#153426; --bad:#ee8272; --badbg:#3a1f1a; --chip:#1a2f43;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1520; --card:#112232; --ink:#e5eef6; --muted:#93a8ba; --line:#233a4f;
  --accent:#4aa3d8; --accent-2:#6bb7e6; --accent-ink:#05121d; --tint:#15304a;
  --gold:#e3bf72; --goldbg:#2e2714; --goldline:#c0a05a;
  --ok:#5cc98a; --okbg:#153426; --bad:#ee8272; --badbg:#3a1f1a; --chip:#1a2f43;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
.topbar{background:#fff;border-bottom:1px solid #d7e2ea;--bg:#fff;--card:#fff;--ink:#14283a;--line:#d7e2ea;--accent:#0a6aa1;--muted:#56697b}
.tb-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:block;line-height:0}
.brand img{height:52px;width:auto;max-width:64vw;display:block}
.hero{background:linear-gradient(135deg,#08507c 0%,#0a6aa1 100%);color:#fff;border-bottom:3px solid #c0a05a}
.hero-in{max-width:720px;margin:0 auto;padding:18px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.25rem;margin:0;font-weight:700;color:#fff;line-height:1.3}
h1 small{display:block;font-weight:400;color:rgba(255,255,255,.85);font-size:.82rem;margin-top:2px}
.streak{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;white-space:nowrap}
.streak:empty{display:none}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;box-shadow:0 -2px 10px rgba(10,60,100,.06)}
nav .in{display:flex;width:100%;max-width:720px}
nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--muted);font:inherit;font-size:.92rem;cursor:pointer;border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(10,60,100,.05)}
.card h2{margin:0 0 8px;font-size:1.05rem;font-weight:600}
.muted{color:var(--muted);font-size:.9rem}
.big{font-size:2.6rem;font-weight:700;line-height:1;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:1;min-width:140px}
select,input[type=text],input[type=number],input[type=search],textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button.btn{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.btn:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
button.btn.sec{background:transparent;color:var(--accent)}
button.btn.sec:hover:not(:disabled){background:var(--tint)}
button.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button.btn.danger:hover:not(:disabled){background:var(--badbg)}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.pick:focus-within,a:focus-visible{outline:3px solid var(--goldline);outline-offset:2px}
.ar{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;text-align:right;font-size:1.4rem;line-height:2}
.ar.sm{font-size:1.15rem;line-height:1.8}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtype{font-size:.85rem;color:var(--muted);margin:0 0 6px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{font:inherit;text-align:right;direction:rtl;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;font-family:"Amiri","Noto Naskh Arabic",serif;font-size:1.25rem;line-height:1.8}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--tint)}
.opt.num{text-align:center;font-family:"IBM Plex Sans",sans-serif;font-size:1.2rem}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.reveal{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.list{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pick.on{border-color:var(--accent);background:var(--tint)}
.pick input{width:22px;height:22px;margin-top:6px;accent-color:var(--accent)}
.pick .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.pick .ar{font-size:1.2rem;line-height:1.8}
.sticky{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:3}
.dist{display:grid;gap:6px}
.dist div{display:grid;grid-template-columns:110px 1fr 32px;gap:8px;align-items:center;font-size:.88rem}
.dist .b{height:10px;border-radius:6px;background:var(--chip);overflow:hidden}
.dist .b i{display:block;height:100%;background:var(--accent)}
.mist{display:grid;gap:8px;margin-top:10px}
.mist div{border-inline-start:3px solid var(--bad);padding-inline-start:10px}
textarea{min-height:90px;font-size:.8rem;font-family:monospace;direction:ltr}
.empty{text-align:center;padding:24px 8px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
.hr{display:flex;gap:8px;align-items:center}
.today{background:var(--tint);color:var(--ink);border-inline-start:4px solid var(--goldline);border-radius:8px;padding:10px 12px;margin:12px 0 8px;font-weight:600}
.lg{display:flex;align-items:center;gap:4px;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:0 4px 0 8px;background:var(--card)}
.lg select{border:0;background:transparent;padding:7px 4px;width:auto;font-size:.88rem;color:var(--ink)}
.rings{display:flex;gap:16px;justify-content:space-around;flex-wrap:wrap}
.rc{text-align:center;flex:1;min-width:130px}
.rg{width:130px;height:130px}
.rt{font-weight:600;margin-top:4px}
.rs{font-size:.85rem}
.chip.wk{background:var(--goldbg);color:var(--gold);font-weight:600}
#who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px}
#who:empty{display:none}
.who-n{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
.who-n svg{color:var(--accent)}
.pbtn{width:100%;text-align:start}
</style>
</head>

/* ---------- ХРАНИЛИЩЕ ---------- */
const KEY='muharrar-quiz-v1';            // прежние данные без имени
const PKEY='muharrar-profiles-v1';       // список профилей на этом устройстве
const LKEY='muharrar-lang-v1';
const dkey=k=>KEY+':'+k;
const blank=lang=>({learned:{},prog:{},streak:0,last:null,reviews:0,lang});
let L='ru'; try{const l=localStorage.getItem(LKEY); if(l&&I.title[l]) L=l;}catch(e){}
let PR={list:[],last:null};
try{const v=localStorage.getItem(PKEY); if(v) PR=Object.assign(PR,JSON.parse(v));}catch(e){}
if(!Array.isArray(PR.list)) PR.list=[];
let cur=null, S=blank(L);
function savePR(){try{localStorage.setItem(PKEY,JSON.stringify(PR));}catch(e){}}
function loadProfile(p){
  cur=p; let o=null;
  try{const v=localStorage.getItem(dkey(p.key)); if(v) o=JSON.parse(v);}catch(e){}
  S=Object.assign(blank(L),o||{});
  if(!I.title[S.lang]) S.lang=L;
  L=S.lang;
  if(S.plan&&S.plan.v!==2) delete S.plan;
  PR.last=p.key; savePR();
}
const normKey=n=>n.trim().toLowerCase().replace(/\s+/g,' ');
function enterProfile(rawName,data){
  const name=String(rawName||'').trim().replace(/\s+/g,' ').slice(0,40);
  if(!name) return false;
  const key=normKey(name);
  let p=PR.list.find(x=>x.key===key);
  try{
    if(!p){
      p={name,key}; PR.list.push(p);
      if(!data && PR.list.length===1){const old=localStorage.getItem(KEY); if(old){localStorage.setItem(dkey(key),old);localStorage.removeItem(KEY);}}
    }
    if(data) localStorage.setItem(dkey(key),JSON.stringify(data));
  }catch(e){}
  savePR(); loadProfile(p); tab='quiz'; Q=null; render(); return true;
}
const t=(k,...a)=>{const v=I[k][L];return typeof v==='function'?v(...a):v};
function save(){ if(!cur) return; S.ts=Date.now(); try{localStorage.setItem(dkey(cur.key),JSON.stringify(S));}catch(e){} }
const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const learnedItems=()=>DATA.filter(d=>S.learned[d.n]);
const dueItems=()=>{const d=dayNum();return learnedItems().filter(x=>!S.prog[x.n]||S.prog[x.n].due<=d)};
function curStreak(){return (S.last!==null && S.last>=dayNum()-1)?S.streak:0}
const fresh=()=>({learned:{},prog:{},streak:0,last:null,reviews:0,lang:L});

/* ---------- ПЛАН ---------- */
const ruPl=(n,f)=>{const m=n%10,h=n%100;return (m===1&&h!==11)?f[0]:(m>=2&&m<=4&&(h<10||h>=20))?f[1]:f[2]};
const PLAN_DEF={per:11,anchor:Math.floor(Date.UTC(2026,8,23)/864e5),target:44};
const plan=()=>Object.assign({},PLAN_DEF,S.plan||{});
const ksaNow=()=>Date.now()+3*36e5; // Саудовская Аравия, UTC+3
function cycleInfo(){
  const t0=ksaNow(), n=Math.floor(t0/864e5), h=Math.floor((t0%864e5)/36e5), dow=(n+4)%7;
  const cyc=(dow===3&&h>=13)?n+1:n, cd=(cyc+4)%7;   // после среды 13:00 начинается новый цикл
  return {n,dow,wed:cyc+(3-cd+7)%7};
}
const nextWed=()=>cycleInfo().wed;
function planInfo(){
  const p=plan(), N=DATA.length, {n,dow,wed}=cycleInfo(), days=wed-n;
  const endRaw=w=>p.target+p.per*Math.round((w-p.anchor)/7);
  const rng=e=>({a:Math.max(1,Math.min(N,e-p.per+1)),b:Math.max(0,Math.min(N,e))});
  const ex=rng(endRaw(wed)), blk=rng(endRaw(n-dow+10));
  let task={kind:'none'};
  if(blk.b>=blk.a){
    let rem=p.per; const counts=[];
    for(let d=0;d<5;d++){const c=Math.min(2,rem);counts.push(c);rem-=c;}
    if(dow<=4){
      const a=blk.a+counts.slice(0,dow).reduce((x,y)=>x+y,0), c=counts[dow];
      if(c>0&&a<=blk.b) task={kind:'learn',a,b:Math.min(blk.b,a+c-1)};
    }else if(dow===5){
      const a=blk.a+p.per-rem;
      task=(rem>0&&a<=blk.b)?{kind:'fri',a,b:Math.min(blk.b,a+rem-1)}:{kind:'rev'};
    }else task={kind:'rev'};
  }
  return {days,wed,exam:ex,blk,task,dow};
}
function weekLabelCard(){
  const ex=planInfo().exam; if(ex.b<ex.a) return '';
  const ha=DATA[ex.a-1].h, hb=DATA[ex.b-1].h;
  return `<div class="card wkl"><div class="muted" style="font-size:.85rem">${t('wkTitle')}</div>
    <div class="big" style="font-size:2rem;margin:4px 0">${t('numSign')} ${ha}–${hb}</div>
    <div>${t('wkBookCap')}</div>
    <div class="muted">${t('wkList',ex.a,ex.b)}</div>
    <div class="muted" style="font-size:.8rem;margin-top:6px">${t('wkRoll')}</div></div>`;
}
function planCard(){
  const P=planInfo(), ex=P.exam, has=ex.b>=ex.a;
  const loc=L==='ru'?'ru-RU':L==='ar'?'ar-u-nu-latn':'en-GB';
  let ds='';try{ds=new Date(P.wed*864e5).toLocaleDateString(loc,{day:'numeric',month:'long',timeZone:'UTC'})}catch(e){}
  const title=P.days===0?t('examToday'):P.days===1?t('examTomorrow'):t('examIn',P.days);
  const ok=has?DATA.filter(d=>d.n<=ex.b&&S.learned[d.n]).length:0;

function startWith(pool,mode,exam){
  Q={active:true,done:false,mode,exam:!!exam,queue:pool.map(item=>({item,retry:false})),idx:0,total:pool.length,correct:0,wrong:[],answered:false};
  render();
}
function startQuiz(){
  let pool=cfg.practice?shuffle(learnedItems()):dueItems().sort((a,b)=>((S.prog[a.n]||{due:0}).due)-((S.prog[b.n]||{due:0}).due)||Math.random()-.5);
  if(cfg.count!=='all') pool=pool.slice(0,+cfg.count);
  startWith(pool,cfg.mode,false);
}

/* --- Генерация вопроса --- */
function options(item,key,near){
  const out=[item[key]],seen=new Set([String(item[key])]);
  let cand=shuffle(DATA);
  if(near) cand=shuffle(DATA.filter(d=>Math.abs(d.h-item.h)<=40)).concat(cand);
  for(const d of cand){ if(out.length>=4)break; const v=String(d[key]); if(!seen.has(v)){seen.add(v);out.push(d[key]);} }
  return shuffle(out);
}
function buildQ(item){
  let ty=Q.mode||cfg.mode;
  if(ty==='mix') ty=['flash','narr','takh','matn'][Math.floor(Math.random()*4)];
  const q={item,type:ty};
  if(ty==='narr'){q.askKey='askNarr';q.key='a';q.opts=options(item,'a');}
  if(ty==='takh'){q.askKey='askTakh';q.key='t';q.opts=options(item,'t');}
  if(ty==='matn'){
    const w=item.m.split(' '), k=Math.max(1,Math.min(4,w.length-1));
    q.start=w.slice(0,k).join(' '); q.askKey='askCont'; q.correct=w.slice(k).join(' ');
    const seen=new Set([q.correct]), out=[q.correct];
    for(const d of shuffle(DATA)){
      if(out.length>=4)break;
      const dw=d.m.split(' '), r=dw.slice(Math.min(k,dw.length-1)).join(' ');
      if(!seen.has(r)){seen.add(r);out.push(r);}
    }
    q.opts=shuffle(out);
  }
  if(q.correct===undefined) q.correct=item[q.key];
  return q;
}
function full(item){
  return `<div class="reveal"><div class="meta"><span class="chip">${t('numSign')} ${item.n}</span></div>
  <div class="ar">${esc(item.m)}</div>
  <div class="ar sm" style="color:var(--muted)">${esc(item.a)}</div>
  <div class="ar sm" style="color:var(--muted)">${esc(item.t)}</div></div>`;
}

function renderQuestion(){
  const cur=Q.queue[Q.idx];
  if(!cur.q) cur.q=buildQ(cur.item);
  const q=cur.q, item=q.item;
  Q.answered=false;
  const pct=Math.round(Q.idx/Q.queue.length*100);
  let body='';
  if(q.type==='flash'){
    body=`<p class="qtype">${t('flashQ')}</p>
      <div class="ar sm" style="color:var(--muted)">${esc(item.a)}</div>
      <div class="ar" id="hint"></div>
      <div id="fb"><div class="actions"><button class="btn sec" id="more">${t('more')}</button><button class="btn" id="show">${t('show')}</button></div></div>`;
  }else{
    const isMatn=q.type==='matn', isNum=false;
    const shown=isMatn?`<div class="ar sm" style="color:var(--muted)">${esc(item.a)}</div><div class="ar">${esc(q.start)} …</div>`:`<div class="ar">${esc(item.m)}</div>`;
    body=`<p class="qtype">${t(q.askKey)}</p>${shown}
      <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${isNum?'num':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>`;
  }
  app.innerHTML=`
    <div class="qhead"><span class="muted">${t('xOfY',Q.idx+1,Q.queue.length)}${cur.retry?t('retry'):''}</span>
      <button class="btn sec" id="stop" style="padding:6px 12px;font-size:.85rem">${t('finish')}</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card">${body}</div>`;
  document.getElementById('stop').onclick=finish;
  if(q.type==='flash'){
    const w=item.m.split(' '); let k=Math.max(1,Math.min(4,w.length-1));
    const more=document.getElementById('more');
    const hint=()=>{document.getElementById('hint').textContent=w.slice(0,k).join(' ')+' …'; if(k>=w.length-1) more.disabled=true;};
    hint();
    more.onclick=()=>{ if(k<w.length-1){k++;hint();} };
    document.getElementById('show').onclick=()=>{
      document.getElementById('fb').innerHTML=full(item)+`<div class="actions"><button class="btn danger" id="no">${t('no')}</button><button class="btn" id="yes">${t('yes')}</button></div>`;
      document.getElementById('yes').onclick=()=>answer(true);
      document.getElementById('no').onclick=()=>answer(false);
    };
  }else{
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(Q.answered)return;
      const val=q.opts[+b.dataset.i], ok=String(val)===String(q.correct);
      app.querySelectorAll('.opt').forEach(x=>{
        x.disabled=true;
        if(String(q.opts[+x.dataset.i])===String(q.correct)) x.classList.add('ok');
      });
      if(!ok) b.classList.add('bad');
      document.getElementById('fb').innerHTML=full(item)+`<div class="actions"><button class="btn" id="next">${t('next')}</button></div>`;
      document.getElementById('next').onclick=next;
      answer(ok,true);
    });
  }
}

function answer(ok,noAdvance){
  if(Q.answered)return; Q.answered=true;
  const cur=Q.queue[Q.idx], item=cur.item;
  if(!cur.retry){
    const p=S.prog[item.n]||{box:0,due:0,ok:0,bad:0};
    p.box=ok?Math.min(6,p.box+1):0;
    p.due=dayNum()+INT[p.box];
    ok?p.ok++:p.bad++;
    S.prog[item.n]=p; S.reviews=(S.reviews||0)+1; save();
    if(ok)Q.correct++;
  }
  if(!ok){
    if(!cur.retry){Q.wrong.push(item); Q.queue.push({item,retry:true});}
  }
  if(!noAdvance) next();
}
function next(){
  Q.idx++;
  if(Q.idx>=Q.queue.length) finish(); else renderQuestion();
}
function finish(){
  if(Q.queue.length && Q.idx>0){
    const d=dayNum();
    if(S.last!==d){S.streak=(S.last===d-1)?(S.streak||0)+1:1;S.last=d;save();}
  }
  Q.active=false;Q.done=true;render();
}
function renderDone(){
  const first=Q.queue.filter(x=>!x.retry).length;
  app.innerHTML=`<div class="card empty">
    <div class="big">${Q.correct}<span style="font-size:1.2rem;color:var(--muted)"> / ${Math.min(first,Q.total)}</span></div>
    <p class="muted">${t('firstTry')}</p>
    <p>${Q.wrong.length?t('attention'):t('noMist')}</p></div>
    ${Q.wrong.length?`<div class="card"><div class="mist">${Q.wrong.map(w=>`<div><div class="meta"><span class="chip">${t('numSign')} ${w.n}</span></div><div class="ar sm">${esc(w.m)}</div><div class="ar sm" style="color:var(--muted)">${esc(w.a)}</div></div>`).join('')}</div></div>`:''}
    <button class="btn" id="again" style="width:100%">${t('back')}</button>`;
  document.getElementById('again').onclick=()=>{Q=null;render()};
}

/* --- Выбор выученных --- */
function renderPick(){
  app.innerHTML=`
  <div class="sticky">
    <div class="card" style="margin-bottom:0">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="cnt"></b>
        <span class="row"><button class="btn sec" id="all" style="padding:6px 12px">${t('selAll')}</button><button class="btn sec" id="none" style="padding:6px 12px">${t('clear')}</button></span></div>
      <div class="row" style="margin-bottom:8px">
        <label class="f" style="min-width:90px">${t('from')}<input type="number" id="from" min="1" max="${DATA.length}" value="1" inputmode="numeric"></label>
        <label class="f" style="min-width:90px">${t('to')}<input type="number" id="to" min="1" max="${DATA.length}" value="${DATA.length}" inputmode="numeric"></label>
        <button class="btn" id="rOn" style="align-self:flex-end">${t('mark')}</button>
        <button class="btn sec" id="rOff" style="align-self:flex-end">${t('unmark')}</button>
      </div>
      <input type="search" id="q" placeholder="${esc(t('search'))}" value="${esc(pickFilter)}" dir="rtl">
      <p class="muted" style="margin:6px 0 0">${t('pickNote')}</p>
    </div>
  </div>
  <div class="list" id="list" style="margin-top:12px"></div>`;
  const $=id=>document.getElementById(id);
  const cnt=()=>{$('cnt').textContent=t('learned',learnedItems().length,DATA.length)};
  const draw=()=>{
    const f=pickFilter.trim();
    const wk=planInfo().exam;
    const items=DATA.filter(d=>!f||d.m.includes(f)||d.a.includes(f)||String(d.n)===f);
    $('list').innerHTML=items.length?items.map(d=>`<label class="pick ${S.learned[d.n]?'on':''}"><input type="checkbox" data-n="${d.n}" ${S.learned[d.n]?'checked':''}>
      <div><div class="top"><span class="chip">${t('numSign')} ${d.n}</span>${d.n>=wk.a&&d.n<=wk.b?`<span class="chip wk">${t('bookNo')} ${d.h}</span>`:''}</div>
      <div class="ar">${esc(d.m)}</div><div class="ar sm" style="color:var(--muted)">${esc(d.a)}</div></div></label>`).join('')
      :`<div class="card empty muted">${t('notFound')}</div>`;
    $('list').querySelectorAll('input').forEach(c=>c.onchange=()=>{
      const n=+c.dataset.n; if(c.checked)S.learned[n]=true; else delete S.learned[n];
      c.closest('.pick').classList.toggle('on',c.checked); save(); cnt();
    });
  };
  const setRange=v=>{
    let a=Math.max(1,Math.min(DATA.length,+$('from').value||1)), b=Math.max(1,Math.min(DATA.length,+$('to').value||DATA.length));
    if(a>b)[a,b]=[b,a];
    for(let n=a;n<=b;n++){ if(v)S.learned[n]=true; else delete S.learned[n]; }
    save();cnt();draw();
  };
  $('rOn').onclick=()=>setRange(true); $('rOff').onclick=()=>setRange(false);
  $('all').onclick=()=>{DATA.forEach(d=>S.learned[d.n]=true);save();cnt();draw()};
  $('none').onclick=()=>{S.learned={};save();cnt();draw()};
  $('q').oninput=e=>{pickFilter=e.target.value;draw()};
  cnt();draw();
}

/* --- Прогресс --- */
let resetArmed=false;
function renderStats(){
  const Li=learnedItems(), cnts=new Array(7).fill(0), lv=t('levels');
  Li.forEach(d=>cnts[(S.prog[d.n]||{box:0}).box]++);
  const mx=Math.max(1,...cnts);
  app.innerHTML=`
  <div class="card"><h2>${t('statsTitle')}</h2>
    ${Li.length?`<div class="dist">${cnts.map((c,i)=>`<div><span>${lv[i]}</span><span class="b"><i style="width:${c/mx*100}%"></i></span><b>${c}</b></div>`).join('')}</div>
    <p class="muted">${t('statsNote')}</p>`:`<p class="muted">${t('statsEmpty')}</p>`}
  </div>
  <div class="card"><div class="row" style="justify-content:space-between"><span>${t('totalAns')}</span><b>${S.reviews||0}</b></div>
    <div class="row" style="justify-content:space-between"><span>${t('streakDays')}</span><b>${curStreak()}</b></div>
    <div class="row" style="justify-content:space-between"><span>${t('dueNow')}</span><b>${dueItems().length}</b></div></div>
  <div class="card"><h2>${t('planTitle')}</h2>
    <div class="row" style="margin-bottom:8px">
      <label class="f">${t('perWeek')}<input type="number" id="pl1" min="1" max="30" value="${plan().per}" inputmode="numeric"></label>
      <label class="f">${t('nextTarget')}<input type="number" id="pl2" min="1" max="${DATA.length}" value="${planInfo().exam.b}" inputmode="numeric"></label>
    </div>
    <p class="muted" style="margin-top:0">${t('planNote')}</p>
    <button class="btn sec" id="plSave">${t('save')}</button></div>
  <div class="card"><h2>${t('backup')}</h2>
    <p class="muted">${t('backupNote')}</p>
    <textarea id="bk">${esc(JSON.stringify(Object.assign({name:cur.name},S)))}</textarea>
    <div class="actions"><button class="btn sec" id="imp">${t('loadBtn')}</button><button class="btn danger" id="rst">${t('resetAll')}</button></div>
    <div class="actions"><button class="btn danger" id="delp">${t('delProfile')}</button></div>
    <p class="muted" id="msg" style="margin:8px 0 0"></p></div>`;
  const $=id=>document.getElementById(id);
  $('plSave').onclick=()=>{
    const per=Math.max(1,Math.min(30,+$('pl1').value||11)), target=Math.max(1,Math.min(DATA.length,+$('pl2').value||33));
    S.plan={v:2,per,anchor:nextWed(),target}; save(); render();
  };
  $('imp').onclick=()=>{
    try{const o=JSON.parse($('bk').value); if(!o||typeof o!=='object'||!o.learned) throw 0;
      delete o.name; S=Object.assign(fresh(),o); S.lang=L; save(); render();
    }catch(e){$('msg').textContent=t('importErr');}
  };
  let delArmed=false;
  $('delp').onclick=()=>{
    if(!delArmed){delArmed=true;$('delp').textContent=t('delSure');setTimeout(()=>{delArmed=false;if($('delp'))$('delp').textContent=t('delProfile')},4000);return;}
    try{localStorage.removeItem(dkey(cur.key));}catch(e){}
    PR.list=PR.list.filter(x=>x.key!==cur.key); PR.last=null; savePR(); cur=null; S=blank(L); Q=null; render();
  };
  $('rst').onclick=()=>{
    if(!resetArmed){resetArmed=true;$('rst').textContent=t('sure');setTimeout(()=>{resetArmed=false;if($('rst'))$('rst').textContent=t('resetAll')},4000);return;}
    S=fresh();save();resetArmed=false;render();
  };
}
if(PR.last){const p0=PR.list.find(x=>x.key===PR.last); if(p0) loadProfile(p0);}
render();
</script>
