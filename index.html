الواجب، مما يدل على أنهم ما فهموا الوجوب، ولهذا رجح الشيخ عبد العزيز بن باز القول بالاستحباب بناء على ذلك.", "ج- أن عائشة ورد عنها إتمام الصلاة في السفر بعد وفاة النبي ﷺ، اجتهاداً منها، لأنها كانت تظن أن سبب قصر الصلاة في السفر هو المشقة، ورأت أن الإتمام لا يشق عليها، وقد روى البيهقي من طريق شعبة، عن هشام بن عروة، عن أبيه، عن عائشة أنها كانت تصلي في السفر أربعاً، فقلت: لو صليت ركعتين، فقالت: يا ابن أخي، إنه لا يشق علي.", "د- هذا التأويل من عائشة وقع في مقابلة النص الصريح، فقد ثبت أنه ﷺ قصر وهو مستقر في الأبطح، ثم قصر وهو مستقر في منى، وذلك في حجة الوداع، ومثل هذا لا مشقة فيه. ثم إن القصر في السفر لم يعلق بالمشقة حتى يقال بالتفريق بين مسافر يشق عليه السفر فيقصر، وآخر لا يشق عليه فيتم؛ لأن المشقة وصف غير منضبط؛ لأنه يختلف باختلاف الأشخاص والأحوال، فلا يصلح لبناء الحكم عليه، وإنما عُلق القصر بوصف منضبط له حقيقة معينة محدودة، وهو السفر، فمتى وجدت حقيقة السفر شرعاً، ثبت القصر مهما كانت حالة المسافر من الترفه والراحة.", "ه- تأويل عائشة ما روي عنها من إتمام الصلاة بأنه لعدم المشقة دليل واضح على بطلان ما روي أن النبي ﷺ كان يقصر في الصلاة ويتم، إذ لو صح أن النبي ﷺ أتم الصلاة في السفر، لكان إتمامها اتباعاً لسُنَّة النبي ﷺ، ولم تكن بحاجة إلى تأويل إتمامها بالاجتهاد.", "و- الحديث دليل على أن عثمان أتم الصلاة في السفر، وذلك في آخر خلافته سنة تسع وعشرين لما حج بالناس، فأتم الصلاة في منى، وجاء في حديث عبد الله بن عمر قال: (صليت مع النبي ﷺ بمنى ركعتين وأبي بكر وعمر، ومع عثمان صدراً من إمارته، ثم أتمها بمنى وغيره)؛ أي: غير منى من عرفة ومزدلفة، وفي رواية: وعثمان ثماني سنين، أو قال: ست سنين. وعن عبد الرحمن بن يزيد قال: (صلى بنا عثمان بن عفان بمنى أربع ركعات، فقيل ذلك لعبد الله بن مسعود، فاسترجع، ثم قال: صليت مع رسول الله ﷺ بمنى ركعتين، وصليت مع أبي بكر بمنى ركعتين، وصليت مع عمر بن الخطاب بمنى ركعتين، فليت حظي من أربع ركعات ركعتان متقبلتان).", "ز- ليس هناك شيء صريح في سبب إتمام عثمان، ولذا اختلف العلماء في توجيه ذلك على أقوال عديدة، منها: ١ - أن الأعراب كانوا قد حجوا تلك السنة، فأراد أن يعلمهم أن فرض الصلاة أربع، لئلا يتوهموا أنها ركعتان في الحضر والسفر، وهذا تأويل مردود، إذ لو كان الأمر كذلك لكان النبي ﷺ أولى بأن يُتِمَّ، لا سيما أن الأعراب الذين حجوا معه كانوا حديثي عهد بالإسلام، والعهد بالصلاة قريب. ٢ - أن عثمان كان إماماً للناس، والإمام حيث نزل فهو عمله ومحل ولايته، فكأنه وطنه، وهذا تأويل مردود - أيضاً - فإن النبي ﷺ هو إمام الخلائق على الإطلاق، ومع ذلك لم يتم الصلاة لهذا المعنى. ٣ - أن عثمان كان قد تأهل بمنى، والمسافر إذا أقام في موضع وتزوج فيه، أو كان له به زوجة أتم. قال ابن القيم: (وهذا أحسن ما اعتُذر به عن عثمان). ٤ - أنه يرى أن القصر رخصة غير واجبة، فأخذ بالأكمل، ورجح هذا القرطبي. 5 - أنه كان يرى أن القصر مختص بمن كان شاخصاً سائرًا، وأما من أقام في مكان أثناء سفره، فله حكم المقيم، فيتم، وهذا اختيار الحافظ ابن حجر."]}, "143": {"m": "وَعَنِ ابْنِ عُمَرَ رضي الله عنهما قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «َإِنّ اللَّهَ يُحِبُّ أَنْ تُؤْتَى رخَُصُهُ كَمَا يَكْرَهُ أَنْ تُؤْتَى مََعْصِيَتُهُ» رَوَاهُ أَحْمَدُ، وَ ابْنَُ خُزَْيمَةَ، وَ ابْنُ حِبّانَ فِي «صَحِيحَيْهِمَا»، وَ أبُو يَعْلَى المَوْصِلِيُّ - وَلَفْظُهُ: «إِنّ اللَّهَ عزوجل يُحِبُّ أنْ تُؤْتَى رخَُصُهُ كَمَا يُحِبُّ أنْ تُؤْتَى عَزَ ائِمُهُ» -.", "w": ["قوله: (إن الله يحب) المحبة من صفات الله تعالى الثابتة له بالكتاب والسنة وإجماع السلف، من غير تحريف ولا تعطيل، ولا تكييف ولا تمثيل، وهي محبة حقيقية تليق بالل تعالى، قال تعالى: {فسوف يأتي الله بقوم يحبهم ويحبونه} [المائدة: 5٤]، وأما تفسيرها بالثواب أو بالرضا ونحو ذلك، فهذا تعطيل؛ لأنه خلاف ظاهر النصوص، وخلاف طريقة السلف، وليس عليه دليل.", "قوله: (أن تؤتى رخصه) أي: تفعل، والرخص: جمع رخصة، وهي تخفيف الحكم الأصلي، دون إبطال العمل به؛ كالقصر والفطر في حق المسافر - مثلا ـ.", "قوله: (كما يكره) الكراهة من الله تعالى لمن يستحقها ثابتة بالكتاب والسنة وإجماع السلف، قال تعالى: {ولكن كره الله انبعاثهم} [التوبة: ٤6]، وهي كراهة حقيقية من الله تليق به، على ما تقدم.", "قوله: (أن تؤتى معصيته) أي: مخالفة أمره وارتكاب نهيه.", "وقد شبه الرسول صلى الله عليه وسلم محبة الله إتيان رخصه بكراهته إتيان المعصية، وذلك - والله أعلم - دليل على أن في ترك إتيان الرخصة ترك طاعة الله تعالى، كالترك للطاعة الحاصل بإتيان المعصية، فيكون ترك الطاعة بعدم الأخذ بالرخصة كترك الطاعة بفعل المعصية.", "قوله: (عزائمه) جمع عزيمة، وهي الحكم الثابت أصلا دون ملاحظة التخفيف؛ كالصوم في السفر، وإتمام الصلاة، ونحو ذلك."], "s": ["أ- الحديث دليل على إثبات الرخصة في الشريعة الإسلامية، وهي مبنية على العذر والتخفيف واليسر والسهولة ورفع الحرج والإثم عن المكلف، وحكمها الإباحة مطلقا، إذ لو كانت مأمورا بها لكانت عزائم، والحاصل أنها رخص، وما ورد من الأمر ببعض الرخص كالأكل من الميتة في المخمصة فذلك من دليل آخر.", "ب- الحديث دليل على أن الله تعالى يحب من عباده أن يأخذوا برخصه، لما فيها من التيسير والتسهيل عليهم، كما يكره أن تؤتى معصيته بترك واجب أو فعل محرم، لما في ذلك من الاستهانة بأحكام شرعه، وكلها عزائم، فالواجبات عزائم من الله تعالى لفعلها، والمحرمات عزائم من الله تعالى لتركها، ومن الرخص رخص السفر من القصر، والفطر، والجمع عند الحاجة إليه.", "ج- استدل بهذا الحديث من قال: إن القصر رخصة وليس بعزيمة، ولعل الحافظ ساقه مع أحاديث القصر لهذا الغرض، وهو تابع في ذلك لابن خزيمة، فإنه ساقه مع أحاديث القصر، وهكذا ابن بلبان في ترتيبه «صحيح ابن حبان»، كما سبقه إلى ذلك المجد ابن تيمية، وابن عبد الهادي، والله أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق عمارة بن غزية، عن حرب بن قيس، عن نافع، عن عبد الله بن عمر رضي الله عنهما، مرفوعا.", "والحديث صحيح على شرط مسلم، إلا حرب بن قيس، وقد نقل البخاري عن عمارة بن غزية أنه قال: إنه كان رضي، وذكره ابن حبان في «الثقات».", "والحديث له شواهد منها: حديث ابن عباس رضي الله عنهما قال: قال رسول الله صلى الله عليه وسلم: «إن الله يحب أن تؤتى رخصه كما يحب أن تؤتى عزائمه».", "وله شواهد أخرى من حديث ابن مسعود وأبي هريرة وأنس وأبي الدرداء وأبي أمامة وواثلة بن الأسقع، رضي الله عنهم أجمعين."]}, "144": {"m": "وَعَنِ العَلاءِ بْنِ الحَضْرَمِيِ رضي الله عنه أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «يَمْكُثُ المُهَاجِرُبَعْدَ قَضَاءِ نُسُكِهِ ثَلاثا» مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (يمكث المهاجر) بضم الكاف من باب قتل؛ أي: يقيم، وهذا اللفظ ليس في «الصحيحين» وكأن المؤلف تبع فيه ابن دقيق العيد في «الإلمام» وهو لفظ النسائي(١). والمهاجر: من هاجر من مكة إلى المدينة.", "قوله: (بعد قضاء نسكه)؛ أي: بعد فراغه من أعمال الحج، والنسك: بضمتين: العبادة، ويطلق على أعمال الحج.", "قوله: (ثلاثاً)؛ أي: ثلاثة أيام بلياليها، وجاء العدد مذكرًا؛ لكون التمييز محذوفاً كقوله تعالى: ﴿يَتَرََّبصنَ بِأَنفُسِهِنَّ أَربَعَةَ أَشهُرٍ وَعَشرًا﴾ [البقرة: ٢٣٤]، وقوله ﷺ: «من صام رمضان وأتبعه ستاً من شوال...»(٢)."], "s": ["أ- معنى الحديث أن الذين هاجروا من مكة إلى المدينة يحرم عليهم استيطان مكة قبل فتحها؛ لأن سكنى المدينة كان واجباً عليهم لنصرة النبي ﷺ ومواساته بالنفس، لكن أُبيح عند قصد مكة في حج أو عمرة أن يقيم بعد قضاء نسكه ثلاثة أيام لا يزيد عليها، فإن زاد صار مقيماً بمكة وخالف الأمر، وليس له أن يقيم بها بعد أن هجرها لل تعالى؛ ولهذا رثى النبي ﷺ لسعد بن خولة أنه مات بمكة.", "ب- استدل بهذا الحديث من قال: إن المسافر إذا نوى إقامة أربعة أيام فأكثر أتم الصلاة، وإن نوى أقل من أربعة أيام قصر، وعلى هذا تكون مدة الإقامة التي تقصر فيها الصلاة ثلاثة أيام، وهذا مروي عن سعيد بن المسيب، وهو قول مالك، والشافعي، ورواية عن الإمام أحمد، وإليه ذهب الليث بن سعد، وأبو ثور. ووجه الاستدلال: أن الترخيص في الإقامة في مكة ثلاثة أيام يدل على بقاء حكم السفر، بخلاف الأربعة، فالأربعة حد الإقامة، وما دونها حد السفر، فتقصر فيه الصلاة. قال الحافظ ابن حجر: (يستنبط من هذا الحديث أن إقامة ثلاثة أيام لا تُخرج صاحبها عن حكم المسافر)، ويؤيد هذا أن عمر حين أجلى اليهود من المدينة جعل لهم إقامة ثلاثة أيام في قضاء أمورهم، فدل على أن الثلاثة في حكم السفر، وما زاد في حكم الإقامة.", "وعن الإمام أحمد في الرواية المشهورة: أن المسافر إذا نوى إقامة أكثر من أربعة أيام أتم، وإن نوى أربعة فأقل قصر. ودليل ذلك حديث جابر في إقامة النبي ﷺ بالأبطح عام حجة الوداع، فإنه قدم صبيحة رابعة ذي الحجة، وانتقل إلى منى ضحى اليوم الثامن؛ لأنه صلى فيها الظهر، فتكون إقامته بالأبطح خمسة أيام متوالية، ثلاثة تامة، ويومان ناقصان، وهما يوما الدخول والخروج؛ لأن الرسول ﷺ صلى فجر اليوم الرابع بذي طوى، وصلى الظهر اليوم الثامن بمنى، فمجموع صلاته بالأبطح عشرون صلاة. وبهذا يكون حديث جابر موافقاً لحديث العلاء في كون ثلاثة أيام حداً للسفر، وما زاد عليها في حكم الإقامة. وإقامة النبي ﷺ بالأبطح إقامة مقصودة لذاتها، معلومة البداية والنهاية؛ لأن النبي ﷺ يعلم ما يحتاجه الطريق من المدينة إلى مكة من الأيام، ويعلم متى يبدأ الرحيل إلى منى، وهي أطول مدة أقامها النبي ﷺ في سفره بهذا الوصف، فيكون مدار الحكم عليها في تحديد المدة التي إذا أقامها المسافر قصر الصلاة، وهي خمسة أيام بيومي الدخول والخروج، أو ثلاثة بدونهما.", "وأما القول بأن المسافر يقصر أبداً ما دام في سفر، وهو قول شيخ الإسلام ابن تيمية وابن القيم، فهذا القول وإن كان له حظ من النظر، لكون الترخص معلقاً بالسفر، بدلالة الآية، ولم يرد في الشرع حد فاصل بين الإقامة والسفر، لكن الاحتياط باعتبار ما فعله النبي ﷺ في الأبطح أعلى حد لبقاء حكم السفر هو قول قوي؛ لأن الأصل في حق المقيم وجوب إتمام الصلاة، وتُرك هذا في حق من أقام ثلاثة أيام تام استناداً لما تقدم، فإن قيل: يمكن أن النبي ﷺ لو أقام أكثر من ثلاثة أيام قصر - أيضاً - قيل: هذه مجرد دعوى ليس لها دليل، ثم إنه لا يصح أن يجعل عدم الفعل سنة فعل، بل الأصل فيما يفعله أنه سنة ترك إذا علم القصد من تركه وعلى هذا فالإقامة نوعان: ١ - إقامة مقصودة لذاتها، فهذه يُعطى المسافر فيها ثلاثة أيام غير يومي الدخول والخروج، يقصر فيها الصلاة، وما زاد فإنه يتم.٢ - إقامة غير مقصودة لذاتها، وإنما لغرض لا يدري صاحبه متى ينتهي، فهذا في حكم المسافر ولو طالت المدة، لفعل النبي ﷺ في مكة وتبوك، حيث أقام في مكة تسعة عشر يوماً، وفي تبوك عشرين يوماً.", "ج- استدل بهذا الحديث من قال: إن طواف الوداع ليس من المناسك؛ بل هو عبادة مستقلة، يؤمر بها كل من أراد مفارقة مكة، سواءً أكان مكياً أم آفاقياً، وهذا أحد القولين في مذهب الشافعية، والمالكية، وهو مذهب الحنابلة، واختاره شيخ الإسلام ابن تيمية، وتلميذه ابن القيم. ووجه الدلالة: أن طواف الوداع يكون عند الرجوع، وسماه قاضياً للمناسك قبل الوداع؛ لأنه قال: (يقيم المهاجر بمكة بعد قضاء نسكه ثلاثاً). والقول الثاني: أن طواف الوداع من المناسك، وهذا أحد القولين عند الشافعية، والمالكية، وهو ظاهر مذهب الحنفية، وقد نص الشافعي على أنه نسك، ونقل ابن عبد البر الإجماع على ذلك، واستدلوا بقول ابن عمر: (لا ينفر أحدكم حتى يطوف بالبيت، فإن آخر النسك الطواف بالبيت)، فإخباره أن طواف الوداع آخر المناسك دليل على أنه من مناسك الحج. والقول بأنه من مناسك الحج قول قوي، فإن الرسول ﷺ أمر به الحجاج دون غيرهم من المعتمرين أو المقيمين، ولم يرد أنه أمر به أمرًا مطلقاً، فدل على أنه نسك مختص بالحاج، ولا يلزم على القول بأنه من المناسك أنه لا يجب على المكي أو من أقام، بدليل أن طواف القدوم من المناسك، وهو لا يشرع لمن أحرم من مكة، فدل على أن هذه الملازمة غير لازمة، ومما يؤيد ذلك عموم قوله ﷺ: «لتأخذوا مناسككم»، فإنه يفيد أن ما أمر به الرسول ﷺ في هذه الحجة فهو من مناسكها.", "وأما حديث العلاء فلا دلالة فيه؛ لأن المراد فيه قضاء المناسك المؤقتة بوقت معين كالوقوف، والمبيت، والرمي، أو يحمل على قضاء نسكه ومنه طواف الوداع، والله تعالى أعلم."]}, "145": {"m": "وَعَنِ ابْنِ عَبّاسٍ رضي الله عنهما قَالَ: «أَقََامَ النّبِيُّ صلى الله عليه وسلم تِسْعَةَ عَشَرَيَقْصُرُ، فَنَحْنُ إِذَا سَافَرَْنا تِسْعَةَ عََشَرَقَصَرََْنا، وَإِنْ زِدْنَا أَتْمَمْنَا». وَفِي لَفْظٍ: «أقَامَ النّبِيُّ صلى الله عليه وسلم بِمَكّةَ تِسْعَةَ عَشَرَيَوْما» رَوَاهُ البُخَارِيُّ. وَعِنْدَ أبِي دَاوَُدَ: «أقَامَ سَبْعَ عَشْرَةَ بِمَكّةَ يَقْصُرُالصّلاةَ»، قَالَ: وَقَالََ عَبّادُ بْنُ مَنْصُورٍ، عَنْ عِكْرِمَةَ، عَنِ ابْنِ عَبّاسٍ رضي الله عنهما: «أقَامَ تِسْعَ عَشْرَةَ». وَعِنْدَهُ مِنْ رِوَ ايَةِ ابْنِ إِسْحَاقَ: «أقَامََ بِمَكّةَ عَامَ الفَتْحِ خَمْسَ عَشْرَةَ يَقْصُرُ الصّلاةَ». وَقَالَ البَيْهَقِيُّ: «اخْتَلَفَتِ الرِوَ ايَاتُ فِي (تِسْعَ عَشْرَةَ) وَ (سَبْعَ عَشْرَةَ)، وَأصَحُّهَا عِنْدِي: رِوَ ايَةُ مَنْ رَوَى: (تِسْعَ عَشْرَةَ)».", "s": ["أ- هذه الحديث وحديث جابر في غزوة تبوك دليل على أن المسافر إذا أقام في مكان ما إقامة غير مقصودة ولا يعلم نهايتها، بل إن حاله وواقعه اقتضى أن يقيم فله أن يقصر ما أقام أبداً، ولا يتقيد ذلك بمدة معينة.", "وهذا مذهب مالك، والشافعي - في أحد الأقوال - وأحمد وأبي ثور، والقول الثاني للشافعية: أنه يقصر إلى ثمانية عشر يوما فقط، وهو المشهور عندهم، والقول الثالث: إلى تمام أربعة أيام فقط.", "والظاهر أن التحديد في مثل هذه الأحوال والأوصاف غير وجيه، فإن النبي صلى الله عليه وسلم أقام في مكة عام الفتح وفي تبوك إقامة طارئة غير مقصودة، وغير معلومة البداية ولا محددة النهاية، وإنما اقتضتها مصالح الجهاد وتأسيس قواعد الإسلام وإزالة آثار الشرك، فهو صلى الله عليه وسلم لم ينو مدة معلومة، وعليه فلا يصح في ما ورد في ذلك أن يقال فيه: إنه أقل مدة للقصر أو أقص ى مدة للإقامة، بل يقال: كل من أقام مدة غير معلومة فإن إقامته لا تكون قاطعة للسفر. ويقاس على ذلك كل من قدم إلى بلد لقضاء عمل معين لا يدري متى ينتهي؛ كمن نزل بلدا لتجارة أو مرافعة أو ملازمة غريم أو زيارة أو نزهة أو مراجعة الجهات الحكومية أو الأهلية، ونحو ذلك مما لا يعتبر المسافر معها قاطعا لسفره.", "فالذي يظهر من مجموع الأحاديث أنه لا توقيت للقصر بشيء من المدة المختلفة التي أقامها الرسول صلى الله عليه وسلم في أسفاره في بعض المواطن، مثل إقامته في مكة وتبوك، فإن ذلك واقع على ما اقتضاه الحال من الحاجة إلى تلك المدة التي أقامها، ولو دعت الحاجة إلى الزيادة عليها لاستمر القصر إلى فراغه، فهي إقامات وقعت اتفاقا، وما وقع اتفاقا لا يصح أن يكون حدا كما هو معلوم، وهذا ما فهمه عنه بعض أصحابه رضي الله عنهم، فهذا ابن عمر رضي الله عنهما أقام بأذربيجان ستة أشهر يقصر الصلاة، وكان يقول: (إذا أزمعت إقامة أتم).", "فقد بقي ابن عمر هذه المدة يقصر؛ لأنه لم يقصد الإقامة بل كان مكرها عليها؛ لأنه حاصره الثلج فمنعه من السفر، ودل قوله ذلك على أن المسافر يقصر ما لم يعزم على الإقامة.", "وبهذا يتم الجمع بين ما اختلف من الروايات في مدة إقامته صلى الله عليه وسلم، وأن الصواب أن مدة الإقامة غير محددة بأيام معينة، كما تقدم، والله تعالى أعلم."], "t": ["رواية أبي داود الأولى فهي من طريق حفص، عن عاصم، عن عكرمة، عن ابن عباس رضي الله عنهما بلفظ: (سبع عشرة)، وإسنادها صحيح على شرط البخاري، لكن رواية البخاري: (تسع عشرة) أرجح منها، وإلى هذا أشار أبو داود بعد سياق هذه الرواية، أو يصار إلى الجمع بينهما، فيكون من قال: سبعة عشر يوما لم يعد يوم الدخول ويوم الخروج.", "وأما روايته الثانية فهي من طريق محمد بن إسحاق، عن الزهري، عن عبيد الله بن عبد الله، عن ابن عباس رضي الله عنهما بلفظ: (خمس عشرة).", "وهذه الرواية ضعفها النووي، وذلك لأن فيها محمد بن إسحاق، وهو صدوق مدلس، وقد عنعن، لكن رد عليه الحافظ بأن رواتها ثقات، ولم ينفرد بها ابن إسحاق، فقد أخرجها النسائي من رواية عراك بن مالك، عن عبيد الله كذلك، ومع ذلك فرواية البخاري أرجح على ما تقدم."]}, "146": {"m": "وَعَنْ أَنَسِ بْنِ مَالِكٍ رضي الله عنه قَالَ: «كَانَ رَسُولُ اللَّهِ صلى اللهَ عليه وسلم إِذَا ارْتَحَلَ قَبْلَ أَنْ تَزِيغَ الشّمْسُ أَخّرَالظُّهْرَإِلَى وَقْتِ العَصْرِ، ثُمّ نَزلََ فَجَمَعَ بَيْنَهُمَا، فَإِنْ زاغَتِ الشّمْسُ قَبْلَ أنْ يَرَْتحِلَ صَلّى الظُّهْرَ، ثُمّ رَكِبَ» مُتّفَقٌ عَلَيْهِ.", "s": ["أ- الحديث دليل على جواز الجمع بين الظهر والعصر جمع تأخير في وقت العصر إذا غادر المسافر مكانه قبل الزوال؛ لأنه لم يدخل وقت الظهر، فيؤخرها مع العصر.", "ب- الحديث دليل على جواز الجمع بين الظهر والعصر جمع تقديم في وقت الظهر إذا ارتحل المسافر بعد الزوال من مكانه، وهذا إنما يتم بالنسبة لهذا الحديث إن صحت زيادة: (صلى الظهر والعصر جميعا ثم ارتحل) وإلا فهو خاص بجمع التأخير، كما تقدم.", "وأما جمع التقديم فقد دل عليه أحاديث أخرى، كما تقدم في الجمع بعرفة بين الظهر والعصر في وقت الظهر، وكذا حديث ابن عباس رضي الله عنهما: (أن رسول الله صلى الله عليه وسلم جمع بين الصلاتين في سفرة سافرها في غزوة تبوك، فجمع بين الظهر والعصر والمغرب والعشاء …)، فهو يدل بعمومه على جمع التقديم وجمع التأخير، وكذا حديث معاذ رضي الله عنه: (أن النبي صلى الله عليه وسلم كان في غزوة تبوك إذا ارتحل قبل زيغ الشمس أخر الظهر إلى أن يجمعها إلى العصر فيصليهما جميعا، وإذا ارتحل بعد زيغ الشمس عجل العصر إلى الظهر وصلى الظهر والعصر جميعا ثم سار، وكان إذا ارتحل قبل المغرب أخر المغرب حتى يصليها مع العشاء، وإذا ارتحل بعد المغرب عجل العشاء فصلاها مع المغرب).", "وقد أجمع العلماء على مشروعية الجمع بين الظهر والعصر جمع تقديم بعرفة، والجمع بين المغرب والعشاء ليلة مزدلفة، وممن حكى الإجماع ابن المنذر، وابن قدامة، والنووي، وابن رشد، وغيرهم، ثم اختلفوا فيما عدا ذلك، فمنهم من منع الجمع إلا فيما ذكر، وهم الحنفية وبعض التابعين، واحتجوا بأن المواقيت ثبتت بالتواتر، فلا يجوز تركها بخبر واحد، وحملوا أحاديث الجمع على الجمع الصوري، وهو أن يصلي الأولى في آخر وقتها، والأخرى في أول وقتها.", "وهذا مذهب ضعيف لا يعول عليه، فإن الجمع ليس تركا لأدلة المواقيت، لكنه تخصيص لها في بعض الحالات بسنة الرسول صلى الله عليه وسلم، وأما قولهم بالجمع الصوري فهو ضعيف أيضا؛ لأن الجمع رخصة، وإيقاع كل صلاة في وقتها أهون مما ذكروه وضيقوا به.", "ومن أهل العلم من قال بالجمع ثم اختلفوا على أقوال:", "الأول: جواز الجمع بين الظهر والعصر وبين المغرب والعشاء بعذر السفر جمع تقديم أو جمع تأخير، وهذا قول الشافعي، وأحمد في المشهور، ومالك في رواية، واستدلوا بحديث أنس على جمع التأخير، وحديث معاذ على جمع التقديم.", "والقول الثاني: أن الجمع مختص بحالة الجد في السفر، وهو المشهور عن مالك في رواية ابن القاسم عنه، لحديث ابن عمر رضي الله عنهما قال: (كان النبي صلى الله عليه وسلم يجمع بين المغرب والعشاء إذا جد به السير)، وهذا قول مرجوح. والقول الثالث: جواز جمع التأخير ومنع جمع التقديم، وهذا رواية عن أحمد، وهو قول ابن حزم الظاهري، بشرط الجد في السفر، واستدلوا بحديث أنس المذكور في «الصحيحين»، وليس فيه ذكر جمع التقديم.", "والقول الأول هو الراجح في هذه المسألة، لقوة أدلتهم، فإن أدلة جمع التقديم وإن كان فيها مقال لكن باجتماعها تقوى، وتؤيدها أدلة أخرى؛ كجمع عرفة، وعمومات جاءت في الجمع، إضافة إلى حكمة التشريع، وذلك مما يتمشى مع يسر الشريعة الإسلامية ورفع الحرج عن المكلفين.", "وعلى المسافر أن يفعل الأرفق به، فإن كان الأرفق جمع التقديم قدم العصر مع الظهر والعشاء مع المغرب، وإن كان الأرفق به جمع التأخير أخر الظهر مع العصر والمغرب مع العشاء، فإن استويا فالتأخير أفضل؛ لأن أحاديثه أصح، ولأن تأخير الصلاة عن وقتها لعذر أخف من تقديمها على وقتها، والله تعالى أعلم."]}, "147": {"m": "وَعَنْ نَافِعٍ: «أَنّ ابْنَ عُمَرَرضي الله عنهما كَانَ إِذَا جَدّ بِهِ السّيْرُجَمَعَ بَيْنَ المَغْرِبِ وَالعِشَاءِ بَعْدَ أَنْ يَغِيبَ الشّفَقُ، وَيَقُولُ: إِنّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ إِذَا جَدّ بِهِ السّيْرُجَمَعَ بَيْنَ المَغْرِبِ وَالعِشَاءِ» مُتّفَقٌ عَلَيْهِ.", "s": ["أ- الحديث دليل على ثبوت الجمع بين المغرب والعشاء جمع تأخير بعد دخول وقت العشاء بمغيب الشفق، وهذا الجمع سُنَّة في السفر لمن جدَّ به السير، لخوف فوات أمر، أو لإدراك مُهِمٍّ، وهذا قول الإمام مالك، والليث. وجاء في حديث ابن عباس أن النبي ﷺ كان يجمع في السفر بين صلاة الظهر والعصر إذا كان على ظهر سفر، ويجمع بين المغرب والعشاء، وهذا دليل على أن الجمع سنة لمن كان على ظهر سير، وأما من لم يكن على ظهر سير فالأفضل ألا يجمع، وهذا قول ابن حبيب من المالكية. وجاء في حديث أنس أن رسول الله ﷺ كان يجمع بين هاتين الصلاتين في السفر؛ يعني: المغرب والعشاء. وهذا نص مطلق، لم يقيد بواحد من التقييدين السابقين، وهما: اشتداد السير به، وعلى ظهر سفر، وقد بوب البخاري فقال: به السير، وحديث ابن عباس، وهو مقيد بما إذا كان سائرًا، وحديث أنس، وهو مطلق، واستعمل المصنف الترجمة مطلقة، إشارة إلى العمل بالمطلق؛ لأن المقيد فرد من أفراده، وكأنه رأى جواز الجمع بالسفر، سواء كان سائرًا أم لا، وسواء كان سيره مجداً أم لا...). وقد أخذ بهذا الإطلاق كثير من الصحابة والتابعين، ومن الفقهاء الثوري، والشافعي، وأحمد، وإسحاق، وأبو ثور، وابن المنذر، وأشهب، وحكاه ابن قدامة عن مالك أيضاً. وقال الزرقاني: (وإليه ذهب مالك في رواية مشهورة) وقال صاحب المرعاة: (وهو مختار المالكية كما في فروعهم). وأما تخصيص الجمع بمن جدَّ به السير فهو قول مرجوح؛ لأنه جاء في غير هذا الحديث - الذي استدلوا به - زيادة يجب الأخذ بها، وهي الجمع من غير جِدٍّ في السير، كما مر. يقول ابن عبد البر في كلامه على حديث معاذ أن النبي ﷺ كان في تبوك فأخر الصلاة يوماً، ثم خرج، فصلى الظهر والعصر جميعاً، ثم دخل، ثم خرج، فصلى المغرب والعشاء جميعاً.", "قال ابن عبد البر: (في هذا الحديث أوضح الدلائل، وأقوى الحجج في الرد على من قال: لا يجمع المسافر بين الصلاتين، إلا إذا جدَّ به السير). وقال - أيضاً -: (في حديث معاذ المذكور في هذا الباب، ما يقطع الالتباس في أن للمسافر أن يجمع بين الصلاتين، وإن لم يَجِدَّ به السير؛ وليس فيما روي من الآثار عن النبي ﷺ أنه كان إذا جدَّ به السير، جمع بين المغرب والعشاء؛ ما يعارض حديث معاذ بن جبل؛ لأن المسافر إذا كان له في السنة أن يجمع بين الصلاتين نازلاً غير سائر، فالذي يَجِدُّ به السير أحرى بذلك؛ وليس في واحد من الحديثين ما يُعترض على الثاني به، وهما حالان، وإنما كانا يكونان متعارضين، لو كان في أحدهما أن رسول الله ﷺ قال: لا يجمع المسافر بين الصلاتين إلا أن يَجِدَّ به السير، وفي الآخر أن رسول الله ﷺ جمع بين الصلاتين في سفره إلى تبوك نازلاً غير سائر؛ فأما أن يجمع وقد جدَّ به السير، ويجمع وهو نازل لم يَجِدَّ به السير؛ فليس هذا بمتعارض عند أحد له فهم، وبالل التوفيق)، وقال - أيضاً -: (وقد أجمع المسلمون قديماً وحديثاً على أن الجمع بين الصلاتين بعرفة الظهر والعصر في أول وقت الظهر، والمغرب والعشاء بالمزدلفة في وقت العشاء، وذلك سفر مجتمع عليه؛ وعلى ما ذكرنا فيه، فكل ما اختلف فيه من مثله فمردود إليه). وإذا تقرر جواز الجمع للسائر والنازل، فينبغي أن يعلم أن الجمع للسائر لا إشكال فيه، وأما الجمع للنازل فهو منوط بالحاجة إلى الجمع؛ لأن المستفاد من سنة النبي ﷺ في أسفاره للحج أو الجهاد أنه لم يكن ملازماً للجمع، ومن المعلوم أن المسافر وإن كان نازلاً قد يعرض له حالات يحتاج معها إلى الجمع، لكن لا ينبغي التوسع أو التساهل في ذلك. يقول شيخ الإسلام ابن تيمية: (فَعَلُ كلُّ صلاة في وقتها أفضل، إذا لم يكن به حاجة إلى الجمع، فإن غالب صلاة النبي ﷺ التي كان يصليها في السفر إنما يصليها في أوقاتها، وإنما كان الجمع منه مرات قليلة...). ويقول الشيخ عبد الرحمن السعدي: (الجمع أوسع من القصر، ولهذا له أسباب أخر غير السفر، كالمرض والاستحاضة ونحوها من الحاجات، والقصر أفضل من الإتمام، بل يكره الإتمام لغير سبب. وأما الجمع في السفر فالأفضل تركه إلا عند الحاجة إليه، أو إدراك الجماعة به، فإذا اقترن به مصلحة جاز).", "ب- الحديث صريح في أن جمع المغرب مع العشاء كان بعد دخول وقت العشاء لقوله: (بعد أن يغيب الشفق) وفي هذا رد واضح، وإبطال لتأويل الحنفية في قولهم: إن المراد بالجمع: تأخير الأولى إلى آخر وقتها وتقديم الثانية إلى أول وقتها، وهو ما يسمونه الجمع الصوري؛ لأنه جمع في الصورة، وإلا فكل صلاة مفعولة في وقتها، ويسمى بـ (جمع الفعل) و(جمع المواصلة) و(الجمع المعنوي) وهذا تأويل مردود لما يلي: ١ - أن الجمع من الرخص العامة لجميع الناس، ولو كان على ما ذكرته الحنفية لكان أعظم ضيقاً وأشد حرجاً من الإتيان بكل صلاة في وقتها؛ لأن أوائل الأوقات وأواخرها مما لا يدركه أكثر الخاصة فضلاً عن العامة. ٢ - أن ما ذكروه من الجمع الصوري لا يقع عليه اسم الجمع عرفاً؛ لأن هذا قد صلى كل صلاة في وقتها الخاص بها، وإنما الجمع - كما تقدم - ضم واحدة من الصلاتين إلى الأخرى في وقت إحداهما؛ كجمع عرفة ومزدلفة. ٣ - أنه لو جاز الجمع الصوري، لجاز الجمع بين العصر والمغرب، والعشاء والصبح - على القول بأن آخر وقت العشاء طلوع الفجر، ولا خلاف بين الأمة في تحريم ذلك، والله تعالى أعلم."]}, "148": {"m": "وَرَوَى أَبُو دَاوُدَ مِنْ رِوَ ايَةِ مُحَمّدِ بْنِ فُضَيْلٍ، عَنْ أَبِيهِ، عَنْ نَافِعٍ وَعَبْدِ اللَّهِ بْنِ وَ اقِدٍ: «أَنّ مُؤَذِنَ ابْنِ عُمَرَرضي الله عنهما قَالَ: الصّلاةَ، قَالَ: سِرْ، حَتّى إِذَا كَانَ قَبْلَ غُرُوبِ الشّفَقِ نَزلََ فََصَلّى المَغْرِبَ، ثُمّ انْتَظَرَحَتّى غَابَ الشّفَقُ فَصَلّى العِشَاءَ. ثُمّ قَالَ: إِنّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ إِذَا عَجِلَ بِهِ أمْرٌصَنَعَ مِثْلَ الّذِي صَنَعْتُ، فَسَارَفِي ذَلِكَ اليَوْمِ وَاللّيْلَةِ مَسِيرَةَ ثَلاثٍ». قَالَ أَبُودَاوُدَ: «رَوَاهُ ابْنُ جَابِرٍعَنْ نَافِعٍ نَحْوَهَذَا بِإِسْنَادِهِ، وَرَوَاهُ عَبْدُ اللَّهِ بْنُ العَلاءِ بْنِ زَبْرٍعَنْ نَافِعٍ قَالَ: (حَتّى إِذَا كَانَ عِنْدَ ذَهَابِ الشّفَقِ نَزلََ فَجَمَعَ بَيْنَهُمَا)».", "w": ["قوله: (حتى إذا كان قبل غروب الشفق) هكذا في «المحرر» والذي في «سنن أبي داود»: (قبل غيوب الشفق)؛ أي: قبل مغيبه، والغيوب أحد مصادر الفعل غاب، فإنه يقال: غاب الشيء يغيب غيباً وغيبة وغياباً - بالكسر - وغُيوباً ومَغيباً... وهذا صريح في الجمع الصوري."], "s": ["أ- ظاهر الحديث أن هذا الجمع الذي فعله ابن عمر هو الجمع الصوري لا الجمع الحقيقي؛ لأنه صلى المغرب قبل غروب الشفق؛ أي: في آخر وقتها، وصلى العشاء بعد غروبه؛ أي: في أول وقتها. وهذا مخالف لما تقدم من أحاديث «الصحيحين» من أن جمع ابن عمر كان في وقت الثانية جمعاً حقيقياً، كما في رواية مسلم من طريق عبيد الله، عن نافع أن ابن عمر كان إذا جدَّ به السير جمع بين المغرب والعشاء بعد أن يغيب الشفق. فمن أهل العلم من قال: إنه لا معارضة بين هذه الروايات؛ لإمكان حملها على تعدد الواقعة، فيكون ابن عمر جمع في بعض الحالات جمعاً حقيقياً، وفي بعضها جمعاً صورياً. ومنهم من حكم على رواية (قبل غيوب الشفق) بالشذوذ؛ لأن المشهور من فعل ابن عمر أنه جمع بعد غروب الشفق؛ لأن رواية (بعد أن يغيب الشفق) رواها عدد من الحفاظ من أصحاب ابن عمر، بخلاف رواية (قبل غروب الشفق) كما تقدم. ثم إن حديث ابن جابر وعبد الله بن العلاء ليس فيهما أن ابن عمر صلى المغرب قبل غيوب الشفق، وإنما في حديثهما: (أنه نزل عند ذهاب الشفق). وهذا هو الصواب، وهو أن رواية: (قبل غيوب الشفق) شاذة، وأن رواية: (بعد أن يغيب الشفق) هي المحفوظة. وأما القول بتعدد الواقعة فهو ضعيف في نظري؛ لأن ابن عمر ما كان يكثر من الجمع في السفر، ثم إن قول من معه: (الصلاة) دليل على ذلك، حيث استنكر تأخيره المغرب، ولو كانت عادة ابن عمر الجمع، لما قال له ذلك.", "ب- في الحديث دليل على ما كان عليه الصحابة ومن بعدهم من سلف هذه الأمة من مراعاة أوقات الصلاة والحرص على أدائها في أول وقتها، فهذا مؤذن ابن عمر يخاطبه بقوله: الصلاة؛ خوفاً أن يكون نسي ابن عمر فذكَّره من معه.", "ج- جواز تأخير البيان إلى وقت الحاجة؛ لقوله: (سِر) ثم بعد ذلك بين له بعد الصلاة هدي النبي ﷺ في ذلك وأنه مقتدٍ به.", "د- في الحديث دليل على أنه ينبغي تنبيه أهل العلم والفضل إلى فعل الخير إذا ظُنَّ غفلتهم، وفي رواية النسائي: (الصلاة يرحمك الله) أدب نافع مع ابن عمر حيث أردف التنبيه على الصلاة بالدعاء له تعظيماً، والله تعالى أعلم."], "t": ["هذا الحديث رواه أبو داود والدارقطني من طريق محمد بن فضيل، عن أبيه، عن نافع، وعبد الله بن واقد، أن مؤذن ابن عمر... وذكر الحديث. وهذا الإسناد رجاله ثقات، إلا عبد الله بن واقد، وهو ابن عبد الله بن عمر بن الخطاب القرشي العدوي، فقد ذكره ابن حبان في «الثقات»، وقال عنه في «التقريب» مقبول؛ أي: في المتابعات.", "ورواه أبو داود من طريق عيسى بن يونس، عن ابن جابر، عن نافع، عن ابن عمر بهذا المعنى. ورواه النسائي من طريق الوليد بن مسلم، عن ابن جابر بنحوه، ورواه النسائي - أيضاً - والدارقطني من طريق عطاف بن خالد، حدثني نافع بنحوه.", "قال أبو داود: ورواه عبد الله بن العلاء بن زَبر، عن نافع قال: حتى إذا كان عند ذهاب الشفق نزل فجمع بينهما. ومعنى: عند ذهاب الشفق؛ أي: قرب ذهابه، فيوافق رواية: (حتى إذا كان قبل غيوب الشفق نزل فصلى)، وغرض أبي داود من ذلك بيان أن في المتن اختلافاً. وأما قول بعض الشراح من الحنفية إنه يريد بذلك تقوية حديث فضيل بن غزوان، فالذي يظهر لي أن هذا إنما يكون على مذهب الحنفية القائلين بالجمع الصوري، حتى يتم استدلالهم بالحديث، وإلا فرواية فضيل بن غزوان لا تتقوى بمثل ما ذكر، كما سيأتي - إن شاء الله -. وعبد الله بن واقد ومن وافقه مثل فضيل بن غزوان، وعطاف بن خالد قد خالفوا الثقات الأثبات من أصحاب نافع، ومنهم أسلم مولى ابن عمر، وسالم بن عمر، وعبد الله بن دينار، وإسماعيل بن أبي ذؤيب - وقيل: ابن ذؤيب - وغيرهم، فكلهم ذكروا أن نزول ابن عمر لصلاة الجمع كان بعد غروب الشفق، والعدد الكثير أولى بالحفظ، وعبد الله بن واقد مقبول، كما تقدم، فلا يعتبر بروايته مع وجود رواية هؤلاء الحفاظ، ثم إن عبد الله بن واقد لم يختلف عليه في أن الجمع قبل غيوب الشفق. قال البيهقي: (رواية الحفاظ من أصحاب نافع أولى بالصواب...). أما نافع فقد اختلف عليه، فقد رُوي عن فضيل بن غزوان أن نزول ابن عمر كان قبل غيوب الشفق، كما تقدم، وأما الحفاظ من أصحابه أمثال عبيد الله بن عمر، وأيوب السختياني، وموسى بن عقبة، والليث بن سعد، فقد رووا عنه أن نزول ابن عمر كان بعد غيوب الشفق، وهو الصواب؛ لأن فضيل بن غزوان وإن كان ثقة لكنه تفرد بهذه الجملة من بين ثقات أصحاب نافع، ما قالها أحد غيره، وهو لا شك دون عبيد الله بن عمر في الحفظ والإتقان، ودون أيوب وموسى بن عقبة والليث، فتكون روايته شاذة. قال البيهقي: (اتفقت رواية يحيى بن سعيد الأنصاري، وموسى بن عقبة، وعبيد الله بن عمر... عن نافع، على أن جمع ابن عمر بين الصلاتين كان بعد غيبوبة الشفق، وخالفهم من لا يدانيهم في حفظ أحاديث نافع). وقال - أيضاً - مشيرًا إلى رواية فضيل بن غزوان وابن جابر وعطاف بن خالد في أن الجمع كان قبل غيوب الشفق: (فهؤلاء قد خالفوا الأئمة الحفاظ من أصحاب نافع في هذه الرواية، ولا يمكن الجمع بينهما، فتترك روايتهم، وتأخذ برواية الحفاظ من أصحاب نافع)."]}, "149": {"m": "وَعَنِ ابْنِ عَبّاسٍ رضي الله عنهما: «أَنّ النّبِيّ صلى الله عليه وسلم صَلّى بِالمَدِينَةِ سَبْعا وَثَمَانِيا؛ الظُّهْرَوَالعَصْرَ، وَالمَغْرِبَ وَالعِشَاءَ» مُتّفَقٌ عَلَيْهِ. وَلمُِسْلِمٍ: «جَمَعَ رَسُولُ اللَّهِ صلى الله عليه وسلم بَيْنَ الظُّهْرِ وَالعَصْرِ، وَالمَغْرِبِ وَالعِشَاءِ بِالمَدِينَةِ، فِي غَيْرِ خَوْفٍ وََلَا مَطَرٍ، قُلْتُ لَابْنِ عَبّاسٍ: لِمَ فَعَلَ ذَلِكَ؟ قَالَ: كَيْ لَا يُحْرِجَ أُمّتَهُ». وَفِي لَفْظٍ لَهُ: «فِي غَيْرِخَوْفٍ وََلَا سَفَرٍ». وَقَدْ تَكَلّمَ ابْنُ سُرَْيجٍ فِي قَوْلِهِ: «وََلَا مَطَرٍ».", "w": ["قوله: (كي لا يُحرج أمته) أي: لئلا يوقع أمته في الحرج، وأصل الحرج: الضيق، مأخوذ من المكان الضيق الكثير الشجر الذي لا تصل إليه الراعية."], "s": ["أ- اختلف العلماء في العذر الذي جمع له النبي ﷺ الصلاة في المدينة على أقوال:", "١- فمن أهل العلم من تأوله على أنه جمع بعذر المطر، وهذا مشهور عن جماعة من كبار المتقدمين، وهو الذي حمله عليه أبو الشعثاء كما في رواية البخاري، وحمله عليه الإمام مالك، وهو تأويل ضعيف، برواية: (من غير خوف ولا مطر)، إلا على رأي ابن سريج ومن وافقه ممن يتكلم في رواية: (ولا مطر) ومن حمله على هذا لزمه القول بجواز الجمع للمطر بين الظهرين والعشاءين. ومما يؤيد أنه جمع لغير مطر أن ابن عباس - وهو راوي الحديث - لما خطب الناس في أمر مهم من أمور المسلمين وجمع بين الصلاتين استدل على ما فعله بما رواه، فعلم بذلك أن الجمع الذي رواه لم يكن في مطر.", "٢- ومِنهُم من تأوله على أنه من الجمع الصوري - الذي تقدم معناه - وأن النبي ﷺ فعل ذلك ليبين جواز تأخير الصلاة إلى آخر وقتها، وقد دل على هذا رواية عمرو بن دينار عن أبي الشعثاء عند مسلم، وهذا ضعيف أو باطل؛ لأنه مخالف للظاهر مخالفة لا تُحتمل، وقد اختار هذا التأويل القرطبي، والحافظ ابن حجر، وتبعهما الصنعاني، والشوكاني.", "٣- ومِنهُم من حمله على الجمع بعذر المرض أو نحوه مما هو في معناه من الأعذار، وهذا قول الإمام أحمد، والخطابي، وبعض الشافعية؛ لأن المشقة في المرض أشد من المشقة في المطر، وهذا فيه نظر؛ لأنه لو كان الجمع لذلك لم يصلِّ معه إلا من به نحو ذلك العذر. وقال الشيخ عبد العزيز بن باز: (الصواب حمل الحديث المذكور على أنه ﷺ جمع بين الصلوات المذكورة لمشقة عارضة في ذلك اليوم من مرض غالب، أو برد شديد، أو وحل ونحو ذلك، ويدل على ذلك قول ابن عباس لما سئل عن علة هذا الجمع قال: «لئلا يحرج أمته» وهو جواب عظيم سديد شريف، والله أعلم)، فيستفاد من ذلك جواز الجمع في الحضر للحاجة مطلقاً، بشرط ألا يُتخذ ذلك عادة وخلقاً، وهو قول ابن سيرين، وابن المنذر، وبعض المالكية، وجماعة من الشافعية، وقال النووي: (يؤيده ظاهر قول ابن عباس: أراد ألا يحرج أمته، فلم يعلله بمرض ولا غيره)، وهذا رأي الإمام أحمد، فإن مذهبه في الجمع - كما يقول شيخ الإسلام ابن تيمية - أوسع المذاهب، لأنه نص على جوازه للحرج والشغل، وقد اختاره شيخ الإسلام ابن تيمية، وابن القيم ودافعا عنه دفاعاً قوياً مدعماً بالأدلة ومقاصد الشريعة.", "ب- يستدل الفقهاء من المالكية والشافعية والحنابلة بهذا الحديث على جواز الجمع بين الصلاتين في الحضر بعذر المطر. ووجه الاستدلال: أن قوله - كما في رواية حبيب بن أبي ثابت -: (من غير خوف ولا مطر) دليل على الجمع للمطر والخوف، كما دلت رواية أبي الزبير على الجمع للخوف والسفر في قوله: (من غير خوف ولا سفر) يقول شيخ الإسلام ابن تيمية: (وبهذا استدل أحمد على الجمع لهذه الأمور بطريق الأولى، فإن هذا الكلام يدل على أن الجمع لهذه الأمور أولى، وهذا من باب التنبيه بالفعل، فإنه إذا جمع ليرفع الحرج الحاصل بدون الخوف والمطر والسفر، فالحرج الحاصل بهذه أولى أن يرفع، والجمع لها أولى من الجمع لغيرها). ثم إن قوله: (أراد ألا يحرج أمته) قد يحمل على المطر، فيكون المعنى: لئلا يلحق أمته حرج بمشقة المشي في الطين إلى المسجد، كما قال البيهقي، واختاره النووي، كما تقدم. ثم إن جمع المطر ثابت عن بعض الصحابة، فقد ثبت عن ابن عمر، وفعله أبو بكر، وعمر، وعثمان.", "وذهب جماعة من أهل العلم إلى منع الجمع في الحضر بعذر المطر، وهو قول الليث بن سعد، والحنفية، واستدل الليث بعدم ورود الجمع عن صحابة رسول الله ﷺ مع وجود مبرراته وأسبابه وحاجتهم إليه.", "واستدلت الحنفية بأن أوقات الصلاة ثبتت بلا خلاف، ولا يجوز إخراج صلاة عن وقتها إلا بنص غير محتمل، إذ لا ينبغي أن يُخرج عن أمر ثابت بأمر محتمل، فهم لا يقولون بالجمع مطلقاً في غير عرفة ومزدلفة، وما عداهما يحملون الأدلة الواردة فيه على الجمع الصوري، ويقولون إن حديث ابن عباس الوارد فيه ذكر المطر فيه شيء من الاضطراب. وهذا مردود بما تقدم من أن الراجح رواية حبيب بن أبي ثابت (من غير خوف ولا مطر). وأما استدلال الليث على منع الجمع بعدم وروده عن الصحابة فهو مردود بما تقدم من ثبوته عنهم، بل قال شيخ الإسلام ابن تيمية: إن الجمع للمطر منقول عن الصحابة بالتواتر، ولعل هذه الآثار لم تبلغ الليث بن سعد لبعده عن المدينة. وأما قولهم: إن المواقيت ثبتت بالتواتر فلا تترك بأمر محتمل، فهو مردود بأن الكل حق من عند الله تعالى، فالذي شرع المواقيت هو الذي شرع الجمع، ففي أوقات السعة تُصلَّى الصلوات في وقتها، وفي أوقات العذر يجوز الجمع، فلا يؤخذ ببعض السنن ويترك بعضها. وأما تأويلهم الجمع الوارد في النصوص بالجمع الصوري، فقد تقدم فساده.", "ج- اختلف العلماء المجيزون للجمع بين الصلاتين في الحضربعذرالمطرفي الجمع بين الظهروالعصرعلى قولين:", "القول الأول: أنه لا يجوز الجمع بين الظهرين في اليوم المطير، وإنما هو مختص بالمغرب والعشاء، وهذا قول المالكية، والحنابلة، واستدلوا بالأدلة التي نص فيها على المغرب والعشاء؛ كحديث مالك عن نافع أن ابن عمر كان إذا جمع الأمراء بين المغرب والعشاء في المطر جمع معهم. وفي حديث ابن عمر جمع رسول الله ﷺ بين العشاءين في ليلة مطيرة. وقد نقل الشيخ محمد بن إبراهيم عن أئمة الدعوة أنه لا يجمع بين الظهرين حيث إن المشقة في النهار أخف بكثير من المشقة في الليل، وقوَّى الشيخ هذا الرأي.", "القول الثاني: جواز الجمع بين الظهرين بعذر المطر كجوازه بين العشاءين، وهذا قول الشافعية، ورواية عند الحنابلة، اختارها شيخ الإسلام ابن تيمية، واستدلوا بحديث الباب، فإنه نص فيه على الظهر والعصر، وإذا كان الجمع لأجل ألا يحرج أمته، فإنه يدخل في ذلك الجمع بين الظهرين إذا وجد هذا العذر. وهذا هو الأظهر؛ لقوة مأخذه. قال ابن رجب: (والعجب من مالك كيف حمل حديث ابن عباس على الجمع للمطر، ولم يقل به في الظهر والعصر، والحديث صريح في جمع الظهر والعصر والمغرب والعشاء!!.", "أما ما استدل به الأولون من حديث ابن عمر في جمعه مع الأمراء والمغرب والعشاء، فليس فيه ما يمنع من الجمع بين الظهرين، بل دلالتها على الجواز أقرب، للجامع بينهما وهو المشقة، وإن كانت المشقة في الظهرين أخف، فإنه لا يشترط تساوي الأصل والفرع في العلة، فقد تكون في الأصل أقوى. وأما حديث ابن عمر في أن النبي ﷺ جمع بين العشاءين في ليلة مطيرة، فهذا حديث ضعيف جداً، بل هو إلى الوضع أقرب، كما تقدم.", "د- استدل الفقهاء، ومنهم: عطاء، والنخعي، والليث، وأحمد، وإسحاق بهذا الحديث على أنه يجوز للمريض الذي يلحقه مشقة في أداء كل صلاة في وقتها أن يجمع بين الظهرين والعشاءين، ومثل ذلك العاجز عن الطهارة لكل صلاة، ويفعل الأرفق به من جمع التقديم أو جمع التأخير، فإن أمكن أن يجمع بين الظهرين جمع تأخير ويتوضأ لهما، ويجمع بين العشاءين جمع تقديم؛ ليكون متطهرًا بطهارة واحدة لجميع الصلوات، ويبقى عليه طهارة واحدة للفجر، فهذا أولى.", "وأما الإمام مالك فيرى أن المريض يجمع جمع تقديم إذا خاف حصول دَوخَة تمنع من أداء الصلاة على وجهها، أو إغماء يمنعه من الصلاة عند دخول وقت الثانية. وكذا المريض الذي يشق عليه تجديد الوضوء، والتحرك للصلاة.", "وأما الشافعي وأصحاب الرأي فإنهم لا يجيزون الجمع للمريض، لأنه لم ينقل، وأخبار المواقيت ثابتة، فلا تترك إلا بنص صريح. والله تعالى أعلم."], "t": ["الفرق بين رواية حبيب بن أبي ثابت، ورواية أبي الزبير -وكلاهما عند مسلم- أنه في الأولى (في غير خوف ولا مطر) وفي الثانية (في غير خوف ولا سفر) وكأن الأولى أرجح؛ لأن قوله: (بالمدينة) يدل على أنه لم يكن في سفر، فذكر لفظة (ولا سفر) مرة أخرى لا فائدة منه، بل هو تحصيل حاصل، بخلاف لفظة (ولا مطر). ثم إن حبيب بن أبي ثابت أحق بالتقديم من أبي الزبير، فإن حبيباً من رجال «الصحيحين»، وأبو الزبير من أفراد مسلم، ويؤيد ذلك رواية قتادة -عند أحمد- قال: سمعت جابر بن زيد، عن ابن عباس قال: جمع رسول الله ﷺ بين الظهر والعصر، والمغرب والعشاء بالمدينة من غير خوف ولا مطر. .. الحديث. وقول المصنف: (وقد تكلم ابن سريج في قوله: ولا مطر).", "ابن سريج هذا هو أبو العباس أحمد بن عمر بن سريج البغدادي القاضي الشافعي، صاحب المصنفات، مات سنة (٣0٣)، وقوله هذا لم أقف عليه. وقد يكون مراد ابن سريج ما ذكره البزار من أن لفظة (ولا مطر) تفرد بها حبيب، وغيره لا يذكرها، وكذلك تكلم فيها ابن عبد البر."]}, "150": {"m": "وَعَنْ مُعَاذٍ رضي الله عنه: «أَنّ النّبِيّ صلى الله عليه وسلم كَانَ فِي غَزْوَةِ تَبُوكَ إِذَا ارْتَحَلَ قَبْلَ زَيْغِ الشّمْسِ؛ أَخّرَ الظُّهْرَ حَتّى يَجْمَعَهَا إِلَى العَصْرَِ، فَيُصَلِيَهُمَا جَمِيعا. وَإِذَا ارْتَحَلَ بَعْدَ زَيْغِ الشّمْسِ صَلّى الظُّهْرَ وَالعَصْرَ جَمِيعا، ثُمّ سَارَ. وَكَانَ إِذَا ارْتَحََلَ قَبْلَ المََغْرِبِ أخّرَ المَغْرِبَ حَتّى يُصَلِيَهَا مَعَ العِشَاءِ. وَإِذَا ارْتَحَلَ بَعَْدَ المَغْرِبِ عَجّلَ العِشَاءَ فَصَلاّهَا مَعَ المَغْرِبِ» رَوَاهُ أحْمَدُ، وَ أبُودَاوُدَ، وَالتِرْمِذِيُّ - وَقَالَ: «حَدِيثٌ حَسَنٌ غَرِيبٌ» -. وَقَالَ أبُودَاوُدَ، وَالتِرْمِذِيُّ، وَالطّبَرَ انِيُّ، وَ ابْنُ يُونُسَ، وَالسُّلَيْمَانِيُّ، وَالبَيْهَقِيُّ، وَالخَْطِيبُ، وَغَيْرُهُمْ: «تَفَرّدَ بِهِ قُتَيْبَةُ». قَالَ الخَطِيبُ: «وَهُوَ مُنْكَرٌ جِدا»، وَقَالََ الحَاكِمُ: «هُوَ حَدِيثٌ مَوْضُوعٌ، وَقُتَيْبَةُ ثِقَةٌ مَأمُونٌ». وَقَدْ تَقَدّمَ جَمْعُ المُسْتَحَاضَةِ بَيْنَ الصّلاتَيْنِ فِي بَابِ الحَيْضِ، وَاللَّهُ أعْلَمُ.", "s": ["أ- يستدل الفقهاء بهذا الحديث على جواز الجمع بين الصلاتين جمع تقديم، لقوله: (إذا ارتحل بعد زيغ الشمس صلى الظهر والعصر جميعاً ثم سار) والذي يجيز جمع التقديم يجيز جمع التأخير من باب أولى، وهذا قول جماعة من الصحابة، منهم ابن عباس وابن عمر ومعاذ وبه قال طاوس ومجاهد، وهو قول الشافعي، وأحمد في المشهور، ومالك في رواية عنه. قالوا: ومما يؤيد حديث الباب في جواز جمع التقديم جواز الجمع في عرفة بين الظهر والعصر في وقت الظهر، وهو جمع متفق عليه بين أهل العلم، كما يؤيد ذلك حديث ابن عباس أن رسول الله ﷺ جمع بين الصلاتين في سفرة سافرها في غزوة تبوك، جمع بين الظهر والعصر وبين المغرب والعشاء، فهذا يدل بعمومه على جمع التقديم وجمع التأخير. والقول الثاني: أنه لا يجوز جمع التقديم، وهذا رواية عن أحمد، وهو قول ابن حزم الظاهري، لحديث أنس كان رسول الله ﷺ إذا ارتحل قبل أن تزيغ الشمس أخَّر الظهر إلى وقت العصر، ثم نزل فجمع بينهما، فإن زاغت الشمس قبل أن يرتحل، صلى الظهر ثم ركب. فقوله: (صلى الظهر ثم ركب) يدل على أنه ﷺ لم يكن يجمع بين الصلاتين في وقت الأولى جمع تقديم. وأجابوا عن حديث معاذ بأنه حديث ضعيف كما تقدم، فلا تقوم به حجة. قال ابن حزم عنه: (إنه أردى حديث في هذا الباب لوجوه...) ثم ذكرها. والقول الأول أظهر - إن شاء الله - فإن الأدلة الواردة في جمع التقديم إذا اجتمعت قويت، ويؤيدها أن الجمع إنما شرع للمسافر لقصد راحته والتيسير عليه، فأي فرق بين جمع التأخير وجمع التقديم؟!", "يقول شيخ الإسلام ابن تيمية: (المقصود أن الله لم يبح لأحد أن يؤخر الصلاة عن وقتها بحال، كما لم يبح له أن يفعلها قبل وقتها بحال، فليس جمع التأخير بأولى من جمع التقديم، بل ذاك بحسب الحاجة والمصلحة، فقد يكون هذا أفضل، وقد يكون هذا أفضل، وهذا مذهب جمهور العلماء، وهو ظاهر مذهب أحمد المنصوص عنه وغيره، ومن أطلق من أصحابه القول بتفضيل أحدهما مطلقاً، فقد أخطأ على مذهبه). وقد روى مالك عن ابن شهاب أنه قال: سألت سالم بن عبد الله: هل يُجمع بين الظهر والعصر في السفر؟ فقال: نعم. لا بأس بذلك، ألم تر إلى صلاة الناس بعرفة؟. قال شيخ الإسلام ابن تيمية: (فهذا استدلال من السلف بجمع عرفة على نظيره، وأن الحكم ليس مختصاً، وهو جمع تقديم للحاجة في السفر)، والله تعالى أعلم.", "* * *", "والمراد بصلاة الخوف هنا كيفية أداء الصلاة حال الخوف من العدو، لا أنها صلاة جديدة تشرع بسبب الخوف.", "ومشروعية صلاة الخوف تخفيف من الله تعالى على عباده ورحمة بهم وتحصيل لمصلحتي الصلاة في وقتها وأخذ الحذر من العدو، وهذا يدل على عظم أمر الصلاة وشدة الاهتمام بها والحرص على أدائها في وقتها مع جماعة المسلمين، فإنه إذا لم يعذر المسلم في أدائها جماعة في حال الخوف والكر والفر، فكيف يتخلف عنها من هو آمن في سربه معافى في بدنه! والله المستعان.", "وصلاة الخوف ثابتة بالكتاب والسنة والإجماع، أما الكتاب فقوله تعالى: {وإذا كنت فيهم فأقمت لهم الصلاة فلتقم طائفة منهم معك وليأخذوا أسلحتهم فإذا سجدوا فليكونوا من ورائكم ولتأت طائفة أخرى لم يصلوا فليصلوا معك وليأخذوا حذرهم وأسلحتهم ود الذين كفروا لو تغفلون عن أسلحتكم وأمتعتكم فيميلون عليكم ميلة واحدة ولا جناح عليكم إن كان بكم أذى من مطر أو كنتم مرضى أن تضعوا أسلحتكم وخذوا حذركم إن الله أعد للكافرين عذابا مهينا} [النساء: ١0٢].", "وأما السنة فقد ثبتت الأحاديث الصحيحة أن النبي صلى الله عليه وسلم صلاها بأصحابه مرات متعددة على صفات متنوعة، كما سيأتي.", "وقد أجمع الصحابة رضي الله عنهم على فعلها، وصلوها بعد نبيهم صلى الله عليه وسلم، قال الإمام أحمد: (كل حديث يروى في أبواب صلاة الخوف فالعمل به جائز).", "وقال: (ستة أوجه أو سبعة يروى فيها)."], "t": ["هذا الحديث أخرجه من ذكرهم المصنف من طريق قتيبة بن سعيد، حدثنا ليث، عن يزيد بن أبي حبيب، عن أبي الطفيل عامر بن واثلة، عن معاذ بن جبل... وذكر الحديث. وهذا الحديث ظاهرإسناده الصحة، ومع هذا فقد اختلفت كلمة أهل العلم فيه، فمنهم من أعله، ومنهم من صححه وضعَّف إعلاله، والذين أعلوه هم كبار الأئمة من المتقدمين، وذلك لأن قتيبة بن سعيد تفرد به عن ليث، عن يزيد. وقتيبة بن سعيد ثقة ثبت، وشيخه الليث بن سعد ثقة ثبت فقيه إمام مشهور، وقد رواه عن قتيبة كبار الأئمة: أحمد، وأبو داود، والترمذي، وغيرهم، قال الحاكم: (أئمة الحديث إنما سمعوه من قتيبة تعجباً من إسناده ومتنه). وقد تفرد قتيبة بن سعيد عن الليث بهذا الأصل - وهو جمع التقديم - الذي تمس الحاجة إلى العلم به من وجه صحيح، ليُستغنى به عن الأحاديث الضعيفة في هذا الباب، ولو كان هذا الحديث عند الليث بن سعد لاشتهر وعُرف ونُقل، لمكانة الليث، وللحاجة إلى هذا الحديث. وقد تتابع كبار الأئمة على إعلاله وردِّه، والخلاصة أن حديث معاذ هذا حديث ضعيف، تفرد به قتيبة بن سعيد عن الليث، وأحاديث الليث معروفة قد كتبت وعرفت وتناقلتها الرواة، وليس منها هذا، ويزيد بن أبي حبيب لا تعرف له رواية عن أبي الطفيل إلا من هذا الطريق. ثم هو مخالف لحديث معاذ الذي جاء من طريق أبي الزبير، عن أبي الطفيل عنه أن النبي ﷺ جمع في غزوة تبوك بين الظهر والعصر وبين المغرب والعشاء. وأما من صحح الحديث وضعف إعلاله، فمنهم ابن القيم، فقد دافع عن هذا الحديث، وقال: (إسناده صحيح، وعلته واهية) وذكر أن لقتيبة بن سعيد متابعاً، وكذا صححه أحمد شاكر، والألباني، ومقبل الوادعي، وغيرهم.", "لكن حكم الأئمة الكبار مقدم على كلام من جاء بعدهم؛ لأنهم أهل الرواية، ولهم المعرفة التامة بعلل الأحاديث ورجاله، وليس الاعتماد على هذا الحديث في جمع التقديم."]}};

/* ---------- ХРАНИЛИЩЕ ---------- */
const KEY='muharrar-quiz-v1';            // прежние данные без имени
const PKEY='muharrar-profiles-v1';       // список профилей на этом устройстве
const LKEY='muharrar-lang-v1';
const dkey=k=>KEY+':'+k;
const blank=lang=>({learned:{},prog:{},streak:0,last:null,reviews:0,lang});
let L='ru'; try{const l=localStorage.getItem(LKEY); if(l&&I.title[l]) L=l;}catch(e){}
try{const langElInit=document.getElementById('lang'); if(langElInit) langElInit.value=L;}catch(e){}
let PR={list:[],last:null};
try{const v=localStorage.getItem(PKEY); if(v) PR=Object.assign(PR,JSON.parse(v));}catch(e){}
if(!Array.isArray(PR.list)) PR.list=[];
let cur=null, S=blank(L);
function savePR(){try{localStorage.setItem(PKEY,JSON.stringify(PR));}catch(e){}}
function loadProfile(p){
  cur=p; let o=null;
  try{const v=localStorage.getItem(dkey(p.key)); if(v) o=JSON.parse(v);}catch(e){}
  S=Object.assign(blank(L),o||{});
  if(!I.title[S.lang]) S.lang=L;
  if(S.plan&&S.plan.v!==2) delete S.plan;
  PR.last=p.key; savePR();
}
const normKey=n=>n.trim().toLowerCase().replace(/\s+/g,' ');
function enterProfile(rawName,data){
  const name=String(rawName||'').trim().replace(/\s+/g,' ').slice(0,40);
  if(!name) return false;
  const key=normKey(name);
  let p=PR.list.find(x=>x.key===key);
  try{
    if(!p){
      p={name,key}; PR.list.push(p);
      if(!data && PR.list.length===1){const old=localStorage.getItem(KEY); if(old){localStorage.setItem(dkey(key),old);localStorage.removeItem(KEY);}}
    }
    if(data) localStorage.setItem(dkey(key),JSON.stringify(data));
  }catch(e){}
  savePR(); loadProfile(p); tab='quiz'; Q=null; render(); return true;
}
const t=(k,...a)=>{const v=I[k][L];return typeof v==='function'?v(...a):v};
function save(){ if(!cur) return; S.ts=Date.now(); try{localStorage.setItem(dkey(cur.key),JSON.stringify(S));}catch(e){} }
const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const learnedItems=()=>DATA.filter(d=>S.learned[d.n]);

const ruPl=(n,f)=>{const m=n%10,h=n%100;return (m===1&&h!==11)?f[0]:(m>=2&&m<=4&&(h<10||h>=20))?f[1]:f[2]};
const PLAN_DEF={per:11,anchor:Math.floor(Date.UTC(2026,8,23)/864e5),target:44};
const plan=()=>Object.assign({},PLAN_DEF,S.plan||{});
const ksaNow=()=>Date.now()+3*36e5; // Саудовская Аравия, UTC+3
function cycleInfo(){
  const t0=ksaNow(), n=Math.floor(t0/864e5), h=Math.floor((t0%864e5)/36e5), dow=(n+4)%7;
  const cyc=(dow===3&&h>=13)?n+1:n, cd=(cyc+4)%7;   // после среды 13:00 начинается новый цикл
  return {n,dow,wed:cyc+(3-cd+7)%7};
}
const nextWed=()=>cycleInfo().wed;
function planInfo(){
  const p=plan(), N=DATA.length, {n,dow,wed}=cycleInfo(), days=wed-n;
  const endRaw=w=>p.target+p.per*Math.round((w-p.anchor)/7);
  const rng=e=>({a:Math.max(1,Math.min(N,e-p.per+1)),b:Math.max(0,Math.min(N,e))});
  const ex=rng(endRaw(wed)), blk=rng(endRaw(n-dow+10));
  let task={kind:'none'};
  if(blk.b>=blk.a){
    let rem=p.per; const counts=[];
    for(let d=0;d<5;d++){const c=Math.min(2,rem);counts.push(c);rem-=c;}
    if(dow<=4){
      const a=blk.a+counts.slice(0,dow).reduce((x,y)=>x+y,0), c=counts[dow];
      if(c>0&&a<=blk.b) task={kind:'learn',a,b:Math.min(blk.b,a+c-1)};
    }else if(dow===5){
      const a=blk.a+p.per-rem;
      task=(rem>0&&a<=blk.b)?{kind:'fri',a,b:Math.min(blk.b,a+rem-1)}:{kind:'rev'};
    }else task={kind:'rev'};
  }
  return {days,wed,exam:ex,blk,task,dow};
}

}

/* --- Запуск --- */
function startWith(pool,mode,exam,full){
  Q={active:true,done:false,mode,full:!!full,exam:!!exam,queue:pool.map(item=>({item,retry:false})),idx:0,total:pool.length,correct:0,wrong:[],answered:false};
  render();
}
function startQuiz(){
  let pool=cfg.practice?shuffle(learnedItems()):dueItems().sort((a,b)=>((S.prog[a.n]||{due:0}).due)-((S.prog[b.n]||{due:0}).due)||Math.random()-.5);
  if(cfg.count!=='all') pool=pool.slice(0,+cfg.count);
  startWith(pool,cfg.mode,false,cfg.full);
}

/* --- Генерация вопроса --- */
function options(item,key,near){
  const out=[item[key]],seen=new Set([String(item[key])]);
  let cand=shuffle(DATA);
  if(near) cand=shuffle(DATA.filter(d=>Math.abs(d.h-item.h)<=40)).concat(cand);
  for(const d of cand){ if(out.length>=4)break; const v=String(d[key]); if(!seen.has(v)){seen.add(v);out.push(d[key]);} }
  return shuffle(out);
}
const WMIN=5;                      // минимум слов, чтобы просить написать продолжение
/* Текст матна для викторины: полный из книги (MEM) либо сокращённый из таблицы.
   Из полного текста отсекается хвост такриджа («رواه…», «متفق عليه…») — он разбирается
   отдельно и в вопросе «откуда хадис» выдавал бы ответ. Отсекаем только если маркер
   стоит во второй половине текста; иначе берём текст целиком. */
const TMARK=new Set(['رواه','متفق','اخرجه','ذكره','رواهما','اخرجاه']);
const BODY={};
function bookBody(n){
  if(BODY[n]!==undefined) return BODY[n];
  const g=MEM[n]; let out='';
  if(g&&g.m){
    const raw=g.m.split(/\s+/).filter(Boolean);
    let q=-1;                                   // закрывающая кавычка тела хадиса
    for(let i=0;i<raw.length;i++) if(raw[i].indexOf('»')>=0){ q=i; break; }
    out=raw.join(' ');
    if(q>=0) for(let i=q+1;i<raw.length;i++)
      if(TMARK.has(normAr(raw[i]))){ out=raw.slice(0,i).join(' '); break; }
  }
  return BODY[n]=out;
}
function mtn(item){
  if(Q&&Q.full){ const b=bookBody(item.n); if(b) return b; }
  return item.m;
}
const canWrite=item=>mtn(item).split(/\s+/).filter(Boolean).length>=WMIN;
/* Точка обрыва вопроса по полному матну: ближе к телу хадиса и не внутри формул «صلى الله عليه وسلم» / «رضي الله عنه» */
const MIDW=new Set(['عليه','وسلم','الله','عنه','عنهما','عنها','تعالي','صلي','رضي']);
function cutPoint(w,CH){
  const hi=w.length-CH-1, lo=Math.min(Math.max(3,Math.floor(w.length*0.25)),hi);
  let k=lo+Math.floor(Math.random()*Math.max(1,hi-lo+1));
  for(let i=0;i<6&&k<hi&&MIDW.has(normAr(w[k]));i++) k++;
  return Math.max(1,Math.min(k,hi));
}
function buildQ(item){
  let ty=Q.mode||cfg.mode;
  if(ty==='mix'){
    const pool=['flash','narr','takh','matn'];
    if(canWrite(item)) pool.push('write');
    ty=pool[Math.floor(Math.random()*pool.length)];
  }
  if(ty==='write'&&!canWrite(item)) ty='matn';   // слишком короткий — спросим выбором
  const q={item,type:ty};
  if(ty==='narr'){q.askKey='askNarr';q.key='a';q.opts=options(item,'a');}
  if(ty==='takh'){q.askKey='askTakh';q.key='t';q.opts=options(item,'t');}
  if(ty==='matn'){
    const w=mtn(item).split(' ').filter(Boolean), CH=8;
    const rnd=(a,b)=>a+Math.floor(Math.random()*Math.max(1,b-a+1));
    let k,cut;
    if(Q.full&&w.length>CH+4){ k=cutPoint(w,CH); cut=k+CH; }   // полный матн: обрыв в осмысленном месте
    else { k=Math.max(1,Math.min(4,w.length-1)); cut=w.length; }
    q.start=w.slice(0,k).join(' '); q.askKey='askCont'; q.correct=w.slice(k,cut).join(' ');
    const seen=new Set([q.correct]), out=[q.correct];
    for(const d of shuffle(DATA)){
      if(out.length>=4)break;
      const dw=mtn(d).split(' ').filter(Boolean);
      let r;
      if(Q.full&&dw.length>CH+4){ const dk=cutPoint(dw,CH); r=dw.slice(dk,dk+CH).join(' '); }
      else r=dw.slice(Math.min(k,Math.max(1,dw.length-1))).join(' ');
      if(r&&!seen.has(r)){seen.add(r);out.push(r);}
    }
    q.opts=shuffle(out);
  }
  if(ty==='write'){
    const w=mtn(item).split(' '), k=Math.max(1,Math.min(3,w.length-1));
    q.start=w.slice(0,k).join(' '); q.correct=w.slice(k).join(' ');
  }
  if(ty==='full'){
    const w=mtn(item).split(' '), k=Math.max(1,Math.min(3,w.length));
    q.hint=w.slice(0,k).join(' '); q.correct=mtn(item);
  }
  if(q.correct===undefined) q.correct=item[q.key];
  return q;
}
function full(item){

  <div class="ar sm" style="color:var(--muted)">${esc(item.t)}</div>

}

function answer(ok,noAdvance){
  if(Q.answered)return; Q.answered=true;
  const cur=Q.queue[Q.idx], item=cur.item;
  if(!cur.retry){
    const p=S.prog[item.n]||{box:0,due:0,ok:0,bad:0};
    p.box=ok?Math.min(6,p.box+1):0;
    p.due=dayNum()+INT[p.box];
    ok?p.ok++:p.bad++;
    S.prog[item.n]=p; S.reviews=(S.reviews||0)+1; save();
    if(ok)Q.correct++;
  }
  if(!ok){
    if(!cur.retry){Q.wrong.push(item); Q.queue.push({item,retry:true});}
  }
  if(!noAdvance) next();
}
function next(){
  Q.idx++;
  if(Q.idx>=Q.queue.length) finish(); else renderQuestion();
}
function finish(){
  if(Q.queue.length && Q.idx>0){
    const d=dayNum();
    if(S.last!==d){S.streak=(S.last===d-1)?(S.streak||0)+1:1;S.last=d;save();}
  }
  Q.active=false;Q.done=true;render();
}
function renderDone(){
  const first=Q.queue.filter(x=>!x.retry).length;
  app.innerHTML=`<div class="card empty">
    <div class="big">${Q.correct}<span style="font-size:1.2rem;color:var(--muted)"> / ${Math.min(first,Q.total)}</span></div>

    <p>${Q.wrong.length?t('attention'):t('noMist')}</p></div>

    <button class="btn" id="again" style="width:100%">${t('back')}</button>`;
  document.getElementById('again').onclick=()=>{Q=null;if(learnReturn){learnReturn=false;tab='learn';}render()};
}



/* ---------- СТЕПЕНЬ ДОСТОВЕРНОСТИ ---------- */
function gradeOf(n){ return GRD[n]||GRD[String(n)]||null; }
function gradeClass(v){
  if(!v) return 'g-x';
  if(v.indexOf('ضعيف')>=0) return 'g-d';
  if(v.indexOf('مختلف')>=0||v.indexOf('موقوف')>=0) return 'g-x';
  if(v.indexOf('حسن')>=0) return 'g-h';
  if(v.indexOf('صحيح')>=0) return 'g-s';
  return 'g-x';
}
function gradeBox(n,small){
  const g=gradeOf(n); if(!g) return '';
  const v=g.v||'';
  return `<div class="grade ${gradeClass(v)}${small?' gsm':''}">
    <span class="gv">${esc(v||t('gNone'))}</span>
    ${g.b?`<span class="gb">${esc(g.b)}</span>`:''}</div>`;
}

/* ---------- СВЕРКА НАБРАННОГО ТЕКСТА ---------- */
function normAr(s){
  return String(s)
    .replace(/[ً-ْٰـۖ-ۭ]/g,'')
    .replace(/[آأإٱ]/g,'ا')
    .replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^ء-ي\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}
const arWords=s=>normAr(s).split(' ').filter(Boolean);
/* пары [как написано, для сравнения] — показываем оригинал, сравниваем очищенное */
function arPairs(s){
  const raw=String(s).split(/\s+/).filter(Boolean), out=[];
  for(const r of raw){ const n=normAr(r); if(n) out.push([r,n]); }
  return out;
}
function alignWords(exp,got){
  const n=exp.length,m=got.length,D=[];
  for(let i=0;i<=n;i++){D.push(new Array(m+1).fill(0));}
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)
    D[i][j]=exp[i-1]===got[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);
  const out=[];let i=n,j=m;
  while(i>0&&j>0){
    if(exp[i-1]===got[j-1]){out.push({t:'k',w:exp[i-1]});i--;j--;}
    else if(D[i-1][j]>=D[i][j-1]){out.push({t:'mi',w:exp[i-1]});i--;}
    else {out.push({t:'x',w:got[j-1]});j--;}
  }
  while(i>0){out.push({t:'mi',w:exp[i-1]});i--;}
  while(j>0){out.push({t:'x',w:got[j-1]});j--;}
  return out.reverse();
}
function checkWritten(expected,typed,prompt){
  const E=arPairs(expected); let Gt=arPairs(typed);
  /* если ученик переписал и начало, которое было на экране — отбрасываем его */
  if(prompt){
    const P=arPairs(prompt);
    if(P.length&&Gt.length>=P.length&&P.every((p,k)=>p[1]===Gt[k][1])) Gt=Gt.slice(P.length);
  }
  const e=E.map(x=>x[1]), g=Gt.map(x=>x[1]);
  const al=alignWords(e,g);
  let ei=0,gi=0; const out=[];
  for(const step of al){
    if(step.t==='k'){ out.push({t:'k',w:E[ei][0]}); ei++; gi++; }
    else if(step.t==='mi'){ out.push({t:'mi',w:E[ei][0]}); ei++; }
    else { out.push({t:'x',w:Gt[gi]?Gt[gi][0]:step.w}); gi++; }
  }
  const ok=out.filter(x=>x.t==='k').length;
  /* делим на большее из двух — лишние слова тоже снижают результат */
  const den=Math.max(e.length,g.length)||1;
  return {al:out, ok, total:e.length, pct: Math.round(ok/den*100)};
}

/* ---------- ЗАУЧИВАНИЕ НОВЫХ ХАДИСОВ ---------- */
let learnIdx=null, learnSec=null, learnCut=null, learnBare=false, learnReturn=false;
function planStart(){
  const P=planInfo();
  if(P.task.kind==='learn'||P.task.kind==='fri') return P.task.a;
  if(P.blk.b>=P.blk.a) return P.blk.a;
  for(let i=1;i<=DATA.length;i++) if(!S.learned[i]) return i;
  return 1;
}
function memEntry(i){
  const e=MEM[i]||MEM[String(i)];
  if(!e) return null;
  if(e.r){ const src=MEM[e.r]||MEM[String(e.r)]; if(src) return {m:e.m,w:src.w,s:src.s,t:src.t,ref:e.r}; }
  return e;
}
const bare=s=>String(s).replace(/[\u064B-\u0652\u0670\u0640]/g,'');
function renderLearn(){
  if(learnIdx===null) learnIdx=Math.min(DATA.length,Math.max(1,S.learnIdx||planStart()));
  const i=learnIdx, item=DATA[i-1], e=memEntry(i)||{m:item.m};
  const txt=learnBare?bare(e.m):e.m;
  const words=txt.split(/\s+/);
  const shown=(learnCut===null)?txt:(words.slice(0,learnCut).join(' ')+' …');
  const has={w:(e.w&&e.w.length),s:(e.s&&e.s.length),t:(e.t&&e.t.length)};

/* --- Прогресс --- */
let resetArmed=false;
/* ---------- аналитика ---------- */
function accuracy(){
  let ok=0,bad=0;
  Object.keys(S.prog||{}).forEach(k=>{ok+=S.prog[k].ok||0;bad+=S.prog[k].bad||0;});
  return {ok,bad,total:ok+bad,pct:(ok+bad)?Math.round(ok/(ok+bad)*100):null};
}
function weakItems(){
  return learnedItems().map(d=>{
    const p=S.prog[d.n]||{ok:0,bad:0,box:0}, tot=(p.ok||0)+(p.bad||0);
    return {d,p,tot,rate:tot?(p.bad||0)/tot:0};
  }).filter(x=>(x.p.bad||0)>0)
    .sort((a,b)=>b.rate-a.rate||(b.p.bad||0)-(a.p.bad||0)||a.d.n-b.d.n);
}
function dueForecast(days){
  const n=dayNum(), L=learnedItems(), out=[];
  for(let i=0;i<days;i++){
    const d=n+i; let c=0;
    L.forEach(x=>{const due=(S.prog[x.n]||{due:n}).due; if(i===0?due<=d:due===d) c++;});
    out.push(c);
  }
  return out;
}
function blockRows(size){
  const rows=[];
  for(let a=1;a<=DATA.length;a+=size){
    const b=Math.min(DATA.length,a+size-1);
    rows.push({label:t('numSign')+' '+DATA[a-1].h+'–'+DATA[b-1].h,
      done:DATA.filter(d=>d.n>=a&&d.n<=b&&S.learned[d.n]).length,total:b-a+1});
  }
  return rows;
}

function renderStats(){
  const MC=window.MuharrarCharts;

  Li.forEach(d=>cnts[(S.prog[d.n]||{box:0}).box]++);
  const acc=accuracy(), weak=weakItems().slice(0,8), n0=dayNum();
  const loc=L==='ru'?'ru-RU':L==='ar'?'ar-u-nu-latn':'en-GB';

  const fc=dueForecast(14).map((v,i)=>({
    value:v, hl:i===0, label:dname(n0+i),
    tip:(i===0?t('todayS'):t('inDays',i)+' · '+dname(n0+i))+'\n'+v
  }));
  const carpet=MC.carpet({
    items:DATA, dense:true,
    level:d=>S.learned[d.n]?((S.prog[d.n]||{box:0}).box||0):null,
    tip:d=>{
      const p=S.prog[d.n], tot=p?(p.ok||0)+(p.bad||0):0;
      return t('numSign')+' '+d.h+'\n'+(S.learned[d.n]?lv[(p||{box:0}).box||0]:t('notLearned'))
        +(tot?'\n'+t('corrOf',p.ok||0,tot):'');
    }
  });
  app.innerHTML=`
  <div class="card">
    <p class="eyebrow">${t('sumTitle')}</p>
    ${MC.statRow([
      {value:Li.length,unit:'/'+DATA.length,label:t('kLearned')},
      {value:dueItems().length,label:t('kDue')},
      {value:acc.pct==null?'—':acc.pct,unit:acc.pct==null?'':'%',label:t('kAcc'),sub:acc.total?t('corrOf',acc.ok,acc.total):''},
      {value:curStreak(),label:t('kStreak')}
    ])}
  </div>

  <div class="card">
    <p class="eyebrow">${t('mapTitle')}</p>
    ${Li.length?`${carpet}
    <p class="mc-note">${t('mapNote')}</p>
    ${MC.levelStrip(cnts,lv,{})}

  </div>

  ${Li.length?`<div class="card">
    <p class="eyebrow">${t('loadTitle')}</p>
    ${MC.columns({rows:fc,note:t('loadNote')})}
  </div>`:''}

  <div class="card">
    <p class="eyebrow">${t('blocksTitle')}</p>
    ${MC.sections({rows:blockRows(25)})}
  </div>

  ${weak.length?`<div class="card">
    <p class="eyebrow">${t('weakTitle')}</p>
    <p class="muted" style="margin:0 0 11px">${t('weakNote')}</p>
    <div class="weak">${weak.map(w=>`<div class="weak-i">

      <span class="weak-p" data-tip="${esc(t('corrOf',w.p.ok||0,w.tot))}" tabindex="0">${Math.round(w.rate*100)}%</span>
    </div>`).join('')}</div>
    <button class="btn" id="drill" style="width:100%;margin-top:12px">${t('drillBtn',Math.min(weak.length,20))}</button>
  </div>`:''}

  <div class="card"><p class="eyebrow">${t('planTitle')}</p>
    <div class="row" style="margin-bottom:8px">
      <label class="f">${t('perWeek')}<input type="number" id="pl1" min="1" max="30" value="${plan().per}" inputmode="numeric"></label>
      <label class="f">${t('nextTarget')}<input type="number" id="pl2" min="1" max="${DATA.length}" value="${planInfo().exam.b}" inputmode="numeric"></label>
    </div>
    <p class="muted" style="margin-top:0">${t('planNote')}</p>
    <button class="btn sec" id="plSave">${t('save')}</button></div>
  <div class="card"><p class="eyebrow">${t('backup')}</p>
    <p class="muted" style="margin-top:0">${t('bkLocal')}</p>
    <textarea id="bk">${esc(JSON.stringify(Object.assign({name:cur.name},S)))}</textarea>
    <div class="actions"><button class="btn sec" id="imp">${t('loadBtn')}</button><button class="btn danger" id="rst">${t('resetAll')}</button></div>
    <p class="muted" id="msg" style="margin:8px 0 0"></p></div>`;
  const $=id=>document.getElementById(id);
  if($('drill')) $('drill').onclick=()=>{ tab='quiz'; startWith(shuffle(weak.slice(0,20).map(w=>w.d)),'mix',false); };
  $('plSave').onclick=()=>{
    const per=Math.max(1,Math.min(30,+$('pl1').value||11)), target=Math.max(1,Math.min(DATA.length,+$('pl2').value||33));
    S.plan={v:2,per,anchor:nextWed(),target}; save(); render();
  };
  $('imp').onclick=()=>{
    try{const o=JSON.parse($('bk').value); if(!o||typeof o!=='object'||!o.learned) throw 0;
      delete o.name; S=Object.assign(fresh(),o); S.lang=L; save(); render();
    }catch(e){$('msg').textContent=t('importErr');}
  };
  $('rst').onclick=()=>{
    if(!resetArmed){resetArmed=true;$('rst').textContent=t('sure');setTimeout(()=>{resetArmed=false;if($('rst'))$('rst').textContent=t('resetAll')},4000);return;}
    S=fresh();save();resetArmed=false;render();
  };
}
window.MuharrarModules = window.MuharrarModules || {};
window.MuharrarModules.hadith = {
  key: 'hadith',
  title: 'Хадис тахлили',
  setProfile(p){ loadProfile(p); },
  render(){ render(); },
  setTab(tt){ tab=tt; Q=null; render(); },
  getTab(){ return tab; },
  dailyHtml(){ return dailyCard(); },
  summary(){
    const P=planInfo(), ex=P.exam, has=ex.b>=ex.a;
    return {
      learned:learnedItems().length, total:DATA.length,
      due:dueItems().length,
      examDays:P.days, examDow:3,
      streak:curStreak(),
      unit:'хадисов',
      week:has?{a:DATA[ex.a-1].h,b:DATA[ex.b-1].h,
                done:DATA.filter(d=>d.n<=ex.b&&S.learned[d.n]).length,total:ex.b}:null
    };
  },
  exportState(){ return S; },
  importState(o){ if(!o||typeof o!=='object'||!o.learned) return false; delete o.name; S=Object.assign(fresh(),o); S.lang=L; save(); return true; }
};

})();
