function renderLearn(){
  const refs=allRefs();
  if(!refs.length){ app.innerHTML=planCard(); wirePlan(); return; }
  if(learnIdx>=refs.length) learnIdx=0;
  if(learnIdx<0) learnIdx=refs.length-1;
  const ref=refs[learnIdx], info=refInfo(ref), i=learnIdx+1;
  const isHifz=hifzRefs().indexOf(ref)>=0;
  const label=isHifz?t('learnedS'):t('readS');
  const pct=Math.round(i/refs.length*100);
  app.innerHTML=`
  <div class="qhead"><span class="muted">${esc(t('iOfNs',i,refs.length,surahName(info.surah)))}</span>
    <span class="nvb"><button id="pv">‹</button><button id="nx">›</button></span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card">
    <div class="meta"><span class="chip">${esc(t('ayahNo',info.ayah))}</span>${S.done[ref]?`<span class="chip ok">✓ ${esc(label)}</span>`:''}</div>
    ${info.text?(()=>{
      const src=learnBare?bare(info.text):info.text, words=src.split(/\s+/);
      const shown=learnCut===null?src:words.slice(0,learnCut).join(' ')+(learnCut<words.length?' …':'');
      return `<div class="ar matn ${learnCut===null?'':'hid'}" style="margin-top:10px">${esc(shown)}</div>
      <div class="lrow">
        ${learnCut===null?`<button class="btn sec" id="hide">${esc(t('hideCheck'))}</button>`
          :`<button class="btn sec" id="more" ${learnCut>=words.length?'disabled':''}>${esc(t('moreWord'))}</button><button class="btn sec" id="full">${esc(t('showAll'))}</button>`}
        <button class="btn sec" id="tsk">${learnBare?esc(t('showTashkil')):esc(t('hideTashkil'))}</button>
      </div>
      <p class="muted" style="margin:10px 0 0;font-size:.82rem">${esc(t('learnHint'))}</p>`;
    })():`<div class="big" style="font-size:2.1rem;margin:8px 0 4px">${esc(surahName(info.surah))} <bdi>${info.ayah}</bdi></div>
      <p class="muted" style="margin:0">${esc(t('fromMushaf'))}</p>`}
  </div>
  <div class="card">
    <div class="secbtns"><button class="btn sec sb ${learnGh?'on':''}" id="ghBtn" style="grid-column:1/-1">${esc(t('gharibBtn'))}</button></div>
    <div id="gh" style="margin-top:12px">${learnGh?ghBlock(info):''}</div>
  </div>
  <div class="actions">
    <button class="btn ${S.done[ref]?'sec':''}" id="mk">${S.done[ref]?esc(t('unmark')):esc(isHifz?t('markLearned'):t('markRead'))}</button>
  </div>
  <div class="card" style="margin-top:14px"><div class="jump">
    <label class="f" style="min-width:0">${esc(t('goToNum'))}<input type="number" id="jn" min="1" max="${refs.length}" value="${i}" inputmode="numeric"></label>
    <button class="btn sec" id="jg">${esc(t('goBtn'))}</button>
  </div>
  <p class="muted" style="font-size:.78rem;margin:12px 0 0">${esc(t('mushafRules'))}</p></div>`;
  const $=id=>document.getElementById(id);
  const reset=()=>{learnGh=false;learnCut=null;};
  $('pv').onclick=()=>{learnIdx--;reset();render()};
  $('nx').onclick=()=>{learnIdx++;reset();render()};
  $('ghBtn').onclick=()=>{learnGh=!learnGh;render()};
  if($('hide')) $('hide').onclick=()=>{learnCut=0;render()};
  if($('more')) $('more').onclick=()=>{learnCut++;render()};
  if($('full')) $('full').onclick=()=>{learnCut=null;render()};
  if($('tsk')) $('tsk').onclick=()=>{learnBare=!learnBare;render()};
  $('mk').onclick=()=>{
    if(S.done[ref]) delete S.done[ref]; else S.done[ref]=true;
    save(); render();
  };
  $('jg').onclick=()=>{ const v=+$('jn').value; if(v>=1&&v<=refs.length){learnIdx=v-1;learnGh=false;render();} };
}

/* ---------- повторение (самопроверка по мусхафу) ---------- */
function startWith(refs,exam,mode){
  Q={active:true,done:false,exam:!!exam,mode:mode||'mix',queue:refs.map(r=>({ref:r,retry:false})),idx:0,total:refs.length,correct:0,wrong:[],answered:false};
  render();
}
function qTypeFor(ref){
  let ty=Q.mode||'mix';
  if(ty==='mix') ty=canWrite(ref)&&Math.random()<0.5?'write':'flash';
  if(ty==='write'&&!canWrite(ref)) ty='flash';
  return ty;
}
function fullText(info){
  return `<div class="reveal"><div class="meta"><span class="chip">${esc(surahName(info.surah))} <bdi>${info.ayah}</bdi></span></div>
    ${info.text?`<div class="ar">${esc(info.text)}</div>`:`<p class="muted">${esc(t('fromMushaf'))}</p>`}
    ${info.gharib&&info.gharib.length?ghBlock(info):''}</div>`;
}
function renderQuestion(){
  const c=Q.queue[Q.idx];
  if(!c){ Q.active=false; Q.done=true; render(); return; }
  const info=refInfo(c.ref), ty=c.type||(c.type=qTypeFor(c.ref));
  const head=`<div class="qhead"><span class="muted">${esc(t('iOfN',Q.idx+1,Q.queue.length))}${c.retry?esc(t('retryMark')):''}</span>
    <button class="btn sec" id="stop" style="padding:6px 12px;font-size:.85rem">${esc(t('finishBtn'))}</button></div>
  <div class="bar"><i style="width:${Math.round(Q.idx/Q.queue.length*100)}%"></i></div>`;
  let body;
  if(ty==='write'){
    body=`<div class="card"><p class="qtype">${esc(t('qWriteAyah'))}</p>
      <div class="big" style="font-size:1.7rem;margin:6px 0 10px">${esc(surahName(info.surah))} <bdi>${info.ayah}</bdi></div>
      <textarea id="wtxt" class="wr" dir="rtl" placeholder=""></textarea>
      <p class="muted" style="margin:4px 0 0;font-size:.8rem">${esc(t('tashkilNote'))}</p>
      <div id="fb"><div class="actions"><button class="btn sec" id="skip">${esc(t('dontKnow'))}</button><button class="btn" id="chk">${esc(t('checkBtn'))}</button></div></div></div>`;
  }else{
    body=`<div class="card"><p class="qtype">${esc(t('reciteThis'))}</p>
      <div class="big" style="font-size:2.2rem;margin:10px 0 6px">${esc(surahName(info.surah))} <bdi>${info.ayah}</bdi></div>
      <p class="muted" style="margin:0">${esc(t('checkMushaf'))}</p>
      <div id="fb"><div class="actions"><button class="btn" id="show">${esc(t('showAnswer'))}</button></div></div></div>`;
  }
  app.innerHTML=head+body;
  const $=id=>document.getElementById(id);
  $('stop').onclick=()=>{Q=null;render()};
  if(ty==='write'){
    const ta=$('wtxt'); ta.focus();
    const verdict=res=>{
      const good=res.pct>=85;
      $('fb').innerHTML=
        `<div class="scorebar"><b>${res.pct}%</b><span class="b"><i style="width:${res.pct}%"></i></span><span class="muted">${esc(t('wordMatch'))}</span></div>
         <div class="dif">${res.al.map(x=>`<span class="${x.t}">${esc(x.w)}</span>`).join('')}</div>
         <div class="legend"><span><i style="background:var(--ok)"></i>${esc(t('legOk'))}</span><span><i style="background:var(--bad)"></i>${esc(t('legBad'))}</span><span><i style="background:var(--goldline)"></i>${esc(t('legMiss'))}</span></div>
         <div class="reveal"><div class="muted">${esc(t('correctText'))}</div>${fullText(info)}</div>
         <div class="actions"><button class="btn ${good?'sec':'danger'}" id="wno">${esc(t('dontCount'))}</button><button class="btn ${good?'':'sec'}" id="wyes">${esc(t('countIt'))}</button></div>`;
      $('wyes').onclick=()=>answer(true);
      $('wno').onclick=()=>answer(false);
    };
    $('chk').onclick=()=>{ if(!Q.answered) verdict(checkWritten(info.text||'',ta.value||'')); };
    $('skip').onclick=()=>{
      if(Q.answered) return;
      $('fb').innerHTML=fullText(info)+`<div class="actions"><button class="btn" id="next">${esc(t('nextBtn'))}</button></div>`;
      answer(false,true); $('next').onclick=nextQ;
    };
    ta.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();$('chk').click();} });
  }else{
    $('show').onclick=()=>{
      $('fb').innerHTML=fullText(info)+`<div class="actions"><button class="btn danger" id="no">${esc(t('didntRecall'))}</button><button class="btn" id="yes">${esc(t('recalled'))}</button></div>`;
      $('yes').onclick=()=>answer(true);
      $('no').onclick=()=>answer(false);
    };
  }
}
function answer(ok,hold){
  if(Q.answered) return;
  Q.answered=true;
  const c=Q.queue[Q.idx], ref=c.ref, d=dayNum();
  const p=S.prog[ref]||{box:0,due:d,ok:0,bad:0};
  if(ok){ p.box=Math.min(6,(p.box||0)+1); p.ok=(p.ok||0)+1; if(!c.retry) Q.correct++; }
  else { p.box=0; p.bad=(p.bad||0)+1; if(Q.wrong.indexOf(ref)<0) Q.wrong.push(ref); }
  p.due=d+INT[p.box];
  S.prog[ref]=p; S.reviews=(S.reviews||0)+1;
  if(S.last!==d){ S.streak=(S.last===d-1?(S.streak||0):0)+1; S.last=d; }
  save();
  if(!ok) Q.queue.push({ref,retry:true});
  if(hold) return;            // ждём нажатия «Далее»
  nextQ();
}
function nextQ(){
  Q.idx++; Q.answered=false;
  if(Q.idx>=Q.queue.length){ Q.active=false; Q.done=true; }
  render();
}
function renderDone(){
  const first=Q.queue.filter(x=>!x.retry).length;
  app.innerHTML=`<div class="card empty">
    <div class="big">${Q.correct}<span style="font-size:1.2rem;color:var(--muted)"> / ${Math.min(first,Q.total)}</span></div>
    <p class="muted">${esc(t('firstTry'))}</p><p>${Q.wrong.length?esc(t('payAttention')):esc(t('noMistakes'))}</p></div>
    ${Q.wrong.length?`<div class="card"><div class="mist">${Q.wrong.map(r=>{
      const i=refInfo(r);
      return `<div><div class="ar sm" dir="rtl">${esc(surahName(i.surah))} <bdi>${i.ayah}</bdi></div></div>`;
    }).join('')}</div></div>`:''}
    <button class="btn" id="again" style="width:100%">${esc(t('backBtn'))}</button>`;
  document.getElementById('again').onclick=()=>{Q=null;render()};
}

/* ---------- что отмечено ---------- */
function renderPick(){
  const rows=pickedRows();
  if(!rows.length){ app.innerHTML=`<div class="card empty muted">${esc(t('noAssignments'))}</div>`; return; }
  app.innerHTML=`<div class="sticky"><div class="card" style="margin-bottom:10px">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><b id="cnt"></b></div>
    <input type="search" id="q" placeholder="${esc(t('searchPh')||'')}" value="${esc(pickFilter)}" inputmode="numeric">
  </div></div>`+
  rows.map(r=>{
    const refs=refsOfRow(r).filter(x=>!pickFilter||x.split(':')[1].indexOf(pickFilter)===0);
    if(!refs.length) return '';
    return `<div class="card"><div class="ar sm" dir="rtl" style="font-weight:700;margin-bottom:8px">${rowLabel(r)}</div>
      <div class="list">${refs.map(x=>`<label class="pick ${S.done[x]?'on':''}">
        <input type="checkbox" data-r="${x}" ${S.done[x]?'checked':''}>
        <div><div class="top"><span class="chip">${esc(t('ayahNo',x.split(':')[1]))}</span></div></div></label>`).join('')}</div></div>`;
  }).join('');
  const $=id=>document.getElementById(id);
  const cnt=()=>{ $('cnt').textContent=t('markedN',allRefs().filter(r=>S.done[r]).length); };
  cnt();
  app.querySelectorAll('.pick input[data-r]').forEach(b=>b.onchange=()=>{
    const r=b.dataset.r;
    if(b.checked) S.done[r]=true; else delete S.done[r];
    b.closest('.pick').classList.toggle('on',b.checked);
    save(); cnt();
  });
  $('q').oninput=e=>{ pickFilter=e.target.value.trim(); render(); };
}

/* ---------- аналитика ---------- */
function accuracy(){
  let ok=0,bad=0;
  Object.keys(S.prog||{}).forEach(k=>{ok+=S.prog[k].ok||0;bad+=S.prog[k].bad||0;});
  return {ok,bad,total:ok+bad,pct:(ok+bad)?Math.round(ok/(ok+bad)*100):null};
}
function weakRefs(){
  return doneHifz().map(r=>{
    const p=S.prog[r]||{ok:0,bad:0,box:0}, tot=(p.ok||0)+(p.bad||0);
    return {ref:r,p,tot,rate:tot?(p.bad||0)/tot:0};
  }).filter(x=>(x.p.bad||0)>0).sort((a,b)=>b.rate-a.rate||(b.p.bad||0)-(a.p.bad||0));
}
function dueForecast(days){
  const n=dayNum(), LR=doneHifz(), out=[];
  for(let i=0;i<days;i++){
    const d=n+i; let c=0;
    LR.forEach(r=>{const due=(S.prog[r]||{due:n}).due; if(i===0?due<=d:due===d) c++;});
    out.push(c);
  }
  return out;
}
function renderStats(){
  const MC=window.MuharrarCharts;
  const hz=hifzRefs(), done=doneHifz(), cnts=new Array(7).fill(0);
  done.forEach(r=>cnts[(S.prog[r]||{box:0}).box]++);
  const acc=accuracy(), weak=weakRefs().slice(0,8), n0=dayNum(), LV=t('lvNames');
  const fc=dueForecast(14).map((v,i)=>({
    value:v, hl:i===0, label:window.MuharrarL.dowShort(n0+i),
    tip:(i===0?t('todayWord'):t('inDaysS',i)+' · '+window.MuharrarL.dowShort(n0+i))+'\n'+v+' '+t('dueSuffix')
  }));
  const rows=pickedRows().map(r=>{
    const refs=refsOfRow(r);
    return {label:r.segs.map(sg=>surahName(sg[0])+' '+sg[1]+'–'+sg[2]).join(' + ')+' · '+(r.mode==='hifz'?'تسميع':'تلاوة'),
      done:refs.filter(x=>S.done[x]).length,total:refs.length,rtl:false};
  });
  const carpet=hz.length?MC.carpet({
    items:hz, dense:hz.length>90,
    level:r=>S.done[r]?((S.prog[r]||{box:0}).box||0):null,
    tip:r=>{
      const i=refInfo(r), p=S.prog[r], tot=p?(p.ok||0)+(p.bad||0):0;
      return surahName(i.surah)+' · '+t('ayahWord')+' '+i.ayah+'\n'+(S.done[r]?LV[(p||{box:0}).box||0]:t('notLearnedA'))
        +(tot?'\n'+t('corrOf',p.ok||0,tot):'');
    }
  }):'';
  app.innerHTML=`
  <div class="card">
    <p class="eyebrow">${esc(t('sumTitle'))}</p>
    ${MC.statRow([
      {value:done.length,unit:'/'+hz.length,label:t('kLearnedA')},
      {value:dueItems().length,label:t('kDue')},
      {value:acc.pct==null?'—':acc.pct,unit:acc.pct==null?'':'%',label:t('kAcc'),sub:acc.total?t('corrOf',acc.ok,acc.total):''},
      {value:curStreak(),label:t('kStreak')}
    ])}
  </div>
  <div class="card">
    <p class="eyebrow">${esc(t('mapTitle'))}</p>
    ${hz.length?`${carpet}
    <p class="mc-note">${esc(t('mapNoteA'))}</p>
    ${done.length?MC.levelStrip(cnts,LV,{unit:t('unitAyahN')}):''}`
    :`<p class="muted" style="margin:0">${esc(t('mapEmptyA'))}</p>`}
  </div>
  ${done.length?`<div class="card">
    <p class="eyebrow">${esc(t('loadTitle'))}</p>
    ${MC.columns({rows:fc,note:t('loadNoteA')})}
  </div>`:''}
  <div class="card">
    <p class="eyebrow">${esc(t('assignTitle'))}</p>
    ${rows.length?MC.sections({rows}):'<p class="muted" style="margin:0">'+esc(t('noAssignmentsDot'))+'</p>'}
  </div>
  ${weak.length?`<div class="card">
    <p class="eyebrow">${esc(t('weakTitle'))}</p>
    <p class="muted" style="margin:0 0 11px">${esc(t('weakNoteA'))}</p>
    <div class="weak">${weak.map(w=>{
      const i=refInfo(w.ref);
      return `<div class="weak-i">
        <span class="weak-n"><bdi>${i.ayah}</bdi></span>
        <span class="weak-t">${esc(surahName(i.surah))}</span>
        <span class="weak-p" data-tip="${esc(t('errOf',w.p.bad||0,w.tot))}" tabindex="0">${Math.round(w.rate*100)}%</span>
      </div>`;
    }).join('')}</div>
    <button class="btn" id="drill" style="width:100%;margin-top:12px">${esc(t('drillBtn',Math.min(weak.length,20)))}</button>
  </div>`:''}
  <div class="card">
    <p class="eyebrow">${esc(t('bkTitle'))}</p>
    <p class="muted" style="margin-top:0">${esc(t('bkNoteQ'))}</p>
    <textarea id="bk">${esc(JSON.stringify(S))}</textarea>
    <div class="actions"><button class="btn sec" id="imp">${esc(t('loadBtn'))}</button><button class="btn danger" id="rst">${esc(t('resetQuran'))}</button></div>
    <p class="muted" id="msg" style="margin:8px 0 0"></p></div>`;
  const $=id=>document.getElementById(id);
  if($('drill')) $('drill').onclick=()=>{ tab='quiz'; startWith(shuffle(weak.slice(0,20).map(w=>w.ref)),false); };
  $('imp').onclick=()=>{
    try{const o=JSON.parse($('bk').value); if(!o||typeof o!=='object') throw 0; S=Object.assign(fresh(),o); if(!Array.isArray(S.picked)) S.picked=[]; save(); render();}
    catch(e){$('msg').textContent=t('readErr');}
  };
  $('rst').onclick=()=>{
    if(!resetArmed){resetArmed=true;$('rst').textContent=t('pressAgain');setTimeout(()=>{resetArmed=false;if($('rst'))$('rst').textContent=t('resetQuran')},4000);return;}
    S=fresh();save();resetArmed=false;render();
  };
}

/* ---------- шапка/рендер ---------- */
function applyHeader(){
  window.MuharrarL.apply([app,document.getElementById('hero-quran')]);
  const ttlEl=document.getElementById('ttl-quran');
  if(ttlEl) ttlEl.innerHTML=esc(t('qTitle'))+'<small>غريب القرآن — طبعة مجمع الملك فهد</small>';
  const stk=document.getElementById('streak-quran');
  if(stk) stk.textContent=cur?t('streakLbl',curStreak()):'';
}
function render(){
  applyHeader();
  if(!cur) return;
  if(tab==='learn') renderLearn();
  else if(tab==='quiz') Q&&Q.active?renderQuestion():(Q&&Q.done?renderDone():renderHome());
  else if(tab==='pick') renderPick();
  else renderStats();
  window.scrollTo(0,0);
}

window.MuharrarModules = window.MuharrarModules || {};
window.MuharrarModules.quran = {
  key: 'quran',
  get title(){ return t('qTitle'); },
  setProfile(p){ loadProfile(p); },
  render(){ render(); },
  setTab(tt){ tab=tt; Q=null; render(); },
  getTab(){ return tab; },
  summary(){
    const {n,exam}=cycleInfo(), hz=hifzRefs(), rows=pickedRows();
    return {
      learned:doneHifz().length, total:hz.length,
      due:dueItems().length,
      examDays:exam-n, examDow:0,
      streak:curStreak(),
      unit:t('unitAyah'),
      week:rows.length?{label:rows.map(r=>r.segs.map(sg=>surahName(sg[0])+' '+sg[1]+'–'+sg[2]).join('+')).join(', '),
                        done:allRefs().filter(r=>S.done[r]).length,total:allRefs().length}:null
    };
  },
  exportState(){ return S; },
  importState(o){ if(!o||typeof o!=='object') return false; S=Object.assign(fresh(),o); if(!Array.isArray(S.picked)) S.picked=[]; save(); return true; }
};

})();

  bkTitle:{ru:'Общая резервная копия',en:'Full backup',ar:'نسخة احتياطية شاملة'},
  bkNote:{ru:'Прогресс по всем четырём предметам одной строкой. Скопируйте и сохраните, либо вставьте сохранённое и нажмите «Загрузить».',en:'Progress across all four subjects in one string. Copy and keep it, or paste a saved one and press Load.',ar:'تقدّمك في المواد الأربع في نص واحد. انسخه واحفظه، أو الصق نسخة محفوظة ثم اضغط «تحميل».'},
  bkCopy:{ru:'Скопировать',en:'Copy',ar:'نسخ'},
  bkLoad:{ru:'Загрузить',en:'Load',ar:'تحميل'},
  bkCopied:{ru:'Скопировано.',en:'Copied.',ar:'تم النسخ.'},
  bkOk:{ru:'Прогресс восстановлен.',en:'Progress restored.',ar:'تمت استعادة التقدم.'},
  bkErr:{ru:'Не удалось прочитать данные.',en:'Could not read that data.',ar:'تعذّرت قراءة البيانات.'}
};
const st=k=>(SI[k]&&(SI[k][SL]||SI[k].ru))||'';

const SUBJECTS=[
  {key:'hadith',sub:'شرح وتحليل الأحاديث',short:{ru:'Хадис',en:'Hadith',ar:'حديث'},
    label:{ru:'Хадис тахлили 2',en:'Hadith Tahlili 2',ar:'حديث تحليلي ٢'},
    note:{ru:'150 хадисов из «аль-Мухаррар»',en:'150 hadiths from "al-Muharrar"',ar:'150 حديثًا من «المُحرَّر»'}},
  {key:'mustalah',sub:'مصطلح الحديث — الألفية',short:{ru:'Мусталях',en:'Mustalah',ar:'مصطلح'},
    label:{ru:'Мусталях аль-хадис 1',en:'Mustalah al-Hadith 1',ar:'مصطلح الحديث ١'},
    note:{ru:'86 бейтов (мукаддима + الصحيح + الحسن)',en:'86 verses (intro + al-Sahih + al-Hasan)',ar:'86 بيتًا (المقدمة + الصحيح + الحسن)'}},
  {key:'ruwat',sub:'رواة الحديث — الألفية',short:{ru:'Руват',en:'Ruwat',ar:'رواة'},
    label:{ru:'Руват аль-хадис 1',en:'Ruwat al-Hadith 1',ar:'رواة الحديث ١'},
    note:{ru:'61 бейт (الصحابة، التابعون، الأسماء…)',en:'61 verses (Companions, Successors, names…)',ar:'61 بيتًا (الصحابة، التابعون، الأسماء…)'}},
  {key:'quran',sub:'حفظ وتلاوة وغريب القرآن',short:{ru:'Коран',en:'Quran',ar:'قرآن'},
    label:{ru:'Коран 3',en:'Quran 3',ar:'القرآن ٣'},
    note:{ru:'تسميع и تلاوة по программе курса',en:'تسميع and تلاوة from the course plan',ar:'تسميع وتلاوة حسب مقرر المادة'}}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function showSubject(k){
  SUBJECTS.forEach(s=>{
    const app=document.getElementById('app-'+s.key), hero=document.getElementById('hero-'+s.key);
    const on=s.key===k;
    if(app){ app.hidden=!on; if(!on) app.innerHTML=''; }
    if(hero) hero.hidden=!on;
  });
}
function renderNav(){
  const m=activeKey?window.MuharrarModules[activeKey]:null;
  const t=m?m.getTab():'quiz';
  document.querySelectorAll('#mainNav [data-tab]').forEach(b=>{
    b.setAttribute('aria-current', b.dataset.tab===t?'true':'false');
  });
}
function applyNavLabels(){
  const map={learn:'navLearn',quiz:'navQuiz',pick:'navPick',stats:'navStats'};
  document.querySelectorAll('#mainNav [data-tab]').forEach(b=>{
    const key=map[b.dataset.tab]; if(key) b.textContent=st(key);
  });
  const bb=document.getElementById('backBtn'); if(bb) bb.textContent=st('backBtn');
}
/* dir/lang оболочки (шапка, вход, выбор предмета, нижнее меню) следуют выбранному языку;
   содержимое самих предметов переключается отдельно (пока только «Хадис тахлили») */
function applyShellDir(){
  const dir=SL==='ar'?'rtl':'ltr';
  ['pickerArea','mainNav'].forEach(id=>{
    const el=document.getElementById(id); if(el){ el.setAttribute('lang',SL); el.setAttribute('dir',dir); }
  });
  const tb=document.querySelector('.topbar .tb-in'); if(tb){ tb.setAttribute('lang',SL); tb.setAttribute('dir',dir); }
  applyNavLabels();
}
document.querySelectorAll('#mainNav [data-tab]').forEach(b=>{
  b.onclick=()=>{
    const m=activeKey?window.MuharrarModules[activeKey]:null;
    if(m){ m.setTab(b.dataset.tab); renderNav(); window.scrollTo(0,0); }
  };
});
document.getElementById('backBtn').onclick=()=>{ activeKey=null; renderAll(); };

const langSelEl=document.getElementById('lang');
if(langSelEl){
  langSelEl.value=SL;
  langSelEl.addEventListener('change',e=>{
    SL=e.target.value;
    try{localStorage.setItem(LKEY,SL);}catch(err){}
    renderAll();
  });
}

function openSubject(k){
  activeKey=k;
  renderAll();
}


/* ---------- сводка по предметам ---------- */
const fmt=(k,n)=>st(k).replace('%d',n);
const ksaNow=()=>Date.now()+3*36e5;
const todayNum=()=>Math.floor(ksaNow()/864e5);
function summaries(){
  const out={};
  SUBJECTS.forEach(s=>{
    const m=window.MuharrarModules[s.key];
    try{ out[s.key]=(m&&typeof m.summary==='function')?m.summary():null; }catch(e){ out[s.key]=null; }
  });
  return out;
}
function examTag(days){
  if(days==null) return '';
  const cls=days<=1?'t-crit':days<=3?'t-warn':'t-idle';
  const txt=days===0?st('exToday'):days===1?st('exTomorrow'):fmt('exInN',days);
  return `<span class="tag ${cls}"><i></i>${esc(txt)}</span>`;
}
function dueTag(due){
  return due>0
    ? `<span class="tag t-warn"><i></i>${esc(fmt('dueN',due))}</span>`
    : `<span class="tag t-ok"><i></i>${esc(st('allDone'))}</span>`;
}
/* Неделя вперёд: 7 дней от сегодня, с отметками экзаменов */
function weekStrip(sums){
  const n0=todayNum(), loc=SL==='ar'?'ar':SL==='en'?'en-GB':'ru-RU';
  const days=[];
  for(let i=0;i<7;i++){
    const d=n0+i, dow=(d+4)%7;
    const marks=SUBJECTS.filter(s=>sums[s.key]&&sums[s.key].examDow===dow)
                        .map(s=>((s.short&&s.short[SL])||(s.short&&s.short.ru)||s.label.ru));
    const nm=window.MuharrarL.dowShort(d);
    days.push(`<div class="wk-d${i===0?' today':''}" data-tip="${esc(
        (marks.length?marks.join(', ')+' — '+st('examWord'):st('weekTitle'))
      )}" tabindex="0">
      <div class="wk-n">${esc(nm)}</div>
      <div class="wk-num">${new Date(d*864e5).getUTCDate()}</div>
      <span class="wk-x${marks.length?' on':''}"></span>
      <div class="wk-lab">${marks.length?esc(marks.join(', ')):''}</div>
    </div>`);
  }
  return `<div class="card"><p class="eyebrow">${esc(st('weekTitle'))}</p><div class="wk">${days.join('')}</div></div>`;
}

function renderPicker(){
  const el=document.getElementById('pickerArea');
  const H=window.MuharrarModules.hadith;
  const daily = H && H.dailyHtml ? H.dailyHtml() : '';
  const sums=summaries();
  const totalDue=SUBJECTS.reduce((a,s)=>a+((sums[s.key]&&sums[s.key].due)||0),0);
  const bestStreak=SUBJECTS.reduce((a,s)=>Math.max(a,(sums[s.key]&&sums[s.key].streak)||0),0);

  const hero=`<div class="dash-hero"><div class="dh-row">
    <div>
      <div class="dh-l">${esc(totalDue?st('dashDue'):st('dashClear'))}</div>
      <div class="dh-v">${totalDue||'✓'}</div>
      <div class="dh-s">${esc(totalDue?st('dashAll'):st('dashClearS'))}</div>
    </div>
    ${bestStreak?`<span class="dh-streak">${esc(fmt('streakN',bestStreak))}</span>`:''}
  </div></div>`;

  const tiles=SUBJECTS.map(s=>{
    const q=sums[s.key];
    const pct=q&&q.total?Math.round(q.learned/q.total*100):0;
    return `<button class="subj" data-k="${s.key}">
      <div class="subj-h">
        <span class="subj-n">${esc(s.label[SL]||s.label.ru)}</span>
        <span class="subj-ar" dir="rtl">${esc(s.sub.split('—')[0].trim())}</span>
      </div>
      <div class="muted" style="font-size:.8rem">${esc(s.note[SL]||s.note.ru)}</div>
      ${q?`<div class="subj-m">
        ${q.total?`<div class="mc-track"><i style="width:${pct}%"></i></div>`:''}
        <div class="subj-f">
          ${q.total?`<span class="muted" style="font-variant-numeric:tabular-nums">${q.learned}/${q.total} · ${pct}%</span>`:''}
          ${q.total?dueTag(q.due):''}${examTag(q.examDays)}
        </div></div>`:''}
    </button>`;
  }).join('');

  el.innerHTML = hero + weekStrip(sums)
    + `<p class="eyebrow" style="margin:18px 2px 9px">${esc(st('pickSubject'))}</p>`
    + `<div class="subj-grid" id="subjGrid">${tiles}</div>`
    + `<div style="height:13px"></div>` + daily
    + `<div class="card"><p class="eyebrow">${esc(st('bkTitle'))}</p>
        <p class="muted" style="margin:0 0 10px">${esc(st('bkNote'))}</p>
        <textarea id="bkAll">${esc(JSON.stringify(collectAll()))}</textarea>
        <div class="actions">
          <button class="btn sec" id="bkCopy">${esc(st('bkCopy'))}</button>
          <button class="btn sec" id="bkLoad">${esc(st('bkLoad'))}</button>
        </div>
        <p class="muted" id="bkMsg" style="margin:8px 0 0"></p></div>`;

  const grid=document.getElementById('subjGrid');
  grid.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>openSubject(b.dataset.k));
  wireBackup();
}

/* ---------- единый экспорт ---------- */
function collectAll(){
  const out={v:1,app:'muharrar',name:cur?cur.name:'',saved:new Date().toISOString().slice(0,10)};
  SUBJECTS.forEach(s=>{
    const m=window.MuharrarModules[s.key];
    try{ if(m&&typeof m.exportState==='function') out[s.key]=m.exportState(); }catch(e){}
  });
  return out;
}
function wireBackup(){
  const $=id=>document.getElementById(id);
  const msg=t=>{ const el=$('bkMsg'); if(el) el.textContent=t; };
  if($('bkCopy')) $('bkCopy').onclick=()=>{
    const ta=$('bkAll'); ta.select();
    let done=false;
    try{ done=document.execCommand('copy'); }catch(e){}
    if(!done&&navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>msg(st('bkCopied')),()=>{}); }
    msg(st('bkCopied'));
  };
  if($('bkLoad')) $('bkLoad').onclick=()=>{
    let o=null;
    try{ o=JSON.parse($('bkAll').value); }catch(e){}
    if(!o||typeof o!=='object'){ msg(st('bkErr')); return; }
    let any=false;
    SUBJECTS.forEach(s=>{
      const m=window.MuharrarModules[s.key];
      if(o[s.key]&&m&&typeof m.importState==='function'){ try{ if(m.importState(o[s.key])) any=true; }catch(e){} }
    });
    msg(any?st('bkOk'):st('bkErr'));
    if(any) renderAll();
  };
}

function renderAll(){
  applyShellDir();
  const pickerEl=document.getElementById('pickerArea');
  const backBtn=document.getElementById('backBtn'), nav=document.getElementById('mainNav');
  if(!activeKey){
    pickerEl.hidden=false;
    backBtn.style.display='none'; nav.hidden=true;
    showSubject(null);
    renderPicker();
    return;
  }
  pickerEl.hidden=true; pickerEl.innerHTML='';
  backBtn.style.display='';
  nav.hidden=false;
  showSubject(activeKey);
  const m=window.MuharrarModules[activeKey];
  if(m) m.render();
  renderNav();
  window.scrollTo(0,0);
}

/* Приложение личное: без входа по имени.
   Ключ хранилища берём тот, что уже использовался, иначе общий — так
   весь ранее накопленный прогресс остаётся на месте. */
cur={name:'', key:(PR.last||(PR.list[0]&&PR.list[0].key)||'me')};
if(!PR.last){ PR.last=cur.key; savePR(); }
Object.keys(window.MuharrarModules).forEach(k=>window.MuharrarModules[k].setProfile(cur));
renderAll();
})();
</script>
