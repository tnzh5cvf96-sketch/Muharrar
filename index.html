أدْرَكْتُ مِنْ قَوْلِهِ: «مَا مِنْ مُسْلِمٍ يَتَوَضّأ فَيُحْسَِنُ وُضُوءَهُ، ثُمّ يَقُومُ فَيُصَلِي رَكْعَتَيْنِ، مُقْبِلا عَلَيْهِمَا بِقَلْبِهِ وَوَجْهِهِ؛ إِلَاّ وَجَبَتْ لَهُ الجَنّةُ» رَوَاهُ مُسْلِمٌ. وَقَصّرَمَنْ عَزَاهُ إِلَى أبِي دَاوُدَ وَحْدَهُ.", "w": ["قوله: (فجاءت نوبتي) بفتح النون وسكون الواو، والنوبة اسم مصدر من ناوبته مناوبة؛ أي: فعلته مرة، وهو يفعله مرة.", "قوله: (فروحتها بعشي) بتشديد الواو؛ أي: رددتها إلى مراحها ـ بضم الميم ـ وهو مأواها ومبيتها. والعشي: آخر النهار، وقيل: ما بين الزوال إلى الغروب.", "قوله: (مقبلاً عليهما) هكذا بالنصب وهو حال، والمثبت في «صحيح مسلم» (مقبل) بالرفع، وهو خبر لمبتدأ محذوف؛ أي: وهو مقبل. على أن الطيبي ذكر في شرحه «للمشكاة» أنه وجد في بعض النسخ: (مقبلاً) لكن لا أدري هل يريد نسخ «صحيح مسلم»، أو نسخ «مشكاة المصابيح»؟.", "قوله: (بقلبه) بأن يُقبل على صلاته، فلا يغفل عنها، ولا يحدث نفسه بشيء خارج عنها، بل يصرف نفسه عنه مهما أمكن، قد أخذ قلبه ووضعه بين يدي ربه، ناظرًا بقلبه إليه، مراقباً له، ممتثلاً من محبته وتعظيمه، كأنه يراه ويشاهده.", "قوله: (ووجهه) بأن يُقبل على صلاته ببدنه، ولا يلتفت إلى جهة لا يليق به الالتفات إليها، ومرجع هذا إلى الخشوع والخضوع، فإن الخشوع في القلب، والخضوع في الجوارح والأعضاء.", "قوله: (إلا وجبت له الجنة)؛ أي: إن الله تعالى أوجب على نفسه أن يُدخله الجنة فضلاً منه وكرماً. والظاهر أن المراد دخولها أولاً بلا سبق عذاب؛ لأن دخول الجنة مطلقاً يكفي فيه الإيمان ولو لم يعمل هذا العمل، كما هو مذهب أهل السُّنَّة."], "s": ["في الحديث بيان فضل الركعتين بعد إتمام الوضوء وإحسانه، إذا اتصف المصلي بخشوع القلب وخضوع الجوارح، وأن ثواب ذلك دخول الجنة دخولاً أولياً، لكن هذا متوقف على مغفرة الصغائر والكبائر، والموت على حسن الخاتمة، وقد يجعل الله الحديث بشارة بذلك. وكأن هذا الحديث بمنزلة التفسير لحديث عثمان في وصفه وضوء النبي ﷺ، وفي آخره قال ﷺ: «مَن توضأ نحو وضوئي هذا، ثم صلى ركعتين لا يحدث فيهما نفسه غفر له ما تقدم من ذنبه»، فيكون هذا الثواب العظيم مرتباً على الوصفين: وصف متعلق بالوضوء، ووصف متعلق بالصلاة. لكن من أهل العلم من قال: إن هذه الفضيلة تحصل مع الخواطر العارضة غير المستقرة؛ لأن قوله: «لا يحدث فيهما نفسه» يفيد أن المراد ما يجتلبه العبد. ومنهم من قال: إن مثل هذا يرجى أن تقبل منه الصلاة، ولكن صلاته دون صلاة من لم يحدث نفسه بشيء، والله تعالى أعلم."]}, "64": {"m": "وَعَنَْ أَبِي جُهََيْمٍ رضي الله عنه قََالَ: قَالَ رَسُولُ اللَّهِ صَلى الله عليه وَسلم: «لَوْ يََعْلَمُ المَارُّ بَيْنَ يََدَيِ المُصََلِي مَاذَا عَلَيْهِ؛ لَكَانَ أنْ يَقِفَ أرْبَعِينَ خَيْرا لَهُ مِنْ أنْ يَمُرّبَيْنَ يَدَيْهِ. قَالَ أبُو النّضْرِ: لَا أدْرِي؛ قَالَ: أرْبَعِينَ يَوْما، أوْ شَهْرا، أوْ سَنَةا» مُتّفَقٌ عَلَيْهِ. وَفِي بَعْضِ رِوَ ايَاتِ البُخَارِي:ِ «مَاذَا عَلَيْهِ مِنَ الإِثْمِ».", "w": ["قوله: (لو يعلم المار) لو: حرف شرط، يدل على ما كان سيقع لوقوع غيره نحو: لو حضر أخوك لحضرت، أي: كان سيقع حضوري فيما مضى لو حضر أخوك، والتقدير هنا: سيقع اختيار الوقوف في الزمن الماضي لو وقع المرور بين يدي المصلي. والشرط قوله: يعلم، والجواب: لكان أن يقف، وقيل: محذوف تقديره: لاختار أن يقف والمراد بالمار: العابر من اليمين إلى الشمال أو بالعكس، وخرج بذكر المار: القائم والقاعد والنائم وغيره، فلا إثم عليه إلا إن قصد بذلك التشويش على المصلي فهو في معنى المار.", "قوله: (بين يدي المصلي) أي: أمام المصلي من قدميه إلى منتهى سجوده على الأظهر، وقيل: بينه وبين قدر ثلاثة أذرع، وقيل: بينه وبين قدر رمية حجر، وقيل: إذا بعد عرفاً بحيث لا يمكن دفعه إلا بالتقدم خطوات، وهذا إذا لم يتخذ المصلي سترة، فإن اتخذ سترة فإنه يمر وراءها ولا حرج.", "والتعبير باليدين من باب المجاز المرسل، حيث عبر بالبعض عن الكل، قيل: وجه ذلك لأن أكثر عمل الإنسان بهما حتى نسب الكسب إليهما في نحو: بما كسبت يداك، وأشباهه.", "قوله: (لكان أن يقف) أي: يبقى واقفاً منتظرًا فراغ المصلي، و (أن) وما بعدها في تأويل مصدر اسم (كان)، و (خيرا) خبرها، والتقدير: لكان وقوفه أربعين خيرًا له من أن يمر.", "قوله: (أربعين) وقد أبهم المعدود في رواية «الصحيحين» وغيرهما، تفخيما للأمر وتعظيما، وإن كان ظاهر السياق أنه عين المعدود، ولكن شك الراوي فيه، وقد ورد في حديث أبي هريرة رضي الله عنه مرفوعا: «لو يعلم أحدكم ما له في أن يمر بين يدي أخيه، معترضا في الصلاة، كان لأن يقيم مئة عام خير له من الخطوة التي خطاها».", "وذكر الحافظ ابن حجر أن هذا يشعر بأن إطلاق الأربعين للمبالغة في تعظيم الأمر، لا لخصوص عدد معين. والله أعلم."], "s": ["الوجه الر ابع: الحديث دليل على تحريم المرور بين يدي المصلي، وأنه من المسائل التي جاء فيها الوعيد، وقد ذكر الشوكاني أن هذا دليل على أن المرور بين يدي المصلي من الكبائر، وذلك - والله أعلم - لأن المصلي واقف بين يدي الله تعالى يناجيه، وفي المرور بين يديه قطع لمناجاته، وتشويش عليه، وقد نقل ابن حزم الإجماع على أنه آثم.", "وقد عبر جمع من أهل العلم كابن عبد البر وابن حزم والبغوي بكراهة المرور بين يدي المصلي، والظاهر أن المراد كراهة التحريم، لما ثبت في ذلك من الوعيد الشديد، ولما قال الترمذي: (والعمل على هذا الحديث عند أهل العلم، كرهوا المرور بين يدي المصلي)، قال الشارح المباركفوري: (المراد بالكراهة عند الترمذي: التحريم)، فيجب على المسلم أن يحذر المرور بين يدي المصلي أو التساهل في ذلك، خشية الوقوع تحت هذا الوعيد، كما أنه ينبغي للمصلي أن يبتعد عن الصلاة في طرق الناس والأمكنة التي لا بد لهم من المرور بها، كالممرات في مثل المسجد الحرام، والمسجد النبوي، والمساجد الكبيرة؛ لئلا يعرض صلاته للنقص أو التشويش، ويعرض المارة للإثم، أو الحرج بالوقوف حتى يفرغ من صلاته.", "الوجه الخامس: المصلي إن صلى إلى سترة حرم المرور بينه وبين سترته، وكذا لو اتخذ سجادة يصلي عليها، فإن هذه السجادة محترمة، فلا يحل لأحد أن يمر بين يدي المصلي فيها.", "فإن كان المصلي إلى غير سترة، فإن المحرم ما بين قدمه وموضع سجوده، فلا يحل لأحد أن يمر في هذا الموضع، وإنما قيد بذلك على الأظهر؛ لأن المصلي لا يستحق أكثر مما يحتاج إليه في صلاته، فليس له الحق أن يمنع الناس مما لا يحتاجه، فإن بعد المار سلم من الإثم؛ لأنه إذا بعد عنه عرفاً لا يسمى ماراً بين يديه، فهو كالذي يمر من وراء السترة.", "الوجه السادس: الراجح من قولي أهل العلم أن المرور بين يدي المصلي في المسجد الحرام محرم، لا فرق في ذلك بينه وبين غيره، لعموم هذه الحديث، وليس هناك دليل يخص مكة أو المسجد الحرام. ومن تراجم البخاري في صحيحه: «باب السترة بمكة وغيرها» قال ابن حجر: (أراد البخاري التنبيه على ضعف الحديث - يعني حديث المطلب ابن أبي وداعة - وأنه لا فرق بين مكة وغيرها في مشروعية السترة، قال: وهذا هو المعروف عند الشافعية، وأنه لا فرق في منع المرور بين يدي المصلي بين مكة وغيرها).", "وقد ثبت في حديث جابر رضي الله عنه أن النبي صلى الله عليه وسلم لما صلى ركعتي الطواف جعل المقام بينه وبين البيت. وعن صالح بن كيسان قال: (رأيت ابن عمر يصلي في الكعبة، فلا يدع أحداً يمر بين يديه، يبادره، قال: يرده).", "لكن إن صلى الإنسان في مكان يحتاج الناس المرور فيه كالممرات الموجودة داخل المسجد الحرام فإن الجناية من المصلي نفسه؛ لأن الحق للمارة، وكذا من يصلي في المطاف، فإنه لا حرمة له، ولا يلزم الناس أن يتحاشوا المرور بين يديه؛ لأنه هو الذي وقف يصلي في مكانهم.", "وقد نص جمع من أهل العلم على أنه في حال الزحام الشديد في مكة لا يدفع المار بين يديه، وإنما النهي فيما إذا وجد المار سبيلاً، لكن على المسلم أن يتقي الله ما استطاع، ولا يتهاون في هذا الأمر، كما عليه كثير من الناس، فإن غلب على ذلك فلا بأس إن شاء الله تعالى، لما يترتب على منع المرور بين يدي المصلي من الحرج الشديد على المار والممرور عليه، لما يسببه ذلك من مضاعفة الزحام، والله أعلم."]}, "65": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها أَنّهَا قَالَتْ: «سُئِلَ رَسُولُ اللَّهِ صلى الله عليه وسلم فِي غَزْوَةِ تَبُوكَ عَنْ سُتْرَةِ المُصَلِي، فَقَالَ: مِثْلُ مُؤْخِرَةِ الرّحْلِ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (مثل مؤخرة الرحل) بضم الميم وسكون الهمزة، وكسر الخاء المعجمة، هي العود الذي يكون في آخر الرحل، يستند إليه الراكب، قال النووي: هي قدر عظم الذراع، وهو نحو ثلثي ذراع.", "والظاهر أن طولها غير مقدر، فقد تكون نصف ذراع، وقد تكون أكثر أو أقل، وكأن هذا - والله أعلم - بيان لنوع السترة، وليس تحديدا لمقدارها، كما سيأتي إن شاء الله."], "s": ["الحديث دليل على أنه يكفي من السترة ما كان بمقدار مؤخرة الرحل في الارتفاع، أي: بمقدار ثلثي ذراع تقريبا، وهذا ليس على سبيل التحديد، بل هو على سبيل التقريب؛ لأنه ثبت أنه صلى الله عليه وسلم استتر بالجدار والعنزة والحربة ومقام إبراهيم عليه الصلاة والسلام وغير ذلك مما هو أطول بكثير من مؤخرة الرحل، والله تعالى أعلم."]}, "66": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «إِذَا صَلّى أَحَدُكَُمْ؛ فَلْيَجْعَلْ تِلْقَاءَ وَجَْهِهِ شَيْئا، فَإِنْ لَمْ يَجِدْ فَلْيَنْصِبْ عَصا، فَإِنْ لَمْ يَكُنْ مَعَهُ عَصا فَلْيَخُطّ خَطا، ثُمّ لَا يَضُرُّهُ مَا مَرّ أمَامَهُ» رَوَاهُ أَحْمَدُ، وَ أبُو دَاوُدَ، وَ ابْنُ مَاجَهْ، وَ ابْنُ حِبّانَ. وَهُوَ حَدِيثٌ مُضْطَرِبُ الإِسْنَادِ؛ وَلِذَلِكَ ضَعّفَهُ الشّافِعِيُّ، وَغَيْرُهُ، وَصَحّحَهُ ابْنُ المَدِينِيِ، وَغَيْرُهُ. وَقَالَ ابْنُ عُيَيْنَةَ: «لَمْ نَجِدْ شَيْئا نَشُدُّ بِهِ هَذَا الحَدِيثَ»، وَقَالَ البَيْهَقِيُّ: «لَا بَأْسَ بِهَذَا الحَدِيثِ فِي هَذَا الحُكْمِ».", "s": ["الحديث دليل على مشروعية اتخاذ المصلي سترة، وأن السنة أن ينظر، فإن وجد شاخصاً كجدار أو شجرة أو سارية صلى إليها، وقد ورد في حديث سهل بن سعد رضي الله عنه قال: كان بين مصلى رسول الله صلى الله عليه وسلم وبين الجدار ممر شاة، فإن لم يجد نصب عصا، وفي حديث ابن عمر رضي الله عنهما أن رسول الله صلى الله عليه وسلم كان إذا خرج يوم العيد أمر بالحربة، فتوضع بين يديه، فيصلي إليها.. الحديث.", "فإن لم يجد خط خطاً، ثم لا يضر من مر بين يديه إذا كان من وراء السترة، ولم يرد في الحديث كيفية الخط، فإن خطه بالطول أو على هيئة الهلال فلا بأس، وقد ورد عن الإمام أحمد ما يدل على ذلك.", "وموضوع الخط قد يحتاج إليه لإمكانه قديماً عندما كانت أرض المسجد وفناؤه مفروشة بالرمل، أما الآن فالمساجد فيها الفرش، فلا أثر للخط، إلا إذا كان الإنسان في الصحراء أو نحو ذلك.", "ونقل النووي عن الغزالي والبغوي وغيرهما: أن المصلي إذا لم يجد شاخصاً بسط مصلاه، فهذا فيه قياس فراش المصلي على الخط؛ بأن تكون نهاية السجادة من أمامه سترة له، ومحل ذلك ما لم تطل السجادة من أمامه، وإلا فلا تصلح أن تكون سترة، والله أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق إسماعيل بن أمية، حدثني أبو عمرو بن محمد بن حريث، أنه سمع جده حريثاً يحدث عن أبي هريرة رضي الله عنه … فذكره.", "وهذا الحديث اختلف العلماء في تصحيحه، فقد صححه قوم، وضعفه آخرون، فممن ضعفه: سفيان بن عيينة، فقد نقل عنه أبو داود أنه قال: (لم نجد شيئا نشد به هذا الحديث، ولم يجئإلا من هذا الوجه)، أي: فهو حديث غريب، وقال الدارقطني: (الحديث لا يثبت) وضعفه - أيضاً - العراقي، وابن الصلاح - ومثلا به للحديث المضطرب ـ، وكذا ابن حزم، والنووي، والبغوي وجماعة آخرون، قال السخاوي: (حكم غير واحد من الحفاظ … باضطراب سنده، بل عزاه النووي للحفاظ).", "وسبب ضعفه ثلاث علل:", "الأولى: تفرد إسماعيل بن أمية به، كما تقدم عن ابن عيينة ومن وافقه.", "الثانية: أن إسماعيل بن أمية قد اضطرب في اسم شيخه، وفي كنيته، وهل روايته عن أبيه أو عن جده أو عن أبي هريرة بلا واسطة؟ فإنه مرة قال: عن أبي محمد بن عمرو بن حريث، عن جده، ومرة قال: عن أبي عمرو بن محمد بن حريث، عن جده، وقال ثالثة: عن أبي عمرو بن حريث، عن أبيه.", "العلة الثالثة: جهالة حال أبي عمرو بن محمد بن حريث، فقد جهله أبو جعفر الطحاوي والذهبي وابن حجر وغيرهم، وكذا جهالة جده حريث.", "وصحح الحديث جماعة آخرون منهم: ابن خزيمة وابن حبان وابن عبد البر، ونقل تصحيحه عن الإمام أحمد، وعلي بن المديني ونقل ذلك عنهما - أيضا - عبد الحق الإشبيلي كما صححه البيهقي، وحسنه الحافظ ابن حجر، قال ابن رجب (وأحمد لم يعرف عنه التصريح بصحته، إنما مذهبه العمل بالخط، وقد يكون اعتمد على الآثار الموقوفة، لا على الحديث المرفوع؛ فإنه قال في رواية ابن القاسم: الحديث في الخط ضعيف).", "وقد أجاب ابن حجر وغيره عن المطاعن التي وجهت إلى الحديث بما يلي:", "أما ما أعل به من تفرد إسماعيل بن أمية فهذا فيه نظر، فإن للحديث طرقاً أخرى وهي وإن كانت ضعيفة لكن تعددها يجعلها صالحة للاعتبار؛ لأن بعضها يشد بعضاً؛ لأنه ضعف ليس بشديد، فيزول بتعدد الطرق، كما هي قاعدة المحدثين. وأما العلة الثانية: وهي الاضطراب فقد نفاها الحافظ ابن حجر معللا بأن الاضطراب هو الاختلاف الذي يؤثر قدحا، واختلاف الرواة في اسم رجل أو في كنيته، وهل روايته عن أبيه أو عن جده؟ لا يؤثر في ذلك؛ لأن ذلك الرجل إن كان ثقة فلا ضير، وإن كان غير ثقة فضعف الحديث إنما هو من قبل ضعفه، لا من قبل الاختلاف في اسمه، ولذا قال في «البلوغ»: (ولم يصب من زعم أنه مضطرب)، وكأنه يعني العراقي وابن الصلاح فإنهما قد مثلا به للمضطرب - كما تقدم ـ، وقد نقل السيوطي عن الحافظ أنه انتقد التمثيل بمثل هذا الحديث للمضطرب!", "ثم إن ابن خزيمة رجح إسناد: إسماعيل بن أمية، عن أبي عمرو بن محمد بن حريث، عن جده حريث، عن أبي هريرة.", "وأما العلة الثالثة: وهي جهالة أبي عمرو بن محمد بن حريث، فإن أريد بها جهالة العين - وهو الغالب عند الإطلاق - فذلك مرتفع عنه؛ لأنه روى عنه إسماعيل بن أمية، وإبراهيم بن محمد بن أبي يحيى الأسلمي المدني، وزاد ابن حبان: ابن جريج، وابن أبي محمد، وبرواية اثنين تنتفي الجهالة، فكيف برواية أكثر من ذلك؟", "وإن أريد بذلك جهالة الحال، فالظاهر أنها مرتفعة - أيضا - لأن ابن حبان ذكره في «الثقات» وخرج حديثه في «صحيحه»، وكذا صححه ابن خزيمة والحاكم، قال ابن حجر: (وذلك مقتضى ثبوت عدالته عند من صححه)، يعني بذلك أن تصحيح حديثه تعديل له.", "والذي يظهر - والله أعلم - أن الحديث ضعيف، وما أجيب به عنه فهو غير ناهض، ويكفي في الحكم عليه كلام المتقدمين ومن بعدهم أمثال ابن عيينة، والدارقطني، وابن حزم، والعراقي … ومعلوم أن المصلي لا يلجأ إلى الخط في الغالب إلا عند عدم غيره مما يصلح سترة، فالعمل بالحديث أقل أحوال الاستطاعة، والله تعالى يقول: {فاتقوا الله ما استطعتم} [التغابن: ١6]، ولذا قال النووي: (والمختار استحباب الخط؛ لأنه وإن لم يثبت الحديث ففيه تحصيل حريم للمصلي..)."]}, "67": {"m": "وَعَنْ سَهْلِ بْنِ أَبِي حَثْمَةَ رضي الله عنه، يَبَْلُغُ بِهِ النّبَِيّ صلى الله عليه وسلم قَالَ: «إِذَا صَلّى أَحَدُكُمْ إِلَى سُتْرَةٍ فَلْيَدْنُ مِنْهَا؛ لَا يَقْطَعُ الشّيْطَانُ عَلَيْهِ صَلاتَهُ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ، وَالنّسَائِيُّ، وَ ابْنُ حِبّانَ. وَهُوَ حَدِيثٌ مُخْتَلَفٌ فِي إِسْنَادِهِ، وَرُوِيَ مُرْسَلا.", "w": ["قوله: (يبلغ به النبي ﷺ)؛ أي: يرفع الحديث إلى النبي ﷺ. وهذا سياق أبي داود، وعند النسائي: عن سهل بن أبي حثمة، قال: قال رسول الله ﷺ... الحديث.", "قوله: (إلى سترة) بالضم ما يُستتر به مطلقاً، ثم غلب إطلاقها عند الفقهاء على ما ينصبه المصلي أمامه لمنع المرور بين يديه مثل العصا أو نحو ذلك من شجرة أو دابة أو سارية وغيرها.", "قوله: (فليدنُ منها) هو أمر من الدنو وهو القرب من السترة، وهو بمقدار مكان السجود، وهكذا بين الصف الأول والذي يليه، والأمر للندب عند الجمهور، وحمله ابن حزم على الوجوب.", "قوله: (لا يقطع الشيطان عليه صلاته) برفع المضارع، على أن الجملة مستأنفة، وهي في قوة التعليل؛ أي: لئلا يقطع الشيطان عليه صلاته، وضبطه بعض الشراح بالجزم على أنه جواب الأمر، وحُرِّكَ بالكسر لالتقاء الساكنين، والضمير في", "قوله: «عليه» يعود على قوله: «أحدكم». والمراد بالشيطان: شيطان الجن، لا شيطان الإنس على القول الأظهر؛ لأن الشيطان يطلق حقيقة على الجن ومجازاً على الإنس، ولأن الرسول ﷺ أخبر أنه يقطع الصلاة. أما شيطان الإنس، فلم يرد ما يدل على أنه يقطع الصلاة إلا ما ورد في المرأة البالغة."], "s": ["أ- الحديث دليل على مشروعية القرب من السترة، قال البغوي: (والعمل على هذا عند أهل العلم، استحبوا الدنو من السترة، بحيث يكون بينه وبينها قدر إمكان السجود، وكذلك بين الصفين).", "ب- أن القرب من السترة يحفظ على المصلي صلاته؛ لقوله: «لا يقطع الشيطان عليه صلاته»، وهذا يدل على أن الشيطان يمر بين المصلي وسترته في حالة عدم الدنو منها. والشيطان من الجن لا يراه الإنس، قال تعالى: ﴿إِنَّهۥُ يَرََٰىكُمۡ هُوَ وَقَبِيلُهۥُ مِنۡ حَيۡثُ لا تَرَوَۡنهُمۡ﴾ [الأعراف: ٢7]، ولو كان الإنس يرونه لدفعه الإنسي عن صلاته، ولكن أمر النبي ﷺ بما يحفظ صلاته منه. قال الشوكاني في «تفسيره»: (هذه الجملة تعليل لما قبلها، مع ما تتضمنه من المبالغة في تحذيرهم منه؛ لأن من كان بهذه المثابة يرى بني آدم من حيث لا يرونه، كان عظيم الكيد، وكان حقيقاً بأن يحترس منه أبلغ الاحتراس، و«قبيله» أعوانه من الشياطين وجنوده)، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق سفيان بن عيينة، عن صفوان بن سليم، عن نافع بن جبير، عن سهل بن أبي حثمة يبلغ به النبي ﷺ قال:... وذكر الحديث. وهذا الحديث إسناده صحيح، رجاله ثقات، قال الحافظ العقيلي: (هو ثابت). وقال البيهقي: (قد أقام إسناده سفيان بن عيينة، وهو حافظ حجة)، وحسَّنه ابن عبد البر في «التمهيد»، ونقله عنه عبد الحق في «الأحكام الوسطى»، لكن حصل في إسناده اختلاف ـ كما قال أبو داود ـ فقد رواه عبد بن حميد في «المنتخب» (٤٤6)، والبيهقي (٢7٢/٢) من طريق يزيد بن هارون، عن شعبة، عن واقد بن محمد، عن صفوان بن سليم، عن محمد بن سهل، عن أبيه، أو عن محمد بن سهل، عن النبي ﷺ.", "وهذا مرسل أو منقطع؛ لأنه إن كان عن محمد بن سهل فهو مرسل؛ لأنه تابعي، وإن كان عن سهل فهو منقطع؛ لأن صفوان بن سليم لم يسمع من سهل، وعلى تقدير ذلك فلا يدخل بهذا السند في ذلك. ذكر هذا الحافظ ابن حجر، وقد أشار أبو داود إلى هذا الإسناد، والظاهر أن المراد بسهل هو ابن أبي حثمة، وقد جزم الحافظ بذلك في «الإصابة»، ولكن يشكل على هذا أن الحديث أخرجه عبد بن حميد ـ كما تقدم ـ من حديث سهل بن سعد الساعدي، وجزم أبو نعيم بأنه سهل بن حنيف. ورواه عبد الرزاق والبيهقي من طريق ابن وهب، كلاهما (عبد الرزاق وابن وهب) عن داود بن قيس، عن نافع بن جبير مرسلاً. وأما ما قبله، فهو معضل إلا إن كان فيه اختصار، وفيه أوجه أخرى من الاختلاف لا داعي لذكرها.", "والصحيح هو الوجه الأول، وهي رواية الجماعة عن سفيان بن عيينة بالوصل. أما جعله عن سفيان، عن صفوان مرسلاً، فلعله تقصير من بعض الرواة، بدليل أن عبد الرزاق قد رواه بالوجهين: الوصل والإرسال. وهذا الاختلاف لا يضر في صحة الحديث، كما تقدم، وله شاهد من حديث أبي سعيد وغيره، وقد قال الميموني لأحمد: كيف إسناد حديث: «إذا صلى أحدكم إلى سترة، فليَدنُ من سترته»؟ قال: صالح، ليس بإسناده بأس، فإن كان المقصود حديث الباب فهو دليل على أن الإمام أحمد يرى صحته موصولاً، وإن كان المقصود حديث أبي سعيد أو غيره، فهو تقوية لحديث الباب."]}, "68": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: «نُهِيَ أَنْ يُصَلِيَ الرّجُلُ مُخْتَصِرا» رَوَاهُ البُخَارِيُّ هَكَذَا. وَرَوَاهُ مُسْلِمٌ: «نَهَى رَسُولُ اللَّهِ صلى الله عليه وسلم».", "w": ["قوله: (الرجل) لا مفهوم له، فالمرأة مثله.", "قوله: (مختصرا)، اسم فاعل من (اختصر) الرجل فهو مختصر: إذا وضع يده على خاصرته، والخاصرة من الإنسان هي ما بين الورك وأسفل الأضلاع، قال النووي: (هذا هو الذي عليه المحققون والأكثرون من أهل اللغة والغريب والحديث …). وقد ورد هذا التفسير عن ابن سيرين، أحد رواة الحديث، ونقله عنه الحافظ في «فتح الباري» وذكره هنا، ولعله ذكره ونص عليه بهذا المعنى، لورود الاختلاف في معناه، كما ذكره الشراح، فقد قيل: إن معناه: قراءة آية أو آيتين من أخر السورة، يكتفي بذلك عن السورة، وقيل: أن يحذف الآية التي فيها السجدة إذا مر بها في الصلاة لئلا يسجد، وقيل: أن يتوكأ على عصا، وقيل غير ذلك."], "s": ["أ- الحديث دليل على نهي المصلي أن يضع يديه على خاصرتيه، وهذا النهي عند الجمهور للتنزيه، قالوا: ولا تبطل به الصلاة، وهو قول فقهاء الحنابلة والشافعية وغيرهم.", "ب- الحديث دليل على أن الحكمة من النهي عن الاختصار هي الابتعاد عن مشابهة اليهود، فإنهم يضعون أيديهم على خواصرهم في الصلاة، وهذا هو الذي ينبغي أن يعول عليه في حكمة النهي عن الاختصار في الصلاة، وأما ما قيل: إنه فعل الشيطان، أو أن إبليس أهبط من الجنة كذلك، فهي علل لا تقف أمام ما ورد عن الصحابي الذي هو أعرف بسبب الحديث، ويحتمل أن يكون ذلك مرفوعاً.", "وقد دلت السنة على أن المصلي يضع يده اليمنى على اليسرى فوق السرة أو عليها أو تحتها، وقد تقدم."]}, "69": {"m": "وَعَنْهُ [أي: أنس] رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إَِذَا كَانَ أَحَدُكُمْ فِي الصّلاةِ فَإِنّهُ يُنَاجِي رََبّهُ؛ فَلا يَبْزُقَنّ بَيْنَ يَدَيْهِ وََلَا عَنْ يَمِينِهِ، وَلَكِنْ عَنْ شِمَالِهِ تَحْتَ قَدَمِهِ» مُتّفَقٌ عَلَيْهِ أيْضا. وَفِي لَفْظٍ لِلْبُخَارِي:ِ «عَنْ يَسَارِهِ أوْ تَحْتَ قَدَمِهِ».", "w": ["قوله: (فإنه يناجي ربه) أصل المناجاة: المسارة، تقول: ناجيته أي: ساررته، والاسم النجوى، والمراد هنا: الإقبال على الله تعالى، فالمصلي يناجي ربه بذكره ودعائه وتلاوة آياته، فاللائق به الخشوع والإقبال على ربه.", "وقد علل النهي في هذا الحديث عن البصاق أمامه بكونه مناجيا لل، وفي حديث ابن عمر رضي الله عنهما: (.. بأن الله قبل وجهه إذا صلى)، أي: مواجهه، ولا منافات بين ذلك لأن المراد إقبال الله تعالى على عبده في أثناء صلاته.", "قوله: (فلا يبزقن). يقال: بزق يبزق بزاقا من باب «قتل» وهو بمعنى بصق، وهو إبدال منه، قال الأزهري: (البصق والبزق والبسق واحد)، والبزق: لفظ ماء الفم، وما دام فيه فهو ريق.", "قوله: (فلا يبزقن بين يديه) أي أمامه، وقد جاء في رواية للبخاري: (فإن ربه بينه وبين القبلة). وفي حديث ابن عمر رضي الله عنهما: (فإن الله قبل وجهه إذا صلى).", "ولا يبصق عن يمينه، لما ورد عند البخاري من حديث أبي هريرة رضي الله عنه: (ولا عن يمينه فإن عن يمينه ملكا)، وهذا التعليل بشقيه يفيد أن المصلي لا يبصق أمامه ولا عن يمينه مطلقا، لا في المسجد ولا في غيره، كما سيأتي، فإن قيل: إن مقتضى التعليل بكونه عن يمينه ملكا يقتضي ألا يبصق عن يساره، لأن عن يساره ملكا، لقوله تعالى: {عن اليمين وعن الشمال قعيد} [ق: ١7]. فالجواب:", "١ - أن المصلي لا يبصق في الصلاة إلا عند الحاجة، وعليه أن يبصق في ثوبه ما استطاع.", "٢ - أنه إذا بصق تحت قدمه اليسرى لم يبصق في جهة الملك.", "٣ - أن الملك المقيم في جهة اليمين أشرف من المقيم في جهة الشمال، فاحترم بما لم يحترم به غيره، وقيل غير ذلك، والله أعلم.", "قوله: (ولكن عن شماله تحت قدمه) أي: اليسرى، كما في رواية البخاري، وكذا جاء في حديث أبي سعيد رضي الله عنه. والمعنى: أنه إذا بدره البصاق فإنه لا يبصق عن يمينه، ولكن عن شماله تحت قدمه اليسرى، وهذا إذا كان الإنسان خارج المسجد، كأن يصلي في بيته في أرض غير مفروشة أو في الصحراء، وأما في المسجد فلا يبصق تحت قدمه، وإنما في ثوبه أو منديله، كما سيأتي.", "وفي رواية: (ولكن عن يساره أو تحت قدمه) والظاهر أن المصنف ذكر هذه الرواية لأنها أعم من قوله: (ولكن عن شماله تحت قدمه) لأن الرواية المذكورة تشمل ما تحت القدم وغير ذلك من جهة اليسار، فإن الظاهر أن (أو) للإباحة أو التخيير، ففي أيهما بصق لم يكن به بأس.", "أما رواية (ولكن عن شماله تحت قدمه) فهي مقيدة، فهي أخص، ويرى القرطبي أن الرواية الأولى ترجع إلى الرواية الثانية. ثم إن قوله: (عن يساره) مطلق، لكنه محمول على ما إذا كانت جهة يساره خالية من المصلين، لما ورد في حديث طارق بن عبد الله المحاربي رضي الله عنه قال: (قال رسول الله صلى الله عليه وسلم: «إذا قام أحدكم إلى الصلاة أو إذا صلى أحدكم فلا يبزقن أمامه، ولا عن يمينه، ولكن تلقاء يساره إن كان فارغا أو تحت قدمه»).", "وفي بعض طرق حديث أبي هريرة رضي الله عنه: (… فإذا تنخع أحدكم فليتنخع عن يساره تحت قدمه، فإن لم يجد فليقل هكذا، ووصف القاسم - أحد رواته - فتفل في ثوبه ثم مسح بعضه على بعض).", "الوجه الثالث: الحديث دليل على نهي المصلي عن البصاق بين يديه، وعن يمينه، سواء أكان ذلك في المسجد أم خارج المسجد، لما تقدم من التعليل من أن الله تعالى قبل وجه المصلي وأنه يناجي ربه وأن عن يمينه ملكا.", "والظاهر أن النهي للتحريم، لأن النبي صلى الله عليه وسلم غضب لما رأى البصاق في جهة القبلة، ونهى وبين علة النهي. فإذا اضطر الإنسان إلى البصاق وهو يصلي فإنه يبصق عن يساره، أو تحت قدمه اليسرى إذا كان يصلي في صحراء، أو في مكان في بيته فيه تراب.", "الوجه الخامس: الحديث دليل على أن الله تعالى قبل وجه المصلي، أي: مواجهه مواجهة تليق بالل تعالى، ولا يلزم من ذلك أنه سبحانه مختلط بخلقه، فهو تعالى فوق سمواته مستو على عرشه، وهو قريب من خلقه، ومحيط بهم، فالنصوص جمعت بين كون الله تعالى قبل وجه المصلي، وأنه على عرشه، والنصوص لا تجمع بين متناقضين بحال، لأن ذلك محال، يقول شيخ الإسلام ابن تيمية: (إن الحديث حق على ظاهره، وهو سبحانه فوق العرش، وهو قبل وجه المصلي، بل هذا الوصف يثبت للمخلوق، فإن الإنسان لو أنه يناجي السماء أو يناجي الشمس والقمر لكانت السماء والشمس والقمر فوقه، وكانت - أيضا - قبل وجهه)، والمعنى: أنه إذا كان هذا ممكنا في المخلوق، ففي الخالق أولى بلا شك، والنص إذا كان محتملا وجب أن يفسر بما يوافق النصوص المحكمة الصريحة، والواجب على المسلم أن يؤمن بهذه النصوص ولا يسأل عن كيفيتها، والله تعالى أعلم."]}, "70": {"m": "وَعَنْ مُعَيْقِيبٍ - وَهُوَ ابْنُ أَبِي فَاطِمَةَ الدّوْسِيُّ - رضي الله عنه قَالَ: «ذَكَرَ النّبِيُّ صلى الله عليه وسلم المَسْحَ فِي المَسْجِدِ - يَعْنِي: الحَصَ ى -؛ قَالَ: إِنْ كُنْتَ لَا بُدّ فَاعِلا؛ فَوَاحِدَةا» مُتّفَقٌ عَلَيْهِ.", "s": ["أ-الحديث دليل على أنه لا ينبغي للمصلي أن يمسح موضع سجوده من الأرض، بل عليه أن يقبل على صلاته ويخشع فيها، فيسجد على الأرض بدون مسح.", "لكن إن كان هناك حاجة لتسوية موضع السجود وهو التراب أو الحص ى فليكن ذلك مرة واحدة، وقد أخرج مالك بإسناد صحيح عن أبي جعفر القارئ أنه قال: (رأيت عبد الله بن عمر إذا أهوى ليسجد مسح الحصباء لموضع جبهته مسحاً خفيفاً)، فإن سوى ذلك قبل دخوله في الصلاة فهو أفضل، لئلا يحتاج ذلك أثناء الصلاة، ولئلا ينشغل باله في الصلاة.", "ب- جاء في حديث أبي ذر رضي الله عنه مرفوعاً: «إذا قام أحدكم في الصلاة فلا يمسح الحص ى؛ فإن الرحمة تواجهه» ويدل ذلك على أن حكمة النهي عن مسح الحص ى أن الرحمة تكون تلقاء وجهه، والحديث فيه مقال، وقيل: إن علة ذلك المحافظة على الخشوع والبعد عن العبث، ولا مانع من إرادة الأمرين، ويدخل في ذلك كراهة مسح الجبهة والأنف أثناء الصلاة، فإنه من العبث وعدم الخشوع، لأن الاستغراق في الصلاة والخشوع فيها ينسي ذلك ويشغل عنه، وقد قال صلى الله عليه وسلم: «إن في الصلاة لشغلاً»، قال القاضي عياض: (كره السلف مسح الجبهة في الصلاة وقبل الانصراف مما يتعلق بها من الأرض). وقد سجد النبي صلى الله عليه وسلم في ماء وطين وبقي أثر ذلك في جبهته، ولم يكن ينشغل في كل رفع من السجود بإزالة ما علق، فإقبال المصلي على صلاته وعنايته بها ينسي ذلك، والله المستعان."]}, "71": {"m": "وَعَنْ أَبِْي هُرَْيْرَةَ رضي اللهَ عنه، عَنِ النّبِيِ صلى الله عليه وسلم قَالَ: «أَمَا يَخْشَى أَحَدُكُمْ إِذَا رَفَعَ رأَْسَهُ قَبْلَ الإِمَامِ أَنْ يَجْعَلَ اللَّهُ رأَسَهُ رأَسَ حِمَارٍ- أوْ يَجْعَلَ صُورََتهُ صُورَةَ حِمَارٍ-؟!» مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (إذا رفع رأسه قبل الإمام) زاد ابن خزيمة من رواية أحمد بن عبدة، عن حماد بن زيد، عن محمد بن زياد: «في صلاته»، وهي إن ثبتت تفيد أن المسابقة المنهي عنها عامة في جميع أجزاء الصلاة، وليست خاصة بالسجود، والركوع ملحق به، ويؤيد العموم حديث أنس؛ أن النبي ﷺ قال: «أيها الناس إني إمامكم، فلا تسبقوني بالركوع، ولا بالسجود، ولا بالقيام، ولا بالانصراف...».", "قوله: (أن يجعل الله رأسه رأس حمار) وهذا لفظ البخاري، ولفظ مسلم: «أن يحول الله رأسه رأس حمار» من التحويل؛ أي: يصيّر،. و(رأسه) مفعول أول، و(رأس حمار) مفعول ثان لـ(جعل) التي هي من باب (ظن). وهذا التحويل إما أن يُحمل على حقيقته؛ بأن ينقلب رأسه إلى رأس الحمار حساً، وإما أن يُحمل على المعنى المجازي بأن يكون كرأس الحمار في البلادة، ويؤيد هذا أن التحويل لم يقع مع كثرة الفاعلين. لكن ليس في الحديث ما يدل على أنه يقع ولابد، وإنما يدل على أن فاعل هذا متعرض للوعيد، ولا يلزم من التعرض للشيء وقوع ذلك الشيء.", "قوله: (أو يجعل صورته صورة حمار) بالشك من الراوي وهو شعبة؛ لأنه قد رواه عدد من الرواة عن محمد بن زياد بغير تردد، فقد رواه الطيالسي عن حماد بن سلمة بلفظ (رأس)، وكذا رواه حماد بن زيد عند مسلم، وابن خزيمة، ورواه مسلم ـ أيضاً ـ عن يونس بن عبيد بلفظ (صورة)، ورواه ـ أيضاً ـ عن الربيع بن مسلم بلفظ (وجه). والظاهر أنه من تصرف الرواة، ورواية (رأس) هي المعتمدة؛ لأن رواتها أكثر، وهي أشمل، وخص وقوع الوعيد على الرأس؛ لأنه به وقعت الجناية. والفرق بين هذه الجملة والجملة السابقة أن هذه عامة في الجسد كله، والأولى خاصة في جزء منه، وهو الرأس."], "s": ["أ- الحديث دليل على تحريم مسابقة الإمام، بأن يرفع المأموم رأسه من الركوع أو السجود قبل الإمام، ويقاس على ذلك سبقه إلى الركوع أو السجود. ومأخذ التحريم أنه توعَّد على هذه المسابقة بالمسخ، والمسخ أشد أنواع العقوبات، ولذا فالمسابقة من كبائر الذنوب؛ لأنه رتب عليها هذا الوعيد الشديد. والجمهور على أن فاعل ذلك يأثم، وتجزئ صلاته، وروي عن ابن عمر أن صلاته باطلة، وهو رواية عن الإمام أحمد، وهو قول الظاهرية. بناءً على أن النهي يقتضي الفساد، ولأنه لو كانت له صلاة لَرُجِيَ له الثواب ولم يُخش عليه العقاب.", "ب- أن الذي يرفع رأسه قبل الإمام قد عرض نفسه لتحويل صورته أو رأسه إلى صورة حمار أو رأسه. قال ابن رجب: (وإنما اختص الحمار بالذكر دون سائر الحيوانات على الرواية الصحيحة المشهورة ـ والله أعلم ـ لأن الحمار من أبلد الحيوانات وأجهلها، وبه يُضرب المثل في الجهل؛ ولهذا مثَّل اللهَ به عالم السوء الذي يحمل العلم ولا ينتفع به في قوله: ﴿مَثَلُ ٱلَّذِينَ حُمِّلُوا ٱلتَّوۡرََٰىةَ ثُمَّ لَمۡ يَحۡمِلُوهَا كَمَثَلِ ٱلۡحِمَارِ يَحۡمِلُ أسۡفَاراَۢ﴾ [الجمعة: 5]. فكذلك المتعبد بالجهل يشبه الحمار، فإن الحمار يحرِّك رأسه ويرفعه ويخفضه لغير معنى، فشبه من يرفع رأسه قبل إمامه بالحمار، وكذلك شُبِّه من يتكلم وإمامه يخطب بالحمار يحمل أسفاراً؛ لأنه لم ينتفع بسماع الذكر، فصار كالحمار في المعنى، والله أعلم).", "ج- أن الشيطان مسلَّط على الإنسان لإفساد صلاته، قولاً بالوسوسة حتى لا يدري كم صلى؟ وفعلاً بالتقدم على الإمام حتى يُخِلَّ بالاقتداء، فأما الوسوسة فدواؤها الذكر والإقبال على الصلاة. وأما التقدم، فعلَّته الاستعجال، ودواؤه أن يعلم أنه لا يُسلِّم قبل الإمام، فلم يستعجل بهذه الأفعال؟", "د- يُفهم من هذا الحديث أن المأموم يتابع إمامه، وتكون أفعاله بعد أفعال الإمام، وهو منهي عما يخالف ذلك، وتكون هذه المخالفة بواحد من أمور ثلاثة وهي: مسابقته، أو موافقته، أو التأخر عنه. أما الأمر الأول: وهو مسابقة الإمام، فمعناها أن يأتي بأفعال الصلاة قبل إمامه متعمداً؛ كأن يكبر قبله، أو يرفع قبله. وقد ورد عن أنس قال: صلَّى بنا رسول الله ﷺ ذات يوم، فلما قضى الصلاة أقبل علينا بوجهه، فقال: «أيها الناس، إني إمامكم، فلا تسبقوني بالركوع، ولا بالسجود، ولا بالقيام، ولا بالانصراف، فإني أراكم أمامي ومن خلفي...»، وإن كان ساهياً أو جاهلاً بالحكم فصلاته صحيحة، لكن عليه أن يرجع ليأتي بما سبق به إمامه بعد إمامه؛ لأنه فعله في غير محله. وأما الأمر الثاني: فهو الموافقة والمقارنة، ومعناها: أن يأتي بالأفعال مع إمامه فيكبر معه، ويركع معه، فإن كانت في تكبيرة الإحرام بأن كبر مع إمامه لم تنعقد صلاته؛ لأنه ائتم بمن لم تنعقد صلاته، وإن قارنه في غيرها؛ كركوع أو سجود فهي مكروهة، وصلاته صحيحة عند الشافعية وأكثر الحنابلة، ومن الحنابلة من أبطل الصلاة بذلك. وأما الأمر الثالث: فهو التخلف والتأخر عنه، فإن كان لعذر؛ كسهو، أو غفلة، أو ضعف في صوت إمامه، فإنه يأتي بما تخلف به ويتابع الإمام، إلا أن يصل الإمام إلى المكان الذي هو فيه، فإنه لا يأتي بما فاته، وإنما يستمر مع الإمام وتلغو هذه الركعة التي تخلف فيها، وتَحلُّ التي بعدها محلها، ويقضيها بعد سلام إمامه، وإن كان التخلف لغير عذر فصلاته باطلة، والله تعالى أعلم."]}, "72": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «سَأَلْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم عَنْ الَالْتِفَاتِ فِي الصّلاةِ، فَقَالَ: هُوَ اخْتِلاسٌ يَخْتَلِسُهُ الشّيْطَانُ مِنْ صَلاةِ العَبْدِ» رَوَاهُ البُخَارِيُّ.", "w": ["قولها: (عن الالتفات) هو تحويل الوجه عن القبلة يميناً أو شمالاً.", "قوله: (هو اختلاس)، مصدر اختلس الشيء أي: استلبه في خفية، واختطفه بسرعة عن غفلة، والمعنى: أن الالتفات انتقاص ينتقصه الشيطان من صلاة العبد على وجه السرعة والخفية، فاعتبر التفاتة المصلي وذهاب الخشوع عنه اختلاسة ينتقصها الشيطان من صلاة العبد، لأنه يفرح بإعراض المصلي عن صلاته."], "s": ["أ- الحديث دليل على أن المصلي منهي عن الالتفات في صلاته؛ لأنه وصف بأنه اختلاس يختلسه الشيطان من صلاة العبد، والمراد بذلك: التفاته بالوجه، فإن كان بجملة البدن بأن استدار إلى غير جهة القبلة حرم وبطلت الصلاة باتفاق العلماء. وحكمة النهي عن الالتفات ما يلي:", "١ - أنه نقص في الصلاة، لأنه دليل على عدم الخشوع، ولهذا ذكره المصنف هنا.", "٢ - أنه إعراض عن الله تعالى، وإقبال على غيره، والله تعالى قبل عبده.", "٣ - أنه حركة لا داعي لها، والأصل في الحركات أنها مكروهة مخلة بالخشوع.", "وقد نقل الحافظ ابن حجر الإجماع على أن الالتفات في الصلاة مكروه، والجمهور على أنها كراهة تنزيه، وحكي عن الظاهرية وبعض الشافعية التحريم، إلا للضرورة.", "والَالتفات في الصلاة نوعان:", "الأول: التفات القلب إلى غير الله عز وجل.", "الثاني: التفات البصر.", "وكلاهما منهي عنه، والالتفات لا يبطل الصلاة بهذه الصفة، ولكن ينبغي للمصلي أن يخشع في صلاته، ويصمد في وجهه إلى موضع سجوده، ويقبل على الله تعالى في صلاته، فلا يلتفت يميناً ولا شمالاً ولا يحقق مقاصد الشيطان.", "ب- إذا وجد حاجة للالتفات فلا بأس به، كترقب عدو أو سقوط شيء أو نحو ذلك، وقد ورد في حديث سهل بن سعد رضي الله عنه أن أبا بكر رضي الله عنه التفت في الصلاة حينما تقدم يصلي بالصحابة رضي الله عنهم، فجاء النبي صلى الله عليه وسلم ووقف خلفه، فأكثر الناس من التصفيق فالتفت. وهو حديث طويل.", "وعن سهل بن الحنظلية قال: ثوب بالصلاة - يعني صلاة الصبح - فجعل رسول الله صلى الله عليه وسلم يصلي وهو يلتفت إلى الشعب، قال أبو داود: (وكان أرسل فارساً إلى الشعب من الليل يحرس)، وهذا فيه بيان لسبب التفاته صلى الله عليه وسلم."]}, "73": {"m": "وَعَنْ أَنَسٍ رضي الله عنه قَالَ: «كَانَ قِرَامٌ لِعَائِشَةَ سَتَرَتْ بِهِ جَانِبَ بَيْتِهَا؛ فَقَالَ النّبِيُّ صلى الله عليه وسلم: أَمِيطِي عَنّا قِرَامَكِ هَذَا؛ فَإِنّهُ لَا تَزَالُ تَصَاوِيرُهُ تَعْرِضُ فِي صَلاتِي» رَوَاهُ البُخَارِيُّ.", "w": ["قوله: (قرام) بكسر القاف، هو ستر رقيق من صوف ذي ألوان.", "قوله: (أميطي) أمر من الفعل (أماط يميط) والثلاثي من باب «باع يبيع» أي: أزيلي.", "قوله: (تعرض لي في صلاتي) أي: تلوح وتظهر."], "s": ["أ- الحديث دليل على أنه ينبغي للمصلي أن يجتنب كل ما يشغله ويلهيه عن صلاته من نقوش أو تصاوير أو كتابات، لأن الصلاة يطلب فيها الخشوع بحضور القلب وسكون البدن، والإقبال على الله تعالى، ولهذا استحب العلماء أن ينظر المصلي إلى موضع سجوده ولا يتجاوزه، كما سيأتي إن شاء الله.", "قال ابن رجب: (في الحديث دليل على استحباب التباعد عن الأسباب الملهية عن الصلاة، ولهذا أخرج النبي صلى الله عليه وسلم تلك الخميصة عنه بالكلية، فينبغي لمن ألهاه شيء من الدنيا عن صلاته أن يخرجه عن ملكه).", "ب- الحديث دليل على أنه ينبغي أن تصان المساجد عما يشوش على المصلين من الزخرفة أو كتابات شيء من الآيات أو تعليق الساعات ونحو ذلك مما يكون في قبلة المصلي.", "قال الإمام مالك رحمه الله: (أكره أن يكتب في قبلة المسجد شيء من القرآن والتزويق). وقال: (إن ذلك يشغل المصلي)، وحكاه ابن رجب عن أحمد، ولا يفهم من كلام الإمام مالك أنه يرى جواز كتابة القرآن في غير جهة القبلة، وإنما خص القبلة لأنها أهم ما يشغل المصلي لكونه يستقبلها.", "وكذا فرش المسجد فينبغي العناية بها وأن تكون خالية من التصاوير والزخارف، لأن صور الصلبان والآدميين والحيوانات تكثر في الفرش التي تصنع للمساجد، فينبغي تركها وعدم شرائها، معاملة لصانعيها بنقيض قصدهم.", "ج- الحديث دليل على أنه لا يجوز تعليق الصور لا على الأبواب ولا على الجدران، بل يجب هتكها، سواء أكانت من صور بني آدم أم صور حيوانات من السباع أو الطيور ونحو ذلك، لأن هذه الصور فيها مشابهة لعباد الأصنام، وقد يفضي تعليقها إلى عبادتها من دون الله تعالى، كما وقع لقوم نوح ولليهود والنصارى، والله تعالى أعلم."]}, "74": {"m": "وَعَنْ عََائِشَةَ رضي الله عنها قَالَتْ: سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ: «لَا صَلاةَ بِحَضْرَةِ طَعَامٍ، وََلَا وَهُوَ يُدَافِعُهُ الأخْبَثَانِ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (لا صلاة) لا: نافية، والنفي هنا يتضمن النهي، أي: لا يصل إنسان، والنفي عند البلاغيين أبلغ من النهي؛ لأن فيه تقريرا لاجتنابه، كأنه أمر لا يمكن أن يكون، وتقدم ذلك في «المواقيت».", "والجمهور على أن هذا النفي نفي للكمال، وأنه يكره أن يصلي في هذه الحال، ولو صلى فصلاته صحيحة، قال الشيخ عبد العزيز بن باز: (وهذا أظهر)، لأن له نظائر، مثل: (لا إيمان لمن لا صبر له)، ومثل: (والله لا يؤمن من لا يأمن جاره بوائقه)، ونحو ذلك مما يراد به نفي الكمال، فهذا مثله.", "وقال بعض أهل العلم: إنه نفي للصحة، فلو صلى في هذه الحال فصلاته محرمة، فتكون باطلة، لأن الأصل في نفي الشرع أن يكون لنفي الصحة، وهذا هو قول الظاهرية.", "قوله: (بحضرة طعام) الباء للمصاحبة، أي: مع حضور طعام، والمراد به: وضعه وتقديمه للأكل.", "قوله: (ولا وهو يدافعه الأخبثان) أي: البول والغائط، وقد ورد التصريح بهما عند ابن حبان من حديث عائشة رضي الله عنها بالإسناد المذكور، ولفظه: (لا يقوم أحدكم إلى الصلاة، وهو بحضرة الطعام، ولا وهو يدافعه الأخبثان: الغائط والبول). ومعنى يدافعه: أنه يدفعهما عن الخروج، وهما يدفعانه عن الشغل بغيرهما ليخرجا."], "s": ["أ- الحديث دليل على النهي عن الصلاة حال حضور الطعام الذي يريد أكله، لما تقدم من أن الصلاة صلة بين العبد وربه، ولا يتم ذلك إلا بحضور القلب وتفريغه من الشواغل، فيقدم الطعام لتؤدى الصلاة بخشوع وحضور قلب، ولو فات أول الوقت أو فاتت الجماعة.", "وحضور الطعام قيد معتبر، فإن كان غير حاضر فلا تؤخر، إلا إن تيسر حضوره عن قرب، كأن توجد أمارات تقديمه، فلا يبعد أن يكون كالحاضر.", "وقال بعض العلماء: إذا كان الطعام غير حاضر ونفسه تتوق إليه فالحكم فيه كما لو حضره، لوجود المعنى، وهو ترك الخشوع.", "والأول أظهر، فإن الحضور قيد معتبر لا ينبغي إهداره، لأن حضور الطعام يوجب زيادة تشويق وتطلع إليه، فقد يكون الشارع اعتبر هذا الوصف وهو زيادة التشويق بسبب حضوره، فلا يلحق به ما لا يساويه للقاعدة الأصولية: أن محل النص إذا اشتمل على وصف يمكن أن يكون معتبرًا لم يلغ.", "ب- الحديث دليل على النهي عن الصلاة حال مدافعة البول والغائط، لأنه يكون مشغولاً بهما حتى ينتهي من صلاته ليفرغ منهما مع ما في ذلك من مضرة البدن، بل عليه أن يقضي حاجته ويتوضأ ولو فاتته الجماعة، لأن صلاته وحده بحضور قلب وخشوع أهم من صلاته مع الجماعة في حال مدافعة الأخبثين.", "أما إذا كان شيئاً يسيرًا لا يشغله، أو أحس بالبول والغائط ولم يصل إلى حد المدافعة فلا بأس في الصلاة، لأن المدافعة تقتضي أن هناك شدة بحيث إن البول والغائط يؤذيه تأخره.", "فإن ترتب على قضاء حاجته خروج الوقت فهل يصلي مع المدافعة أو يتوضأ ويصلي ولو خرج الوقت؟ قولَان:", "القول الأول: أنه يصلي ولو مع مدافعة الأخبثين حفاظاً على الوقت، ولا يجوز له تأخيرها؛ وهو قول الجمهور.", "القول الثاني: أنه يقضي حاجته ويصلي ولو خرج الوقت، وهو قول ابن حزم، وحكاه النووي عن بعض الشافعية، وهذا هو الأقرب إلى قواعد الشريعة وتيسيرها على المكلفين.", "ج- ألحق العلماء بمدافعة الأخبثين كل ما يشغل بال المصلي من ريح في جوفه، أو حر أو برد شديدين لا يخشع معهما، أو جوع أو عطش كذلك، لأن المعنى المراد موجود في الجميع، وهو حضور القلب وسكون الجوارح، والله أعلم."]}, "75": {"m": "وَرَوَى عَن جَابِرِ بنِ سَمُرَةََ رضي الله عنهمَا قَالَ: «أَبصَرَ رَسُولُ اللَّهَِّ صلى اللهَ عليه وسلم قَوماً رافِعِي أَبصَارِهِم إِلَى السَّمَاءِ وَهُم فِي الصَّلاةِ؛ فَقَالَ: لَيَنتَهِيَنَّ أقوَام يَرفَعُونَ أبصَارَهُم إِلَى السَّمَاءِ فِي الصَّلاةِ، أو لا تَرجِعُ إِلَيهِم».", "w": ["قوله: (لينتهين) مضارع مؤكد بالنون واللام الواقعة في جواب القسم المقدر، وذلك لتأكيد النهي، وهو خبر بمعنى الأمر.", "قوله: (أو لا ترجع إليهم) (أو) للتخيير المقصود به التهديد، والمعنى: ليكونن منهم الانتهاء عن رفع الأبصار أو خطف الأبصار عند الرفع فلا تعود إليهم."], "s": ["أ- الحديث دليل على تحريم رفع البصر إلى السماء حال الصلاة، سواء أكان ذلك في حال القيام أم في حال الرفع من الركوع أم غير ذلك، وكذا في حال الدعاء، كما في حديث أبي هريرة رضي الله عنه، لأن الرسول صلى الله عليه وسلم حذر من ذلك، واشتد قوله فيه، وذكر عقوبة من فعل ذلك، وهذا هو الراجح في حكم رفع البصر إلى السماء وهو التحريم، لأن مثل هذا الوعيد لا يكون إلا على محرم.", "وعن أنس رضي الله عنه قال: قال النبي صلى الله عليه وسلم: «ما بال أقوام يرفعون أبصارهم إلى السماء في صلاتهم؟!» فاشتد قوله في ذلك حتى قال: «لينتهن عن ذلك أو لتخطفن أبصارهم».", "والجمهور على أن ذلك لا يبطل الصلاة، وذهب ابن حزم الظاهري إلى بطلان صلاة من رفع بصره إلى السماء، بناء على أن النهي يقتضي الفساد والبطلان.", "وإنما نهي عن رفع البصر - والله أعلم - لأنه ينافي الخشوع والإقبال على الله تعالى، ولأنه إعراض عن القبلة، لأن القبلة ما يقابل الإنسان، لا ما يرفع إليه بصره؛ ولأنه خروج عن هيئة الصلاة، لأن الصلاة لها حالة معينة غير حالات الإنسان التي يعتادها في غير الصلاة.", "قال ابن رجب: (والمعنى في كراهة ذلك؛ خشوع المصلي وخفض بصره، ونظره إلى محل سجوده، فإنه واقف بين يدي الله عز وجل يناجيه، فينبغي أن يكون منكساً رأسه ومطرقاً إلى الأرض).", "ب- اختلف العلماء في رفع البصر خارج الصلاة حال الدعاء فكرهه أناس، وأجازه الأكثرون، كما قال الحافظ ابن حجر، لأن السماء قبلة الدعاء، كما أن الكعبة قبلة الصلاة. والراجح المنع؛ لأن قبلة الدعاء هي قبلة الصلاة؛ لوجوه ثلاثة:", "الأول: أن القول برفع البصر حال الدعاء لا دليل عليه، ولم يقل به أحد من سلف الأمة، وهذا من الأمور الشرعية، فلا يجوز أن يخفى على جميع سلف الأمة وعلمائها.", "الثاني: أن رسول الله صلى الله عليه وسلم كان يستقبل القبلة في دعائه، كما ثبت عنه ذلك في مواطن كثيرة، ففي حديث عبد الله بن زيد رضي الله عنه قال: (خرج النبي صلى الله عليه وسلم إلى هذا المصلى يستسقي، فدعا واستسقى، ثم استقبل القبلة)، وترجم له البخاري في كتاب «الدعوات» باب «الدعاء مستقبل القبلة».", "الثالث: أن القبلة هي ما يستقبله العابد بوجهه، كما تستقبل الكعبة في الصلاة والذكر والدعاء والذبح، وليست القبلة ما يرفع إليه البصر، ولا ما ترفع إليه الأيدي.", "ج- ذهب الجمهور من أهل العلم إلى أن المصلي ينظر إلى موضع سجوده، سواء أكان إماماً أم مأموماً أم منفرداً، إلا عند المالكية، فقالوا: إن المصلي ينظر أمامه، لا إلى موضع سجوده، مستدلين بقوله تعالى: {فول وجهك شطر المسجد الحرام} [البقرة: ١٤٤].", "ووجه الدلالة: أن المصلي مأمور بأن يولي وجهه شطر المسجد الحرام، وإذا نظر إلى موضع سجوده احتاج إلى نوع من الانحناء، والمنحني إلى موضع سجوده لم يول وجهه شطر المسجد الحرام.", "وقد استدل الجمهوربما يلي:", "١ - أن الله تعالى أثنى على المؤمنين ومدحهم بالخشوع في الصلاة، ومن صفات الخاشع أن ينظر إلى موضع سجوده، قال ابن تيمية: (إن خفض البصر من تمام الخشوع).", "٢ - حديث عائشة رضي الله عنها قالت: دخل رسول الله صلى الله عليه وسلم الكعبة وما خَلَّفَ بصرَه موضع سجوده حتى خرج منها.", "٣ - أنه ورد مراسيل عن ابن سيرين وعطاء وغيرهما أن أصحاب رسول الله صلى الله عليه وسلم كانوا يرفعون أبصارهم إلى السماء في الصلاة، فلما نزلت: {الذين هم في صلاتهم خاشعون} [المؤمنون: ٢] خفضوا أبصارهم إلى موضع سجودهم. وعن أبي قلابة الجرمي قال: حدثني عشرة من أصحاب رسول الله صلى الله عليه وسلم عن صلاة رسول الله صلى الله عليه وسلم في قيامه وركوعه وسجوده بنحو من صلاة أمير المؤمنين، يعني عمر بن عبد العزيز رحمه الله قال سليمان: فرمقت عمر في صلاته فكان بصره إلى موضع سجوده …، وذكر باقي الحديث.", "ويستثنى من ذلك حال التشهد فإن المصلي ينظر إلى سباحته، لحديث عبد الله بن الزبير في صفة صلاة النبي صلى الله عليه وسلم، وفيه: (وكان لا يجاوز بصره إشارته)، والله تعالى أعلم."]}, "76": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه أَنّ النّبِيّ صلى الله عليه وسلم قَالَ: «التّثَاؤُبُ فِي الصّلاةِ مِنَ الشّيْطَانِ، فَإِذَا تَثَاءَبَ أَحَدُكُمْ فَلْيَكْظِمْ مَا اسْتَطَاعَ» رَوَاهُ التِرْمِذِيُّ - وَصَحّحَهُ -. وَرَوَاهُ مُسْلِمٌ، وَلَمْ يَقُلْ: «فِي الصّلاةِ».", "w": ["قوله: (التثاؤب) هو حركة للفم ليست إرادية، وتكون هذه الحركة من كسل أو نوم.", "قوله: (من الشيطان) جعله من الشيطان كراهية له، لأنه يكون مع ثقل البدن وامتلائه واسترخائه وميله إلى الكسل والنوم، فأضيف إليه، لأنه الداعي إلى إعطاء النفس شهواتها وتوسعها في المآكل والمشارب.", "قوله: (فليكظم) أي: ليحبسه وليمسكه، والكظم: سد الفم بإطباق الشفتين، وقد ورد في حديث أبي هريرة رضي الله عنه: (فليرده ما استطاع) فإما أن المراد الأخذ بأسباب رده، لا أنه يرده إذا وقع، أو أن المراد: إذا أراد أن يتثاءب فليرده."], "s": ["أ- الحديث دليل على أنه ينبغي للمتثائب أن يرد تثاؤبه ما استطاع، وذلك بإطباق فمه وضم شفتيه.", "وهذا هو الأمرالأول المشروع الذي دلت عليه السنة، ودليله حديث الباب.", "والأمرالثاني: أن يضع يده على فيه، لأن فغر الفم شيء مستقبح، وربما وقع في فمه شيئكذباب ونحوه، وقد دل على ذلك حديث أبي سعيد الخدري رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إذا تثاءب أحدكم فليمسك بيده على فيه، فإن الشيطان يدخل»، والأفضل أن تكون اليد اليسرى، لأنه في أمر مستقذر.", "فأمر بوضع يده على فمه لئلا يبلغ الشيطان مراده من تشويه صورته ودخوله فمه، وضحكه منه، وفي حديث أبي هريرة رضي الله عنه: (… فإن أحدكم إذا تثاءب ضحك منه الشيطان).", "والأمر الثالث: أن يلزم الصمت، ولا يقول: (ها) لأنه صوت مستقبح، ليس بواضح، فالسنة ألا يتكلم في هذه الحال حتى ينتهي التثاؤب.", "وقد دل على ذلك حديث أبي هريرة رضي الله عنه، عن النبي صلى الله عليه وسلم قال: «التثاؤب من الشيطان، فإذا تثاءب أحدكم فليرده ما استطاع، فإن أحدكم إذا قال: ها، ضحك الشيطان»، فهذه أمور ثلاثة دلت عليها السنة، وأما ما يفعله بعض الناس من الاستعاذة من الشيطان ظناً منهم أنه مستحب، فهذا لا أصل له، ولو كان مشروعاً لجاء النقل فيه عن النبي صلى الله عليه وسلم، كما نقل في هذه الأمور الثلاثة، بل إن بعضهم يقصر في هذه الأمور المشروعة، ويأتي بأمر غير مشروع، والله المستعان.", "ب- تبين من أحاديث التثاؤب أن بعضها مطلق وبعضها مقيد في حالة الصلاة، كما في رواية الترمذي، والظاهر أن التثاؤب مكروه مطلقاً لأنه من الشيطان، لكن كراهته في حال الصلاة أشد، لأن للشيطان غرضاً قوياً في التشويش على المصلي وإذهاب خشوعه، وحالة الصلاة أولى بدفع التثاؤب، لبعده عن الخشوع وأدب الصلاة، وللخروج عن اعتدال الهيئة واعوجاج الخلقة، فيتأكد في حق المصلي دفعه ما استطاع، فإن غلبه وضع يده على فيه، وعليه أن يمسك عن القراءة حتى يذهب عنه، لئلا يتغير نظم القرآن، وكذلك إذا كان يقرأ خارج الصلاة، والله تعالى أعلم.", "* * *", "السهو في الشيء: تركه عن غير علم، والسهو عنه: تركه مع العلم، ومنه قوله تعالى: {الذين هم عن صلاتهم ساهون})", "وسجود السهو: سجدتان يأتي بهما المصلي لجبر الخلل في صلاته سهوًا بزيادة أو نقصان أو شك.", "ومشروعية سجود السهو من محاسن هذه الشريعة، فإن النسيان لا يسلم منه أحد، ولا بد من وقوعه في هذه العبادة العظيمة، وقد وقع من النبي صلى الله عليه وسلم، ففيه جبر للنقصان الذي حصل في الصلاة، وفيه إرضاء للرحمن بإتمام عبادته وتدارك طاعته، وفيه إرغام للشيطان الذي هو سبب النسيان والسهو، وقد أشار النبي صلى الله عليه وسلم إلى ذلك في حديث أبي سعيد رضي الله عنه كما سيأتي إن شاء الله."], "t": ["فقد أخرجه مسلم (٢99٤) في كتاب «الزهد والرقائق»، باب «تشميت العاطس وكراهة التثاؤب»، من طريق إسماعيل بن جعفر، عن العلاء، عن أبيه، عن أبي هريرة رضي الله عنه به. وأخرجه الترمذي (٣70) بالإسناد نفسه، ولفظه: (التثاؤب في الصلاة من الشيطان، فإذا تثاءب أحدكم فليكظم ما استطاع) وقال: (حديث حسن صحيح)."]}, "77": {"m": "عَنْ مُحََمّدِ بْنِ سِيرِينَ، عَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: «صَلّى النّبِيُّ صلى الله عليه وسلم إِحْدَى صَلاتَيِ العَشِيِ - قَالَ مُحَمّدٌ:َ وَأكْبَرُظَنِي: العَصْرُ- رَكْعَتَيْنِ، ثُمّ سَلّمَ. ثُمّ قَامَ إِلَى خَشَبَةٍ فِي مُقَدّمِ المَسْجِدِ فَوَضَعَ يَدَهُ عَلَيْهَا، وَفِيهِمْ أبُو بَكْرٍ وَعُمَرُ فَهَابَا أنْ يَُكَلِمَاهُ، وََخَرَجَ سَرَعَانُ النّاسِ، فَقَالُوا: قُصِرَتِ الصّلاةُ! وَرَجُلٌ يَدْعُوهُ النّبِيُّ صلى الله عليه وسلم ذَا اليَدَيْنِ، فَقَالَ: أنَسِيتََ أَمْ قُصِرَتْ؟ فَقَالَ: لَمْ أَنْسَ وَلَمْ تُقْصَرْ! قَالَ: بَلَى، قَدْ نَسِيتَ. فَصَلّى رَكَْعَتََيْنِ، ثُمّ سَلّمَ. ثُمّ كَبّرَ فَسَجَدَ مِثْلَ سُجُودِهِ أوْ أطْوَلَ، ثُمّ رَفَعَ رأَْسَهُ فَكَبّرَ، ثُمّ وَضَعَ رأَْسَهُ فَكَبّرَ. فَسَجَدَ مِثْلَ سُجُودِهِ أوْ أطْوَلَ، ثُمّ رَفَعَ رأَْسَهُ وَكَبّرَ» مُتّفَقٌ عَلَيْهِ، وَهَذَا لَفْظُ البُخَارِي.ِ وَفِي لَفْظٍ لَهُ فِي آخِرِهِ: «فَرُّبمَا سَأَلُوهُ: ثُمّ سَلّمَ؟ فَيَقُولُ: نُبِئْتُ أَنّ عِمْرَانَ بْنَ حُصَيْنٍ رضي الله عنهما قَالَ: ثُمّ سَلّمَ». وَفِي بَعْضِ رِوَ ايَاتِ مُسْلِمٍ: «صَلاةَ العَصْرِ» بِغَيْرِشَكٍ. وَرَوَاهُ أَبُودَاوُدَ، وَفِيهِ: «فَأَقْبَلَ رَسُولُ اللَّهِ صلى الله عليه وسلم عَلَى القَوْمِ، فَقَالَ: أَصَدَقَ ذُواليَدَيْنِ؟ فَأَوْمَؤُوا أَيْ: نَعَمْ». قَالَ أَبُو دَاوُدَ: «وَلَمْ يَذْكُرْ: (فَأَوْمَؤُوا) إِلَاّ حَمّادُ بْنُ زَيْدٍ». وَفِي رِوَ ايَةٍ لأَِبِي دَاوُدَ: «كَبّرَ، ثُمّ كَبّرَوَسَجَدَ»، وَ انْفَرَدَ بِهَا حَمّادُ بْنُ زَيْدٍ أَيْضا. وَفِي لَفْظٍ لَهُ قَالَ: «وَلَمْ يَسْجُدْ سَجْدَتَيِ السّهْوِ حَتّى يَقّنَهُ اللَّهُ ذَلِكَ».", "w": ["قوله: (ثم قام إلى خشبة) هي ما غلظ من العيدان، وفي رواية لمسلم: (ثم أتى جذعاً في قبلة المسجد).", "قوله: (فوضع يده عليها) في رواية (فاتكأ عليها كأنه غضبان) أي: يشبه الغضبان في انقباضه وتشوش فكره، وكأن هذا - والله أعلم - من أجل نقصان صلاته، أو أنه كان في حال صلاته مشغول البال بأمر أوجب له ذلك الغضب، وحمله على أن صلى ركعتين وسلم، ولعل الصحابة رضي الله عنهم عبروا بالغضب عما ظهر عليه، وإلا فلا موجب له في هذا الوقت.", "قوله: (فهابا أن يكلماه) الهيبة: إجلال ومخافة ناشئة عن إعظام، يقال: رجل مهيب ومهوب، أي: يهابه الناس، وإنما هاب أبو بكر وعمر تكليم النبي صلى الله عليه وسلم لشدة معرفتهما بعظمته وحقوقه، وقوة المعرفة توجب الهيبة.", "قوله: (وخرج سرعان الناس) بفتح السين والراء، هم الأوائل الذين يسرعون الخروج من المسجد بعد انقضاء الصلاة، ويجوز إسكان الراء، كما نقله القاضي عياض، ويجوز ضم السين وإسكان الراء، فيكون جمع سريع كقضيب وقضبان وكثيب وكثبان.", "قوله: (قصرت الصلاة) بضم القاف وكسر الصاد، بلفظ الخبر، أي: أن الله تعالى قصرها، على اعتقاد وقوع قصرها إلى ركعتين، لأنهم في زمان الوحي والنسخ، والذي في البخاري - هنا - (أقصرت الصلاة؟) بلفظ الاستفهام، أما لفظ الكتاب فهو رواية للبخاري من طريق ابن عون، عن ابن سيرين به، ويجوز في ضبطها فتح القاف وضم الصاد، كما ذكره النووي.", "قوله: (ذا اليدين) وفي رواية (يقال له: ذو اليدين)، وقد جاء في بعض روايات الصحيحين: (وفي القوم رجل في يديه طول، يقال له ذو اليدين …) والمشهور أنه الخرباق بن عمرو، وهو سلمي من بني سليم.", "قوله: (أنسيت أم قصرت؟) أي: أذهلت فسلمت قبل تمام الصلاة، أم أن الصلاة قصرت وردت إلى ركعتين؟", "فذو اليدين غلب عليه حرصه على تعلم العلم واعتنائه بأمر الصلاة، وأبو بكر وعمر غلب عليهما احترام النبي صلى الله عليه وسلم وتعظيمه، مع علمهما بأنه سيبين أمر ما وقع.", "قوله: (لم أنس ولم تقصر) نفى صلى الله عليه وسلم النسيان بناء على ظنه أنه أتم صلاته، ونفى القصر بناء على يقينه أن حكم إتمام الصلاة لم يتغير، فلما انتفى القصر عن يقين تعين أن يكون ناسياً، ولهذا قال ذو اليدين: بلى، قد نسيت.", "وظاهر هذا السياق أنه رجع إلى قول ذي اليدين وحده، لكن ورد روايات أخرى: (فقال: أكما يقول ذو اليدين؟ قالوا: نعم)، وفي رواية أبي داود المذكورة: (فقال: أصدق ذو اليدين؟)، وإنما لم يأخذ النبي صلى الله عليه وسلم بقول ذي اليدين، لأنه يعارض ما كان يظنه من إتمام الصلاة، فطلب النبي صلى الله عليه وسلم ما يرجح قوله.", "قوله: (ولم يسجد حتى يقنه الله ذلك) أي: لم يسجد صلى الله عليه وسلم سجدتي السهو حتى يقنه الله تعالى أنه سلم من ركعتين، إما بوحي أو بتذكيره إياه لما سأل القوم عما قاله ذو اليدين، وعلم أبو هريرة ذلك إما من قرائن الأحوال، أو بإخباره صلى الله عليه وسلم، وهذه زيادة منكرة، كما تقدم."], "s": ["أ- الحديث دليل على أن من سلم ناسياً قبل تمام صلاته ثم ذكر أو ذُكّرَ قريباً وجب عليه إتمامها فورًا، ولا يمنع من ذلك كلامه أو انتقاله من موضعه، لأن ذلك مبني على اعتقاده تمام صلاته، لقوله: (فقال: أصدق ذو اليدين؟؟ فقالوا: نعم) فهو كلام عمد، لكنه لإصلاح الصلاة.", "وأما رواية: (فأومأوا) فيحتمل أنها من تصرف بعض الرواة، لأنه ظن أنه لا يتكلم لأنه في صلاة، ورواية: (فقالوا) لا غرابة فيها، لأنهم ظنوا أن الصلاة قد انتهت أو أنهم تكلموا لمصلحتها.", "أما من يتيقن أن الإمام قد سها وأن الصلاة لم تتم فإنه يبقى في محل الجلوس ولا يتكلم ولا ينصرف.", "وهكذا لو زاد الإمام ونبهوه ولم يرجع فإنهم لا يتابعونه في الزيادة، بل يجلسون وينتظرون حتى يسلم بهم أو يسلمون قبله، والانتظار أحسن، كما قال شيخ الإسلام ابن تيمية، لكن الصحابة رضي الله عنهم التبس عليهم الأمر فخشوا أن يكون قد جاء تغيير في الحكم، فلذا سلموا معه وخرج من خرج، لأن الزمان زمن وحي ونسخ، وأما الآن فقد انتهى الأمر فلم يبق إلا السهو.", "ب- الحديث دليل على أن الإمام لا يرجع إلى قول واحد من المأمومين إذا كان يظن خلافه حتى يتثبت من غيره؛ لأن النبي صلى الله عليه وسلم لم يقبل قول ذي اليدين وحده، وإنما أقبل على الصحابة فسألهم، ولولا أنه سيرجع إلى قولهم لما سألهم، وكذا يدل عليه حديث ابن مسعود الآتي لما صلى النبي صلى الله عليه وسلم خمساً فقالوا: (أحدث في الصلاة شيء؟) قال: «وما ذاك؟»، قالوا: (صليت خمساً …) الحديث.", "والقول برجوع الإمام إلى قول المؤتمين به هوقول مالك وأحمد، وقد نص الفقهاء على أنه لو سبح به اثنان لزمه الرجوع ما لم يجزم بصواب نفسه. فإن جزم بصواب نفسه لم يرجع إلى قول من خالفه ولو كثروا.", "والقول الثاني: أنه إن سبح به واحد وغلب على ظنه صدقه أخذ بقوله، على القول بجواز البناء على غلبة الظن؛ لأنه خبر ديني فيقبل فيه خبر واحد ثقة، كوقت الصلاة وطهارة الماء ونجاسته، وهذا قول أبي حنيفة وإسحاق، وهو وجه في مذهب الحنابلة في الزيادة فقط، والله أعلم.", "ج-الحديث دليل على أن من سلم ناسياً قبل تمام صلاته فإنه يسجد سجدتي السهو بعد السلام، فيكبر عند السجود والرفع منه، ثم يسلم بعدهما، وأما التشهد ففيه خلاف سيأتي إن شاء الله.", "د- الحديث دليل على أن الأفعال الكثيرة التي ليست من جنس الصلاة إذا وقعت سهوًا أو مع ظن تمام الصلاة لا تفسد بها الصلاة، بل ينبني بعضها على بعض ولا يستأنفها، وقد جاء في حديث عمران رضي الله عنه: (أنه قام فدخل الحجرة).", "قال الحافظ ابن رجب: (هذه الرواية تدل على أن الخروج من المسجد لا يمنع البناء على الصلاة لمن سلم عن نقص)، والله تعالى أعلم."], "t": ["رواية أبي داود عن حماد بن زيد صحيحة رجالها ثقات، أما رواية: \"حتى يقنه الله ذلك\" فأخرجها من طريق محمد بن كثير عن الأوزاعي، وهي زيادة منكرة، لأن محمد بن كثير بن أبي عطاء يروي المناكير خاصة عن الأوزاعي، وهذا منها."]}, "78": {"m": "وَعَنْ عِمْرَانَ بْنِ حُصَيْنٍ رضي الله عنهما: «أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم صَلّى العَصْرَ فَسَلّمَ فِي ثَلاثِ رَكَعَاتٍ، ثُمّ دَخَلَ مَنْزَِلهُ. فَقَامَ رجَُلٌ يُقَالُ لَهُ الخِرَْبَاقُ - وَكَانَ فِي يَدَيْهِ طُولٌ -، فَقَالَ: يَا رَسُولَ اللَّهِ! فَذَكَرَلَهُ صَنِيعَهُ. وَخَرَجَ غَضْبَانَ يَجُرُّرِدَاءَهُ حَتّى انْتَهَى إِلَى النّاسِ، فَقَالَ: أصَدَقَ هَذَا؟ قَالُوا: نَعَمْ. فَصَلّى رَكْعَةا، ثُمّ سَلّمَ، ثُمّ سَجَدَ سَجْدَتَيْنِ، ثُمّ سَلّمَ» رَوَاهُ مُسْلِمٌ.", "s": ["الحديث دليل على أنه إذا سجد بعد السلام، سلم بعد سجوده بدون تشهد، وهذا قول الأوزاعي والشافعي وهو اختيار شيخ الإسلام ابن تيمية.", "القول الثاني: أن سجود السهو إذا كان بعد السلام فإنه يتشهد له ثم يسلم، أخذاً بزيادة التشهد، وهذا مذهب الحنفية والمالكية والمشهور عند الحنابلة.", "والراجح هو القول الأول، والتشهد لو فعله النبي صلى الله عليه وسلم لنقل إلينا، وأما إثبات التشهد في حديث الباب فهو زيادة شاذة كما تقدم، قال ابن عبد البر: (أما التشهد في سجدتي السهو فلا أحفظه من وجه صحيح عن النبي صلى الله عليه وسلم)، وقال النووي: (إنه لم يصح عن النبي صلى الله عليه وسلم منه شيء)، والله تعالى أعلم."], "t": ["الحديث أخرجه مسلم في صحيحه من طريق إسماعيل بن علية عن خالد الحذاء عن أبي قلابة عن أبي المهلب عن عمران بن حصين به. وكذا رواه بدون ذكر التشهد: شعبة ووهيب بن خالد، وخالفهم أشعث الحمراني فرواه عن محمد بن سيرين عن خالد الحذاء به، وزاد فيه: \"ثم تشهد ثم سلم\". وهذه زيادة شاذة تفرد بها أشعث. وهو وإن كان ثقة إلا أنه لم يخرج له في الصحيحين، فهذه الزيادة مخالفة للثقات الحفاظ المتقنين، أمثال شعبة ووهيب بن خالد وإسماعيل بن علية وغيرهم، وأشعث ليس مقاوماً لهؤلاء، بل هو دونهم في الإتقان والحفظ. ومما يؤيد ذلك أن محمد بن سيرين -وهو الذي روى عنه أشعث هذا الحديث- قيل له: (فالتشهد؟) قال: (لم أسمع في التشهد شيئاً)."]}, "79": {"m": "وَعَنْ أَبِي سََعِيدٍ الخَُدْرِيِ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إِذَا شَكَّ أَحَدُكُمْ فِي صَلاتِهِ فَلَمْ يَدْرِ كَمْ صَلّى؛ أثَلاثا أمْ أرْبَعا؟ فَلْيَطْرَحِ الشّكّ، وَلْيَبْنِ عَلَى مَا اسْتَيْقَنَ، ثُمّ يَسْجُدُ سَجْدَتَيْنِ قَبْلَ أنْ يُسَلِمَ. فَإِنْ كَانَ صَلّى خَمْسا شَفَعْنَ لَهُ صَلاتَهُ، وَإِنْ كَانَ صَلّى إِتْمَاما لأَِرْبَعٍ كَانَتَا تَرْغِيما لِلشّيْطَانِ» رَوَاهُ مُسْلِمٌ.", "s": ["الحديث دليل على أن المصلي إذا شك في صلاته ولم يترجح عنده أحد الأمرين فإنه يطرح الشك ويعمل باليقين، وهو الأقل، فيتم صلاته ويسجد للسهو قبل أن يسلم ثم يسلم، وهذا قول الجمهور من أهل العلم، وقد نقل النووي الإجماع على ذلك. وورد - أيضاً - عن عبد الرحمن بن عوف رضي الله عنه أن النبي صلى الله عليه وسلم قال: «إذا سها أحدكم في صلاته، فلم يدر واحدة صلى أو اثنتين فليبن على واحدة، فإن لم يدر ثنتين صلى أو ثلاثاً فليبن على ثنتين، وإن لم يدر ثلاثا صلى أو أربعا فليبن على ثلاث، وليسجد سجدتين قبل أن يسلم».", "فإذا شك في الركعة الثانية هل هي الثانية أو الثالثة ولم يترجح عنده شيء جعلها الثانية، ثم أكمل صلاته وسجد للسهو. وقد بين النبي صلى الله عليه وسلم الحكمة من ذلك وهو أنه إن كان صلى خمساً فإن السجدتين يشفعن له صلاته، أي: تكون صلاته شفعاً بهاتين السجدتين، لأن المطلوب بالظهر والعصر والعشاء الشفع فكأنهما قاما مقام ركعة، ولو زاد ذلك على أربع.", "وإن كان صلى تماماً ولم يحصل له نقص كانتا إرغاما للشيطان، أي: إغاظة وإذلالا له، لأنه لبس على المصلي صلاته وأراد إفسادها، فجعل الله تعالى هاتين السجدتين طريقاً إلى جبر صلاته، ورداً للشيطان خاسئا ذليلا مبعدا عن مراده، وكملت صلاة العبد وامتثل أمر الله تعالى بالسجود الذي عص ى به إبليس ربه.", "والإرغام من الرغام - بالفتح - وهو التراب، يقال: (أرغم الله أنفه)، أي: ألصقه بالتراب، وهو كناية عن الذل والهوان، والله تعالى أعلم."]}, "80": {"m": "وَعَنَْ إِبْرَاهِيمَ، عَنْ عَلْقَمَةَ، عَنِ ابْنِ مَسْعُودٍ رضَي الله عنه قَالَ: «صَلّى رَسُولُ اللَّهِ صلى الله عليه وسلم - قَالَ إِبْرَاهِيمُ: زادَ أوْ نَقَصَ - فَلَمّا سَلّمَ قِيلَ لَهُ: يَا رَسُولَ اللَّهِ! أحَدَثَ فِي الصَّلاةِ شَيْءٌ؟ قَالَ: وَمَا ذَاكَ؟ قَالُوا: صَلّيْتَ كَذَا وَكَذَا. قَالَ: فََثَنَْى رِجْلَيْهِ وَاسْتَقْبَلَ القَِبْلَةَ، فَسََجَدَ سَجْدَتَيْنِ، ثُمّ سَلّمَ، ثُمّ أقْبَلَ عَلَيْنَا بِوَجْهِهِ، فَقَالََ: إِنّهُ لَوْ حَدَثَ فِي الصّلاةِ شَيْءٌ أنْبَأتُكُمْ بِهِ، وَلَكِنْ إِنّمَا أنَا بَشَرٌ أنْسَى كَمَا تَنْسَوْنَ؛ فَإِذَا نَسِيتُ فَذَكِرُونِي. وَإِذَا شَكّ أحَدُكُمْ فِي صَلاتِهِ؛ فَلْيَتَحَرّ الصّوَابَ، فَلْيُتِمّ عَلَيْهِ، ثُمّ لْيَسْجُدْ سَجْدَتَيْنِ» مُتّفَقٌ عَلَيْهِ. وَفِي لَفْظٍ لِلْبُخَارِي:ِ «فَلْيُتِمّ عَلَيْهِ، ثُمّ يُسَلِمْ، ثُمّ لْيَسْجُدْ سَجْدَتَيْنِ». وَفِي لَفْظٍ لمُِسْلِمٍ: «فَقَالَ: إِذَا زادَ الرّجُلُ أَوْ نَقَصَ؛ فَلْيَسْجُدْ سَجْدَتَيْنِ». وَلَهُ عَنْ عَبْدِ اللَّهِ رضي الله عنه: «أَنّ النّبِيّ صلى الله عليه وسلم سَجَدَ سَجْدَتَيِ السّهْوِ بَعْدَ السّلامِ وَالكَلامِ».", "s": ["أ- الحديث دليل على أن المصلي إذا زاد في صلاته ركعة فصلى الظهر - مثلاً - خمساً أنه يسجد للسهو بعد السلام، وصلاته صحيحة، وهذا مبني على ما إذا لم يذكر الزيادة حتى فرغ منها، والصحابة رضي الله عنهم لم ينبهوا النبي صلى الله عليه وسلم لهذه الزيادة مع علمهم بها، لظنهم أن الصلاة قد طرأ عليها تغيير بالزيادة، ولهذا لما سلم قالوا له: (يا رسول الله أحدث في الصلاة شيء؟).", "فإذا ذكر المصلي الزيادة في أثنائها وجب عليه الرجوع عنها، ووجب عليه سجود السهو، وصلاته صحيحة.", "ومثل زيادة الركعة القيام أو القعود أو السجود، ونحو ذلك.", "ب- الحديث دليل على أن المصلي إذا شك في صلاته وترجح عنده أحد الأمرين فإنه يتحرى الصواب، وقد فسر الصواب بالأخذ بغالب الظن وأن يتحرى ما هو الأرجح، وهو الأقرب إلى فهمه وضبطه، فيبني عليه، سواء أكان زيادة أم نقصاناً، ثم يسجد للسهو بعد السلام، كأن يشك في عدد الركعات أصلى ثلاثاً أم أربعاً فيتم ويسجد للسهو.", "وظاهر الحديث أنه يبني على غالب ظنه إماماً كان أو منفرداً، وهذا رواية عن أحمد.", "وذهب آخرون إلى أن الإمام يبني على غالب ظنه، لأن عنده من ينبهه إذا أخطأ، وأما المأموم والمنفرد فيبني على اليقين وهو الأقل، والأول أظهر لدلالة الحديث.", "ج- دل هذا الحديث مع حديث أبي هريرة المتقدم على أن سجود السهو بعد السلام يكون في حالين:", "الأولى: إذا سلم قبل تمام صلاته ثم أتمها، كما في حديث أبي هريرة لما سلم عن ركعتين، وكما في حديث عمران لما سلم عن ثلاث، وكذا إذا كان عن زيادة، كما في حديث ابن مسعود هذا.", "وقد اعتبر العلماء السلام قبل إتمام الصلاة من باب الزيادة، لأنه زاد سلاماً في أثناء صلاته.", "الثانية: إذا كان السجود عن شك ترجح فيه أحد الأمرين، كما دل على ذلك حديث ابن مسعود هذا.", "د- دل قوله: (إذا شك أحدكم في صلاته) وكذا غيره من الأحاديث المتقدمة على أن سجود السهو مشروع في صلاة النافلة، كما هو مشروع في صلاة الفريضة، لأن الجبران وإرغام الشيطان يحتاج إليه في صلاة النفل، كما يحتاج إليه في صلاة الفرض، وقد ترجم البخاري في كتاب «السهو» بقوله: باب «السهو في الفرض والتطوع».، وهذا قول الجمهور، وقد خالف بعض السلف، كما ذكر الحافظ ابن حجر، فقالوا: لا يسجد في صلاة التطوع، والله أعلم."]}, "81": {"m": "وَعَنْ عَبْدِ اللَّهِ ابْنِ بُحَيْنَةَ رضي الله عنهما: «أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَامَ فِي صَلاةِ الظُّهْرِوَعَلَيْهِ جُلُوسٌ، فَلَمّا أَتَمّ صَلاتَهُ سَجَدَ سَجْدَتَيْنِ؛ يُكَبِرُفِي كُلِ سَجْدَةٍ وَهُوَ جَالِسٌ قَبْلَ أنْ يُسَلِمَ، وَسَجَدَهُمَا النّاسُ مَعَهُ مَكَانَ مَا نَسِيَ مِنَ الجُلُوسِ» مُتّفَقٌ عَلَيْهِ.", "s": ["أ- الحديث دليل على أن من نسي التشهد الأول حتى قام إلى الثالثة أنه لا يرجع إليه، ويجبره بسجود السهو قبل السلام، لقوله: (قبل أن يسلم) وقد دلت زيادة عند ابن خزيمة - عند من يرى صحتها - على أن الإمام لا يرجع ولو سبح به المأموم، وهذا كله إذا ذكر التشهد بعد أن استتم قائماً، سواء شرع في القراءة أم لا، لأنه انتقل إلى الركن الذي يليه وهو القيام، لكن إن ذكره قبل أن ينهض، أي: قبل أن تفارق فخذاه ساقيه فإنه يجلس ويتشهد، وليس عليه شيء.", "وقد خص الفقهاء - رحمهم الله - سجود السهو في باب النقص، بنقص الواجبات، وأما نقص الأركان كنسيان سجدة فلا تجبر بسجود السهو، بل لا بد من الإتيان بها على تفصيل في كتب الفقه.", "وأما ترك السنن كالاستفتاح والتعوذ ونحوهما أو رفع اليدين، فإن كان من عادته أن يأتي به سن له أن يسجد على أحد القولين، لعموم: (فإذا نسي أحدكم فليسجد سجدتين)، وإن لم يكن من عادته الإتيان به ولم يخطر بباله فلا يسجد لتركه، إذ لا موجب لهذه الزيادة.", "ب- دل هذا الحديث مع حديث أبي سعيد - المتقدم - على أن سجود السهو قبل السلام محفوظ في حالين:", "الأولى: إذا كان عن نقص، كما في هذا الحديث لما قام النبي صلى الله عليه وسلم عن التشهد الأول قبل السلام.", "الثانية: إذا كان عن شك لم يترجح فيه أحد الأمرين، والله تعالى أعلم."]}, "82": {"m": "وَعَنِ ابْنِ مَسْعُودٍ رضي الله عنه: «أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم صَلّى الظُّهْرَخَمْسا، فَقِيلَ: أَزِيدَ فِي الصّلاةِ؟ فَقَالَ: وَمَا ذَاكَ؟ قَالُوا: صَلّيْتَ خَمْسا، فَسَجَدَ سَجْدَتَيْنِ بَعْدَمَا سَلّمَ» مُتّفَقٌ عَلَيْهِ. وَلَمْ يَقُلْ مُسْلِمٌ: «بَعْدَمَا سَلّمَ».", "s": ["هذا الحديث فيه دليل لمذهب الجمهور من السلف والخلف أن من زاد في صلاته ركعة ناسياً لم تبطل صلاته، بل إن علم بعد السلام فقد مضت صلاته صحيحة ويسجد للسهو إن ذكر بعد السلام بقريب، وإن طال فالأصح أنه لا يسجد.", "وقال أبو حنيفة إذا زاد ركعة ساهياً بطلت صلاته ولزمه إعادتها، وأما مالك فقال القاضي عياض مذهبه أنه إن زاد دون نصف الصلاة لم تبطل صلاته بل هي صحيحة ويسجد للسهو، وإن زاد النصف فأكثر؛ فمن أصحابه من أبطلها وهو قول مطرف وابن القاسم، ومنهم من قال لا تبطل مطلقاً وهو مروي عن مالك رحمه الله تعالى، والله أعلم.", "صلاة التطوع: مركب إضافي، من إضافة الشيء إلى نوعه، لأن الصلاة قد تكون فرضاً، وقد تكون تطوعاً.", "والتطوع لغة: تكلف الطاعة والتبرع بما لا يلزم من الخير أو الزيادة التي ليست لازمة، ولا يقال تطوع إلا في باب الخير والبر. وشرعا: كل طاعة ليست بواجبة، والمراد بقولنا: (ليست واجبة) أي: بحق الإسلام، كالصلوات الخمس الواجبة، وإلا فقد تكون صلاة التطوع واجبة بأسبابها، كدخول المسجد سبب لوجوب تحية المسجد - على أحد القولين - ووجوب الوفاء بالنذر سبب لوجوب الصلاة المنذورة، وهكذا.", "والحكمة من مشروعية التطوع:", "١ - جبر ما قد يكون في أداء الفريضة من خلل وتقصير، فإن الفرائض يعتريها النقص، إما في شروطها أو أركانها أو واجباتها، وقد دل على ذلك حديث أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إن أول ما يحاسب الناس به يوم القيامة من أعمالهم الصلاة، يقول ربنا جل وعز لملائكته - وهو أعلم - انظروا في صلاة عبدي، أتمها أم نقصها؟ فإن كانت تامة كتبت له تامة، وإن كان انتقص منها شيئا قال: انظروا هل لعبدي من تطوع، فإن كان له تطوع قال: أتموا لعبدي فريضته من تطوعه، ثم تؤخذ الأعمال على ذاكم».", "٢ - تهيئة المسلم للترقي في درجات القرب من الله تعالى حتى يصل إلى درجة محبة الله عز وجل له، وقد جاء في ذلك حديث أبي هريرة رضي الله عنه أن النبي صلى الله عليه وسلم قال: «يقول الله تبارك وتعالى: ما تقرب إلي عبدي بأفضل مما افترضته عليه، ولا يزال عبدي يتقرب إلي بالنوافل حتى أحبه …» الحديث.", "٣ - ومن فوائد صلاة التطوع ما أشار إليه الإمام الشاطبي رحمه الله من أن المندوبات بمنزلة الحمى والحارس للواجبات إذ هي رياضة للنفس، يستدعى القيام بها أداء الفرائض، فمن أدى النوافل فإنه لا محالة يؤدي الواجب، ومن قصر في أداء النوافل، فهو عرضة لأن يقصر في أداء الواجبات، وهذا بين مشاهد.", "٤ - ومن فوائد التطوع: تحصيل الثواب والأجر المرتب على فعل الصلوات، كما دلت السنة على ذلك، مما سيأتي بعضه إن شاء الله.", "5 - ومن فوائد التطوع: توطين النفس وتمرينها على العبادة لتعتاد على ذلك ويسهل عليها فعل الطاعة فتلتذ بها، ويحصل لها الخشوع والخضوع، فتسهل عليها الفرائض وتتهيأ لها.", "6 - أن العناية بالنوافل من أعظم الأسباب في صلاح القلب واستقامته وطهارته، وبذلك تصلح أموره وتستقيم أحواله.", "7 - ومن فوائدها: شغل الوقت بأفضل الطاعات وأجل القربات، وهي الصلاة.", "8 - الاقتداء بالنبي صلى الله عليه وسلم بأداء النوافل، وكذا السابقين المقربين من سلف هذه الأمة الذين هم في أعلى المراتب عند الله تعالى. والله تعالى أعلم."]}, "83": {"m": "عَنْ جَابِرِبْنِ عَبْدِ اللَّهِ رضي الله عنهما قَالَ: «سُئِلَ رَسُولُ اللَّهِ صلى الله عليه وسلم: أَيُّ الصّلاةِ أَفْضَلُ؟ قَالَ: طُولُ القُنُوتِ» رَوَاهُ مُسْلِمٌ. وَفِي رِوَ ايَةِ أَحْمَدَ، وَ أَبِي دَاوُدَ؛ مِنْ رِوَ ايَةِ عَبْدِ اللَّهِ بْنِ حُبْشِيٍ الخَثْعَمِيِ رضي الله عنه قَالَ: «طُولُ القِيَامِ».", "w": ["قوله: (طول القنوت) هو مصدر «قَنَتَ»، وهو يرد لعدة معانٍ منها: دوام الطاعة والعبادة، والدعاء، وطول القيام، والسكوت، وغير ذلك من المعاني التي يعينها سياق الكلام. والرواية الثانية فسرت القنوت في الرواية الأولى بأنه طول القيام. ويرى شيخ الإسلام ابن تيمية أن القنوت هنا معناه: دوام الطاعة والعبادة، فيصدق على من أطال الركوع والسجود، كما قال الله تعالى: ﴿أَمَّن هُوَ قَانِت آنَاءَ اللَّيلِ سَاجِدًا وَقَائِمًا﴾ [الزمر: 9] فجعله قانتاً في حال السجود، فإخبار النبي ﷺ أن أفضل الصلاة طول القنوت يراد به طول القيام والركوع والسجود، كما هو فعله ﷺ."], "s": ["الحديث دليل على أن تطويل القيام في الصلاة أفضل من تكثير الركوع والسجود، وهذا محمول على صلاة النفل التي لا تشرع لها الجماعة، وعلى صلاة المنفرد، فأما الإمام في الفرائض والنوافل التي تشرع لها الجماعة كالتراويح، فهو مأمور بالتخفيف المشروع، إلا إذا علم من حال المأمومين المحصورين بعدد معين الرغبة في التطويل، ولم يحدث ما يقتضي التخفيف من الأمور العارضة كبكاء صبي ونحوه، وعليه تُحمل صلاة النبي ﷺ في المغرب بسورة الأعراف.", "ب- اختلف العلماء هل تطويل القيام أفضل من تكثير السجود والركوع على أربعة أقوال:", "القول الأول: أن تطويل القيام أفضل من كثرة الركوع والسجود، وهذا مذهب الشافعية، والحنفية، والمالكية في أحد القولين، وهو رواية عن الإمام أحمد، مستدلين بحديث جابر هذا؛ ولأن ذِكرَ القيام هو القراءة، وذكر السجود هو التسبيح، والقراءة أفضل؛ ولأن هذا هو المنقول من فعله ﷺ، فقد كان يطيل القيام أكثر من إطالة السجود.", "والقول الثاني: أن تكثير الركوع والسجود أفضل من طول القيام، حكاه الترمذي، والبغوي عن جماعة، وروي هذا عن ابن عمر، وهو الصحيح من المذهب عند الحنابلة، وهو اختيار بعض الحنفية، وأحد القولين عند المالكية، واستدلوا بالأحاديث الدالة على فضل السجود، والأمر بتكثير الدعاء فيه؛ كحديث أبي هريرة أن رسول الله ﷺ قال: «أقرب ما يكون العبد من ربه وهو ساجد، فأكثروا الدعاء»، وحديث ثوبان: «عليك بكثرة السجود لل» فأرشده النبي ﷺ إلى كثرة السجود في مساق الدلالة على الفضيلة، وهو لا يرشد إلا إلى الأفضل.", "والقول الثالث: أن الأفضل في تطوع النهار كثرة الركوع والسجود، والأفضل في تطوع الليل طول القيام، إلا أن يكون للمصلي مقدار من القرآن يقرؤه في الليل، فكثرة الركوع والسجود أفضل؛ لأنه يقرأ جزءه ويربح كثرة الركوع والسجود، وهذا قول إسحاق بن راهويه، وإنما قال هذا لأنهم وصفوا صلاة النبي ﷺ بطول القيام، ولم يُوصف من تطويله بالنهار ما وصف من تطويله بالليل.", "والقول الر ابع: أنهما سواء، وهذا رواية عن الإمام أحمد، اختارها المجد ابن تيمية، وحفيده شيخ الإسلام ابن تيمية. قال الإمام أحمد: (هذا فيه حديثان، ولم يقض فيه شيء)، والمعنى: أن فيه حديثين، حديث يدل على أن الفضل في طول القنوت، وهو حديث الباب، وحديث يدل على أن الفضل في كثرة الركوع والسجود، وهو قوله ﷺ لثوبان: «عليك بكثرة السجود لل، فإنك لا تسجد لل سجدة إلا رفعك الله بها درجة، وحط عنك بها خطيئة...» كما استدلوا بفعل النبي ﷺ، فإن صلاته كانت معتدلة، فإذا أطال القيام أطال الركوع والسجود حتى يتقاربا، ولما وصف حذيفة تهجد النبي ﷺ وأنه قرأ البقرة والنساء وآل عمران قال: ثم ركع فكان ركوعه نحوًا من قيامه... (5).", "وهذا القول هو أقرب الأقوال، وهو أن يكون القيام والركوع والسجود على حال متقاربة في الطول والقصر، فمن أطال القيام، فالأفضل له أن يطيل السجود؛ لأن المتأمل في صفة صلاة النبي ﷺ يجدها كذلك؛ ولأن من معاني القنوت دوام العبادة والطاعة، وهو المراد هنا، ولم يرد تفسير القنوت بالقيام إلا عند أبي داود، مع أنه روى الحديث عن الإمام أحمد، وليس عند أحمد لفظ القيام على ما تقدَم، وتفسير القنوت بالقيام صحيح لغةً، لكن تفسيره بدوام الطاعة - هنا - أقرب، لدلالة القرآن عليه، كما في قوله تعالى: ﴿أمَّن هُوَ قَانِت آنَاءَ اللَّيلِ سَاجِدًا وَقَائِمًا﴾ [الزمر: 9]، فجعله قانتاً في حال السجود. ومن شق عليه طول القيام، واستبدله بقصر القيام وكثرة السجود فله ذلك، ويمكن تصوير ذلك في صلاة التراويح على القول بأنه ليس لها عدد معين، والله تعالى أعلم."], "t": ["هذا الحديث رواه مسلم من طريق أبي عاصم، أخبرنا ابن جريج، أخبرني أبو الزبير، عن جابر به. ورواه - أيضاً من طريق أبي معاوية، حدثنا الأعمش، عن أبي سفيان، عن جابر به.", "وأبو عاصم: هو الضحاك بن مَخلَد الشيباني النبيل المصري، ثقة، ثبت، كما في «التقريب»، وأبو سفيان هو طلحة بن نافع الإسكاف الواسطي نزيل مكة، صدوق كما في «التقريب» - أيضاً -.", "وروى الحديث أحمد، -وعنه أبو داود- قال: ثنا حجاج، قال: قال ابن جريج: أخبرني عثمان بن أبي سليمان، عن علي الأزدي، عن عبيد بن عمير، عن عبد الله بن حبشي الخثعمي أن رسول الله ﷺ سئل أي الأعمال أفضل؟ قال: «طول القيام». هذا لفظ أبي داود، ولفظ أحمد: أي الصلاة أفضل؟ قال: «طول القنوت». وإسناده قوي.", "وبهذا يتبين أن عزوه لأحمد بلفظ (طول القيام) فيه نظر، فإنه لم يروه بهذا اللفظ، إلا إن كان ذلك من اختلاف النسخ، فالل أعلم."]}, "84": {"m": "وَعَنْ رَِبيعَةَ بْنِ كَعْبٍ الأََسْلََمِيِ رضي الله عنه قَالَ: «كُنْتُ أَبَِيتُ مَعَ النّبِيِ صلى الله عليه وسلمَ؛ فَآتِيهِ بِوَضُوئِهِ وَحَاجَتِهِ، فَقَالَ لِي: سَلْ، فَقُلْتُ: أسْألُكَ مُرَ افَقَتَكَ فِي الجَنّةِ، فَقَالَ: أوْغَيْرَذَلِكَ؟ قُلْتُ: هُوَذَاكَ. قَالَ: فَأعِنِي عَلَى نَفْسِكَ بِكَثْرَةِ السُّجُودِ» رَوَاهُ مُسْلِمٌ.", "s": ["الحديث دليل على فضل صلاة التطوع، وأنها من أعظم الطاعات، وأقوى الأسباب لعلو الدرجات في جنات النعيم، والمراد بالسجود هنا: صلاة التطوع، ولهذا ذكر المصنف هذا الحديث في هذا الباب، وكأن الذي صرف اللفظ عن ظاهره هو أن السجود بغير صلاة أو لغير سبب غير مرغب فيه على انفراده، والسجود وإن كان يصدق على صلاة الفرض لكن الإتيان بالفرائض لا بد منه لكل مسلم، وإنما أرشده النبي صلى الله عليه وسلم إلى شيء يختص به، ينال به ما طلبه.", "والتعبير بالسجود عن الركعة وقع في بعض الأحاديث، كما تقدم في «المواقيت» وكما سيأتي هنا، وقد يعبر عن الشيء ببعضه، لا سيما إذا كان هذا البعض أهم ما فيه، والسجود أهم ما في الصلاة، لما فيه من كمال الخضوع والذل والاستكانة لل تعالى، والقرب منه، لأنه غاية التواضع والعبادة لل تعالى، وفيه تمكين أعز أعضاء الإنسان وأعلاها وهو وجهه من التراب الذي يداس ويمتهن."]}, "85": {"m": "وَعَنِ ابْنِ عُمَرَرضي الله عنهما قَالَ: «حَفِظْتُ مِنَ النّبِيِ صلى الله عليه وسلم عَشْرَرَكَعَاتٍ: رَكْعَتَيْنِ قَبْلَ الظُّهْرِ، وَرَكْعَتَيْنِ بَعْدَهَا، وَرَكْعَتَيْنِ بَعْدَ المَغْرِبِ فِي بَيْتِهِ، وَرَكْعَتَيْنِ بَعْدَ العَِشَاءِ فِي بَيْتِهَِ، وَرَكْعَتَيْنِ قَبْلَ صَلاةِ الصُّبْحِ، كَانَتْ سَاعَةا لَا يُدْخَلُ عَلَى النّبِيِ صلى الله عليه وسلم فِيهَا، حَدّثَتْنِي حَفْصَةُ أنّهُ كَانَ إِذَا أذّنَ المُؤَذِنُ وَطَلَعَ الفَجْرُ صَلّى رَكْعَتَيْنِ» مُتّفَقٌ عَلَيْهِ، وَهَذَا لَفْظُ البُخَارِي.ِ وَفِي رِوَ ايَةٍ لمُِسْلِمٍ قَالَتْ: «كَانَ النّبِيُّ صلى الله عليه وسلم إِذَا طَلَعَ الفَجْرُلَا يُصَلِي إِلَاّ رَكْعَتَيْنِ خَفِيفَتَيْنِ». وَفِي رِوَ ايَةٍ لَهُمَا: «وَرَكْعَتَيْنِ بَعْدَ الجُمُعَةِ فِي بَيْتِهِ».", "r": 86}, "86": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها: «أَنّ النّبِيّ صلى الله عليه وسلم كَانَ لَا يَدَعُ أَرْبَعا قَبْلَ الظُّهْرِ، وَرَكْعَتَيْنِ قَبْلَ الغَدَاةِ» رَوَاهُ البُخَارِيُّ.", "s": ["أ-حديث ابن عمر دليل على مشروعية التنفل بهذه الرواتب، وهي ركعتان قبل الظهر، وركعتان بعدها، وركعتان بعد صلاة الجمعة، وركعتان بعد صلاة المغرب، وركعتان بعد صلاة العشاء، وركعتان خفيفتان قبل صلاة الفجر.", "فالرواتب عشر، كما عدها ابن عمر رضي الله عنهما فإن راتبة الجمعة تحل محل راتبة الظهر، ثم هي لا تتكرر كل يوم، وقد حفظها ابن عمر رضي الله عنهما من مشاهدة النبي صلى الله عليه وسلم في المسجد أو في بيت أخته حفصة رضي الله عنها زوج النبي صلى الله عليه وسلم أو في مواطن أخرى، لأن ابن عمر ليس في بيت النبي صلى الله عليه وسلم وإنما هو في بيت أبيه عمر رضي الله عنه.", "وقد ورد في حديث عائشة رضي الله عنها لما سئلت عن تطوع النبي صلى الله عليه وسلم قالت: (كان يصلي في بيتي قبل الظهر أربعاً، ثم يخرج فيصلي بالناس، ثم يدخل فيصلي ركعتين … الحديث).", "وهذا يفيد أن الرواتب ثنتا عشرة ركعة، ويؤيد ذلك حديث أم حبيبة الآتي: (من صلى اثنتي عشرة ركعة في يوم وليلة بني له بهن بيت في الجنة).", "فابن عمر ذكر ما اطلع عليه وهو عشرة ركعات، وحديث عائشة فيه زيادة، وكذا حديث أم حبيبة، فمن فعل ذلك حصل على خير كثير وثواب عظيم، مع ما في ذلك من التأسي بالنبي صلى الله عليه وسلم.", "ويحتمل أنه صلى الله عليه وسلم كان يصلي مرة عشرًا على ما في حديث ابن عمر، واثنتي عشرة على ما في حديث عائشة، وهذا قريب، لأن عائشة رضي الله عنها إنما تطلع على ما يفعله النبي صلى الله عليه وسلم إذا كان في بيتها، وهو ليس عندها إلا يومان من تسعة أيام منذ وهبت سودة يومها لعائشة رضي الله عنهما، وابن عمر قد يطلع على بقية الأيام في المسجد أو في بيت حفصة أو في مواضع أخرى كما تقدم.", "ب- الحديث دليل على أن الأفضل في راتبة الجمعة والمغرب والعشاء أن تصلى في البيت، وقد سكت عن مكان راتبة الفجر، ولعل ذلك لشهرة كونه صلى الله عليه وسلم يصليها في بيته.", "وقد سكت عن بيان مكان راتبتي الظهر، وقد دل حديث عائشة المتقدم أنه صلى الله عليه وسلم كان يصليها في بيته.", "وقد ورد في الحث على صلاة النافلة في البيت وبيان فضلها أحاديث كثيرة، منها: حديث عبد الله بن عمرو رضي الله عنهما عن النبي صلى الله عليه وسلم قال: «اجعلوا في بيوتكم من صلاتكم ولا تتخذوها قبورا».", "وعن زيد بن ثابت رضي الله عنه أن النبي صلى الله عليه وسلم قال: «صلوا أيها الناس في بيوتكم، فإن أفضل صلاة المرء في بيته إلا المكتوبة».", "وعن جابر رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «إذا قضى أحدكم الصلاة في مسجده فليجعل لبيته نصيبا من صلاته، فإن الله جاعل في بيته من صلاته خيرا».", "وصلاة النافلة في البيت فيها فو ائد عظيمة، منها:", "١ - تمام الخشوع والإخلاص والبعد عن الرياء.", "٢ - تحقيق الخيرية الموعود بها، ومن ذلك نزول الرحمة، وطرد الشيطان، ومضاعفة الأجر، ووجود القدوة الصالحة، وتربية أهل البيت من النساء والصغار.", "٣ - أن فعلها في المنزل يخرج البيت عن كونه كالمقبرة.", "٤ - امتثال أمر الرسول صلى الله عليه وسلم الذي حثنا على صلاة النافلة في البيت. والله تعالى أعلم."]}, "87": {"m": "وَعَنْهَا رضي الله عنها قَالَتْ: «لَمْ يَكُنِ النّبِيُّ صلى الله عليه وسلم عَلَى شَيْءٍ مِنَ النّوَ افِلِ أَشَدّ تَعَاهُدا مِنْهُ عَلَى رَكْعَتَيِ الفَجْرِ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لِلْبُخَارِي.ِ وَلمُِسْلِمٍ: «رَكْعَتَا الفَجْرِ؛ خَيْرٌمِنَ الدُّنْيَا وَمَا فِيهَا».", "w": ["قوله: (أشد تعاهدا) أي: أقوى وأكثرمحافظة."], "s": ["والحديث دليل على اختصاص راتبة الفجر بشدة محافظة النبي صلى الله عليه وسلم عليها وأنها خير من الدنيا وما فيها، وقد اجتمع في هذه الراتبة القول منه صلى الله عليه وسلم في الترغيب فيها، والفعل منه صلى الله عليه وسلم في المحافظة عليها، ولهذا كان النبي صلى الله عليه وسلم لا يدعها حضرًا ولا سفرًا بخلاف الرواتب الأخرى فكان لا يصليها في السفر، والله أعلم."]}, "88": {"m": "وَعَنْ أُمِ حَبِيبَةَ رضي الله عنها قَالَتْ: سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ: «مَنْ صَلّى اثْنَتَيْ عَشْرَةَ رَكْعَةا فِي يَوْمٍ وَلَيْلَةٍ؛َ بُنِيَ لَهُ بِهِنّ بَيْتٌ فِي الجَنّةِ» - وَفِي رِوَ ايَةٍ: «تَطَوُّعا» - رَوَاهُ مُسْلِمٌ. وَقَدْ رَوَاهُ التِرْمِذِيُّ - وَصَحّحَهُ -، وَالنّسَائِيُّ، وَفِيهِ: «أرْبَعا قَبْلَ الظُّهْرِ، وَرَكْعَتَيْنِ بَعْدَهَا، وَرَكْعَتَيْنِ بَعْدَ المَغْرِبِ، وَرَكْعَتَيْنِ بَعْدَ العِشَاءِ، وَرَكْعَتَيْنِ قَبْلَ صَلاةِ الفَجْرِ». قَالَ النّسَائِيُّ: «قَبْلَ الصُّبْحِ»، وَذَكَرَ: «رَكْعَتَيْنِ قَبْلَ العَصْرِ» بَدَلَ: «رَكْعَتَيْنِ بَعْدَ العِشَاءِ».", "s": ["الحديث دليل على عظم ثواب من صلى في يوم وليلة من النوافل ثنتي عشرة ركعة، وأن ذلك من أسباب دخول الجنة والنجاة من النار مع أداء الفرائض وترك المحارم، وهي أربع قبل الظهر، واثنتان بعدها، وركعتان بعد المغرب، وركعتان بعد العشاء، وركعتان قبل صلاة الصبح. كما ورد تفصيل ذلك في رواية النسائي والترمذي، وهي التي كان النبي صلى الله عليه وسلم يصليها كما مر في حديث ابن عمر وعائشة رضي الله عنهم، فاجتمع فيها القول والفعل من النبي صلى الله عليه وسلم. فإذا أضيف إليها قيام الليل إحدى عشرة ركعة مع الفرائض سبع عشرة ركعة فهذه أربعون ركعة، من حافظ عليها حاز خيرًا كثيرًا وفضلاً عظيماً، وما أسرع الإجابة وأعجل فتح الباب لمن يقرعه كل يوم وليلة أربعين مرة، نسأل الله من فضله. والله أعلم."], "t": ["رواية الترمذي أخرجها من طريق سفيان الثوري، عن أبي إسحاق، عن المسيب بن رافع، عن عنبسة بن أبي سفيان، عن أم حبيبة رضي الله عنها به، وقال الترمذي: حديث حسن صحيح.", "وأما رواية النسائي فهي من طريق فليح بن سليمان عن سهيل بن أبي صالح عن أبي إسحاق به. ثم قال النسائي: فليح ليس بالقوي، وقد ضعف الألباني إسنادها."]}, "89": {"m": "وَعَنْ أُمِ حَبِيبَةَ رضي الله عنها قَالَتْ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَنْ حَافَظَ عَلَى أَرْبَعِ رَكَعَاتٍ قَبْلَ الظُّهْرِ وَأَرْبَعٍ بَعْدَهَا؛ حَرّمَهُ اللَّهُ عَلَى النّارِ» رَوَاهُ أحْمَدُ، وَ أَبُو دَاوُدَ، وَ ابْنُ مَاجَهْ، وَالنّسَائِيُّ، وَالتِرْمِذِيُّ - وَقَالَ: «حَدِيثٌ حَسَنٌ صَحِيحٌ غَرِيبٌ» -.", "s": ["الحديث دليل على فضل أربع ركعات قبل صلاة الظهر وأربع بعدها، وأن ذلك مع أداء الفرائض واجتناب المحارم من أسباب النجاة من النار، وما أخفها وأسهلها إذا اعتادها المسلم وروض نفسه عليها.", "والأربع التي قبل الظهر تقدم ما يدل على فضلها - أيضاً - وأن النبي صلى الله عليه وسلم كان يصليها كما روته عائشة رضي الله عنها، وأما الأربع التي بعدها فاثنتان من السنة المؤكدة كما مر، والأخريان غير مؤكدتين. والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق عنبسة بن أبي سفيان، قال: قالت أم حبيبة زوج النبي صلى الله عليه وسلم: قال رسول الله صلى الله عليه وسلم: … فذكرته، وهذا الحديث له طرق، وهو حديث صحيح."]}, "90": {"m": "وَعَنِ ابْنِ عُمَرَرضي الله عنهما قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «رحَِمَ اللَّهُ امْراأ صََلّى أَرْبَعا قَبْلَ العَصْرِ» رَوَاهُ أَحْمَدُ، وَ أبُو دَاوُدَ، وَ ابْنُ خُزَْيمَةَ فِي «صَحِيحِهِ»، وَالتِرْمِذِيُّ - وَقَالَ: «حَسَنٌ غَرِيبٌ» -. وَوَهّى أبُو زُرْعَةَ راوِيَهُ.", "s": ["استدل بهذا الحديث من قال: باستحباب أربع ركعات قبل صلاة العصر وأنه ينبغي المحافظة عليها رجاء الدخول في دعوة النبي صلى الله عليه وسلم على القول بأن قوله: (رحم الله امرأ) دعاء، أو يدخل في ضمن من رحمهم الله على القول بأنه خبر، كما ذكر ذلك العراقي رحمه الله.", "ولم تكن الأربع من السنن المؤكدة، لأنه لم يرو أن النبي صلى الله عليه وسلم واظب عليها، ولهذا لم يذكرها ابن عمر ولا عائشة رضي الله عنهما.", "وقد جاء في حديث علي رضي الله عنه في وصف تطوع النبي صلى الله عليه وسلم بالنهار قال فيه: (وأربعاً قبل العصر، يفصل بين كل ركعتين بالتسليم على الملائكة المقربين والنبيين ومن تبعهم من المسلمين والمؤمنين).", "وعلى هذا الحديث تكون الأربع قبل العصر وردت فيها السنة القولية والفعلية، ولهذا ذهب بعض أهل العلم إلى أنها من الرواتب، كما نقل ذلك ابن قدامة عن أبي الخطاب الحنبلي، وهي من المسائل التي انفرد بها، ونقل المجد ابن تيمية وجهين للحنابلة، وصرح صاحب «المهذب» من الشافعية بأنها من الرواتب، ووافقه على ذلك النووي.", "وذهب آخرون من أهل العلم إلى أن حديث علي رضي الله عنه لا يصح، وأن النبي صلى الله عليه وسلم لم يكن يصلي قبل العصر، وهذا هو الذي تقتضيه الصناعة الحديثية، فإن تفرد عاصم بهذا الحديث - وهو متكلم فيه - مع مخالفته للأحاديث الصحيحة، وللملازمين من صحابته، كل هذه قرائن على ضعف الحديث، والعلم عند الله تعالى.", "قال ابن القيم: (وأما الأربع قبل العصر فلم يصح عنه عليه السلام في فعلها شيء، إلا حديث عاصم بن ضمرة عن علي … ثم ذكره، وقال: سمعت شيخ الإسلام ابن تيمية ينكر هذا الحديث ويدفعه جدا، ويقول: إنه موضوع، ويذكر عن أبي إسحاق الجوزجاني إنكاره …)، وقد ذكر ابن حجر في «تهذيب التهذيب» كلام الجوزجاني، ورد عليه، ودافع عن عاصم.", "والظاهر أنه أنكره لذكر الركعات الأربع قبل العصر، وأما ألفاظ الحديث الأخرى التي فيها نوافل الظهر … إلخ، فلها شواهد في الصحيحين وغيرها، كما تقدم.", "وقد ورد عند أبي داود بلفظ: (ركعتين قبل العصر)، وقد حكم الألباني عليها بالشذوذ؛ لأن جميع الروايات اتفقت على الأربع، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق سليمان بن داود الطيالسي، قال: حدثنا محمد بن مسلم بن مهران القرشي، قال: حدثني جدي أبو المثنى، عن ابن عمر رضي الله عنهما به.", "قال الترمذي: (هذا حديث غريب حسن) وفي بعض النسخ (حسن غريب) وهو الذي نقله المزي، وهذا الحديث مختلف فيه، فقد صححه ابن خزيمة وابن حبان وحسنه الترمذي، لكنه قال: (غريب)، وصححه - أيضا - النووي، والألباني.", "وأعله غيرهم، فقد قال ابن أبي حاتم: سمعت أبي يقول: سألت أبا الوليد الطيالسي عن حديث محمد بن مسلم بن المثنى، عن أبيه، عن ابن عمر، عن النبي صلى الله عليه وسلم قال: «رحم الله امرءا صلى قبل العصر أربعا»، فقال: دع ذا، فقلت: إن أبا داود قد رواه، فقال أبو الوليد: كان ابن عمر يقول: (حفظت عن النبي صلى الله عليه وسلم عشرة ركعات في اليوم والليلة) فلو كان هذا لعده، قال أبي: يعني كان يقول: حفظت اثنتي عشرة ركعة.", "وقد ذكر ابن القيم أن هذا ليس بعلة؛ لأن ابن عمر رضي الله عنهما إنما أخبر عن فعل النبي صلى الله عليه وسلم ولم يخبر عن غير ذلك، ولذا أخبرت عائشة أنه كان يصلي قبل الظهر أربعاً، ولم يذكر ذلك ابن عمر، فكذا هنا، وعليه فلا تنافي بين الحديثين البتة.", "وهذا الحديث جاء من رواية محمد بن مسلم بن مهران عن ابن عمر، وهو متكلم فيه، فقد قال عنه أبو زرعة: واه، ولينه ابن مهدي، وذكره ابن حبان في «الثقات» وقال: (يخطئ)، وقال ابن عدي: (ليس له من الحديث إلا اليسير، ومقدار ما له من الحديث لا يتبين فيه صدقه من كذبه)، وقال ابن معين والدارقطني: (لا بأس به)، وقال الحافظ في «التقريب»: (صدوق يخطئ).", "وأما جده أبو المثنى، وهو مسلم بن المثنى، فقد روى عنه جمع، وقال أبو زرعة: (ثقة)، وذكره ابن حبان في «الثقات».", "والظاهر - والله أعلم - أنه لا يقبل تفرد محمد بن مسلم بهذا الحديث، فإن إعلال أبي الوليد وجيه، ثم أين سالم ونافع - رواة ابن عمر - عن هذا الحديث؟! والترمذي لما حسنه استغربه، كما تقدم."]}, "91": {"m": "وَعَنْ عَبْدِ اللَّهِ بْنِ مُغَفّلٍ المَُزَِنيِ رضي الله عنهما، عَنِ النّبِيِ صلى الله عليه وسلم قَالَ: «صََلُّوا قَبْلَ صَلاةِ المَغْرِبِ، قَالَ فِي الثّالِثَةِ: لمَِنْ شَاءَ؛ كَرَاهِيَةَ أنْ يَتّخِذَهَا النّاسُ سُنّةا» رَوَاهُ البُخَارِيُّ، وَ ابْنُ حِبّانَ وَزَادَ: «أنّ النّبِيّ صلى الله عليه وسلم صَلّى قَبْلَ المَغْرِبِ رَكْعَتَيْنِ».", "t": ["زيادة ابن حبان إسنادها صحيح على شرط مسلم، وهذا السياق فيه الفعل مع القول، ويشكل عليه حديث أنس قال: كنا نصلي ركعتين بعد غروب الشمس، فكان صلى الله عليه وسلم يرانا، فلم يأمرنا ولم ينهنا، فإن ظاهره أن الرسول صلى الله عليه وسلم لم يكن يصليهما.", "ولعل المصنف أورد رواية ابن حبان لبيان أن هاتين الركعتين اجتمعت فيهما السنة القولية والفعلية والتقريرية.", "والحديث دليل على استحباب صلاة ركعتين قبل صلاة المغرب، والذي صرف الأمر في قوله: (صلوا) عن الوجوب قوله: (لمن شاء)، ولذا قال الراوي: (كراهية أن يتخذها الناس سنة) أي: طريقة لازمة أو سنة راتبة يكره تركها، وقد كان كثير من الصحابة رضي الله عنهم يصلون هاتين الركعتين، كما حكى ذلك أنس رضي الله عنه.", "وهما داخلتان في عموم قوله صلى الله عليه وسلم: «بين كل أذانين صلاة، بين كل أذانين صلاة، (ثم قال في الثالثة) لمن شاء». والمراد بـ (الأذانين): الأذان والإقامة، لأن الكل إعلام، فالأذان إعلام بدخول الوقت، والإقامة إعلام بالصلاة والدخول فيها. والركعتان قبل المغرب ليستا من السنن الرواتب، فلا تستحب المداومة عليهما؛ لئلا تأخذا حكم الرواتب، والله تعالى أعلم."]}, "92": {"m": "وَعَنْهَا رضَي الله عنها قَالَتْ: «كَانَ النّبِيُّ صلى الله عليه وسلم يُخَفِفُ الرّكْعَتَيْنِ اللّتَيْنِ قَبْلَ صَلاةِ الصُّبْحِ؛ حَتّى إِنِي أَقُولُ: هَلْ قَرَأ بِأُمِ الكِتَابِ؟» مُتّفَقٌ عَلَيْهِ.", "s": ["الحديث دليل على استحباب تخفيف راتبة الفجر، فلا يطيل القراءة فيها، ولا يطيل - أيضاً - الركوع والسجود، قال القرطبي: (ليس معنى هذا أنها شكت في قراءته صلى الله عليه وسلم فيها بأم القرآن … وإنما معنى ذلك أنه كان في غيرها من النوافل يقرأ بالسورة يرتلها حتى تكون أطول من أطول منها، بخلاف فعله في هذا، فإنه كان يخفف أفعالها وقراءتها، حتى إذا نسبت إلى قراءته في غيرها كانت كأنها لم يقرأ فيها …)، وهذا الأمر الأول الذي اختصت به راتبة الفجر، وهو تخفيفها، والحكمة في ذلك - والله أعلم - المبادرة لصلاة الصبح أول وقتها، وبه جزم القرطبي.", "وقيل: ليستفتح صلاة النهار بركعتين خفيفتين، كما كان يستفتح قيام الليل بركعتين، للتفرغ للفرض أو لقيام الليل الذي هو أفضل النوافل المطلقة."]}, "93": {"m": "وَعَنِ ابْنِ عُمَرَرضي الله عنهما: «أَنّ رَجُلا سَأََلَ النّبِيّ صلى الله عليه وسلم عَنْ صَلاةِ اللّيْلِ؛ فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: صَلاةُ اللّيْلِ مَثْنَى مَثْنَى؛ فَإِذَا خَشِيَ أحَدُكُمُ الصُّبْحَ صَلّى رَكْعَةا وَاحِدَةا، تُوتِرُلَهُ مَا قَدْ صَلّى» مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (مثنى مثنى) أي: اثنين اثنين، وقد جاء في رو اية مسلم عن عقبة بن حريث … فقيل لَابن عمر: ما مثنى مثنى؟ قال: (أن تسلم في كل ركعتين)."], "s": ["الحديث دليل على أن صلاة الليل مثنى مثنى، يسلم من كل ركعتين - كما ورد تفسير الحديث عن ابن عمر رضي الله عنهما، في رواية مسلم - ويختمها بركعة واحدة توتر له ما صلى إذا خشي طلوع الفجر، وسيأتي إن شاء الله أن النبي صلى الله عليه وسلم أوتر بخمس وبسبع وبغير ذلك، وقد أخذ العلماء ومنهم مالك بحديث الباب مستدلاً به على تعين الفصل بين كل ركعتين من صلاة الليل، لأن هذا ظاهر السياق، لحصر المبتدأ في الخبر، فهو في قوة: ما صلاة الليل إلا مثنى مثنى، لكن يرد على ذلك فعل النبي صلى الله عليه وسلم كما سيأتي، وذهب الجمهور من أهل العلم إلى أن ذلك لا يلزم، وإنما الحديث لبيان الأفضل، لما سيأتي من فعله صلى الله عليه وسلم بخلافه، أو يقال: إنه مراد به الإرشاد إلى الأخف، لأن السلام من كل ركعتين أخف على المصلي من الأربع فما فوقها، لما فيه من الراحة غالباً، وقضاء ما يعرض من أمر مهم، ولو كان الوصل لبيان الجواز فقط لما واظب عليه الرسول صلى الله عليه وسلم، وقد صح عنه الفصل والوصل.", "ويدل بمفهومه على أن صلاة النهار ليست كذلك، وأنه يجوز أن تصلى أربعاً، كما فعل ابن عمر رضي الله عنهما وهو قول أبي حنيفة وصاحبيه، وإسحاق، وصححه الموفق في «المغني»، واختاره الصنعاني، وكأنهم قالوا بذلك للاختلاف في ثبوت لفظة: (صلاة الليل «والنهار» مثنى مثنى).", "وذهب الجمهور إلى أن صلاة النهار كصلاة الليل مثنى مثنى، أخذاً بهذه الزيادة، ولأنه أبعد من السهو، وأشبه بصلاة الليل وتطوعات النبي صلى الله عليه وسلم، فإن الصحيح في تطوعاته ركعتان، قالوا: وكل حديث ورد فيه ذكر الأربع فالمراد أن يصليها مثنى مثنى.", "والذي يظهر - والله أعلم - أن صلاة النهار موسع فيها، فإن صلى الأربع أحياناً بسلام واحد جاز، وإن سلم من كل ركعتين فهو أفضل، لما تقدم، وأما صلاة الليل فهي مثنى مثنى، لكن لو سرد خمساً أو سبعاً جاز، كما سيأتي إن شاء الله.", "ب- في الحديث دليل على أن وقت الوتر ينتهي بطلوع الصبح، لقوله: (فإذا خشي أحدكم الصبح صلى ركعة واحدة) أي: طلوع الفجر، والله تعالى أعلم."]}, "94": {"m": "وَعَنْ زَيْدِ بْنِ خَالِدٍ الجُهََِيِ رضي الله عنه أَنّهُ قَالَ: «لأََرْمُقَنّ صَلاةَ رَسُولِ اللَّهِ صلى الله عليه وسلم اللّيْلَةَ، فَصَلّى رَكْعَتَيْنِ خَفِيفَتَيْنِ. ثُمّ صَلّى رَكْعَتَيْنِ طَوِيلَتَيْنِ طَوِيلَتَيْنِ طَوِيلَتَيْن
