ِ. ثُمّ صَلّى رَكْعَتَيْنِ وَهُمَا دُونَ اللّتَيْنِ قَبْلَهُمَا. ثُمّ صَلّى رَكْعََتَيْنِ وَهُمَا دُونَ اللّتَيْنِ قَبْلَهُمَا. ثُمّ صَلّى رَكْعَتَيْنِ وَهُمَا دُونَ اللّتَيْنِ قَبْلَهُمَا. ثُمّ صَلّى رَكْعَتَيْنِ وَهُمَا دُونَ اللّتَيْنِ قَبْلَهُمَا. ثُمّ أوْتَرَ؛ فَذَلِكَ ثَلاثَ عَشْرَةَ رَكْعَةا» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (لأََرمُقَنَّ) يقال: رَمَقَ بعينه يَرمُقُ رَمقاً: أطال النظر إلى الشيء.", "قوله: (ثم صلى ركعتين وهما دون اللتين قبلهما...)؛ أي: ثم صلى ثمان ركعات كل ركعتين أقصر من اللتين قبلهما في الطول؛ لأنه إذا استوفى النهاية في النشاط والخشوع أخذ في النقص شيئاً فشيئاً، فيخفف من التطويل على سبيل التدريج.", "قوله: (ثم أوتر)؛ أي: بركعة واحدة، بدليل ما بعده.", "قوله: (فذلك ثلاث عشرة ركعة)؛ أي: مجموع ما ذكر من الركعات ثلاث عشرة ركعة."], "s": ["أ- الحديث دليل على حرص الصحابة على تتبع صفة صلاة النبي ﷺ في الليل لأجل أن يقتدوا به، فهذا زيد بن خالد حرص على معرفة صفة صلاة الرسول ﷺ والاطلاع على أمور قد لا يطلع عليها سائر الناس سوى زوجاته رضي الله عنهن.", "ب- استحباب استفتاح صلاة الليل بركعتين خفيفتين، لما ورد في ذلك من السُّنَّة الفعلية والقولية، أما الفعلية فهذا الحديث وما في معناه، وأما القولية فمثل حديث أبي هريرة عن النبي ﷺ قال: «إذا قام أحدكم من الليل فليفتتح صلاته بركعتين خفيفتين» رواه مسلم، وزاد أبو داود «ثم ليطول بعد ما شاء».", "والحكمة من هذا الاستفتاح بركعتين خفيفتين، لأجل أن ينشط بهما لما بعدهما من الصلاة.", "ج- في هذا الحديث أن النبي ﷺ صلى ثلاث عشرة ركعة، وفي حديث عائشة: (ما كان رسول الله ﷺ يزيد في رمضان ولا في غيره على إحدى عشرة ركعة) قال ابن عبد البر: (وأكثر الآثار على أن صلاته كانت إحدى عشرة ركعة).", "وقد حصل الاختلاف في عدد صلاة النبي ﷺ في الليل، فقد ورد عن عائشة أنه لا يزيد على إحدى عشرة ركعة، وروي عنها أنه صلى ثلاث عشرة ركعة، كما روى ذلك - أيضاً - ابن عباس، وزيد بن خالد.", "والأظهر - والله أعلم - أن صلاته المعتادة الغالبة هي إحدى عشرة ركعة، وأما الثلاث عشرة، فإما أنها في بعض الأوقات، فأدى كل واحد من الرواة ما رأى منه وأخبر بما شاهد، أو على عدِّ الركعتين الخفيفتين اللتين يبدأ بهما صلاته بالليل من جملة صلاته، أو على عدِّ ركعتي الفجر منها، وسيأتي مزيد لهذا في شرح حديث عائشة - إن شاء الله تعالى -.", "د- الحديث دليل على أن صلاة الليل مثنى مثنى، واستحباب السلام من كل ركعتين، وجاء - أيضاً - في حديث عائشة: (كان رسول الله ﷺ يصلي إحدى عشرة ركعة، يسلم من كل ركعتين) وما جاء في بعض الأحاديث أنه ﷺ لا يسلم إلا في الآخرة، فهو محمول على بيان الجواز، والأفضل السلام من كل ركعتين.", "ه- استحباب تطويل صلاة الليل..", "و- الحديث دليل على أن أقل الوتر ركعة واحدة، وأن الركعة الفردة صلاة صحيحة، وقد جاء هذا صريحاً في حديث عائشة أن رسول الله ﷺ كان يصلي بالليل إحدى عشرة ركعة، يوتر منها بواحدة. وفي حديث ابن عمر «صلاة الليل مثنى مثنى، فإذا خشي أحدكم الصبح صلى ركعة واحدة توتر له ما قد صلى» وهذا مذهب الأئمة الثلاثة.", "وقال أبو حنيفة: لا يصح الإيتار بواحدة، ولا تكون الركعة الواحدة صلاة أصلاً؛ لأن النبي ﷺ نهى عن البتيراء. قالوا: والبتيراء الركعة الواحدة.", "والصواب الأول، وأما القول الثاني فكما قال النووي: (إن الأحاديث الصحيحة ترد عليه)، وأما حديثهم فلم يثبت عن النبي ﷺ فلا يعوَّل عليه، والله تعالى أعلم."]}, "95": {"m": "وَعَنْ عَبْدِ اللَّهِ بْنِ عَمْرِو بْنِ العَاصِ ي رضي الله عنهما قَالَ: قَالَ لِي رَسُولُ اللَّهِ صلى الله عليه وسلم: «يَا عَبْدَ اللَّهِ! لَا تَكُنْ مِثْلَ فُلانٍ؛ كَانَ يَقُومُ مِنَ اللّيْلِ فَتَرَكَ قِيَامَ اللّيْلِ» مُتّفَقٌ عَلَيْهِ.", "s": ["أ- هذا الحديث فيه الحث على قيام الليل والترغيب فيه، ووصية الإنسان بألا يتشبه بأهل الكسل الذي يزهدون في القرب والأعمال الصالحة، بل يتشبه بأهل الجد والنشاط والعمل الصالح، وإن كان قيام الليل نافلة، لكنه من أعظم الطاعات وأفضل القرب.", "وقد اشتد حرص عبد الله بن عمرو رضي الله عنهما بعد هذه الوصية على الخير وعظم إقباله على العبادة، فصار يصلي كثيرا، ويتهجد كثيرا، حتى إنه كان لا ينام الليل، فأوصاه النبي صلى الله عليه وسلم بالاقتصاد، وقال له: (ألم أخبر أنك تصوم ولا تفطر، وتصلي ولا تنام؟ فصم وأفطر، وقم ونم، فإن لعينيك عليك حقا، وإن لنفسك وأهلك حقا …) الحديث.", "ب- في الحديث دليل على استحباب الدوام على ما اعتاده المرء من أعمال الخير والطاعة من غير تفريط، وأنه لا ينبغي للإنسان قطع العبادة، لأن هذا قد يشعر بالزهد فيها والرغبة عنها.", "وينبغي للمسلم أن يحذر من التشدد في العبادة وتكليف النفس ما لا تطيق من الطاعات، ومن فعل ذلك غلبه الدين لكثرة الأعمال والطاعات، فيكون آخر أمره العجز والانقطاع، لأن الله تعالى أوجب على عباده وظائف من الطاعات في وقت دون وقت، تيسيرًا ورحمة، ولأن الإنسان إذا أخذ بالقصد دام عمله، وتمكن من أداء الحقوق كلها، حق الله تعالى، وحق النفس، وحق الأهل والأصحاب برفق وسهولة، وقد قال النبي صلى الله عليه وسلم: «إن أحب الأعمال إلى الله أدومها وإن قل».", "فينبغي للإنسان أن يكون له ورد بالليل قدر استطاعته، قال ابن عبد البر: (لا خلاف بين المسلمين أن صلاة الليل ليس لها حد محدد، وأنها نافلة، وفعل خير، وعمل بر، فمن شاء استقل، ومن شاء استكثر)، والله تعالى هو الموفق ولا إله غيره ولا رب سواه."]}, "96": {"m": "وََعَنْ عَاصِمِ بْنِ ضَمْرَةَ، عَنْ عَلِيِ بْنِ أَبِيَ طَالِبٍ رضَي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «يَا أَهْلَ القُرْآنِ! أوْتِرُوا؛ فَإِنّ اللَّهَ وِتْرٌ يُحِبُّ الوِتْرَ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ، وَالنّسَائَِيُّ، وَ ابْنُ مَاجَهْ، وَ ابْنُ خُزَْيمَةَ فِي «صَحِيحِهِ»، وَالتِرْمِذِيُّ - وَقَالَ: «حَدِيثٌ حَسَنٌ غَرِيبٌ»-. وَعَاصِمٌ: مُخْتَلَفٌ فِيهِ. وَلَقَدْ أبْعَدَ مَنْ قَوّى هَذَا الحَدِيثَ بِقَوْلِهِ بَعْدَ ذِكْرِهِ: «وَعَاصِمٌ يُخْرِجُ لَهُ الحَاكِمُ فِي المُسْتَدْركَِ»؛ فَإِنّهُ يُخْرِجُ فِيهِ لِلثِقَةِ، وَالضّعِيفِ، وَالمَتْرُوكِ، وَالمُتّهَمِ.", "s": ["أ-هذا الحديث من أدلة القائلين بوجوب الوتر، لأن قوله: (أوتروا) أمر، والأصل في الأمر الوجوب، لكن هذا اللفظ بصيغة الأمر ليس بمحفوظ، ولو صح فهو محمول على تأكيد الاستحباب، جمعاً بين الأدلة.", "والقول بوجوبه هو قول أبي حنيفة في المشهور عنه وبعض أصحابه، وبه قال بعض السلف، ومن الأدلة - أيضاً - حديث أبي أيوب رضي الله عنه: \"الوتر حق على كل مسلم..\"، وحديث بريدة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «الوتر حق، فمن لم يوتر فليس منا»، وحديث أبي هريرة بنحوه، ووجه الدلالة منهما: أن هذا السياق وعيد شديد، ولا يكون مثله إلا لترك فرض أو واجب.", "وذهب الجمهور من أهل العلم، ومنهم الشافعية والمالكية والحنابلة وأكثر الحنفية إلى أن الوتر ليس بواجب، وإنما هو سنة مؤكدة، واستدلوا بحديث علي رضي الله عنه المتقدم: \"الوتر ليس بحتم\"، كما استدلوا بحديث جابر - أيضا - مع ما فيه من ضعف: «إني خشيت أن يكتب عليكم الوتر»، كما استدلوا بحديث طلحة بن عبيد الله رضي الله عنه قال: جاء رجل من أهل نجد فإذا هو يسأل عن الإسلام، فقال رسول الله - صلى الله عليه وسلم -: «خمس في اليوم والليلة»، فقال: هل علي غيرها؟ قال: «لا إلا أن تطوع»، وسأله عن الزكاة والصيام، وقال في آخره: والله لا أزيد ولا أنقص، فقال النبي صلى الله عليه وسلم: «أفلح إن صدق». فهذا نص صريح في عدم وجوب الوتر، وأنه لا يجب إلا ما دل عليه منطوق الحديث، وهي الخمس، وما زاد عليها فهو تطوع.", "وهذا القول هو الراجح لقوة دليله، ولأنه فيه جمعاً بين الأدلة كلها، وأما أدلة القائلين بالوجوب، فيجاب عنها بأن حديث أبي أيوب مختلف في رفعه ووقفه، وعلى القول بصحة رفعه فليست دلالته على الوجوب بصريحة، لأن لفظة (حق) لا يفهم منها الوجوب؛ لأن كل حكم ثابت بأصل الشرع فهو حق، فيدخل فيه الواجب والمسنون، ولو سلمنا دلالته على الوجوب فهو مصروف بالأدلة الأخرى، وأما أدلتهم الباقية ففيها مقال، وعلى فرض صحتها فهي محمولة على تأكيد سنية الوتر. ب-المراد بأهل القرآن: المؤمنون عامة، من قرأ ومن لم يقرأ، وإن كان من قرأ أولى بالخطاب لحفظه إياه، وقال الخطابي: المراد بهم: القراء والحفاظ، وخصوا بالذكر، لمزيد شرفهم والاهتمام بهم، فينبغي أن يكون لأهل القرآن عناية بالوتر، وإن كان مطلوباً من الجميع، لكن لأهل القرآن مزية على غيرهم، لأنهم قدوة، ولأن عندهم من العلم ما يدعوهم إلى المسارعة إلى فعل الطاعات والقربات ما ليس عند غيرهم، فيكون الأمر في حقهم آكد.", "ج- الحديث دليل على أن الوتر من أسماء الله تعالى، وأنه تعالى يحب ما وافق أسماءه وصفاته، فهو عليم يحب العلم والعلماء العاملين، كريم يحب الكرم والجود، صبور يحب الصابرين، وهكذا في كل ما يوافق أسماءه مما يناسب مقام العبد.", "ومعنى الوتر: الفرد، فالل تعالى واحد لا شريك له ولا نظير له، لا في أسمائه ولا في صفاته، ولا في أفعاله، وهو سبحانه وتر، وجميع خلقه شفع، خلقوا أزواجاً، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق أبي بكر بن عياش، عن أبي إسحاق، عن عاصم بن ضمرة، عن علي رضي الله عنه به مرفوعاً، وقد جاء الحديث من طريق سفيان الثوري وغيره موقوفاً بلفظ: (الوتر ليس بحتم..) وهذا هو المحفوظ، ولهذا قال الترمذي: (وهذا أصح من حديث أبي بكر بن عياش)."]}, "97": {"m": "وَعَنِ ابْنِ عُمَرَرضي الله عنهما، عَنِ النّبِيِ صلى الله عليه وسلم قَالَ: «اجْعَلُوا آخِرَصَلاتِكُمْ بِاللّيْلِ وِتْرا» مُتّفَقٌ عَلَيْهِ.", "s": ["الحديث دليل على أن السنة في صلاة الليل أن تختم بالوتر- كما تقدم - سواء أوترالإنسان في أول الليل، أو في وسطه، أو في آخره.", "وقد حمل الجمهور من أهل العلم الأمر في هذا الحديث على الاستحباب وأنه لا يجب ختم صلاة الليل بالوتر، بل يجوز أن يصلي بعد وتره شيئاً، لما في حديث عائشة رضي الله عنها أن النبي صلى الله عليه وسلم صلى بعد وتره ركعتين، والله تعالى أعلم."]}, "98": {"m": "وَعَنْ أَبِي سَلَمَةَ قَالَ: «سَأَلْتُ عَائِشَةَ رضي الله عنها عَنْ صَلاةِ رَسُولِ اللَّهِ صلَى اللهَ عليه وسلم؛ فَقَالَتْ: كَانَ يُصَلِي ثَلاثَ عَشْرَةَ رَكْعَةا. يُصَلِي ثَمَانَ رَكَعَاتٍ ثُمّ يُوتِرُ. ثُمّ يُصَلِي رَكْعَتَيْنِ وَهُوَجَالِسٌ، فَإِذَا أرادَ أنْ يَرْكَعَ قَامَ فَرَكَعَ. ثُمّ يُصَلِي رَكْعَتَيْنِ بَيْنَ النِدَاءِ وَالإِقَامَةِ مِنْ صَلاةِ الصُّبْحِ» رَوَاهُ مُسْلِمٌ.", "s": ["أ-هذا الحديث ورد في إحدى صفات صلاة النبي ﷺ في الليل، وهو أنه صلى ثلاث عشرة ركعة، صلى ثماني ركعات، ثم أوتر بركعة، فهذه تسع ركعات؛ لما جاء في حديث عائشة - هذا - عند مسلم من طريق شيبان، ومعاوية بن سلام، كلاهما عن يحيى بلفظ: «تسع ركعات قائماً، يوتر منهن» ولفظ النسائي من طريق معاوية عن يحيى: «يصلي ثلاث عشرة ركعة، تسع ركعات قائماً يوتر فيها، وركعتين جالساً، فإذا أراد أن يركع قام فركع وسجد، ويفعل ذلك بعد الوتر» فهذه إحدى عشرة، قالت: ثم يصلي ركعتين بين النداء والإقامة من صلاة الصبح، فهذه ثلاث عشرة ركعة.", "وقد روى البخاري من طريق القاسم بن محمد، عن عائشة قالت: كان النبي ﷺ يصلي من الليل ثلاث عشرة ركعة، منها الوتر وركعتا الفجر. ولعل ذكر الوتر وركعتي الفجر مع صلاة التهجد؛ لأن الظاهر أنه ﷺ كان يصلي الوتر آخر الليل، ويكون مستيقظاً إلى الفجر، ثم يصلي سنة الفجر متصلة بتهجده ووتره.", "ب- الحديث دليل على جواز صلاة ركعتين بعد الوتر، وأن الإنسان لو فعل هذا بمفرده أحياناً فلا بأس؛ لأن الظاهر أن النبي ﷺ لم يكن يداوم على ذلك، قال الأثرم: سمعت أبا عبد الله يُسأل عن الركعتين بعد الوتر، قيل له: قد روي عن النبي ﷺ من وجوه، فما ترى فيهما؟ فقال: أرجو إن فعله إنسان ألا يضيق عليه، ولكن يكون وهو جالس، كما جاء الحديث، قلت: تفعله أنت؟ قال: لا، ما أفعله...).", "وأما قول عائشة: «كان يصلي...» فليس المراد به المداومة على ذلك؛ لأن القاعدة في «كان» أنها تفيد الدوام والتكرار ما لم تقم قرينة على خلاف ذلك، فإن وجد قرينة فليست للدوام. قال النووي: (الصواب أن هاتين الركعتين فعلهما النبي ﷺ بعد الوتر جالساً لبيان جواز الصلاة بعد الوتر، وبيان جواز التنفل جالساً، ولم يواظب على ذلك، بل فعله مرة أو مرتين أو مرات قليلة...).", "ومما يدل على هذا التأويل حديث ابن عمر عن النبي ﷺ قال: «اجعلوا آخر صلاتكم بالليل وترًا» فإن هذا في ظاهره معارض لحديث الباب؛ لأن النبي ﷺ لم يجعل آخر صلاته بالليل وترًا، لكن حمل الجمهور هذا الأمر على الاستحباب، وأنه لا يجب ختم صلاة الليل بالوتر بل يجوز أن يصلي بعد وتره شيئاً، وقد بوب ابن خزيمة في «صحيحه» على حديث عائشة هذا: باب «الرخصة في الصلاة بعد الوتر» ثم قال: باب «ذكر الدليل على أن الصلاة بعد الوتر مباحة لجميع من يريد الصلاة بعده، وأن الركعتين اللتين كان النبي ﷺ يصليهما بعد الوتر لم يكونا خاصة بالنبي دون أمته، إذ النبي ﷺ قد أمرنا بالركعتين بعد الوتر أمر ندب وفضيلة، لا أمر إيجاب وفريضة» ثم ذكر حديث ثوبان قال: كنا مع رسول الله ﷺ في سفر، قال: «إن هذا السفر جَهد وثِقَل، فإذا أوتر أحدكم فليركع ركعتين، فإن استيقظ وإلا كانتا له».", "ولما ذكر ابن المنذر خلاف أهل العلم في الصلاة بعد الوتر، قال: (الصلاة في كل وقت جائزة، إلا وقتاً نهى النبي ﷺ عن الصلاة فيه، والأوقات التي نهى رسول الله ﷺ عن الصلاة فيها وقت طلوع الشمس، ووقت الزوال، ووقت غروب الشمس، والصلاة في سائر الأوقات طَلق مباح، ليس لأحد أن يمنع عنها إلا بحجة، ولا حجة مع من كره الصلاة بعد الوتر، فدل فعله هذا على أن قوله: «اجعلوا آخر صلاتكم وترًا» على الاختيار لا الإيجاب، فنحن نستحب أن يجعل المرء آخر صلاته وترًا، ولا نكره الصلاة بعد الوتر، وقائل هذا قائل بالخبرين جميعاً)، وهذا كلام نفيس، والله تعالى أعلم."]}, "99": {"m": "وَعَنْ مَسْرُوقٍ قَالَ: «سَأَلْتُ عَائِشَةَ رضي الله عنها عَنْ صَلاةِ رَسُولِ اللَّهِ صلى الله عليه وسلم بِاللّيْلِ؛ فَقَالَتْ: سَبْعٌ، وَتِسْعٌ، وَإِحْدَى عَشْرَةَ، سِوَى رَكْعَتَيِ الفَجْرِ» رَوَاهُ البُخَارِيُّ.", "s": ["الحديث دليل على أن صلاة النبي ﷺ في الليل لها صفات متعددة من حيث العدد، فتارة يصلي سبعاً، وتارة تسعاً، وتارة إحدى عشرة، وقد وقع ذلك في أوقات مختلفة، وعن أم سلمة قالت: كان النبي ﷺ يوتر بثلاث عشرة، فلما كبر وضعف أوتر بسبع، قال الترمذي: (وقد روي عن النبي ﷺ الوتر بثلاث عشرة، وإحدى عشرة، وتسع، وسبع، وخمس، وثلاث، وواحدة) قال إسحاق بن راهويه: (معناه: أنه كان يصلي الليل ثلاث عشرة مع الوتر، فنسبت صلاة الليل إلى الوتر).", "وعن عائشة قالت في حديثها عن صلاة النبي ﷺ في الليل: كان يصلي تسع ركعات لا يجلس فيها إلا في الثامنة، فيذكر الله، ويحمده، ويدعوه، ثم ينهض، ولا يسلم، ثم يقوم فيصلي التاسعة، ثم يقعد، فيذكر الله، ويحمده، ويدعوه، ثم يسلم تسليماً يسمعنا، ثم يصلي ركعتين بعدما يسلم وهو قاعد، فتلك إحدى عشرة ركعة، فلما سَنَّ نبي الله ﷺ، وأخذه اللحم أوتر بسبع، وصنع في الركعتين مثل صنيعه الأول، فتلك تسع.", "وعلى هذا فجميع ما ورد عن عائشة من الصفات المختلفة في صلاة النبي ﷺ بالليل فهو محمول على أوقات متعددة وأحوال مختلفة بحسب النشاط وبيان الجواز، والغالب أن صلاته ﷺ إحدى عشرة ركعة مع الوتر بركعة واحدة، لأن الأحاديث فيها أكثر، وبذلك تجتمع الروايات، ولا يرد عليها إشكال. وهذا اختيار الإمام أحمد، والله تعالى أعلم."]}, "100": {"m": "وََعَنْ طَلْقِ بْنِ عَلِيٍ رضي الله عنه قَالَ: سَمِعْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يَقُولُ: «لَا وِتْرَانِ فِي لَيْلَةٍ» رَوَاهُ أَحْمَدُ، وَ أبُو دَاوُدَ، وَالنّسَائِيُّ، وَ ابْنُ حِبّانَ، وَالتِرْمِذِيُّ - وَقَالَ: «حَدِيثٌ حَسَنٌ غَرِيبٌ» -.", "w": ["قوله: (لا وتران في ليلة) نفي بمعنى النهي، فكأنه قال: (لا توتروا مرتين في ليلة)."], "s": ["أ- الحديث دليل على أن الوتر لا يتكرر في الليلة الواحدة مرتين، فمن أوتر أول الليل ثم يسر الله له القيام آخر الليل فإنه يصلي ما كتب له، ويكفي وتره الأول، ولا ينقضه، والمراد بنقضه: أن الإنسان إذا أوتر أول الليل ثم قام من آخر الليل يتهجد بدأ صلاته بركعة واحدة لتشفع الركعة الأولى، وهي ركعة الوتر، ثم يصلي ركعتين، ركعتين، ثم يوتر في آخر صلاته.", "ونقض الوتر موضع خلاف بين أهل العلم، فذهب الجمهور ومنهم الأئمة الأربعة وجمع من الصحابة والتابعين، منهم أبو بكر وأبو هريرة وطلق بن علي راوي الحديث رضي الله عنهم وسعيد بن المسيب، وإبراهيم النخعي وآخرون إلى أنه لا يجوز نقض الوتر، ومن أراد أن يتنفل صلى شفعاً ولا يوتر مرة أخرى.", "وذهب بعض الصحابة والتابعين، ومنهم عثمان وعلي وابن مسعود وابن عمر وابن عباس رضي الله عنهم وابن سيرين إلى جواز نقض الوتر، لحديث: (اجعلوا آخر صلاتكم بالليل وترا).", "والذي يظهر - والله أعلم - أنه لا يلزم نقض الوتر، بل يصلي الإنسان ما كتب له ويبقي وتره الأول، ولَا يوترمرة أخرى لأمرين: الأول: أن النبي صلى الله عليه وسلم صلى ركعتين بعد الوتر، كما تقدم في حديث عائشة رضي الله عنها.", "وهذا دليل واضح على أن قوله: «اجعلوا آخر صلاتكم بالليل وترا» أنه أمر ندب وإرشاد إلى الأفضل وأن الإنسان لا يهمل الإيتار في آخر صلاته، ويؤيد ذلك حديث ثوبان رضي الله عنه قال: كنا مع الرسول صلى الله عليه وسلم في سفر، فقال: «إن هذا السفر جهد وثقل، فإذا أوتر أحدكم، فليركع ركعتين، فإن استيقظ وإلا كانتا له»، وهذا يدل على أن الركعتين بعد الوتر ليستا من خصوصيات النبي صلى الله عليه وسلم، لأنه أمر بهما أمته أمرا عاما.", "الأمرالثاني: أن الإنسان إذا أوتر أول الليل فقد قضى وتره، فإذا هو نام بعد ذلك ثم قام وتوضأ، وصلى ركعة أخرى، فهذه صلاة غير تلك الصلاة، ولا يصيران صلاة واحدة؛ لما بينهما من النوم والحدث والوضوء والكلام.", "وعلى هذا فإن صلى إنسان التراويح فإنه لا ينصرف قبل إمامه، بل يوتر معه، ليحصل على الأجر المستفاد من قوله صلى الله عليه وسلم: «من قام مع الإمام حتى ينصرف كتب له قيام ليلة».", "فإذا رغب أن يصلي ما كتب له وقت السحر، فإنه لا يوتر في آخر صلاته مرة أخرى، بل يكتفي بوتره مع إمامه في صلاة التراويح أول الليل.", "وأجاز أهل العلم لمن صلى مع الإمام التراويح أن ينقض وتره، وذلك بأن يقوم بعد سلام إمامه ويأتي بركعة يشفع بها صلاته مع الإمام، ذكر ذلك ابن قدامة وقال: (إن الإمام أحمد نص على ذلك).", "ولا يؤثر في ذلك اختلاف النية، لأن الإمام نيته الوتر، والمأموم نيته الشفع، فيجب عليه أن يتم صلاته حسب ما نوى أن يصلي، فإذا سلم إمامه انقضت متابعته له، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق ملازم بن عمرو، ثنا عبد الله بن بدر، عن قيس بن طلق، قال: (زارنا طلق بن علي في يوم من رمضان، وأمسى عندنا وأفطر، ثم قام بنا تلك الليلة وأوتر بنا، ثم انحدر إلى المسجد، فصلى بأصحابه، حتى إذا بقى الوتر قدم رجلاً)، فقال: (أوتر بأصحابك، فإني سمعت رسول الله صلى الله عليه وسلم يقول: «لا وتران في ليلة»).", "قال الترمذي: (هذا حديث حسن غريب)، وحسن إسناده الحافظ ابن حجر، وتحسينه لأن فيه قيس بن طلق، وهو متكلم فيه، قال الشافعي: (قد سألنا عن قيس بن طلق، فلم نجد من يعرفه بما يكون لنا قبول خبره)، ونقل الخلال عن الإمام أحمد أنه قال: (غيره أثبت منه)، وقال ابن معين: (قد أكثر الناس في قيس وأنه لا يحتج بحديثه)، وفي رواية عنه: أنه وثقه، كما وثقه العجلي وابن حبان."]}, "101": {"m": "وَعَنْ أُبَيِ بْنِ كَعْبٍ رضي الله عَنه قَالَ: «كَانََ رَسُولُ اللَّهَِ صلى الله عليه وسلم يُوتِرُبِـ {سَبِحِ اسْمَ رَِبكَ الأَعْلَى}، وَ {قُلْ يَا أَيُّهَا الكَافِرُونَ}، وَ {قُلْ هُوَ اللَّهُ أحَدٌ}» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ، وَ ابْنُ مَاجَهْ، وَالنّسَائِيُّ - وَزَادَ: «وََلَا يُسَلِمُ إِلَاّ فِي آخِرِهِنّ» -.", "s": ["أ- الحديث دليل على مشروعية قراءة {سبح اسم ربك الأعلى} في الركعة الأولى من صلاة الوتر، و {قل ياأيها الكافرون} في الثانية، و {قل هو الله أحد} في الثالثة.", "ب- ظاهر الحديث أن النبي صلى الله عليه وسلم كان يسرد ركعات الوتر الثلاث ولا يسلم إلا في آخرهن، وهذا جاء في رواية النسائي كما تقدم، وقد جاء ما يؤيدها، وهو أنه يجوز سرد الثلاث بسلام واحد، والأولى أن يسلم بعد ركعتين، ثم يوتر بواحدة، كما يدل له قوله صلى الله عليه وسلم: «صلاة الليل مثنى مثنى …»، والله أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق سعيد بن عبد الرحمن بن أبزى، عن أبيه، عن أبي بن كعب، به. وهذا الحديث إسناده صحيح، صححه الحاكم، والنووي، وله طرق أخرى عن سعيد بن عبد الرحمن، ومنها رواية النسائي بالزيادة المذكورة: (ولا يسلم إلا في آخرهن)، وقد تفرد بها عبد العزيز بن خالد، عن سعيد بن أبي عروبة، عن قتادة، عن عزرة، عن سعيد بن عبد الرحمن، به، ولم يوثقه أحد، وقال في «التقريب»: (مقبول)، يعني عند المتابعة وإلا فلين الحديث.", "وقد خالفه عيسى بن يونس، وهو ثقة، فرواه عن سعيد بدونها، كما عند النسائي أيضا، وعنده أيضا من طريق زبيد، عن سعيد بن عبد الرحمن بدونها، فتكون زيادة منكرة، على ما قرره الألباني، لكنه صحح الحديث في «صحيح سنن النسائي» بدون استثنائها."]}, "102": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُصَلِي مِنَ اللّيْلِ ثَلاثَ عَشْرَةَ رَكْعَةا، يُوتِرُ مِنْ ذَلِكَ بِخَمْسٍ، لَا يَجْلِسُ فِي شَيْءٍ إِلَاّ فِي آخِرِهَا» رَوَاهُ مُسْلِمٌ.", "s": ["هذه إحدى روايات عائشة -رضي الله عنها- في صفة صلاة النبي -صلى الله عليه وسلم- في الليل، بأنَّه صلَّى ثلاث عشرة ركعة، يوتر من ذلك بخمس ركعات، يسردها، فلا يجلس إلاَّ في آخرها. والذي يستفاد من مجموع الأدلة أنه يجوز العمل بكل ما ورد عنه صلى الله عليه وسلم في صلاة الليل، لأن اختلاف الصفات محمول على أوقات متعددة وأحوال مختلفة بحسب النشاط، وبيان الجواز والتوسعة على الأمة، وقد روى صفة صلاة النبي صلى الله عليه وسلم بالليل عدد من الصحابة كابن عباس وزيد بن خالد وعائشة رضي الله عنهم وبعضهم يذكر ما لا يذكره الآخر، كافتتاحه صلاة الليل بركعتين خفيفتين، فإما أن يكون صلى الله عليه وسلم يفعل هذا تارة وهذا تارة، وإما أن تكون عائشة حفظت ما لم يحفظه غيرها، لملازمتها له ولمراعاتها ذلك ولكونها أعلم الخلق بقيامه بالليل.", "والأفضل للمصلي أن يسلم من كل ركعتين، لأن هذا هو الذي اختاره صلى الله عليه وسلم لأمته، كما في حديث: «صلاة الليل مثنى مثنى»، وهو الأكثر من فعله صلى الله عليه وسلم فإنه كان يصلي إحدى عشرة أو ثلاث عشرة ويسلم من كل اثنتين، ومن اقتدى به ففعل مثل فعله فسرد ثلاثاً أو خمساً أو غير ذلك مما تقدم جاز، لأنه لم يرد عنه نهي عن ذلك، والأفضل فيمن يؤم الناس في رمضان أن يسلم من كل ركعتين، ولا يسرد خمساً أو سبعاً، لأن التسليم أرفق بالناس، وقد يكون لبعض المأمومين حاجة تدعو إلى الانصراف بعد ركعتين أو تسليمتين، أو بعد ثلاث تسليمات، ونحو ذلك، وإن سرد في بعض الأحيان لبيان السنة فلا بأس بذلك."]}, "103": {"m": "وَعَنْهَا رضي الله عنها قَالَتْ: «مِنْ كُلِ اللّيْلِ قَدْ أَوْتَرَرَسُولُ اللَّهِ صلى الله عليه وسلم؛ مِنْ أَوّلِ اللّيْلِ، وَأَوْسَطِهِ، وَآخِرِهِ، فَانْتَهَى وِتْرُهُ إِلَى السّحَرِ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ.", "s": ["دل هذا الحديث على أن الليل كله وقت للوتر، من بعد صلاة العشاء إلى طلوع الفجر - كما تقدم - سواء أوتر في أوله أو وسطه أو آخره.", "وقد ورد عند أبي داود وغيره عنها لما سئلت متى كان يوتر صلى الله عليه وسلم؟ قالت: (كل ذلك قد فعل، أوتر أول الليل، ووسطه، وآخره، ولكن انتهى وتره حين مات إلى السحر).", "وهذا صريح في أن آخر عمله صلى الله عليه وسلم تأخير الوتر إلى آخر الليل، لأنه الأفضل - كما سيأتي إن شاء الله تعالى ـ"]}, "104": {"m": "وَعَنْ أَبِي سَعِيدٍ الخُدْرِيِ رضي الله عنه أَنّ النّبِيّ صلى الله عليه وسلم قَالَ: «أَوْتِرُوا قَبْلَ أَنْ تُصْبِحُوا» رَوَاهُ مُسْلِمٌ.", "s": ["الحديث دليل على أن وقت الوتر قبل طلوع الصبح، فإذا طلع الصبح لم يشرع الوتر لخروج وقته، لأن الوتر عمل الليل فلا يجعل في النهار، فعلى المسلم أن يتحرى بوتره الوقت المناسب الذي يستطيعه أول الليل أو وسطه أو آخره، فإن تيسر له آخر الليل فهو أفضل، والله أعلم."]}, "105": {"m": "وَرَوَى عَنْ جَابِرِبْنِ عَبْدِ اللَّهِ رَضي الله عنهما قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَنْ خَافَ أََنْ لَا يَقُومَ مِنْ آخِرِاللّيْلِ فَلْيُوتِرْأوّلَهُ، وَمَنْ طَمِعَ أنْ يَقُومَ آخِرَهُ فَلْيُوتِرْآخِرَاللّيْلِ؛ فَإِنّ صَلاةَ آخِرِاللّيْلِ مَشْهُودَةٌ، وَذَلِكَ أفْضَلُ».", "s": ["الحديث دليل على أن تأخير الوتر إلى آخر الليل أفضل لمن وثق من نفسه بالاستيقاظ آخر الليل، وأما من لا يثق بذلك فالتقديم له أفضل، وهذه الحالة هي حالة الحزم والاحتياط، والأولى هي حالة العزم والقوة.", "وعن أبي هريرة رضي الله عنه قال: (أوصاني خليلي رسول الله صلى الله عليه وسلم بثلاث: صيام ثلاثة أيام من كل شهر، وركعتي الضحى، وأن أوتر قبل أن أنام).", "ومثل ذلك ورد عن أبي الدرداء رضي الله عنه ـ وكذا أبي ذر رضي الله عنه ـ فهؤلاء الثلاثة أوصاهم النبي صلى الله عليه وسلم بالوتر قبل النوم، ولعل ذلك لعلم النبي صلى الله عليه وسلم بحالهم، وقد ذكر الحافظ ابن حجر أن أبا هريرة كان يراجع حفظه من الأحاديث في أول الليل، ولا يطمع في الاستيقاظ آخره، فأمره النبي صلى الله عليه وسلم بتقديم الوتر.", "وقد ورد عن أبي قتادة رضي الله عنه أن النبي صلى الله عليه وسلم قال لأبي بكر رضي الله عنه: «متى توتر؟»، قال: (أوتر من أول الليل)، وقال لعمر رضي الله عنه: «متى توتر؟»، قال: (آخر الليل)، فقال لأبي بكر: «أخذ هذا بالحذر [أي بالحزم]»، وقال لعمر: «أخذ هذا بالقوة».", "أما من وثق بالقيام فآخر الليل أفضل، لأن صلاة الليل تشهدها الملائكة، فتكون أقرب إلى القبول وحصول الرحمة، ولأن هذا وقت تنزل الله تعالى، ووقت إجابة الدعاء، وقد قال النبي صلى الله عليه وسلم: «ينزل ربنا إلى السماء الدنيا كل ليلة حين يبقى ثلث الليل الآخر، فيقول: من يدعوني فأستجيب له، من يسألني فأعطيه، من يستغفرني فأغفر له حتى ينفجر الفجر».", "ولأن الوتر آخر الليل هو التهجد الذي ذكر الله تعالى في كتابه الكريم، قال تعالى: {ومن الليل فتهجد به نافلة لك عسى أن يبعثك ربك مقاما محمودا} [الإسراء: 79].", "قال الراغب: (المتهجد: المصلي ليلا)، وقال ابن كثير: (التهجد: ما كان بعد نوم، قاله علقمة، والأسود، وابراهيم النخعي، وغير واحد، وهو المعروف في لغة العرب، وكذلك ثبتت الأحاديث عن رسول الله صلى الله عليه وسلم أنه كان يتهجد بعد نومه …)، وقال تعالى: {إن ناشئة الليل هي أشد وطءا وأقوم قيلا} [المزمل: 6] وناشئة الليل: قيام الليل، من نشأ: إذا قام، كما ذكر البخاري عن ابن عباس معلقا بصيغة الجزم.", "قال شيخ الإسلام ابن تيمية: (ناشئة الليل عند أكثر العلماء هو إذا قام الرجل بعد نوم، وليس هو أول الليل، وهذا هو الصواب، لأن النبي صلى الله عليه وسلم هكذا كان يفعل، والأحاديث بذلك متواترة عنه، كان يقوم بعد النوم، لم يكن يقوم بين العشاءين). والله تعالى أعلم."]}, "106": {"m": "وَعَنَْ أَبِي سََعِيدٍ الخُدْرِيِ رَضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَنْ نَامََ عَنِ الوِتْرِأَوْ نَسِيَهُ؛ فَلْيُصَلِ إَِذَا أصْبَحَ أوْ ذَكَرَ» رَوَاهُ أحْمَدُ، وَ أَبُو دَاوُدَ، وَ ابْنُ مَاجَهْ، وَالتِرْمِذِيُّ. وَقَدْ ضَعّفَهُ بَعْضُ الأئِمّةِ، وَرُوِيَ مُرْسَلا، وَإسْنَادُ أبِي دَاوُدَ لَا بَأْسَ بِهِ.", "s": ["الحديث دليل على أن الإنسان إذا نام عن وتره أو نسيه فإنه يصليه إذا ذكره، ويدخل في عمومه ما لو استيقظ بعد طلوع الفجر، فإنه يصليه، وعليه يحمل ما تقدم عن السلف.", "وظاهر الحديث أنه يصلي وتره في النهار كما كان يصليه في الليل، لكن ورد في حديث عائشة رضي الله عنها قالت: (… كان - أي النبي صلى الله عليه وسلم - إذا غلبه نوم أو وجع عن قيام الليل صلى من النهار ثنتي عشرة ركعة …).", "فهذا يدل على أنه إذا قضاه في النهار لا يقضيه على صفته وترا، بل يشفعه بركعة، لفعله صلى الله عليه وسلم، فقد كان وتره إحدى عشرة ركعة، فإذا غلبه نوم أو وجع صلى بالنهار ثنتي عشرة ركعة، وهكذا يفعل من عادته أن يصلي تسعا فيصلي بالنهار عشرا، ومن كان يصلي بالليل سبعا فيصلي بالنهار ثماني ركعات، وهذا هو الأظهر، فإن حديث أبي سعيد مجمل، وحديث عائشة مفسر له، ثم إنه أصح وأثبت من حديث أبي سعيد، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق زيد بن أسلم، عن عطاء بن يسار، عن أبي سعيد الخدري رضي الله عنه مرفوعاً، وقد روي عند الترمذي من طريق عبد الله بن زيد بن أسلم، عن أبيه مرسلا. قال الترمذي: (وهذا أصح من الحديث الأول). وقد روى المرفوع عن زيد بن أسلم ابنه عبد الرحمن بن زيد بن أسلم، وهذه عند الترمذي وابن ماجه وأحمد، وهذا الإسناد ضعيف، لضعف عبد الرحمن بن أسلم، فقد ضعفه الإمام أحمد وابن المديني والنسائي وأبو زرعة وابن حبان، قال ابن خزيمة: (ليس هو ممن يحتج أهل العلم بحديثه، لسوء حفظه، وهو رجل صناعته العبادة والتقشف، ليس من أحلاس الحديث)، وقد مضى الكلام فيه عند الحديث في «أبواب الطهارة».", "لكنه لم ينفرد به، فقد تابعه أبو غسان محمد بن مطرف المدني، عن زيد بن أسلم، به، كما هو عند أبي داود، لكن ليس فيه (إذا أصبح)، وإنما لفظه: (من نام عن وتره أو نسيه فليصله إذا ذكره).", "وأبو غسان ثقة من رجال الجماعة، ولهذا قال الحاكم عن حديثه: (هذا حديث صحيح على شرط الشيخين ولم يخرجاه)."]}, "107": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: «أَوْصَانِي خَلِيلِي صلى الله عليه وسلم بِثَلاثٍ لَا أَدَعُهُنّ حَتّى أَمُوتَ: صَوَْمِ ثَلاثَةِ أَيّامٍ مِنْ كُلِ شَهْرٍ، وََصَلاةِ الضُّحَى، وَنَوْمٍ عَلَى وِتْرٍ» مُتّفََقٌ عَلَيْهِ، وَلَفْظُهُ لِلْبُخَارِي.ِ وَرَوَى مُسْلِمٌ نَحْوَهُ مِنْ حَدِيثِ أبِي الدّرْدَاءِ رضي الله عنه، وَأحْمَدُ وَالنّسَائِيُّ نَحْوَهُ مِنْ حَدِيثِ أبِي ذَرٍرضي الله عنه.", "w": ["قوله: (أوصاني): أي: عهد إليَّ باهتمام يقال: وصَّاه وأوصاه: عهد إليه، وأمره أمرًا مؤكداً.", "قوله: (خليلي) الخليل: هو الصديق الخالص الذي بلغت محبته خلال القلب؛ أي: باطنه. والمراد: النبي ﷺ.", "قوله: (لا أدعهن حتى أموت) أي: لا أتركهن بل أحافظ عليهن مدة حياتي، وهذا يحتمل أن يكون من جملة وصية النبي ﷺ، ويحتمل أنه من اختيار عن نفسه.", "قوله: (صوم ثلاثة أيام من كل شهر) ظاهر الحديث عدم تحديدها بأيام معينة، لكن ترجم البخاري على هذا الحديث في «الصيام» بما يفيد أن المراد بها: الثالث عشر، والرابع عشر، والخامس عشر.", "قوله: (وصلاة الضحى) من إضافة الشيء إلى وقته، وهي الصلاة التي تصلى في وقت الضحى، وهو ما بعد ارتفاع الشمس إلى قبيل الزوال، وفي رواية للبخاري في «الصيام»: «وركعتي الضحى»، وهي رواية مسلم."], "s": ["أ- فضل صيام ثلاثة أيام من كل شهر، سواء أجعلها أيام البيض أم غيرها، والجمهور على استحباب كونها أيام البيض، ويحصل الفضل بصيامها من أول الشهر، وأوسطه، وآخره؛ لأن الحسنة بعشر أمثالها، فيكون كأنه صام الدهر كله.", "ب- فضل صلاة الضحى، وأن أقلها ركعتان، ومن فضلها أنها تجزئ عن الصدقة التي تصبح على مفاصل الإنسان في كل يوم، وهي ثلاثمائة وستون مفصلاً؛ كما ثبت في «صحيح مسلم» من حديث أبي ذر.", "ج- استدل الجمهور من الحنفية والمالكية والشافعية وقول عند الحنابلة بهذا الحديث على أن المداومة على صلاة الضحى مستحبة؛ لأن الوصية بهذه الصلاة دليل بين على استحبابها وفضل المداومة عليها، والصحيح من المذهب عند الحنابلة أن الأفضل عدم المداومة عليها، بل تفعل أحياناً، وتترك أحياناً؛ مستدلين بالأحاديث الدالة على ترك النبي ﷺ لها، وقال شيخ الإسلام ابن تيمية: (من كان مداوماً على قيام الليل أغناه عن المداومة على صلاة الضحى، كما كان النبي ﷺ يفعل، ومن كان ينام عن قيام الليل، فصلاة الضحى بدل عن قيام الليل)، ولا أظن أن هناك دليلاً على هذا التفصيل، لكن كلام الشيخ يشعر بألا يفوته كل منهما، لأن الرسول ﷺ أوص ى بها أبا هريرة ومن ذكر؛ لأنه لم يكن له وِرد بالليل.", "د- فضل الوتر قبل النوم، وهذا في حق من خشي ألا يقوم آخر الليل، فإن طمع أن يقوم فصلاة آخر الليل أفضل - كما تقدم -، ولعل الرسول ﷺ أوص ى هؤلاء الصحابة الثلاثة بذلك؛ لأنه علم من حالهم أن هذا هو المناسب لهم.", "قال الشيخ عبد الرحمن السعدي: (يستحب الوتر أول الليل في صورتين: الأولى: من غلب على ظنه عدم القيام من آخر الليل. الثانية: في قيام أول رمضان الأفضل له متابعة إمامه والوتر معه أول الليل، ويجوز أن يشفعه بركعة بعد سلام الإمام، لكن الأولى ترك شفعه، فإن قام من آخر الليل، صلاها مجردة بلا وتر؛ لأنه كما ورد: «لا وتران في ليلة».", "ه- جواز اتخاذ الرسول ﷺ خليلاً، وأما حديث: «إني أبرأ إلى الله أن يكون لي منكم خليل» فلا يعارض حديث الباب؛ لأن الذي برئ منه الرسول ﷺ أن يتخذ خليلاً من الناس، لا أن يتخذه أحد من الناس خليلاً.", "وقال القرطبي: (وقد عاب بعض الطاعنين على أبي هريرة قوله: خليلي في النبي ﷺ بناء منه على أن النبي ﷺ لم يتخذه ولا أحداً من الخلق خليلاً، وهذا إنما وقع فيه قائله ظناً أن «خليل»؛ بمعنى: مخالل من المخاللة التي لا تكون إلا من اثنين، وليس الأمر كذلك، فإن خليلاً مثل حبيب، لا يلزم فيه من المفاعلة شيء؛ إذ قد يُحَبُّ الكاره)، والله تعالى أعلم."], "t": ["حديث أبي ذر فقد رواه أحمد والنسائي من طريق إسماعيل؛ يعني: ابن جعفر قال: حدثنا محمد بن أبي حرملة، عن عطاء بن يسار، عن أبي ذر قال: أوصاني حبيبي بثلاث لا أدعهن إن شاء الله أبداً: أوصاني بصلاة الضحى، وبالوتر قبل النوم، وبصيام ثلاثة أيامَ من كل شهر. وهذا الحديث رجاله ثقات، وإسناده صحيح إن كان عطاء بن يسار سمع من أبي ذر؛ فقد قال الذهبي: «ما أحسَبُ عطاءً أدرك أبا ذر»، وقال ابن حجر: (أظن فيه انقطاعاً)، ويؤيد هذا أمران: الأول: أن عبد الله بن مسعود هو الذي صلى على أبي ذر، وعطاء لم يسمع من ابن مسعود، كما قاله أبو حاتم والبزار وغيرهما، فيقوى عدم سماعه من أبي ذر؛ لأن سِنَّهُ عند وفاة أبي ذر ثنتا عشرة سنة تقريباً، بناءً على أنه ولد سنة عشرين. الثاني: أن أبا ذر نزل الرََّبذة، وبقي فيها إلى أن توفي سنة اثنتين وثلاثين في أواخر خلافة عثمان."]}, "108": {"m": "وَعَنْ زَيْدِ بْنِ أَرْقَمَ رَضي الله عنه: «أَنّهُ رأََى قَوْما يُصَلُّونَ مِنَ الضُّحَى فِي مَسْجَِدِ قُبَاءٍ، فَقَالَ: أَمَا لَقَدْ عَلِمُوا أَنّ الصّلاةَ فِي غَيْرِهَذِهِ السّاعَةِ أفْضَلُ؛ إِنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: صَلاةُ الأوّ ابِينَ حِينَ تَرْمَضُ الفِصَالُ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (الأوابين) جمع أواب، صيغة مبالغة، والأواب: الرجاع إلى الله تعالى بفعل المأمور واجتناب المحظور.", "قوله: (حين ترمض) بفتح التاء، وسكون الراء، وفتح الميم، من باب «تعب»، يقال: رمضت الفصال: إذا وجدت حر الرمضاء فاحترقت أخفافها، والرمضاء: شدة حرارة الأرض من وقوع الشمس على الرمل وغيره عند ارتفاعها.", "قوله: (الفصال) بكسر الفاء، جمع فصيل، وهو ولد الناقة، سمي بذلك لفصله عن أمه."], "s": ["أ- الحديث دليل على أن أفضل وقت لصلاة الضحى، هو وقت اشتداد حرارة الشمس، وأن هذه صلاة الأوابين، وسميت بذلك لأنهم آبوا ورجعوا إلى طاعة الله وعبادته حينما اشتغل الناس بأمور دنياهم من زراعة وتجارة ونحوهما، وأخلد آخرون إلى الراحة، فيقوم هؤلاء يصلون ويذكرون الله تعالى.", "وأما بداية وقت صلاة الضحى فهو من ارتفاع الشمس بعد طلوعها، لحديث عمرو بن عبسة الطويل، وفيه أن النبي صلى الله عليه وسلم قال له: «صل صلاة الصبح، ثم اقعد عن الصلاة حتى تطلع الشمس حتى ترتفع …». والله تعالى أعلم."]}, "109": {"m": "وَرَوَى عَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُصَلِي الضُّحَى أَرْبَعا، وَيَزِيدُ مَا شَاءَ اللَّهُ».", "s": ["أ- في الحديث دليل على مشروعية صلاة الضحى، وأنها سنة مؤكدة، لأن النبي صلى الله عليه وسلم فعلها، وأوص ى بها أبا هريرة وأبا ذر وأبا الدرداء رضي الله عنهم وتقدمت أحاديثهم، والنبي صلى الله عليه وسلم إذا أوص ى أحداً بشيء، فهي وصية للأمة كلها، وليس خاصاً بذلك الموص ى، وهكذا إذا نهى أو أمر فالحكم عام، إلا أن يقوم دليل على الخصوصية، وبهذا تكون صلاة الضحى ثبت فيها القول والفعل.", "وكونه صلى الله عليه وسلم لم يداوم عليها وإنما يفعلها بعض الأحيان لا ينافي سنيتها، لأن النبي صلى الله عليه وسلم قد يفعل الشيء لبيان مشروعيته، وقد يتركه لبيان عدم وجوبه، وقد يترك الشيء وهو يحب أن يفعله لئلا يشق على أمته، ولهذا قالت عائشة رضي الله عنها: (وإن كان ليدع العمل وهو يحب أن يعمل به، خشية أن يعمل به الناس فيفرض عليهم) كما تقدم.", "وعلى هذا فالظاهر استحبابها مطلقاً، لما ورد من الأدلة الكثيرة في الترغيب فيها، لا ترك المداومة عليها، كما هو المذهب عند الحنابلة، لأنه صلى الله عليه وسلم لم يداوم عليها خشية أن تفرض على الأمة، فيغلب جانب الأدلة التي تدل على فضلها. وذهب فريق من أهل العلم، منهم شيخ الإسلام ابن تيمية إلى أن من كان عادته قيام الليل فإنه لا يسن له أن يصلي الضحى، ومن لم تكن عادته قيام الليل سن في حقه أن يصلي الضحى.", "وذهب فريق ثالث إلى أنها لا تشرع إلا لسبب، كالقدوم من سفر ونحوه، إلى غير ذلك من الأقوال، وقد أوصلها ابن القيم إلى ستة أقوال، ولخصها الشوكاني.", "والقول الأول هو الأظهر، وهو استحبابها مطلقاً، وقد اختار ذلك الشوكاني، والشيخ عبد العزيز بن باز، فقال: (صلاة الضحى سنة مؤكدة، فعلها النبي صلى الله عليه وسلم، وأرشد إليها أصحابه) وقال: (لو صليتها يوما وتركتها يوما فلا بأس، ولكن الأفضل المداومة، لأن الرسول صلى الله عليه وسلم قال: «إن أحب العمل إلى الله ما دام عليه صاحبه وإن قل»). ومما يؤيد سنيتها مطلقاً، حديث أبي ذر رضي الله عنه عن النبي صلى الله عليه وسلم قال: «يصبح على كل سلامى من أحدكم صدقة، فكل تسبيحة صدقة، وكل تحميدة صدقة، وكل تهليلة صدقة، وكل تكبيرة صدقة، وأمر بالمعروف صدقة، ونهي عن المنكر صدقة، ويجزئ من ذلك ركعتان يركعهما من الضحى».", "والسلامى: بضم السين، مفرد، جمعه: سلاميات، وهي مفاصل الأصابع، ثم استعمل في جميع عظام البدن ومفاصله، وقد ثبت عنه صلى الله عليه وسلم أنه قال: «إن الله خلق ابن آدم على ستين وثلاثمائة مفصل».", "فهذا دليل على عظم فضل صلاة الضحى، وأنها باب عظيم من أبواب شكر الله تعالى على نعمه، ومنها نعمة البدن، وأن هاتين الركعتين تجزيان عن ثلاثمائة وستين صدقة، وما كان كذلك فهو حقيق بالمواظبة وجدير بالمداومة.", "وعن أبي الدرداء وأبي ذر رضي الله عنهما عن رسول الله صلى الله عليه وسلم عن الله عز وجل أنه قال: (ابن آدم اركع لي من أول النهار أربع ركعات أكفك آخره)، والله تعالى أعلم."]}, "110": {"m": "وَعَنْ جَابِرِبْنِ عَبْدِ اللَّهِ رضي الله عنهما قََالَ: «كَانَ رََسُولُ اللَّهِ صلى الله عليه وسلم يُعَلِمُنَا الَاسْتِخَارَةَ فِي الأُمُورِ، كََمَا يُعَلِمُنَا السُّورَةَ مَِنَ القُرْآنِ؛ يَقُولُ: إِذََا هََمّ أحَدُكُمْ بِالأمْرِ فَلْيَرْكَعْ رَكْعَتَيْنِ مِنْ غََيْرِ الفَرِيضَةِ، ثُمَّ لْيَقُلِ: اللّهُمّ إِنِي أسْتَخِيرُكَ بِعِلْمِكَ، وَأسْتَقْدِركََُ بِقُدْرَِتكَ،َ وَأسْألُكَ مِنْ فَضْلِكَ العَظِيمِ؛ فَإِنّكََ تَقْدِرُوَََلَا أقْدِرُ، وَتَعْلَمَُ وََلَا أعْلَمُ، وَ أنْتَ عَلاّمُ الغُيُوبِ، اللّهُمّ إِنْ كُنْتَ تَعْلَمُ أنّ هَذَا الأمْرَخَيْرٌَلِي فِي دِينِي وَمَعَاشِي وَعَاقِبَةِ أمْرِي - أوْ قَالَ: عََاجِلِ أَمْرِي وَآجِلِهِ -؛ فَاقَْدُرْهُ لِي، وَيَسِرْهُ لِي، ثُمّ بَارِكْ لِي فِيهِ، وَإِنْ كُنْتَ تَعْلَمُ أنّ هَذَا الأَمْرَشَرٌّلِي فِي دِيَنِي وَمَعَاشِي وَعَاقِبَةِ أمْرِي - أوْقَالَ: فِي عَاجِلِ أمْرِي وَآجِلِهِ -؛ فَاصْرِفْهُ عَنِي وَاصْرِفْنِي عَنْهُ، وَ اقْدُرْلِيَ الخَيْرَحَيْثَُ كَانَ، ثُمّ أرْضِنِي، قََالَ: وَيُسَمِي حَاجَتَهُ» رَوَاهُ البُخَارِيُّ. وَرَوَاهُ التِرْمِذِيُّ عَنِ الشّيْخِ الّذِي رَوَاهُ عَنْهُ البُخَارِيُّ؛ وَعِنْدَهُ: «ثُمّ أرْضِنِي بِهِ». وَعِنْدَ أبِي دَاوُدَ - وَهُوَ رِوَ ايَةٌ لِلْبُخَارِيِ -: «ثُمّ رَضِنِي بِهِ».", "w": ["قوله: (يعلمنا الاستخارة) الاستخارة: مصدر استخار، والسين للطلب، يقال: استخار الله: طلب منه الخيرة، وخار الله له: أعطاه ما هو خير له، والمراد: طلب خير الأمرين لمن احتاج إلى أحدهما.", "وقوله: (في الأمور) هذا عام أريد به الخصوص؛ لأنه لا يستخار في فعل واجب، ولا مندوب، ولا في ترك محرم، ولا مكروه، إلا إن كان الواجب أو المندوب موسعاً وقته، غير معين، فالاستخارة في تعيين وقته، لا بالنسبة لأصل فعله؛ لأنه خير قطعاً، كما لو استخار في حج النفل، أو استخار في الزواج، فيكون الحديث في المباح؛ كأن يريد أن يعمل مباحين، ولا يدري أيهما خير له، أو يريد أن يعمل مندوبات لا يعرف أيها خير له.", "قوله: (كما يعلمنا السورة من القرآن)؛ أي: إن النبي ﷺ كان يعتني بشأن الاستخارة، لعموم نفعها، وعظيم أثرها، كما يعتني بالسورة من القرآن. وقد اختلف العلماء في وجه الشبه على أقوال: القول الأول: أن وجه الشبه: عموم الحاجة في الأمور كلها إلى الاستخارة، كعموم الحاجة إلى القرآن في الصلاة. القول الثاني: أن وجه الشبه: العناية بحفظ الدعاء وعدم الزيادة أو النقص أو الإخلال بالترتيب كما هو الشأن في القرآن.", "قوله: (إذا هَمَّ أحدكم بالأمر) الهَمُّ: هو الخاطر أول ما يرد على القلب، والظاهر أن هذا غير مراد، وإنما المراد بالهَمِّ هنا: الإرادة والقصد والعزيمة؛ أي: إذا قصد أحدكم الأمر المهم المخير بين فعله وتركه، وتردد في أنه خير في ذاته، أو في إيقاعه في ذلك الوقت، أو في تأخيره عنه؛ إذ لو حمل على المعنى الأول لاستخار في كل خاطر يرد عليه، ويؤيد المعنى الثاني ما جاء في حديث ابن مسعود: «إذا أراد أحدكم أمرًا فليقل...».", "والمراد بالأمر: ما يشمل أمور الدنيا والآخرة، مثل: الحج، والسفر، والزواج، والتجارة، والمشاركة، ونحو ذلك.", "قوله: (فليركع ركعتين من غير الفريضة)؛ أي: فليصل ركعتين، وهذا أمر ندب، وفيه احتراز من صلاة الصبح؛ لأنها ركعتان.", "قوله: (ثم ليقل...) ظاهر هذا أن الدعاء يكون بعد السلام؛ لأن (ثم) للترتيب والمهلة، فيكون المراد بالمهلة هنا تأخير الدعاء لما بعد السلام، وسيأتي ذلك.", "قوله: (اللهم إني أستخيرك بعلمك)؛ أي: أسألك أن تشرح صدري لخير الأمرين؛ بسبب علمك المحيط بكل شيء.", "قوله: (وأستقدرك بقدرتك)؛ أي: أسألك أن تُقَدِّرني على أصلح الأمرين، فإنك قادر على إقداري عليه.", "قوله: (خير لي في ديني ومعاشي) زاد أبو داود: «ومعادي»؛ أي: في ديني وعيشتي في هذه الدار، بأن لا يترتب عليه نقص ديني ولا دنيوي، فيكون المراد بالمعاش: الحياة، بدليل رواية أبي داود، قال ابن سيده: (العيش: الحياة. عاش عيشاً وعيشةً ومعيشاً ومعاشاً. والمعاش.. ما يُعاش به..)(١)، وعلى هذا فيحتمل أن المراد في الحديث الحياة، أو ما يعاش به، وقدم الدين؛ لأنه الأهم في جميع الأمور؛ لأنه إذا سلم الدين فالخير حاصل، وإذا اختل الدين فلا خير بعده.", "قوله: (وعاقبة أمري، أو قال: عاجل أمري وآجله) هذا شك من الراوي، هل قال الرسول ﷺ هذا أو هذا، والمعنى واحد، لكن الراوي ذكر هذا من باب التحري في النقل، ولم تختلف الطرق في ذلك، وهذا فيه إطناب؛ لأن قوله: (ديني ومعاشي) شامل لهذا، كذا قيل، قال ابن القيم وهو يتحدث عن الدعوات والأذكار التي وردت بألفاظ مختلفة: (ومثال ما يترجح في أحد الألفاظ حديث الاستخارة، فإن الراوي شك. هل قال النبي ﷺ: «اللهم إن كنت تعلم أن هذا الأمر خير لي في ديني ومعاشي وعاقبة أمري» أو قال: «وعاجل أمري وآجله» بدل «وعاقبة أمري» والصحيح اللفظ الأول، وهو قوله: «وعاقبة أمري»؛ لأن عاجل الأمر وآجله هو مضمون قوله: «ديني ومعاشي وعاقبة أمري» فيكون الجمع بين المعاش وعاجل الأمر وآجله تكراراً، بخلاف ذكر المعاش والعاقبة، فإنه لا تكرار فيه؛ فإن المعاش هو عاجل الأمر، والعاقبة آجله...).", "قوله: (فاقدره لي) أي: اقضه لي واجعلني قادراً عليه.", "قوله: (ويسره لي)؛ أي: سهل لي أسبابه بحيث أناله بلا مشقة ولا كلفة؛ لأن المقدر قد يكون معه نوع مشقة، وفيه إشارة إلى أنه لا يحصل شيء إلا بسبب.", "قوله: (ثم بارك لي فيه)؛ أي: اجعل لي فيه البركة، وذلك بنموه وزيادته، ونمو آثاره وسلامتها من جميع القواطع.", "قوله: (فاصرفه عني)؛ أي: لا تقض لي به، ولا ترزقني إياه، وذلك بأن تهيئلي الأسباب التي تصرف قلبي عنه وتثني عزمي عن فعله.", "قوله: (واصرفني عنه)؛ أي: لا تبق في باطني اشتغالاً به، بل أزله من خاطري، حتى لا يتردد في ذهني بعد ذلك. وهذا على أن الجملة الثانية مؤسسة، وقيل: إنها تأكيد للأولى؛ لأنه يلزم من صرفه عنك صرفك عنه وعكسه(٢). قال ابن القيم: (والصرف متضمن إلقاء داعية الفعل في القلب، أو إلقاء داعية الترك فيه، ومتى حصلت داعية الفعل حصل الفعل، وداعية الترك امتنع الفعل)(٣).", "قوله: (واقدر لي الخير حيث كان) بضم الدال وكسرها؛ أي: قدر لي فعل ما فيه خير لديني ودنياي ويسره لي في أي مكان وفي أي وقت، ولم يقل هنا «ويسره لي» إشارة إلى أن الخير العام لا بد في حصوله من مشقة وتعب غالباً ودائماً، بخلاف ما سبق فإنه خير خاص وانتفاء المشقة عنه كثير.", "قوله: (ثم أرضني) هكذا في «المحرر» والذي في البخاري في «التهجد» (ثم أرضني به) وفي «الدعوات» و«التوحيد»: (ثم رضني به)؛ والمعنى: اجعلني راضياً به قانعاً.", "قوله: (قال: ويسمي حاجته) فاعل (قال) ضمير يعود إلى النبي ﷺ، وأعاد لفظة (قال) لطول الكلام، وفي رواية معن بن عيسى: «ثم يسميه بعينه» وظاهر هذا أنه ينطق به، ويحتمل أن يكتفي باستحضاره بقلبه عند الدعاء، والأول أقرب لظاهر اللفظ."], "s": ["أ- في الحديث دليل على كمال هذه الشريعة ورعايتها لمصالح العباد، فقد جاء في هذا الحديث تعليم النبي ﷺ لأمته دعاء الاستخارة الذي هو محض مصلحة للعباد.", "ب- في مشروعية صلاة الاستخارة ودعائها رد وإبطال لما كان يفعله أهل الجاهلية من التكهن والتطير والاستقسام بالأزلام لمعرفة الخير والشر، والأمر والنهي، والإقدام والإحجام في شؤون الحياة، فلما جاء الإسلام قطع هذه الوسائل وحكم عليها بأنها من طوالع الشرك والشقاء وفراغ النفس من المعتقد الصحيح، وأبدل المسلمين بالاستخارة الشرعية التي يظهر فيها تحقيق التوحيد، وتسليم الأمر الله تعالى، كما سيأت.", "ج- عناية النبي ﷺ بصلاة الاستخارة ودعائها إذ جعلها تالية لصلاة الفريضة وللقرآن، فكان ﷺ يعلم الصحابة دعاء الاستخارة بألفاظه وترتيبه كما يعلمهم القرآن، ويستفاد من هذا أنه لا يشرع افتتاح دعاء الاستخارة بالحمد لل والصلاة على رسول الله ﷺ ولا ختمه بذلك خلافاً لما قاله النووي - إذ لو كان هذا مستحباً لما ترك النبي ﷺ بيانه، وعلى هذا فيقتصر على النص الوارد، ولا يزاد عليه.", "د- ظاهر الحديث أن الاستخارة سنة إذا همَّ الإنسان بشيء، ولم يتبين له رجحان فعله أو تركه، أما ما تبين له رجحان فعله أو تركه فلا تشرع فيه الاستخارة، وظاهر الحديث - أيضاً - أن المخاطب بالاستخارة هو صاحب الأمر، وليس للإنسان أن يصليها لغيره.", "و- ظاهر قوله: (من غير الفريضة) أن سُنَّة الاستخارة لا تتحقق بوقوع الدعاء بعد الفريضة كصلاة الفجر - مثلاً - لأن هذا تقييد في النص، فيجب المصير إليه. ولا مانع من أن يستخير في صلاة واحدة لأكثر من أمر.", "ز- أن صلاة الاستخارة ركعتان، وهذا قول الجمهور، إلا أن الشافعية أجازوا أكثر من ركعتين، واعتبروا التقييد بركعتين لبيان أقل ما تحصل به، والأول أظهر. وإن صلى راتبة أو تحية مسجد أو غيرها من النوافل ونوى بذلك الاستخارة حصل له بذلك سنة صلاة الاستخارة، لكن لا بد من نية سابقة للصلاة، فإن لم تحصل نية الاستخارة إلا بعد الصلاة أو في أثنائها لم تجزئ عن ركعتي الاستخارة، والأولى أن يركع ركعتين بنية الاستخارة، لظاهر قوله: (فليركع ركعتين من غير الفريضة...).", "ح- استدل بعض العلماء بقوله ﷺ: «من غير الفريضة» على أن الأمر بصلاة الاستخارة ليس على الوجوب، وإنما هي سُنَّة، ويؤيد هذا الأحاديث الدالة على انحصار فرض الصلاة بالصلوات الخمس، قال الحافظ: (وكأنهم فهموا أن الأمر في الحديث للإرشاد، فعدلوا به عن سنن الوجوب...). وهذا فيه نظر، فقد يقال: إن الأمر في قوله: (فليركع) للوجوب، ولا صارف له فيما يظهر، وحديث انحصار فرض الصلاة في الخمس لا يعارض هذا؛ لأن صلاة الاستخارة من ذوات الأسباب، والقاعدة: أن كل صلاة ذات سبب فإنها تشرع عند وجود السبب، ومع أن الحافظ العراقي يميل إلى الوجوب، إلا أنه لم يقف على أحد من أهل العلم قال بوجوبها.", "ط- ظاهر الحديث أن صلاة الاستخارة تصلى في جميع الأوقات؛ لأن النبي ﷺ لم يعين لها وقتاً، وعلى هذا فتصلى في وقت النهي، وبه قال جمع من أهل العلم، وأجازت الشافعية صلاتها في الحرم المكي في أوقات النهي، قياساً على ركعتي الطواف، ومنع الجمهور من صلاتها في وقت النهي، لعموم أحاديث النهي. والذي يظهر - والله أعلم - أنه إن كان في الأمر سعة، فإنه لا يصلي في وقت النهي، وإن لم يكن في الأمر سعة وخشي الفوات فلا بأس أن يصلي في وقت النهي.", "ي- ذكر ابن أبي جمرة رحمه الله تعالى أن الحكمة في تقديم الصلاة على دعاء الاستخارة أن المراد حصول الجمع بين خيري الدنيا والآخرة، وهذا يحتاج إلى قرع باب الملك، ولا شيء لذلك أنجع ولا أنجح من الصلاة؛ لما فيها من تعظيم الله تعالى والثناء عليه والافتقار إليه في الحال والمآل.", "ك- استدل العلماء بقوله: (فليركع ركعتين من غير الفريضة، ثم ليقل) على أن الدعاء يكون بعد الفراغ من الصلاة؛ لأن (ثم) دالة على انتقال الفاعل من الصلاة عند تمامها إلى حال الدعاء؛ لأنها تدل على الترتيب والمهلة. وقال شيخ الإسلام ابن تيمية: (يجوز الدعاء في صلاة الاستخارة وغيرها قبل السلام وبعده، والدعاء قبل السلام أفضل، فإن النبي ﷺ أكثر دعائه كان قبل السلام، والمصلي قبل السلام لم ينصرف، فهذا أحسن، والله تعالى أعلم)، وعلى هذا فيقال: إن الترتيب في قوله: «ثم ليقل...» إنما هو بالنسبة لأذكار الصلاة ودعائها، فيقوله بعد الفراغ وقبل السلام.", "ل- يرى الجمهور من أهل العلم من الحنفية والمالكية والشافعية أن صلاة الاستخارة يشرع تكرارها إذا لم يتبين شيء في المرة الأولى، واستدلوا بحديث أنس قال: قال رسول الله ﷺ: «يا أنس إذا هممت بأمر، فاستخر ربك فيه سبع مرات، ثم انظر إلى الذي يسبق قلبك، فإن الخير فيه»، واختار هذا الشيخ محمد بن عثيمين إلا أنه قال: يستخير ثلاث مرات؛ لأن من عادة النبي ﷺ أنه إذا دعا دعا ثلاثاً والاستخارة دعاء.", "وقد يقال إنها تصلى مرة واحدة، ولا دليل على تكرارها، وإنما ينبغي له بعد الاستخارة أن يستشير أهل الرأي والصلاح، وما أشاروا به فهو الخير إن شاء الله؛ لأن الله تعالى قد لا يجعل في قلبه بالاستخارة ميلاً إلى شيء معين حتى يستشير، فيجعل الله تعالى ميل قلبه بعد المشورة. وأما قياس تكرار صلاة الاستخارة على تكرار الدعاء ثلاثاً فالظاهر أنه قياس مع الفارق؛ لأن دعاء الاستخارة دعاء مخصوص، عقب صلاة خاصة به، ففارق بذلك دعاؤها غيره من الأدعية، والعلم عند الله تعالى. يقول شيخ الإسلام ابن تيمية: (ما ندم من استخار الخالق، وشاور المخلوقين، وتثبت في أمره، فقد قال تعالى: ﴿وَشَاوِرهُم فِي الأَمرِ فَإِذَا عَزَمتَ فَتَوَكَّل عَلَى اللَّهَِّ﴾ [آل عمران: ١59] وقال قتادة: «ما تشاور قوم يبتغون وجه الله إلا هُدُوا لأرشد أمرهم».", "م- ليس في الحديث ما يدل على اشتراط انشراح النفس بعد الاستخارة، ولكن الله تعالى قد ينزل في قلب عبده إذا استخار ميلاً إلى أحد الأمرين، فينشرح صدره، ويستقر عليه، فإن لم يحصل له شيء من ذلك، ففي المسألة ثلاثة أقوال: الأول: أنه يمضي إلى ما أراد، سواء انشرحت نفسه أم لا، وهذا قول العز بن عبد السلام، والحافظ العراقي، وتلميذه الحافظ ابن حجر. وقال العز بن عبد السلام: يفعل ما اتفق، وذلك لأن فائدة الاستخارة أن ييسر الله تعالى لعبده المستخير ما هو الأصلح له، فإذا اتفق له شيء ما وتيسر له بعد الاستخارة، فهذا إشارة إلى أن الله تعالى استجاب له، فلا ينبغي أن يتوقف في تنفيذ ذلك، إذ هو الأصلح. والقول الثاني: أنه يمضي بعد الاستخارة لما ينشرح له صدره، وهذا قول النووي، مستدلاً بحديث أنس المتقدم - أن رسول الله ﷺ قال: «يا أنس، إذا هممت بأمر، فاستخر ربك فيه سبع مرات، ثم انظر إلى الذي يسبق قلبك، فإن الخير فيه»، إلا أنه حديث ضعيف جداً، لا تقوم به حجة. القول الثالث: أنه يعيد الاستخارة مرة ثانية وثالثة - كما تقدم - ثم بعد ذلك إن لم يتبين له شيء استشار أهل الرأي والصلاح، وما أشاروا به فهو الخير إن شاء الله، وهذا قول الشيخ محمد بن عثيمين.", "ن- يظهر في الاستخارة تحقيق معنى العبادة لل تعالى المتضمن الخضوع لل تعالى وإظهار الضعف والافتقار، والإيمان بأن الله تعالى بيده مقاليد الأمور، وهو عالم غيب السماوات والأرض، وفيه الثقة بالل تعالى، والرضا بقضائه، والتوكل عليه، وفيه الاطمئنان وراحة البال والمخرج من الحيرة والشك، ثم فيها استجابة الله دعاء عبده وتوفيقه لما فيه صلاحه في معاشه ومعاده، وفي الاستخارة امتثال للسُّنَّة المطهرة وتحصيل لبركتها، إلى غير ذلك من فوائدها العظيمة.", "س- في الحديث دليل على أن الشر من تقدير الله تعالى على العبد؛ لأنه لو كان العبد يقدر على اختراعه لقدر على صرفه عنه، ولم يحتج إلى طلب صرفه عنه، وفي هذا رد على القدرية القائلين إن العبد مستقل بعمله في الإرادة والقدرة، وليس لمشيئة الله تعالى وقدرته فيه أثر، وهذا مذهب باطل يرده الشرع والعقل.", "ع- فضيلة التوسل بأسماء الله تعالى الحسنى وصفاته العليا. يقول ابن القيم: (تضمن هذا الدعاء الإقرار بوجوده سبحانه، والإقرار بصفات كماله من كمال العلم والقدرة والإرادة، والإقرار بربوبيته، وتفويض الأمر إليه، والاستعانة به، والتوكل عليه، والخروج من عهدة نفسه، والتبرِّي من الحول والقوة إلا به، واعتراف العبد بعجزه عن علمه بمصلحة نفسه وقدرته عليها، وإرادته لها، وأن ذلك كله بيد وليه وفاطره وإلهه الحق)، والله تعالى أعلم.", "* * *"]}, "111": {"m": "عَنْ أَبِي هُرَْيرَةَ رُضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إِذَا قََرََأ ابْنُ آدَمَ السّجْدَةَ اعْتَزَلَ الشّيْطَانُ يَبْكِي، يَقُولُ: يَا وَيْلِي! أمِرَابْنُ آدَمَ بِالسُّجُودِ فَسَجَدَ فَلَهُ الجَنّةُ، وَأُمِرْتُ بِالسُّجُودِ فَأبَيْتُ فَلِيَ النّارُ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (سجود التلاوة) من إضافة الشيء إلى سببه، والإضافة بمعنى اللام، وقد يكون الاستماع سبباً للسجود، لكن لما كانت التلاوة هي الأصل؛ لأنها إذا لم توجد لم يوجد استماع، اقتصر على إضافة السجود للتلاوة، وقوله: (والشكر)؛ أي: وسجود الشكر، والإضافة فيه من إضافة الشيء إلى نوعه؛ لأن هذا السجود نوع من الشكر.", "قوله: (إذا قرأ ابن آدم السجدة) على حذف مضاف؛ أي: آية السجدة، والمراد سجود التلاوة. وفي بعض النسخ زيادة: (فسجد) وهو الموافق لرواية مسلم أي: وضع جبهته على الأرض، وأصل السجود: التذلل والخضوع.", "قوله: (اعتزل) أي: تنحى وتباعد.", "قوله: (الشيطان) هو اسم لكل عاتٍ من الجن والإنس والحيوان، والمراد هنا: إبليس كما سيأتي.", "قوله: (يبكي) جملة في محل نصب حال من فاعل (اعتزل) وكذلك جملة (يقول) وهذا البكاء حقيقي؛ لأن إبليس جسم، وهذا البكاء ليس ندماً على المعصية ولا رجوعاً عنها، وإنما ذلك لفرط حسده وغيظه، وألمه مما أصابه من دخول أحد من ذرية آدم الجنة، ونجاته بالسبب الذي عص ى هو به.", "قوله: (يا ويلي) من الويل وهو الحزن والهلاك، وهي كلمة تقال: لمن وقع في هلكة. و (يا) للنداء؛ أي: يا حزني ويا هلاكي احضر فهذا أوانك.", "قوله: (وأمرت بالسجود فأبيت)؛ أي: لما أمر الله تعالى الملائكة بالسجود لآدم سجدوا إلا إبليس، كما دل على ذلك القرآن في قوله تعالى: ﴿وَِإذ قُلنَا لِلمَلائِكَةِ اسجُدُوا لآِدَمَ فَسَجَدُوا إِلاَّ إِبلِيسَ أَبَى وَاستَكبَرَ وَكَانَ مِنَ الكَافِرِينَ﴾."], "s": ["أ- استدل بهذا الحديث من قال بوجوب سجود التلاوة و أنه لَا يجوز تركه، وهذا مذهب الحنفية، ورواية عن الإمام أحمد، اختارها شيخ الإسلام ابن تيمية، وعن أحمد رواية أنه واجب في الصلاة سُنَّة خارجها. ووجه الدلالة: أن قوله: (أمر ابن آدم) دليل على أن سجود التلاوة مأمور به، كما كان السجود لآدم؛ لأن كليهما فيه أمر، فمن سجد كان متشبهاً بالملائكة، ومن أبى تشبه بإبليس، بل هذا سجود لل، فهو أعظم من السجود لآدم، وقوله: (أمر ابن آدم) وإن كان حكاية لقول إبليس، لكن النبي ﷺ أخبر بذلك ولم ينكره. وأما الرواية المذكورة عن أحمد فلعل مستنده فيها مواظبة النبي ﷺ على السجود في الصلاة، بخلاف خارج الصلاة.", "والقول الثاني: أن سجود التلاوة ليس بواجب، بل هو سُنَّة، وهذا قول الجمهور من أهل العلم، ومنهم الأئمة الثلاثة: مالك، والشافعي، وأحمد في المشهور عنه، واستدلوا بقول عمر: (يا أيها الناس إنا نمر بالسجود، فمن سجد فقد أصاب، ومن لم يسجد فلا إثم عليه...).", "ووجه الدلَالة من وجهين:", "الأول: أن قوله: (ومن لم يسجد فلا إثم عليه) واضح في عدم الوجوب؛ لأن نفي الإثم عمن ترك الفعل مختاراً يدل على عدم وجوبه، وكذلك قوله: (إن الله لم يفرض السجود إلا أن نشاء) كما في تمام الحديث.", "الثاني: أن هذا كان بحضرة الجمع الكثير من الصحابة من المهاجرين والأنصار فلم ينكر ذلك عليه أحد، ولا نُقل خلافه، فهذا يدل دلالة ظاهرة على إجماع الصحابة على أنه ليس بواجب. ومن الأدلة - أيضاً - على عدم وجوب سجود التلاوة حديث زيد عندما قرأ سورة النجم على النبي ﷺ فلم يسجد فيها، ولم يأمره النبي ﷺ بالسجود، ولو كان واجباً لأمره به؛ لأن النبي ﷺ لا يؤخر البيان عن وقت الحاجة. وهذا القول هو الراجح، لقوة أدلته وصراحتها في المراد، وضعف ما يرد عليها من اعتراض. وأما حديث أبي هريرة فهو غير ناهض على القول بالوجوب؛ لأنه إخبار عن السجود الواجب، وليس بخصوص سجود التلاوة، كما قال ابن العربي، ثم إن الأمر إما وجوب أو استحباب، وقد صرف عن الوجوب بما ورد في حديث عمر وزيد.", "ب- في هذا الحديث إشارة إلى قوله تعالى: ﴿وَِإذ قُلنَا لِلمَلائِكَةِ اسجُدُوا لآِدَمَ فَسَجَدُوا إِلاَّ إِبلِيسَ أَبَى وَاستَكبَرَ وَكَانَ مِنَ الكَافِرِينَ﴾ [البقرة: ٣٤]، وقد نقل القرطبي في «تفسيره» اتفاق العلماء على أن سجود الملائكة لآدم لم يكن سجود عبادة، وإنما هو سجود تحية وسلام وإكرام، فسجدوا طاعة لل تعالى؛ لأن الله أمرهم به تكريماً لآدم وإظهاراً لفضله، وكان سجود التحية مباحاً في الأمم الماضية، ومنه قوله تعالى عن إخوة يوسف: ﴿وَخَرُّوا لَهُ سُجَّدًا﴾ ثم حُرِّم في شريعتنا.", "وفي الحديث بيان فضل السجود لل تعالى، حيث كان سبباً لدخول الجنة، وبيان شؤم التكبر والإباء لأمر الله تعالى، فإنه سبب لحرمان الجنة ودخول النار، نسأل الله السلامة. والله تعالى أعلم."]}, "112": {"m": "وَعَنِ ابْنِ عَبّاسٍ رضي الله عنهما: «أَنّ النّبِيّ صلى الله عليه وسلم سَجَدَ بِالنّجْمِ، وَسَجَدَ مَعَهُ المُسْلِمُونَ وَالمُشْرِكُونَ، وَالجِنُّ وَالإِنْسُ» رَوَاهُ البُخَارِيُّ - وَقَالَ: «وَكَانَ ابْنُ عُمَرَيَسْجُدُ عَلَى غَيْرِوُضُوءٍ» -.", "s": ["أ- في الحديث دليل على ثبوت السجود في سورة النجم، وهي من سور المفصل، وهذا مذهب الجمهور من أهل العلم، وفيه ردُّ على من نفى سجود التلاوة في المفصل، وهو قول جماعة من الصحابة والتابعين، وهو الرواية المشهورة عن مالك، وقول الشافعي في القديم.", "ب- في الحديث دليل على جواز سجود التلاوة بغير وضوء، وأن الطهارة ليست شرطاً في سجود التلاوة، وهذا مذهب ابن عمر، وهو ظاهر اختيار البخاري، فإنه بوب على حديث الباب بما تقدم من قوله: (باب سجود المسلمين مع المشركين) ثم قال: والمشرك نَجِس ليس له وضوء، ثم ساق أثر ابن عمر، وهو قول الشعبي، وسعيد ابن المسيب، واختاره ابن حزم، وشيخ الإسلام ابن تيمية، ووجه الاستدلال بحديث الباب على جواز السجود بغير وضوء من وجهين: الأول: أن المسلمين سجدوا مع النبي ﷺ، ويبعد في العادة أن يكون جميع من حضر منهم عند قراءة الآية على وضوء؛ لأنهم لم يتأهبوا لذلك، فيكون سجودهم مع إقرار النبي ﷺ لهم على ذلك دليلاً على عدم اشتراط الطهارة لسجود التلاوة. الثاني: سجود المشركين مع النبي ﷺ وهم على ما هم عليه من الحدث، وقد أقروا على ذلك، وسمى الصحابة فعلهم هذا سجوداً، فدل على عدم اشتراط الطهارة لسجود التلاوة. يقول شيخ الإسلام ابن تيمية: (ومما يدل على ذلك: أن الله أخبر عن سجود السحرة لما آمنوا بموسى على وجه الرضا بذلك السجود، ولا ريب أنهم لم يكونوا متوضئين، ولا يعرفون الوضوء، فعلم أن السجود المجرد لل مما يحبه الله ويرضاه، وإن لم يكن صاحبه متوضئاً، وشرع من قبلنا شرع لنا ما لم يرد شرعنا بخلافه). ويؤيد هذا أثر ابن عمر، فإنه كان يسجد على غير وضوء، وهذا فعل صحابي علم عنه شدة اقتدائه بالنبي ﷺ وأخذه بالعزائم، مما يدل على أنه عنده خبر بعدم اشتراط الطهارة لسجود التلاوة. وما تقدم من أنه روي عنه خلاف ذلك، فقد مضى الجمع بين الأثرين، وأنه لا تعارض بينهما.", "والقول الثاني: أن الطهارة شرط لصحة سجود التلاوة، وهذا مذهب الجمهور من الحنفية، والمالكية، والشافعية، والحنابلة. واستدلوا بعموم حديث أبي هريرة أن النبي ﷺ قال: «لا يقبل الله صلاة أحدكم إذا أحدث حتى يتوضأ». ووجه الاستدلال: أن سجود التلاوة صلاة، فتشترط له الطهارة؛ لأنه داخل في عموم الحديث. والراجح - والله أعلم - أن الطهارة مستحبة لسجود التلاوة، وليست بشرط، لقوة مأخذ هذا القول، ويؤيد ذلك أن اشتراط الطهارة يحتاج إلى دليل، ولم يرد الدليل، وأدلة وجوب الطهارة إنما وردت في الصلاة، والسجدة لا تسمى صلاة. ثم إن من المعلوم أن المسلم يقرأ القرآن وهو على غير طهارة، وربما مرت به آية سجدة فسجد، وذلك مما يكثر وقوعه، ولو كانت الطهارة شرطاً لنقل ذلك صريحاً، لتوفر الهمم والدواعي لنقله. وأما حديث أبي هريرة، فالاستدلال به في هذه المسألة غير واضح، لأمرين: الأول: أن المراد بالصلاة في هذا الحديث الصلاة المعهودة، التي مفتاحها الطهور، وتحريمها التكبير، وتحليلها التسليم؛ لأن المعهود في الشرع أن الصلاة إذا أطلقت فالمراد بها ذلك، وأما السجود المجرد للدعاء فلا يدخل في مسمى الصلاة. الثاني: أن الاستدلال بهذا الحديث مبني على أن سجود التلاوة صلاة، وهذا غير مسلم؛ لأن ما يفارق به الصلاة أكثر مما يوافقها فيه.", "ج- الحديث دليل على أنه لا يشرع لسجود التلاوة تكبير للخفض ولا للرفع منه، وهذا القول مروي عن أبي حنيفة، وأبي يوسف، وبه قال بعض المالكية، وهو اختيار شيخ الإسلام ابن تيمية. كما أن فيه دليلاً على عدم مشروعية التسليم في سجود التلاوة، وهذا قول الحنفية، والمالكية، وهو أحد القولين عند الشافعية، ورواية عند الحنابلة، اختارها شيخ الإسلام ابن تيمية. ووجه الاستدلال: أن الصحابي نقل سجود النبي ﷺ للتلاوة، ولم يذكر أنه كبَّر عند السجود، ولا عند الرفع منه، ولم يذكر أنه سلَّم منه، وهذا مع قيام دواعي النقل عنه ﷺ في هاتين المسألتين، وحرص الصحابة على تبليغ ما علموه من سُنَّته، فلما لم ينقل شيء من ذلك دل على عدم مشروعيته، والتكبير والتسليم من العبادات التي لا تثبت إلا بدليل، وإلا فالأصل براءة الذمة وعدم التكليف. يقول شيخ الإسلام ابن تيمية في الرد على من قال: إن سجود التلاوة فيه تكبير وسلام: (ليس معهم لشيء من هذه الأقوال أثر، لا عن النبي ﷺ، ولا عن أحد من أصحابه، بل هو مما قالوه برأيهم، لما ظنوه صلاة)، وقال في موضع آخر: (وأما سجود التلاوة والشكر: فلم ينقل أحد عن النبي ﷺ ولا عن أصحابه أن فيه تسليماً، ولا أنهم كانوا يسلمون منه، ولهذا كان أحمد بن حنبل وغيره من العلماء لا يعرفون فيه التسليم، وأحمد في إحدى الروايتين عنه لا يسلم فيه، لعدم ورود الأثر بذلك، وفي الرواية الأخرى: يسلم واحدة أو اثنتين، ولم يثبت ذلك بنص، بل بالقياس، وكذلك من رأى فيه تسليماً من الفقهاء ليس فيه نص، بل بالقياس، أو قول بعض التابعين)، والله أعلم."], "t": ["أثر ابن عمر علقه البخاري، ووصله ابن أبي شيبة من طريق أبي الحسن، عن رجل زعم أنه كنفسه، عن سعيد بن جبير قال: كان عبد الله بن عمر ينزل عن راحلته فيهريق الماء، ثم يركب، فيقرأ السجدة وما توضأ. وهذا الأثر سكت عنه الحافظ في «الفتح» وفي «تغليق التعليق» وقد ذكره البخاري بصيغة الجزم، وأبو الحسن هو عبيد بن الحسن المزني الكوفي أحد الثقات - كما في «التقريب» - وشيخه مبهم، لكنه ثقة عنده كنفسه، فالأثر رجاله ثقات، ولم يعكر صفوه إلا هذا الرجل المبهم، وسيأتي ما يؤيده - إن شاء الله تعالى -. وقد عارضه ما رواه البيهقي من طريق الليث، عن نافع، عن ابن عمر قال: لا يسجد الرجل إلا وهو طاهر، وهذا - كما يقول الحافظ ابن حجر - إسناده صحيح، وقال: إنه يحمل على الطهارة الكبرى أو على الاستحباب."]}, "113": {"m": "وَعَنِ البَرَاءِ رضي الله عنه قَالَ: «بَعَثَ النّبِيُّ صلى الله عليه وَسلم خَالِدََ بْنَ الَوَلِيدِ إِلَى أَهْلِ اليَمَنِ يَدْعُوهُمْ إِلَى الإِسْلامِ فَلَمْ يُجِيبُوهُ. ثُمّ إَِنّ النَّبِيّ صلى الله عليه وسلم بَعَثَ عَلِيّ بْنَ أبِي طَالِبٍ وَأمَرَهُ أنْ يُقْفِلَ خَالِدا وَمَنْ كَانَ مَعَهُ، إِلَاّ رجَُلا مِمّنْ كَانَ مَعَ خَالِدٍ أحَبّ أنْ يُعَقِبَ مَعَ عَلِيٍ فَلْيُعَقِبْ مَعَهُ، قَالََ البَرَاءُ: فَكُنْتَُ مِمّنْ عَقّبَ مَعَهُ. فَلَمّا دَنَوْنَا مِنَ القَوْمِ خَرَجُوا إِلََيْنَا، فَصَلّى بِنَا عَلِيٌّ، وَصَفّنَا صَفا وَاحِدا، ثُمّ تَقَدّمَ بَيْنَ أيْدِينَا، فَقَرَأ عَلَيْهِمْ كِتَابَ رَسُولِ اللَّهِ صلى الله عليه وسلم؛ فَأسْلَمَتْ هَمْدَانُ جَمِيعا. فَكَتَبَ عَلِيٌّ إِلَى رَسُولِ اللَّهِ صلى الله عليه وسلم بِإِسْلامِهِمْ، فَلَمّا قَرََأ رَسُولُ اللَّهِ صلى الله عَليه وسلم الكِتَابَ خَرّ سَاجِدا، ثُمّ رَفَعَ رأَْسَهُ فَقَالَ: السّلامُ عَلَى هَمْدَانَ، السّلامُ عَلَى هَمْدَانَ» رَوَاهُ البَيْهَقِيُّ - وَقَالَ: «أخْرَجَ البُخَارِيُّ صَدْرَهَذَا الحَدِيثِ، وَلَمْ يَسُقْهُ بِتَمَامِهِ، وَسُجُودُ الشُّكْرِفِي تَمَامِ الحَدِيثِ عَلَى شَرْطِهِ» -.", "s": ["هذا الحديث يدل على مشروعية سجود الشكر وأنه سنة يستحب فعلها عند وجود سببه، وهو تجدد نعمة أو اندفاع نقمة، سواء أكان ذلك خاصاً بالساجد كما يأتي، أم عاما لجميع المسلمين، كانتصار المسلمين وهزيمة أعدائهم.", "وهو إنما شرع عند النعم المتجددة، أما النعم المستمرة كنعمة الإسلام ونعمة العافية والغنى عن الناس ونحو ذلك فهذه لا يشرع السجود لها، لأن نعم الله دائمة لا تنقطع، فلو شرع السجود لذلك لاستغرق الإنسان عمره في السجود، وإنما يكون شكر هذه النعم وغيرهما بالعبادة والطاعة لل تعالى.", "ولا يلزم أن تكون النعمة عامة بل يجوز - على الراجح من قولي أهل العلم - السجود عند حدوث نعمة خاصة أو اندفاع نقمة عنه، كأن يرزقه الله ولدا، أو يجد ضالته، أو ينجيه الله تعالى من هلكة، ونحو ذلك.", "وقد ورد في الصحيحين أن كعب بن مالك رضي الله عنه سجد شكرا لل لما بشر بتوبة الله عليه، وكان ذلك في عهد النبي صلى الله عليه وسلم والقرآن ينزل، فدل على مشروعيته.", "وسجود الشكر من السنن المهجورة بين الناس في هذا الزمان، فينبغي للمسلم إحياؤها عند حصول سببها.", "والراجح من قولي أهل العلم أن سجود الشكر لَا تشترط له الطهارة إذ لَا دليل على ذلك، ولأن سبب السجود قد يأتي فجأة والإنسان غير متطهر، ويسجد الإنسان على حاله من قيام أو جلوس، فإن كان قائماً خر ساجداً من قيام، وإن كان جالساً سجد على حاله، ولا يلزمه أن يقوم فيسجد، والله تعالى أعلم.", "* * *", "الجماعة في اللغة: من الجمع، وهو تأليف المتفرق، وضم الشيء بتقريب بعضه من بعض.", "وفي اصطلاح الفقهاء: الجماعة اسم لأقل ما يتحقق به الاجتماع، وهو اثنان: إمام ومأموم.", "والمراد بالجماعة في نصوص الشريعة هي: جماعة المسجد، لا جماعة البيوت، حتى لو قلنا بصحة الجماعة في البيوت، لقوله صلى الله عليه وسلم: «صلاة الرجل في الجماعة تضعف على صلاته في بيته وفي سوقه خمساً وعشرين ضعفاً».", "ولهذا قال عبد الله بن مسعود رضي الله عنه: «من سره أن يلقى الله غداً مسلماً فليحافظ على هؤلاء الصلوات حيث ينادى بهن».", "و «حيث» ظرف مكان، أي: فليحافظ عليهن في المكان الذي ينادى لهن فيه، وهو المساجد، ولأن النبي صلى الله عليه وسلم هم بتحريق بيوت المتخلفين - كما سيأتي إن شاء الله - ومعلوم أن البيوت فيها جماعة، فدل على أن المراد جماعة المسجد، ولهذا كان الواحد من سلف هذه الأمة إذا فاتته الجماعة في مسجده ذهب إلى مسجد آخر، ولم يذهب إلى بيته ويصلي بأهله ليكونوا جماعة.", "وأما الحكمة من مشروعية صلاة الجماعة، فهي ما يترتب عليها من فوائد كثيرة ومصالح عظيمة، فردية واجتماعية، دينية ودنيوية، فيجتمع أهل المحلة الواحدة كل يوم وليلة خمس مرات، فيتم بذلك إظهار شعيرة من أعظم شعائر الإسلام، فيظهر عز الإسلام وقوة المسلمين.", "وفي صلاة الجماعة يتم التعارف بين أهل الحي، ويحصل تعليم الجاهل، وتنشيط العاجز، والسؤال عن الغائب، وزيارة المريض، والتنافس في أعمال الخير، من العطف على الفقير، ومساعدة العاجز.", "كما أن في صلاة الجماعة تعويد الأمة على الاجتماع وعدم التفرق، وإشعارهم بالمساواة حينما يقفون صفاً واحداً خلف إمامهم، لا فرق بين غني وفقير، ولا شريف ولا وضيع، ولا صغير ولا كبير، إلى غير ذلك من الفوائد العظيمة."], "t": ["أخرجه البيهقي من طريق أبي عبيدة بن أبي السفر قال: سمعت إبراهيم بن يوسف بن أبي إسحاق، عن أبيه، عن أبي اسحاق، عن البراء به. وإسناده حسن، أبو عبيدة بن أبي السفر - بفتح الفاء - واسمه أحمد بن عبد الله بن محمد بن عبد الله بن أبي السفر، قال عنه في «التقريب»: (صدوق يهم)، ومثله شيخه إبراهيم بن يوسف.", "وقد أخرج البخاري هذا الحديث في صحيحه مختصرًا من طريق شريح بن مسلمة، إبراهيم بن يوسف قال: حدثني أبي، عن أبي إسحاق، ولم يذكر فيه سجود الشكر، لكن قال البيهقي: (وسجود الشكر في تمام الحديث صحيح على شرطه)."]}, "114": {"m": "عَنْ عَبْدِ اللَّهِ بْنِ عُمَرَرضي الله عنهما أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «صَلاةُ الجَمَاعَةِ أَفْضَلُ مِنْ صَلاةِ الفَذِ بِسَبْعٍ وَعِشْرِينَ دَرجََةا» مُتّفَقٌ عَلَيْهِ. وَفِي حَدِيثِ أَبِي سَعِيدٍ رضي الله عنه: «بِخَمْسٍ وَعِشْرِينَ دَرجََةا» رَوَاهُ البُخَارِيُّ. وَفِي حَدِيثِ أَبِي هُرَْيرَةَ رضي الله عنه: «بِخَمْسَةٍ وَعِشْرِينَ جُزْءا» مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (صلاة الجماعة أفضل) بلفظ أفعل التفضيل، أي: أكثر وأزيد، وهذا لفظ مسلم، ولفظ البخاري: «تفضل».", "والمراد بالجماعة هنا: قيل: مطلق الجماعة في أي مكان؛ لأن الجماعة وصف علق عليه الحكم، فيؤخذ به.", "والقول الثاني: أن المراد: جماعة المسجد لا جماعة البيوت ونحوها؛ لما ورد من أوصاف أخرى تختص بالمساجد، كإكثار الخطى إلى المساجد، وانتظار الصلاة، ودعاء الملائكة. وعندي أن هذا القول أقرب، ويؤيده ما سيأتي من أن الصلاة في البيوت من فعل المنافقين، فكيف يثبت فيها التفضيل؟", "قوله: (صلاة الفذ) أي: المنفرد الذي لم يصل مع الجماعة، وجمعه: فذوذ، وأفذاذ، قال ابن منظور: (فذ الرجل عن أصحابه: إذا شذ عنهم وبقي منفرداً)، وعند مسلم بسياق أوضح: «صلاة الرجل في الجماعة تزيد على صلاته وحده سبعا وعشرين».", "قوله: (بسبع وعشرين) وفي رواية له: «بخمس وعشرين»، قال الترمذي: (عامة من روى عن النبي صلى الله عليه وسلم إنما قالوا: خمس وعشرون، إلا ابن عمر فإنه قال: بسبع وعشرين).", "وقد اختلف العلماء في الجمع بينهما على أوجه كثيرة، ذكرها الحافظ، وأقربها أن النبي صلى الله عليه وسلم أخبر أولاً بالقليل، ثم أعلمه الله تعالى بزيادة الفضل فأخبر بها.", "ومن العلماء من سلك مسلك الترجيح، فرجح رواية السبع؛ لأن فيها زيادة من عدل حافظ فتكون مقبولة، والجمع أحسن.", "قوله: (درجة) أي: مرة، والمعنى أن الرجل إذا صلى في جماعة كانت صلاته أزيد ثوابا مما إذا صلاها وحده بسبع وعشرين مرة.", "وقوله في الرواية الأخرى: «جزءا»، إما أن يكون من تصرف الرواة، أو من باب التفنن في العبارة، وقد جاء في بعضها: «ضعفاً»."], "s": ["أ- الحديث دليل على فضل الصلاة في الجماعة، وأنها أكثر ثواباً من الصلاة بغير جماًعة سبعا وعشرين مرة، والقصد من هذا الإخبار: حث الناس وترغيبهم في صلاة الجماعة، طلباً لهذه الزيادة في الثواب.", "ب- حديث الباب محمول على المنفرد الذي صلى في بيته بدون عذر، وأما من صلى في بيته لعذر، كمرض ونحوه، ففيه قولَان:", "الأول: أن أجره تام؛ لأن المعذور يكتب له ثواب عمله كله، فدل على أن المراد بالحديث غير المعذور، وقد ورد في حديث أبي موسى رضي الله عنه أن النبي صلى الله عليه وسلم قال: «إذا مرض العبد أو سافر كتب له مثل ما كان يعمل مقيماً صحيحاً».", "القول الثاني: أن المعذور له أجر، ولكن ليس كأجر من صلى في جماعة، إذ ليس هناك دليل يدل على أن صلاة المنفرد المعذور مثل صلاة الرجل في جماعة، وعلى هذا القول فلا تضعيف في صلاة الفذ مطلقاً، سواء أكان معذورًا أم غير معذور إلا أن المعذور يسقط عنه الإثم، ويكتب له الأجر إذا كان من عادته الصلاة في جماعة ثم مرض ولم يستطع أن يصلي معهم، ولكن أجره ليس كأجر من صلى مع الجماعة.", "وأما من لم تكن عادته الصلاة في الجماعة فمرض فصلى وحده فهذا لا يكتب له مثل صلاة الصحيح، وهذا قول شيخ الإسلام ابن تيمية، والحافظ ابن رجب.", "ج- استدل بالحديث من قال: إن صلاة الجماعة سنة، وهم أكثر المالكية، ووجه الاستدلال: أن النبي صلى الله عليه وسلم فاضل بين صلاة الجماعة وصلاة المنفرد، والمفاضلة تقتضي مشاركة المنفرد للجماعة في الفضل وأصل الثواب، ولو كانت الجماعة واجبة لم يجعل الرسول صلى الله عليه وسلم للمنفرد أجرًا؛ لأنه إما آثم إن كانت الجماعة في حقه واجبة، أو صلاته باطلة إن كانت شرطاً.", "وأجيب عن ذلك: بأن المفاضلة بين صلاة الجماعة وصلاة المنفرد ليس فيها دلالة على عدم الوجوب، وإنما فيها دلالة على أن صلاة المنفرد صحيحة وناقصة الثواب، ثم إن الحديث ما سيق لبيان الوجوب أو عدمه، وإنما سيق لبيان المفاضلة. لكن يصح أن يكون الحديث دليلاً على أن الجماعة ليست شرطاً في صحة الصلاة؛ لأن تفضيل صلاة الجماعة على صلاة الفذ يدل على أن في صلاة الفذ فضلاً، وهذا لا يتحقق إلا إذا كانت صحيحة.", "د- الحديث دليل على أن أقل الجماعة اثنان؛ إمام ومأموم؛ لأنه جعل هذا الفضل لغير الفذ، فدل على أن ما زاد على الفذ فهو جماعة، وقد دل على ذلك حديث مالك بن الحويرث، وفيه: «إذا حضرت الصلاة فأذنا وأقيما، ثم ليؤمكما أكبركما»، وتقدم في باب «الأذان»، وقد بوب عليه البخاري بقوله: باب «اثنان فما فوقهما جماعة». والله تعالى أعلم."]}, "115": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «وَالّذِي نَفْسِي بِيَدِهِ! لَقَدْ هَمَمْتُ أَنْ آمُرَ بِحَطَبٍ فَيُحْتَطَبَ، ثُمّ آمُرَ بِالَصّلاةِ فََيُؤَذّنَ لَهَا، ثُمّ آمُرَ رجَُلاا فَيَؤُمّ النّاسَ، ثُمّ أُخَالِفَ إِلَى رِجَالٍ فَأُحَرِقَ عَلَيْهِمْ بُيُوتَهُمْ. وَالّذِي نَفْسِي بِيَدِهِ! لَوْ يَعْلَمُ أحَدُهَُمْ أنّهُ يَجِدُ عَرْقا سَمِينا، أوْ مِرْمَاتَيْنِ حَسَنَتَيْنِ؛ لَشَهِدَ العِشَاءَ» رَوَاهُ البُخَارِيُّ - وَهَذَا لَفْظُهُ -، وَمُسْلِمٌ - وَلَيْسَ عِنْدَهُ: «أوْ مِرْمَاتَيْنِ حَسَنَتَيْنِ» -.", "w": ["قوله: (والذي نفسي بيده) هذا قسم كان النبي صلى الله عليه وسلم يقسم به كثيرًا، ومعناه: أن أمر نفوس العباد بيد الله تعالى؛ لأنه سبحانه مالكها والمتصرف فيها.", "وأما قول الشراح: أي: بتقديره وتدبيره، وأن المراد باليد القدرة؛ فهو تأويل فاسد؛ لأن اليد ثابتة لل تعالى على حقيقتها، واليد غير القدرة.", "قوله: (لقد هممت) أي: أردت وعزمت، والهم: انبعاث النفس إلى تحصيل أمر ما، وقد جاء في رواية مسلم أن رسول الله صلى الله عليه وسلم فقد ناساً في بعض الصلوات، فقال: «لقد هممت …» فبين بذلك سبب الحديث.", "قوله: (ثم أخالف إلى رجال) أي: آتيهم من خلف، قال الجوهري: (خالف إلى فلان؛ أي: أتاه إذا غاب عنه).", "قوله: (لا يشهدون الصلاة) هذه اللفظة عند مسلم فقط، كما تقدم، وهي صفة لرجال، والمعنى: لا يحضرون، من شهد بمعنى حضر، وفيها بيان سبب ذلك، وهو أن العقوبة على ذنب ظاهر، وهو تخلفهم عن الصلاة في المسجد، لا على أنها لنفاقهم، كما قيل؛ لأن النبي صلى الله عليه وسلم لا يعاقب المنافقين على نفاقهم؛ لأنه أمر باطن، بل كان يكل سرائرهم إلى الله تعالى، ويعاملهم معاملة المسلمين في الظاهر، وقوله: «لا يشهدون الصلاة» لم يبين المراد بهذه الصلاة، لكن آخر الحديث يشعر بأنها العشاء، وهذا لا يقتضي التخصيص.", "قوله: (فأحرق عليهم بيوتهم)، في رواية لمسلم: «فأحرق بيوتاً على من فيها»، وهذا يشعر بأن العقوبة ليست قاصرة على المال، بل المراد: تحريقهم، وبيوتهم تبع لهم.", "قوله: (والذي نفسي بيده) أعاد النبي صلى الله عليه وسلم اليمين للمبالغة في التأكيد والاهتمام.", "قوله: (عرقاً سميناً) بفتح المهملة، وسكون الراء، ثم قاف، هو العظم الذي أخذ أكثر ما عليه من الهبر، ويؤيد ذلك رواية مسلم: «عظماً سميناً» فيكسر العظم ويطبخ، ويؤكل ما عليه من اللحم، ثم يتمشمش العظم.", "قوله: (أو مرماتين حسنتين) تثنية مرماة، بكسر الميم، ويجوز فتحها، وفي تفسيرها اختلاف، والمرماة ظلف الشاة.", "وقد جمع بين السمن في العرق والحسن في المرماتين ليوجد الباعث النفسي في تحصيلهما، وذكر العرق والمرماتين على وجه ضرب المثال بالأشياء التافهة الحقيرة من الدنيا، وفيه توبيخ لمن رغب عن فضل صلاة الجماعة، مع أنه لو طمع في إدراك يسير من عرض الدنيا لبادر إليه، وهو يسمع منادي الله فلا يجيبه، ذكر ذلك الحافظ ابن رجب رحمه الله."], "s": ["أ- الحديث دليل على جواز الحلف من غير استحلاف، وقد ذكر ابن القيم أن النبي صلى الله عليه وسلم حلف في أكثر من ثمانين موضعاً، وذكر أنه يجوز الحلف، بل يستحب على الخبر الديني الذي يريد تأكيده.", "ب- الحديث دليل على إثبات صفة اليد لل تعالى على ما يليق بجلاله وعظمته، إثباتا بلا تكييف ولا تمثيل، وتنزيها بلا تحريف ولا تعطيل، كسائر أسمائه وصفاته سبحانه وتعالى.", "ج- استدل بالحديث من قال بوجوب صلاة الجماعة، وهم أكثر الحنفية وابن خزيمة وابن المنذر من الشافعية، وهو المذهب عند الحنابلة، ووجه الاستدلال: أن الرسول صلى الله عليه وسلم هم بتحريق بيوت المتخلفين عنها عليهم، ولا يهم بهذه العقوبة إلا من أجل ترك واجب، وهو حضور الجماعة، ولا يهم إلا بما يجوز له فعله لو فعله، ولو كانت فرض كفاية لكان أداء الرسول صلى الله عليه وسلم ومن معه الصلاة كافياً عن الجميع، ولو كانت سنة لم يهدد النبي صلى الله عليه وسلم تاركها بذلك، وسيأتي مزيد من الأدلة إن شاء الله.", "وقد ورد عند أحمد وغيره عن أبي هريرة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «لولا ما في البيوت من النساء والذرية لأقمت صلاة العشاء وأمرت فتياني يحرقون ما في البيوت بالنار». وهو حديث ضعيف؛ لأنه من رواية أبي معشر - وهو نجيح بن عبد الرحمن السندي - عن سعيد المقبري، عن أبي هريرة، وأبو معشر ضعيف.", "ولكن المعنى صحيح، فإن امتناع الرسول صلى الله عليه وسلم من تنفيذ ما هم به له أسباب، فإنه قد يفضي إلى أشياء مضرتها عظيمة، كإصابة امرأة أو طفل، أو يذهب بأموال عظيمة أو ما شابه ذلك مما قد يضر بالجيران، فالحاصل أن التخلف عن التنفيذ له أسباب، فلا يدل على أن فعلهم ذلك جائز أو أنه لا يجوز عقابهم.", "د- الحديث دليل على جواز مباغتة الفساق في أماكن فسقهم وعلى معصيتهم، لقبضهم متلبسين بجريمتهم، وأن هذا أمر مناسب للقائم بالأمر بالمعروف والنهي عن المنكر، لتقوم الحجة عليهم ويسقط اعتذارهم، ولا يبقى لهم شيء آخر يدرأ عنهم العقوبة.", "ه- استدل بهذا الحديث من أجاز التعزير بالمال، كأن يغرم شخص مبلغا من المال أو يتلف شيء من ماله، وذلك لأن تحريق بيوت المتخلفين عن الصلاة من العقوبة المالية، وهذا قول ابن تيمية، وتلميذه ابن القيم، ونقل عن إسحاق، وأبي يوسف تلميذ أبي حنيفة، وبه قال ابن فرحون من المالكية، وقد انتصر له ابن القيم، وذكر أنه ورد فيه قضايا عديدة، كأمره صلى الله عليه وسلم بتحريق الثوب المعصفر بالنار، وأمره بتحريق متاع الغال، وإضعاف الغرم على من سرق ما لا قطع فيه من الثمر، وفعله الخلفاء الراشدون، فحرق عمر وعلي رضي الله عنهما بيت خمار، وغير ذلك مما يدل على بقاء هذا الحكم. وقد رجح هذا القول ابن رجب، والشيخ عبد العزيز بن باز.", "وذهب الجمهور من أهل العلم إلى أنه لا يجوز التعزير بالمال؛ لأن في ذلك مخالفة للنصوص الدالة على حرمة مال المسلم وعدم جواز أخذه بغير حق، وقد كانت العقوبة المالية في أول الإسلام ثم نسخت، لكن رد ابن رجب دعوى النسخ، وقال: إنها لا تصح، والشريعة طافحة بجواز ذلك …", "أما نهيه صلى الله عليه وسلم عن التحريق بالنار، فإنما أراد به تحريق النفوس وذوات الأرواح، وأما حديث الباب فمراد به تحريق دار المتخلف عن الصلاة ومتاعه، فإن أتى على نفسه لم يكن بالقصد بل تبعا.", "و- الحديث دليل على أن الأمر بإقامة الصلاة موكول إلى الإمام، لقوله: «ثم آمر بالصلاة فتقام»، فإذا كان الإمام حاضرا أو قريبا من المسجد فهو أحق بالأمر بإقامة الصلاة، وعليه فلينتبه أولئك الذين يوجدون في بعض المساجد ويضايقون المؤذن ويطالبونه بإقامة الصلاة بمجرد أن الإمام تأخر بضع دقائق، بل ينبغي الأدب مع الأئمة والصبر والاحتساب في انتظار الصلاة، ففي ذلك ثواب عظيم.", "ز- ومن الفوائد أن الإمام إذا عرض له شغل فإنه يستخلف من يصلي بالناس، وله أن يستصحب معه بعض الجماعة إذا كان هناك مصلحة، لقوله في رواية: «ثم أنطلق معي برجال معهم حزم من حطب»؛ لأن مصلحة متابعة المتخلفين مقدمة على الصلاة في أول وقتها، وبهذا يستدل على أنه لا بأس بفعل أعضاء هيئة الأمر بالمعروف والنهي عن المنكر إذا بقوا يوجهون الناس للصلاة ويتابعون المتخلفين ولو تأخروا عن الجماعة في المسجد؛ لأن هذا مصلحة عامة، والله تعالى أعلم."]}, "116": {"m": "وَعَنْ عَبْدِ اللَّهِ بَْنِ عُمَرَرضي الله عنهما أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «َلَا تَمْنَعُوا إِمَاءَ اللَّهِ مَسَاجِدَ اللَّهِ» مُتّفَقٌ عَلَيْهِ. وَِلأَحْمَدَ، وَ أبِي دَاوُدَ، وَالحَاكِمِ - وَقَالَ: «عَلَى شَرْطِهِمَا» -: «لَا تَمْنَعُوا النِسَاءَ أنْ يَخْرُجْنَ إِلَى المَسَاجِدِ، وَبُيُوتُهُنّ خَيْرٌلَهُنّ».", "s": ["أ- الحديث دليل على نهي الرجل أن يمنع امرأته إذا استأذنته في الخروج إلى المسجد للصلاة ونحوها، قال الحافظ ابن رجب: (وهذا لا بد من تقييده بما إذا لم يخش فتنة أو ضررًا).", "ب- الحديث دليل على أن صلاة المرأة في بيتها خير لها وأفضل من صلاتها مع الجماعة في المسجد، وقد ورد عن ابن مسعود أن النبي ﷺ قال: «صلاة المرأة في بيتها أفضل من صلاتها في حجرتها، وصلاتها في مَخدَعِها أفضل من صلاتها في بيتها». وقوله: (في بيتها)؛ أي: المكان الداخلي؛ لكمال سترها. وقوله: (في حجرتها) أراد بالحجرة: ما تكون أبواب البيوت إليها، وهي أدنى حالاً من البيت.", "وعن أم حميد الساعدية: أنها جاءت إلى رسول الله ﷺ، فقالت يا رسول الله: إني أحب الصلاة معك، فقال: «قد علمتُ، وصلاتُك في بيتك خير لك من صلاتك في حُجرتك، وصلاتك في حجرتك خير من صلاتك في دارك، وصلاتك في دارك خير من صلاتك في مسجد قومك، وصلاتك في مسجد قومك خير من صلاتك في مسجد الجماعة». قال أبو بكر ابن المنذر المتوفى سنة (٣١8) بعد ذكره قول مالك والشافعي وإسحاق وأصحاب أبي حنيفة في جواز خروج النساء للعيدين والكسوف والاستسقاء: (وقال بعض أهل العلم: كان النساء يخرجن على عهد رسول الله ﷺ إلى المصلى في العيدين، وقد حضرن صلاة الكسوف مع النبي ﷺ، غير أن النساء في عصرنا قد تغيرن عما كن عليه في عهد النبي ﷺ، والأصح اليوم منعهن من الخروج، واحتج بحديث عائشة: لو رأى النبي ﷺ ما أحدث النساء اليوم لمنعهن من الخروج إلى المساجد، كما مُنعت نساء بني إسرائيل. قال أبو بكر: فمن قصد منهنَّ الخير لم يمنع منه، وإن ظهر منهن غير ذلك منعهن منه، إلا العجوز الكبيرة، فإنها تخرج، كما قال مالك والشافعي). وإذا كان الحافظ ابن المنذر قد قال هذا في زمانه، وإذا كان هذا الكلام في القرن الرابع، فكيف لو رأى هو وغيره من أهل العلم ما عليه النساء في زماننا من خروجهن متبرجات كاسيات عاريات، حتى في أفضل بقعة على وجه الأرض: في بيت الله الحرام! لا ريب أن مثل هؤلاء يحرم خروجهن إلى المساجد وغير المساجد، ويجب على وليهن منعهنَّ وعدم الإذن لهن. وقال صاحب «بلوغ الأماني»: (يستفاد من هذا الحديث - حديث أم حميد - مشروعية تستر المرأة في كل شيء، حتى في صلاتها وعبادة ربها، وكلما كانت في مكان أستر، كان ثوابها أعظم وأوفر؛ لهذا أرشدها النبي ﷺ إلى أخفى مكان في بيتها وأبعده عن الناس، وهو ﷺ لا يرشد إلا إلى كل خير، فبادرت بالعمل بإرشاده، وأمرت ببناء مسجد لها في أبعد ناحية لها في بيتها وأظلمها، ولا زالت تعبد الله حتى ماتت.", "ج- استدل بعض العلماء بهذا الحديث على أنه يجوز للرجل أن يمنع زوجته من الخروج لغير المسجد، وهذا مأخوذ من تخصيص النهي بالخروج إلى المساجد، فإنه يقتضي بطريق المفهوم جواز المنع في غير المساجد، لأن النهي عن منعهن معلل بكونهن إماء الله يُردن مساجد الله، فإذا انتفت هذه العلة، انتفى الحكم، لأنه يزول بزوال علته.", "د- وفي الحديث الإشارة إلى عدم منعها من الخروج لصلة رحمها ونحوها من أعمال البر، قال ابن عبد البر: «وفي معنى هذا الحديث أيضاً: الإذن لها في الخروج لكل مباح حسن: من زيارة الآباء والأمهات وذوي المحارم من القرابات؛ لأن الخروج لهن إلى المسجد ليس بواجب عليهن، بل قد جاءت الآثار الثابتة تخبر بأن الصلاة لهن في بيوتهن أفضل، فصار الإذن لهن إلى المسجد إباحة، وإذا لم يكن للرجل أن يمنع امرأته المسجد إذا استأذنته في الخروج إليه، كان أوكد أن يجب عليه ألا يمنعها الخروج لزيارة من في زيارته صلة لرحمها، ولا من شيء لها فيه فضل، أو إقامة سنة، وإذا كان ذلك كذلك: فالإذن ألزم لزوجها إذا استأذنته في الخروج إلى بيت الله الحرام للحج».", "ه- في الحديث دليل على ثبوت ولاية الرجل على المرأة ورعايته لها، لأن النبي ﷺ وجه إليه الخطاب في موضوع منع المرأة من المسجد، والله تعالى أعلم."], "t": ["الرواية الثانية أخرجها من ذكرهم المصنف من طريق العوام بن حوشب، عن حبيب بن أبي ثابت، عن ابن عمر مرفوعاً. قال الحاكم (هذا حديث صحيح على شرط الشيخين، فقد احتجا جميعاً بالعوام بن حوشب، وقد صح سماع حبيب من ابن عمر، ولم يخرجا الزيادة: «وبيوُتهن خير لهن»). وحبيب بن أبي ثابت ثقة فقيه جليل، وهو كثير الإرسال والتدليس، وقد أثبت سماعه من ابن عمر مطلقاً البخاري ومسلم وابن خزيمة وغيرهم، ونص على ذلك يحيى بن معين في «تاريخه» برواية الدوري، وهو الذي يفهم من ترجمته في «تهذيب الكمال» وصحح سماعه ابن دقيق العيد في «الاقتراح»، ونفى سماعه منه علي بن المديني، وقيد يحيى بن سعيد القطان سماعه بثلاثة أحاديث، ليس منها حديث الباب، كما قال ابن خزيمة، وقال العجلي: (سمع من ابن عمر غير شيء) ثم إن روايته عنه لا تحمل على الاتصال حتى يصرح بالسماع؛ لأنه - كما مرَّ - مشهور بالتدليس. ثم إن جملة: (وبيوُتهن خير لهن) مما تفرد به حبيب، عن ابن عمر، فإن الحديث رواه عن ابن عمر ثقات أثبات، ومنهم مولاه نافع ولم يذكروا هذه الجملة. لكن لها ما يؤيدها من جهة المعنى، كما سيأتي - إن شاء الله تعالى -."]}, "117": {"m": "وَعَنْ زَيْنَبَ الثّقَفِيّةِ - امْرََأةِ عَبْدِ اللَّهِ - رضي الله عنهما قَالَتْ: قَالَ لَنَا رَسُولُ اللَّهِ صلى الله عليه وسلم: «إِذَا شَهِدَتْ إِحْدَاكُنّ المَسْجِدَ؛ فَلا تَمَسّ طِيبا» رَوَاهُ مُسْلِمٌ.", "s": ["الحديث دليل على أن المرأة إذا أرادت حضور المسجد للصلاة ونحوها، فإنها منهية عن التطيب؛ لأن الطيب من أسباب الفتنة وتحريك الشهوة، ويلحق بالطيب الزينة كالثياب الفاخرة والحلي ونحو ذلك، وعلى هذا فلا بد أن تكون المرأة عند خروجها إلى المسجد على درجة تامة من التستر والبعد عن كل ما يثير الرجال. وعن أبي هريرة قال: قال رسول الله ﷺ: «أيما امرأة أصابت بخورًا، فلا تشهد معنا العشاء الآخرة». قال ابن دقيق العيد: «فيه حرمة الطيب على مريدة الخروج إلى المسجد؛ لما فيه من تحريك داعية شهوة الرجال». وعن أبي هريرة أنه لقيته امرأة وجَدَ منها ريح الطيب ولذيلها إعصار، فقال: يا أمة الجبار، جئتِ من المسجد؟ قالت: نعم، قال: وله تطيبت؟ قالت: نعم، قال: إني سمعت حبي أبا القاسم ﷺ يقول: «لا تقبل صلاة لامرأة تطيبت لهذا المسجد حتى ترجع فتغتسل غسلها من الجنابة». قال ابن القيم عند الكلام على عناية الشرع بسد الذرائع: «الوجه السابع والخمسون: أنه نهى المرأة إذا خرجت إلى المسجد أن تتطيب أو تصيب بخورًا، وذلك لأنه ذريعة إلى ميل الرجال وتشوفهم إليها، فإن رائحتها وزينتها وصورتها وإبداء محاسنها تدعو إليها، فأمرها أن تخرج تَفِلَةً وألا تتطيب، وأن تقف خلف الرجال، وألا تُسَبِّحَ في الصلاة إذا نابها شيء، بل تصفق ببطن كفها على ظهر الأخرى، كل ذلك سداً للذريعة، وحماية عن المفسدة»، والله تعالى أعلم."]}, "118": {"m": "وَعَنْ أَبِي مُوسَى رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم:َ «إِنّ أَعْظَمَ النّاسِ أَجْرا فِي الصّلاةِ: أَبْعَدُهُمْ إِلَيْهَا مَمْشىا، فَأَبْعَدُهُمْ. وَالّذِي يَنْتَظِرُالصّلاةَ حَتّى يُصَلِيَهَا مَعَ الإِمَامِ أَعْظَمُ أجْرا مِنَ الّذِي يُصَلِيهَا ثُمّ يَنَامُ». وَفِي رِوَ ايَةٍ: «حَتّى يُصَلِيَهَا مَعَ الإِمَامِ فِي جَمَاعَةٍ» مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (ممشى) أي: أبعدهم مسافة إلى المسجد.", "قوله: (أعظم أجرًا من الذي يصليها ثم ينام)؛ أي: أكثر ثواباً من الذي يصليها أول الوقت منفرداً ثم ينام، والمراد بذلك صلاة العشاء، وهذا فيه إشارة إلى الاستراحة المقابلة لمشقة الانتظار حتى يصليها مع الإمام."], "s": ["أ- الحديث دليل على فضل المسجد البعيد على القريب، لأجل كثرة الخطا الذي من ثمرته حصول الثواب، وأنه كلما كان المسجد أبعد كان الأجر أعظم. وعن أبي هريرة أن رسول الله ﷺ قال: «ألا أدلكم على ما يمحو الله به الخطايا ويرفع به الدرجات؟». قالوا: بلى يا رسول الله. قال: «إسباغ الوضوء على المكاره، وكثرة الخطا إلى المساجد، وانتظار الصلاة بعد الصلاة، فذلكم الرباط، فذلكم الرباط». وعن أبي بن كعب قال: كان رجل لا أعلم رجلاً أبعد من المسجد منه، وكان لا تخطئه صلاة، فقيل له أو قلت له: لو اشتريت حماراً تركبه في الظلماء وفي الرمضاء، قال: ما يسرني أن منزلي إلى جنب المسجد، إني أريد أن يكتب ممشاي إلى المسجد ورجوعي إذا رجعت إلى أهلي، فقال رسول الله ﷺ: «قد جمع الله لك ذلك كله».", "ب- بيان فضل التقدم إلى المسجد والتبكير في حضور الصلاة لانتظارها؛ لأن الحديث دل على أن طول الزمان في انتظار الصلاة مع الإمام مؤثر في زيادة الأجر، كما أن بعد المكان مؤثر في زيادة الأجر.", "ج- الحديث دليل على أن صلاة المنفرد صحيحة؛ لأن النبي ﷺ جعل الذي ينتظر الصلاة ويصليها مع الإمام أفضل من الذي يصلي وحده ثم ينام، وهذا لا ينافي أن صلاة الجماعة فرض عين على كل ذكر بالغ إلا لعذر، فمن ترك صلاة الجماعة من غير عذر فهو آثم، وصلاته صحيحة، قال الشيخ محمد العثيمين: عن حديث الباب: (هذا من الأحاديث المتشابهة، وإذا كان ظاهره أن صلاة الجماعة ليست بواجبة، فهناك أحاديث صحيحة واضحة في وجوب صلاة الجماعة، والواجب الذي هو طريق الراسخين في العلم أن يحملوا المتشابه على المحكم الذي ليس فيه تشابه حتى يكون الجميع محكماً). والله تعالى أعلم."]}, "119": {"m": "وَعَنْ نَافِعٍ قَالَ: «أَذّنَ ابْنُ عُمَرَ فِي لَيْلَةٍ بَارِدَةٍ بِضَجْنََانَ، ثُمّ قَالَ: صَلُّوا فِي رِحَالِكُمْ، فَأَخْبَرََنَا أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ يَأْمُرُ مُؤَذِنا يُؤَذِنُ، ثُمّ يَقُولُ عَلَى إِثْرِهِ: ألَا صَلُّوا فِي الرِحَالِ! فِي اللّيْلَةِ البَارِدَةِ أوِ المَطِيرَةِ فِي السّفَرِ» مُتّفَقٌ عَلَيْهِ، وَهَذَا لَفْظُ البُخَارِي.ِ", "w": ["قوله: (بضَجنان) بفتح الضاد المعجمة وبعدها جيم ساكنة، اسم جبل قريب من مكة. ذكر هذا البكري، وذكر بعض المعاصرين أنه اسم حرة تقع شمال مكة بمسافة (5٤) كيلاً.", "قوله: (ثم قال: صلوا في رحالكم) هذا أمر إباحة، وليس أمر عزيمة؛ لأن غالب الأمر بعد الحظر يفيد الإباحة، والصلاة في الرحال محظورة في الأصل، ثم أمر بها، وقد دل على ذلك حديث جابر قال: خرجنا مع رسول الله ﷺ في سفر فمطرنا، فقال: «ليصلِّ من شاء منكم في رحله». وظاهر هذا أن القول المذكور بعد الفراغ من الأذان، وقال القرطبي: يحتمل أن يكون في آخر الأذان قبيل الفراغ منه.", "(والرحال) بالكسر جمع رحل، وهو مسكن الرجل وما فيه من أثاثه، وقال ابن الأثير: (يعني الدور والمساكن والمنازل، يقال لمنزل الإنسان ومسكنه: رحَله، وانتهينا إلى رحالنا؛ أي: منازلنا).", "قوله: (ثم يقول على إثره) هو بكسر الهمزة وسكون الثاء المثلثة. تقول: جئت على إثره؛ أي: تبعته عن قرب، وهذا صريح في أن القول المذكور بعد فراغ الأذان.", "قوله: (في السفر) ظاهر هذا أن إباحة ترك الجماعة من أجل البرد والمطر خاص بالسفر، وظاهر حديث ابن إسحاق - كما تقدم - أنه يجوز في الحضر، وسيأتي ما فيه."], "s": ["أ- الحديث دليل على إباحة التخلف عن صلاة الجماعة في الليلة الباردة أو المطيرة، قال ابن بطال: (أجمع العلماء على أن التخلف عن الجماعات في شدة المطر والظلمة والريح وما أشبه ذلك مباح بهذه الأحاديث). وقال القرطبي: (ظاهر هذين الحديثين - حديث ابن عمر وابن عباس - جواز التخلف عن الجماعة والجمعة للمشقة اللاحقة من المطر والريح والبرد، وما في معنى ذلك من المشاق المحرجة في الحضر والسفر...).", "ب- ظاهر الحديث أن هذا العذر خاص بالسفر؛ لأن السفر مظنة المشقة، والمسافرون عادة يكونون متفرقين، واجتماعهم في مكان واحد يُصلُّون فيه، فيه مشقة؛ لوجود طين ومياه تحول بينهم وبين هذا المكان. بخلاف الحضر، فإنه أخف من السفر، والجماعة فيه آكد. وقد جاء في رواية ابن إسحاق أن ذلك كان في الحضر؛ لقوله: (في المدينة) لكنه حديث ضعيف فلا تقوم به حجة، وفي حديث ابن عمر من طريق الإمام مالك، عن نافع أن ابن عمر أذن بالصلاة في ليلة ذات برد وريح فقال: ألا صلوا في الرحال، ثم قال: كان ﷺ يأمر المؤذن إذا كانت ليلة باردة ذات مطر يقول: «ألا صلوا في الرحال». وهذا مطلق لم يقيد بالسفر، فيفيد أن التخلف يجوز في الحضر والسفر، قال الحافظ ابن حجر: (وبه أخذ الجمهور، والأظهر أن هذا التخلف خاص بالسفر، من باب حمل المطلق على المقيد، ويلحق به من تلحقه مشقة في الحضر دون من لا تلحقه).", "ج- ظاهر الحديث أن البرد أو المطر عذر في التخلف عن الجماعة في الليل، وليس بعذر في النهار، وهذا مذهب الحنابلة، وذهبت الشافعية إلى أن المطر والبرد الشديد عذر يبيح التخلف عن الجماعة، سواء أكان بالليل أم بالنهار، استناداً لرواية أبي داود (في الليلة المطيرة والغداة القرة) والغداة: أول النهار. أما الريح فإن الشافعية يقولون: إنها عذر في الليل دون النهار، لما فيها من شدة البرد دون بقية النهار. وقد تقدم ضعف رواية أبي داود، وقد يكون تقييده بالغداة لما فيها من شدة البرد دون بقية النهار.", "د- ظاهر الحديث أن قوله: (صلوا في رحالكم) يكون بعد الفراغ من الأذان، كما تقدم في رواية «الصحيحين»، وعلى هذا فالمؤذن يجمع بين الحيعلة وهذه الجملة، إلا أن هذه الجملة تكون بعد نهاية الأذان، وهذا قول الحنفية، والمالكية، ووجه للشافعية. لكن جاء في حديث ابن عباس أنه قال لمؤذنه في يوم مطير: إذا قلت: أشهد أن لا إله إلا الله وأن محمداً رسول الله، فلا تقل: حي على الصلاة، قل: «صلوا في بيوتكم» قال: فكأن الناس استنكروا ذلك، قال: أتعجبون من ذلك؟ قد فعلها من هو خير مني، إن الجمعة عزمة، وإني كرهت أن أُحرِجَكُم، فتمشوا في الطين والدَّحَض. فهذا يدل على أن جملة (صلوا في رحالكم) تقال بدل الحيعلة، ولا يجمع بينهما، وهذا اختيار ابن خزيمة، وهو وجه للشافعية، وظاهر مذهب الحنابلة، والمعنى يؤيد هذا؛ لأن معنى (حي على الصلاة): هلموا إليها؛ ومعنى الصلاة في الرحال: تأخروا عن المجيء، ولا يناسب إيراد اللفظين معاً؛ لأن أحدهما نقيض الآخر. قال النووي: (الأمران جائزان، نص عليهما الشافعي رحمه
