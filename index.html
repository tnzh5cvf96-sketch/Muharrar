ببه، وإن لم ينتبه كرره حتى يحصل المقصود.", "وحكمة التفريق يبن الرجال والنساء في موضوع التنبيه أثناء الصلاة ظاهرة، فإن المرأة مأمورة بخفض صوتها في الصلاة مطلقا خشية الافتتان بها، ولهذا نهيت عن رفع صوتها في القراءة والتلبية ونحو ذلك من مسائل العبادات، وكذا في غير العبادة لا ترفع صوتها إذا كان بحضرتها أجانب.", "لكن إن كانت المرأة بحضرة نساء فقط فهل تسبح - لأن التسبيح ذكر مشروع في الصلاة بخلاف التصفيق - أو أنها تصفق مطلقا؟ المسألة محتملة فمن أخذ بعموم الحديث وأن النساء لهن التصفيق قال بالثاني، ومن أخذ بالتعليل المذكور والمعنى المتقدم قال: تسبح، وقد يؤيد ذلك ظاهر الحديث فإن قوله: «فليسبح الرجال ولتصفق النساء»، قد يفهم منه أن المراد مع اجتماع الرجال والنساء؛ لأنه أعطى كل صنف حكمه، فإذا انفردن سبحن.", "ب- إذا أخذنا برواية الحصر: «إنما التصفيق للنساء»، فهي دليل على أن التصفيق من خصائص النساء، وأنه لا مدخل للرجال في ذلك بحال من الأحوال.", "وبهذا يتبين أن ما يفعله كثير من الناس من التصفيق في المحافل عند رؤيتهم ما يعجبهم أن هذا سخف ودليل على قلة العقل، والله تعالى ذم المشركين بقوله: {وما كان صلاتهم عند البيت إلا مكاء وتصدية} [الأنفال: ٣5] والمكاء: هو الصفير، والتصدية: التصفيق، كما قال بذلك جمهور المفسرين.", "ثم إنه لم يكن من هدي النبي صلى الله عليه وسلم ولا أصحابه ولا سلف هذه الأمة إذا رأوا ما يعجبهم أو سمعوا الخطب والأشعار أنهم يصفقون، وإنما حدث ذلك عن طريق التشبه بأعداء الله تعالى، وقد قدم النبي صلى الله عليه وسلم المدينة واستقبله المهاجرون والأنصار ولم ينقل أنهم صفقوا.", "فالمسلم إذا أعجبه شيء يقول: ما شاء الله، أو يقول: الله أكبر، ونحو ذلك مما له أصل في الشرع في مثل هذه الأحوال، والله تعالى أعلم."]}, "15": {"m": "وَعََنْ مُطََرِفِ بْنِ عَبْدِ اللَّهِ بْنِ الشِخِيرَِ، عَنْ أَبِيَهِ رضي الله عنه قَالَ: «رَأَيْتُ رَسُولَ اللَّهِ صلى الله عليه وسلم يُصَلِي وَفِي صَدْرِهِ أزِيزٌكَأزِيزِالمِرْجَلِ مِنَ البُكَاءِ» رَوَاهُ أحْمَدُ، وَ أبُودَاوَُدَ، وَالتِرْمِذِيُّ فِي «الشّمََائِلِ»، وَ ابْنُ حِبّانَ، وَالنّسَائِيُّ - وَعِنْدَهُ: «وَقَالَ يَعْنِي: يَبْكِي» -. وَقَدْ وَهِمَ فِي هَذَا الحَدِيثِ مَنْ قَالَ: «أخْرَجَهُ مُسْلِمٌ»، وَاللَّهُ أعْلَمُ.", "w": ["قوله: (وفي صدره أزيز) بفتح الهمزة بعدها زاي معجمة مكسورة ثم ياء ثم زاي، أي: صوت وغليان بالبكاء.", "قوله: (كأزيز المرجل) بكسر الميم، وهو القدر، فإنه عند غليان الماء فيه بالنار يخرج منه صوت.", "وقوله: (من البكاء) بيان لما قبله، والبكاء: بالمد، خروج الدمع مع الصوت."], "s": ["الحديث دليل على أن البكاء في الصلاة من خشية الله تعالى أو النشيج لا يبطلها، ولا يؤثر فيها؛ لأن هذا ليس من الكلام، وإنما هو من آثار الخشوع والانطراح فيها بين يدي الله تعالى عند قراءة الآيات أو سماعها، قال عبد الله بن شداد: سمعت نشيج عمر بن الخطاب في صلاة الصبح وهو يقرأ من سورة يوسف، وأنا في آخر الصفوف، يقرأ: {إنما أشكو بثي وحزني إلى الله} [يوسف: 86].", "فإن كان البكاء في الصلاة لغير خشية الله تعالى بل لعارض آخر كأن يأتيه خبر وهو يصلي بأن فلانا قد مات فيبكي، فالمشهور من مذهب الإمام أحمد أنه يبطل الصلاة إن ظهر منه حرفان، وهو قول مالك، وأبي حنيفة، لكن إن غلبه البكاء ولم يستطع دفعه فالصواب أن صلاته لا تبطل؛ لأن هذا بغير اختياره، يقول شيخ الإسلام ابن تيمية: (فأما ما يغلب على المصلي من عطاس وبكاء وتأوه، فالصحيح عند جمهور العلماء أنه لا يبطل، وهو منصوص أحمد وغيره)، والله أعلم.", "المراد بصفة الصلاة: الكيفية التي ينبغي أن تكون عليها، وذلك بتحقيق أركانها وواجباتها، وسننها القولية والفعلية.", "والنبي صلى الله عليه وسلم قد بين للأمة صفة الصلاة بالقول والفعل، وقال: «صلوا كما رأيتموني أصلي».", "ولهذا حرص الصحابة رضي الله عنهم على التأسي بالنبي صلى الله عليه وسلم في الصلاة حتى سألوه عن أشياء، ونقلوا هذه الصفة للأمة، ومن الملاحظ في أحاديث صفة صلاة النبي صلى الله عليه وسلم أنه لم يستوعب أحد من الصحابة صفة الصلاة كاملة، وإنما أخذ مجموعها من مجموعهم، كما سيتبين ذلك إن شاء الله.", "وحري بالمكلف أن يتأسى بنبيه صلى الله عليه وسلم في صفة صلاته، فإن ذلك أقوى في إيمانه، وأدل على اتباعه لرسول الله صلى الله عليه وسلم، وأكمل في عبادته، وكثير من الناس يخلون في الصلاة بأشياء، إما جهلا وإما تهاونا.", "وقد عقد المصنف هذا الباب لسياق الأحاديث الدالة على صفة الصلاة، وهي في صفة صلاة النبي صلى الله عليه وسلم، وقد رتبها ترتيباً مناسباً، فذكر في أول الباب حديث المسيء في صلاته، وفيه بيان صفة الصلاة بالقول، ثم ذكر حديث أبي حميد الساعدي رضي الله عنه في صفة صلاة النبي صلى الله عليه وسلم، ثم ساق بعد ذلك أحاديث كثيرة في جزئيات الصلاة ابتداء من أدعية الاستفتاح إلى نهاية الصلاة."], "t": ["الحديث أخرجه من ذكرهم المصنف من طريق حماد بن سلمة، عن ثابت، عن مطرف، عن أبيه. وإسناده صحيح على شرط مسلم، صححه الحاكم، وسكت عنه الذهبي، وصححه ابن حبان، وابن خزيمة، والألباني في تعليقه على «الشمائل»، وقال الحافظ: (إسناده قوي)."]}, "16": {"m": "عَنْ أَبِي هُرَْيرَةَ رضي الله عنه: «أَنّ النّبِيّ صلى الله عليه وسلم دَخَلَ المَسْجِدَ، فَدَخَلَ رجَُلٌ فَصَلّى، ثُمّ جَاءَ فَسَلّمَ عَلَى النّبِيِ صلى الله عليه وسلم فَرَدّ عَلَيْهِ السّلامَ، فَقَالَ: ارجِْعْ فَصَلِ؛ فَإِنّكَ لَمْ تُصَلِ. فَصَلّى، ثُمّ جَاءَ فَسَلّمَ عَلَى النّبِيِ صلى الله عليه وسلم، فَقَالَ: ارجِْعْ فَصَلِ؛ فَإِنّكَ لَمْ تُصَلِ - ثَلاثا -. فَقَالَ: وَالّذِي بَعَثَكَ بِالحَقِ! مَا أُحْسِنُ غَيْرَهُ فَعَلِمْنِي، قَالَ: إِذَا قُمْتَ إِلَى الصّلاةِ؛ فَأسْبِغِ الوُضُوءَ، ثُمّ اسْتَقْبِلِ القِبْلَةَ، فَكَبِرْ. ثُمّ اقْرَْأ مَا تَيَسّرَمَعَكَ مِنَ القُرْآنِ. ثُمّ ارْكَعْ حَتّى تَطْمَئِنّ رَاكِعا، ثُمّ ارْفَعْ حَتّى تَعْتَدِلَ قَائِما. ثُمّ اسْجُدْ حَتّى تَطْمَئِنّ سَاجِدا، ثُمّ ارْفَعْ حَتّى تَطْمَئِنّ جَالِسا، ثُمّ اسْجُدْ حَتّى تَطْمَئِنّ سَاجِدا. ثُمّ افْعَلْ ذَلِكَ فِي صَلاتِكَ كُلِهَا» مُتّفَقٌ عَلَيْهِ، وَهَذَا لَفْظُ البُخَارِي.ِ", "s": ["أ-الحديث دليل على وجوب الوضوء للصلاة، وأن المكلف مأمور بإسباغه، وهو إكماله وإتمامه، وتقدم ذلك في «الوضوء».", "ب- الحديث دليل على وجوب استقبال القبلة في الصلاة، وتقدم ذلك.", "ج- الحديث دليل على وجوب تكبيرة الإحرام، بلفظ: (الله أكبر)، لقوله: (فكبر)، وعند الطبراني (ثم يقول: الله أكبر) وهي ركن لا تنعقد الصلاة إلا بها، ولو قال: الله أجل، أو أعظم، لم يصح، خلافاً لمن قال: تنعقد الصلاة بكل ما يدل على التعظيم، والحديث يرد ذلك، مع ما سيأتي من أحاديث في صفة صلاة النبي صلى الله عليه وسلم، كحديث عائشة رضي الله عنها: (كان رسول الله صلى الله عليه وسلم يستفتح الصلاة بالتكبير …)، وظاهر الحديث أن دعاء الاستفتاح لا يجب، إذ لو وجب لأمره به، وقيل: إن رواية أبي داود تفيد ذلك، (ثم يكبر الله ويحمده ويثني عليه، ويقرأ بما شاء من القرآن..)، وقيل: إن المراد بذلك: الفاتحة، ومع الاحتمال لا يثبت شيء من ذلك.", "د- الحديث دليل على وجوب قراءة ما تيسر من القرآن، والقراءة ركن في الصلاة، وتتعين الفاتحة لمن يحسنها، لأن قوله في رواية أبي داود: (ثم اقرأ بأم القرآن وبما شاء الله)، وفي رواية ابن حبان: (ثم بما شئت) بيان لما أجمل في رواية الصحيحين: (ثم اقرأ ما تيسر معك من القرآن)، فيكون هذا مرادا به الفاتحة، لأنها كانت المتيسرة، لحفظ المسلمين لها، أو ما زاد على الفاتحة، جمعا بينه وبين الروايات الأخرى من جهة، وبينه وبين أدلة إيجاب الفاتحة من جهة أخرى، ويؤيد ذلك حديث أبي سعيد رضي الله عنه: (أمرنا أن نقرأ بفاتحة الكتاب وما تيسر). فإذا جمع بين ألفاظ الحديث كان تعين الفاتحة هو الأصل لمن معه قرآن، فإن عجز عن تعلمها وكان معه شيء من القرآن قرأ ما تيسر، وإلا انتقل إلى الذكر، فالمراحل ثلاث بالتدريج، وبهذا يتضح وجه إيراد الحافظ للروايات في حديث رفاعة رضي الله عنه وقد دل على أن من لا يحسن شيئا من القرآن فإنه يجزئه الحمد والتكبير والتهليل، دون أن يتعين عليه لفظ معين أو قدر معين.", "ه- وجوب الركوع والقيام منه والسجود مرتين والجلوس بينهما، وهي أركان لا تصح الصلاة إلا بها؛ لأن الرسول صلى الله عليه وسلم علمها المسيء بلفظ الأمر الدال على الوجوب، وقال له: (ثم افعل ذلك في صلاتك كلها).", "و- وجوب الطمأنينة في هذه الأركان كلها، وهي ركن لا تصح الصلاة بدونها على قول الجمهور من الشافعية والحنابلة والمالكية والظاهرية، لأن الرسول صلى الله عليه وسلم ذكرها هنا في الركوع والرفع والسجود والرفع منه. ولما أخل بها قال له: «ارجع فصل فإنك لم تصل»، فأمره بالإعادة وأخبره بأنه لم يصل، مع أنه كان جاهلاً، فدل ذلك على أن من ترك الطمأنينة فإنه لم يصل، ونقل شيخ الإسلام ابن تيمية إجماع الصحابة على وجوب السكون والطمأنينة في الصلاة.", "والقول الثاني: أنها واجبة وليست بفرض، فتصح الصلاة بدونها مع الإثم، وقد نُقل هذا عن أبي حنيفة ومحمد، واستدلوا بقوله تعالى: {اركعوا واسجدوا} [الحج: 77] ولم يذكر الطمأنينة، لأن الركوع هو الانحناء، والسجود هو الانخفاض، فتتعلق الركنية بالأدنى فيهما.", "والصحيح الأول؛ لقوة دليله، فإنه نص صحيح صريح في هذا الباب، يؤيد ذلك حديث أبي قتادة رضي الله عنه قال: قال رسول الله صلى الله عليه وسلم: «أسوأ الناس سرقة الذي يسرق من صلاته»، قالوا: (يا رسول الله، وكيف يسرق من صلاته؟)، قال: «لا يتم ركوعها وسجودها»، أو قال: «لا يقيم صلبه في الركوع والسجود».", "وأما الآية فهي مطلقة بينت السنة المراد بها، فإن النبي صلى الله عليه وسلم فسر الركوع والسجود بفعله وقوله، على أن شيخ الإسلام ابن تيمية قال: (إن الركوع والسجود في لغة العرب لا يكون إلا إذا سكن حين انحنائه، وحين وضع جبهته على الأرض، فأما مجرد الخفض والرفع عنه فلا يسمى ذلك ركوعاً ولا سجوداً، ومن سماه ركوعاً وسجوداً فقد غلط على اللغة …).", "وقد اختلف العلماء في حد الَاطمئنان المطلوب على قولين:", "الأول: أن المطلوب هو السكون وإن قل، وكأن هؤلاء نظروا إلى المعنى اللغوي.", "الثاني: أن المطلوب الاطمئنان بقدر الذكر الواجب بلا عجلة، ففي الركوع يطمئن بقدر ما يقول: سبحان ربي العظيم، وفي الاعتدال بقدر ما يقول: ربنا ولك الحمد، وهكذا، وهذا هو الأقوى، والفرق بين القولين: أنه إذا نسي التسبيح في ركوعه أو سجوده، أو التحميد في اعتداله، أو سؤال المغفرة في جلوسه وقلنا: إن الطمأنينة هي السكون فصلاته صحيحة، ويسجد لترك الواجب مما ذكر، وعلى القول الثاني تكون صلاته غير صحيحة، لأنه لم يستقر بقدر الذكر الواجب حيث لم يأت به.", "ز- الحديث دليل على وجوب الترتيب بين هذه الأركان على الصفة المذكورة في الحديث، لأن الرسول صلى الله عليه وسلم ذكر هذه الأفعال مرتبة بـ (ثم) وهي نص في الترتيب، وهو ركن لا تصح الصلاة إلا به، وقد واظب النبي صلى الله عليه وسلم على هذا الترتيب في جميع صلاته، وقال: «صلوا كما رأيتموني أصلي».", "ح- تبين مما تقدم أن هذا الحديث دليل على وجوب ما ذكر فيه، لأن النبي صلى الله عليه وسلم أمر هذا الرجل بأداء الصلاة على هذا الوصف الذي علمه إياه، وهذا دليل على وجوب ما ذكر فيه.", "أما ما لم يذكر فيه فلا ريب أن الحديث لم يشتمل على واجبات أخرى في الصلاة، كأذكار الركوع والسجود وركني الاعتدال، والتشهد، والصلاة على النبي صلى الله عليه وسلم والتسليم وغير ذلك، والحديث تطرقه احتمالات، منها: أن النبي صلى الله عليه وسلم لم يعلم الرجل كل الواجبات، بل يحتمل أنه اقتصر في تعليمه على ما رآه أساء فيه، أو أن الواجبات الأخرى وجبت بعد ذلك، أو أنه علمه معظم الأركان وأهمها وأحال بقية تعليمه على مشاهدة النبي صلى الله عليه وسلم في صلاته أو نحو ذلك، ومع هذه الاحتمالات فالحديث من قبيل المشتبه المجمل المعارض لأدلة صحيحة صريحة في واجبات أخرى. وعلى هذا فما جاء بصيغة الأمر في غير هذا الحديث فالقول بوجوبه ظاهر، ما لم يأت دليل صارف له عن الوجوب، لأن الأخذ بالزائد واجب، ولأن الحديث الذي جاء بصيغة الأمر إثبات لزيادة، فيعمل بها، وحديث المسيء لا يدل على عدم وجوب ما لم يذكر فيه.", "لكن لا بد للباحث المستدل أن يتتبع روايات الحديث ويجمع طرقه، لئلا ينفي شيئاً، وهو قد ورد فيه كما وقع لبعض الشراح، والله تعالى أعلم."]}, "17": {"m": "وَعَنْ مُحَمّدِ بْنِ عَمْرِوبْنِ عََطَاءٍ: «أَنّهُ كَانَ جَالِسا مَعَ نَفَرٍمِنْ أََصْحَابِ النّبِيِ صلى الله عليه وسلم، فَذَكَرَْنا صَلاةَ النّبِيِ صلَى الله عليه وسلم؛ فَقَالَ أبُوحُمَيْدٍ السّاعِدِيُّ رضَي الله عنه: أنَا كُنْتُ أحْفَظَكُمْ لِصَلاةِ رَسُولِ اللَّهِ صلى الله عليه وسلم؛ رَأيْتُهُ إِذَا كَبّرَ جَعَلَ يَدَيْهِ حَذْوَ مَنْكِبَيْهِ، وَإِذَا رَكَعَ أمْكَنَ يَدَيْهِ مِنْ رُكْبَتَيْهِ، ثُمّ هَصََرَ ظَهْرََهُ، فَإِذَا رَفَعَ رأَْسَهُ اسْتَوَى حَتّى يَعُودَ كُلُّ فَقَارٍمَكَانَهُ، فَإِذَا سَجَدَ وَضَعَ يَدَيْهِ غَيْرَمُفْتَرِشٍ وََلَا قَابِضِهِمَا وَاسْتَقْبَلَ بِأطْرَافِ أصَابِعِ رِجْلَيْهِ القِبْلَةَ. وَإِذَا جَلَسَ فِي الرّكْعَتَيْنِ جَلَسَ عَلَى رِجْلِهِ اليُسْرى وَنَصَبَ اليُمْنَى. وَإِذَا جَلَسَ فِي الرّكْعَةِ الآخِرَةِ قَدّمَ رِجْلَهُ اليُسْرى وَنَصَبَ الأُخْرى، وَقَعَدَ عَلَى مَقْعَدَتِهِ» رَوَاهُ البُخَارِيُّ.", "w": ["قوله: (إذا كبر جعل يديه حذو منكبيه)، أي: قال: الله أكبر، وهي تكبيرة الإحرام، و (جعل) بمعنى: رفع يديه، وقد جاء ذلك في حديث ابن عمر رضي الله عنهما وغيره، ومعنى: (حذو منكبيه)، أي: مقابلهما، والمنكب: رأس الكتف، وفي «القاموس»: أنه مجتمع رأس الكتف والعضد.", "قوله: (وإذا ركع أمكن يديه من ركبتيه) يفسر ذلك رواية أبي داود من طريق فليح بن سليمان: (ثم ركع، فوضع يديه على ركبتيه، كأنه قابض عليهما، ووتر يديه، فتجافى عن جنبيه، لم يصب رأسه، ولم يقنعه).", "ومعنى (وتر يديه) أي: عوجهما؛ من التوتير، وهو جعل الوتر على القوس، فشبه يد الراكع إذا مدها قابضا على ركبتيه بالقوس إذا أوترت.", "قوله: (ثم هصر ظهره) أي: ثناه في استواء من غير تقويس، وأصل الهصر: أن تأخذ برأس العود فتثنيه إليك وتعطفه، وقد جاء في رواية أبي داود: (لم يصب رأسه ولم يقنعه).", "قوله: (حتى يعود كل فقار إلى مكانه)، الفقار: بفتح الفاء والقاف، واحدتهما: فقارة، وهي مفاصل عظام الصلب والعنق.", "قوله: (غير مفترش ولا قابضهما)، الافتراش عائد على الذراعين، وقد ورد عند ابن حبان: (غير مفترش ذراعيه)، وهو بسطهما على الأرض في السجود؛ والذراع: هو العظم الذي بين العضد والكف، وقوله: (ولا قابضهما)، أي: لا يضمهما إليه.", "قوله: (وقعد على مقعدته) المقعدة: هي السافلة من الشخص."], "s": ["أ- الحديث دليل على مشروعية رفع اليدين إلى حذو المنكبين عند تكبيرة الإحرام.", "وظاهر هذا الحديث أن الرفع يكون إلى حذو المنكبين، وقد ورد في حديث وائل بن حجر رضي الله عنه: (حتى يحاذي بهما فروع أذنيه). وبهذا يتبين أن ما يفعله بعض الناس من رفع يديه إلى سرته أو فوقها بقليل أن هذا تقصير في تطبيق السنة. وظاهر الحديث - أيضا - أنه يكبر ثم يرفع، لقوله: (إذا كبر جعل..) وفي حديث مالك بن الحويرث رضي الله عنه: (كبر ثم رفع يديه)، وفي رواية لأبي داود من طريق يحيى بن سعيد، عن عبد الحميد بن جعفر، عن محمد بن عمرو بن عطاء، عن أبي حميد رضي الله عنه: (كان رسول الله صلى الله عليه وسلم إذا قام إلى الصلاة يرفع يديه حتى يحاذي بهما منكبيه ثم يكبر). وظاهر هذا أنه يرفع يديه ثم يكبر.", "وفي حديث ابن عمر رضي الله عنهما قال: (رأيت النبي صلى الله عليه وسلم افتتح التكبير في الصلاة، فرفع يديه حين يكبر..) وهذا يدل على أن الرفع يقارن التكبير، وفي رواية: (كان رسول الله صلى الله عليه وسلم إذا قام للصلاة رفع يديه … ثم كبر). وهذا يدل على تقديم رفع اليدين، والأظهر - والله أعلم - أن هذا من العمل المخير فيه، لورود الأدلة بذلك كله.", "والأفضل أن يبدأ التكبير مع رفع يديه، وينهيه مع انتهاء الرفع، لأن الرفع للتكبير.", "ب- الحديث مع رواية أبي داود المذكورة دليل على أن الركوع المو افق للسنة ما اجتمع فيه صفات أربع:", "١ - أن يمكن كفيه من ركبتيه، كأنه قابض عليهما.", "٢ - أن يهصر ظهره ويمده، فلا يقوسه.", "٣ - أن يجعل رأسه حيال ظهره، فلا يرفعه عن مستوى ظهره ولا يخفضه.", "٤ - أن يجافي مرفقيه عن جنبيه ما لم يؤذ أحدا وإلا ترك ذلك.", "ج- الحديث دليل على صفة الرفع من الركوع وهو أن يرفع رأسه من الركوع رافعاً يديه، ويعتدل قائماً حتى يرجع كل عضو إلى موضعه، وفي قوله: (حتى يعود كل فقار مكانه) دليل على وجوب الطمأنينة في الرفع من الركوع، كما تقدم في حديث المسيء.", "د- الحديث دليل على صفة السجود وقد جاء في رواية أبي داود: (ثم سجد فأمكن أنفه وجبهته، ونحى يديه عن جنبيه، ووضع كفيه حذو منكبيه)، وقد دل على أن السجود المو افق للسنة ما اجتمع فيه هذه الصفات:", "١ - أن يبسط كفيه على الأرض مضمومتي الأصابع إلى القبلة.", "٢ - لا يفترش ذراعيه، بل يرفعهما ويجافي عضديه عن جنبيه، وبطنه عن فخذيه، وفخذيه عن ساقيه، ما لم يؤذ أحدا، وأن يثني أصابع رجليه بحيث تكون في اتجاه القبلة، وسيأتي زيادة تفصيل في الأحاديث الآتية إن شاء الله.", "ه- الحديث دليل على صفة الجلوس في التشهد الأول، وهي أن يجلس مفترشاً رجله اليسرى ناصباً اليمنى، ولم يذكر في رواية البخاري صفة اليدين حال التشهد، وقد ورد ذلك في رواية لأبي داود، وسيأتي بيان ذلك في حديث ابن عمر رضي الله عنهما إن شاء الله.", "و- الحديث دليل على صفة الجلوس في التشهد الأخير، وهي التورك؛ ومعناه: أن يفرش رجله اليسرى ويخرجها عن يمينه، وينصب اليمنى، جاعلاً مقعدته على الأرض.", "وفي ذكره كيفية الجلوسين دليل على تغايرهما، وكأن الحكمة في ذلك - والله أعلم - أن التشهد الأول أخف، فيكون الجالس فيه متهيئاً للقيام، بخلاف التشهد الأخير، فإنه لطوله يكون الجالس مستقرًا.", "وقد جاء عند أبي داود في حديث أبي حميد رضي الله عنه: (فإذا كانت الرابعة أفضى بوركه اليسرى إلى الأرض وأخرج قدميه من ناحية واحدة)، وفي لفظ آخر: (فإذا كانت السجدة التي فيها التسليم أخرج رجله اليسرى، وقعد متوركاً على شقه الأيسر).", "وهذا دليل لمالك والشافعي وأحمد على مشروعية التورك في التشهد الأخير، وله صفتان، كما في لفظ البخاري، ورواية أبي داود المذكورة.", "لكن الشافعي ومالك يقولان بأنه يتورك في التشهد الأخير مطلقاً، سواء كانت الصلاة فيها تشهدان، كالرباعية والثلاثية، أم لا كالفجر.", "وقال أحمد: يتورك في كل صلاة فيها تشهدان، استدلالاً بحديث أبي حميد بلفظ البخاري، لأنه ذكر التورك في الجلسة التي في التشهد الثاني، وقد ذكر قبله صفة جلوسه في التشهد الأول.", "وأما لفظ أبي داود: (حتى إذا كانت الجلسة التي فيها التسليم..)، فإنه وإن كان ظاهره أن التورك في كل تشهد يليه سلام لكنه ليس بصريح في الدلالة، لأن قائل ذلك ذكر صفة جلوسه في التشهد الأول.", "فإن كانت الصلاة ثنائية كالفجر جلس مفترشاً، وقد جاء في «مسائل الإمام أحمد» لابن هانئ: سألت أبا عبد الله عن التورك في الصلاة؟ قال: في الظهر والعصر والمغرب وعشاء الآخرة.", "وفي «مسائله» لابنه عبد الله قال: سألت أبي عن التورك في الصلاة؟ فقال: حديث أبي حميد عن النبي صلى الله عليه وسلم أنه كان يتورك في الرابعة، قلت لأبي: ففي الفجر وفي صلاة الجمعة يتورك؟ قال: لا يتورك في الفجر ولا في الجمعة، إنها جلسة واحدة، قلت لأبي: فإن الشافعي يقول: يتورك، لأن التورك إنما جعل من طول القعود؟ قال أبي: ليس هو عندي كذا، لا يتورك الرجل إلا في الصلاة التي يجلس فيها جلستين.", "وقد ذكر الألباني في صفة الصلاة أنه صلى الله عليه وسلم كان يجلس مفترشاً إذا كانت الصلاة ركعتين كالصبح، كما كان يجلس بين السجدتين، وعزاه للنسائي بإسناد صحيح، وأما أبو حنيفة فإنه يرى الافتراش مطلقاً، فيفترش رجله اليسرى، وينصب اليمنى في القعدتين جميعاً، والله تعالى أعلم."]}, "18": {"m": "وَعَنْ عَبْدَةَ: «أَنّ عُمَرَبْنَ الخَطّابِ رضي الله عنه كَانَ يَجْهَرُبِهَؤَُلَاءِ الكَلِمَاتِ؛ يَقُولُ: سُبْحَانَكَ اللّهُمّ وَبِحَمْدِكَ، تَبَاركََ اسْمَُكَ، وَتَعَالَى جَدُّكَ، وََلَا إِلَهَ غَيْرُكَ». ذَكَرَهُ مُسْلِمٌ فِي «صَحِيحِهِ»؛ لأِنّهُ سَمِعَهُ مَعَ غَيْرِهِ. وَلَيْسَ هُوَعَلَى شََرْطِهِ؛ فَإِنّ عَبْدَةَ بْنَ أبِي لُبَابَةَ لَمْ يَُدْرِكْ عُمَرَ، بَلْ وَلَمْ يَسْمَعْ مِنِ ابْنِهِ؛ إِنّمَا رآَهُ رُؤْيَةا. وََقَدْ رََوَى الدّارَقُطْنِيُّ بِإِسْنَادِهِ عَنِ الأسْوَدِ، عَنْ عُمَرَ رضي الله عنه: «أنّهُ كَانَ يَقُولُ هَؤَُلَاءِ الكَلِمَاتِ». وَقَالَ المَرُّوذِيُّ: «سَألْتُ أبَا عَبْدِ اللَّهِ عَنِ اسْتِفْتَاحِ الصّلاةِ؛ فَقَالَ: نَذْهَبُ فِيهِ إِلَى حَدِيثِ عُمَرَ، وَقَدْ رُوِيَ فِيهِ مِنْ وُجُوهٍ لَيْسَتْ بِذَاكَ».", "s": ["الحديث دليل على مشروعية استفتاح الصلاة بعد تكبيرة الإحرام بهذه الاستفتاحات أو بغيرها مما ورد في السنة، وهي كما ذكرشيخ الإسلام ابن تيمية ثلاثة أنواع: الأول: ثناء على الله تعالى متضمن للإخبار عن صفات كماله، ونعوت جلاله مثل: سبحانك اللهم وبحمدك..، والثاني: ما كان إنشاء من العبد أو اعترافاً بما يجب لل عليه من العبودية مثل حديث علي رضي الله عنه، والثالث: ما كان دعاء من العبد، مثل حديث أبي هريرة رضي الله عنه.", "والأفضل أن يأتي بهذا تارة وبهذا تارة أخرى، لأن في ذلك إحياء للسنة، وهو أحضر للقلب وأدعى لفهم ما يقول، كما أن في ذلك تحصيل مصلحة كل واحد من تلك الأنواع، فإن كل نوع لا بد له من خاصية، ثم إن في المداومة على نوع دون غيره هجراناً لبعض المشروع، وهذا سبب لنسيانه والإعراض عنه، وهذه قاعدة عامة في كل عبادة جاءت على وجوه متعددة، وهذا كثير في الصلاة، وهو رأي شيخ الإسلام ابن تيمية، وقد تكلم على ذلك الحافظ ابن رجب في قواعده (القاعدة الثانية عشرة)، وبسط الكلام على ذلك ابن تيمية بسطاً قد لا تجده لغيره.", "وقد ذكر ابن القيم اختيار الإمام أحمد لحديث عمر رضي الله عنه (سبحانك اللهم وبحمدك) وذلك لعشرة أوجه، منها؛ أن عمر رضي الله عنه جهر به يعلمه الصحابة رضي الله عنهم، ومنها أنه ثناء على الله تعالى. والله تعالى أعلم."], "t": ["حديث عمر رضي الله عنه فقد أخرجه مسلم في كتاب «الصلاة»، باب «عدم الجهر بالبسملة» من طريق الأوزاعي، عن عبدة بن أبي لبابة، أن عمر بن الخطاب رضي الله عنه كان يجهر بهؤلاء الكلمات، يقول: سبحانك اللهم وبحمدك.", "وهذا سند منقطع - كما قال الحافظ - لأن عبدة لم يسمع من عمر رضي الله عنه قال ابن كثير: (عبدة بن أبي لبابة لم يدرك عمر بن الخطاب، وإنما لقي ابنه عبد الله بن عمر كما قال الإمام أحمد بن حنبل، وهو من ثقات المسلمين وأئمتهم، وهذا الأثر ثابت عن أمير المؤمنين من غير وجه).", "وقد أخرجه مسلم استطراداً، لأن مقصوده الأصلي هو الحديث الذي أخرجه بعد هذا الأثر، في عدم الجهر بالبسملة، وهو صحيح متصل، وإنما لم يقتصر على الحديث المتصل، لأنه سمعه هكذا فأداه كما سمعه، ولهذا نظائر ولا إنكار في هذا كله.", "وقد رواه الدارقطني في سننه موصولا من طريق عبد الله بن شبيب، حدثني إسحاق بن محمد، عن عبد الرحمن بن عمر بن شيبة، عن أبيه، عن نافع، عن ابن عمر، عن عمر، به مرفوعا.", "قال الدارقطني عقبه: (رفعه هذا الشيخ - يعني عبد الرحمن - عن أبيه، عن نافع، عن ابن عمر، عن عمر عن النبي صلى الله عليه وسلم، والمحفوظ عن عمر من قوله، كذلك رواه إبراهيم عن علقمة والأسود عن عمر، وكذلك رواه يحيى بن أيوب، عن عمر بن شيبة، عن نافع، عن ابن عمر، عن عمر من قوله، وهو الصواب)، ثم ساق هذه الروايات بأسانيدها."]}, "19": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «كَانَ رَسُْولُ اللَّهِ صلى الله عليه وسلم يَسْتَفْتِحُ الصّلاةَ بِالتّكْبِيرِ، وَالقِرَاءَةَ بِـ {الحَمْدُ للَّهِِ رَبِ العَالمَِينَ}، وَكَانَ ذَا رَكَعَ لَمْ يُشْخِصْ رأَسَهُ وَلَمْ يُصَوِبْهُ، وَلَكِنْ بَيْنَ ذَلِكَ. وَكَانَ إِذَا رَفَعَ رأَسَهُ مِنَ الرُّكُوعِ لَمْ يَسْجُدْ حَتّى يَسْتَوِيَ قَائِما. وَكَانَ إِذَا رَفَعَ رأَْسَهُ مِنَ السّجْدَةِ لَمْ يَسْجُدْ حَتّى يَسْتَوِيَ جَالِسا. وَكََانَ يَقُولُ فِي كُلِ رَكْعَتَيْنِ التّحِيّةَ. وَكَانَ يَفْرُشُ رِجْلَهُ اليُسْرى وَيَنْصِبُ رِجْلَهُ اليُمْنَى. وَكَانَ يَنْهَى عَنْ عُقْبَةِ الشّيْطَانِ، وَيَنْهَى أنْ يَفْتَرِشَ الرّجُلُ ذِراعَيْهِ افْتِرَاشَ السّبُعِ. وَكَانَ يَخْتِمُ الصّلاةَ بِالتّسْلِيمِ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (كان يستفتح الصلاة بالتكبير)، كان: فعل ماض ناقص، وإذا كان خبرها فعلا مضارعا دل على الاستمرار ما لم تقم قرينة على خلافه، وتقدم ذلك، والمراد بالتكبير: تكبيرة الإحرام، لحديث: (تحريمها التكبير).", "قوله: (والقراءة بالحمد لل..) بالنصب عطفا على (الصلاة)، والحمد: بضم الدال على الحكاية، فلا يؤثر فيه حرف الجر، أي: بهذه السورة.", "قوله: (لم يشخص رأسه ولم يصوبه) يشخص: بضم الياء وسكون الشين، ماضيه: أشخص الرباعي، أي: لم يرفعه. ولم يصوبه: بضم الياء وفتح الصاد وكسر الواو المشددة، أي: ينزله.", "قوله: (ولكن بين ذلك) أي: بين الرفع والتنزيل، ليكون مستوياً مع الظهر.", "قوله: (وكان ينهى عن عقبة الشيطان)، بضم العين وسكون القاف وفي رواية لمسلم: (وكان ينهى عن عقب الشيطان)، وهي أن يفرش قدميه، فيجعل ظهورهما نحو الأرض، ويجلس على عقبيه، ذكر ذلك ابن دقيق العيد.", "والقول الثاني: أن عقبة الشيطان أن يلصق الرجل أليتيه بالأرض، وينصب ساقيه وفخذيه، ويضع يديه على الأرض، وهذا تفسير أبي عبيدة معمر بن المثنى وغيره.", "والقول الثالث: أن يضع أليتيه على عقبيه بين السجدتين، وهذا هو الذي ذكره أبو عبيد، والزمخشري وقال: (هو الذي يجعله بعض الناس الإقعاء)، وهذا المعنى لا شك أنه إقعاء، كما ثبت في الصحيح، لكنه غير منهي عنه، ولعل مرادهم الأول، وأضيفت العقبة للشيطان إما تقبيحاً لها، أو لأنها من فعله أو أمره.", "قوله: (أن يفترش الرجل ذراعيه) أي: يبسطهما على الأرض في السجود.", "قوله: (افتراش السبع) أي: كافتراش السبع، وأضيفت إلى السبع تقبيحا وتنفيرا، والسبع: كل حيوان مفترس."], "s": ["أ- الحديث دليل على وجوب افتتاح الصلاة بالتكبير، وهو لفظ (الله أكبر) فلا تكفي النية، ولا غير التكبير من ألفاظ التعظيم، كما تقدم.", "والحكمة من استفتاح الصلاة بالتكبير: استحضار المصلي عظمة من يقف بين يديه، وأنه أكبر من كل شيء يخطر بباله، فيخشع ويستحي أن يشتغل بغيره أو يحدث نفسه بسواه سبحانه وتعالى.", "ب- الحديث دليل على أن القراءة في الصلاة تبدأ بالفاتحة، فلو قرأ قبلها شيئاً من القرآن لم يعتد به.", "وليس في ذلك ما يدل على أنه يترك الاستفتاح بين التكبير والقراءة، وأنه لو تخلل بينهما ذكر لم يكن الاستفتاح بالحمد، لأن المراد استفتاح القراءة لا الاستفتاح المطلق.", "ج- الحديث دليل على أن من صفة الركوع الموافق للسنة التسوية بين الرأس والظهر حال الركوع، فلا يرفع رأسه عن مستوى ظهره ولا ينزله عنه، وتقدم بيان ذلك.", "د- الحديث دليل على مشروعية الاستقرار في القيام بعد الركوع والجلوس بين السجدتين، والمراد بذلك الطمأنينة، وقد ثبت بالسنة قولاً وفعلاً، كما تقدم.", "ه- الحديث دليل على مشروعية قراءة التحيات في آخر كل ركعتين، فإن كانت الصلاة ثنائية أتم التشهد وسلم، وإن كانت أكثر قام بعد التشهد الأول فأتى بما بقي من صلاته ثم تشهد وسلم.", "و- الحديث دليل على مشروعية افتراش القدم اليسرى ونصب اليمنى حال الجلوس، وهذا يشمل التشهد الأول والجلوس بين السجدتين، وأما في التشهد الأخير فقد ورد في حديث أبي حميد رضي الله عنه - المتقدم - أنه كان يقدم اليسرى وينصب اليمنى ويقعد على مقعدته، وهذا قول الشافعي، وقول أحمد في الصلاة التي فيها تشهدان، وقد مضى بيان ذلك.", "ز- الحديث دليل على أن المصلي منهي عن الجلوس على العقبين وافتراش القدمين، وكذا منهي عن أن ينصب فخذيه وساقيه ويضع يديه على الأرض ويلصق أليتيه بالأرض، بناء على تفسير (عقبة الشيطان) بهذين المعنيين ولا ريب أن المصلي في الصفة الأولى غير مستقر في جلوسه.", "ح- الحديث دليل على النهي عن افتراش الذراعين في السجود، وذلك بأن يضعهما على الأرض، لأن السنة أن يرفعهما، ويكون الموضوع على الأرض كفيه.", "وإنما نهي المصلي عن ذلك، لأنها صفة المتكاسل، والمطلوب من المصلي أن يكون على أكمل هيئة من النشاط والتباعد عما يحدث الكسل في جميع أركان الصلاة، ولأن في ذلك تشبهاً بالسباع والكلاب ولا يليق بالإنسان الذي كرمه الله تعالى وفضله أن يتشبه بالحيوان، لا سيما في حال الصلاة، وقد ورد في حديث أنس رضي الله عنه أن النبي صلى الله عليه وسلم قال: «اعتدلوا في السجود، ولا يبسط أحدكم ذراعيه انبساط الكلب».", "ط- الحديث دليل على أن ختم الصلاة والخروج منها بقول: السلام عليكم ورحمة الله، فلا تختتم بالنية، ولا بلفظ غير التسليم، لحديث: (وتحليلها التسليم)، وسيأتي زيادة كلام في هذا إن شاء الله تعالى."]}, "20": {"m": "وَعَنْ عَبْدِ اللَّهِ بْنِ عُمَرَ رضي الله عْنهما: «أَنّ رَسُولَ اللَّهِ صلى الله عَليه وسلم كَانَ يَرْفَعُ يَدَيْهِ حَذْوَ مَنْكِبَيْهِ إِذَا افْتَتَحَ الصّلاةَ وَإِذَا كَبّرَ لِلرُّكُوعِ، وَإِذَا رَفَعَ رأَسَهُ مِنَ الرُّكُوعِ رَفَعَهُمَا كَذَلِكَ أيْضَا، وَقَالَ: سَمِعَ اللَّهُ لمَِنْ حَمِدَهُ، رَبّنَا وَلَكَ الحَمْدُ، وَكَانَ لَا يَفْعَلُ ذَلِكَ فِي السُّجُودِ» مُتّفَقٌ عَلَيْهِ. وَلِلْبُخَارِي:ِ «عَنْ نَافِعٍ: أنّ ابْنَ عُمَرَ رضي الله عنهما كَانَ إِذَا دَخَلَ الصّلاةَ كَبّرَوَرَفَعَ يَدَيْهِ. وَإِذَا رَكَعَ رَفَعَ يَدَيْهِ. وَإِذَا قَالَ: سَمِعَ اللَّهُ لمَِنْ حَمِدَهُ رَفَعَ يَدَيْهِ. وَإِذَا قَامَ مِنَ الرّكْعَتَيْنِ رَفَعَ يَدَيْهِ. وَرَفَعَ ابْنُ عُمَرَرضي الله عنهما ذَلِكَ إِلَى النّبِيِ صلى الله عليه وسلم».", "s": ["أ- الحديث دليل على مشروعية رفع اليدين في ثلاثة مواضع من الصلاة: عند تكبيرة الإحرام، وعند الركوع، وعند الرفع منه، وذلك تعظيم لل تعالى وزينة للصلاة، وقد أخرج البخاري بسنده في «جزء رفع اليدين»، عن عبد الملك بن سليمان قال: سألت سعيد بن جبير عن رفع اليدين في الصلاة فقال: (هو شيء تزين به صلاتك).", "والقول برفع الأيدي في هذه المواضع هو قول الجمهور من أهل العلم، قال البخاري: (قال الحسن وحميد بن هلال: كان أصحاب رسول الله صلى الله عليه وسلم يرفعون أيديهم، لم يستثن أحد من أصحاب النبي صلى الله عليه وسلم دون أحد). وقال أبو حنيفة والثوري وابن أبي ليلى وسائر أصحاب الرأي: لا يرفع المصلي يديه إلا لتكبيرة الإحرام، واستدلوا بأدلة غير ناهضة، منها: حديث البراء بن عازب رضي الله عنه أن رسول الله صلى الله عليه وسلم كان إذا افتتح الصلاة رفع يديه إلى قريب من أذنيه ثم لا يعود، وهذا حديث ضعيف، ضعفه البخاري وأحمد والشافعي وابن عيينة، فلا تقوم به حجة، فكيف يقوم في مقابلة ما ثبت في «الصحيحين»؟ وقد طعن الحفاظ في لفظة (ثم لا يعود) واتفقوا على أنها مدرجة من يزيد بن أبي زياد أحد رواته، لأنه كان قد اختلط.", "وبقي موضع رابع ترفع فيه اليدان، وهو إذا قام من الجلسة للتشهد الأول، لحديث نافع، عن ابن عمر.", "وورد - أيضا - في حديث أبي هريرة رضي الله عنه - الآتي - كما ورد في حديث أبي حميد الساعدي رضي الله عنه: (ثم إذا قام من الركعتين كبر ورفع يديه حتى يحاذي بهما منكبيه، كما كبر عند افتتاح الصلاة..).", "قال الخطابي: (حديث أبي حميد في رفع اليدين عند النهوض من التشهد حديث صحيح، وقد شهد له بذلك عشرة من الصحابة، منهم: أبو قتادة الأنصاري، وقد قال به جماعة من أهل الحديث، ولم يذكره الشافعي، والقول به لازم على أصله في قبول الزيادات).", "ب- استدل أهل العلم بقول ابن عمر رضي الله عنهما: (وكان لا يفعل ذلك في السجود)، على أنه لا يشرع للمصلي رفع يديه عند الهوي إلى السجود، ولا عند القيام منه، ونسب الحافظ ابن رجب هذا القول إلى الجمهور، وقال: (قد نص عليه الشافعي وأحمد..).", "وذهب فريق من أهل العلم إلى أن المصلي يرفع يديه في هذين الحالين، واستدلوا بحديث مالك بن الحويرث رضي الله عنه (أنه رأى النبي صلى الله عليه وسلم يرفع يديه في صلاته إذا ركع، وإذا رفع رأسه من ركوعه، وإذا سجد، وإذا رفع رأسه من سجوده حتى يحاذي بهما فروع أذنيه).", "قال الحافظ: (إنه أصح ما وقفت عليه من الأحاديث في الرفع في السجود)، وورد - أيضا - في حديث وائل بن حجر رضي الله عنه: (أنه صلى مع النبي صلى الله عليه وسلم فكان يكبر إذا خفض وإذا رفع، ويرفع يديه عند التكبير).", "وقد ذكر الألباني أن الرفع للسجود روي عن عشرة من الصحابة.", "وأجابوا عن حديث ابن عمر بأنه نافٍ، والأدلة في هذه المسألة مثبتة، والمثبت مقدم على النافي.", "ورد ذلك بأن هذه المسألة ليست من هذا الباب، لأن النفي هنا في قوة الإثبات، فإن ابن عمر رضي الله عنهما بين وفصل، فذكر مواضع الرفع، ونفى الرفع في السجود، وعند القيام منه، فبين ما ثبت فيه الرفع، وما لم يثبت فيه الرفع، فنفيه للرفع في السجود ليس لعدم علمه بالرفع، بل لعلمه بعدم الرفع، وقد أعرض الشيخان عن أحاديث الرفع في السجود والقيام منه، والقول باستحباب الرفع في هذين الحالين يحتاج إلى أدلة قوية.", "ثم إنه في هذين الحديثين يمكن أن يكون اشتبه لفظ الرفع بالتكبير، أضف إلى ذلك أن مالك بن الحويرث ووائل بن حجر رضي الله عنهما ليسا من أهل المدينة، وابن عمر رضي الله عنهما من الملازمين للنبي صلى الله عليه وسلم وممن عرف شدة حرصه على حفظ أفعال الرسول صلى الله عليه وسلم والاقتداء به، فيدل ذلك على أن أكثر أمر النبي صلى الله عليه وسلم ترك الرفع فيما عدا المواضع الثلاثة والقيام من الركعتين، والعلم عند الله تعالى."]}, "21": {"m": "وَرَوَى عَُنْ وَ ائِلِ بْنِ حُجْرٍ رضي الله عنه: «أَنّهُ رأََى النّبِيّ صلى الله عليه وسلَم رَفَعَ يَدََيْهِ حِينَ دَخَلَ فِي الصّلاةِ وَصَفّهُمَا حِيَالَ أذُنَيْهِ، ثُمّ الْتَحَفَ ثَوْبَهُ، ثُمّ وَضَعَ يَدَهُ اليُمْنَى عَلَى اليُسْرى. فَلَمّا أَرادَ أنْ يَرْكَعَ أخْرَجَ يَدَيْهِ مِنَ الثّوْبِ ثُمّ رَفَعَهُمَا، ثُمّ كَبّرَفَرَفَعَ. فَلَمّا قَالَ: سَمِعَ اللَّهُ لمَِنْ حَمِدَهُ؛ رَفَعَ يَدَيْهِ، فَلَمّا سَجَدَ؛ سَجَدَ بَيْنَ كَفّيْهِ».", "s": ["أ- استدل بهذا الحديث من قال بمشروعية وضع اليد اليمنى على اليد اليسرى أثناء القيام في الصلاة.", "وقد ورد في وضع اليمنى على اليسرى بدون تحديد محل وضعها أحاديث أخرى منها: حديث أبي حازم، عن سهل بن سعد قال: (كان الناس يؤمرون أن يضع الرجل اليد اليمنى على ذراعه اليسرى في الصلاة)، قال أبو حازم: (لا أعلمه إلا ينمي ذلك إلى النبي صلى الله عليه وسلم)، وقد ترجم البخاري هذا الحديث بقوله: (باب وضع اليد اليمنى على اليسرى)، قال الحافظ ابن حجر: أي: (في حال القيام، وقوله: (كان الناس يؤمرون) هذا حكمه الرفع، لأنه محمول على أن الآمر لهم بذلك هو النبي صلى الله عليه وسلم..). ومعنى (ينمي ذلك) يرفع الحديث ويسنده.", "وعن ابن عباس رضي الله عنهما أن رسول الله صلى الله عليه وسلم قال: «إنا معشر الأنبياء أمرنا أن نؤخر سحورنا، ونعجل فطرنا، وأن نمسك بأيماننا على شمائلنا في صلاتنا».", "فهذا كله يدل على أن السنة وضع اليمنى على اليسرى في الصلاة، وأن هذا هدي نبينا هو والأنبياء قبله، صلوات الله وسلامه عليهم أجمعين.", "قال ابن عبد البر: (لم يأت عن النبي صلى الله عليه وسلم فيه خلاف، وهو قول الجمهور من الصحابة والتابعين، وهو الذي ذكره مالك في (الموطأ) ولم يحك ابن المنذر وغيره عن مالك غيره..).", "وأما إرسال اليدين حال القيام فهو هيئة مخالفة للسنة، فإنه لم يرد حديث صحيح في ذلك، وقد نسب الإرسال إلى الإمام مالك في رواية عنه، والمحققون من أتباع مذهبه على أنه قصد الإرسال في حالات معينة، لا مطلقاً، كيف وهو قد روى أحاديث القبض، وبوب بقوله: (باب وضع اليدين إحداهما على الأخرى في الصلاة).", "يقول الباجي - من كبار المالكية ـ: (وقد يحمل قول مالك بكراهة قبض اليدين على خوفه من اعتقاد العوام أن ذلك ركن من أركان الصلاة تبطل الصلاة بتركه).", "وقال ابن عبد البر: (وليس هذا بخلاف؛ لأن الخلاف كراهية ذلك، وقد يرسل العالم يديه ليري الناس أن ليس ذلك بحكم واجب.. ثم قال: والحجة في السنة لمن اتبعها، ومن خالفها فهو محجوج بها، ولا سيما سنة لم يثبت عن واحد من الصحابة خلافها).", "والحكمة من وضع إحدى اليدين على الأخرى أن هذه صفة السائل الذليل، وهو أمنع من العبث وأقرب إلى الخشوع، بخلاف صفة الإرسال فليس فيها شيء من ذلك، وقد روى ابن المبارك عن صفوان بن عمرو، عن مهاجر النبال أنه ذكر عنده قبض الرجل يمينه على شماله، فقال: (ما أحسنه، ذل بين يدي عزيز).", "وأخرج أبو يعلى مثله عن الإمام أحمد، قال علي بن محمد المصري الواعظ: (ما رأيت في العلم أحسن من هذا).", "وأما كيفية الوضع ففيها صفتان:", "الأولى: وضع اليد اليمنى على كف اليسرى ورسغها وساعدها، لحديث وائل بن حجر رضي الله عنه قال: لأنظرن إلى رسول الله كيف يصلي، قال فنظرت إليه، قال: فكبر، ورفع يديه حتى حاذتا أذنيه، ثم وضع يده اليمنى على ظهر كفه اليسرى والرسغ والساعد.", "الصفة الثانية: يضع يده اليمنى على ذراعه اليسرى، ودليل ذلك حديث سهل بن سعد، وفي حديث وائل بن حجر رضي الله عنه قال: (رأيت رسول الله صلى الله عليه وسلم إذا كان قائماً في الصلاة قبض بيمينه على شماله)، وظاهر هذا القبض. وإذا كانت السنة قد ثبتت بكل منهما، فللمصلي أن يفعل هذا تارة وهذا تارة، على القاعدة في العبادات المتنوعة على وجوه متعددة.", "وأما محل الوضع، فحديث الباب جاءت فيه زيادة عند ابن خزيمة تدل على أن السنة وضعهما على الصدر. وهي زيادة منكرة تفرد بها مؤمل بن إسماعيل.", "وقد ورد - أيضا - حديث قبيصة بن هلب عن أبيه رضي الله عنه: (رأيت رسول الله صلى الله عليه وسلم ينصرف عن يمينه وعن يساره، ورأيته يضع يده على صدره).", "وفي مرسل لطاووس قال: (كان رسول الله صلى الله عليه وسلم يضع يده اليمنى على يده اليسرى، ثم يشدهما على صدره وهو في الصلاة).", "والقول بوضع اليدين على الصدر هو قول الشافعي في رواية عنه، وروي عن علي رضي الله عنه ولا يصح.", "وهو اختيار الشوكاني فإنه قال: (ولا شيء في الباب أصح من حديث وائل المذكور).", "والقول الثاني: أن موضع اليدين تحت الصدر فوق السرة، وهذا رواية في مذهب مالك والشافعي وأحمد، قال أبو داود في «مسائله»: (سمعت أحمد سئل عن وضعه، فقال: فوق السرة قليلا، وإن كانت تحت السرة فلا بأس)، وقد رجحها النووي في مذهب الشافعي، وعزاه إلى سعيد بن جبير وداود.", "ودليل ذلك ما رواه غزوان بن جرير الضبي عن أبيه قال: (رأيت عليا رضي الله عنه يمسك شماله بيمينه على الرسغ فوق السرة).", "والقول الثالث: أن محلهما تحت السرة، وهذا مذهب الحنفية، ورواية عن الشافعي، ورواية عن الإمام أحمد، ذكر المرداوي أنها هي المذهب، وهو قول إسحاق، ودليل ذلك ما ورد عن علي رضي الله عنه أنه قال: (إن من السنة في الصلاة وضع الأكف على الأكف تحت السرة).", "لكنه حديث ضعيف، ولهذا لم يأخذ الإمام أحمد به، فقد جاء في «مسائل الإمام أحمد لابنه عبد الله» قال: (رأيت أبي إذا صلى وضع يديه إحداهما على الأخرى فوق السرة).", "والقول الر ابع: أن المصلي مخير بأن يضعهما فوق السرة أو تحتها أو عليها، وهذا القول رواية عن الإمام أحمد، كالقولين قبله، وقال الترمذي: (رأى بعضهم أن يضعهما فوق سرته، ورأى بعضهم أن يضعهما تحت سرته، كل ذلك واسع عندهم)، ومثل ذلك قال ابن المنذر، وهذا أظهر الأقوال، لأنه قد ثبت أن السنة وضع اليمنى على اليسرى أثناء القيام، ولم يثبت دليل في مكان الوضع، فيكون المصلي مخيرًا، والله تعالى أعلم.", "ب- ظاهر حديث الباب مع ما ذكر معه كحديث سهل بن سعد رضي الله عنه: (كان الناس يؤمرون أن يضع الرَجل اليد اليمنى على ذراعه اليسرى في الصلاة). أن السنة وضع اليمنى على اليسرى حال القيام في الصلاة، سواء أكان ذلك في القيام قبل الركوع أم بعده، وليس في السنة ما يدل على التفريق وأن السنة الوضع قبل الركوع، وأما بعده فالإرسال، ومن ادعى ذلك فعليه الدليل، والحكم الأول مبني على الأصل، فإن السنة للمصلي في حال الركوع أن يضع يديه على ركبتيه، وفي حال السجود يضعهما على الأرض، وفي حال الجلوس يضعهما على فخذيه وركبتيه، فلم يبق إلا حال القيام، ولم يرد فيه تفصيل، فيكون حكمه في الحالين واحداً.", "وذكر ابن مفلح عن الإمام أحمد أنه قال: (إذا رفع رأسه من الركوع، إن شاء أرسل يديه، وإن شاء وضع يمينه على شماله)، ولعل الإمام أحمد يرى أن القيام الذي ورد فيه الوضع هو ما كان قبل الركوع، وأما ما بعد الركوع فلم يرد فيه شيء، فيكون المصلي مخيرًا، والله أعلم."]}, "22": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عَنه قَُالَ: «كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَسْكُتُ بَيْنَ التّكْبِيرِوَالقِرَاءََةِ إِسْكَاتَةا - قَالَ: أَحْسَبُهُ قَالَ: هُنَيّةا - فَقُلْتُ: بِأبِي وَأمِي يَا رَسُولَ اللَّهِ! إِسْكَاتُكَ بَيْنَ التّكْبِيرِوَبَيْنَ القِرَاءَةِ؛ مَا تَقُولُ؟َ قَالَ: أقُولُ: اللّهُمّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ المَشْرِقِ وَالمَغْرِبِ. اللّهُمّ نَقِنِي مِنْ خَطَايَايَ كَمَا يُنَقّى الثّوْبُ الأبْيَضُ مِنَ الدّنَسِ. اللّهُمّ اغْسِلْ خَطَايَايَ بِالمَاءِ وَالثّلْجِ وَالبَرَدِ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لِلْبُخَارِي.ِ", "w": ["قوله: (اللهم) أي: يا الله، فحذفت ياء النداء وعوض عنها الميم.", "قوله: (باعد بيني وبين خطاياي)، أي اجعلها بعيدة عني، فلا أقربها، والخطايا: جمع خطيئة، وهي المعصية إما بترك ما يجب أو بفعل ما يحرم.", "قوله: (كما باعدت بين المشرق والمغرب) الكاف للتشبيه، و (ما): مصدرية، والمباعدة بين المشرق والمغرب هي غاية ما يبالغ فيه الناس، والمعنى: باعد بيني وبين خطاياي مثل مباعدتك بين المشرق والمغرب.", "قوله: (اللهم نقني) أي: خلصني ونظفني.", "قوله: (كما ينقى الثوب الأبيض من الدنس) أي: كما يغسل الثوب الأبيض إذا أصابه الدنس، فيرجع أبيض، وخص الأبيض، لأن النقاء فيه أبلغ حيث إن أقل دنس يتبين فيه بخلاف الأسود، والدنس: الوسخ.", "قوله: (اللهم اغسلني من خطاياي)، أي: طهرني بعد التنقية، فكأنه يسأل ألا يفعل الخطايا، ثم إن فعلتها فنقني منها، ثم سأله أن يزيل آثارها بزيادة التطهير بالماء والثلج والبرد.", "قوله: (بالماء والثلج والبرد) الثلج: الماء المتجمد، البرد: المطر المتجمد، ومعلوم أن الغسل بالماء الحار أبلغ في الإزالة، ولكن جيء هنا بالثلج والبرد، ليناسب حرارة الذنوب التي يراد إزالتها، نقل ذلك وبسطه ابن القيم عن شيخه ابن تيمية."]}, "23": {"m": "وَعَنْ عُبَادَةَ بْنِ الصّامِتِ رضي الله عنه أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «لَا صَلاةَ لمَِنْ لَمْ يَقْرَْأ بِأُمِ القُرْآنِ» - وَفِي رِوَ ايَةٍ: «بِفَاتِحَةِ الكِتَابِ» - مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (لا صلاة..) هذا نفي للصحة، أي: لا صلاة مجزئة، ونفي الصحة نفي للوجود الشرعي، فيكون قوله: (لا صلاة) نفيا للصلاة الشرعية، ومن ثم فلا حاجة للإضمار، ويؤيد ذلك رواية: (لا تجزئ صلاة لا يقرأ فيها بفاتحة الكتاب) لأن ما لا يجزئ فليس بصلاة شرعية، والظاهر أن المصنف أورد هذه الرواية لهذا الغرض، وقد حملته الحنفية على نفي الكمال، وسيأتي رد ذلك إن شاء الله.", "قوله: (لمن لم يقرأ) أي: للذي لم يقرأ، و (من) اسم موصول، وهو من صيغ العموم، فيشمل الإمام والمأموم والمنفرد.", "قوله: (بأم القرآن) المراد: {الحمد لل رب العالمين} إلى آخر السورة سميت بذلك لاشتمالها على المعاني التي في القرآن من الثناء على الله تعالى بما هو أهله، ومن التعبد بالأمر والنهي، والوعد والوعيد.", "قوله: (بفاتحة الكتاب) سميت بذلك لأن القرآن افتتح بها كتابة ويفتتح بها تلاوة، لأن القراءة في الصلاة تفتتح بها، فلا يقرأ في الصلاة بشيء من القرآن قبل الفاتحة، وقد ذكر معنى ذلك البخاري في أول كتاب «التفسير» من «صحيحه».", "والكتاب: القرآن، سمي به لأنه مكتوب في السماء، ويكتب في الأرض، ولهذه السورة الكريمة أسماء كثيرة، ومن المعروف أن كثرة الأسماء دليل على شرف المسمى."]}, "24": {"m": "وَعَنْ نُعَيْمٍ المُجْمِرِ قَالَ: «صَلّيْتُ وَرَاءَ أَبِي هُرَْيرَةَ رضي الله عنه فَقَرََأ: {بِسْمِ اللَّهِ الرَّحْمَنِ الرّحِيمِ}، ثُمّ قَرََأ بِأُمِ القُرْآنِ حَتّى إِذَا بَلَغَ {وَََلَا الضّالِينَ}، قَالَ: آمِينَ، وَقَالَ النّاسُ: آمِينَ. وَيَقَُولُ كُلّمَا سَجَدَ: اللَّهُ أكْبَرُ، وَإِذَا قَامَ مِنَ الجُلُوسِ مِنَ الَاثْنَتَيْنِ قَالَ: اللَّهُ أكْبَرُ. ثُمّ يَقُولُ إِذَا سَلّمَ: وَالّذِي نَفْسِي بِيَدِهِ! إِنِي لأَشْبَهُكُمْ صَلاةا بِرَسُولِ اللَّهِ صلى الله عليهُ وسلم» رَوَاهُ النّسَائِيُّ، وَرَوَاهُ ابْنُ خُزَْيمَةَ، وَ ابْنُ حِبّانَ، وَالدّارَقُطْنِيُّ، وَالحَاكِمُ، وَالبَيْهَقِيُّ، وَالخَطِيبُ - وَصَحّحُوهُ -. وَقَدْ أعِلّ ذِكْرُ البَسْمَلَةِ.", "s": ["اختلف العلماء في حكم الجهربالبسملة في الصلاة على ثلاثة أقوال:", "الأول: عدم شرعية الجهر بها، بل تقرأ قبل الفاتحة سرًا، وهذا هو المروي عن الخلفاء الراشدين، وذكره ابن المنذر عن جماعة من الصحابة والتابعين، وهو قول أصحاب الرأي وأحمد، وقال ابن قدامة: (لا تختلف الروايات عن أحمد أن الجهر بالبسملة غير مسنون)، واختاره ابن تيمية ونصره.", "واستدلوا بحديث أنس المذكور هنا، وقد أخرجه الشيخان وأصحاب السنن وغيرهم بألفاظ متقاربة يصدق بعضها بعضاً. وذلك أن أنساً رضي الله عنه كان ممن يخدم النبي صلى الله عليه وسلم ويلازمه حضرًا وسفرًا، وهو ينفي سماع جهره بالبسملة نفياً مبنياً على علم، لا على كونه لا يسمع، مع إمكان الجهر بلا سماع، ولا يمكن مع هذا القرب والصحبة الطويلة ألا يسمع النبي صلى الله عليه وسلم يجهر بها مع كونه يجهر بها، ومما يؤيد ذلك أن النبي صلى الله عليه وسلم لو كان يجهر بها دائماً لكانت الهمم والدواعي متوفرة على نقل ذلك، كجهره بسائر الفاتحة.", "ومن أدلة ذلك ما ورد عن ابن عبد الله بن مغفل قال: (سمعني أبي وأنا أقول: بسم الله الرحمن الرحيم، فقال: (أي بني إياك والحدث، قال: ولم أر أحدا من أصحاب رسول الله صلى الله عليه وسلم كان أبغض إليه الحدث في الإسلام يعني منه، قال: وصليت مع النبي صلى الله عليه وسلم ومع أبي بكر وعمر ومع عثمان فلم أسمع أحداً يقولها فلا تقلها، إذا أنت صليت فقل: الحمد لل رب العالمين).", "القول الثاني: أنه يسن الجهر بها، وبه قال الشافعي ومن وافقه، واستدلوا بحديث نعيم المجمر المذكور هنا، وهو من أقوى أدلتهم.", "القول الثالث: أنه يخير بينهما، وهو قول إسحاق بن راهويه، وابن حزم، وكأن هؤلاء أرادوا العمل بجميع الأدلة، ما يدل على الجهر وما يدل على الإسرار، ذكر ذلك ابن المنذر.", "والقول الأول هو الراجح، لأن حديث أنس رضي الله عنه برواياته صحيح صريح في المسألة لا يقبل أي تأويل، وأما حديث نعيم المجمر فعنه جوابان:", "الأول: أنه معلول بما تقدم.", "الثاني: على القول بصحته - وهذا متوجه - فهو ليس صريحاً في الجهر، وإنما فيه أنه قرأ البسملة، وهذا يصدق بقراءتها سرا، وعلى تقدير أنه جهر بها فهو محمول على أن النبي صلى الله عليه وسلم كان يجهر بها في بعض الأحيان، ليعلم الناس استحباب قراءتها في الصلاة، أو جهر بها جهرا يسمعه من قرب منه، والمأموم إذا قرب من الإمام أو حاذاه سمع منه ما يخافت به، ولا يسمى ذلك جهرا، وقد كان النبي صلى الله عليه وسلم يسمعهم الآية أحيانا، كما سيأتي، وبمثل ذلك تجتمع الأحاديث، ويستفاد من مجموعها أن السنة عدم الجهر بالبسملة، لكن لو جهر بها بعض الأحيان فلا حرج ليعلم المأموم أنه يسمي، وأن التسمية مشروعة.", "قال ابن تيمية: (اتفق أهل المعرفة بالحديث على أنه ليس في الجهر بها حديث صريح، ولم يرو أهل السنن المشهورة شيئاً من ذلك..)، والله تعالى أعلم."], "t": ["حديث نعيم المجمر رحمه الله أخرجه من ذكرهم المصنف من طريق الليث بن سعد قال: (أخبرني خالد بن يزيد، عن سعيد بن أبي هلال، عن نعيم المجمر قال: (صليت وراء أبي هريرة رضي الله عنه … فذكره)).", "قال الدارقطني: (هذا حديث صحيح، ورواته كلهم ثقات)، وقال البيهقي في «الخلافيات»: (رواته كلهم ثقات، مجمع على عدالتهم، محتج بهم في الصحيح)، وقال في «سننه»: (إسناده صحيح، وله شواهد).", "ولما ساق ابن حزم هذا الحديث قال عن سعيد بن أبي هلال: (ليس بالقوي)، وقد رده الحافظ في «التقريب»، فقال: (لم أر لابن حزم في تضعيفه سلفا، إلا أن الساجي حكى عن أحمد أنه اختلط).", "وقال في «هدي الساري»: (ذكره الساجي بلا حجة، ولم يصح عن أحمد تضعيفه).", "وقد أعل هذا الحديث بأن ذكر البسملة فيه شاذ ومخالف لجميع الثقات الذين رووا الحديث عن أبي هريرة رضي الله عنه ولم يذكروها، وهم ثمانمائة، ما بين صاحب وتابع، ولا يثبت عن ثقة من أصحاب أبي هريرة رضي الله عنه أنه حدث عنه أنه صلى الله عليه وسلم كان يجهر بالبسملة، وقد أعرض عن ذكر البسملة صاحبا الصحيح وغيرهما، فأخرج الحديث البخاري من حديث أبي سلمة، عن أبي هريرة رضي الله عنه في عدة مواضع، ليس فيها ذكر البسملة وأخرجه مسلم أيضا من عدة طرق."]}, "25": {"m": "وَعَنْ عُبَادَةَ بْنِ الصّامِتِ رضي الله عنه قَالَ: «كُنّا خَلْفَ رَسُولِ اللَّهِ صلى الله عليه وسلم فِي صَلاةِ الفَجْرِ، فَقَرََأ رَسُولُ اللَّهِ صلى الله عليه وسلم، فَثَقُلَتْ عَلَيْهِ القِرَاءَةُ، فَلَمّا فَرَغَ قَالَ: لَْعَلّكُمْ تَقْرََؤُونَ خَلْفََ إِمَامِكُمْ؟ قُلْنَا: نَعَمْ؛ هَذا يَا رَسُولَ اللَّهِ! قَالَ: لَا تَفْعَلُوا إِلَاّ بِفَاتِحَةِ الكِتَابِ؛ فَإِنّهُ لَا صَلاةَ لمَِنْ لَمْ يَقْرَأ بِهَا» رَوَاهُ أحْمَدَُ، وَ أبُو دَاوُدَ، وَالتِرْمِذِيُّ - وَحَسّنَهُ -، وَ ابْنُ حِبّانَ، وَالدّارَقُطْنِيُّ - وَقَالَ: «إِسْنَادُهُ حَسَنٌ» -. وَصَحّحَهُ البُخَارِيُّ، وَتَكَلّمَ فِيهِ أحْمَدُ، وَ ابْنُ عَبْدِ البَرِ، وَغَيْرُهُمَا. وَهُوَ مِنْ رِوَ ايَةِ ابْنِ إِسْحَاقَ.", "s": ["وقد أعل هذا الحديث بعلل ومنها: أن محمد بن إسحاق مدلس وقد عنعنه، ورد ذلك بأنه صرح بالسماع في رواية أحمد (٣7/ ٤09) والبيهقي (٢/ ١6٤) ثم إنه لم ينفرد به، فقد تابعه في الرواية عن مكحول زيد بن واقد القرشي عند البخاري في «جزء القراءة» ص (١8)، وأبي داود (8٤7)، والدارقطني (١/ ٣١9) والبيهقي (٢/ ١6٤) وزيد بن واقد وثقه الإمام أحمد وابن معين ودحيم والدارقطني وابن حبان وآخرون.", "وبهذا تبين أن حديث عبادة مروي من طريق الزهري، ومن طريق مكحول، قال الترمذي عن الأول: (وهذا أصح) بينما رجح ابن خزيمة وابن حبان الوجهين جميعا، كما يفهم مما تقدم. حيث أخرجا رواية مكحول في «صحيحيهما»، وقد نقل ابن تيمية تضعيف الإمام أحمد لحديث مكحول والأخذ برواية الزهري.", "أجمع الأئمة الأربعة وأتباعهم على وجوب قراءة الفاتحة على الإمام والمنفرد، وأن الصلاة لا تصح بدونها، إلا عند أبي حنيفة ورواية الإمام أحمد فلا تلزم الفاتحة، فلو قرأ غيرها من القرآن أجزأ، لعموم قوله تعالى؛ {فاقرأوا ما تيسر من القرآن} [المزمل: ٢0] وحديث المسيء (ثم اقرأ ما تيسر معك من القرآن)، لكن أجابهم الجمهور بالأحاديث الدالة على تعيين الفاتحة. ثم حصل الخلاف بينهم في حكم قراءة الفاتحة وراء الإمام أي في حق المأموم على ثلاثة أقوال:", "الأول: وجوب قراءة الفاتحة على المأموم في الصلاة السرية والجهرية، وأنها ركن لا تصح الصلاة إلا بها، وهذا قول عبادة بن الصامت وابن عباس رضي الله عنهم، والأوزاعي والليث، وبه قال الشافعي، وعليه أكثر أصحابه، واختاره الصنعاني، وقال الشيخ عبد العزيز ابن باز: (هذا أرجح الأقوال وأظهر في الدليل).", "واستدلوا بحديث الباب وهو حديث عبادة بن الصامت رضي الله عنه، فإنه نص صريح لا يقبل التأويل، بأن الصلاة لا تقبل ولا تجزئ إذا لم يقرأ المصلي فيها بفاتحة الكتاب، وهذا شامل للفرض والنفل، وللإمام والمأموم والمنفرد.", "كما استدلوا بحديث أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «من صلى صلاة لم يقرأ فيها بأم القرآن فهي خداج، ثلاثاً، غير تمام»، فقيل لأبي هريرة: (إنا نكون وراء الإمام)، فقال: (اقرأ بها في نفسك).", "والخداج: بالكسر النقصان، أي: ذات خداج، يقال: خدجت الناقة: إذا ألقت ولدها قبل أوانه وإن كان تام الخلق، وأخدجته: إذا ولدته ناقصا وإن كان لتمام الولادة.", "فدل الحديث على وجوب قراءة الفاتحة، لأن الرسول صلى الله عليه وسلم وصف الصلاة بدون الفاتحة بالنقصان، والمراد به: النقصان الذي لا تجزئ معه الصلاة، بدليل رواية: (لا تجزئ صلاة لمن لم يقرأ بفاتحة الكتاب)، واسم الصلاة ينطبق على المجزئ منها، وغير المجزئ يقال فيه: صلاة فاسدة.", "ثم صارهؤلَاء فريقين بالنسبة للجهرية:", "1 - فريق قالوا يقرأ المأموم الفاتحة في سكوت إمامه، فإن لم يتيسر قرأها ولو في حال قراءة إمامه، ثم ينصت لأنه مأمور بقراءتها، ولأن الرسول صلى الله عليه وسلم لم ينكر على الصحابة القراءة مطلقاً، وإنما قال: («لا تفعلوا إلا بفاتحة الكتاب» وعليه فتكون هذه الأحاديث مخصصة لقوله تعالى: {وإذا قرئ القرآن فاستمعوا له وأنصتوا} [الأعراف: ٢0٤]، وقوله صلى الله عليه وسلم: «وإذا قرأ الإمام فأنصتوا» وهذا تأويل أصحاب الشافعي كما ذكره اللكنوي، وبه قال الشيخ عبد العزيز بن باز، وقد ذكره ابن المنذر وعزاه لبعض العلماء، منهم ابن عون والأوزاعي وأبو ثور وغيرهم من أصحاب الشافعي.", "2 - وفريق آخر قال: يقرأ في سكتات الإمام، وإذا سمع قراءة الإمام أنصت، وإذا لم يسمعها قرأ لنفسه، لأن قراءته أفضل من سكوته، والاستماع لقراءة الإمام أفضل من القراءة، ومن هؤلاء ابن المنذر، ونسبه لأكثر السلف.", "قال ابن المنذر: (إن معنى حديث عبادة: (لا صلاة لمن لم يقرأ بفاتحة الكتاب) إلا صلاة أمر النبي صلى الله عليه وسلم المأموم إذا جهر الإمام بقراءته أن يستمع لقراءته، فيكون فاعل ذلك مستعملاً للحديثين جميعا).", "ويستثنى من ذلك ما لو دخل والإمام راكع أو عند الركوع فإنه يركع مع إمامه وتسقط الفاتحة عنه، ودليل ذلك حديث أبي بكرة رضي الله عنه أنه انتهى إلى النبي صلى الله عليه وسلم وهو راكع فركع معه قبل أن يصل إلى الصف، فذكر ذلك للنبي صلى الله عليه وسلم فقال: «زادك الله حرصاً ولا تعد»، فلم يأمره النبي صلى الله عليه وسلم بقضاء تلك الركعة التي لم يقرأ فيها الفاتحة، فدل على أنه معذور إذا لم يدرك القيام مع الإمام الذي هو محل قراءة الفاتحة، فسقطت عنه.", "القول الثاني: وجوب القراءة على المأموم في السرية دون الجهرية، وهذا قول مالك وقول قديم للشافعي، وهو قول لأحمد في رواية عنه ورجحه بعض الحنفية، وبه قال سعيد بن المسيب، وسالم بن عبد الله، وابن شهاب، وابن المبارك، وإسحاق، وعلى قول هؤلاء لا يقرأ إذا جهر إمامه، بل يستمع لقراءته.", "واستدلوا بقول تعالى: {وإذا قرئ القرآن فاستمعوا له وأنصتوا} [الأعراف: ٢0٤] قالوا: (فأمر الله تعالى بالاستماع والإنصات عند قراءة القرآن، فدل على أن المأموم لا يقرأ إذا جهر إمامه).", "كما استدلوا بحديث أبي هريرة رضي الله عنه وفيه: (إنما جعل الإمام ليؤتم به فإذا كبر فكبروا، وإذا قرأ فأنصتوا..) الحديث.", "كما استدلوا بحديث أبي هريرة - أيضا - رضي الله عنه أن رسول الله صلى الله عليه وسلم انصرف من صلاة جهر فيها بالقراءة، فقال: «هل قرأ معي أحد منكم آنفا؟»، فقال رجل: (نعم يا رسول الله)، قال: «إني أقول ما لي أنازع القرآن؟»، قال: (فانتهى الناس عن القراءة مع رسول الله صلى الله عليه وسلم فيما جهر فيه النبي صلى الله عليه وسلم بالقراءة من الصلوات حين سمعوا ذلك من رسول الله صلى الله عليه وسلم.", "والقول الثالث: وجوب السكوت على المأموم في الجهرية والسرية، فلا تجب القراءة على المأموم فيهما، وهو قول الحنفية. واستدلوا بحديث جابر رضي الله عنه أن النبي صلى الله عليه وسلم قال: «من كان له إمام فقراءة الإمام له قراءة».", "وأجيب عنه بجو ابين:", "الأول: أنه حديث ضعيف، قال ابن كثير: (في إسناده ضعف، وقد روي من طرق، ولا يصح شيء منها عن النبي صلى الله عليه وسلم والله أعلم)، وقال الحافظ: (مشهور من حديث جابر، وله طرق عن جماعة من الصحابة، وكلها معلولة).", "الثاني: على القول بصحته فهو محمول على غير الفاتحة، جمعاً بين الأدلة، لا سيما وأن الأدلة التي تفيد وجوب قراءة الفاتحة على المأموم أقوى سنداً من هذا الحديث، فمثله لا يقف في مقابل الأحاديث الصحيحة، كحديث عبادة رضي الله عنه.", "وأجابت الحنفية عن حديث عبادة رضي الله عنه: (لا صلاة لمن لم يقرأ بفاتحة الكتاب) بأن النفي فيه للكمال لا للصحة، وهذا مردود؛ لأن حمل الحديث على نفي الكمال بعيد، لأنه إذا أمكن حمل الكلام على المعنى الأقرب امتنع حمله على المعنى الأبعد، وهو هنا محمول على نفي الذات، لأن المراد بالصلاة معناها الشرعي، كما تقدم، ولأن نفي الإجزاء هو السابق إلى الفهم، ثم هو يستلزم نفي الكمال، من غير عكس.", "والقول الأول - وهو وجوب الفاتحة على المأموم في السرية والجهرية - هو أرجح الأقوال، لقوة أدلته وصراحتها في الدلالة على المراد، بل إن هذا القول تجتمع به الأدلة، فلا يترك منها شيء، وتجب الفاتحة في كل ركعة، لأن الرسول صلى الله عليه وسلم أمر المسيء بها ثم قال: «افعل ذلك في صلاتك كلها».", "وهذه المسألة كما قال شيخ الإسلام ابن تيمية: (للعلماء فيها نزاع واضطراب مع عموم الحاجة إليها)، والله تعالى أعلم."]}, "26": {"m": "وَعَنْ أَبِي مُوَسَى رضي الله عنه: «أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم خَطَبَنَا،َ فَبََيّنَ لَنَا سُنّتَنَا، وَعَلّمَنَا صَلاتَنَا؛ فَقَالَ: إَِذَا صَلّيْتُمْ فَأقِيمُوا صُفُوفَكُمْ،َ ثُمَّ لْيَؤُمّكُمَْ أَحَدُكُمْ، فَإِذَا كَبّرَ فَكَبِرُوَا، وَإِذَا قَرَأ فَأنْصِتُوا» رَوَاهُ مُسْلِمٌ. وَصَحّحَهُ الإِمَامُ أحَْمَدُ، وَتَكَلّمَ فِي قَوْلِهِ: «إِذَا قَرَأ فَأنْصِتُوا» أبُو دَاوُدَ، وَالدّارَقُطْنِيُّ، وَ أبُو عَلِيٍ النّيْسَابُورِيُّ، وَغَيْرُهُمْ. وَقَدْ رُوِيَ مِنْ حَدِيثِ أبِي هُرَْيرَةَ رضي الله عنه، وَصَحّحَهُ مُسْلِمٌ، وَتَكَلّمَ فِيهِ غَيْرُوَاحِدٍ.", "s": ["الكلام عليه من وجهين:", "الوجه الأول: في تخريجه: هذا الحديث رواه مسلم في كتاب «الصلاة»، باب (التشهد في الصلاة) (٤0٤) من طريق أبي عوانة، عن قتادة، عن يونس بن جبير، عن حطان بن عبد الله الرفاشي قال: صليت مع أبي موسى الأشعري صلاة... وذكر الحديث، إلى أن قال أبو موسى: أما تعلمون كيف تقولون في صلاتكم، إن رسول الله ﷺ خطبنا فقال: «إذا صليتم فأقيموا صفوفكم، ثم ليؤمكم أحدكم، فإذا كبر فكبروا، وإذا قال: ﴿غَيۡرِ ٱلمَۡغۡضُوبِ عَلَيۡهِمۡ وََلا ٱلضَّآلِّينَ﴾، فقولوا: آمين...» الحديث. ورواه مسلم ـ أيضاً ـ (6٣) من طريق جرير، عن سليمان التيمي، عن قتادة بزيادة: «وإذا قرأ فأنصتوا».", "وقال الدارقطني: (وقد خالف التيمي جماعة، منهم هشام الدَّستُوائي، وشعبة، وسعيد... رووه عن قتادة، ولم يقل أحد منهم: «وإذا قرأ فأنصتوا»... وفي اجتماع أصحاب قتادة على خلاف التيمي دليل على وَهمِهِ، والله أعلم).", "وقال الإمام أبو علي النيسابوري ـ شيخ الحاكم ـ: (خالف جريرًا عن التيمي أصحاب قتادة كلهم في هذا الحديث، وهو عندي وَهم منه، والمحفوظ عن قتادة رواية هشام الدَّستُوائي، وهمام، وسعيد بن أبي عروبة...).", "وقال البيهقي: (وَوَهَّنَ أبو عبد الله محمد بن إسماعيل البخاري، وأبو بكر محمد بن إسحاق بن خزيمة رحمهم الله هذه الزيادة في هذا الحديث).", "وكذا البزار، فإنه حكم بتفرُّد التيمي بهذه الزيادة.", "وممن حكم بِوَهمِ التيمي: يحيى بن معين، وأبو حاتم الرازي، والحاكم، وابن عمار الشهيد، والأثرم وغيرهم.", "وقد نقل الحافظ ابن رجب عن الأثرم أنه قال: (كان التيمي من الثقات، ولكن كان لا يقوم بحديث قتادة)، وقال أيضاً: (لم يكن التيمي من الحفاظ من أصحاب قتادة) وذكر أحاديث وهم فيها عن قتادة، منها حديث الباب.", "وذهب بعض الأئمة كالإمام أحمد، ومسلم إلى تصحيح هذه الزيادة، أما تصحيح أحمد فقد قال ابن التركي: (وفي علل الخلال: قلت ـ يعني لابن حنبل ـ: يقولون أخطأ التيمي، فقال: من قال أخطأ التيمي فقد بَهَتَ التيمي).", "وقال ابن عبد البر بعد أن ذكر حديثي أبي موسى وأبي هريرة: (وقد صحح الحديث أحمد بن حنبل، وحسبك به إماماً وعلماً في هذا الشأن).", "وأما تصحيح مسلم فإنه قد أخرج هذه الزيادة في «صحيحه» إلا أن أبا مسعود الدمشقي ذكر في كتابه «الأجوبة»: أن مسلماً لم يقصد من إخراج هذه الزيادة تصحيحها، وإنما أراد تبيين الخلاف في الحديث عن قتادة، قال أبو إسحاق ـ إبراهيم بن سفيان راوي الصحيح عن مسلم ـ قال أبو بكر ابن أخت أبي النضر في هذا الحديث (أي: طعَنَ فيه وقَدَحَ في صحته) فقال مسلم: تريد أحفظ من سليمان؟ أي: إن سليمان التيمي كامل الحفظ، فلا تضر مخالفة غيره له، كما ذكر النووي.", "فقال أبو بكر: فحديث أبي هريرة؟ ـ يعني ـ «وإذا قرأ فأنصتوا» ـ هو عندي صحيح، فقال: لِمَ لَم تضعه هاهنا؟ قال: ليس كل شيء عندي صحيح وضعته هاهنا، وإنما وضعت ما أجمعوا عليه.", "والذي يظهر ـ والله أعلم ـ من تطبيق قاعدة الترجيح بالكثرة وقوة الحفظ أن هذه الزيادة غير محفوظة، وأن سليمان التيمي ـ وإن كان ثقة ـ لكنه وَهِمَ في ذكرها، وقد مرَّ كلام الأثرم في أن التيمي ليس من الحفاظ من أصحاب قتادة، وقد خالفه جمع من الحفاظ فلم يذكروها، ويبعد أن يرووا هذا الحديث دون هذه الزيادة، مع توفر الدواعي لنقلها؛ لتعلقه بأمر عظيم من عبادة المسلم وهي الصلاة.", "وللحديث شاهد من حديث أبي هريرة، رواه أبو داود (60٤)، والنسائي (١٤١/٢)، وابن ماجه (8٤6)، وأحمد (٤69/١٤) من طريق محمد بن عجلان، عن زيد بن أسلم، عن أبي صالح، عن أبي هريرة، عن النبي ﷺ: «إنما جُعل الإمام ليؤتم به، فإذا كبر فكبروا، وإذا قرأ فأنصتوا»، وهذه الزيادة غير محفوظة، قال أبو حاتم: (ليس هذه الكلمة بالمحفوظ، وهو من تخاليط ابن عجلان). وقال النسائي في «الكبرى» (١/ ٤76): (لا نعلم أن أحداً تابع ابن عجلان على قوله: «وإذا قرأ فأنصتوا»).", "وقال الدارقطني: (هذا الكلام ليس بمحفوظ في هذا الحديث)، وقال البيهقي: (هو وهم من ابن عجلان). وممن ضعفها ابن معين، وأبو داود، وابن خزيمة، وآخرون.", "وقد صحح هذه الزيادة الإمام مسلم في «صحيحه» ـ وإن لم يخرجها فيه ـ بإثر حديث أبي موسى، وتقدم نقل كلامه في تصحيحها، كما صححها الطبري في «تفسيره»، وابن حجر في «الفتح».", "يستدل بهذه الزيادة الحنفية وجماعة من السلف على أن المأموم لا يقرأ خلف إمامه؛ لا في السرية ولا في الجهرية. ووجه الاستدلال: أن المأموم مأمور بالإنصات لقراءة إمامه. وقد تقدم تضعيفها في كلام كبار الأئمة والحفاظ، وقد دافع الحنفية عن هذا الحديث، وحكموا بصحته، مستندين إلى رواية مسلم له في «الصحيح»، وتصحيح الإمام أحمد له؛ لأنه بعض مذهبهم. كما استدلوا بقوله تعالى: ﴿وَِإذَا قُرِئَ ٱلۡقُرءَانُ فَٱسۡتَمِعُوا لَهۥُ وََأنصِتُوا لَعَلَّكُمۡ تُرۡحَمُونَ﴾ [الأعراف: ٢0٤]، وبحديث جابر بن عبد الله؛ أن رسول الله ﷺ قال: «مَن كان له إمام، فقراءة الإمام له قراءة».", "القول الثاني: أن المأموم يقرأ الفاتحة في السرية دون الجهرية، وهذا قول مالك، وأحد قولي الشافعي، وهو قول أحمد، وجماعة من السلف، إلا أن أحمد قال: إن سمع قراءة إمامه لم يقرأ، وإن لم يسمع قرأ، وهذا القول اختاره ابن عبد البر، وشيخ الإسلام ابن تيمية، ودليلهم قوله تعالى: ﴿وَِإذَا قُرِئَ ٱلۡقُرۡءَانُ فَٱسۡتَمِعُوا لَهۥُ وََأنصِتُوا﴾ [الأعراف: ٢0٤]، كما استدلوا بحديث أبي هريرة؛ أن رسول الله ﷺ انصرف ذات يوم من صلاة جهر فيها بالقراءة، فقال: «ما لي أُنَازَعُ القرآن؟» فانتهى الناس عن القراءة فيما يجهر فيه رسول الله ﷺ.", "يقول شيخ الإسلام ابن تيمية: (المقصود بالجهر استماع المأمومين، ولهذا يؤمِّنون على قراءة الإمام في الجهر دون السر، فإذا كانوا مشغولين عنه بالقراءة فقد أمر أن يقرأ على قوم لا يستمعون لقراءته، وهو بمنزلة أن يحدث من لم يستمع لحديثه، ويخطب من لم يستمع لخطبته، وهذا سَفَه تنزه عنه الشريعة؛ ولهذا رُوي في الحديث: «مثل الذي يتكلم والإمام يخطب كمثل الحمار يحمل أسفاراً»، فهكذا إذا كان يقرأ والإمام يقرأ عليه).", "القول الثالث: وجوب قراءة الفاتحة على كل مصلٍّ في السرية والجهرية، إماماً كان أو مأموماً، وهو مروي عن بعض الصحابة، وهو قول الشافعي في الجديد، ورواية عن أحمد، وبه قال جماعة من السلف، واختاره البخاري، وابن حزم، والشوكاني. قال في «الفروع»: (وهو أظهر)، واستدلوا بحديث عبادة بن الصامت أن رسول الله ﷺ قال: «لا صلاة لمن لم يقرأ بأم القرآن»، وفي رواية: «بفاتحة الكتاب». قالوا: فهذا نص صريح في الموضوع، جاء بصيغة العموم وهو الاسم الموصول، فيشمل المنفرد، والإمام، والمأموم. وقوله: (لا صلاة لمن لم يقرأ بفاتحة الكتاب) نفي للصحة لا للكمال، بدليل رواية: «لا تجزئ صلاة لا يقرأ فيها بأم القرآن»، كما استدلوا بحديث أبي هريرة؛ أن النبي ﷺ قال: «من صلى صلاة لم يقرأ فيها بأم القرآن، فهي خداج ـ ثلاثاً ـ غير تمام...» الحديث. والخداج: النقصان، يقال: خدجت الناقة: إذا ألقت ولدها قبل أوانه وإن كان تام الخلق، وأخدجته: إذا ولدته ناقص الخلق وإن كان لتمام الحمل. وأجابوا عن قوله تعالى: ﴿وَِإذَا قُرِئَ القرآن فاستمعوا له وََأنصِتُوا﴾ [الأعراف: ٢0٤]، بأنها عامة للفاتحة وغيرها، وحديث عبادة خاص بقراءة الفاتحة، ولا تعارض بين العام والخاص، فإن الخاص يُخصص به العموم؛ كما في الأصول، ودليل التخصيص حديث عبادة بن الصامت؛ أن النبي ﷺ صلَّى ذات يوم صلاة الفجر، فلما انصرف قال: «لعلكم تقرؤون خلف إمامكم؟» قالوا: نعم، قال: «لا تفعلوا إلا بأم القرآن، فإنه لا صلاة لمن لم يقرأ بها». وأما حديث جابر المتقدم، فقد تكلم العلماء على أسانيده وبيَّنوا أنها معلولة، وعلى فرض صحته، فلعله محمول على ما زاد عن الفاتحة، جمعاً بين الأدلة. وأما حديث أبي هريرة: «فانتهى الناس عن القراءة فيما يجهر فيه رسول الله ﷺ»، ففي سنده كلام ـ أيضاً ـ وعلى القول بصحته فالمراد به: انتهوا عن قراءة ما سوى الفاتحة، فقد كانوا في الأول يقرؤون كما يقرأ الإمام؛ لقوله ﷺ: «ما لي أُنَازَعُ القرآن؟».", "والذي يظهر ـ والله أعلم ـ أن الإمام إذا كان يسكت سكوتاً يتسع لقراءة المأموم الفاتحة، فإن الأفضل له أن يقرأ؛ لقوة الخلاف في وجوب قراءتها حتى في حال جهر الإمام، والخروج من الخلاف مستحب عند أكثر العلماء. وأما إذا كان الإمام لا يسكت بعد الفاتحة، فما قاله شيخ الإسلام ابن تيمية فيه وجاهة، والله تعالى أعلم."], "t": ["وهذا الحديث صحيح، إلا أن كبار الأئمة قد تكلموا في جملة: «وإذا قرأ فأنصتوا»، فالأكثرون على أنها غير محفوظة؛ لأنها زيادة قد تفرد بها سليمان التيمي عن بقية أصحاب قتادة، بل عن كبار أصحابه أمثال سعيد بن أبي عروبة، وأبي عوانة، وهشام الدَّستُوائي، ومعمر وغيرهم، فإنهم قد رووا الحديث عن قتادة، ولم يقل أحد منهم: «وإذا قرأ فأنصتوا»، قال أبو داود: (ليس بمحفوظ، ولم يجئبه إلا سليمان التيمي في هذا الحديث)."]}, "27": {"m": "وَعَنْ عَبْدِ اللَّهِ بْنِ أَبِي أَوْفَى رضي الله عنهما قَالَ: «جَاءَ رجَُلٌ إِلَى النّبِيِ صلى الله عليه وسلم فَقَالَ: إَِنِي لَا أَسْتَطِيعُ أَنْ آخُذَ مِنَ القُرْآنِ شَيْئا؛ فَعَلِمْنِي مَا يُجْزُِئنِي مِنْهُ. قَالَ: قُلْ: سُبْحَانَ اللَّهِ، وَالحَمْدُ للَّهِِ، وََلَا إِلَهَ إِلَاّ اللَّهُ، وَاللَّهُ أكْبَرُ، وََلَا حَوْلَ وََلَا قُوّةَ إِلَاّ بِاللَّهِ. قَالَ: يَا رَسُولَ اللَّهِ! هَذَا للَّهِِ عزوجل؛ فَمَا لِي؟َ قَالَ: قُلِ: اللّهُمَّ ارحَْمْنِي وَارْزُقْنِي وَعَافِنِيَ وَاهْدِنِي. فَلَمّا قَامَ قَالَ هَكَذَا بِيَدِهِ. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: أمّا هَذَا فَقَدْ مَلَا يَدَهُ مِنَ الخَيْرِ» رَوَاهُ أحْمَدُ، وَ أَبُو دَاوُدَ، وَالنّسَائِيُّ، وَ ابْنُ حِبّانَ، وَالدّارَقُطْنِيُّ، وَالحَاكِمُ - وَقَالَ: «عَلَى شَرْطِ البُخَارِي»ِ. وَلَقَدْ قَصّرَ مَنْ عَزَاهُ إِلَى ابْنِ الجَارُودِ فَقَطْ.", "s": ["الحديث دليل على أن من عجز عن قراءة الفاتحة في الصلاة لضيق الوقت عن تعلمها، أو فقد معلم، أو نحو ذلك من الأعذار، فإنه يأتي بدلها بالأذكار الواردة في هذا الحديث، وليس في الحديث ما يقتضي التكرار، فالظاهر أنها تكفي مرة، ثم يركع، والله أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق إبراهيم السكسكي، عن عبد الله بن أبي أوفى قال: فذكر الحديث.. بزيادة: قال: (يا رسول الله! هذا لل عز وجل، فما لي؟) قال: «قل: اللهم ارحمني وارزقني وعافني واهدني»، فلما قام قال هكذا بيده، فقال رسول الله صلى الله عليه وسلم: «أما هذا فقد ملأ يده من الخير»، وهذه الزيادة لغير النسائي، ولابن حبان إلى قوله: (وعافني) لكن وقعت عنده من الطريق الآتي، وقد ذكر الحافظ أن الدارقطني صحح الحديث، ولم أجد ذلك في «سننه». وإبراهيم السكسكي متكلم فيه، فضعفه أحمد، وشعبة على ما نقله عن ابن القطان، وقال النسائي: (ليس بذاك القوي، يكتب حديثه).", "لكن روى له البخاري في «صحيحه»، فقد ذكر الحافظ أن البخاري روى له حديثين أحدهما: في التفسير، والثاني: في الرقاق، وهو ينتقي من حديث الضعيف المعتبر في مثل هذه الأبواب، وقال ابن عدي: (لم أجد له حديثاً منكر المتن، وهو إلى الصدق أقرب منه إلى غيره، ويكتب حديثه، كما قال النسائي).", "وقد صحح الحديث شمس الحق آبادي، وحسنه الألباني، وقد تابع إبراهيم السكسكي طلحة بن مصرف عند ابن حبان (5/ ١١6) وفي إسناده الفضل بن موفق، ضعفه أبو حاتم وقال: (كان شيخا صالحا، وكان يروي أحاديث موضوعة)، وإذا كان في سند هذا الحديث من يروي أحاديث موضوعة لم يصلح للتقوية، لكن يشهد لحديث الباب حديث المسيء كما تقدم أول «صفة الصلاة»، وقد احتج به الإمام أحمد على هذه المسألة، كما في «مسائل ابنه»."]}, "28": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «إِذَا أَمّنَ الإِمَامُ فَأَمِنُوا؛ فَإِنّهُ مَنْ وَ افَقَ تَأْمِينُهُ تَأْمِينَ المَلائِكَةِ غُفِرَلَهُ مَا تَقَدّمَ مِنْ ذَنْبِهِ» مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (إذا أمن الإمام)؛ أي: قال آمين. والمراد بذلك إذا شرع الإمام في التأمين، لا أن المراد إذا انتهى منه، بدليل حديث أبي هريرة أن النبي ﷺ قال: «إذا قال الإمام: ﴿غَيۡرِ ٱلمَۡغۡضُوبِ عَلَيۡهِمۡ وََلا ٱلضَّآلِّينَ﴾، فقولوا: آمين».", "وقوله: (فأمنوا) بتشديد الميم المكسورة؛ أي: قولوا: آمين، وهي بالمد والتخفيف، اسم فعل أمر بمعنى: اللهم استجب، ويجوز فيها القصر (أمين).", "قوله: (فإنه من وافق تأمينه تأمين الملائكة) أي: صادف تأمينه تأمين الملائكة في الزمن بحيث يقع تأمين ابن آدم وتأمين الملائكة معاً، قال ابن المنير: (الحكمة في إيثار الموافقة في القول والزمان أن يكون المأموم على يقظة للإتيان بالوظيفة في محلها؛ لأن الملائكة لا غفلة عندهم، فمن وافقهم كان متيقظاً...). والمراد بالملائكة: من أُذن لهم بالتأمين مع الإمام ممن يشهد تلك الصلاة من الملائكة ممن في الأرض أو في السماء. وفي بعض الروايات في «الصحيحين»: «إذا قال أحدكم: آمين، وقالت الملائكة في السماء: آمين، فوافقت إحداهما الأخرى؛ غفر له ما تقدم من ذنبه». وعلى هذا فـ(أل) في الملائكة للعهد لا للجنس.", "قوله: (غفر له ما تقدم من ذنبه)؛ أي: غفر الله له. وظاهره مغفرة جميع ما تقدم من الذنوب؛ صغائرها وكبائرها، والجمهور على أن المراد الصغائر. أما الكبائر، فلا تكفرها الأعمال الصالحة، بل لا بدَّ لها من توبة."], "s": ["أ- الحديث دليل على مشروعية التأمين عند انتهاء قراءة الفاتحة، وهو أن يقول المصلي: آمين؛ لأن آخر الفاتحة دعاء ﴿ٱهۡدِنَا ٱلصِّرََٰطَ ٱلمُۡسۡتَقِيمَ﴾، فناسب أن يؤمِّن على هذا الدعاء. والجمهور على أن التأمين عند الفراغ من الفاتحة سنة للإمام والمأموم والمنفرد، وهذا مروي عن ابن عمر، وابن الزبير، وهو قول الثوري، وعطاء، والشافعي، وأصحاب الرأي، واستدلوا بهذا الحديث. القول الثاني: أنه لا يسن التأمين للإمام، وهذا قول المالكية، واستدلوا بحديث أبي هريرة المتقدم: «إذا قال الإمام: ﴿غَيۡرِ ٱلمَۡغۡضُوبِ عَلَيۡهِمۡ وََلا ٱلضَّآلِّينَ﴾، فقولوا: آمين»، قالوا: فلم يذكر تأمين الإمام، فدلَّ على أنه لا يقولها. وهذا الاستدلال فيه نظر؛ إذ ليس فيه ما يدل على أن الإمام لا يؤمِّن؛ لأن الحديث سيق لبيان موضع تأمينهم، وهو عقيب قول الإمام: ﴿وََلا ٱلضَّآلِّينَ﴾؛ لأنه موضع تأمين الإمام، ليكون تأمين الإمام والمأموم في وقت واحد موافقاً لتأمين الملائكة، كما تقدم. وحملوا قوله: «إذا أمن الإمام فأمنوا» على أن المراد بتأمين الإمام: دعاؤه بقراءة آخر الفاتحة، بدليل حديث أبي هريرة المذكور. وهذا فيه نظر.", "القول الثالث: أن التأمين فرض على المأموم، وإن قاله الإمام فحسن وسنة. وهذا قول ابن حزم، ولعله يأخذ بصيغة الأمر في قوله: «إذا أمن الإمام فأمنوا»، وأنه للوجوب، وهذا قول قوي في نظري؛ لأن الأصل في صيغة الأمر أنها للوجوب، ما لم يرد دليل يصرفها عن ذلك، والجمهور القائلون بأن التأمين سنّة لم يذكروا دليلاً ـ فيما أعلم ـ نعم هو سنّة في حق الإمام والمنفرد، إذ لا دليل على وجوبه عليهما. وقد روى إسحاق بن إبراهيم بن هانئ في «مسائله» عن أحمد، أنه قال: (آمين أَمر من النبي ﷺ؛ إذ قال ﷺ: «إذا أَمَّنَ القارئ فأمِّنُوا» فهذا أمر، والأمر أوكد من الفعل).", "ب- ظاهر الحديث أن التأمين مشروع للمأموم إذا أمَّن الإمام؛ لأنه رتبه على تأمينه، فإن ترك الإمام التأمين، فمن أهل العلم مَن قال: لا يؤمِّن المأموم، وهذا قول ضعيف، والصواب أن المأموم يؤمِّن ويجهر بالتأمين، سواء أمَّن الإمام أم لا.", "ج- ذهب الجمهور من أهل العلم إلى أنه يستحب الجهر بالتأمين للإمام والمأموم، وذلك في الصلاة الجهرية. أما السرية، فإنه يُسِرُّ فيها بالتأمين، تبعاً للقراءة فيها، وهذا قول الشافعية والحنابلة. أما جهر الإمام، فقد دلَّ عليه قول: «إذا أمن الإمام فأمنوا»، فعلّق تأمين المأمومين بتأمين الإمام، ولولا أنهم يسمعونه لم يكن في تعليق تأمينهم بتأمينه فائدة، فدلَّ على أنه يجهر به، وقد جاء في حديث وائل بن حجر، قال: «كان رسول الله ﷺ إذا قرأ ﴿وََلا ٱلضَّآلِّينَ﴾، قال: «آمين»، ورفع بها صوته». أما جهر المأمومين، فدليله فعل الصحابة، فقد كانوا يجهرون بذلك، وقد روى عبد الرزاق عن ابن جريج، قال: (قلت لعطاء: أكان ابن الزبير يؤمِّن على إثر أم القرآن؟ قال: نعم، ويؤمِّن من وراءه حتى إن للمسجد للجة، ثم قال: إنما آمين دعاء). ومعلوم أن ابن الزبير كان أميرًا، ووراءه خلق من الصحابة والتابعين. وروى عبد الرزاق، عن يحيى بن أبي كثير، عن أبي سلمة بن عبد الرحمن، عن أبي هريرة؛ أنه كان مؤذناً للعلاء بن الحضرمي بالبحرين، فاشترط عليه بألا يسبقه بآمين. ووجه ذلك أن أبا هريرة كان يقيم الصلاة خارج المسجد يُسمع الناس. وروى البخاري في «تاريخه»، والبيهقي في «سننه» عن عطاء بن أبي رباح، قال: أدركت مائتي نفس من أصحاب رسول الله ﷺ في هذا المسجد، إذا قال الإمام: ﴿وََلا ٱلضَّآلِّينَ﴾ سمعت لهم رجَّة بآمين.", "والقول الثاني: أن التأمين يجهر به المأموم دون الإمام، وهذا قول المالكية، وتقدم.", "القول الثالث: أنه لا يجهر به الإمام ولا المأموم، وهذا قول الحنفية، ورواية عن مالك؛ لأنه دعاء، والدعاء يستحب خفض الصوت به كالتشهد. وهذا قول ضعيف؛ لأنه مخالف لنص الحديث الدال على الجهر به، وما ذكروه غير مستقيم، فإن آخر الفاتحة دعاء، ويُجهر به، ودعاء التشهد تابع له، فيتبعه في الإخفاء، وهذا تابع للقراءة فيتبعها في الجهر، والله تعالى أعلم."]}, "29": {"m": "وَعَنْ أَبِي قَتَادَةَ رضي الله عنه قَالَ: «كَانَ رَسُولُ اللَّهَِ صلى الله عليه وسلم يُصَلِي بِنَا؛ فَيَقْرَُأ فِي الظُّهْرِوَالعَصْرِفِي الرّكْعَتَيْنِ الأُولَيَيْنِ بِفَاتِحَةِ الكِتَابِ وَسُورََتيْنِ، وَيُسْمِعُنَا الآيَةَ أحْيَانا. وَكَانَ يُطَوِلُ الرّكْعَةَ الأُولَى مِنَ الظُّهْرِوَيُقَصِرُالثّانِيَةَ، وَيَقْرَُأ فِي الرّكْعَتَيْنِ الأُخْرََييْنِ بِفَاتِحَةِ الكِتَابِ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ. وَفِي رِوَ ايَةِ البُخَارِي:ِ «وَكَانَ يُطَوِلُ الأُولَى مِنْ صَلاةِ الصُّبْحِ، وَيُقَصِرُفِي الثّانِيَةِ».", "w": ["قوله: (في الأوليين..) بيائين تثنية الأولى، والمراد الركعة الأولى والثانية، وكذا الأخريين مثنى الأخرى، والمراد الركعة الثالثة والرابعة من صلاة الظهر والعصر.", "قوله: (بفاتحة الكتاب وسورتين) أي: في الركعتين، في كل ركعة سورة، لما ورد في رواية البخاري: (بفاتحة الكتاب وسورة سورة)، والسورة: طائفة من القرآن الكريم مسماة باسم خاص، ذات أول وآخر.", "قوله: (ويسمعنا الآية أحيانا) أي: يجهر بها حتى يسمعها من خلفه."], "s": ["أ- الحديث دليل على مشروعية قراءة الفاتحة في كل ركعة من الصلاة حتى الصلاة السرية، لأن أبا قتادة رضي الله عنه ذكرها في كل الركعات الأربع، وقد تقدم في أول «صفة الصلاة» أن النبي صلى الله عليه وسلم أمر بها المسيء في صلاته، وقال له: «ثم افعل ذلك في صلاتك كلها».", "ب- الحديث دليل على مشروعية قراءة سورة مع الفاتحة في كل ركعة من الركعتين الأوليين في صلاتي الظهر والعصر، وفي حكمهما المغرب والعشاء، وكذلك الصبح، وقراءة السورة مع الفاتحة سنة على قول جمهور أهل العلم، لأنه لا يجب إلا الفاتحة، قال ابن قدامة: (لا نعلم خلافاً أن قراءة السورة بعد الفاتحة مسنونة)، لكن لا ينبغي الاقتصار عليها.", "قال في «الإقناع وشرحه»: (ويكره الاقتصار في الصلاة على الفاتحة، لأنه خلاف السنة المستفيضة).", "ج- الحديث دليل على مشروعية تطويل الركعة الأولى على الثانية في صلاتي الظهر والعصر، وكذا صلاة الفجر.", "ولعل هذا - والله أعلم - مقصود به أن يدرك الصلاة من لم يأت بعد، ولكون المصلين أقوى نشاطاً، وقد ورد في آخر حديث أبي قتادة بالإسناد المقدم: (فظننا أنه يريد بذلك أن يدرك الناس الركعة الأولى).", "وقد عارض ذلك حديث أبي سعيد الذي يدل على أن الركعتين الأوليين سواء في مقدار القراءة.", "د- الحديث دليل على جواز الجهر ببعض الآيات في الصلاة السرية أحياناً، وذلك لتنبيه الغافل، أو لبيان أن الإمام يقرأ وأنه ليس بساكت، ويحتمل أن إسماعه صلى الله عليه وسلم من خلفه ليس مقصوداً، وإنما كان يحصل بسبق اللسان للاستغراق في التدبر، وقوله: (أحيانا) يدل على تكرر ذلك منه.", "ه-الحديث دليل على مشروعية الاقتصار على الفاتحة في الركعتين الأخريين من صلاة الظهر والعصر وكذا العشاء وثالثة المغرب.", "وقد ورد في حديث أبي سعيد ما يفيد جواز الزيادة على الفاتحة، وسيأتي إن شاء الله الكلام على ذلك.", "و- استدل بالحديث من قال: إن قراءة سورة كاملة أفضل من قراءة بعض سورة طويلة، وذلك لارتباط بعضها ببعض في ابتدائها وانتهائها، بخلاف قدرها من سورة طويلة.", "قال ابن القيم: (وكان من هديه صلى الله عليه وسلم قراءة السورة كاملة، وربما قرأها في الركعتين، وربما قرأ أول السورة، وأما قراءة أواخر السور وأوساطها فلم يحفظ عنه).", "ولعل ابن القيم يقصد أنه لا يقرأ من أثناء السورة في الفريضة، وإلا فقد ثبت عنه أنه قرأ في سنة الفجر آيات من السور، فكان أحيانا يقرأ في الركعة الأولى {قولوا آمنا بالل} التي في سورة البقرة، وفي الثانية: {آمنا بالل واشهد بأنا مسلمون} التي في آل عمران، وقد ورد ذلك في حديث ابن عباس رضي الله عنهما.", "والقاعدة أن ما ثبت في النفل ثبت في الفرض ما لم يرد مخصص، وقد يؤيد ذلك عموم قوله تعالى: {فاقرأوا ما تيسر من القرآن} [المزمل: ٢0].", "لكن السنة والأفضل أن يقرأ سورة كاملة في كل ركعة، ليبقى ارتباط الآيات بعضها ببعض، ولئلا يقف الإمام على ما لا ينبغي الوقوف عليه، فإن شق فلا حرج أن يقسمها بين الركعتين، فقد ورد عن عبد الله بن السائب رضي الله عنه قال: (صلى لنا النبي صلى الله عليه وسلم الصبح بمكة، فاستفتح سورة المؤمنين حتى جاء ذكر موسى وهارون، أو ذكر عيسى - شك أحد الرواة - أخذت النبي صلى الله عليه وسلم سعلة فركع، وعبد الله بن السائب حاضر).", "وثبت أن الرسول صلى الله عليه وسلم قرأ في المغرب بالأعراف في الركعتين، وعلى الإمام أن يختار الموضع المناسب للوقف، والله تعالى أعلم."]}, "30": {"m": "وَعَنْ بُكَيْرِبْنِ عَبْدِ اللَّهِ بْنِ الأَشَجِ، عَنْ سُلَيْمَانَ بْنِ يَسَارٍ، عَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: «مَا صَلّيْتُ وَرَاءَ أَحَدٍ أَشْبَهَ صَلاةا بِرَسُولِ اللَّهِ صلى اللهُ عليه وسلم مِنْ فُلانٍ. قَالَ سُلَيْمَانُ: كَانَ يُطِيلُ الرّكْعَتَيْنِ الأُولَيَيْنِ مِنَُ الظُّهْرِ، وَيُخَفِفُ الأُخْرََييْنِ. وَيُخَفِفُ العَصْرَ، وَيَقْرَأ فِي المَغْرِبِ بِقِصَارِالمُفَصَّلِ. وَيَقْرَأ فِي العِشَاءِ بِوَسَطِ المُفَصّلِ، وَيَقْرَأ فِي الصُّبْحِ بِطِوَالِ المُفَصّلِ» رَوَاهُ ابْنُ مَاجَهْ، وَالنّسَائِيُّ - وَهَذَا لَفْظُهُ، وَهُوَ أتَمُّ -. وَإِسْنَادُهُ صَحِيحٌ.", "w": ["قوله: (من فلان..) يريد به أميرًا كان على المدينة، كما ورد في رواية أحمد.", "قوله: (المفصل) أي: سور المفصل، وهو يبدأ من سورة (ق) إلى نهاية سورة (الناس) على أرجح الأقوال، سمي المفصل لكثرة الفواصل بين سوره بالبسملة على الصحيح، وطوال المفصل من (ق) إلى (عبس)، وأوسطه منها إلى (الضحى) وقصاره منها إلى آخر المصحف، ويقابل المفصل المطول، وهو من أول القرآن إلى الحجرات."], "s": ["أ- الحديث دليل على مشروعية تطويل القراءة في الأوليين من الظهر، وعلى استحباب التخفيف في العصر، وذلك بأن تكون القراءة في الأوليين على النصف من الظهر، وقد ورد حديث أبي سعيد: (كان يقرأ في صلاة الظهر في الركعتين الأوليين في كل ركعة قدر ثلاثين آية، وفي الأخريين قدر خمس عشرة آية، أو قال: نصف ذلك، وفي العصر في الركعتين الأوليين في كل ركعة قدر قراءة خمس عشرة آية، وفي الأخريين قدر نصف ذلك).", "وظاهر حديث أبي سعيد يقتضي أن الركعة الأولى والثانية سواء، وهذا يخالف حديث أبي قتادة رضي الله عنه المتقدم: (ويطول الركعة الأولى)، وفي رواية أن النبي صلى الله عليه وسلم (كان يطول الركعة الأولى من صلاة الظهر، ويقصر في الثانية ..)، وقد اختلف العلماء في الإجابة عن ذلك:", "فمنهم من سلك مسلك الترجيح فرجح حديث أبي قتادة على حديث أبي سعيد لأمرين:", "الأول: أنه متفق عليه، وحديث أبي سعيد في مسلم فقط.", "الثاني: أن حديث أبي قتادة جاء بصيغة الجزم، وحديث أبي سعيد قال: (حزرنا قيامه)، وفرق بين الجزم بالشيء وبين حزره وتقديره، على أنه قد يقال: إن التقدير بقراءة الآيات تقدير زمني، لا يلزم منه الفعل.", "وسلك آخرون مسلك الجمع وهو أن الرسول صلى الله عليه وسلم يفعل هذا أحياناً، ويفعل هذا أحياناً، وهذا وجيه جداً لأمرين:", "الأول: أن القاعدة في الأصول أنه متى أمكن الجمع بين الدليلين فهو أولى من الترجيح، لأن الجمع عمل بكلا الدليلين، أما الترجيح ففيه ترك لأحدهما.", "الثاني: أن الصلاة تتكرر في اليوم والليلة خمس مرات، وقد تنوعت كثير من أقوالها وأفعالها، كما تقدم، وكما سيأتي، فيكون تنوع مقدار القراءة من هذا الباب، والله أعلم.", "ب- في الحديث إيضاح وتفصيل لهدي النبي صلى الله عليه وسلم في القراءة في الصلوات الخمس، وأنه في الظهر يطيل، كما تقدم في حديث أبي قتادة، وفي العصر يخفف، كما في حديث أبي سعيد، وكان في العشاء يقرأ في الأوليين من أوساط المفصل، أما المغرب فكان يقصر فيها، فيقرأ مع الفاتحة بقصار المفصل، وهذا في بعض الأحيان، وليس يديم ذلك كما يوهمه ظاهر هذا الحديث، فإنه لم تكن سنته المداومة على القصار، بل كان يقرأ تارة بقصاره، وتارة بأوساطه، وقرأ بطواله، فقرأ بالطور، والمرسلات، وقرأ بـ {الذين كفروا وصدوا عن سبيل الله} [محمد: ١]، وقرأ بالأعراف في الركعتين، كما تقدم.", "وفي الفجر كان يقرأ من طوال المفصل، والإطالة فيها - والله أعلم - ليدركها المتأخر بنوم أو غفلة، ولأنها ركعتان، ولأن الناس بعد نوم وراحة فعندهم نشاط لسماع كلام الله تعالى والاستفادة منه - والله المستعان ـ، ولأن الملائكة تشهدها؛ ولهذا عبر الله تعالى عن صلاة الفجر بالقرآن في قوله: {أقم الصلاة لدلوك الشمس إلى غسق الليل وقرآن الفجر إن قرآن الفجر كان مشهودا} [الإسراء: 78]، وذلك - والله أعلم - لمزيد العناية به فيها وإطالته.", "فينبغي للإمام أن يتحرى الاقتداء بالنبي صلى الله عليه وسلم ويصلي مثل صلاته التي كان يصليها بأصحابه، وقد قال صلى الله عليه وسلم: «صلوا كما رأيتموني أصلي»، وعلى الإمام أن يراعي حال من خلفه ممن يحتاج إلى التخفيف من كبير السن أو ضعيف القوة أو صاحب الحاجة، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق الضحاك بن عثمان، عن بكير بن عبد الله بن الأشج، به، والحديث إسناده قوي، رجاله ثقات رجال الشيخين، غير الضحاك بن عثمان، فقد روى له مسلم، وقد تكلم فيه بعض الأئمة من قبل حفظه، ولخص الحافظ ابن حجر حاله في التقريب فقال: (صدوق يهم)، فيكون حديثه من قبيل الحسن إن شاء الله تعالى."]}, "31": {"m": "وَعَنْ فُلَيْحٍ قَالَ: حَدّثَنِي عَبّاسُ بْنُ سَهْلٍ قَالَ: «اجْتَمَعَ أَبُو حُمَيْدٍَ وَ أَبُو أُسَيَْدٍ وََسَهْلُ بْنُ سَعْدٍ وَمُحَمّدُ بْنُ مَسْلَمَةَ رضي الله عنهم، فَذَكَرُوا صَلاةَ رَسُولِ اللَّهِ صلى الله عليه وسلَم. فَقَالَ أبُو حُمَيْدٍ: أنَا أعْلَمُكُمْ بِصَلاةِ رَسُولِ اللَّهِ صلى الله عَليه وسَلم، وَفِيهِ: قَالَ: ثُمّ رَكَعَ، فَوَضَعَ يَدَيْهِ عَلَى رُكْبَتَيْهِ كَأنّهُ قَابِضٌ عَلَيْهِمَا، وَوَتّرَ يَدَيْهِ فَتَجَافَى عَنْ جَنْبَيْهِ. ثُمّ سَجَدَ فَأمْكَنَ أنْفَهُ وَجَبْهَتَهُ، وَنَحّى يَدَيْهِ عَنْ جَنْبَيْهَِ، وَوَضَعَ كَفّيْهِ حَذْوَمَنْكِبَيْهِ. ثُمّ رَفَعَ رأَْسَهُ حَتّى رجََعَ كُلُّ عَظْمٍ فِي مَوْضِعِهِ، حَتّى فَرَغَ. ثُمّ جَلَسَ فَافْتَرَشَ رِجْلَهُ اليُسْرى، وَ أقْبَلَ بِصََدْرِ اليُمْنَى عَلَى قِبْلَتِهِ. وَوَضَعَ كَفّهُ اليُمْنَى عَلَى رُكْبَتِهِ اليُمْنَى، وَكَفّهُ اليُسْرى عَلَى رُكْبَتِهِ اليُسْرَى، وَأشَارَبِإِصْبَعِهِ» رَوَاهُ أبُو دَاوُدَ، وَرَوَى التِرْمِذِيُّ بَعْضَهُ - وَصَحّحَهُ.", "w": ["قوله: (ووتر يديه فتجافى) بتشديد التاء؛ أي: جعلهما منصوبتين كالوتر، وجعل جنبيه كالقوس، فشبه يد الراكع إذا مدَّها قابضاً على ركبتيه بالقوس إذا أوترت.", "قوله: (فتجافى عن جنبيه)؛ أي: نحَّى مرفقيه عن جنبيه، أي: تباعدت كل واحدة من يديه عن جنبيه.", "قوله: (فافترش رجله اليسرى)؛ أي: جلس على بطنها.", "قوله: (وأقبل بصدر اليمنى على قبلته) المراد بصدرها: أطراف أصابعها؛ أي: وَجَّهَ أصابع رجله اليمنى إلى القبلة، وذلك بوضع باطن الأصابع على الأرض مقابل القبلة.", "قوله: (ووضع كفه اليمنى على ركبته اليمنى) ظاهره أنه وضع الكف على الركبة مبسوطة؛ لأنه لم يذكر القبض، وقد ورد القبض في أحاديث أخرى، وهذه الرواية فيها اختصار، فيحمل المطلق على المقيد، وهذا هو الأقرب، وقد يكون فعل هذا لبيان الجواز، فتكون صفة مستقلة.", "قوله: (وكفه اليسرى على ركبته اليسرى)؛ أي: بسطها عليها، كما سيأتي في حديث ابن عمر.", "قوله: (وأشار بإصبعه)؛ أي: السبابة، كما في أحاديث أخرى، ومنها حديث ابن الزبير، والظاهر أن المراد الإشارة من ابتداء القعود للتشهد إلى انتهائه. والإصبع: بكسر الهمزة وفتح الباء، هذا هو الأفصح، وفيه لغات أخرى."], "s": ["أ- في الحديث دليل على أنه لا يكره وصف الإنسان نفسه بأنه أعلم القوم أو أحفظ الطلاب، ونحو ذلك، إذا أُمِنَ الإعجاب، وكان القصد المصلحة، ثم هو في الواقع كذلك. قال ابن عبد البر: (من آداب العالم ترك الدعوى لما لا يُحسنه، وترك الفخر بما يُحسنه، إلا أن يضطر إلى ذلك، كما اضطر يوسف حين قال: ﴿ٱجۡعَلۡنِي عَلَىٰ خَزَٓائِنِ ٱلأَۡرۡضِ إِنِّي حَفِيظ عَلِيم﴾ [يوسف: 55]، وذلك أنه لم يكن بحضرته من يعرف حقه فيُثني عليه بما هو فيه، ويعطيه بقسطه، ورأى أن ذلك المقعد لا يقعده غيره من أهل وقته إلا قصر عما يجب الله من القيام به من حقوقه، فلم يسعه إلا السعي في ظهور الحق بما أمكنه، فإذا كان ذلك؛ فجائز للعالم حينئذ الثناء على نفسه، والتنبيه على موضعه، فيكون حينئذ يحدث بنعمة ربه عنده على وجه الشكر لها).", "ب- الحديث دليل على أن الركوع الموافق للسُّنَّة هو ما اجتمعت فيه الصفات التي تقدم ذكرها، في أول باب صفة الصلاة وكذلك السجود.", "ج- مشروعية السجود على الجبهة والأنف، وتمكين الأنف والجبهة من الأرض، قال الترمذي: (العمل على هذا الحديث عند أهل العلم: أن يسجد الرجل على جبهته وأنفه، فإن سجد على جبهته دون أنفه، فقال قوم من أهل العلم: يجزئه، وقال غيرهم: لا يجزئه حتى يسجد على الجبهة والأنف). والجمهور من أهل العلم على وجوب السجود على الجبهة دون الأنف، وهو رواية عن الإمام أحمد؛ لحديث ابن عباس: أن النبي ﷺ أُمر أن يسجد على سبعة أعضاء، ولا يكفت شعرًا ولا ثوباً: الجبهة، واليدين، والركبتين، والرجلين. فعَدَّ الأعضاء المأمور بالسجود عليها سبعاً، ولو كان الأنف منها لكانت ثمانياً. وهذا فيه نظر، فإن الأنف من الجبهة. قال ابن عمر: (السجود على الأنف تحقيق السجود)، وسئل طاوس: الأنف من الجبهة؟ قال: هو خيره.", "وأما السجود على الأنف دون الجبهة، فقد نقل ابن المنذر إجماع الصحابة على أنه لا يجزئ السجود على الأنف وحده، وذهب الإمام أحمد، ومالك في رواية، والشافعي في قول، والأوزاعي، وإسحاق، وابن حبيب من المالكية وغيرهم إلى أنه يجب السجود على الجبهة والأنف جميعاً؛ لظاهر الحديث.", "د- الحديث دليل على استحباب الإشارة بالإصبع السبابة أثناء التشهد؛ لقوله: «وأشار بإصبعه»، وفي حديث ابن الزبير: «وأشار بإصبعه السبابة»، وقد ذكر ابن عبد البر أن الإشارة بالإصبع أثناء التشهد سُنَّة مجمع عليها. والله تعالى أعلم."], "t": ["الحديث رجاله ثقات إلا فليحاً، وهو ابن سليمان المدني، فهو متكلَّم فيه، وقد لخص الحافظ ابن حجر حاله بقوله: (صدوق كثير الخطأ)، وقد روى له الجماعة، منهم البخاري، والبخاري لا يخرج لمن تكلم العلماء فيهم، أمثال فليح، وإسماعيل بن أبي أويس إلا بعد تتبع مروياتهم، وانتقاء ما تبين أنه ضبطه وشارك فيه الثقات. ثم هو في هذا الإسناد قد روى عن مدني مثله، وهو عباس بن سهل، كما تقدم في رجال الإسناد. وقد صحَّح الحديث البخاري في «جزء رفع اليدين»، وصححه الترمذي ـ كما ذكر المصنف ـ"]}, "32": {"m": "وَعَنِ ابْنَِ عَبّاسٍ رضي الله عنهما قَالَ: «كَشَفَ رَسُولُ اللَّهِ صلى الله عليه وسلم السِتَارََةَ وَالنّاسُ صَُفُوفٌ خَلْفَ أََبِي بََكْرٍَ، فَقَالَ: أيُّهَا الَنّاسُ! إِنّهُ لَمْ يََبْقَ مِنْ مُبَشِرَاتِ النُّبُوّةِ؛ إِلَاّ الرُّؤْيَا الصّالَِحَةُ يَرَاهَا المُسْلِمُ، أوْ تُرى لَهُ. ألَا وَ إِنِي نُهِيتَُ أنْ أقْرَأ القُرْآنَ رَاكِعا أوْ سَاجِدا، فَأمّا الرُّكُوعُ فَعَظِمُوا فِيهِ الرّبّ عزوجل، وَأمّا السُّجُودُ فَاجْتَهِدُوا فِي الدُّعَاءِ؛ فَقَمِنٌ أنْ يُسْتَجَابَ لَكُمْ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (فعظموا فيه الرب) التعظيم: وصف الرب بصفات العظمة والإجلال والكبرياء، والمراد هنا: سبحان ربي العظيم.", "قوله: (فقمن أن يستجاب لكم) بفتح القاف وكسر الميم بعدها نون صفة مشبهة أي: حقيق وجدير أن يستجاب دعاؤكم، ويجوز فتح الميم (قمن) ويكون مصدرا فلا يثنى ولا يجمع ولا يؤنث، ومن كسر الميم ثنى وجمع وأنث، لأنه صفة مشبهة، كما تقدم، ومثله: قمين، فإنه وصف."], "s": ["أ- الحديث دليل على النهي عن قراءة القرآن في حال الركوع والسجود، وفي معنى ذلك - أيضاً - حديث علي رضي الله عنه قال: (نهاني رسول الله صلى الله عليه وسلم أن أقرأ راكعاً أو ساجداً).", "وذلك لأن القراءة محلها القيام أو القعود في حق من يعجز عن القيام، والقرآن أشرف الكلام، فناسب أن يكون في حال القيام، وهي حال الرفعة تعظيماً لكلام الله تعالى، أما الركوع والسجود فحالتا ذل وانكسار وانخفاض، فيناسب فيه تعظيم الرب ودعاؤه والتضرع بين يديه.", "ب- الحديث دليل على وجوب تعظيم الرب في حال الركوع ويكون ذلك بالصيغة الواردة في حديث حذيفة رضي الله عنه: ( .. ثم ركع فجعل يقول: سبحان ربي العظيم …، ثم سجد فقال: سبحان ربي الأعلى …). وقد ورد عن عقبة بن عامر رضي الله عنه قال: (لما نزلت: {فسبح باسم ربك العظيم} [الواقعة: 7٤]، قال رسول الله صلى الله عليه وسلم: «اجعلوها في ركوعكم»، فلما نزلت: {سبح اسم ربك الأعلى} [الأعلى: ١] قال: «اجعلوها في سجودكم»). وظاهر الحديث أن ذلك واجب، وهو قول الإمام أحمد، وذهب الجمهور إلى أن ذلك سنة، وليس بواجب، بدليل حديث المسيء صلاته، لأن الرسول صلى الله عليه وسلم لم يعلمه التسبيح، ولو كان واجباً لأمره به، والقول بالوجوب هو الأقرب.", "ج- مشروعية الدعاء في السجود والإكثار منه لأنه محل إجابة، وظاهر إطلاق لفظ: (الدعاء) أنه لا يختص بالمأثور، بل يدعو في صلاته في حال سجوده بأي دعاء كان من طلب خيري الدنيا والآخرة والاستعاذة من شرهما.", "وقد ورد في حديث أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «أقرب ما يكون العبد من ربه وهو ساجد، فأكثروا الدعاء»، والله تعالى أعلم."]}, "33": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يَقُولُ فِي رُكُوعِهِ وَسُجُودِهِ: سُبْحَانَكَ اللّهُمّ رَبّنَا وَبِحَمْدِكَ، اللّهُمّ اغْفِرْلِي» مُتّفَقٌ عَلَيْهِ.", "s": ["الحديث دليل على مشروعية قول المصلي في ركوعه وسجوده: (سبحانك اللهم ربنا وبحمدك اللهم اغفر لي) وأنه ينبغي الإكثار منه، وهو يدل على جواز الدعاء في الركوع من المأثور، وإن كان الدعاء في السجود أكثر، لأنه أمر فيه بالاجتهاد في الدعاء، وهذا يشعر بتكثير الدعاء، بخلاف الركوع فالكثير فيه تعظيم الرب سبحانه وتعالى، كما تقدم، والله تعالى أعلم."]}, "34": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: «كَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم إِذَا قَامَ إِلَى الصّلاةِ يُكَبِرُ حِينَ يَقُومُ، ثُمّ يُكَبِرُحِينَ يَرْكَعُ. ثُمّ يَقُولُ: سَمِعَ اللَّهُ لمَِنْ حَمِْدَهُ حِينَ يَرْفَعُ صُلْبَهُ مِنَ الرُّكُوعِ، ثُمّ يَقُولُ - وَهُْوَقَائِمٌ -: رَبّنَا وَلَكَ الحَمْدُ. ثُمّ يُكَبِرُحِينَ يَهْوِي سَاجِدا، ثُمّ يُكَبِرُحِينَ يَرْفَعُ رأَسَهُ. ثُمّ يُكَبِرُحِينَ يَسْجُدُ، ثُمّ يُكَبِرُحِينَ يَرْفَعُ رأَسَهُ. ثُمّ يَفَْعَلُ ذَلِكَ فِي الصّلاةِ كُلِهَا حَتّى يَقْضِيَهَا. وَيُكَبِرُ حِينَ يَقُومُ مِنَ الثِنْتَيْنِ بَعْدَ الجُلُوسِ» مُتّفَقٌ عَلَيْهِ، وَهَذَا لَفْظُ مُسْلِمٍ، غَيْرَ أنّهُ قَالَ: «مِنَ المَثْنَى بَعْدَ الجُلُوسِ».", "w": ["قوله: (يكبر حين يقوم) أي يقول: الله أكبر، وقت قيامه للصلاة، وهي تكبيرة الإحرام.", "قوله: (سمع الله) أي: استجاب.", "قوله: (لمن حمده) أي: لمن وصفه بصفات الكمال حبا وتعظيما.", "قوله: (ربنا ولك الحمد) أي: يا ربنا، فهو منادى بحرف نداء مقدر، والواو عاطفة على مقدر، أي: يا ربنا أطعنا، ولك الحمد، فيكون في تقدير جملتين.", "وهذا لفظ الصحيحين - كما تقدم - والصيغة الثانية: ربنا لك الحمد، وقد أخرجها البخاري وهي في حديث أبي هريرة، كما تقدم، وأخرجها مسلم في حديث أبي سعيد الخدري رضي الله عنه، وسيأتي بعد حديث أبي هريرة هذا.", "والصيغة الثالثة: اللهم ربنا لك الحمد، بزيادة (اللهم) وهي في حديث أبي هريرة رضي الله عنه وسيأتي، وفي حديث ابن عباس رضي الله عنهما.", "والصيغة الرابعة: اللهم ربنا ولك الحمد، وهي في حديث أبي هريرة رضي الله عنه وفيها من البلاغة تكرار النداء، فكأنه قال: يا الله يا ربنا."], "s": ["أ- الحديث دليل على مشروعية التكبير عند الدخول في الصلاة، وهو ركن لا تنعقد الصلاة إلا به، وعلى مشروعية التكبير حين الركوع، والسجود، والرفع منه، والقيام من التشهد الأول.", "وبهذا يتبين أن النبي صلى الله عليه وسلم كان يكبر الله تعالى عند الافتتاح، وفي كل خفض ورفع، ما عدا الرفع من الركوع، وهذه التكبيرات واجبة على قول أحمد وجماعة من السلف والخلف، وهو الراجح لما يلي:", "١ - قوله صلى الله عليه وسلم: «إذا كبر الإمام فكبروا»، فتدخل تكبيرات الانتقال في عمومه.", "٢ - مواظبة النبي صلى الله عليه وسلم عليه في كل صلاته فرضاً ونفلاً، وقد قال: «صلوا كما رأيتموني أصلي»، فتكون هذه التكبيرات من تفسير الصلاة التي أمرنا بها.", "٣ - أن التكبير شعار الانتقال من ركن إلى آخر، لأن أفعال الصلاة هيئات، فلا بد من شعار يدل على الانتقال من هيئة إلى هيئة.", "القول الثاني: أن التكبيرات ليست بواجبة بل هي مستحبة، وهذا قول أبي حنيفة، ومالك والشافعي ورواية عن أحمد، لحديث المسيء، والراجح ما تقدم، وحديث المسيء تقدم الجواب عنه.", "ب- الحديث دليل على مشروعية قول: سمع الله لمن حمده حين الرفع من الركوع، وهذا في حق الإمام والم
