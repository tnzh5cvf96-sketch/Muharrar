<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мухаррар</title>
<meta name="theme-color" content="#01669d">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<!-- этот сброс платформа Artifact добавляет сама; для отдельного файла он нужен явно -->
<style>[hidden]{display:none!important}</style>

<style>
/* ==========================================================
   Мухаррар — дизайн-система
   Синий Исламского университета + золото, переработанные
   иерархия, типографика и графики. Светлая и тёмная темы.
   ========================================================== */
:root{
  color-scheme: light;
  /* поверхности */
  --bg:#eaf0f5; --card:#ffffff; --inset:#f4f8fb; --sunk:#e7eef4;
  /* чернила */
  --ink:#0d2033; --ink-2:#405972; --muted:#69819a; --line:#d9e3ec; --line-2:#c3d3e0;
  /* бренд */
  --accent:#01669d; --accent-2:#03527e; --accent-ink:#ffffff; --tint:#e7f1f9;
  --gold:#7d6220; --goldline:#c3a05a;
  /* последовательная рампа (проверена валидатором, светлая) */
  --lv0:#6cbdf9; --lv1:#56a6e1; --lv2:#3f90ca; --lv3:#267bb3;
  --lv4:#01669d; --lv5:#03527e; --lv6:#013e62;
  --track:#dfe9f1;
  /* статусы (фиксированные, всегда с подписью) */
  --ok:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --okbg:#e4f6e4; --okink:#046104; --badbg:#fae7e7; --bad:#b52f2f;
  --goldbg:#f8f1df; --chip:#e8eff5;
  /* тени */
  --sh-1:0 1px 2px rgba(10,40,70,.06), 0 1px 3px rgba(10,40,70,.04);
  --sh-2:0 2px 8px rgba(10,40,70,.08), 0 8px 24px rgba(10,40,70,.06);
  --r:14px; --r-s:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#081119; --card:#0f1d29; --inset:#132636; --sunk:#0b1824;
    --ink:#e8f0f7; --ink-2:#b2c6d7; --muted:#8aa1b6; --line:#1e3244; --line-2:#2a4459;
    --accent:#5aaee3; --accent-2:#8ac8f0; --accent-ink:#04121d; --tint:#132d44;
    --gold:#e0be79; --goldline:#9b7f3f;
    --lv0:#015a8b; --lv1:#136fa6; --lv2:#3083bc; --lv3:#4798d2;
    --lv4:#5daee9; --lv5:#75c4ff; --lv6:#a6d8ff;
    --track:#1b2f40;
    --okbg:#10301a; --okink:#6ede6e; --badbg:#3a1a1a; --bad:#f08a8a;
    --goldbg:#2a2312; --chip:#16293a;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#081119; --card:#0f1d29; --inset:#132636; --sunk:#0b1824;
  --ink:#e8f0f7; --ink-2:#b2c6d7; --muted:#8aa1b6; --line:#1e3244; --line-2:#2a4459;
  --accent:#5aaee3; --accent-2:#8ac8f0; --accent-ink:#04121d; --tint:#132d44;
  --gold:#e0be79; --goldline:#9b7f3f;
  --lv0:#015a8b; --lv1:#136fa6; --lv2:#3083bc; --lv3:#4798d2;
  --lv4:#5daee9; --lv5:#75c4ff; --lv6:#a6d8ff;
  --track:#1b2f40;
  --okbg:#10301a; --okink:#6ede6e; --badbg:#3a1a1a; --bad:#f08a8a;
  --goldbg:#2a2312; --chip:#16293a;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 2px 10px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
  font-feature-settings:"kern" 1;
}

/* ---------- каркас ---------- */
.topbar{
  background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:env(safe-area-inset-top,0px); z-index:6;
}
.tb-in{max-width:760px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:block;line-height:0}
.brand img{height:48px;width:auto;max-width:60vw;display:block}
.hero{
  background:linear-gradient(140deg,#03426a 0%,#01669d 55%,#0b7bb8 100%);
  color:#fff; border-bottom:2px solid var(--goldline); position:relative;
}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;
  background:linear-gradient(90deg,transparent,var(--goldline) 18%,var(--goldline) 82%,transparent)}
.hero-in{max-width:760px;margin:0 auto;padding:20px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px}
h1{font-size:1.3rem;margin:0;font-weight:700;color:#fff;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-weight:400;color:rgba(255,255,255,.82);font-size:.8rem;margin-top:3px;letter-spacing:0}
.streak{
  background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:6px 13px;font-weight:600;font-size:.85rem;white-space:nowrap;
  backdrop-filter:blur(4px)
}
.streak:empty{display:none}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}

nav{
  position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);
  border-top:1px solid var(--line);display:flex;justify-content:center;z-index:7;
  padding-bottom:env(safe-area-inset-bottom,0px); backdrop-filter:blur(12px) saturate(1.2);
}
nav .in{display:flex;width:100%;max-width:760px}
nav button{
  flex:1;padding:12px 2px 11px;border:0;background:none;color:var(--muted);font:inherit;
  font-size:.8rem;font-weight:500;cursor:pointer;position:relative;letter-spacing:.005em;
}
nav button::before{content:"";position:absolute;top:0;left:50%;translate:-50% 0;width:0;height:2.5px;
  border-radius:0 0 3px 3px;background:var(--accent);transition:width .18s ease}
nav button[aria-current="true"]{color:var(--accent);font-weight:700}
nav button[aria-current="true"]::before{width:34px}

/* ---------- карточки и заголовки ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:17px;margin-bottom:13px;box-shadow:var(--sh-1);
}
.card h2{margin:0 0 10px;font-size:1rem;font-weight:650;letter-spacing:-.005em}
/* «надзаголовок» — структурный, не декоративный */
.eyebrow{
  font-size:.7rem;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 7px;display:flex;align-items:center;gap:8px
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
/* выделенная панель: то, что требует действия сегодня */
.card.feat{border-color:var(--line-2);box-shadow:var(--sh-2);position:relative;overflow:hidden}
.card.feat::before{content:"";position:absolute;inset:0 0 auto;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--goldline))}
.card.quiet{background:transparent;border:0;box-shadow:none;padding:0;margin-bottom:13px}
.card.quiet > h2{padding:0 2px}

.muted{color:var(--muted);font-size:.88rem}
.big{font-size:2.6rem;font-weight:700;line-height:1;color:var(--accent);letter-spacing:-.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sep{height:1px;background:var(--line);margin:14px 0;border:0}

/* ---------- формы ---------- */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted);flex:1;min-width:140px;font-weight:500}
select,input[type=text],input[type=number],input[type=search],textarea{
  font:inherit;padding:10px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);
  background:var(--inset);color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s
}
select:hover,input:hover:not(:disabled){border-color:var(--muted)}
select:focus,input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);outline:none}
button.btn{
  font:inherit;font-weight:600;padding:11px 17px;border-radius:var(--r-s);
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;
  transition:background .15s,border-color .15s,transform .06s
}
button.btn:hover:not(:disabled){background:var(--accent-2);border-color:var(--accent-2)}
button.btn:active:not(:disabled){transform:translateY(1px)}
button.btn.sec{background:transparent;color:var(--accent)}
button.btn.sec:hover:not(:disabled){background:var(--tint)}
button.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button.btn.danger:hover:not(:disabled){background:var(--badbg)}
button.btn:disabled{opacity:.42;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.pick:focus-within,a:focus-visible,[tabindex]:focus-visible{
  outline:2.5px solid var(--goldline);outline-offset:2px
}

/* ---------- арабский текст ---------- */
.ar{font-family:"Amiri","Scheherazade New","KFGQPC Uthman Taha Naskh","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;text-align:right;font-size:1.42rem;line-height:2.05}
.ar.sm{font-size:1.12rem;line-height:1.85}

/* ---------- викторина ---------- */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:10px}
.bar{height:5px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:15px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtype{font-size:.82rem;color:var(--muted);margin:0 0 7px;font-weight:500}
.opts{display:grid;gap:8px;margin-top:13px}
.opt{
  font:inherit;text-align:right;direction:rtl;padding:12px 14px;border:1px solid var(--line-2);
  border-radius:var(--r-s);background:var(--inset);color:var(--ink);cursor:pointer;
  font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;font-size:1.25rem;line-height:1.85;transition:border-color .15s,background .15s
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--tint)}
.opt.num{text-align:center;font-family:"IBM Plex Sans",sans-serif;font-size:1.15rem;font-variant-numeric:tabular-nums}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--okink);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.reveal{border-top:1px solid var(--line);margin-top:15px;padding-top:13px}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--ink-2);font-weight:500}
.chip.wk{background:var(--goldbg);color:var(--gold);font-weight:650}
.chip.ok{background:var(--okbg);color:var(--okink);font-weight:650}
.actions{display:flex;gap:10px;margin-top:14px}
.actions .btn{flex:1}
.list{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 13px;cursor:pointer;transition:border-color .15s,background .15s}
.pick:hover{border-color:var(--line-2)}
.pick.on{border-color:var(--accent);background:var(--tint)}
.pick input{width:21px;height:21px;margin-top:6px;accent-color:var(--accent)}
.pick .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.pick .ar{font-size:1.18rem;line-height:1.8}
.sticky{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));background:var(--bg);padding:9px 0;z-index:3}
.dist{display:grid;gap:7px}
.dist div{display:grid;grid-template-columns:104px 1fr 30px;gap:9px;align-items:center;font-size:.85rem}
.dist .b{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.dist .b i{display:block;height:100%;border-radius:99px;background:var(--lv4)}
.mist{display:grid;gap:8px;margin-top:10px}
.mist div{border-inline-start:3px solid var(--bad);padding-inline-start:11px}
textarea{min-height:88px;font-size:.78rem;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;direction:ltr}
.empty{text-align:center;padding:26px 8px;color:var(--muted)}
.hr{display:flex;gap:8px;align-items:center}
.today{background:var(--tint);color:var(--ink);border-inline-start:3px solid var(--goldline);border-radius:var(--r-s);padding:11px 13px;margin:13px 0 9px;font-weight:600}
.lg{display:flex;align-items:center;gap:4px;color:var(--accent);border:1px solid var(--line-2);border-radius:var(--r-s);padding:0 4px 0 9px;background:var(--card)}
.lg select{border:0;background:transparent;padding:7px 4px;width:auto;font-size:.85rem;color:var(--ink);box-shadow:none}
.lg select:focus{box-shadow:none}
.src{font-size:.76rem;color:var(--muted);margin-top:11px;text-align:center}
.nvb{display:flex;gap:6px}
.nvb button{font:inherit;font-size:1.2rem;line-height:1;padding:7px 14px;border:1px solid var(--line-2);background:var(--card);color:var(--accent);border-radius:var(--r-s);cursor:pointer}
.nvb button:hover:not(:disabled){background:var(--tint)}
.nvb button:disabled{opacity:.3;cursor:default}
.lrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
.lrow .btn{padding:9px 13px;font-size:.85rem}
.jump{display:flex;gap:8px;align-items:flex-end}
.jump input{max-width:110px}
#who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}
#who:empty{display:none}
.who-n{display:flex;align-items:center;gap:9px;font-weight:650;color:var(--ink)}
.who-n svg{color:var(--accent)}
.pbtn{width:100%;text-align:start}

/* разделы поэмы / толкование */
.secbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.secbtns .sb{padding:11px 6px;font-size:.87rem;line-height:1.25}
.secbtns .sb.on{background:var(--accent);color:var(--accent-ink)}
.secbtns .sb:disabled{opacity:.35}
.secbody{margin-top:13px}
.secbody:empty{display:none}
.secbody .p{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:1.16rem;line-height:1.95;margin:0 0 12px;border-inline-end:2px solid var(--goldline);padding-inline-end:13px}
.secbody .p:last-child{margin-bottom:0}
.matn{background:var(--tint);border-radius:var(--r-s);padding:13px 15px;font-size:1.5rem}
.matn.hid{color:var(--muted)}

/* оценка хадиса */
.grade{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-s);padding:10px 13px;margin-top:13px;border:1px solid var(--line);background:var(--inset)}
.grade .gv{font-weight:700;white-space:nowrap;font-size:1.05rem;font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif}
.grade .gb{font-size:.86rem;color:var(--muted);line-height:1.6;font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;direction:rtl;text-align:right}
.grade.g-s{background:var(--okbg);border-color:var(--ok)} .grade.g-s .gv{color:var(--okink)}
.grade.g-h{background:var(--goldbg);border-color:var(--goldline)} .grade.g-h .gv{color:var(--gold)}
.grade.g-d{background:var(--badbg);border-color:var(--bad)} .grade.g-d .gv{color:var(--bad)}
.grade.g-x{background:var(--chip)} .grade.g-x .gv{color:var(--ink)}
.gsm{padding:7px 10px;margin-top:8px}
.gsm .gv{font-size:.93rem}

/* письменный ответ и разбор */
.wr{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:1.3rem;line-height:2;min-height:108px}
.dif{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;justify-content:flex-start;margin-top:5px}
.dif span{padding:2px 8px;border-radius:6px;font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;font-size:1.2rem;line-height:1.8}
.dif .k{background:var(--okbg);color:var(--okink)}
.dif .x{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.dif .mi{background:var(--goldbg);color:var(--gold);border:1px dashed var(--goldline)}
.scorebar{display:flex;align-items:center;gap:11px;margin:11px 0 5px}
.scorebar .b{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.scorebar .b i{display:block;height:100%;background:var(--accent);border-radius:99px}
.scorebar b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:9px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

/* ==========================================================
   ГРАФИКИ
   ========================================================== */
.mc-tip{
  position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--card);
  border-radius:8px;padding:7px 10px;font-size:.78rem;line-height:1.4;max-width:230px;
  box-shadow:var(--sh-2);display:grid;gap:1px
}
.mc-tip span:first-child{font-weight:650}
.mc-tip[hidden]{display:none}

/* кольцо */
.mc-ring{width:108px;height:108px}
.mc-ring-v{font-size:25px;font-weight:700;fill:var(--ink);font-family:"IBM Plex Sans",sans-serif}
.mc-ring-s{font-size:11.5px;fill:var(--muted);font-family:"IBM Plex Sans",sans-serif}
.rings{display:flex;gap:14px;justify-content:space-around;flex-wrap:wrap}
.rc{text-align:center;flex:1;min-width:126px}
.rg{width:108px;height:108px}
.rt{font-weight:650;margin-top:3px;font-size:.9rem}
.rs{font-size:.8rem;color:var(--muted)}

/* дорожка/индикатор доли */
.mc-track{display:block;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.mc-track > i{display:block;height:100%;border-radius:99px;background:var(--lv4);transition:width .3s ease}
.mc-track > i.done{background:var(--ok)}
.mc-meter{display:grid;gap:6px}
.mc-meter + .mc-meter{margin-top:13px}
.mc-meter-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mc-meter-l{font-weight:600;font-size:.9rem}
.mc-meter-v{font-variant-numeric:tabular-nums;font-weight:700;font-size:1rem;white-space:nowrap}
.mc-meter-m{color:var(--muted);font-weight:500;font-size:.85em}
.mc-meter-s{font-size:.78rem;color:var(--muted)}

/* карта заучивания */
.mc-carpet{display:grid;grid-template-columns:repeat(auto-fill,minmax(19px,1fr));gap:3px;margin:4px 0 2px}
.mc-carpet[data-dense="1"]{grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:2.5px}
.mc-c{aspect-ratio:1;border-radius:3.5px;background:var(--track);cursor:default;transition:transform .1s}
.mc-c:hover,.mc-c:focus-visible{transform:scale(1.28);z-index:2;position:relative}
.mc-c-off{background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}
.mc-c-0{background:var(--lv0)} .mc-c-1{background:var(--lv1)} .mc-c-2{background:var(--lv2)}
.mc-c-3{background:var(--lv3)} .mc-c-4{background:var(--lv4)} .mc-c-5{background:var(--lv5)}
.mc-c-6{background:var(--lv6)}

/* полоса «часть-целое» + ключи */
.mc-stack{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--track);gap:2px;margin:10px 0 9px}
.mc-stack i{display:block;min-width:4px}
.mc-s-0{background:var(--lv0)} .mc-s-1{background:var(--lv1)} .mc-s-2{background:var(--lv2)}
.mc-s-3{background:var(--lv3)} .mc-s-4{background:var(--lv4)} .mc-s-5{background:var(--lv5)}
.mc-s-6{background:var(--lv6)}
.mc-keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.mc-key{display:inline-flex;align-items:center;gap:5px}
.mc-key i{width:9px;height:9px;border-radius:2.5px;display:inline-block}
.mc-key b{color:var(--ink);font-variant-numeric:tabular-nums}

/* столбцы */
.mc-cols{display:flex;align-items:flex-end;gap:3px;height:124px;margin:6px 0 2px;
  border-bottom:1px solid var(--line-2);padding-bottom:0}
.mc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;min-width:0}
.mc-col-b{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.mc-col-b i{display:block;width:100%;max-width:26px;margin:0 auto;background:var(--lv3);border-radius:4px 4px 0 0;transition:height .3s ease}
.mc-col.hl .mc-col-b i{background:var(--accent)}
.mc-col-b b{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:700;line-height:1.3;margin-bottom:2px}
.mc-col.hl .mc-col-b b{color:var(--accent)}
.mc-col-l{font-size:.68rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;
  padding-top:5px;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.mc-col.hl .mc-col-l{color:var(--accent);font-weight:700}
.mc-note{font-size:.78rem;color:var(--muted);margin:9px 0 0}

/* горизонтальные полосы по разделам */
.mc-rows{display:grid;gap:11px}
.mc-row{display:grid;grid-template-columns:1fr 84px auto;gap:10px;align-items:center;font-size:.85rem}
.mc-row-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.mc-row-v{font-variant-numeric:tabular-nums;font-size:.85rem;white-space:nowrap;font-weight:650}
@media (max-width:420px){ .mc-row{grid-template-columns:1fr 60px auto} }

/* плитки-показатели */
.mc-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media (min-width:560px){ .mc-stats{grid-template-columns:repeat(4,1fr)} }
.mc-stat{background:var(--inset);border:1px solid var(--line);border-radius:var(--r-s);padding:11px 12px}
.mc-stat-v{font-size:1.5rem;font-weight:700;line-height:1.15;color:var(--ink);letter-spacing:-.02em}
.mc-stat-u{font-size:.82rem;font-weight:600;color:var(--muted);margin-inline-start:2px}
.mc-stat-l{font-size:.76rem;color:var(--muted);margin-top:1px;font-weight:500}
.mc-stat-s{font-size:.72rem;color:var(--muted);margin-top:3px}

/* ==========================================================
   ГЛАВНАЯ ПАНЕЛЬ
   ========================================================== */
.dash-hero{
  background:linear-gradient(140deg,#03426a 0%,#01669d 58%,#0c7ec0 100%);
  color:#fff;border-radius:var(--r);padding:19px 18px;margin-bottom:13px;
  box-shadow:var(--sh-2);position:relative;overflow:hidden
}
.dash-hero::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;
  background:linear-gradient(90deg,transparent,var(--goldline) 20%,var(--goldline) 80%,transparent)}
.dash-hero .dh-l{font-size:.72rem;font-weight:650;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.dash-hero .dh-v{font-size:2.7rem;font-weight:700;line-height:1.05;margin:3px 0 1px;letter-spacing:-.025em}
.dash-hero .dh-s{font-size:.88rem;color:rgba(255,255,255,.88)}
.dash-hero .dh-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.dash-hero .dh-streak{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);
  border-radius:999px;padding:6px 13px;font-weight:600;font-size:.84rem;white-space:nowrap}

/* неделя вперёд */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:2px}
.wk-d{border:1px solid var(--line);border-radius:9px;padding:7px 3px 8px;text-align:center;background:var(--inset);min-width:0}
.wk-d.today{background:var(--tint);border-color:var(--accent);border-width:1.5px;margin:0}
.wk-n{font-size:.66rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.wk-num{font-size:.95rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.wk-x{display:block;height:5px;width:5px;border-radius:99px;margin:3px auto 0;background:transparent}
.wk-x.on{background:var(--goldline)}
.wk-lab{font-size:.52rem;letter-spacing:-.012em;color:var(--muted);line-height:1.25;margin-top:2px;
  overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk-d.today .wk-lab,.wk-d.today .wk-num{color:var(--accent)}

/* плитка предмета */
.subj{
  display:block;width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--sh-1);transition:border-color .15s,box-shadow .15s,transform .07s;
  appearance:none;-webkit-appearance:none;margin:0
}
.subj:hover{border-color:var(--line-2);box-shadow:var(--sh-2)}
.subj:active{transform:translateY(1px)}
.subj-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.subj-n{font-weight:700;font-size:1.02rem;letter-spacing:-.005em}
.subj-ar{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;direction:rtl;color:var(--muted);font-size:1.02rem;white-space:nowrap}
.subj-m{margin-top:10px}
.subj-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:.78rem}
.subj-grid{display:grid;gap:11px}

/* статусная метка: цвет + всегда подпись */
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;
  font-size:.75rem;font-weight:650;border:1px solid transparent;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:99px;display:block;flex:none}
.tag.t-crit{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--crit) 35%,transparent)}
.tag.t-crit i{background:var(--crit)}
.tag.t-warn{background:var(--goldbg);color:var(--gold);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.tag.t-warn i{background:var(--warn)}
.tag.t-ok{background:var(--okbg);color:var(--okink);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tag.t-ok i{background:var(--ok)}
.tag.t-idle{background:var(--chip);color:var(--muted)}
.tag.t-idle i{background:var(--muted)}

/* слабые места */
.weak{display:grid;gap:7px}
.weak-i{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;
  background:var(--inset);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px}
.weak-n{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);font-size:.92rem;white-space:nowrap}
.weak-t{font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;direction:rtl;text-align:right;font-size:1.05rem;
  line-height:1.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.weak-p{font-variant-numeric:tabular-nums;font-weight:700;font-size:.85rem;color:var(--bad);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<script>
/* ============================================================
   Мухаррар — общая библиотека графиков.
   Формы выбраны по задаче данных; цвет — одна последовательная
   рампа (--lv0..--lv6), статусные цвета всегда с подписью.
   ============================================================ */
(function () {
  "use strict";
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- общий язык интерфейса ----------
     Один источник правды для всех модулей: выбор хранится под этим ключом,
     каждый модуль читает его в момент отрисовки.                          */
  const LKEY = 'muharrar-lang-v1';
  window.MuharrarL = {
    get() {
      try { const l = localStorage.getItem(LKEY); if (l === 'ru' || l === 'en' || l === 'ar') return l; } catch (e) {}
      return 'ru';
    },
    /* Построитель переводчика: t('ключ', ...аргументы).
       Значение словаря — строка или функция от аргументов.                */
    make(dict) {
      const self = this;
      return function (k) {
        const row = dict[k];
        if (!row) return k;
        const v = (row[self.get()] !== undefined ? row[self.get()] : row.ru);
        return typeof v === 'function' ? v.apply(null, [].slice.call(arguments, 1)) : v;
      };
    },
    dir() { return this.get() === 'ar' ? 'rtl' : 'ltr'; },
    /* локаль для названий дней недели */
    loc() { const l = this.get(); return l === 'ar' ? 'ar' : l === 'en' ? 'en-GB' : 'ru-RU'; },
    /* арабские названия дней целиком не влезают под столбцы —
       для ar берём однобуквенные сокращения, принятые в календарях */
    dowShort(dayNumber) {
      if (this.get() === 'ar') return ['ح', 'ن', 'ث', 'ر', 'خ', 'ج', 'س'][(dayNumber + 4) % 7];
      try { return new Date(dayNumber * 864e5).toLocaleDateString(this.loc(), { weekday: 'short', timeZone: 'UTC' }); }
      catch (e) { return ''; }
    },
    /* выставляет lang/dir на контейнерах предмета */
    apply(ids) {
      const d = this.dir(), l = this.get();
      (ids || []).forEach(id => {
        const el = typeof id === 'string' ? document.getElementById(id) : id;
        if (el) { el.setAttribute('lang', l); el.setAttribute('dir', d); }
      });
    }
  };

  /* ---------- всплывающая подсказка (один общий слой) ---------- */
  let tipEl = null;
  function ensureTip() {
    if (tipEl && document.body.contains(tipEl)) return tipEl;
    tipEl = document.createElement('div');
    tipEl.className = 'mc-tip';
    tipEl.setAttribute('role', 'status');
    tipEl.hidden = true;
    document.body.appendChild(tipEl);
    return tipEl;
  }
  function showTip(target) {
    const txt = target.getAttribute('data-tip');
    if (!txt) return;
    const el = ensureTip();
    el.innerHTML = txt.split('\n').map(l => `<span>${esc(l)}</span>`).join('');
    el.hidden = false;
    const r = target.getBoundingClientRect(), tr = el.getBoundingClientRect();
    let left = r.left + r.width / 2 - tr.width / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - tr.width - 8));
    let top = r.top - tr.height - 8;
    if (top < 8) top = r.bottom + 8;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }
  function hideTip() { if (tipEl) tipEl.hidden = true; }
  function bindTips() {
    if (document.__mcTips) return;
    document.__mcTips = true;
    const over = e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); };
    document.addEventListener('pointerover', over);
    document.addEventListener('focusin', over);
    document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('[data-tip]')) hideTip(); });
    document.addEventListener('focusout', hideTip);
    window.addEventListener('scroll', hideTip, true);
  }

  /* ---------- 1. Кольцо: одна доля от целого ---------- */
  function ring(pct, big, small, opts) {
    opts = opts || {};
    const p = Math.max(0, Math.min(100, pct || 0));
    const stroke = opts.stroke || 'var(--lv4)';
    return `<svg viewBox="0 0 120 120" class="mc-ring" role="img" aria-label="${esc((opts.aria || '') + ' ' + big + ' ' + (small || ''))}">
      <circle cx="60" cy="60" r="50" fill="none" stroke="var(--track)" stroke-width="9"/>
      <circle cx="60" cy="60" r="50" fill="none" stroke="${stroke}" stroke-width="9"
        stroke-linecap="${p > 0 && p < 100 ? 'round' : 'butt'}" pathLength="100"
        stroke-dasharray="${p} 100" transform="rotate(-90 60 60)"/>
      <text x="60" y="${small ? 62 : 68}" text-anchor="middle" class="mc-ring-v">${esc(big)}</text>
      ${small ? `<text x="60" y="82" text-anchor="middle" class="mc-ring-s">${esc(small)}</text>` : ''}
    </svg>`;
  }

  /* ---------- 2. Индикатор доли: значение против предела ---------- */
  function meter(o) {
    const v = o.value || 0, max = Math.max(1, o.max || 1);
    const pct = Math.max(0, Math.min(100, v / max * 100));
    return `<div class="mc-meter">
      <div class="mc-meter-h"><span class="mc-meter-l">${esc(o.label || '')}</span>
        <span class="mc-meter-v"><b>${v}</b><span class="mc-meter-m">/${max}</span></span></div>
      <div class="mc-track"><i style="width:${pct.toFixed(1)}%"></i></div>
      ${o.sub ? `<div class="mc-meter-s">${esc(o.sub)}</div>` : ''}
    </div>`;
  }

  /* ---------- 3. Карта заучивания: сетка элементов по уровню ----------
     Форма: тепловая сетка (величина по одной рампе).
     Каждая ячейка — один хадис / бейт / аят.                          */
  function carpet(o) {
    const items = o.items || [];
    if (!items.length) return '';
    const cells = items.map(it => {
      const lv = o.level(it);                 // null = не выучено, иначе 0..6
      const cls = lv == null ? 'mc-c mc-c-off' : 'mc-c mc-c-' + Math.max(0, Math.min(6, lv));
      return `<span class="${cls}" data-tip="${esc(o.tip(it))}" tabindex="0" role="img" aria-label="${esc(o.tip(it).replace(/\n/g, ', '))}"></span>`;
    }).join('');
    return `<div class="mc-carpet"${o.dense ? ' data-dense="1"' : ''}>${cells}</div>`;
  }

  /* ---------- 4. Легенда уровней (она же — распределение) ----------
     Форма: одна полоса «часть-целое» + подписи.                       */
  function levelStrip(counts, names, o) {
    o = o || {};
    const total = counts.reduce((a, b) => a + b, 0);
    if (!total) return '';
    const segs = counts.map((c, i) => c ? `<i class="mc-s-${i}" style="flex:${c}" data-tip="${esc(names[i] + '\n' + c + ' ' + (o.unit || ''))}" tabindex="0"></i>` : '').join('');
    const keys = counts.map((c, i) => c ? `<span class="mc-key"><i class="mc-s-${i}"></i>${esc(names[i])}<b>${c}</b></span>` : '').join('');
    return `<div class="mc-stack">${segs}</div><div class="mc-keys">${keys}</div>`;
  }

  /* ---------- 5. Столбцы: нагрузка по дням вперёд ----------
     Форма: столбцы (величина во времени), одна рампа, выделен «сегодня». */
  function columns(o) {
    const rows = o.rows || [];
    const max = Math.max(1, ...rows.map(r => r.value));
    // подписи только выборочно: «сегодня» и пик — остальное по наведению
    const bars = rows.map(r => {
      const h = r.value ? Math.max(4, r.value / max * 88) : 0;   // 88%: место под подпись
      const lab = r.value && (r.hl || r.value === max);
      return `<div class="mc-col${r.hl ? ' hl' : ''}" data-tip="${esc(r.tip || (r.label + '\n' + r.value))}" tabindex="0">
        <div class="mc-col-b">${lab ? `<b>${r.value}</b>` : ''}<i style="height:${h}%"></i></div>
        <span class="mc-col-l">${esc(r.label)}</span></div>`;
    }).join('');
    return `<div class="mc-cols">${bars}</div>${o.note ? `<p class="mc-note">${esc(o.note)}</p>` : ''}`;
  }

  /* ---------- 6. Горизонтальные полосы: разделы ----------
     Форма: полосы (сравнение величин), длина = выучено из всего.      */
  function sections(o) {
    const rows = o.rows || [];
    if (!rows.length) return '';
    return `<div class="mc-rows">` + rows.map(r => {
      const pct = r.total ? r.done / r.total * 100 : 0;
      const full = r.total && r.done >= r.total;
      return `<div class="mc-row" data-tip="${esc(r.label + '\n' + r.done + ' из ' + r.total)}" tabindex="0">
        <span class="mc-row-l"${r.rtl ? ' dir="rtl"' : ''}>${esc(r.label)}</span>
        <span class="mc-track"><i class="${full ? 'done' : ''}" style="width:${pct.toFixed(1)}%"></i></span>
        <b class="mc-row-v">${r.done}<span class="mc-meter-m">/${r.total}</span></b>
      </div>`;
    }).join('') + `</div>`;
  }

  /* ---------- 7. Плитка-показатель ---------- */
  function stat(o) {
    return `<div class="mc-stat">
      <div class="mc-stat-v">${esc(o.value)}${o.unit ? `<span class="mc-stat-u">${esc(o.unit)}</span>` : ''}</div>
      <div class="mc-stat-l">${esc(o.label)}</div>
      ${o.sub ? `<div class="mc-stat-s">${esc(o.sub)}</div>` : ''}
    </div>`;
  }
  const statRow = list => `<div class="mc-stats">${list.map(stat).join('')}</div>`;

  bindTips();
  window.MuharrarCharts = { ring, meter, carpet, levelStrip, columns, sections, stat, statRow, esc, bindTips };
})();
</script>

const MEM={"1": {"m": "عَنْ أَبِي هُرَْيرَةَ رَضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «لَا يَقْبَلُ اللَّهُ صَلاةَ أَحَدِكُمْ إِذَا أحْدَثَ حَتّى يَتَوَضّأ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ.", "w": ["قوله: \"إذا أحدث\" أي: وقع منه الحدث، وهو كل ما ينقض الوضوء."], "s": ["أ- أن الصلاة فرضها ونفلها حتى صلاة الجنازة لا تقبل إذا صلاها المحدث ولو كان ناسياً حتى يتوضأ، وكذا الجنب حتى يغتسل.", "ب- أنه لا يجب الوضوء لكل صلاة، ومن صلى أكثر من صلاة بوضوء واحد -ولم يحدث- فصلاته مقبولة، لأن الحديث علّق عدم القبول بحصول الحدث.", "والحديث أورده المصنف للاستدلال به على أن الطهارة شرط من شروط الصلاة."], "t": ["وهذا لفظ الإمام البخاري، وأما لفظ الإمام مسلم فهو: \"لا تُقبل صلاة...\" ولعله سبق قلم من المصنف رحمه الله."]}, "2": {"m": "وَعَنْ أَبِي سَعَِيدٍ الخُدْرِيِ رضَي الله عنه أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم قَالَ: «لَا يَنْظُرَُالرّجُلُ إِلََى عَوْرَةِ الرّجُلِ، وََلَا المَرْأةُ إِلَى عَوْرَةِ المَرْأةِ، وََلَا يُفْضِي الرّجُلُ إِلَى الرّجُلِ فِي ثَوْبٍ وَاحِدٍ، وََلَا تُفْضِي المَرْأةُ إِلَى المَرْأةِ فِي ثَوْبٍ وَاحِدٍ» رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (لا ينظر) بضم الراء من المضارع على أن (لا) نافية، وهو نفي بمعنى النهي، والنفي أبلغ من النهي؛ لأن فيه تقريرًا وتأكيداً لاجتناب النظر، كأنه أمر لا يمكن أن يكون، وأما النهي فلا يعطي هذا المعنى.", "قوله: (إلى عورة الرجل) المراد به: الذكر، فيشمل الكبير والصغير ـ وهو من بلغ عشر سنين ـ (١). والعورة في اللغة لها عدة معان منها: الخلل في الثغر وغيره، والسوأة، والشيء المستقبح، وكل ما يُستحيا منه. سميت بذلك، لقبح ظهورها، وغض الأبصار عنها، أخذاً من العَوَارِ، الذي هو العيب. وشرعاً: كل ما حرم الله تعالى كشفه أمام من لا يحل له النظر إليه (٢).", "قوله: (ولا المرأة إلى عورة المرأة)؛ أي: فلا يجوز النظر إلى العورات ولو مع اتحاد الجنس، فضلاً عن اختلافه.", "قوله: (ولا يفضي) بضم الياء؛ أي: يصل، يقال: أفضى الرجل بيده إلى الأرض: مسها ببطن راحته، وأفضى إلى المرأة: باشرها وجامعها، وأفضيت إلى الشيء: وصلت إليه، والمعنى: لا يضطجع الرجل مع الرجل متجردين تحت ثوب واحد، وكذا المرأة لا تضطجع مع المرأة متجردتين تحت ثوب واحد، بحيث تصل بشرة أحدهما إلى بشرة الآخر في المضجع خوف حصول فاحشة بينهما."], "s": ["أ- الحديث دليل على تحريم نظر الرجل إلى عورة الرجل، وهذا مما لا خلاف فيه. وعورة الرجل أمام الرجال والنساء المحارم ما بين السرة والركبة، وهذا قول أكثر الفقهاء في المذاهب الأربعة، إلا أن الحنفية قالوا: الركبة من العورة، واستدلوا بالأدلة التي جاء فيها النهي عن إظهار الفخذ، والأمر بستره، وسيأتي بحث هذه المسألة ـ إن شاء الله تعالى ـ. والقول الثاني: أن عورة الرجل الفرجان القبل والدبر، وهذا رواية عن مالك، وأحمد، واختاره ابن حزم وآخرون، واستدلوا بالأدلة الدالة على أن الفخذ ليس بعورة، كما سيأتي.", "والأظهر ـ والله أعلم ـ أن عورة الرجل أمام الرجل ما بين السرة والركبة، والركبة ليست من العورة، والفخذ عورة مخففة، كما سيأتي ـ إن شاء الله ـ بيانه.", "لكن هل يُفهم من هذا أنه لا يجب على الرجل أن يستر في صلاته إلا هذا المقدار فقط؟ صرَّح ابن حزم ومَن تبعه بذلك، حيث قال: (والعورة المفترض سترها على الناظر وفي الصلاة من الرجل: الذكر وحلقة الدبر فقط، وليس الفخذ من العورة). ولكن شيخ الإسلام ابن تيمية ردَّ هذا واستنكره مبيناً أن عورة الصلاة غير عورة النظر، ولذا فهو يقول: (فإذا قلنا على أحد القولين، وهو: إحدى الروايتين عن أحمد: أن العورة هي السوءتان، وأن الفخذ ليست بعورة، فهذا في جواز نظر الرجل إليها، ليس هو في الصلاة والطواف، فلا يجوز أن يصلي الرجل مكشوف الفخذين، سواء قيل هما عورة أو لا، ولا يطوف عرياناً، بل عليه أن يصلي في ثوب واحد، ولا بد من ذلك إن كان ضيقاً ائتزر به، وإن كان واسعاً التحف به، كما أنه لو صلى وحده في بيت كان عليه تغطية ذلك باتفاق العلماء.", "وأما صلاة الرجل بادي الفخذين، مع القدرة على الإزار، فهذا لا يجوز، ولا ينبغي أن يكون في ذلك خلاف، ومن بنى ذلك على الروايتين في العورة، كما فعله طائفة، فقد غلطوا - أي: غلط من ربط عورة النظر بعورة الصلاة -، ولم يقل أحمد ولا غيره: إن المصلي يصلي على هذه الحال، كيف وأحمد يأمر بستر المنكبين، فكيف يبح له كشف الفخذ!! فهذا هذا.", "ب- الحديث دليل على تحريم نظر المرأة إلى عورة المرأة، وهذا بالإجماع. وعورة المرأة أمام المرأة المسلمة ما بين السرة والركبة، وهذا مذهب الجمهور، والمراد بذلك: مسألة النظر، كما سيأتي. إلا أن الحنفية قالوا: إن الركبة عورة، كما تقدم في عورة الرجل. ودليل الجمهور أنه ليس في نظر المرأة إلى المرأة خوف الشهوة، والوقوع في الفتنة، كما ليس ذلك في نظر الرجل إلى الرجل.", "والقول الثاني: أن عورة المرأة أمام المرأة ما بين السرة والركبة، والبطن والظهر أيضاً، وهذا قول لأبي حنيفة، والشافعي. والقول الثالث: أن عورتها أمام المرأة القبل والدبر فقط، وهذا قول ابن حزم(٤)، وهو قول ضعيف لا يعوَّل عليه، ولا يُلتفت إليه. والصواب ـ إن شاء الله ـ هو القول الثاني، وهو أن عورة المرأة أمام المرأة المسلمة ما بين السرة والركبة مع الظهر والبطن، وذلك لما يلي:", "أولَا: أن الجمهور القائلين بأن عورة المرأة أمام المرأة ما بين السرة إلى الركبة لم يذكروا دليلاً صحيحاً يعوَّل عليه، وقياسهم عورة المرأة على عورة الرجل قياس مع الفارق؛ لأن حال المرأة مبني على الحياء والستر، ثم إن عورتها أمام الرجال هي جميع البدن، كما سيأتي، فكيف تُقاس على الرجل؟!", "ثانيا: على التسليم بأن عورة المرأة أمام المرأة هي ما ذكر، فإن هناك فرقاً بين العورة وبين اللباس، فإن العورة لا يجوز تعمُّد إظهارها، ولا يجوز النظر إليها كما دلَّ عليه الحديث. واللباس لا بدَّ أن يكون ساترًا للبدن.", "ج- استدل الفقهاء بهذا الحديث على أنه يجوز للمرأة أن تنظر من المرأة جميع بدنها إلا ما بين السرة والركبة، على اعتبار أن هذا عورة المرأة، فإذا نُهي عن النظر إلى هذا دلَّ على أنه عورة المرأة، وأن ما عداه يجوز النظر إليه؛ لأنه ليس بعورة، وترتب على هذا الاستدلال فهم خاطئ لدى كثير من نساء هذا العصر، حيث فهمن من كون عورة المرأة أمام المرأة ما بين السرة والركبة، أنه يجوز الاقتصار على ستر هذا المقدار من البدن، وأنه يجوز تقصير اللباس إلى الركبة، وإظهار الصدر، والبطن، والظهر ونحو ذلك من إظهار ما وجب ستره، وهذا الفهم بمعزل عن الصواب، ولم يقل به أحد من أهل العلم المعتبرين، وهذا الحديث أيضاً ليس فيه تعرض لمسألة اللباس؛ لأن الرسول ﷺ لم يقل لباس المرأة ما بين السرة والركبة، وإنما فيه نهي المرأة الناظرة أن تنظر إلى عورة أختها المسلمة لو انكشفت عورتها بريح أو نحو ذلك. وأما اللباس، فلا بدَّ أن يكون ساترًا ما بين كف اليد إلى كعب الرجل هذا هو المشروع، ولا يَجَوز للمرأة أن تبدي للنساء إلا ما تبديه لمحارمها؛ لقوله تعالى: ﴿وََلا يُبدِينَ زِينَتَهُنَّ إِلاَّ لِبُعُوَلتِهِنَّ أو ءَابَائِهِنَّ أَو ءَابَاءِ بُعُوَلتِهِنَّ أو أبنَائِهِنَّ﴾ [النور: ٣١] ثم قال: ﴿أو نِسَائِهِنَّ﴾ فساوى في إبداء الزينة بين المحارم وبين النساء. لكن لو احتاجت المرأة إلى تشمير ثوبها لشغل ونحوه إلى الركبة أو ذراعيها إلى العضد فلا بأس بذلك، وعليها أن تقتصر على ما تدعو إليه الحاجة. وأما أن يكون هذا هو اللباس المعتاد الذي تلبسه، فلا.", "د- أما عورة المرأة في الصلاة، فالجمهور على أن جميع بدنها عورة في الصلاة لا بدَّ من ستره إلا وجهها وكفيها، إذا لم يكن بحضرتها أجانب ليسوا من محارمها؛ كأخي زوجها، وابن عمها، فيجب ستره، وقد نقل ابن المنذر وغيره إجماع أهل العلم على أن المرأة الحرة تصلي مكشوفة الوجه، لكن بالقيد المذكور؛ لأن الوجه عورة في باب النظر، فستره أبعد للفتنة، وأسلم للدين، وأصلح للمسلمين.", "وعند الحنابلة رواية أخرى أن الكفين عورة في الصلاة، فلا يجوز كشفهما، واختارها الأكثر، وجزم بها الخرقي؛ لعموم قوله ﷺ: «المرأة عورة»، لكن قد ينازع في هذا الاستدلال بأن المرأة عورة بحضرة الأجانب، فتغطي كفيها. أما إذا صلَّت وحدها بحيث لا يراها أحد، أو لا يراها إلا محارمها، أو نساء المسلمين فلا يتأتى هذا الاستدلال، والله أعلم.", "وأما القدمان، فالجمهور على أنهما عورة في الصلاة فلا يجوز كشفهما؛ لحديث أم سلمة مرفوعاً: «إذا كان الدرع سابغاً يغطي قدميها»، لكنه حديث معلول.", "وقالت الحنفية: إن القدمين ليسا بعورة في الصلاة فيجوز كشفهما، واختاره شيخ الإسلام ابن تيمية؛ لأن الأمر بتغطية القدم يحتاج إلى دليل صحيح، لكن قد يقال: إذا كان القدم عورة خارج الصلاة؛ لحديث: «يرخينه ذراعاً»(٣)، فكل ما كان عورة خارج الصلاة فهو عورة في الصلاة من باب أولى، وهذا أحوط.", "ه- الحديث دليل على تحريم اضطجاع الرجل مع الرجل في ثوب واحد، وكذلك المرأة مع المرأة، قال النووي: (هو نهي تحريم إذا لم يكن بينهما حائل، وفيه دليل على تحريم لمس عورة غيره بأي موضع من بدنه كان، وهذا متفق عليه...)، والله تعالى أعلم."]}, "3": {"m": "وَعَنْ بَهْزِبْنِ حَكِيمٍ، عَنْ أَبِيهِ،َ عَنْ جَدِهِ رضي الله عنه قَالَ: «قُلْتُ: يَا رَسُولَ اللَّهِ! عَوْرَاتُنَا مَا نَأْتِي مِنْهَا وَمَا نَذَرَُ؟ قَالَ: احْفََظْ عَوْرََتكَ؛ إِلَاّ مِنْ زَوْجَتِكَ، أوْمََا مَلَكَتْ يَمِينُكَ. قُلْتُ: فَإِذَا كَانَ القَوْمُ بَعْضَُهُمْ فِي بَعْضٍ؟ قَالَ: إِنِ اسَْتَطَعْتَ أَنْ لَا يَرَاهَا أحَدٌ فَلا يَرََينّهَا، قُلْتُ: فَإِذَا كَانَ أحَدُنَا خَالِيا؟ قَالَ: فَاللَّهُ تَبَاركََ وَتَعَالَى أَحَقُّ أنْ يُسْتَحْيَى مِنْهُ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ، وَ ابْنُ مَاجَهْ، وَالنّسَائِيُّ، وَالتِرْمِذِيُّ - وَحَسّنَهُ -. وَإِسْنَادُهُ ثَابِتٌ إِلَى بَهْزٍ، وَهُوَ ثِقَةٌ عِنْدَ الجُمْهُورِ.", "w": ["قوله: (ما نأتي منها وما نذر)؛ أي: أيُّ عورة نسترها، وأيُّ عورة نترك سترها.", "قوله: (احفظ عورتك) استرها، وصُنها كلها.", "قوله: (إلا من زوجتك) هكذا جاءت بالتاء، ويقال: زوج بغير هاء للذكر والأنثى، قال تعالى: ﴿اسكُن أَنتَ وَزَوجُكَ الجَنَّةَ﴾.", "قوله: (فإذا كان القوم بعضهم في بعض)؛ أي: مختلطون فيما بينهم، مجتمعون في موضع واحد، لا يقومون من موضعهم، فلا نقدر على ستر العورة على الوجه الأتم والأكمل في بعض الأحيان؛ لضيق الإزار، أو لانحلاله لبعض الضرورة، فكيف نصنع بستر العورة؟."], "s": ["أ- الحديث دليل على وجوب حفظ العورة، وذلك بسترها والحذر من ظهورها، أو ظهور شيء منها؛ لقوله: «احفظ عورتك»، وقوله: «إن استطعت ألا يراها أحد فلا يرينَّها»، وهذا أبلغ مما لو قال: استر عورتك ونحو ذلك. وستر العورة عن النظر إليها واجب، وكشفها لناظر من غير حاجة محرم بالإجماع، قال النووي: (ستر العورة عن العيون واجب بالإجماع)، ولا يُستثنى من هذا إلا الزوج، وملك اليمين.", "ب- لا خلاف بين أهل العلم في جواز كشف العورة إذا كان ثمَّ حاجة؛ كالتخلي، أو الكشف الطبي، أو الاغتسال إذا لم يكن بحضرته أحد إلا إن كان الذي معه ممن يباح له النظر إلى عورته؛ كزوجته، أو أمته فلا يجب عليه التستر لهذا الحديث، والأفضل التستر لحديث ميمونة، قالت: وضعت للنبي ﷺ ماء وسترته، فاغتسل. قال ابن رجب: (فهذا الحديث مما يُستدلُّ به على التستر في الاغتسال في الخلوة؛ لأن اغتسال الرجل مع زوجته كاغتساله خالياً). ونُقل الخلاف عن ابن أبي ليلى، فقال: لا يجوز الاغتسال عرياناً، قال الحافظ: (وكأنه تمسك بحديث يعلى بن أمية مرفوعاً: «إذا اغتسل أحدكم فليستتر» رواه أبو داود، وللبزار نحوه من حديث ابن عباس مطولاً). وحديث يعلى ضعيف، قال ابن رجب: (قيل: إن في إسناده انقطاعاً، ووصله بعض الثقات، وأنكر وصله أحمد، وأبو زرعة)، وكذا أبو حاتم. ودليل الجمهور حديث أبي هريرة، عن النبي ﷺ، قال:َ «كَانَت بَنُو إِسرَائِيلََ يَغتَسِلُونَ عُرَاةً، يَنظُرُ بَعضُهُم إِلَى بَعضٍ، وَكَانَ مُوسَى ﷺ يَغتَسِلُ وَحدَهُ، فَقَالُوا: وَاللهِ مَا يَمنَعُ مُوسَى أن يَغتَسِلَ مَعَنَا إِلاَّ أنَّهُ آدَرُ، فَذَهَبَ مَرَّةً يَغتَسِلُ، فَوَضَعَ ثَوبَهُ عَلَى حَجَرٍ...» الحديث. وقد بوَّب البخاري على قصة موسى بقوله: (باب من اغتسل عرياناً وحده في الخلوة، ومن تستر، فالتستر أفضل)، وذكر ـ أيضاً ـ قصة أيوب ﷺ. ووجه الَاستدلَال من وجهين:", "أولَا: أن موسى ﷺ اغتسل عرياناً، وهذا وإن كان في شرع من قبلنا، فإنه لم يأتِ في شرعنا ما يخالفه؛ لأن النبي ﷺ قصَّ هذه القصة ولم يتعقبها بشيء، فدلَّ على أنها موافقة لما في شرعنا.", "ثانيا: أنه لو كان الاغتسال عرياناً في الخلوة منافياً للأَولَى لمَُنِعَ منه الأنبياء، ولم يقدِّر الله لنبيه ما ليس جائزًا في شرعه(١). أما كشف العورة في حال الخلوة من غير حاجة اغتسال أو نحوه، فمن أهل العلم من قال بكراهته، ومنهم من قال بتحريمه، بدليل حديث بهز بن حكيم هذا، قال الحافظ ابن حجر: (ظاهر حديث بهز يدل على أن التعري في الخلوة غير جائز مطلقاً، لكن استدل المصنف ـ أي البخاري ـ على جوازه في الغسل بقصة موسى، وأيوب ﷺ كما تقدم في تبويبه.", "ووجه الاستدلال من الحديث: أنه إذا كان ستر العورة عَن النَاس واجباً اتفاقاً، والله تعالى أحق من الناس أن يُستحيا منه، كان سترها في الخلوة أولى بالمنع، لما يفيده قوله: «فَاللُ أحَقُّ أن يُستَحيَا مِنهُ مِنَ النَّاسِ».", "ومَن قال: لا يجب التستر حال الخلوة؛ علَّل ذلك بأن عورة الإنسان بضعة منه، ولا يحرم عليه أن ينظر إلى أي جزء من بدنه، وإذا كان له أن ينظر إلى عورة زوجته وأمته، فعورته أولى بالجواز، لكن يستحب التستر لما تقدم، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق بهز بن حكيم، عن أبيه، عن جده قال:... وذكر الحديث. قال ابن حجر -: (إسناده ثابت إلى بهز بن حكيم، ولذا جزم به البخاري)، وقال الحافظ ابن حجر - أيضاً ـ: (هو حديث حسن، مشهور عن بهز، صالح للحجة)، وبهز متكلم فيه، فقال أبو حاتم: (شيخ يُكتب حديثه، ولا يُحتج به)، وقال الشافعي: (ليس بحجة)، وقال ابن معين: (ثقة)، وكذا قال النسائي، وقال الحافظ في «التقريب»: (صدوق)، والأقرب توثيقه. وأما قول أبي حاتم، ففيه شدة."]}, "4": {"m": "وَعَنْ صَفِيّةَ بِنْتِ الحَارِثِ، عََنْ عَائِشََةَ رضي الله عنها، عَنِ النّبِيِ صلى الله عليه وسلم أَنّهُ قَالَ: «لَا يَقْبَلُ اللَّهُ عز وجل صَلاةَ حَائِضٍ إِلَاّ بِخِمَارٍ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ، وَ ابْنُ مَاجَهْ، وَالتِرْمِذِيُّ - وَحَسّنَهُ -، وَالحَاكِمُ - وَقَالَ: «عَلَى شَرْطِ مُسْلِمٍ» -. وَصَفِيّةُ: وَثّقَهَا ابْنُ حِبّانَ. وَقَدْ رُوِيَ مَوْقُوفا، وَمُرْسَلا. وَرَوَاهُ ابْنُ خُزَْيمَةَ فِي «صَحِيحِهِ»، وَلَفْظُهُ: «لَا يَقْبَلُ اللَّهُ صَلاةَ امْرََأةٍ قَدْ حَاضَتْ؛ إِلَاّ بِخِمَارٍ».", "w": ["قوله: (لا يقبل الله …)، اعلم أن نفي القبول إما أن يكون بفوات شرط أو لوجود مانع، أو ليس لذلك، فإن كان لفوات شرط أو وجود مانع فهو نفي للصحة، مثال فوات الشرط: من صلى بغير وضوء لم يقبل الله صلاته، من صلت بغير خمار لم تقبل صلاتها، ومثال وجود مانع: من تكلم في صلاته لم تقبل.", "أما إذا كان نفي القبول لا يتعلق بفوات شرط ولا وجود مانع فلا يلزم منه نفي الصحة، فقد يراد به نفي القبول التام، أي: لم تقبل على وجه التمام الذي يحصل به الرضا وتمام المثوبة.", "وقد يراد به أن هذه السيئة التي فعلها تقابل تلك الحسنة في الميزان فتكون كأنها غير مقبولة، وإن كانت مجزئة، وتبرأ بها الذمة.", "ومن ذلك نفي القبول عن صلاة الآبق، ومن في جوفه خمر، ومن يأتي عرافا، مع ثبوت صحة صلاتهم بالإجماع، وإنما المراد أن الله تعالى لا يثيبهم عليها.", "قوله: (صلاة حائض) المراد بالحائض، المرأة التي بلغت، وجرى عليها قلم التكليف، وليس المراد: من هي حائض؛ لأن الحائض لا صلاة عليها.", "وليس المراد من الحديث البالغة بالحيض فقط، وإنما المراد: البالغة بأي علامة من علامات البلوغ كالاحتلام، وإنما عبر بالحيض لأنه يخص النساء، قال الحافظ ابن حجر: (قد أجمع العلماء على أن الاحتلام في الرجال والنساء يلزم به العبادات والحدود وسائر الأحكام).", "قوله: (إلا بخمار) بكسر الخاء، ما تخمر به المرأة رأسها، أي: تغطيه به."], "s": ["استدل بهذا الحديث من قال: إن البنت إذا بلغت وجب عليها أن تغطي رأسها في صلاتها، فإن صلت وشيء من شعرها مكشوف لم تصح صلاتها، قال الترمذي رحمه الله عقب حديث الباب: (والعمل عليه عند أهل العلم، أن المرأة إذا أدركت فصلت وشيء من شعرها مكشوف لا تجوز صلاتها …).", "ومفهوم الحديث أن البنت التي دون البلوغ تصح صلاتها ولو كان رأسها مكشوفا؛ لأن عورتها أخف من عورة البالغة.", "وأما الوجه فإن المرأة تكشف وجهها في الصلاة، وقد نقل ابن بطال الإجماع على أن للمرأة أن تبدي وجهها في الصلاة، ويراه الغرباء، وقال ابن المنذر: (أجمع أكثر أهل العلم على أن للمرأة الحرة أن تصلي مكشوفة الوجه) إلا إذا كان بحضرتها أجانب ليسوا من محارمها، كأخي زوجها وابن عمها فيجب عليها ستره على الراجح من قولي أهل العلم؛ لأنه عورة في باب النظر، فستره أبعد للفتنة، وأسلم للدين، وأصلح للمسلمين.", "وأما الكفان - وحدهما إلى الرسغين - فالجمهور من الحنفية والمالكية والشافعية والحنابلة في إحدى الروايتين على أنه يجوز للمرأة أن تكشف كفيها في الصلاة.", "واختار هذه الرواية من الحنابلة الموفق وابن تيمية والمرداوي؛ لأن أمرها بتغطية يديها في الصلاة يحتاج إلى دليل، وإنما هي مأمورة بالخمار مع القميص.", "والرواية الثانية في مذهب الحنابلة - وهي الصحيح من المذهب - أنه لا يجوز للمرأة أن تكشف كفيها في الصلاة، واختارها الأكثر، وجزم بها الخرقي، لعموم قوله صلى الله عليه وسلم: «المرأة عورة، فإذا خرجت استشرفها الشيطان».", "لكن قد ينازع في هذا الاستدلال بأن المرأة عورة إذا صلت بحضرة الأجانب فتغطي كفيها، أما إذا صلت وحدها بحيث لا يراها أحد أو حيث لا يراها إلا محارمها ونساء المسلمين فلا يتأتى هذا الاستدلال، والله أعلم.", "وأما القدمان فالجمهور من الشافعية والحنابلة والمالكية أنهما عورة في الصلاة، فلا يجوز كشفهما.", "واستدلوا بحديث أم سلمة - الآتي إن شاء الله ـ: «إذا كان الدرع سابغا يغطي ظهور قدميها …».", "والقول الثاني: أن القدمين ليسا بعورة، فيجوز كشفهما في الصلاة، وهو قول الحنفية، واختاره شيخ الإسلام ابن تيمية؛ لأن الأمر بتغطية القدم يحتاج إلى دليل.", "قال صاحب «الإنصاف»: (وهو الصواب).", "وهذه الأحكام إنما هي للحرة، وأما الأمة فعورتها من السرة إلى الركبة على قول الجمهور، إلا ابن حزم فيرى أنها كالحرة، وتفاصيل المسألة في كتب الفقه. والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق حماد بن سلمة، عن قتادة، عن محمد بن سيرين، عن صفية بنت الحارث، عن عائشة رضي الله عنها مرفوعاً.", "وأخرجه الحاكم من طريق عبد الوهاب بن عطاء، أنبأ سعيد - يعني ابن أبي عروبة - عن قتادة، عن الحسن أن رسول الله صلى الله عليه وسلم قال: فذكره … مرسلاً.", "وهذا المرسل علقه أبو داود بعد روايته المتصلة، كأنه يعله به! ويرى بعض العلماء، ومنهم الألباني أن هذا ليس بعلة، فإن حماد بن سلمة ثقة، والرواية المرسلة تؤيد المتصلة، وهي من طريق آخر، فهو عن قتادة عن شيخين، عن ابن سيرين متصلا، وعن الحسن مرسلا.", "ورجح آخرون من أئمة الحديث الإرسال، منهم أبو داود في ظاهر صنيعه - كما تقدم - ولعل وجه هذا الترجيح للإرسال أنه من رواية سعيد بن أبي عروبة عن قتادة، وسعيد من أثبت الناس في قتادة، وقد توبع قتادة على هذه الرواية المرسلة؛ تابعه عمرو، عن الحسن، عند عبد الرزاق، وهذا هو الأقرب، فإن الحديث مداره على قتادة، ومن صححه لا يداني من أعله. وقد أخرجه أحمد وأبو داود من طريق حماد بن زيد قال: ثنا أيوب، عن محمد، أن عائشة نزلت على صفية أم طلحة الطلحات، فرأت بنات لها يصلين بغير خمر قد حضن، قال: فقالت عائشة: لا تصلين جارية منهن إلا في خمار، إن رسول الله صلى الله عليه وسلم دخل علي، وكانت في حجري جارية، فألقى علي حقوه، فقال: (شقيه بين هذه، وبين الفتاة التي في حجر أم سلمة، فإني لا أراها إلا قد حاضت، أو لا أراهما إلا قد حاضتا).", "وهذا لفظ أحمد، وأخرجه أحمد - أيضا من طريق هشام بن حسان، عن محمد أن عائشة … به.", "لكن أعل بأن محمد بن سيرين في سماعه من عائشة مقال، وعلى هذا فليس في الحديث حجة، ويكون المعول على الإجماع."]}, "5": {"m": "وَعَنْ أَيُّوبَ، عَنْ نَافِعٍ، عَنِ ابْنِ عُمَرَ رُضي الله عنهما قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «مَنْ جَرّ ثَوْبَهُ خُيَلاءَ؛ لَمَْ يَنْظُرِاللَّهُ إِلَيْهِ يَوْمَ القِيَامَةِ. فَقَالَتْ أمُّ سَلَمَةَ: فَكَيْفَ تَصْنَعُ النِسَاءُ بِذُيُولِهِنّ؟ قَالَ: يُرْخِينَ شِبْرا. فَقَالَتْ: إِذَنْ تَنْكَشِفُ أقْدَامُهُنّ! قَُالَ: فَيُرْخِينَهُ ذِراعا لَا يَزِدْنَ عَلَيْهِ» رَوَاهُ النّسَائُِيُّ، وَالتِرْمِذِيُّ - وَقَالَ: «حَدِيثٌ حَسَنٌ صَحِيحٌ» وَقَُدْ رُوِيَ عَنْ نَافِعٍ، عَنْ أمِ سَلَمَةََ رضي الله عنها. وَعَنْهُ، عَنْ صَفِيّةَ، عَنْ أمِ سَلَمَةَ رضي الله عنها. وَعَنْهُ، عَنْ سُلَيْمَانَ، عَنْ أمِ سَلَمَةَ رضي الله عنها، وَاللَّهُ أعْلَمُ.", "w": ["قوله: (من جرَّ ثوبه خيلاء لم ينظر الله إليه يوم القيامة) هذا كناية عن إطالة الثوب وإسباله. والخيلاء: بضم الخاء المعجمة هي البطر والكبر والإعجاب. (لم ينظر الله إليه) أي: نظر رحمة ولطف وإحسان. وخُصَّ يوم القيامة، لأنه محل نظر الرحمة العظيمة المستمرة.", "قوله: (كيف يصنع النساء بذيولهن) الذيول: جمع ذيل، والمراد هنا طرف الثوب الذي يلي الأرض وإن لم يمسها، والمعنى: كيف تصنع النساء بذيول ثيابهن؟ هل يقصرنه مثل الرجال، أو يجوز لهن الإسبال؟", "قوله: (يرخينه شبرًا) بضم أوله من الإرخاء، وهو الإرسال؛ أي: يرسلن ذيولهن (شبرًا)؛ أي: مقدار شبر، والشبر: يختلف باختلاف اليد، وهو ما بين طرفي الخنصر والإبهام بالتفريج المعتاد. والمراد إرخاؤه عن المقدار الجائز للرجال، فيكون حساب الشبر من الكعبين.", "قوله: (إذن تنكشف أقدامهن) أي: أن إرخاء الثوب شبرًا لا يكفي؛ لأن القدم تظهر.", "قوله: (فيرخينه ذراعاً) أي: مقدار ذراع، والذراع: هو قياس الطول وتقديره، وهو من طرف المرفق إلى طرف الإصبع الوسطى من اليد."], "s": ["أ- في الحديث دليل على تحريم جرَّ الثوب وإطالته وإسباله مطلقاً، سواء أكان ذلك للخيلاء أم لا. ووجه الاستدلال: أن أم سلمة فهمت الزجر عن الإسبال مطلقاً، لذا سألت عن حكم النساء بقولها: (كيف يصنع النساء بذيولهن؟)، ولو فهمت أن التحريم مختص بالخيلاء لما سألت عن حكم النساء في جرِّ ذيولهن لستر أقدامهن.", "ب- فيه دليل على وجوب ستر المرأة قدمها، وأن هذا أمر معلوم عند نساء الصحابة، وأن الرِّجلين والساقين مما يُخفى؛ لأنه من العورة الواجب سترها.", "ج- استدلَّ بعض العلماء بهذا الحديث على وجوب تغطية المرأة وجهها؛ لأنه إذا كانت القدم يجب سترها مع أن الفتنة بها أقل من الفتنة بالوجه، فستر الوجه من باب أولى؛ لأن الشريعة لا يمكن أن توجب تغطية القدم ولا توجب تغطية الوجه؛ لأن في هذا إثبات حكم لشيء، ونفيه عما هو أولى منه، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف طريق معمر، عن أيوب، عن نافع، عن ابن عمر، قال: قال رسول الله ﷺ... وذكر الحديث. وهذا الحديث أصله في «الصحيحين» بدون هذه الزيادة: «فقالت أم سلمة...»، وهي زيادة اختلف فيها على نافع على الأوجه التي ذكرها المصنف.", "وهذه الزيادة لها شاهد، رواه أبو داود، وابن ماجه، وأحمد من طريق سفيان الثوري، أخبرني زيد العمي، عن أبي الصديق الناجي، عن ابن عمر، قال: رخص رسول الله ﷺ لأمهات المؤمنين في الذيل شبرًا، ثم استزدنه فزادهن شبرًا، فكن يرسلن إلينا فنذرع لهن ذراعاً، وهذا سند ضعيف؛ لضعف زيد العمي."]}, "6": {"m": "وَعَنْ أَبِي يَحْيَى القَتّاتِ، عَنْ مُجَاهِدٍ، عَنِ ابْنِ عَبّاسٍ رضي الله عنهما قَالَ: «مََرّرَسُولُ اللَّهِ صلى الله علَيه وسلم عَلَى رجَُلٍ وَفَخِذُهُ خَارِجَةٌ، فَقَالَ: غَطِ فَخِذَكَ؛ فَإِنّ فَخِذَ الرّجُلِ مِنْ عَوْرَِتهِ» رَوَاهُ أحْمَدُ - وَهَذَا لَفْظُهُ -، وَ أبُو يَعْلَى، وَالتِرْمِذِيُّ - وََلَفْظُهُ: أنّ النّبِيّ صلى الله عليه وسلم قَالَ: «الفَخِذُ عَوْرَةٌ»، وَقَالَ: «هَذَا حَدِيثٌ حَسَنٌ غَرِيبٌ». وَصَحّحَهُ الطّحَاوِيُّ. وَ أبُو يَحْيَى مُخْتَلَفٌ فِيهِ؛ وَثّقَهُ ابْنُ مَعِينٍ فِي رِوَ ايَةٍ، وَقَالَ النّسَائِيُّ: «لَيْسَ بِالقَوِي»ِ. وَقَالَ البُخَارِيُّ: «وَيُرَْوَى عَنِ ابْنِ عَبّاسٍ وَجَرْهَدٍ وَمُحَمّدِ بْنِ جَحْشِ رضي الله عنهم، عَنِ النّبِيَِ صلى الله عليه وسلم: (الفَخَِذُ عَوْرَةٌ). وَقَالَ أنَسٌ رضي الله عنه: حَسَرَالنّبِيُّ صلى الله عليه وسلم عَنْ فَخِذِهِ، وَحَدِيثُ أنَسٍ أسْنَدُ، وَحَدِيثُ جَرْهَدٍ أحْوَطُ؛ حَتّى يَخْرُجَ مِنِ اخْتِلافِهِمْ». وَقَدْ رُوِيَ حَدِيثُ ابْنِ عَبّاسٍ مِنْ وَجْهٍ آخَرَعَنْ طَاوُسٍ، عَنْهُ.", "s": ["أ- استدل بهذا الحديث من قال: إن الفخذ عورة، وهذا قول أكثر الفقهاء، فهو قول أبي حنيفة، ومالك، والشافعي، وأحمد في المشهور عنه، وهو قول سفيان الثوري، والأوزاعي. وذهب الحنابلة - في قول لهم - إلى أن الفخذ ليس بعورة؛ لأن عورة الرجل عندهم هي الفرجان، وهذا قول ابن حزم، ورواية عند المالكية.", "والأظهر ـ والله أعلم ـ أن الفخذ عورة ـ وإن كانت أسانيدها لا تخلو من مقال، لكن بعضها يقوي بعضاً وتصلح للاحتجاج بها؛ لأن عللها تدور بين الاضطراب، والجهالة، والضعف المحتمل، وقد علق بعضها البخاري، وصححها الحاكم.", "ثانيا: أن ما ورد من الأدلة التي تدل على أن الفخذ ليس بعورة ـ ومنها حديث أنس هذا ـ هي حكاية فعل لا تنهض على معارضة الأحاديث القولية المتقدمة الدالة على أن الفخذ عورة؛ لأنها تتضمن إعطاء حكم كلي، وإظهار شرع عام، فكان العمل بها أولى، ولعل هذا مراد البخاري بقوله: (حديث جرهد أحوط).", "ثالثا: أن الأدلة على أن الفخذ عورة قولية من جهة، وحاظر من جهة أخرى. وأدلة من قال: إنه ليس بعورة فعلية من جهة، ومبيحة من جهة أخرى. والقول مقدم على الفعل؛ لاحتمال الخصوصية وغيرها، مع أن بعضها لا يظهر فيه تعمد كشف الفخذ؛ كحديث أنس، والحاظر مقدم على المبيح(٤).", "وسلك آخرون من أهل العلم؛ كابن قتيبة، وابن القيم وغيرهما مسلك الجمع بين الأدلة، وهو أن السوءتين عورة مغلظة، والفخذين عورة مخففة، فالأمر بغض النظر عنهما لكونهما عورة، وجواز كشفهما لأنهما عورة مخففة، والله أعلم.", "ويعضد الترجيح أن ما استُدل به على أن الفخذ ليس بعورة ورد في قضايا معينة يتطرق إليها من الاحتمالات ما لا يتطرق إلى الأحاديث المستدل بها على أن الفخذ عورة.", "ولا ريب أن كشف أعلى الفخذين القريب من السوءتين ليس ككشف ما كان متصلاً بالركبة. ثم إن هذا الحكم متعلق بالرجل البالغ، أما الصغير الذي دون سبع سنين فلا حكم لعورته؛ لأن حكم الطفولة منجر عليه إلى سن التمييز، فإذا بلغ سبع سنين إلى العشر فعورته الفرجان فقط؛ لأنه دون البلوغ، لكن الأولى أن يستر ما يستره الرجل البالغ لا سيما في زماننا هذا؛ أمناً للفتنة، وخوفاً من الوقوع في المحظور، وتعويداً له على الستر والحياء، ويتأكد هذا أثناء اللعب؛ لأن الغالب ظهور الأفخاذ أو شيء منها.", "وما تقدم من الكلام في الفخذ إنما هو في حكم كشفها والنظر إليها، فأما صلاة بادي الفخذ فقد تقدم الكلام عليها."], "t": ["أخرجه من ذكرهم المصنف من طريق إسرائيل، عن أبي يحيى القتات، عن مجاهد، عن ابن عباس به، وقد صحح الحديث الطحاوي، فإنه لما ذكر الأحاديث الدالة على أن الفخذ ليس بعورة قال: (وقد جاءت عن رسول الله ﷺ آثار متواترة صحاح فيها أن الفخذ من العورة...)، وذكر منها هذا الحديث. وأبو يحيى القتات مختلف فيه، ولخص حاله الحافظ في «التقريب» فقال: لين الحديث. والذي يُفهم من كلام ابن رجب أنه تفرَّد بهذا الحديث، فإنه قال: (وقد قيل: إن حبيب بن أبي ثابت تابعه على هذا الحديث، ولا يصح ذلك). وقد أعلَّ الذهبي هذا الحديث بيحيى القتات وكذا أعله ابن حجر.", "وأما حديث جرهد فقد رواه الترمذي من طريق ابن عيينة، عن أبي النضر مولى عمر بن عبيد الله، عن زرعة بن مسلم بن جَرهَدٍ الأسلمي، عن جده جرهد، قال: مرَّ النبي ﷺ بجرهد في المسجد، وقد انكشف فخذه، فقال: «إن الفخذ عورة». قال الترمذي: (هذا حديث حسن، ما أرى إسناده بمتصل). قال ابن رجب: (يشير إلى أن زرعة لم يسمع من جده)، وضعفه البخاري في «التاريخ الكبير».", "وأما حديث محمد بن جحش، فقد رواه أحمد من طريق العلاء، عن أبي كثير مولى محمد بن جحش، عن محمد بن جحش ـ خَتَنِ النبي ﷺ ـ أن النبي ﷺ مرَّ على معمر بفناء المسجد محتبياً كاشفاً عن طرف فخذه، فقال له النبي ﷺ: «خمِّر فخذك يا معمر، فإن الفخذ عورة».وهذا الحديث في سنده أبو كثير مولى محمد بن جحش، روى عنه جماعة مشهورون، وقال ابن رجب: (أبو كثير هذا لا يعرف إلا في هذا الإسناد)، وقال الحافظ ابن حجر عن هذا الحديث: (رجاله رجال الصحيح، غير أبي كثير فقد روى عنه جماعة، لكن لم أجد فيه تصريحاً بتعديل)، والظاهر أنه لا ينزل عن رتبة صدوق، فقد ذكره ابن حبان في «الثقات»، وحسن حديثه الدارقطني، وصحح له الحاكم والبيهقي، ثم هو من كبار التابعين، ولم يأت بما ينكر عليه، لأن حديثه هذا له شواهد.", "وقوله: (وحديث أنس أسند)؛ أي: أصح إسناداً؛ لأنه متفق عليه.", "قوله: (وحديث جرهد أحوط)؛ وذلك لما في الأخذ به من الخروج من اختلاف العلماء، فيكون الأحوط في حق المكلف ألا يكشف فخذه، ولا ينظر إلى فخذ غيره، من باب ترجيح الدليل المفيد للحرمة على الدليل المفيد للإباحة."]}, "7": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «لَا يُصَلِي أَحَدُكُمْ فِي الثّوْبِ الوَاحِدِ لَيْسَ عَلَى عَاتِقِهِ مِنْهُ شَيْءٌ» رَوَاهُ البُخَارِيُّ، وَمُسْلِمٌ - وَعِنْدَهُ: «عَاتِقَيْهِ»، وَ «عَاتِقِهِ» أَيْضا -.", "r": 8}, "8": {"m": "وَعَنَْ جَابِرِبْنِ عَبْدِ اللَّهِ رضي الله عنهما قَالَ: «خَرَجْتُ مَعَ النّبِيِ صلى الله عليه وسلم فِي بَعْضِ أَسْفَارِهِ، فَجِئْتُ لَيْلَةا لِبَعْضَِ أمْرِي فَوَجَدْتُهُ يُصَلِي، وَعَلَيّ ثَوْبٌ وَاحِدٌ؛ فَاشْتَمَلْتُ بِهِ وََصَلّيْتُ إِلَى جَانِبِهِ. فَلَمّا انْصَرَفَ قَالَ: مَا السُّرى يَا جَابِرُ؟ فَأخْبَرُْتهُ بِحَاجَتِي. فَلَمّا فَرَغْتُ قَالَ: مَا هَذَا الَاشْتِمَالُ الّذِي رَأيْتُ؟ قُلْتُ: كَانَ ثَوْبٌ - يَعْنِي: ضَاقَ -. قَالَ: فَإِنْ كَانَ وَاسِعا فَالْتَحِفْ بِهِ، وَإِنْ كَانَ ضَيِقا فَاتّزِرْبِهِ» رَوَاهُ البُخَارِيُّ بِهَذَا اللّفْظِ. وَرَوَاهُ مُسْلِمٌ، وَلَفْظُهُ: «إِذَا كَانَ وَاسِعا فَخَالِفْ بَيْنَ طَرَفَيْهِ، وَإِنْ كَانَ ضَيِقا فَاشْدُدْهُ عَلَى حَقْوِكَ».", "w": ["قوله: (لا يصلي) قال ابن الأثير: كذا هو في «الصحيحين» بإثبات الياء، ووجهه أن «لا» نافية، وهو خبر عن الحكم الشرعي، أو خبر يراد به النهي، وذكر الحافظ بعد نقله هذا عن ابن الأثير، أنه ورد عند الدارقطني في «غرائب مالك» بلفظ: «لا يصل» بغير ياء، فتكون «لا» ناهية.", "قوله: (ليس على عاتقه منه شيء) العاتق: ما بين المنكب والعنق وهو موضع الرداء، يذكر ويؤنث، والجمع عواتق، والمنكب: مجتمع رأس العضد والكتف، وقوله: «شيء» نكرة في سياق النفي، فتعم كل شيء يستر العاتق.", "قوله: (إذا كان الثوب) الثوب: ما يلبس من إزار أو رداء أو غيرهما، فهو قطعة قماش لم تفصل على قدر البدن، وليس المراد به القميص؛ لأن القميص ثوب ذو أكمام، والقميص يقوم مقام ثوبين؛ لأنه يغطي أعلى البدن وأسفله.", "قوله: (فالتحف به) الالتحاف أن يتزر ويرتدي بثوب واحد، يخالف بين طرفيه، ولذا ساق الحافظ رواية مسلم: «فخالف بين طرفيه»، وكأنه أراد أن يبين أن معناهما واحد، وكيفية المخالفة بين طرفيه: أن يلقي طرفه الأيمن على عاتقه الأيسر، وطرفه الأيسر على عاتقه الأيمن، ليستر بذلك صدره، ويكون وسط الثوب على ظهره ليستر أعلى البدن.", "قوله: (وإن كان ضيقا فاتزر به) أي: وإن كان الثوب ضيقا لا يكفي للارتداء والاتزار، فاتزر به فقط، والاتزار: ستر أسفل البدن ما بين السرة والركبة؛ لأن القصد الأصلي ستر العورة، وهو يحصل بالاتزار."], "s": ["أ- الحديث دليل على أنه إن كان الثوب واسعاً فعلى المصلي أن يلتحف به، فيغطي به من المنكبين إلى ما تحت الركبتين؛ لأنه وجد سترة كاملة.", "أما إن كان الثوب ضيقاً لا يكفي ستر كل البدن فليستر به العورة الواجب سترها، وهي من السرة إلى الركبة، وهذا يدل على جواز الصلاة في الثوب الواحد. قال ابن رشد: (اتفقوا على أنه يجزئ الرجل من اللباس في الصلاة الثوب الواحد).", "ب- الحديث دليل على وجوب ستر العورة في الصلاة، فيستر ذلك بالإزار أو بالسراويل، لقوله: «وإن كان ضيقاً فاتزر به»، فإن كان عنده سعة فالمشروع أن يغطي عاتقيه، وقد اختلف العلماء في حكم ستر العاتقين أو أحدهما على قولين:", "فالقول الأول: وجوب ستر العاتقين في الصلاة إن كان قادراً، وهو قول الإمام أحمد وابن المنذر وجماعة من السلف، وهو ظاهر صنيع البخاري، وهو اختيار الشيخ عبد العزيز ابن باز.", "واستدلوا بحديث أبي هريرة هذا، ففيه نهي عن الصلاة في الثوب الواحد ليس على العاتق منه شيء، والنهي يقتضي تحريم الفعل وفساد الصلاة.", "وعن الإمام أحمد رواية أنه يجوز ترك ستر العاتق في النفل؛ لأن النفل مبناه على التخفيف، ولذا يسامح فيه بترك القيام والاستقبال في حال سيره، ولأن عادة الإنسان في بيته وخلواته قلة اللباس وتخفيفه، وغالب نفله يقع في بيته.", "والقول الثاني: لا يجب ستر العاتقين في الصلاة، بل هو مستحب، والواجب ستر العورة، وهذا قول مالك والشافعي وأصحاب الرأي، وعزاه النووي للجمهور، واستدلوا بالنص والقياس.", "أما النص فهو ما رواه محمد بن المنكدر، قال: (رأيت جابر بن عبد الله يصلي في ثوب واحد، وقال: رأيت النبي صلى الله عليه وسلم يصلي في ثوب). وما ورد عن أبي هريرة رضي الله عنه قال: قام رجل إلى النبي صلى الله عليه وسلم فسأله عن الصلاة في الثوب الواحد، فقال: «أو كلكم يجد ثوبين؟».", "قالوا: فجمعاً بين الأخبار تكون صلاته في الثوب الواحد لبيان الجواز، ونهيه عن الصلاة في الثوب الذي ليس على العاتق منه شيء لبيان الكمال والتمام.", "وأما القياس: فهو أن العاتقين ليسا بعورة، فأشبها بقية البدن.", "والقول بوجوب ستر العاتق أو بعضه في الصلاة إن تيسر قول قوي، فإن النهي الوارد فيه نهي تحريم، ولا يجوز صرفه إلا بصارف، وأما حمله على أنه نهي أدب وتنزيه، فهو صرف له عن ظاهره.", "والحق أن حديث جابر الذي معنا تجتمع به الأدلة وهو أن القادر على ستر العاتقين أو أحدهما يجب عليه ذلك، والعاجز يقتصر على ستر العورة، وأما حديث جابر فإما أن يكون قبل النهي، أو لعدم وجود ثوب ثان، مع أن هذا الجواب فيه نظر، والله أعلم، وأما القياس فهو في مقابلة نص.", "فإن قيل: إن المنكب ليس بعورة فكيف تقولون بستره؟", "فالجواب: ما قرره شيخ الإسلام ابن تيمية من أن العورة في الصلاة ليست مرتبطة بعورة النظر، لا طرداً ولا عكساً، فهذا نوع وهذا نوع، فإن أخذ الزينة في الصلاة إنما هو لحق الله تعالى، ولهذا لا يجوز أن يصلي عريانا ولو كان وحده، وزينة الصلاة غير الزينة خارج الصلاة، فقد يستر المصلي ما يجوز إبداؤه في غير الصلاة، فالمرأة تلبس الخمار على رأسها في الصلاة ولو كانت عند زوجها ومحارمها، ولا تختمر عندهم إذا كانت في غير الصلاة، وكذا المنكبين، فقد ثبت النهي عن ترك تغطيتهما في الصلاة، وذلك لحق الصلاة، مع أنه يجوز كشفهما للرجال خارج الصلاة، وعلى هذا فالأفضل للمسلم أن يأخذ بالأحوط، فيصلي في ثوبين، ويستر عاتقه أو بعضه متى كان قادرا على ذلك، لقوله: «ليس على عاتقيه منه شيء»، وهذا يقع على ما يعم المنكيبن وما لا يعمهما.", "وبهذا يتبين تقصير بعض الناس عندما يصلي في الصيف بالفنيلة ذات الحبل اليسير الذي يكون على الكتف، فمثل هذا لا تصح صلاته عند من يشترط ستر العاتق، وقد ذكر الفقهاء أنه لو طرح على كتفه حبلا أو خيطا ونحوه أنه لا يجزئه، وهذا ظاهر كلام الخرقي، وهو قول القاضي؛ لأن مثل هذا لا يسمى لباسا، ولعله محمول على القدرة.", "وكذا ما يفعله بعض المحرمين في الحج أو العمرة عندما يصلي وعاتقه مكشوف مع أنه بإمكانه أن يضع عليه الرداء.", "وينبغي للمصلي أن يأخذ زينته في الصلاة، فيصلي في القميص والسراويل ويغطي رأسه، أو يصلي في إزار ورداء وعمامة، لقوله تعالى: {يابني آدم خذوا زينتكم عند كل مسجد} [الأعراف: ٣١]، فعلق الأمر بالزينة لا بستر العورة، إيذانا بأن العبد ينبغي له أن يلبس في الصلاة أحسن ثيابه، للوقوف بين يدي الله تعالى. والله أعلم"]}, "9": {"m": "وَعَنْ أَبِي مَسْلَمَةَ سَعِيدِ بْنِ يَزِيدَ قَالَ: «قُلْتُ لأَِنَسِ بْنِ مَالِكٍ رضي الله عنه: أَكَانَ رَسُولُ اللَّهِ صلى الله عليه وسلم يُصَلِي فِي النّعْلَيْنِ؟ قَالَ: نَعَمْ» مُتّفَقٌ عَلَيْهِ.", "w": ["قوله: (في النعلين) مثنى نعل، وهو ما يُلبس في الرِّجل لتُتَّقى به الأرض."], "s": ["أ-الحديث دليل على جواز الصلاة في النعال، قال ابن رجب: الصلاة في النعال جائزة، لا اختلاف بين العلماء في ذلك.", "وقد اختلف العلماء في حكم الصلاة في النعال، هل هي من المباح أو من المستحب؟ فذهب جماعة من أهل العلم، ومنهم ابن دقيق العيد، إلى أن الصلاة في النعال من باب الرخص، لا من المستحبات؛ لأن ذلك لا يدخل في المعنى المطلوب من الصلاة، ولبس النعال في الصلاة وإن كان من ملابس الزينة، إلا أن ملامسة الأرض التي تكثر فيها النجاسات قد تقصر بها عن هذه الرتبة، وإذا تعارضت مصلحة التحسين، ومراعاة إزالة النجاسة، قُدِّمت الثانية؛ لأنها من باب دفع المفاسد، والأخرى من باب جلب المصالح. وقال آخرون، ومنهم الشوكاني: إن الصلاة في النعال من باب المستحبات؛ لأنه ورد الأمر في قوله ﷺ: «خالفوا اليهود، فإنهم لا يصلون في نعالهم ولا خفافهم».", "قال: وهذا الأمر مصروف عن الوجوب إلى الاستحباب بأدلة، منها حديث أبي هريرة عن رسول الله ﷺ قال: «إذا صلى أحدكم فخلع نعليه، فلا يؤذ بهما أحداً، ليجعلهما بين رجليه، أو ليصلِّ فيهما»، فخيَّر بين خلعهما والصلاة فيهما. والظاهر أنه لم يثبت في الأمر بالصلاة في النعال شيء، وإنما هي أحاديث من قبيل السُّنَّة الفعلية.", "وأما إذا كانت المساجد مفروشة ـ كما هي الآن ـ فإنه لا يُصلَّى بالنعال؛ لما يلي:", "أولَا: أن المساجد لا تسلم من تلويث فرشها؛ لأن الفرش سريعة التأثر باللون والرائحة.", "ثانيا: أن الغالب على الناس الغفلة عن العناية بنعالهم حين يدخلون المسجد، لا سيما إذا اعتادوا دخول المساجد بها، فإنه مع طول الزمن تضعف عنايتهم بها.", "ثالثا: أن الصلاة في النعال قد تؤدي إلى مفسدة الشقاق والنزاع؛ لأن كثيرًا من الناس يستقبح هذا الفعل. نعم لو كانت المساجد كما مضى مفروشة بالرمل، فإنَّ الاستحباب متجه، لكن يحص المسلم على تطبيق هذه السُّنَّة كلما ناسب الحال، كأن يكون في مسجد غير مفروش، أو في مصلى عيد مفروش برمل، أو في صحراء؛ لسفر، أو نزهة، أو نحو ذلك؛ من أجل تطبيق السُّنَّة، وإشاعتها بين الناس.", "ب- قال ابن بطال: «معنى هذا الحديث عند العلماء إذا لم يكن في النعلين نجاسة، فلا بأس بالصلاة فيهما، فإن كان فيهما نجاسة فليمسحهما وليصلِّ فيهما». والقول بأن طهارة النعل مسحها بالتراب، ودلكها بالأرض هو الأظهر في هذه المسألة، لا فرق في ذلك بين أنواع النجاسات، والله تعالى أعلم."]}, "10": {"m": "وَعَنْ أَنَسِ بْنِ مَالِكٍ رضي الله عنه: «أَنّ رَسُولَ اللَّهِ صلى الله عليه وسلم كَانَ يُصَلِي نَحْوَ بَيْتِ المَقْدِسِ، فَنَزََلتْ: {قَدْ نَرى تَقَلُّبَ وَجْهِكَ فِي السّمَاءِ فَلَنُوَلِيَنّكَ قِبْلَةا تَرَْضَاهَا فَوَلِ وَجْهَكَ شَطْرَ المَسْجِدِ الحَرَامِ}. فَمَرّ رجَُلٌ مِنْ بَنِي سَلِمَةَ وَهُمْ رُكُوعٌ فِي صَلاةِ الفَجْرِوَقَدْ صَلّوْا رَكْعَةا، فَنَادَى: ألَا إِنّ القِبْلَةَ قَدْ حُوِلَتْ! فَمَالُوا كَمَا هُمْ نَحْوَالقِبْلَةِ» رَوَاهُ مُسْلِمٌ.", "s": ["أ- الحديث دليل على جواز نسخ الأحكام، وأن الله تعالى يغير من أحكام شريعته ما شاء لحكمة تقتضي ذلك، وقد أجمع العلماء على أن شأن القبلة أول ما نُسخ من القرآن.", "ب- وجوب استقبال الكعبة في الصلاة في أي مكان كان المصلي؛ في البر، أو البحر، أو الجو، متى كان قادراً على ذلك، فمَن أمكنه مشاهدتها استقبل عينها، وإلا استقبل جهتها.", "الوجه الثامن: الحديث دليل على وجوب العمل بخبر الواحد في الأمور الدينية إذا كان ثقة، لا فرق في ذلك بين الأحكام والعقائد على القول الصحيح؛ لأن الصحابة تحوَّلوا من بيت المقدس إلى الكعبة بخبر الواحد، فصدقوا خبره وعملوا به.", "ج- الحديث دليل على أن من تبيَّنت له القبلة أثناء الصلاة استدار إليها، وبنى على ما مضى من صلاته، وهذا يدل على جواز الصلاة الواحدة إلى جهتين.", "د- جواز الحركة في الصلاة لمصلحتها، فإن كانت الحركة لا تصح الصلاة إلا بها فهي واجبة؛ كالاستدارة إلى القبلة، وإن كانت من كمال الصلاة فهي مستحبة؛ كالدنو لسد خلل الصف.", "ه- جواز الاجتهاد في زمن النبي ﷺ؛ لأن هؤلاء الصحابة بنوا على ما مضى من صلاتهم، ولم يستأنفوها مما يدل على أنه ترجح عندهم البناء على الاستئناف، وهذا اجتهاد.", "و- الحديث دليل على جواز تكليم من ليس في الصلاة لمن هو فيها، وأن استماع المصلي لكلام غيره ممن ليس في صلاة أنه لا يفسد الصلاة.", "ز- أن حكم الخطاب لا يتعلق بالمكلف قبل بلوغه إياه؛ لأن أهل هذا المسجد لم يؤمروا بالإعادة مع كون الأمر باستقبال الكعبة وقع قبل صلاتهم تلك بصلوات."]}, "11": {"m": "وَعَنْ عُثْمَانَ الأَخْنَسِيِ، عَنِ المَقْبُرِي،ِ عَنْ أَبِي هُرَْيرَةَ رضي الله عنه، عَنِ النّبِيِ صَلى الله عليه وسلم قَالَ: «مَا بَيْنَ المَشْرِقِ وَالمَغْرِبِ قِبْلَةٌ» رَوَاهُ التِرْمِذِيُّ - وَقَالَ: «هَذَا حَدِيثٌ حَسَنٌ صَحِيحٌ» -. وَتَكَلّمَ فِيهِ أحْمَدُ، وَقَوّاهُ البُخَارِيُّ.", "s": ["أ- الحديث دليل على التيسير في أمر القبلة وأن المقصود باستقبال القبلة استقبال الجهة عند البعد والغيبة عن الكعبة. وهذا الحديث ليس عاما في سائر البلاد، وإنما هو في حق أهل المدينة وما وافق قبلتها، كأهل الشام وما كان على سمتها، ولسائر البلدان من السعة في القبلة مثل ذلك بين الجنوب والشمال.", "وهذا الحديث كحديث أبي أيوب المتقدم في «الطهارة»: «لا تستقبلوا القبلة، ولا تستدبروها بغائط ولا بول، ولكن شرقوا أو غربوا» متفق عليه.", "والناس في توجههم إلى الكعبة كالدائرة حول المركز، فمن كان في جهة غرب الكعبة فقبلته إلى المشرق، ومن كان شرقها فقبلته إلى المغرب، ومن كان شمالها فقبلته إلى الجنوب، ومن كان جنوبها فقبلته إلى الشمال، ومن كان من الكعبة فيما بين المشرق والجنوب فإن قبلته فيما بين الشمال والمغرب، ومن كان من الكعبة فيما بين الجنوب والمغرب فإن قبلته فيما بين الشمال والشرق، ومن كان من الكعبة فيما بين المشرق والشمال فقبلته فيما بين الجنوب والمغرب، ومن كان من الكعبة فيما بين الشمال والمغرب فقبلته فيما بين الجنوب والمشرق.", "ب- الحديث دليل على أن الشريعة قد وسعت الأمر على العباد في أمر القبلة عند البعد، وأنه يكفي الظن متى اجتهد ونظر في العلامات التي ترشده إلى القبلة، كما تقدم.", "وهذا يؤيد عدم التكلف في تحديد جهة القبلة، وأن من صلى إلى الجهة صحت صلاته وإن انحرف عنها قليلا؛ لأن جهته التي صلى إليها هي القبلة؛ لأن فرض المصلي إذا كان بعيدا عن الكعبة أن يتوجه إلى جهتها، لا أن يصيب عينها على اليقين؛ لأن ذلك مستحيل أو متعذر.", "والقبلة تضيق كل الضيق لمن كان في المسجد الحرام فإنه لا بد أن يصيب عينها، وهي لأهل الحرم أوسع قليلا، ثم لأهل مكة أوسع قليلا، ثم لأهل الآفاق من السعة على حسب ما تقدم بيانه."], "t": ["فقد أخرجه الترمذي فقال: حدثنا الحسن بن أبي بكر المروزي، حدثنا المعلى بن منصور، حدثنا عبد الله بن جعفر المخرمي، عن عثمان بن محمد الأخنسي، عن سعيد المقبري، عن أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال:.. فذكره. قال الترمذي: (هذا حديث حسن صحيح)، وأخرجه الترمذي - أيضا - قال: حدثنا محمد بن أبي معشر، حدثنا أبي، عن محمد بن عمرو، عن أبي سلمة، عن أبي هريرة رضي الله عنه مرفوعا.", "وهذا إسناد ضعيف، فيه أبو معشر، تكلم فيه بعض أهل العلم من قبل حفظه - كما قاله الترمذي ـ ونقل عن البخاري أنه قال: (لا أروي عنه شيئا، وقد روى عنه الناس)، وأما ابنه محمد فهو صدوق كما في «التقريب» وهو من أقدم شيوخ الترمذي.", "وقول الحافظ ابن حجر عن حديث الباب: (وقواه البخاري)، يريد بذلك ما نقله الترمذي عن البخاري أنه قال: (حديث عبد الله بن جعفر المخرمي، عن عثمان بن محمد الأخنسي، عن سعيد المقبري، عن أبي هريرة أقوى من حديث أبي معشر وأصح)، وقد نقل ابن رجب عن الإمام أحمد تضعيف هذا الحديث، وأن في أسانيده ضعفاً.", "وهذا الإسناد رجاله ثقات، إلا شيخ الترمذي الحسن بن أبي بكر، قال عنه الحافظ في «التقريب»: (صدوق)، وقال عنه مسلمة بن قاسم في كتاب «الصلة»: (مجهول)، وهذا فيه نظر، إذ كيف يكون مجهولا من يروي عنه اثنان، وأحدهم الترمذي، كما في هذا الإسناد؟ فالصواب فيه ما قاله الحافظ، إلا إن كان مسلمة يعني جهالة الحال، إذ لا يعرف أحد تكلم في الحسن هذا بتعديل أو تجريح، وأما جهالة العين فهي مرتفعة برواية الترمذي."]}, "12": {"m": "وَعَنْ عَامِرِ بْنِ رَِبيعَةَ رضي الله عنهما قَْالَ: «رَأَيْتَُ النّبِيّ صلى الله عليه وسلم يُصَلِي عَلَى راحِلَتِهِ حَيْثُ تَوَجّهَتْ بِهِ» مُتّفَقٌ عَلَيْهِ. وَفِي رِوَ ايَةٍ لِلْبُخَارِي:ِ «يُومِئُ بِرَأسِهِ قِبَلَ أيِ وَجْهٍ تَوَجّهَ، وَلَمْ يَكُنْ رَسُولُ اللَّهِ صلى الله عليه وسلم يَصْنَعُ ذَلِكَ فِي الصّلاةِ المَكْتُوبَةِ».", "w": ["قوله: (يصلي على راحلته) المراد بالصلاة: النافلة في السفر، كما في رواية البخاري، وقد دلت رواية مسلم المذكورة على أنها صلاة الليل، والراحلة: المركب من الإبل ذكرا أو أنثى، تقول: رحلت الإبل رحلا: من باب (نفع): شددت عليه رحله، ورحل الشخص: مأواه في الحضر، ثم أطلق على أمتعة المسافر؛ لأن هناك مأواه.", "قوله: (حيث توجهت) أي: إلى أي جهة توجهت الدابة صلى، سواء أكان إلى القبلة أم إلى غيرها.", "قوله: (يومئ برأسه) أي: يشير به للركوع والسجود، وظاهره عدم التفريق بينهما في مقدار الإيماء، وسيأتي ذلك إن شاء الله."], "s": ["أ- الحديث دليل على مشروعية صلاة النافلة في السفر كركعتي الضحى، وصلاة الليل، وسنة الوضوء ونحو ذلك، أما السنن الرواتب وهي راتبة الظهر والمغرب والعشاء فالسنة تركها، إلا راتبة الفجر فإنها تصلى في السفر؛ لأن النبي صلى الله عليه وسلم كان لا يتركها حضرا ولا سفرا.", "ب- الحديث دليل على أن المتنفل بالصلاة في السفر على راحلته يستقبل جهة سيره، ولا يلزمه استقبال القبلة، وظاهر الحديث أنه لا فرق بين السفر الطويل والقصير، وهكذا لو أراد إنسان أن يتنفل وهو في السيارة أو في الطائرة أو في السفينة فإنه يسقط عنه الاستقبال، ويصلي إلى جهة سيره، لكن إن تمكن من الاستقبال وأداء الصلاة على الحال الذي تؤدى فيه في غير حال الركوب كما في السفن الحديثة أو الطائرات التي يوجد فيها سعة فإنه يلزمه.", "ج- الحديث دليل على أن المسافر المتنفل على راحلته يومئ في الركوع والسجود، وظاهر ذلك عدم الفرق بينهما في مقدار الإيماء، لكن جاء في حديث جابر رضي الله عنه قال: بعثني النبي صلى الله عليه وسلم في حاجة، فجئته وهو يصلي على راحلته نحو المشرق، والسجود أخفض من الركوع.", "وهو يدل على أن السجود أخفض من الركوع، ليكون البدل على وفق الأصل، وقد نص الفقهاء على ذلك.", "د- دل الحديث على أن الفريضة لا تصلى على الراحلة، بل لا بد أن ينزل على الأرض ويصليها، لقلتها بالنسبة إلى النافلة؛ ولأنها آكد - كما تقدم - وهكذا لو كان في السيارة، فإنه يقف ويصلي الفريضة.", "أما إذا كان الإنسان في الطائرة أو في السفينة، وليس فيهما مكان مخصص لأداء الصلاة وحضرت الصلاة والرحلة مستمرة، ويخشى فوات الوقت قبل نزول الطائرة أو وقوف السفينة، ولم تكن الصلاة مما يجمع مع غيرها، فإنه يصلي حسب استطاعته، فإن استطاع أن يقف ويركع ويسجد فعل ذلك، وإلا صلى قاعدا وأومأ بالركوع والسجود؛ لعموم قوله تعالى: {فاتقوا الله ما استطعتم} [التغابن: ١6] وذلك للإجماع على أنه يجب على المكلف أن يؤدي الصلاة في وقتها حسب الاستطاعة، ولا يؤخرها عنه إذا لم تكن مما يجمع، والله تعالى أعلم."]}, "13": {"m": "وَعَنْ زَيْدِ بْنِ أَرْقَمَ رضي الله عنه قَالَ: «إِنْ كُنّا لَنَتَكَلّمُ فِي الصّلاةِ عَلَى عَهْدِ النّبِيِ صلى الله عُليه وسلم؛ يُكَلِمُ أَحَدُنَا صَاحِبَهُ بِحَاجَتِهِ، حَتّى نَزََلتْ: {حَافِظُوا عَلَى الصّلَوَاتِ وَالصّلاةِ الوُسْطَى وَقُومُوا للَّهِِ قَانِتِينَ}؛ فَأمِرَْنا بِالسُّكُوتِ، وَنُهِينَا عَنِ الكَلامِ» مُتّفَقٌ عَلَيْهِ. وَلَيْسَ فِي البُخَارِي:ِ «وَنُهِينَا عَنِ الكَلامِ».", "w": ["قوله: (حتى نزلت …)، هذا ظاهر في أن نسخ الكلام في الصلاة وقع بهذه الآية، فيقتضي أن النسخ وقع بالمدينة؛ لأن الآية مدنية باتفاق.", "قوله: ({حافظوا على الصلوات والصلاة الوسطى}) أي: داوموا وواظبوا على الصلوات المفروضة مع الإتقان. و «الوسطى» أي: الفضلى، والمراد بها: صلاة العصر، على الراجح من أقوال أهل العلم.", "قوله: (قانتين) القنوت له معان كثيرة منها: القيام، وعليه قول النبي صلى الله عليه وسلم لما سئل: أي الصلاة أفضل؟ قال: «طول القنوت»، ومنها: الدعاء في الصلاة في محل مخصوص من القيام، وعليه قول أنس رضي الله عنه لما سئل: أقنت رسول الله صلى الله عليه وسلم في الصبح؟ قال: نعم، فقيل له: أو قنت قبل الركوع؟ قال: بعد الركوع يسيرا. ومنها: السكوت مع التعظيم، كما هنا.", "قوله: (فأمرنا بالسكوت) أي: أمرنا الله تعالى بقوله: {وقوموا لل قانتين} [البقرة: ٢٣8] أو أمرنا الرسول صلى الله عليه وسلم تفسيرا للآية، ويؤيده قوله: (نهينا).", "والمراد بالسكوت: الكف عن الكلام، أي: كلام الناس لا كل كلام؛ لأن الصلاة فيها قراءة وتكبير وتسبيح ودعاء، وهذا كلام."], "s": ["الحديث دليل على تحريم الكلام في الصلاة فرضاً كانت أو نفلاً، قليلا كان الكلام أو كثيرا، وأن الكلام مبطل لها لتحريمه ومنافاته لمقصودها، فإن الصلاة صلة بين العبد وربه، فلا ينبغي أن يتشاغل المصلي بغير مناجاة الله تعالى والذل بين يديه. قال ابن المنذر: (أجمع أهل العلم على أن من تكلم في صلاته عامدا لكلامه، وهو لا يريد إصلاح شيء من أمرها أن صلاته فاسدة).", "وعلى هذا فلا خلاف بين أهل العلم في أن من تعمد الكلام في الصلاة لغير مصلحتها وهو عالم بالتحريم أن صلاته باطلة. وإنما وقع الخلاف فيمن تكلم ناسياً أنه في صلاة، أو يظن أن صلاته تمت، أو تكلم لمصلحتها، ففي ذلك قولَان:", "الأول: أن صلاته باطلة، إلا أنهم يفرقون فيما كان لمصلحة الصلاة بين اليسير فلا تبطل والكثير فتبطل، وهذا هو المشهور من مذهب الإمام أحمد، أخذا بعموم (ونهينا عن الكلام) لأن المصلي قد فعل ما ينافي الصلاة، فتبطل لأنه ليس من جنس ما هو مشروع في الصلاة.", "الثاني: أن صلاته صحيحة، وهذا قول مالك، والشافعي، ورواية عن الإمام أحمد، اختارها شيخ الإسلام ابن تيمية، وجماعة من المحققين؛ لما يلي:", "١ - قصة ذي اليدين، وهي مذكورة في أحاديث «سجود السهو».", "٢ - قصة معاوية بن الحكم.", "٣ - قوله تعالى: {ربنا لا تؤاخذنا إن نسينا أو أخطأنا}، وقد ثبت في الصحيح أن الله تعالى قال إجابة لهذا الدعاء: «قد فعلت»، وفي رواية: قال: «نعم».", "٤ - عموم حديث ابن عباس: «إن الله تجاوز لي عن أمتي الخطأ والنسيان وما استكرهوا عليه»، والله تعالى أعلم."]}, "14": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «التّسْبِيحُ لِلرِجَالِ، وَالتّصْفِيقُ لِلنِسَاءِ فِي الصّلاةِ. قَالَ ابْنُ شِهَابٍ: وَقَدْ رَأَيْتُ رِجَالَا مِنْ أَهْلِ العِلْمِ يُسَبِحُونَ وَيُشِيرُونَ» مُتّفَقٌ عَلَيْهِ. وَلَمْ يَقُلِ البُخَارِيُّ: «فِي الصّلاةِ»، وََلَا ذَكَرَقَوْلَ ابْنِ شِهَابٍ.", "s": ["أ- الحديث دليل على أن الرجل إذا نابه شيء وهو يصلي كتنبيه إمام، أو تنبيه مار، أو من يريد منه أمرا وهو لا يدري أنه يصلي فإنه يسبح، فيقول: سبحان الله، وأن المرأة إذا نابها شيء وهي تصلي فإنها تصفق، وهذا من فضل الله تعالى على عباده، فإنه لما نسخ الله الكلام في الصلاة أبقى ما ينتفع به ويحصل به المقصود كالتسبيح، وقد ورد في حديث سهل بن سعد رضي الله عنه أن النبي صلى الله عليه وسلم قال: «إذا نابكم شيء في الصلاة فليسبح الرجال ولتصفق النساء»، وفي لفظ: «من نابه شيء في صلاته فليقل: سبحان الله، فإنه لا يسمعه أحد حين يقول: سبحان الله إلا التفت»، وفي رواية: «إنما التصفيق للنساء»، وهذا أسلوب من أساليب القصر.", "وصفته: إما أن تضرب ببطن كفها على ظهر الأخرى، أو تضرب بظهر كفها على بطن الأخرى، أو ببطن كفها على بطن الأخرى، كما هو المعروف عند النساء الآن، والأمر في ذلك واسع؛ لأن الشرع لم يحدد صفة معينة.", "وإذا انتبه المنبه بالتسبيح مرة واحدة لم يعده المصلي مرة أخرى؛ لأنه ذكر مشروع لسبب، فيزول بزوال س
