الله تعالى؛ لثبوت السُّنَّة فيهما، لكن قوله بعد الأذان أحسن، ليبقى نظام الأذان على وضعه). وقد يكون ما ورد عن ابن عباس اجتهاداً منه. والأظهر - والله أعلم - أن الأمر واسع، سواء قالها في أثناء الأذان أو بعد الفراغ منه، فكلاهما جائز، والله تعالى أعلم."]}, "120": {"m": "وَعَنْ أَنَسٍ رضي الله عنه: «أَنّهُ سُئِلَ عَنِ الثُّومِ؟ فَقَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: مَنْ أَكَلَ مِنْ هَذِهِ الشّجَرَةِ؛ فَلا يَقْرَْبنَا، وََلَا يُصَلِي مَعَنَا» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ.", "w": ["قوله: (عن الثوم) بضم الثاء المثلثة، على حذف مضاف؛ أي: عن حكم أكل الثوم.", "قوله: (من أكل من هذه الشجرة) فيه إطلاق الشجرة على الثوم، وهو مجاز؛ لأن المعروف في اللغة أن الشجرة ما كان لها ساق تحمل أغصانها، وما لا ساق له يقال له: نجم، وبهذا فسر ابن عباس وغيره قوله تعالى: ﴿وَالنَّجمُ وَالشَّجَرُ يَسجُدَانِ﴾ [الرحمن: 6] وهذا على أحد القولين."], "s": ["أ- الحديث دليل على أن من أكل ثوماً، ومثله البصل والكراث، أنه منهي عن القرب من المسلمين، وعن الصلاة معهم في المساجد، وهذا الحكم عام في جميع المساجد، على القول الراجح من قولي أهل العلم، والقول بالكراهة هو مذهب الجمهور، وهو أن النهي الوارد في السُّنَّة للتنزيه، أما الظاهرية فقد حملوه على التحريم، وهو رواية عن الإمام أحمد. ومن الأدلة: حديث جابر أن النبي ﷺ قال: «من أكل ثوماً أو بصلاً فليعتزلنا، أو ليعتزل مسجدنا، وليقعد في بيته»، فهذا فيه نهي من أكل الثوم والبصل عن قرب المسجد والصلاة فيه، أو الاعتكاف، لا لأن صلاة الجماعة غير واجبة، ولا لأنه معذور، بل دفعاً لأذيته، قال الخطابي: (إنما أمره باعتزال المسجد عقوبة له، وليس هذا من باب الأعذار التي تبيح للمرء التخلف عن الجماعة، كالمطر والريح العاصف، ونحوهما من الأعذار)، والعلة في ذلك منصوصة، وهي إيذاؤه الملائكة الذين في المسجد، وهم يتأذون كما يتأذى بنو آدم، كما في حديث جابر عن النبي ﷺ قال: «من أكل البصل والثوم والكراث، فلا يقربن مسجدنا، فإن الملائكة تتأذى مما يتأذى منه بنو آدم»، بل لو دخل آكل الثوم ونحوه إلى المسجد، فإنه يُخرج منه؛ لفعل النبي ﷺ كما في حديث عمر، وفيه: (لقد رأيت رسول الله ﷺ إذا وجد ريحها من الرجل في المسجد أمر به فأُخرج إلى البقيع...)، وهذا خاص بالنبي.", "أما المطبوخ الذي ذهبت رائحته فلا مانع منه، فإن كان له رائحة بقي الحكم؛ لأن الحكم إذا لم يكن له إلا علة واحدة دار معها الحكم، فمتى وجدت الأذية ترتب الحكم. والنهي في حديث جابر المتقدم - معلل بعلتين: أذية الملائكة، وأذية بني آدم، والظاهر أن الحكم يثبت بكل علة منهما، وعلى هذا فيختص النهي بالمساجد وما في معناها، فلا يجوز دخول المسجد بهذه الروائح وإن كان خالياً؛ لأنه محل الملائكة. وإذا أكل جماعة مسجد مع إمامهم ما له رائحة كريهة تناولهم الحكم، خلافاً لمن قال: لا كراهة في ذلك، وكذا لو تناولها إنسان ودخل المسجد ولو لغير الصلاة، تناوله الحكم ولو كان وحده؛ لحصول أذية الملائكة، ومن باب أولى لو أكل بعض الجماعة دون بعض؛ لوجود الأذيتين، وهو نص الحديث. فإن كانوا في غير مسجد - كالصحراء مثلاً - فأكلوا كلهم، لم يتناولهم الحكم، ويصلون جميعاً؛ لعدم أذية الملائكة ولا أذية الآدميين، ولو أكل بعضهم دون بعض، فإن لم يحصل أذية صلوا جميعاً، وإلا فلا؛ لوجود أذية الآدميين، وقد جاء في حديث أبي سعيد الخدري، أن رسول الله ﷺ مرَّ على زراعة بصل هو وأصحابه، فنزل ناس منهم، فأكلوا منه، ولم يأكل آخرون، فرُحنَا إليه، فدعا الذين لم يأكلوا البصل، وأخر الآخرين حتى ذهب ريحها. وقد ذكر الإمام مسلم هذا الحديث مع الأحاديث الدالة على نهي من أكل ثوماً أو بصلاً عن حضور المساجد. ومن أكل شيئاً مما له رائحة كريهة - كالثوم مثلاً - وكان معذورًا - لمرض ونحوه - سَلِمَ من إثم تخلفه عن الجماعة، وقد يكتب له أجرها، إذا كان من عادته المحافظة عليها، وإن لم يكن معذورًا، فإن أكلها تحيلاً على إسقاط الجماعة عنه، حرم أكلها، وأثم بترك صلاة الجماعة؛ لأن المباح إذا كان وسيلة، فإنه يأخذ حكم ما كان وسيلة إليه، وإن أكلها شهوة وتلذذاً، فليس بحرام أكلها، لكنه لا يحضر الجماعة؛ لما تقدم. وقد ألحق الفقهاء بالمنصوص عليه ما له رائحة كريهة، كالفجل، ومن به بَخَر ونحوه، وكذا من عليه ثياب منتنة، ومن باب أولى شارب الدخان إذا كان فيه رائحة تؤذي الناس، فإن شاربه داخل تحت عموم النهي وعلَّتِهِ؛ لوجود أذية المسلمين، إضافة إلى أن شاربه قد تعاطى أمرًا محرماً، مصرًا عليه.", "ب- ليس في هذا الحديث تقييد النهي بالمسجد، كما في الأحاديث الأخرى، فيستفاد من عمومه نهي من أكل الثوم ونحوه عن حضور مجمع المصلين وإن كانوا في غير مسجد، كما يؤخذ منه النهي عن حضور المجامع العامة، كمجالس العلم، والولائم، والاجتماعات، وما أشبه ذلك.", "ج- الحديث دليل على أن درء المفاسد مقدم على جلب المصالح، وأن المصالح العامة أولى بالمراعاة من المصالح الخاصة، فدرء هذه الأذية العامة أولى من مراعاة المصلحة الخاصة بهذا الرجل بحضوره المسجد؛ لأنه هو السبب في تفويتها، والله تعالى أعلم."]}, "121": {"m": "وَعَنْ يَزِيدَ بْنِ الأَسْوَدِ رضي الله عنه: «أَنّهُ صَلّى مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم صَلاةَ الصُّبْحِ وَهُوَ غُلامٌ شَابٌّ، فَلَمّا صَلّى رَسُولُ اللَّهِ صلى الله عليه وسلم إِذَا هُوَ بِرَجُلَيْنِ لَمْ يُصَلِيَا، فَدَعَا بِهِمَا، فَجِيءَ بِهِمَا تُرْعَدَُ فَرَ ائِصُهُمَا، فَقَالَ لَهُمَا: مَا مَنَعَكُمَا أَنْ تُصَلِيَا مَعَنَا؟ قَالَا: قََدْ صَلّيْنَا فِي رِحَالِنَا. قَالَ: فَلا تَفْعَلا؛ إِذَا صَلّيْتُمْ فِي رِحَالِكُمْ ثُمّ أدْرَكْتُمُ الإِمَامَ وَلَمْ يُصَلِ فَصَلِيَا مَعَهُ؛ فَإِنّهُ لَكُمْ نَافِلَةٌ» رَوَاهُ أحْمَدُ - وَهَذَا لَفْظُهُ -، وَ أَبُو دَاوُدَ، وَالنّسَائِيُّ، وَالتِرْمِذِيُّ - وَصَحّحَهُ -.", "w": ["قوله: (ترعد فرائصهما) بضم أوله وفتح ثالثه، مبنيا لما لم يسم فاعله، على ما ذكره السندي وغيره، وضبطه آخرون بفتح التاء من باب «قتل»، أي: ترجف وتضطرب من الخوف، والفرائص: بالصاد المهملة، جمع فريصة، وهي اللحمة التي بين الجنب والكتف، تهتز عند الفزع والخوف، والكلام كناية عن الفزع.", "قوله: (صلينا في رحالنا) لأن ذلك كان بمنى، وفيها يتفرق الناس، ولذا لم ينكر عليهما الرسول صلى الله عليه وسلم صلاتهما في رحالهما."], "s": ["أ- الحديث دليل على أن من دخل مسجدا فوجدهم يصلون، وهو قد صلى، أنه يشرع له أن يصلي معهم، إدراكاً لفضل الجماعة، وتكون هذه الصلاة له نافلة، وظاهر الأمر في قوله: «فصليا» أنه أمر إيجاب، وهو رواية عن الإمام أحمد، وقد أجمع العلماء على استحباب الإعادة، وإنما الخلاف بينهم في الوجوب، ومنهم من يفرق بين من صلى منفردا فالإعادة في حقه واجبة، وبين من صلى في جماعة ثم أدرك أخرى فتستحب، والأحوط للمكلف أن يمتثل ما أمره به الرسول صلى الله عليه وسلم، فيصلي إذا دخل مسجدا والناس يصلون.", "وهذه الإعادة سببها حضور الجماعة، ولا فرق بين أن يصلي الأولى وحده، أو يصلي مع جماعة، لعموم الحديث، ولتحصيل الأجر إذا صلى مرة أخرى، ولئلا يكون حضوره والناس يصلون ذريعة إلى إساءة الظن به، والوقوع في عرضه، ولئلا يتعلق بذلك من يتكاسل، ويقول: صليت، وهو لم يصل، مع ما في ذلك من مراعاة فضل الإلفة، ولزوم الجماعات، وترك الخلاف، وافتراق الكلمة.", "ب- ظاهر الحديث دليل على أن الإعادة جائزة في جميع الصلوات كالصبح والعصر، ولو كان الوقت بعدهما وقت نهي؛ لأن الصلاة المعادة من ذوات الأسباب، ولأن النبي صلى الله عليه وسلم أطلق الأمر بإعادة الصلاة ولم يفرق بين صلاة وصلاة، وقد أمر الرجلين بإعادة الصبح مع الجماعة مع أنه وقت نهي بالنسبة لهما، ونسب ابن تيمية هذا القول إلى الجمهور.", "ج- دل الحديث بعمومه على أنه لا فرق في إعادة الصلاة بين المغرب وغيرها، وهذا قول الجمهور، ومنهم أكثر الصحابة والتابعين، وهو مذهب الشافعي وأحمد وإسحاق وداود ومالك في رواية عنه، خلافا لمن منع إعادة المغرب، لئلا تصير شفعا: لأنها وتر النهار، فلو أعادها صارت شفعا، فبطل كونها وترا، وهذا قول ابن عمر وابن مسعود وبعض التابعين وأبي حنيفة ومالك ورواية عن أحمد.", "والصواب الأول؛ لأن الرسول صلى الله عليه وسلم لم يستثن صلاة من صلاة، ولأنها لا تصير شفعا وقد فصل بين الصلاتين بالسلام والمشي وغير ذلك، قال ابن رشد: (والتمسك بالعموم أقوى).", "ثم إن المشهور من مذهب الحنابلة أنه إذا أعاد المغرب شفعها برابعة؛ لأن هذه الصلاة نافلة، ولا يشرع التنفل بوتر غير الوتر، فكان زيادة ركعة أولى من نقصانها، لئلا يفارق إمامه قبل إتمام صلاته.", "والقول الثاني: أنها تعاد على صفتها ولا تشفع بركعة، وهو قول الشافعي؛ لأن الرسول صلى الله عليه وسلم أمر بالإعادة أمرًا عاما ولم يستثن صلاة من صلاة، فدل على أن المغرب تعاد على صفتها، والله أعلم.", "د- دل قوله: «ثم أتيتما مسجد جماعة» على أن الإعادة مختصة بالجماعة التي تقام في المسجد، لا التي قد تقام في غيره، فمن حضر جماعة يصلون في منزل أو مستراحا ونحوهما لعذر وكان هو قد صلى فلا يصل معهم، ويحمل المطلق الوارد في بعض الروايات على هذا المقيد، والله تعالى أعلم."], "t": ["أخرجه من ذكرهم المصنف من طريق يعلى بن عطاء، عن جابر بن يزيد بن الأسود، عن أبيه، به مرفوعا. وقد رواه عن يعلى ما يزيد عن عشرة من الحفاظ، منهم: شعبة، وسفيان، والثوري، وهشام بن حسان، وأبو عوانة، وآخرون. وقال الترمذي: (حديث حسن صحيح)، وصححه - أيضا - ابن خزيمة، وابن حبان، والحاكم."]}, "122": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي اللهَ عنه قَالَ: «أَتَى النّبِيّ صلى الله عَليه وسلم رجَُلٌ أَعْمَى، فَقَالَ: يَا رَسُولَ اللَّهِ! لَيْسَ لِي قَائِدٌ يَقُودُنِي إِلَى المَسْجِدِ، فَسَألَ رَسُولَ اللَّهِ صلى الله عليَه وسلم أنْ يُرَخِصَ لَهُ فَيُصَلِيَ فِي بَيْتِهِ، فَرَخّصَ لَهُ. فَلَمّا وَلّى دَعَاهُ فَقَالَ: هَلْ تَسْمَعُ النِدَاءَ بِالصّلاةِ؟ قَالَ: نَعَمْ، قَالَ: فَأجِبْ» رَوَاهُ مُسْلِمٌ.", "s": ["أ- الحديث دليل صريح على وجوب الصلاة جماعة في المسجد؛ لأن النبي صلى الله عليه وسلم لم يجد رخصة لرجل أعمى بعيد الدار ليس له قائد يأتي به إلى المسجد، وقال له: «أجب»، فكيف حال من كان بصيرًا قريب الدار يستطيع الحضور؟! قال الخطابي: (وفي هذا دليل على أن حضور الجماعة واجب، ولو كان ذلك ندباً لكان أولى من يسعه التخلف عنها أهل الضرر والضعف، ومن كان في مثل حال ابن أم مكتوم رضي الله عنه).", "والجمهور على أن العمى ليس عذراً في التخلف عن الجماعة إذا وجد قائداً ولو بأجرة لا تجحف به، وقال أبو حنيفة: إنه عذر ولو وجد من يقوده أو يحمله، لأنه لا عبرة بقدرة الغير.", "ب- الحديث دليل على أن من سمع النداء بالأذان للصلاة فعليه الإجابة، ولو كان منزله بعيداً، لقوله في رواية أبي داود: (شاسع الدار) ومع هذا قال له النبي صلى الله عليه وسلم: «أجب».", "وأما من كان قريباً من المسجد فإنه تجب عليه الإجابة مطلقاً سمع النداء أم لا؛ لأنه في مكان يسمع فيه النداء، لكن الحديث ورد فيمن كان بعيداً عن المسجد، فلذا قيد بسماع النداء.", "والمرجع في سماع النداء إلى ما كان معروفاً في عهد النبي صلى الله عليه وسلم وعند الناس إلى زمن قريب، قبل مكبرات الصوت، وأما مكبرات الصوت فلا يترتب عليها حكم الإجابة؛ لأنها لا تنضبط، فقد يكون صوتها عاليا يسمع من أماكن بعيدة، وقد يكون دون ذلك، ولو ربط الحكم بمكبر الصوت لصار في ذلك مشقة؛ لأنه قد يسمع من مكان بعيد يشق الوصول إليه، والله تعالى أعلم."]}, "123": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «إِنّمَا جُعِلَ الإِمَامُ لِيُؤْتَمّ بِهِ، فَإِذَا كَبّرَ فَكَبِرُوا؛ وََلَا تُكَبِرُوا حَتّى يُكَبِرَ. وَإِذَا رَكَعَ فَارْكَعُوا؛ وََلَا تَرْكَعُوا حَتّى يَرْكَعَ. وَإِذَا قَالَ: سَمِعَ اللَّهُ لمَِنْ حَمِدَهُ؛ فَقُولُوا: رَبّنَا لَكَ الحَمْدُ. وَإِذَا سََجَدَ فَاسْجَُدُوا؛ وََلَا تَسْجُدُوا حَتّى يَسْجُدَ. وَإِذَا صَلّى قَائِما فَصَلُّوا قِيَاما، وَإِذَا صَلّى قَاعِدا فَصَلُّوا قُعُودا أجْمَعِينَ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ - وَهَذَا لَفْظُهُ -.", "w": ["قوله: (إنما جعل الإمام) أي: جعله الله تعالى، وإنما: أداة قصر، تثبت الحكم للمذكور وتنفيه عما عداه، أي: قصر وظيفة الإمام على الائتمام به في كل شيء في الأفعال والنية، وسيأتي بيان ذلك.", "قوله: (ليؤتم به) أي: ليقتدى به ويتابع، فلا يسبقه المأموم ولا يقارنه، ويؤيد ذلك رواية البخاري: «فلا تختلفوا عليه»، أي: تخالفوه بالخروج عن الائتمام به، واللام للتعليل.", "قوله: (فصلوا قعودا أجمعين) هكذا بالنصب، والذي في «سنن أبي داود»: «أجمعون» بالرفع، ولكل وجه؛ فالنصب على الحال من ضمير (فصلوا)، والتقدير: فصلوا قاعدين مجتمعين، وأما بالرفع فهو تأكيد لضمير (صلوا)، وفائدة هذا التأكيد بيان أنه لا يكفي جلوس البعض عن الباقين."], "s": ["أ- الحديث دليل على أن الحكمة من جعل الإمام إماماً هي الاقتداء به ومتابعته، وبناء على ذلك فإن المأموم منهي عن الاختلاف عليه، ويكون ذلك بواحد من أمور ثلاثة، وهي:", "مسابقته، أو موافقته، أو التأخر عنه. وتقدم بيان حكمها وما يترتب عليها.", "ب- اختلف العلماء في تفسيرمعنى الَاقتداء على قولين:", "الأول: أن المراد به الاقتداء به في الأفعال الظاهرة لا في النيات، وهذا قول الشافعي، ورواية عن أحمد، وهو قول الظاهرية، واستدلوا بسياق الحديث، ووجود مسائل دلت عليها النصوص اختلفت فيها نية الإمام عن المأموم، قالوا: إنما أمرنا أن نأتم بالإمام فيما يظهر لنا من أفعاله، فأما النية فمغيبة عنا، ومحال أن نؤمر باتباعه فيما يخفى من أفعاله علينا.", "الثاني: أن المراد به الاقتداء به في الأفعال الظاهرة وفي النيات، وهذا قول مالك، وأبي حنيفة، والمشهور من مذهب أحمد، قالوا: من خالفت نيته نية الإمام فإنه لم يأتم به، إذ لا اختلاف أشد من اختلاف النيات التي عليها مدار الأعمال، وقد ترتب على هذا الخلاف مسائل كثيرة مذكور بعضها في هذا الباب.", "ج- الحديث دليل على أن كمال الائتمام مبادرة المأموم بمتابعة إمامه بلا فاصل ولا تأخر؛ لأن الفاء توجب التعقيب والاستعجال، وقد بين البراء بن عازب رضي الله عنه حسن متابعة الصحابة رضي الله عنهم للنبي صلى الله عليه وسلم في صلاته وأنهم لا ينتقلون عن الركن حتى يصل النبي صلى الله عليه وسلم إلى الذي يليه، فقال: (كنا نصلي خلف النبي صلى الله عليه وسلم فإذا قال: «سمع الله لمن حمده»، لم يحن أحد منا ظهره حتى يضع النبي صلى الله عليه وسلم جبهته على الأرض)، وإذا كان هذا شأنهم في السجود الذي يكون الناس فيه أشد مسابقة من غيره فهم في غيره من الأركان أبلغ وأولى.", "د- الحديث دليل على أن المأموم يقتصر على قوله: «ربنا ولك الحمد» في الرفع من الركوع، دون قوله: «سمع الله لمن حمده» وأما الإمام - ومثله المنفرد - فإنه يجمع بين التسميع والتحميد، لحديث أبي هريرة رضي الله عنه كان النبي صلى الله عليه وسلم إذا قال: «سمع الله لمن حمده» قال: «اللهم ربنا ولك الحمد».", "ه- الحديث دليل على أن المأموم يصلي جالساً إذا صلى إمامه جالساً، ويصلي قائماً إذا صلى إمامه قائماً، وسيأتي - إن شاء الله تعالى - تفصيل القول في هذه المسألة، والله تعالى أعلم."], "t": ["أخرجه أحمد وأبو داود من طريق مصعب بن محمد، عن أبي صالح، عن أبي هريرة رضي الله عنه، به مرفوعا. والحديث أصله في «الصحيحين»، ولعل المصنف اختار لفظ أبي داود مع أن أصل الحديث في «الصحيحين» لأمرين:", "الأول: أن سياقه أشمل وأتم.", "الثاني: أن لفظ النهي الوارد في سياق أبي داود: «ولا تكبروا … ولا تركعوا …» إلخ، لم يرد في «الصحيحين»."]}, "124": {"m": "وَعَنِ البَرَاءِ رضي الله عنه: «أَنّهُمْ كَانُوا يُصَلُّونَ مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم؛ فَإِذَا رَكَعَ رَكَعُوا، وَإِذَا رَفَعَ رأَْسَهُ مِنَ الرُّكُوعِ فَقَالَ: سَمِعَ اللَّهُ لمَِنْ حَمِدَهُ؛ لَمْ نَزلَْ قِيَاما حَتّى نَرَاهُ قَدْ وَضَعَ وَجْهَهُ بِالأَرْضِ، ثُمّ نَتّبِعُهُ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ.", "s": ["أ- الحديث دليل على حسن متابعة الصحابة للنبي ﷺ في الصلاة خلفه؛ لأنهم لا ينتقلون عن الركن حتى يَصِلَ النبي ﷺ إلى الذي يليه، وهذا يدل على حرصهم على تطبيق السُّنَّة وامتثال أمر النبي ﷺ عندما قال: «لا تسبقوني بالركوع، ولا بالسجود، ولا بالقيام، ولا بالانصراف». قال النووي: (السُّنَّة ألا ينحني المأموم للسجود حتى يضع الإمام جبهته على الأرض، إلا أن يعلم من حال إمامه أنه لو أخَّر إلى هذا الحد لرفع الإمام رأسه من السجود قبل سجوده).", "ب- الحديث دليل على أن المأموم يتابع الإمام، وتكون أفعاله بعد أفعال الإمام، بحيث لا ينتقل من الركن حتى يصل إمامه إلى الذي يليه.", "ج- جواز النظر إلى الإمام لاتباعه في انتقالاته، وهذا إنما يكون في حق من هم خلف الإمام مباشرة. والله تعالى أعلم."]}, "125": {"m": "وَعَنْ زَيْدِ بْنِ ثَابِتٍ رضي الله عنه قَالَ: «احْتَجَرَرَسُولُ اللَّهِ صلى الله عليه وسلم حُجَيْرَةا بِخَصَفَةٍ أَوْ حَصِيرٍ، فَخَرَجَ رَسَُولُ اللَّهِ صلى الله عليه وسلم يُصَلِي فِيهَا، قَالَ: فَتَتَبّعَ إِلَيْهِ رِجَالٌ وَجَاؤُوا يُصََلُّونَ بِصَلاتِهِ. قَالَ: ثُمّ جَاؤُوا لَيْلَةا فَحَضَرُوا، وَ أبْطَأَ رَسُولُ اللَّهِ صلى الله عليه وسلم عَنْهُمْ. قَالَ: فَلَمْ يَخْرُجْ إِلَيْهِمْ، فَرَفَعُوا أصْوََاتَهُمْ وَحَصَبُوا البَابَ. فَخَرَجَ إِلَيْهِمْ رَسُولُ اللَّهِ صلى الله عليه وسلم مُغْضَبا، فَقَالَ لَهُمْ: «مَا زالَ بِكُمْ صَنِيعُكُمْ حَتّى ظَنَنْتُ أنّهُ سَيُكْتَبُ عَلَيْكُمْ، فَعَلَيْكُمْ بِالصّلاةِ فِي بُيُوتِكُمْ؛ فَإِنّ خَيْرَصَلاةِ المَرْءِ فِي بَيْتِهِ إِلَاّ الصّلاةَ المَكْتُوبَةَ» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ.", "w": ["قوله: (احتجر حجيرة بخصفة …) أي: اتخذ وحوط موضعا من المسجد يستره ليصلي فيه.", "قوله: (فتتبع إليه رجال) أي: تطلبه رجال وجاءوا إلى موضعه، ليقتدوا به في صلاته.", "قوله: (وحصبوا الباب) أي: رموه بالحصباء، وهي الحص ى الصغار تنبيها له؛ لأنهم ظنوا أنه نسي، وعند البخاري في «الاعتصام»: «ثم فقدوا صوته ليلة، فظنوا أنه قد نام، فجعل بعضهم يتنحنح ليخرج إليهم …».", "قوله: (أفضل صلاة المرء في بيته إلا المكتوبة) هذا لفظ البخاري في «الاعتصام» أعني قوله: «أفضل»، وأما رواية مسلم والبخاري في بقية المواضع فهو: «خير صلاة المرء».", "وظاهره عموم النوافل؛ لأن المراد بالمكتوبة المفروضة، لكنه محمول على ما لا تشرع فيه الجماعة؛ كالرواتب وقيام الليل وصلاة الضحى، والمراد بالمرء: جنس الرجال."], "s": ["أ- الحديث دليل على جواز حجز المكان في ناحية من المسجد والاختصاص به للعبادة والراحة، إذا كان هناك حاجة، بشرط ألا يضيق على المصلين.", "ب- الحديث دليل على جواز الجماعة في صلاة النافلة، وقد كان ذلك في صلاة الليل، وهو مبدأ صلاة التراويح، فقد ورد في حديث عائشة أن النبي صلى الله عليه وسلم صلى في رمضان ذات ليلة في المسجد فصلى بصلاته ناس ثم صلى من الثانية، فترك ذلك خشية أن تفرض على الأمة.", "والأظهر - والله أعلم - أن صلاة التراويح تؤدى جماعة في المساجد لفعله صلى الله عليه وسلم، ولفعل الخليفة الراشد عمر رضي الله عنه ومن بعده، فإنه صلى الله عليه وسلم فعلها، ولم يتركها إلا خشية أن تفرض، وقد أصبحت - ولل الحمد - من شعائر الإسلام الظاهرة في شهر رمضان.", "أما صلاة نافلة النهار جماعة فإنها تجوز في بعض الأحيان ما لم تتخذ عادة راتبة - إذا وجد لذلك سبب ـ، وأما اتخاذها عادة راتبة فهو غير مشروع، بل هو من البدع، كما ذكر ذلك شيخ الإسلام ابن تيمية؛ لأن النبي صلى الله عليه وسلم والصحابة والتابعين لم يكونوا يعتادون الاجتماع للنوافل غير ما تشرع له الجماعة؛ كالاستسقاء والكسوف ونحو ذلك، وعامة تطوعاته صلى الله عليه وسلم كان يصليها منفرداً، وإنما تطوع في جماعة قليلة لأمور عارضة.", "ويدل لذلك حديث عتبان بن مالك لما صلى النبي صلى الله عليه وسلم في بيته، وفيه: (قال: «أين تحب أن أصلي من بيتك؟» فأشرت له إلى المكان الذي أحب أن أصلي فيه، فقام رسول الله صلى الله عليه وسلم فكبر وصففنا وراءه، فصلى ركعتين ثم سلم، وسلمنا حين سلم …). وقد بوب عليه البخاري «باب صلاة النوافل جماعة».", "وجاء في حديث أنس رضي الله عنه أنه صلى الله عليه وسلم صلى به وبجدته مليكة بنت مالك واليتيم لما زارهم في منزلهم، والحديث أخرجه البخاري ومسلم.", "ج- الحديث دليل على صحة نية الإمامة في أثناء الصلاة، وذلك لأن النبي صلى الله عليه وسلم صلى منفرداً ثم صلى معه أصحابه.", "والصحيح جواز ذلك في الفرض والنفل، فإذا أحرم إنسان بالصلاة منفرداً ثم جاء إنسان صح أن يدخل معه، ويكون الأول إماما للثاني.", "ومما يدل على ذلك - أيضا - حديث ابن عباس في صلاته مع النبي صلى الله عليه وسلم في قيام الليل، فإنه صلى الله عليه وسلم صلى منفردا، ثم قام ابن عباس ووقف عن يساره، فنقله صلى الله عليه وسلم إلى جهة اليمين، ففيه إشارة إلى أنه صلى الله عليه وسلم نوى الإمامة في أثناء الصلاة، وسيأتي - إن شاء الله - بعد تسعة أحاديث.", "وكذا حديث أبي سعيد رضي الله عنه أن رسول الله صلى الله عليه وسلم أبصر رجلا يصلي وحده، فقال: «ألا رجل يتصدق على هذا فيصلي معه».", "د- الحديث دليل على فضل صلاة النوافل في البيت، والمراد بذلك ما لا تشرع فيه الجماعة، كما تقدم، وقد مضى في أول صلاة التطوع ذكر الأدلة على فضل النوافل في البيت، وما في ذلك من الفوائد العظيمة، والله تعالى أعلم."]}, "126": {"m": "وَعَنْ جَابِرٍرضي الله عنه قَالَ: «صَلّى مُعَاذٌ لأَِصْحَابِهِ العِشَاءَ فَطَوّلَ عَلَيْهِمْ، فَانْصَرَفََ رجَُلٌ مِنّا فَصَلّى، فَأُخْبِرَ مُعَاذٌ عَنْهُ، فَقَالَ: إِنّهُ مُنَافِقٌ! فََلَمّا بَلَغََ ذَلِكَ الرّجُلَ دَخَلَ عَلَى رَسُوَلِ اللَّهِ صلى الله عْليه وسلم فَأخْبَرَهُ مَا قَالَ مُعَاذٌ. فَقَالَ لَهُ النّبِيَُّ صلى الله علْيه وسلم: أتُرِيدُ أنْ تَكُونَ فَتّانا يَا مُعَاذُ؟ إِذَا أمَمْتَ النّاسَ فَاقْرَأ بَِـ {الشّمْسِ وَضُحَاهَا}، وَ{سَبِحِ اسْمَ رَِبكَ الأعْلَى}، وَ {اقْرَأ بِاسْمِ رَِبكَ}، وَ {اللّيْلِ إِذَا يَغْشَى}» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ أيْضا. وَفِي لَفْظٍ لَهُ: «فَانْحَرَفَ رجَُلٌ فَسَلّمَ، ثُمّ صَلّى وَحْدَهُ وَ انْصَرَفَ».", "w": ["قوله: (فانحرف)؛ أي: مال عن الصف وخرج منه، يقال: انحرف عن كذا: مال عنه.", "قوله: (فسلم)؛ أي: تسليم الخروج من الصلاة، وظاهر السياق أنه سلم بعد الانحراف والخروج من الصف، وهذا غير مراد؛ لأن قوله: (فانحرف) مؤول بـ: أراد الانحراف فسلم.", "قوله: (ثم صلى وحده)؛ أي: استأنف الصلاة بعد قطعها بالسلام وأتمها منفرداً، وفي رواية للبخاري من طريق سليم بن حيان، عن عمرو بن دينار... «فتجوز رجل فصلى صلاة خفيفة».", "قوله: (وانصرف)؛ أي: خرج من المسجد إلى بيته، أو إلى محل حاجته."], "s": ["أ- استدل بهذا الحديث - في بعض رواياته - من قال بجواز اقتداء المفترض بالمتنفل، وقد حكى ابن المنذر هذا القول عن عطاء وطاووس والأوزاعي، وهو قول الشافعي وأصحابه، ورواية عن الإمام أحمد، اختارها ابن قدامة، وشيخ الإسلام ابن تيمية.", "وذلك أن معاذا رضي الله عنه كان يصلي مع النبي صلى الله عليه وسلم ثم يرجع فيؤم قومه - كما ثبت في «الصحيحين» - والرسول صلى الله عليه وسلم قد اطلع على ذلك ولم ينكر عليه، فإنه صلى الله عليه وسلم يعلم الأئمة الذين كانوا يصلون في مساجد المدينة، وعلى فرض أنه صلى الله عليه وسلم لم يعلم بذلك فإن الزمن زمن وحي، ولا يقع فيه التقرير على ما لا يجوز، ولهذا استدل أبو سعيد وجابر رضي الله عنهما على جواز العزل بكونهم فعلوه في زمن النبي صلى الله عليه وسلم، ولو كان منهياً عنه لنهي عنه في القرآن.", "وذهب آخرون إلى أن ذلك لا يجوز، حكاه ابن المنذر عن بعض السلف، وذكره عبد الرزاق في «مصنفه» عنهم، وهو قول الحنفية، والمالكية، وأحمد في المشهور عنه، واختار ذلك أكثر أصحابه.", "واستدلوا بحديث أبي هريرة المتقدم: «إنما جعل الإمام ليؤتم به، فلا تختلفوا عليه …»، قالوا: فنهى النبي صلى الله عليه وسلم عن الاختلاف على الإمام، وكون الإمام متنفلاً والمأموم مفترضاً اختلاف، فلا يجوز.", "وأجابوا عن قصة معاذ بأنها ليست صريحة في الاستدلال، فإنه يحتمل أنه كان يصلي مع النبي صلى الله عليه وسلم فريضة، ويحتمل أن ينويها نافلة، وليس أحد هذا الاحتمالين بأولى من الآخر، ذكر ذلك الطحاوي.", "وذكر الحافظ ابن رجب أجوبة أخرى ومنها: أن بعض الرواة لم يذكروا أن معاذا كان يصلي خلف النبي صلى الله عليه وسلم، وإنما ذكروا أنه كان يصلي بقومه ويطيل بهم، ومنها: أن النبي صلى الله عليه وسلم لم يعلم بذلك، وكلها اعتذارات غير ناهضة، ولهذا قال: (ولم يظهر عنه جواب قوي، فالأقوى جواز اقتداء المفترض بالمتنفل …).", "والقول الأول أرجح، فإن الحديث صريح في المسألة، ويقويه ما ثبت أن النبي صلى الله عليه وسلم صلى صلاة الخوف بطائفتين، بكل طائفة ركعتين.", "وأما حديث أبي هريرة، فعنه جو ابان:", "الأول: أن المراد بالاختلاف المنهي عنه اختلاف الأفعال الظاهرة، بدليل سياق الحديث، كما تقدم.", "الثاني: سلمنا أنه عام في اختلاف النيات والأفعال، لكنه مخصوص بأدلة جواز اختلاف النية، ومنها قصة معاذ رضي الله عنه.", "وأما اعتذارهم عن قصة معاذ فهو مردود، فإنه قد ورد في بعض الروايات عن جابر رضي الله عنه أنه قال: «وهي له تطوع، ولهم مكتوبة العشاء».", "ب- الحديث دليل على أن الإمام إذا طول على المأموم وشق عليه إتمام الصلاة معه، فإن له أن يقطع صلاته معه، ويصلي منفرداً، ويكون ذلك عذراً في سقوط الجماعة في هذه الحال. ومن العذر أن يكون المأموم متعباً، أو غلبه النعاس، أو خاف على ماله أو صبيه، أو خاف فوات رفقته، أو رحلة طائرة أعلن عن إقلاعها، ونحو ذلك. قال سفيان: إذا خشي على غنمه الذئب، أو على دابته أن تؤخذ، أو على صبيه أن يأكله الذئب، فلا بأس أن يقطع صلاته ويذهب إليه، وقال الحسن وقتادة - في رجل كان يصلي فأشفق أن تذهب دابته أو أغار عليها السَّبُع - قالا: ينصرف. قيل لقتادة: يرى سارقاً يريد أن يأخذ نعليه، قال: ينصرف. ووجه الاستدلال: أن النبي ﷺ أقر الرجل الذي قطع الاقتداء بمعاذ وصلى وحده، ولم يأمره بالإعادة. أما قطع الصلاة لغير عذر، فإنه لا يجوز على الراجح من قولي أهل العلم، وهما روايتان عن الإمام أحمد، وقولان عن الشافعي. ووجه المنع أمران: الأول: قول النبي ﷺ: «إنما جعل الإمام ليؤتم به، فلا تختلفوا عليه» ومفارقته من غير عذر هي من الاختلاف عليه. الثاني: أن صلاة الجماعة واجبة، والواجب إذا شُرِعَ فيه لم يجز إبطاله وقطعه لغير عذر، كأصل الصلاة.", "ج- دلت رواية مسلم «فانحرف رجل فسلم» - على القول بثبوتها - على أن هذا الرجل قطع الصلاة واستأنفها منفرداً، وليس المراد أنه قطع الاقتداء وأتمها منفرداً؛ لأن رواية النسائي: «فانصرف الرجل، فصلى في ناحية المسجد» صريحة في الدلالة على أنه قطع الصلاة مع الإمام، وصلى منفرداً في ناحية المسجد، وقد بوب النسائي على هذا بقوله: باب «خروج الرجل من صلاة الإمام وفراغه من صلاته في ناحية المسجد».", "د- دل قوله: (ثم صلى وحده وانصرف) مع رواية النسائي: «فانصرف الرجل فصلى في ناحية المسجد» على أنه يجوز للمنفرد الذي فارق إمامه لعذر أن يصلي في ناحية من المسجد الذي تصلى فيه الجماعة، وأن مثل هذا لا يُعَدُّ من الافتيات على الإمام، ولا من تفريق الجماعة؛ لأن الرسول ﷺ أقر الرجل على صلاته في ناحية المسجد لما قال له: «فانصرفتُ فصلَّيتُ في ناحية المسجد» ولم ينكر عليه، والله تعالى أعلم."], "t": ["قد تكلم بعض الحفاظ في لفظة: (فسلَّم) فقد ذكر البيهقي أن زيادة السلام تفرد بها محمد بن عباد، عن سفيان، قال: (لا أدري هل حفظها عن سفيان أم لا؟) وذلك لأن الحفاظ من أصحاب سفيان بن عيينة، وكذلك من أصحاب شيخه عمرو بن دينار، وكذا من أصحاب جابر، لم يذكروا السلام، وكأن محمد بن عباد فهم أن هذه اللفظة تدل على أن الرجل قطع الصلاة؛ لأن السلام يُتحلل به من الصلاة."]}, "127": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «لمَّا ثَقُلَ رَسُولُ اللَّهَِ صلى اللهَ عليه وسلم جَاءَ بِلالٌ يُؤْذِنُهُ بِالصّلاةِ، فَقَالَ: مُرُوا أَبَا بَكْرٍفَلْيُصَلِ بِالنّاسِ. قََالَتْ: فَقُلْتُ: يَا رَسُولَ اللَّهِ! إِنّ أبَا بَكْرٍرجَُلٌ أسِيفٌ؛ وَ إِنّهُ مَتَى يَقُمْ مَقَامَكََ لَا يُسْمِعِ النّاسَ، فَلَوْ أمَرْتَ عُمَرَ! فَقَالَ: مُرُوا أبَا بَكْرٍفََلْيُصَلِ بِالنّاسِ. قَالَتْ: فَقُلْتُ لِحَفْصَةَ: قُولِي لَهُ: إِنّ أبَا بَكْرٍرجَُلٌ أسِيفٌَ، وَ إِنّهُ مَتَى يَقُومُ مَقَامَكَ لَاَ يُسْمِعُ النّاسَ، فَلَوْ أمَرْتَ عُمَرَ!َ فَقَالَتَْ لَهُ. فَقَالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: إِنّكُنّ لأَنْتُنّ صَوَاحِبُ يُوسُفَ، مُرُوا أبَا بَكْرٍفَلْيُصَلِ بِالنّاسِ. قَالَتْ: فَأمَرُوا أبَا بَكْرٍفَصَلّى بِالنّاسِ. قَالَتَْ: فَلَمّا دَخَلَ فِي الصّلاةِ وَجَدَ رَسُولُ اللَّهِ صَلى الله عليه وسلم فَِي نَفْسِهَِ خَِفّةا، فَقَامَ يُهَادَى بَيْنَ رجَُلَيْنِ وَرِجْلاهُ تَخُطّانِ فِي الأرْضِ. قَالَتْ: فَلَمّا دَخَلَ المَسْجِدَ وَسَمِعَ أبُوبَكْرٍحِسّهُ ذَهَبَ يَتََأخّرُ، فَأوْمَأ إِلَيْهِ رَسُولُ اللَّهِ صلى الله عليه وسلم: قُمْ مَكَانَكَ، فَجَاءَ رَسُولُ اللَّهَِ صلى الله عليه وسلم حََتّى جَلَسَ عَنْ يَسَارِأبِي بَكْرٍ. قَالَتْ: فَكَانَ رَسُولُ اللَّهِ صلى الله عليَه وسلم يُصَلِي بِالنّاسِ جَالِسا وَ أبُو بَكْرٍقَائِما، يَقْتَدِي أبُو بَكْرٍبِصَلاةِ النّبِيِ صلى الله عليه وسلم، وَيَقْتَدِي النّاسُ بِصَلاةِ أبِي بَكْرٍ» مُتّفَقٌ عَلَيْهِ.", "s": ["أ- الحديث دليل على جواز إمامة العاجز عن القيام بالقادرين عليه، وخص الحنابلة ذلك بالإمام الراتب المرجو زوال علته، قصرًا للحديث على أضيق مدلولاته.", "والقول الثاني: أن الحكم عام لا فرق فيه بين الإمام الراتب أو غيره، لعموم الحديث: «إذا كبر فكبروا …» الحديث، والتخصيص يحتاج إلى دليل، وليس هناك دليل على ذلك، وهذا رواية عن الإمام أحمد، وهو اختيار الشيخ عبد الرحمن السعدي.", "وهذا إنما يتم إذا كان النبي صلى الله عليه وسلم هو الإمام، وهذا هو الراجح لقول عائشة رضي الله عنها: (فجاء حتى جلس عن يسار أبي بكر)، فإن هذا هو موقف الإمام مع المأموم، ولقولها: (يقتدي أبو بكر بصلاة النبي صلى الله عليه وسلم ويقتدي الناس بصلاة أبي بكر)، ولقولها في رواية مسلم: (كان النبي صلى الله عليه وسلم يصلي بالناس، وأبو بكر يسمعهم التكبير).", "وقد اختلف العلماء في هذه المسألة فمنهم من قال: لا تصح الصلاة خلف إمام قاعد، وهو قول الإمام مالك، واستدلوا بما روى الشعبي أن النبي صلى الله عليه وسلم قال: «لا يؤمن أحد بعدي جالساً».", "وقال آخرون: تصح الصلاة خلفه، ولكن اختلفوا في كيفية ذلك على ثلاثة أقوال:", "القول الأول: أنهم يصلون خلفه قياماً، وهو قول أبي حنيفة والشافعي، واستدلوا بحديث الباب حيث إنه صلى الله عليه وسلم صلَّى قاعداً وصلى من خلفه قياماً، وذلك في مرض موته، فيكون ناسخاً لحديث عائشة الآتي في صلاتهم خلفه جلوساً؛ لأنه إنما يؤخذ بالآخر فالآخر من أفعاله صلى الله عليه وسلم.", "قالوا: ولأن القيام في الصلاة فرض، فإذا سقط عن الإمام لعذر، فلا يسقط عن المأموم إلا لعذر.", "القول الثاني: أنهم يصلون خلفه قعوداً، وهو رواية عن الإمام أحمد، ويستدل لذلك بعموم: «إنما جعل الإمام ليؤتم به»، والائتمام به - كما تقدم - متابعته، فإذا صلى قائماً تصلي قائماً، وإذا صلى قاعداً تصلي قاعداً، وهو ما دل عليه حديث أبي هريرة المتقدم بلفظ أبي داود.", "كما استدلوا بحديث عائشة الآتي، حيث أشار إليهم في أثناء الصلاة بالجلوس، فدل على أنه لا بد منه.", "القول الثالث: أنه إذا ابتدأ الإمام الصلاة قاعداً صلى من خلفه قعوداً، وإذا ابتدأ الإمام الصلاة قائماً، ثم عجز في أثناء الصلاة عن القيام صلى من خلفه قياماً، وهذا التفصيل قال به الإمام أحمد وبعض الشافعية، واستدلوا على الجزء الأول بحديث عائشة رضي الله عنها أنها قالت: صلى النبي صلى الله عليه وسلم في بيته وهو شاك فصلى جالساً، وصلى وراءه قوم قياما، فأشار إليهم أن اجلسوا فلما انصرف قال: «إنما جعل الإمام ليؤتم به، فإذا ركع فاركعوا، وإذا رفع فارفعوا، وإذا صلى جالسا فصلوا جلوسا»، وتقدم أيضا حديث أبي هريرة رضي الله عنه وفيه: «وإذا صلى قاعدا فصلوا قعودا أجمعين». واستدلوا على الجزء الثاني بهذا الحديث، فإن أبا بكر رضي الله عنه ابتدأ بهم الصلاة قائماً، ثم جاء النبي صلى الله عليه وسلم فصلى بهم من حيث انتهى أبو بكر فصلى قاعداً، والصحابة صلوا خلفه قياماً، فدل ذلك على أن الإمام إذا ابتدأ الصلاة قائماً ثم عجز عن القيام بعد ذلك صلى من خلفه قياماً.", "وهذا القول هو الأظهر؛ لأن فيه جمعاً بين الأدلة وعملاً بها، ولا يعدل إلى النسخ مع إمكان الجمع.", "وأما حديث الشعبي فقد قال عنه الدارقطني: (لم يروه غير جابر الجعفي عن الشعبي، وهو متروك، والحديث مرسل لا تقوم به حجة).", "ب- الحديث دليل على جواز كون المبلغ عن الإمام عن يمينه، لا في الصف، إذا كان فيه مصلحة، ليراه الناس، أو لأنه أبلغ لصوته، أو لفوائد أخرى، والله تعالى أعلم."]}, "128": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه أَنّ النّبِيّ صلى الله عليه وسلم قَالَ: «إِذَا أَمّ أَحَدُكُمُ النّاسَ فَلْيُخَفِفْ؛ فَإِنّ فِيهِمُ الصّغِيرَ وَالكَبِيرَ وَالضّعِيفَ وَالمَرِيضَ، فَإِذَا صَلّى وَحْدَهُ فَلْيُصَلِ كَيْفَ شَاءَ» - وَفِي لَفْظٍ: «وَذَا الحَاجَةِ»، وَفِي آخَرَ: «الضّعِيفَ وَالسّقِيمَ» - مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لمُِسْلِمٍ. وَلَمْ يَقُلِ البُخَارِيُّ: «الصّغِيرَ».", "w": ["قوله: (فليخفف) أي: القراءة والركوع والسجود وغير ذلك من الأقوال والأفعال الذي لا يبلغ حد الإخلال بالصلاة.", "وهذا الأمر للاستحباب، وعليه الشافعية وجماعة، وقال آخرون: للوجوب، تمسكاً بظاهر الأمر، وهو قول ابن حزم.", "قوله: (والضعيف) أي: المريض، وفي رواية عند مسلم: «فإن فيهم الصغير والكبير والضعيف والمريض»، وفي رواية: «فإن في الناس الضعيف والسقيم»، فيفسر الضعيف هنا بضعيف الخلقة لهزال أو كبر أو صغر أو مرض، لأن الضعف خلاف القوة، والسقيم: المريض، فيكون من باب عطف الخاص على العام، لأن الضعف أعم من السقم، فقد يكون الإنسان قليل القوة من أصل الخلقة، لا من سقم عرض له.", "قوله: (وذا الحاجة) أي: صاحب الحاجة، وهو المحتاج للتخفيف لحاجة له.", "قوله: (فليصل كيف شاء) اللام للأمر، والمراد الإباحة، لقوله: «كيف شاء»."], "s": ["أ- الحديث دليل على أن الإمام مأمور بأن يخفف الصلاة بالناس مراعاة لذوي الأعذار، وذلك لئلا يشق على المأمومين، فإن وراءه ضعيف البنية والمريض وصاحب الحاجة، فالتطويل في حق هؤلاء وأمثالهم يؤدي إلى المشقة والملل والسأم، وهذا أمر ينبغي للإمام مراعاته، فقد ورد عن عمر رضي الله عنه أنه قال: «لا تبغضوا الله إلى عباده، يكون أحدكم إماماً فيطول على القوم الصلاة حتى يبغض إليهم ما هم فيه».", "قال ابن عبد البر: (لا أعلم بين أهل العلم خلافاً في استحباب التخفيف لكل من أم قوماً، على ما شرطنا من الإتيان بأقل ما يجزئ، والفريضة والنافلة عند جميعهم سواء في استحباب التخفيف فيما إذا صليت جماعة بإمام، إلا ما جاء في صلاة الكسوف على سنتها …).", "ومن هنا يتبين أن التخفيف فيه مصالح منها:", "١ - الرفق بمن وراء الإمام.", "٢ - تأليف الناس وتحبيب الصلاة إليهم.", "٣ - دعوتهم إلى المواظبة على صلاة الجماعة.", "ب- اختلف العلماء في ضابط التخفيف المأمور به، فقيل: ليس لذلك ضابط معين؛ لأن التخفيف والتطويل أمر نسبي ليس له حد في اللغة ولا في العرف؛ لأنه يختلف باختلاف الأئمة والمأمومين، فقد يقرأ بعض الأئمة آياتٍ قراءةً مرتلة خفيفة على السامع، ويقرأها آخر بوقت أطول من الأول، وكذا المأمومين فقد يناسبهم التطويل في مكان ولا يناسبهم في آخر، وعلى هذا فيرجع إلى سنة النبي صلى الله عليه وسلم وإلى حاله في صلاته، فيفعل الإمام في الغالب ما كان يفعله النبي صلى الله عليه وسلم غالباً، ويزيد وينقص لمصلحة، كما كان النبي صلى الله عليه وسلم يزيد وينقص للمصلحة، يقول أنس رضي الله عنه: (ما صليت وراء إمام قط أخف صلاة ولا أتم صلاة من النبي صلى الله عليه وسلم).", "فمن صلى مثل صلاة النبي صلى الله عليه وسلم فقد خفف وإن ثقل ذلك على بعض الناس، وما زاد على فعله صلى الله عليه وسلم زيادة بينة فهو تطويل.", "وقيل: ضابط التخفيف الاقتصار على أدنى الكمال، فيقتصر على ثلاث تسبيحات، وكذا سائر أجزاء الصلاة، وهذا هو المشهور عن الشافعي.", "وردَّ هذا شيخ الإسلام ابن تيمية بأنه لا دليل عليه من السنة بل الأحاديث المستفيضة الثابتة تبين أنه صلى الله عليه وسلم كان يسبح في أغلب صلاته أكثر من ذلك.", "وقيل: حد التخفيف مأخوذ من قوله صلى الله عليه وسلم لعثمان بن أبي العاص: «أنت إمامهم، واقتد بأضعفهم …» الحديث، وتقدم في باب «الأذان».", "فأرشده النبي صلى الله عليه وسلم إلى أن يراعي حال الضعيف من المأمومين، وعبر عن المراعاة بالاقتداء، مشاكلة لاقتدائهم به، فكأنه قال: كما أن الضعيف يقتدي بصلاتك، فاقتد أنت - أيضاً - بضعفه.", "وهذا قول ابن حزم، واختاره الحافظ ابن حجر، وهذا هو الأقرب ـ إن شاء الله - وهو الذي يدل عليه هدي النبي صلى الله عليه وسلم في صلاته، لكن على الإمام مراعاة أموردلت عليها السنة منها:", "الأول: أن التخفيف المأمور به هو الذي لا يصل إلى حد الإخلال بمقاصد الصلاة وأركانها وسننها، أو إلى سرعة تشق على من خلفه من كبار السن وغيرهم في أثناء القيام أو الركوع أو السجود.", "الثاني: أن الصلوات ليست على قدر واحد في القراءة والقيام وبقية الأفعال؛ لأن منها ما يشرع فيه التطويل كالفجر، ومنها ما هو دون ذلك، والإمام الموفق هو الذي يضع الأمور مواضعها، فيطول أحياناً تطويلاً لا يخرج إلى حد التنفير، ويخفف أحياناً تخفيفاً لا يخرج إلى حد الإخلال، كما تقدم، ويغلب جانب التخفيف على جانب التطويل.", "الثالث: لا بد للإمام من أن يقيم وزناً للأمور الطارئة، فيخفف الصلاة فيها؛ كشدة حر أو برد عارض، كما خفف النبي صلى الله عليه وسلم لبكاء الصبي.", "الر ابع: إذا كان الجماعة محصورين وآثروا التطويل فلا بأس، لانتفاء العلة الموجبة للتخفيف، وقد دل على ذلك حديث أبي قتادة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «إني لأقوم في الصلاة أريد أن أطول فيها، فأسمع بكاء الصبي، فأتجوز في صلاتي كراهية أن أشق على أمه»، فإرادته صلى الله عليه وسلم التطويل أولاً يدل على جواز مثل ذلك، لكنه تركه لعارض.", "الخامس: أنه يجب على الإمام أن يتحرى الرفق بالمأمومين، وجمع كلمتهم على محبته، والرضا عنه، وعدم اختلافهم عليه؛ لأن اختلافهم عليه يسبب مفاسد عظيمة وأمورًا لا تحمد.", "ج- الحديث دليل على أن الإنسان إذا صلى وحده فله أن يطيل ما شاء؛ لأنه لا يشق على أحد بذلك، ما لم يخرج الوقت، والله تعالى أعلم."]}, "129": {"m": "وَعَنْ عَمْرِو بْنِ سَلِمَةَ الجَرْمِيِ رضي الله عنَهما قَالََ: «كُنّا بَِمََاءٍ مَمَرّ النّاسِ، وَكَانَ يََمُرُّ بِنَا الرُّكْبَانُ نَسْأَلُهُمْ:َ مَا لِلنّاسِ؟ مَا لِلنّاسِ؟ مَا هَذَا الرّجُلُ؟ فَيَقُولُونَ: يَزْعُمُ أنّ اللَّهَ أرْسَلَهُ، أوْ أوْحَى إِلَيْهِ كَذَا، وَكُنْتُ أحْفَظُ ذَلِكَ الكَلامَ، فَكَأنّمَا يُغْرى فِي صَدْرِي. وَكَانَتِ العَرَبُ تَلَوّمُ بِإِسْلامِهِمُ الَفَتْحَ، فَيَقُولُونَ: اتْرُكُوهُ وَقَوْمَهُ، فَإِنْ ظَهَرَ عَلَيْهِمْ فَهُوَ نَبِيٌّ صَادِقٌ. فَلَمّا كَانَتْ وَقْعَةُ الفَتْحِ بَادَرَ كُلُّ قَوْمٍ بِإِسْلامِهِمْ، وَبَدَرَ أبِي قَوْمِي بِإِسْلامِهِمْ. فَلَمّا قَدِمَ قَالَ: جِئْتُكُمْ وَاللَّهِ مِنَْ عِنْدِ النّبِيِ حَقا، فََقَالَ: صَلُّوا صَلاةَ كَذَا فِي حِينِ كََذَا، وََصَلُّوا صَلاةَ كَذَا فِي حِينَِ كَذَا، فَإِذَا حَضَرَتِ الصّلاةُ؛ فَلْيُؤََذِنْ أحَدَُكُمْ، وَلْيَؤُمّكُمَْ أكْثَرُكُمْ قُرْ آنا. فَنَظَرُوا فَلَمْ يَكُنْ أحَدٌ أكْثَرَقُرْ آنا مِنِي؛ لمَِا كُنْتُ أتَلَقّى مِنَ الرُّكَْبَانِ. فَقَدّمُونِيَ بَيْنَ أيْدِيهِمْ وَ أنَا ابْنُ سِتٍ أوْ سَبْعِ سِنِينَ. وَكَانَتْ عَلَيّ بُرْدَةٌ كُنْتُ إِذَا سَجَدْتُ تَقَلّصَتْ عَنِي، فَقَالَتِ امْرَأةٌ مِنَ الحَيِ: ألَا تُغََطُّوا عَنّا اسَْتَ قَارِِئكُمْ؟ فَاشْتَرَوَْا فَقَطَعُوا لِي قَمِيصا، فَمَا فَرِحْتُ بِشَيْءٍ فَرَحِي بِذَلِكَ القَمِيصِ» رَوَاهُ البُخَارِيُّ. وَعِنْدَ أبِي دَاوُدَ: «وَ أنَا ابْنُ سَبْعِ سِنِينَ أوْ ثَمَانِ سِنِينَ». وَعِنْدَ النّسَائِيِ: «وَ أَنَا ابْنُ ثَمَانِ سِنِينَ».", "w": ["قوله: (يغرى في صدري) أي: يلتصق.", "قوله: (تلوم بإسلامهم) أي: تنتظر.", "قوله: (وبدر أبي قومي) أي: سبقهم.", "قوله: (است قارئكم) أي: العَجُز."], "s": ["أ- الحديث دليل على أنه يقدم في الإمامة من كان أكثر حفظاً للقرآن؛ لقوله: «وليؤمكم أكثركم قرآناً»، وعلى هذا فيكون الحديث مفسرًا للحديث الآتي: «يؤم القوم أقرؤهم لكتاب الله»، ويكون المراد بالأقرأ: الأكثر قرآنا، وسيأتي بيان ذلك إن شاء الله.", "ب- الحديث دليل على صحة إمامة الصبي في صلاة الفرض إذا كان أهلاً لذلك بقراءته وعلمه وتميزه، فيؤم غيره وإن كانوا كباراً وإن كانوا شيوخاً؛ لأن هؤلاء الصحابة رضي الله عنهم قدموا عمرو بن سلمة وعمره ست أو سبع سنين ولو كانت إمامته غير جائزة لنزل الوحي بإنكار ذلك، لا سيما في الصلاة التي هي أعظم أركان الإسلام، وهذا قول الشافعي ورواية عن الإمام أحمد.", "والقول الثاني: أن إمامته لا تصح، وهو قول الجمهور من الحنفية والمالكية والحنابلة، وهو قول ابن حزم الظاهري، واستدلوا بحديث أبي هريرة المتقدم بلفظ البخاري: «إنما جعل الإمام ليؤتم به فلا تختلفوا عليه …» قالوا: وصلاة الصبي نفل، فصلاة البالغ خلفه الفرض اختلاف على الإمام، وقد نهينا عنه، ولأن الشرع قد رفع عنه القلم، ولا تصح الصلاة خلف من رفع القلم عنه؛ كالمجنون.", "ولهم أدلة أخرى غير ناهضة، وأجابوا عن حديث عمرو بن سلمة بأنه لم يرو أن إمامته لهم كانت عن أمر النبي صلى الله عليه وسلم ولا عن تقريره، فلا حجة فيها.", "والراجح هو القول الأول، لقوة دليله، وإذا جازت إمامته في الفرض جازت إمامته في النفل من باب أولى؛ لأن النفل يدخله التسامح، ولأنه لا فرق في ذلك بين النفل والفرض، والأصل تساويهما في الأحكام، خلا ما استثنى الدليل.", "وأما جواب أصحاب القول الثاني عن حديث الباب فهو مردود من وجهين:", "الأول: أن دليل الجواز وقوع ذلك في زمن الوحي، ولا يقع فيه التقرير على ما لا يجوز، لا سيما في الصلاة التي هي أعظم أركان الإسلام، وقد نبه النبي صلى الله عليه وسلم بالوحي على القذى الذي كان في نعله أثناء الصلاة - كما تقدم في شروط الصلاة في حديث أبي سعيد رضي الله عنه - فلو كانت إمامة الصبي لا تصح لنزل الوحي بذلك، وقد استدل جابر رضي الله عنه على جواز العزل بأنه لم ينزل فيه شيء.", "الثاني: أن الوفد الذين قدَّموا عَمرًا كانوا جماعة من الصحابة، قال ابن حزم: (ولا يعرف لهم من الصحابة رضي الله عنهم مخالف)، بل ورد أنه كان يؤمهم في كل المجامع، فقد روى عنه أبو داود أنه قال: (فما شهدت مجمعاً من جَرٍم إلا كنت إمامهم …).", "وأما أدلتهم فإن حديث أبي هريرة رضي الله عنه تقدم أن المراد به الاختلاف في الأفعال، وأما رفع القلم عنه فمعناه رفع التكليف والإيجاب، لا نفي صحة الصلاة، بدليل حديثنا هذا.", "وأما إمامة الصبي في النفل - كالتراويح مثلا - فأجازها الشافعي لما تقدم، وأجازها - أيضا - مالك وأحمد في رواية عنه اختارها أكثر أصحابه، قالوا: لأن النافلة يدخلها التخفيف، ولذا تنعقد الجماعة به فيها إذا كان مأموماً، وقالت الحنفية: لا تصح إمامة الصبي في النفل كما تقدم في الفرض، والقول بالجواز أصح؛ لأنها إذا صحت في الفرض صحت في النفل من باب أولى، لما تقدم، والله تعالى أعلم."]}, "130": {"m": "وَعَنْ أَبِي مَسْعُوَدٍ رضي الله عنه قَالَ: قَالَ رَسُولُ اللَّهِ صلى اللهَ عليه وسلم: «يَؤُمُّ القَوْمَ أَقْرَؤُهُمْ لِكِتَابِ اللَّهَِ، فَإِنْ كَانُوا فِي القِرَاءَةِ سَوَاءا فَأعْلَمُهُمْ بِالسُّنّةِ، فَإِنْ كَانُوا فِي السُّنّةِ سَوَاءا فَأقْدَمُهُمْ هِجْرَةا، فَإِنْ كَانُوا فِي الهِجْرَةِ سَوَاءا فَأقْدَمُهُمْ سِلْما. وََلَا يَؤُمّنّ الرّجُلُ الرّجُلَ فِي سُلْطَانِهِ، وََلَا يَقْعُدْ فِي بَيْتِهِ عَلَى تَكْرِمَتِهِ إِلَاّ بِإِذْنِهِ» - وَفِي رِوَ ايَةٍ: «سِنا» بَدَلَ: «سِلْما» - رَوَاهُ مُسْلِمٌ.", "w": ["قوله: (يؤم القوم) هذا خبر بمعنى الأمر.", "قوله: (أقرؤهم لكتاب الله) أي: أكثرهم حفظاً، فمن حفظ القرآن كاملاً مقدم على من حفظ نصفه - مثلاً - بدليل حديث عمرو بن سلمة المتقدم، وفيه: «وليؤمكم أكثركم قرآنا» فيكون هذا الحديث مبيناً للمراد بحديث أبي مسعود، كما تقدم. والقول الثاني: أن المراد بالأقرأ: الأحسن قراءة؛ لأن هذا هو المراد في اللغة، والرسول صلى الله عليه وسلم يتكلم باللغة العربية، والأول أظهر؛ لأن فيه تفسير السنة بالسنة، وهو أولى من تفسيرها باللغة.", "قوله: (فأعلمهم بالسنة) أي: أحكام الشريعة من صلاة وصيام وحج، ونحو ذلك.", "قوله: (فأقدمهم هجرة) الهجرة معناها: الانتقال من بلد الشرك إلى بلد الإسلام، وهي باقية إلى قيام الساعة، والمعنى: أن من هاجر إلى رسول الله صلى الله عليه وسلم أولاً يقدم على من هاجر بعده؛ لأنه أكثر منه علماً.", "قوله: (فأقدمهم سلماً) - بكسر السين المهملة وسكون اللام ـ، أي: إسلاماً، وأما رواية «سناً» فلا تعارض الأولى، بل إحداهما تفسر الأخرى؛ لأن من كان أكبر سناً فهو مقدم سلماً؛ لأن المقصود أكبرهم سناً في الإسلام.", "قوله: (في سلطانه) المراد به: محل ولايته، سواء كانت ولاية عامة، أي: الولاية العظمى، أو ولاية خاصة؛ كصاحب البيت.", "قوله: (تكرمته) بفتح التاء وسكون الكاف وكسر الراء، المراد به: الفراش ونحوه مما يوضع لصاحب المنزل ويختص به، والغالب أن ذلك يكون في صدر المجلس كما هو الملاحظ الآن."], "s": ["أ- الحديث دليل على أن المقدم في إمامة الصلاة هو الأقرأ، بمعنى الأكثر حفظا لكتاب الله تعالى - كما تقدم - لكن لا بد أن يكون عالماً بأحكام صلاته؛ إذ ليس للجاهل بأحكام الصلاة أن يؤم الناس، قال الحافظ ابن حجر: (ولا يخفى أن محل تقديم الأقرأ إنما هو حيث يكون عارفاً بما يتعين معرفته من أحوال الصلاة، فأما إذا كان جاهلاً بذلك فلا يقدم اتفاقاً).", "ب- الحديث دليل على أن الأئمة إذا تساووا في القراءة فإنه يقدم أعلمهم بالسنة، وهو أفقههم في دين الله تعالى، فإن تساووا يقدم أقدمهم هجرة إلى الرسول صلى الله عليه وسلم في زمنه، أو أقدمهم هجرة من بلاد الكفر إلى بلاد الإسلام بعد زمن الرسول صلى الله عليه وسلم؛ لأن المتقدم أسبق إلى الخير وأقرب إلى معرفة الشرع ممن تأخر، فإن كانوا في الهجرة سواء فأقدمهم إسلاماً وهو أكبرهم سناً، كما جاء في الرواية الأخرى، فإن من كان أكبر سناً فهو أقدم إسلاماً.", "وهذا الترتيب من محاسن الشريعة وكمالاتها، حيث راعت هذه الأمور وجعلت الناس مراتب بحسب علمهم.", "ج- الحديث دليل على أن الإمام الأعظم أو الوالي من قبله أحق بالإمامة من غيره من المذكورين، فإذا حضر في محل ولايته قدم على جميع الحاضرين حتى صاحب البيت وإمام المسجد، إلا إذا أذن، فيقدم من يصلح للإمامة.", "وإمام المسجد أحق في مسجده بالإمامة من غيره، إلا من الإمام الأعظم أو نائبه إلا إذا أذن بتقديم غيره فالحق له، وكذا صاحب البيت لو صلى فيه لعذر فهو أولى بالإمامة من غيره ممن يحضر في منزله، إلا الإمام الأعظم؛ لأن ولايته عامة، وشرط ذلك أن يكون صاحب البيت أهلاً للإمامة، والله تعالى أعلم."]}, "131": {"m": "وَعَنِ ابْنِ مَسْعُودٍ رضي الله عنه قَالََ: قَالَ رَسُولُ اللَّهِ صَلى الله عليه وسلم: «لِيَلِنِي مِنْكُمْ أُولُو الأَحْلامِ وَالنُّهَى، ثُمّ الّذِينَ يَلُونَهُمْ - ثَلاثا -. وَ إِيّاكُمْ وَهَيْشَاتِ الأسْوَاقِ» رَوَاهُ مُسْلِمٌ أيْضا.", "w": ["قوله: (لِيَلِنِي) هو أمر من الوَلي، وهو القرب والدنو؛ أي: ليقرب وليدن مني في الصلاة.", "قوله: (أُولُو الأَحلامِ)؛ أي: ذوو العقول الراجحة، وقيل: أولو الأحلام: البالغون، والحُلم - بضم الحاء واللام - البلوغ، وأصله ما يراه النائم.", "قوله: (وَالنُّهَى) بضم النون وفتح الهاء مقصورًا، جمع نُهيَة بمعنى العقل، سمي به؛ لأنه ينهى صاحبه عن القبائح والرذائل، كتسمية العقل عقلاً من عقال البعير؛ لأنه يَعقِلُ صاحبه عن الرذائل؛ أي: يحبسه عنها، كما يحبس العقال البعير عن الانطلاق، ويحتمل أن النُّهى مصدر كالهدى، وليس جمعاً. فعلى القول الأول في تفسير (أولو الأحلام) وأنهم العقلاء، يكون اللفظان مترادفين، فهما بمعنى واحد، عُطف أحدهما على الآخر، من باب عطف الشيء على نفسه تأكيداً، وسَهَّلَ العطف اختلاف اللفظين. أما على الثاني، وهو أن (أولو الأحلام) هم البالغون، فيكون عطف (النُّهى) من باب عطف المغاير، والقاعدة أنه إذا دار اللفظ بين كونه متبايناً، وكونه مترادفاً، فإنه يُحمل على التباين؛ لأن فيه زيادة معنى. والمعنى: ليدن مني في الصلاة البالغون العقلاء، لشرفهم، ومزيد فطنتهم وتيقظهم، وضبطهم الصلاة.", "قوله: (ثم الذين يلونهم)؛ أي: الذين يقربون منهم في هذا الوصف، كالصبيان، سواء المراهقون وغيرهم، وفي حديث أبي مسعود: «ثم الذين يلونهم، ثم الذين يلونهم.».", "قوله: (وهيشات الأسواق) بفتح الهاء وسكون الياء وبالشين المعجمة جمع هيشة: بالفتح، والمراد: رفع الأصوات والمنازعات والخصومات، ويروى: وهوشات، بالواو، والهوشة: الفتنة والهَيجُ والاختلاط. ومناسبة هذه الجملة لما قبلها: ١ - إذا كانت الهيشات هي رفع الأصوات، فإن الصلاة حضور بين يدي الله تعالى، فينبغي أن يكونوا على السكوت وآداب العبودية. ٢ - وإذا كانت الهيشات هي الاختلاط، فقد نهاهم أن يختلطوا اختلاط أهل الأسواق، فلا يميز بين أصحاب الأحلام والعقول عن غيرهم، ولا يتميز الصبيان عن البالغين. ٣ - أو يكون المراد: قووا أنفسكم من الاشتغال بأمور الأسواق فإنه يمنعكم أن تلوني."], "s": ["أ- الحديث دليل على أن العقلاء البالغين مأمورون بأن يتقدموا في الصلاة وأن يكونوا خلف الإمام قريبين منه، لضبط صلاته وحفظها وتنبيهه إذا سها، وليقتدي بهم من خلفهم؛ ولأنه ربما احتاج الإمام إلى استخلاف، فيكون الواحد منهم أهلاً لذلك؛ لفضيلة العلم والعقل.", "ب- استدل العلماء بهذا الحديث على أن السُّنَّة تقديم أهل الفضل في كل مجمع، كمجلس العلم، والقضاء، والمشاورة، ومواقف القتال، والتدريس، ونحو ذلك.", "ج- ليس في الحديث دليل على تأخير الصبيان - لا سيما المميزون - عن الصف الأول أو عما وراء الإمام، إذا تقدموا على غيرهم وحضروا مبكرين، وإنما الحديث سيق لحث العقلاء والبالغين على التقدم؛ ليكونوا وراء الإمام، ولو كان المراد النهي عن تقديم الصبيان لقال: لا يلني إلا أولو الأحلام والنُّهى.", "د- اختلف العلماء فيما إذا تقدم صبي مميز وجلس في الصف الأول، فهل يؤخر؟", "قولَان: القول الأول: أنه لا يؤخر، وهو قول الشافعية، وقطع به المجد ابن تيمية، ومال إليه صاحب «الفروع»، واختاره الشيخ عبد الرحمن السعدي، والشيخ محمد بن عثيمين، والشيخ عبد العزيز بن باز، لحديث عمرو بن سلمة في إمامة قومه، وله سبع أو ست سنين. فإذا جازت إمامته، فمن باب أولى جلوسه في الصف الأول، وأنه لا يؤخر، ولحديث ابن عمر عن النبي ﷺ قال: «لا يقيم الرجل الرجل من مجلسه ثم يجلس فيه» والصبي المميز في حكم البالغ، ثم إن تأخيرهم يترتب عليه مفاسد كثيرة منها: ١ - أن تأخيرهم من الصف المقدم فيه تنفير لهم، لا سيما إذا كانوا فوق عشر سنوات، والشارع الحكيم يحرص على ترغيبهم في الصلاة في المساجد. ٢ - أن هذا الصبي إذا أخرجه رجل بعينه، فإنه يكرهه، ويحقد عليه، ولا يزال يذكره بسوء؛ لأن الصغير لا ينسى ما فعل معه عادة. ٣ - أن هذا قد يؤدي إلى لعبهم وتشويشهم في المسجد؛ انتقاماً لما فعل معهم.", "والقول الثاني: أن الصبي المميز إذا تقدم إلى الصف الأول فإنه يؤخر، وهو ظاهر كلام الإمام أحمد، واستدلوا بحديث ابن مسعود هذا، كما استدلوا بفعل الصحابي الجليل أُبيِّ بن كعب عندما تنحى قيس بن عباد عن الصف المقدم، وقام مقامه وقال: «إن هذا عهد من النبي ﷺ إلينا أن نليه». والقول الأول أرجح، لقوة مأخذه، وما يترتب على بقاء الصبي في مكانه الذي سبق إليه من المصالح، وما ينشأ بسبب إبعاده من المفاسد، ثم لو كان تأخيرهم أمرًا مشهورًا لاستمر العمل عليه؛ كتأخير النساء، ولنُقِلَ كما نُقلت الأمور المشهورة نقلاً لا يحتمل الاختلاف. يقول الشيخ عبد العزيز بن باز: (إذا كان الصبي مميزًا، عاقلاً، فلا يؤخر من مكانه، لأنه قد سبق إلى ما لم يسبق إليه مسلم، فكان أولى، ولما فيه من تشجيع للصبيان على المسابقة إلى الصلاة، وإذا كان دون التمييز، أو غير عاقل فإنه يؤخر؛ لأن صلاته غير صحيحة). وأما حديث: «ليلني منكم أولو الأحلام» فقد تقدم أنه ليس فيه دليل على تأخيرهم، وإنما هذا حث للكبار على التقدم، وتقديم أولي الأحلام والنهى لا يدل على فساد خلافه.", "وأما قصة أُبي بن كعب مع قيس بن عباد فهو رأي صحابي، وقال بعض العلماء: إنه في الصحابة مع التابعين، وهذا فيه نظر.", "ه- استدل بعض العلماء بهذا الحديث على أنه إذا كان يمين الصف بعيداً، وأيسر الصف أقرب إلى الإمام، فإن الصف الأيسر أفضل من الأيمن، من أجل القرب من الإمام، لقوله: (ليلني منكم أولو الأحلام والنهى)، والله تعالى أعلم."]}, "132": {"m": "وَعَنْ قَتَادَةَ، عَنْ أَنَسِ بْنِ مَالِكٍ رضي الله عنه، عَنِ النّبِيِ صلى الله عليه وسلم قَالَ: «رُصُّوا صُفُوفَكَُمْ، وَقَارَِبُوا بَيْنَهَا، وَحَاذُوا بِالأَعْنَاقِ، فَوَالّذِي نَفْسِي بِيَدِهِ! إِنِي لأََرَى الشّيَاطِينَ تَدْخُلُ مِنْ خَلَلِ الصّفِ كَأنّهَا الحَذَفُ» رَوَاهُ أحْمَدُ، وَ أبُو دَاوُدَ، وَالنّسَائِيُّ، وَ ابْنُ حِبّانَ البُسْتِيُّ. وَالحَذَفُ - بِالتّحْرِيكِ -: غَنَمٌ سُودٌ صِغَارٌمِنْ غَنَمِ الحِجَازِ، الوَاحِدَةُ: حَذَفَةٌ؛ قَالَهُ الجَوْهَرِيُّ.", "w": ["قوله: (تدخل من خلل الصف) الخلل: بفتحتين، الفرجة بين الشيئين، والجمع خِلال، مثل جبل وجبال.", "قوله: (كأنها الحَذَفُ) بالتحريك، غنم سود صغار من غنم الحجاز، الواحدة حذفة.", "قوله: (قاله الجوهري) هو إمام اللغة أبو نصر إسماعيل بن حماد الجوهري، مصنف كتاب «الصحاح» في اللغة."], "s": ["أ- في الحديث حث على تسوية الصفوف، وهذا يتحقق بالتراص في الصف، والتقارب بين المصلين بِسَدِّ الفُرج، وكذا بالمحاذاة بين الأعناق. وقد أكد النبي ﷺ مسألة التراص والتقارب بهذا القسم العظيم، لعظم الفائدة، وهي منع دخول الشياطين بين المأمومين، وهذا الدخول يستلزم تسلط الشيطان وإغواءه ووسوسته حتى يفسد عليهم صلاتهم وخشوعهم الذي هو روح الصلاة ولبها.", "ب- في الحديث دليل على أن التساهل في سدِّ الفرج وعدم التراص في الصف والتقارب بين المصلين أنه سبب في دخول الشياطين بين المصلين، وهذا له تأثير على الصلاة؛ لأن الشيطان إذا لم يستطع أن يصد العبد عن طاعة الله تعالى، فإنه يجتهد في إفساد العبادة والطاعة ليفوت الأجر.", "ج- ورد في حديث أنس أن النبي ﷺ قال: «أقيموا صفوفكم، فإني أراكم خلف ظهري». وقد يكون في معنى هذا ما جاء في حديث الباب من أنه ﷺ يرى الشياطين تدخل من خلل الصف كأنها الحذف، والرؤية في قوله: (فإني أراكم خلف ظهري) محمولة على ظاهرها، وهي رؤية حقيقية خاصة بالنبي ﷺ زيادة في كرامته، وأما صرفها عن ظاهرها بضروب من التأويل، فلا يعول عليه ولا يلتفت إليه؛ لأنه تكلف، وعدول عن الظاهر بلا موجب، والله أعلم."], "t": ["هذا الحديث أخرجه من ذكرهم المصنف من طريق أبان بن يزيد العطار، عن قتادة به. وهذا الحديث سنده صحيح، رجاله ثقات."]}, "133": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه قَالَ: قََالَ رَسُولُ اللَّهِ صلى الله عليه وسلم: «خَيْرُ صُفُوفِ الرِجَالِ أَوّلُهَا، وَشَرُّهَا آخِرُهَا، وَخَيْرُصُفُوفِ النِسَاءِ آخِرُهَا، وَشَرُّهَا أوّلُهَا» رَوَاهُ مُسْلِمٌ.", "s": ["أ- الحديث دليل على فضل الصف الأول من صفوف الرجال لقوله: (خير صفوف الرجال أولها) أي: أكثرها أجرًا، وهو دليل على أنه ينبغي الحرص عليه، وذلك بالتبكير إلى المسجد والمبادرة لحضور الصلاة، ليحصل الصف الأول والدنو من الإمام. وعن أبي هريرة رضي الله عنه أن رسول الله صلى الله عليه وسلم قال: «لو يعلم الناس ما في النداء والصف الأول ثم لم يجدوا إلا أن يستهموا عليه لاستهموا …» الحديث، وتقدم حديث أبي سعيد: «تقدموا فأتموا بي وليأتم بكم من بعدكم …».", "ب- الحديث دليل على أن شر صفوف الرجال آخرها، فهي أقلها ثواباً، لبعدها عن الإمام، ولترك الفضيلة الحاصلة بالتقدم إلى الصف الأول، ولقربها من النساء، ويغلب على أهل الصفوف المتأخرة الكسل والتهاون في أداء الصلاة، كما يغلب عليهم فوات الصلاة أو شيء منها، فيكون طمع الشيطان فيهم أكثر.", "ج- الحديث دليل على أن أفضل صفوف النساء وأكثرها ثواباً آخرها؛ لبعدها عن الرجال، لئلا يحصل الاختلاط إذا كثرت الصفوف، ولئلا تسمع النساء كلام الرجال أو ترى حركاتهم، فيتعلق القلب بهم وتحصل الفتنة، ولأن مرتبتهن متأخرة عن مرتبة الرجال، فيكون آخر الصفوف أليق بهن، وأقل صفوف النساء ثواباً أولها؛ لقربهن من الرجال.", "وظاهر الحديث أن التفضيل في حق صفوف النساء مطلق، سواء صلين مع الرجال في مكان واحد، أو صلين في مكان منفرد، كما هو الحال الآن، فخير صفوفهن آخرهن على الإطلاق.", "وقال آخرون: إن الحديث ليس على إطلاقه، وإنما هو حيث يكن مع الرجال كما عليه الحال قديماً، وأما إذا صلين منفردات في مكان خاص فهن كالرجال، خير صفوفهن أولها، وشرها آخرها، وهؤلاء نظروا إلى علة الحكم، كما تقدم، فقالوا: إن العلة لا تتم إلا إذا كانت صلاتهن مع الرجال، وأما إذا صلين منفردات فلا تأتي هذه العلة، فتكون صفوفهن كصفوف الرجال، ذكر هذا الصنعاني، وسبقه إلى هذا القول النووي، وهكذا من جاء بعده من الشراح، وبه أفتى الشيخ عبد العزيز بن باز.", "د- الحديث دليل على أن النساء يقفن في الصلاة صفوفاً كالرجال، لا منفردات تصلي كل امرأة أو كل مجموعة وحدها، كما عليه كثير من النساء، بل عليهن أن يقفن صفوفاً، ويسوين صفوفهن، ويكملن الصف الأول فالأول، لعموم الأدلة في هذا الباب، والله أعلم."]}, "134": {"m": "وَعَنِ ابْنِ عَبّاسٍ رضي الله عنهما قَالَ: «صَلّيْتُ مَعَ رَسُولِ اللَّهِ صلى الله عليه وسلم ذَاتَ لَيْلَةٍ فَقُمْتُ عَنْ يَسَارِهِ، فَأَخَذَ رَسُولُ اللَّهِ صلى الله عليه وسلم بِرَأسِي مِنْ وَرَائِي فَجَعَلَنِي عَنْ يَمِينِهِ» مُتّفَقٌ عَلَيْهِ.", "s": ["أ- الحديث دليل على أن موقف المأموم الواحد إذا كان ذكرًا عن يمين الإمام؛ لأن الرسول صلى الله عليه وسلم أدار ابن عباس رضي الله عنهما من يساره، وجعله عن يمينه، ومثل ذلك حصل لجابر رضي الله عنه، وفيه: (قام رسول الله صلى الله عليه وسلم يصلي فقمت عن يساره فأخذ بيدي فأدارني حتى أقامني عن يمينه، ثم جاء جبار بن صخر، فأخذ بأيدينا جميعاً فدفعنا حتى أقامنا خلفه) وهذا قول جمهور العلماء بل حكي فيه الإجماع.", "وإذا وقف عن يمينه فإنه يقف مساوياً لإمامه فلا يتأخر عنه، كما يفعله بعض الناس؛ لأن قول ابن عباس: (وقفت إلى جنبه) ظاهره أنه مساوٍ له، وهو الذي فهمه البخاري، ومشى عليه الشراح؛ كابن رجب وابن حجر، وفي رواية عند أحمد: «ما شأني أجعلك حذائي فتخنس؟ …»، وفي حديث عائشة في صلاة النبي صلى الله عليه وسلم بالصحابة في مرض موته: (فجلس رسول الله صلى الله عليه وسلم حذاء أبي بكر، إلى جنبه).", "فإن وقف المأموم عن يسارالإمام ركعة فأكثر، فقد اختلف العلماء في صحة صلاته على قولين:", "الأول: لا تصح صلاته، وهذا هو المشهور عن الإمام أحمد، وعليه جماهير أصحابه، واستدلوا بما تقدم، قالوا: فلو كانت الصلاة صحيحة لأقر النبي صلى الله عليه وسلم ابن عباس وجابرا رضي الله عنهما على موقفهما، فيحمل على الوجوب، لا سيما وأنه يلزم منه المشي والعمل لغير حاجة، ومثل هذا لا يرتكب لمخالفة فضيلة.", "القول الثاني: أن صلاته صحيحة مع الكراهة، وكون المأموم الواحد عن يمين الإمام إنما هو على سبيل الأفضلية، لا على سبيل الوجوب، وهذا مذهب الحنفية والمالكية والشافعية ورواية الإمام أحمد، قال صاحب «الفروع»: (هي أظهر)، وقال صاحب «الإنصاف»: (وهو الصواب)، وقال شيخ الإسلام ابن تيمية: (… وحيث صحت الصلاة عن يسار الإمام كرهت إلا لعذر …).", "قالوا: لأن النهي إنما ورد عن الفذية، وأما إدارة النبي صلى الله عليه وسلم لابن عباس وجابر فإنه يدل على الأفضلية لا على الوجوب؛ لأنه فعل مجرد لم يقترن بقول، فإنه لم ينه عنه، بدليل أنه صلى الله عليه وسلم لم يأمر ابن عباس باستئناف صلاته، فإنه كبر تكبيرة الإحرام عن يساره صلى الله عليه وسلم ثم نقله عن يمينه، فدل على صحة صلاته.", "وهذا القول فيه وجاهة كما ترى، فالظاهر صحة صلاة من صلى يسار الإمام مع خلو يمينه مع الكراهة؛ لأنه ترك المقام المختار وهو يمين الإمام، والقول ببطلان صلاته يحتاج إلى دليل تطمئن إليه النفس.", "وقد ورد عن الإمام أحمد في رواية ابنه عبد الله أنه قال: (لو أن رجلاً جاهلاً صلى برجل فجعله يساره كان مخالفاً للسنة، ورد إليها، وجازت صلاته).", "ب-الحديث دليل على صحة نية الإمامة في أثناء الصلاة؛ لأنه صلى الله عليه وسلم صلى منفرداً، ثم دخل معه ابن عباس، وهذا على الراجح من قولي أهل العلم في الفرض والنفل، وقد مضى الكلام على ذلك.", "ج- الحديث دليل على جواز الجماعة في صلاة التطوع للمصلحة إذا لم يتخذ ذلك عادة راتبة، وقد مضى الكلام على ذلك.", "د- الحديث دليل على أن الإمام إذا أدار المأموم الواقف عن يساره إلى يمينه من وراء ظهره لم تفسد صلاتهما، أما الإمام فلا تفسد صلاته بمد يده له وتحويله من جانب إلى جانب، وأما المأموم فلا تفسد صلاته بمشيه من أحد جانبي الإمام إلى جانبه الآخر؛ لأن هذا عمل يسير، وقد جاء تفسير هذه الإدارة بأنها كانت من وراء ظهره - عليه الصلاة والسلام - ففي رواية عند مسلم: (فأخذني من وراء ظهره)، وفي رواية: (فتناولني من خلف ظهره)، وإنما أخذه من وراء ظهره لئلا يمر بين يديه، والمرور بين يدي المصلي منهي عنه، مع أنه لو أخذه من أمامه لكان أيسر وأسهل، والله تعالى أعلم."]}, "135": {"m": "وَعَنْ أَنَسٍ رضي الله عنه قَالَ: «صَلّى رَسُولُ اللَّهِ صلى الله عليَه وسلم فِي بَيْتِ أُمِ سُلَيْمٍ، فََقُمْتُ وَيَتِيمٌ خَلْفَهُ، وَأُمُّ سُلَيْمٍ خَلْفَنَا» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لِلْبُخَارِي.ِ وَلمُِسْلِمٍ: «صَلّى بِهِ وَبِامْرَأةٍ؛ فَجَعَلَهُ عَنْ يَمِينِهِ، وَالمَرْأةَ خَلْفَهُ».", "s": ["أ- الحديث دليل على أن المأموم إذا كان أكثر من واحد فإن موقفه خلف الإمام، وهو قول الجمهور من أهل العلم.", "وتقدم في حديث جابر بن عبد الله رضي الله عنه أنه لما صلى مع الرسول صلى الله عليه وسلم ومعه جبار بن صخر أقامهما النبي صلى الله عليه وسلم خلفه، فدل على أن موقف الاثنين وراء الإمام.", "وقد ورد في «صحيح مسلم» من طريق إسرائيل، عن منصور، عن إبراهيم، عن علقمة والأسود أنهما دخلا على عبد الله بن مسعود، فقال: أصلى من خلفكم؟ قالا: نعم، فقام بينهما، وجعل أحدهما على يمينه والآخر عن شماله، ثم ركعنا فوضعنا أيدينا على ركبنا، فضرب أيدينا، ثم طبق بين يديه، ثم جعلهما بين فخذيه، فلما صلى قال: (هكذا فعل رسول الله صلى الله عليه وسلم)، فهذا يدل على أن الاثنين يكونان عن يمين الإمام وشماله.", "وقد أجيب عن ذلك بأجوبة منها:", "١ - أن هذا منسوخ؛ لأن ابن مسعود رضي الله عنه ذكر التطبيق، وقد نسخ بالمدينة، وحديث جابر وجبار رضي الله عنهما بالمدينة؛ لأن جابرا إنما شهد المشاهد بعد بدر، وحديث أنس الذي معنا بالمدينة - أيضا ـ، ذكر ذلك الحازمي، فيكون الناسخ قد خفي على ابن مسعود رضي الله عنه، وليس ببعيد، فإنه لم يكن من عادة النبي صلى الله عليه وسلم إلا إمامة الجمع الكثير، أما إمامة اثنين فهذه نادرة، ولعل ابن مسعود لم يطلع عليه، فبقي على مقتضى علمه الأول.", "٢ - أن فعل ابن مسعود رضي الله عنه كان لضيق المكان، ذكر ذلك الطحاوي عن محمد بن سيرين.", "٣ - أن فعل ابن مسعود محمول على الجواز، وما تقدم يدل على الأفضل.", "ب- الحديث دليل على أن المرأة لا تقف مع الرجال، بل تكون خلفهم، قال ابن رشد: (لا خلاف في أن المرأة الواحدة تصلي خلف الإمام، وأنها إن كانت مع الرجل صلى الرجل إلى جانب الإمام والمرأة خلفه).", "ولا فرق في ذلك بين أن تكون المرأة من محارم الرجل كزوجته، أو ليست من محارمه إذا لم يكن خلوة، فإذا صلى الرجل بزوجته - مثلا - فإنها تقف خلفه، لعموم الأدلة، فإن خالفت ووقفت في صف الرجل فصلاتها صحيحة، ولا تُبطل على أحد صلاته، على الأظهر من قولي أهل العلم؛ لأن الأصل صحة الصلاة، ولا يحكم بالبطلان إلا بدليل قوي سالم من الاحتمال، وحديث الباب لا يدل على البطلان، بل يدل على أنها تتأخر وأن هذا موقفها.", "ج- الحديث دليل على صحة مصافة البالغ للصبي، وأن من صلى بجانبه صبي فليس فذَّاً، وهذا قول الجمهور من الحنفية والمالكية والشافعية، واختاره ابن عقيل الحنبلي.", "ووجه الدلَالة: أن اليتيم - وهو من مات أبوه ولم يبلغ - وقف مع أنس رضي الله عنه خلف النبي صلى الله عليه وسلم، فدل على جواز ذلك، ولا فرق بين مصافته في صلاة الفرض أو النفل إلا بدليل.", "وتقدم حديث عمرو بن سلمة في صلاته بقومه وهو ابن ست أو سبع، فإنه إذا دل على جواز إمامة الصبي دل على جواز مصافته من باب أولى.", "وذهب أحمد في المنصوص عنه إلى أنه لا تصح مصافة الصبي في الفرض، لعدم صحة إمامته، ولأنه يخشى أن لا يكون متطهرًا فيكون البالغ فذا، وتصح مصافته في النفل، لهذا الحديث فإن هذه الصلاة كانت نفلاً.", "والقول الأول أرجح لقوة دليله، وما صح في الفرض صح في النفل، وأما التعليل بعدم صحة إمامته فهو مردود من ثلاثة أوجه:", "الأول: أن الراجح صحة إمامته، كما تقدم، فيكون الأصل المقيس عليه غير صحيح.", "الثاني: أن المصافة ليست كالإمامة؛ لأن الإمامة أعظم من المصافة، فلا يصح القياس لاختلاف العلة.", "الثالث: أن هذا تعليل في مقابلة نص، وهو حديث الباب.", "د-الحديث دليل على جواز الجماعة في صلاة التطوع للمصلحة، وقد مضى بيان ذلك.", "ه- الحديث دليل على عناية الإسلام بمنع اختلاط المرأة بالرجل حتى في العبادات، فجعلها تقف وحدها ولا تقف مع الرجل، والله تعالى أعلم."]}, "136": {"m": "وَعَنْ أَبِي بَكْرَةَ رضي الله عنه: «أَنّهُ انْتَهَى إِلَى النّبِيِ صلى الله عليه وسلم وَهُوَ رَاكِعٌ، فَرَكَعَ قَبْلَ أَنَْ يَصِلَ إَِلَى الصّفِ،َ فَذََكَرَذَلِكَ لِلنّبِيِ صلى الله عليه وسلم، فَقَالَ: زادَكَ اللَّهُ حِرْصا، وََلَا تَعُدْ» رَوَاهُ البُخَارِيُّ. وَفِي رِوَ ايَةٍ لأِحْمَدَ، وَ أبِي دَاوُدَ: «أنّ أبَا بَكْرَةَ جَاءَ وَرَسُولُ اللَّهَِ صلى الله عليه وسلم رَاكِعٌ، فَرَكَعَ دُونَ الصّفِ، ثُمّ مَشَى إِلَى الصّفَِ، فَلَمّا قَضَى النّبِيُّ صلى الله عليه وسلم صَلاتَهُ قَالَ: أيُّكُمُ الّذِي رَكَعَ دُونَ الصّفِ ثُمّ مَشَى إِلَى الصّفِ؟ فَقَالَ أبُوبَكْرَةَ: أنَا. فَقَالَ النّبِيُّ صلى الله عليه وسلم: زادَكَ اللَّهُ حِرْصا، وََلَا تَعُدْ».", "r": 137}, "137": {"m": "وَعَنْ هِلالِ بْنِ يَسَافٍ، عَنْ عَمْرِو بْنِ رَاشِدٍ،َ عَنْ وَ ابِصَةَ بْنِ مَعْبَدٍ رَضي الله عنه: «أَنّ رََسُولَ اللَّهِ صلى الله عليه وسلم رأََى رجَُلا يُصَلِي خَلْفَ الصّفِ وَحْدَهُ، فَأمَرَهُ أنْ يُعِيدَ الصّلاةَ» رَوَاهُ أحْمَدُ - وَحَسّنَهُ -، وَ أبُو دَاوَُدَ - وَهَذَا لَفْظُهُ -، وَ ابْنُ حَِبّانَ فِي «صَحِيحِهِ»، وَالتِرْمِذِيُّ - وَقَالَ: «حَدِيثٌ حَسَنٌ» -. وَقَالَ ابْنُ المُنْذِرِ: «ثَبّتَ الحَدِيثَ أحْمَدُ، وَإِسْحَاقُ»، وَقَالَ أبُو عُمَرَابْنُ عَبْدِ البَرِ: «فِي إِسْنَادِهِ اضْطِرَابٌ».", "s": ["أ- استدل بحديث أبي بكرة من قال بصحة صلاة المنفرد خلف الصف، وهم الجمهور - كما حكاه عنهم ابن رشد -، ووجه الدلالة من قوله في رواية أبي داود: (فركع دون الصف، ثم مشى إلى الصف) فإنه يدل على أن أبا بكرة ركع خلف الصف فأتى بجزء من الصلاة خلف الصف، ولم يأمره النبي صلى الله عليه وسلم بإعادة الصلاة وإنما أرشده في المستقبل إلى ما هو أفضل، بقوله: «ولا تعد» وهو بفتح التاء وضم العين على المشهور، نهي عن العود إلى ما فعل - كما سيأتي ـ، وأجابوا عن حديث وابصة بأنه مضطرب، كما تقدم، فحديث أبي بكرة مقدم عليه.", "والقول الثاني في المسألة: أن صلاة المنفرد خلف الصف باطلة، وهذا مذهب الإمام أحمد، ورواية عن الإمام مالك، وبه قال جمع من الفقهاء والمحدثين، ذكرهم ابن رجب.", "واستدلوا بحديث وابصة، فإن الرسول صلى الله عليه وسلم أمر من صلى خلف الصف وحده بالإعادة، ويشهد له حديث علي بن شيبان: «لا صلاة لمنفرد خلف الصف».", "وأجابوا عن حديث أبي بكرة بأنه لا دليل فيه على صحة صلاة المنفرد خلف الصف؛ لأنه ليس فيه أنه صلى منفرداً خلف الصف قبل رفع الإمام رأسه من الركوع، فقد أدرك من الاصطفاف المأمور به ما يكون به مدركاً للركعة، فهذا بمنزلة أن يقف وحده، ثم يجيء آخر فيصافه، فإن هذا جائز باتفاق الأئمة، ذكر هذا شيخ الإسلام ابن تيمية.", "والقول الثالث: التفصيل، وهو أنه إن وجد محلاً في الصف فصلى وحده خلف الصف لم تصح صلاته، ومن اجتهد ولم يجد مكاناً جاز له أن يقف وحده، وبه قال الحسن البصري، كما رواه عنه ابن أبي شيبة، وابن قدامة، ونصره شيخ الإسلام ابن تيمية، وابن القيم.", "وهذا القول هو المختارفي هذه المسألة لما يلي:", "الأول: أن فيه جمعاً بين الأدلة، فيحمل حديث: «لا صلاة لمنفرد خلف الصف» على ما إذا قصر في سد الفرجة والانضمام إلى الصف، وأما إذا لم يجد فرجة فتصح صلاته؛ لأنه ليس بمقصر.", "الثاني: أن العلماء مجمعون على أن واجبات الصلاة وأركانها تسقط عند عدم القدرة، فلا واجب مع العجز، ولا محرم مع الضرورة، ولا ريب أن العجز عن المصافة عذر.", "الثالث: أن عمومات الشريعة تؤيد ذلك؛ كقوله تعالى: {فاتقوا الله ما استطعتم} [التغابن: ١6]، وقوله تعالى: {لا يكلف الله نفسا إلا وسعها} [البقرة: ٢86]، وقوله صلى الله عليه وسلم: «إذا أمرتكم بأمر فأتوا منه ما استطعتم».", "واعلم أن ضابط الانفراد هو ما إذا رفع الإمام رأسه من الركوع ولم يدخل معه أحد، فإن دخل معه أحد قبل أن يرفع الإمام رأسه أو حصل له مكان في الصف فدخل فيه قبل ذلك زالت فَذَيّتَه، وصحت صلاته.", "والأظهر أن النهي في حديث أبي بكرة في قوله: «ولا تعد» راجع إلى الإسراع والسعي الشديد، وكذا الركوع دون الصف، ويؤيد الأول الحديث الآتي في النهي عن الإسراع في المجيء إلى الصلاة، ويؤيد الثاني قوله: «أيكم الذي ركع دون الصف»، فإن ظاهر ذلك أن النهي متوجه إلى هذه الجملة، وهذا قول جماعة من أهل العلم منهم الطحاوي، ويؤيده حديث أبي هريرة: «إذا دخلت والإمام راكع فلا تركع حتى تأخذ مصافك من الصف»، وأجاز آخرون الركوع دون الصف إذا أدرك الإمام راكعاً، وهو رواية عن أحمد، لفعل بعض الصحابة رضي الله عنهم قالوا: والحديث نهي عن الإسراع، لا عن الركوع دون الصف، والأول أحوط.", "ب- دلت رواية الطبراني في حديث وابصة: «أو اجتررت رجلاً» على جواز جذب الرجل من الصف ليقف معه، والصواب عدم جوازذلك، والحديث منكربهذه الزيادة - كما تقدم - وذلك لما يلي:", "١ - أن الجذب يفضي إلى إيجاد فرجة في الصف، والمطلوب سد الفرج.", "٢ - أن الجذب تصرف في المجذوب، وتشويش عليه، وتفويت لفضيلة الصف الأول وكونه خلف الإمام؛ لأن الغالب في الجذب أن يكون لمن هو خلف الإمام.", "٣ - أن الجذب فيه تأثير على أكثر المصلين؛ لأن الصف سيتحرك لسد هذه الفرجة التي فتحت فيه، والله تعالى أعلم."], "t": ["حديث وابصة أخرجه من ذكرهم المصنف من طريق شعبة، عن عمرو بن مرة، عن هلال بن يساف، عن عمرو بن راشد، عن وابصة به. والحديث رجاله ثقات، غير عمرو بن راشد، فهو مجهول العدالة، ذكره البخاري وابن أبي حاتم ولم يذكرا فيه جرحاً ولا تعديلاً، وقال الذهبي في «الكاشف»: (ثقة)، وذكره ابن حبان في «الثقات»، وقد توبع في روايته، فقد تابعه زياد بن أبي الجعد، فرواه عن وابصة، ورجاله ثقات غير زياد بن أبي الجعد الغطفاني، فقد روى عنه اثنان، وذكره ابن حبان في «الثقات».", "وقد جعل بعضهم هذا الاختلاف اضطراباً في الحديث يوجب التوقف، ومنهم الشافعي، والبزار كما نقله عنه الزيلعي، وابن عبد البر.", "والذي يظهر - والله أعلم - أن الروايتين محفوظتان، وأن هلال بن يساف سمع الحديث على الوجهين، مرة من عمرو بن راشد، ومرة من قراءة زياد بن أبي الجعد على وابصة، وهذا رأي ابن حبان حيث يقول: (سمع هذا الخبر هلال بن يساف، عن عمرو بن راشد، عن وابصة بن معبد، وسمعه من زياد بن أبي الجعد عن وابصة، والطريقان محفوظان)، وهكذا قال ابن حزم.", "بينما رجح أبو حاتم والإمام أحمد الطريق الأول، فقال ابن أبي حاتم: (قلت لأبي: أيهما أشبه؟ قال: عمرو بن مرة أحفظ)، ونقل الدارمي عن الإمام أحمد أنه كان يثبت حديث عمرو بن مرة، ثم قال: (وأنا أذهب إلى حديث يزيد بن زياد بن أبي الجعد)."]}, "138": {"m": "وَعَنْ أَبِي هُرَْيرَةَ رضي الله عنه، عَنِ النّبِيِ صلى الله عليه وسلم قََالَ: «إِذَا سَمِعْتُمُ الإِقَامَةَ فَامْشُوا إِلَى الصّلاةِ وَعَلَيْكُمُ السّكِينَةَُ وَالوَقَارُ، وََلَا تُسْرِعُوا؛ فَمَا أدْرَكْتُمْ فََصَلُّوا وَمَا فَاتَكُمْ فَأتِمُّوا» مُتّفَقٌ عَلَيْهِ، وَاللّفْظُ لِلْبُخََارِي.ِ وَفِي لَفْظٍ لمُِسْلِمٍ: «صَلِ مَا أدْرَكْتَ، وَ اقْضِ مَا سَبَقَكَ». وَرَوَاهُ أحْمَدُ عَنِ ابْنِ عُيَيْنَةَ، عَنِ الزُّهْرِي،ِ عَنْ سَعِيدٍ، عَنْ أبِي هُرَْيرَةَ رضي الله عنَه: «وَمَا فَاتَكُمْ فَاقْضُوا». وَقَدْ وَهِمَ غَيْرَُ وَاحِدٍ مِنَ المُصَنِفِينَ فِي قَوْلِهِ: «إِنّ لَفْظَ القَضَاءِ مَُخَرّجٌ فِي الصّحِيحَيْنِ». وَقَالَ أبُودَاوُدَ:َ «قَالَ يُونُسُ، وَالزَُّبيْدِيُّ، وَ ابْنُ أبِي ذِئْبٍ، وَ إِبْرَاهِيمُ بْنُ سَعْدٍ، وَمَعْمَرٌ،َ وَشُعََيْبُ بْنُ أبِي حَمْزَةَ، عَنِ الزُّهْرِي:ِ «َوَمَا فَاتَكُمْ فَأتِمُّوا. وَقَالَ ابْنُ عُيَيْنَةَ: عَنَِ الزُّهْرِيِ وَحْدَهُ: فَاقْضُوا»َ. وَقَالَ مُسْلِمٌ: «أخْطَأ ابْنُ عُيَيْنَةَ فِي هَذِهِ اللّفْظَةِ، وََلَا أعْلَمُ رَوَاهَا عَنِ الزُّهْرِيِ غَيْرَهُ»َ. وَفِي قَوْلِ أبِي دَاوُدَ وَمُسْلِمٍ نَظَرٌ؛ فَإِنّ أحْمَدَ رَوَاهَا عَنْ عَبْدِ الرّزّاقِ،َ عَنْ مََعْمَرٍ، عَنَِ الزُّهْرِي.ِ وَقَدْ رُوِيَتْ مِنْ غَيْرِ وَجْهٍ عَنَْ أبِي هُرَْيرَةَ رضي اللهَ عنه. وَقَالَ البَيْهَقِيُّ: «وَالّذِينَ قَالُوا: (فَأتِمُّوا) أكْثَرُ وَأحْفَظُ، وَألْزَمُ لأَِبِي هَُرَْيرَةَ رضي الله عنه؛ فَهُوَ أوْلَى». وَالتّحْقِيقُ: أنّهُ لَيْسَ بَيْنَ اللّفْظَيْنِ فَرقٌْ؛ فَإِنّ القَضَاءَ: هُوَ الإِتْمَامُ لُغَةا وَشَرْعا، وَاللَّهُ أعْلَمُ.", "w": ["قوله: (إذا سمعتم الإقامة) أي: إقامة الصلاة، وإنما ذكرت الإقامة تنبيها على ما سواها؛ لأنه إذا نهي عن إتيان الصلاة مسرعاً في حال الإقامة مع خوف فوات بعضها فما قبل الإقامة أولى، وحكمة التقييد بالإقامة أنه إذا أسرع وقت الإقامة فإنه يدخل الصلاة ثائر النفس، فلا يحصل له تمام الخشوع في قراءته، وقال آخرون: إن هذا القيد لإخراج ما قبل الإقامة، فلا مانع من الإسراع فيه، والأول وجيه جداً، كما سيأتي.", "قوله: (وعليكم السكينة والوقار) هما اسمان لمسمى واحد، فيكون ذكر الوقار من باب التأكيد، وقيل: بينهما فرق، فالسكينة: التأني في الحركات واجتناب العبث بيد أو رجل، والوقار: في الهيئة؛ كغض البصر، وخفض الصوت، وعدم الالتفات.", "قوله: (ولا تسرعوا) زيادة تأكيد، ولا منافاة بينه وبين قوله تعالى: {فاسعوا إلى ذكر الله} [الجمعة: 9] الذي قد يشعر بالإسراع؛ لأن المراد بالسعي في الآية المضي والذهاب، يقال: سعيت إلى كذا؛ أي: ذهبت إليه.", "قوله: (فما أدركتم فصلوا) الفاء واقعة في جواب شرط مقدر؛ أي: إذا بينت لكم ما هو أولى بكم فما أدركتم فصلوا.", "قوله: (وما فاتكم فأتموا) أي: أكملوا، وفي رواية: «فاقضوا»، واللفظان بمعنى واحد؛ لأن القضاء هو الإتمام في عرف الشرع، قال تعالى: {فإذا قضيتم مناسككم} [البقرة: ٢00]، وقال تعالى: {فإذا قضيت الصلاة فانتشروا في الأرض} [الجمعة: ١0]. وأما تخصيص القضاء بمعنى: فعل شيء فات ومضى، فهو اصطلاح للفقهاء، وسيأتي ما يترتب على ذلك من الأحكام."], "s": ["أ- الحديث بيان لأدب الحضور لأداء الصلاة، وهو أن المصلي يمشي إليها بسكينة ووقار، فما أدركه صلاه مع الإمام، وما فاته أتمه وقضاه، وبهذه الهيئة يحقق لنفسه ثلاث فو ائد:", "الأولى: الراحة والطمأنينة، فيدخل الصلاة هادئاً مرتاحاً، فيحصل له الخشوع والتدبر.", "الثانية: امتثال قول النبي صلى الله عليه وسلم: «فإن أحدكم إذا كان يعمد إلى الصلاة فهو في صلاة»، والمعنى: أنه في حكم المصلي، فينبغي له اعتماد ما ينبغي للمصلي اعتماده، واجتناب ما ينبغي للمصلي اجتنابه.", "الثالثة: كثرة الخطا إلى المساجد، وهذا لا يتأتى مع السرعة، وتكثير الخطا مقصود لذاته، ورد فيه أحاديث؛ كقوله صلى الله عليه وسلم: «إن لكم بكل خطوة درجة».", "واعلم أن الأحاديث التي فيها الأمر بالمشي والنهي عن الإسراع عامة في جميع الأحوال، لا فرق بين أن يخاف فوات تكبيرة الإحرام أو فوات ركعة أو فوات الجماعة بالكلية، أو لا يخاف شيئا من ذلك، كما أنه لا فرق بين الجمعة وغيرها؛ لأن النصوص عامة لم تستثن حالة واحدة، ولا يجوز التخصيص إلا بدليل، وهذا قول جماعة من الصحابة رضي الله عنهم، وهو قول لأحمد، وهو قول الثوري وعطاء، وابن المنذر، وحكاه ابن عبد البر عن جمهور العلماء.", "وأجاز بعض العلماء الإسراع الذي لا ينافي الوقار لمن خاف فوات تكبيرة الإحرام أو فوات الركعة، لأن بعض الصحابة رضي الله عنهم أسرعوا لإدراك التكبيرة الأولى، وهم أعلم من غيرهم بمعنى ما سمعوا من نبيهم صلى الله عليه وسلم، وهذا رواية عن أحمد، وقد نقل إسحاق بن منصور عن إسحاق بن راهويه أنه قال: (إن خاف فوت التكبيرة الأولى فلا بأس أن يسرع في المشي).", "ب- استدل بالحديث من قال بمشروعية الدخول مع الإمام ولو لم يدرك إلا قليلاً من الصلاة؛ كإدراكه في التشهد، لقوله: «فما أدركتم فصلوا» إلا أن القول بالتفصيل أولى على ما ذكره شيخ الإسلام ابن تيمية، وهو أن يقال: إن كان يرجو وجود جماعة - كما في المساجد التي على الطرق - لم يدخل مع الإمام؛ لأن صلاته تامة مع جماعة أفضل، وكذا لو طمع في إدراك ركعة من الصلاة في مسجد آخر، وإن كان لا يرجو دخل معه، أخذاً بظاهر هذا الحديث.", "ج- استدل بالحديث من قال: إن الجماعة تدرك بإدراك جزء من الصلاة، فمن كبر قبل سلام الإمام فقد أدرك الجماعة؛ لقوله: «فما أدركتم فصلوا»، ومن أدرك الإمام ساجداً أو جالساً في التشهد الأخير يسمى مدركاً، فيتم ما فاته، ويكون مدركاً للجماعة، وهذا قول الحنفية، والشافعية، وهي الرواية المشهورة عن أحمد، اختارها أكثر الأصحاب.", "والقول الثاني: أن الجماعة لا تدرك إلا بإدراك ركعة فأكثر، وهو قول المالكية، ورواية عن أحمد، واختار ذلك شيخ الإسلام ابن تيمية.", "واستدلوا بحديث أبي هريرة رضي الله عنه عن النبي صلى الله عليه وسلم قال: «من أدرك ركعة من الصلاة فقد أدرك الصلاة».", "فهذا نص صريح يدل بمنطوقه على أن من أدرك ركعة من صلاة الإمام فقد أدرك صلاة الجماعة؛ لأنه عام في جميع صور إدراك الركعة من الصلاة، سواء كان إدراك جماعة أم إدراك وقت.", "ويدل بمفهومه على أن من أدرك أقل من ركعة لم يدرك الصلاة، سواء كان إدراك جماعة أم إدراك وقت.", "وهذا القول هو الراجح لقوة دليله، ويؤيده أمران:", "الأول: أنه لا يعرف في نصوص الشرع تعليق الإدراك بالتكبير قبل سلام الإمام لا في الوقت ولا في الجمعة ولا في الجماعة، فهو وصف ملغى في نظر الشرع، فلا يجوز بناء الحكم عليه.", "الثاني: أن ما دون الركعة لا يعتد به في الصلاة؛ لأن المأموم يستقبل جميع صلاته منفرداً، فلم يدرك مع إمامه شيئاً يحتسب له به.", "وأما استدلال أصحاب القول الأول بحديث أبي هريرة: «فما أدركتم فصلوا، وما فاتكم فأتموا» فهو من باب المفهوم، وحديث الإدراك من باب المنطوق، ودلالة المنطوق مقدمة على دلالة المفهوم.", "د- اختلف العلماء فيما يدركه المأموم مع الإمام هل هو أول صلاته أو آخرها؟ قولان:", "الأول: أن ما يدركه المأموم هو أول صلاته، وما يقضيه هو آخرها، وهو مروي عن جماعة من الصحابة والتابعين، ذكرهم ابن المنذر، وهذا قول الشافعي، ورواية عن مالك، ورواية عن الإمام أحمد، واستدلوا بقوله: «وما فاتكم فأتموا» وهي رواية الأكثرين، قالوا: والتمام هو الآخر، قالوا: ولا ينافي ذلك رواية: «وما فاتكم فاقضوا»؛ لأن القضاء هنا يراد به الإتمام، فالروايتان متفقتان، ورجح هذا ابن المنذر وابن حجر.", "القول الثاني: أن ما يدركه المأموم هو آخر صلاته، وما يقضيه هو أولها، وهذا هو مذهب أبي حنيفة وأصحابه، ورواية عن مالك، وهو المذهب عند الحنابلة.", "واستدلوا برواية: «وما فاتكم فاقضوا» قالوا: والقضاء لا يكون إلا لشيء قد فات، وقد فاته أول الصلاة، فيأتي به قضاء. وبهذا يتبين أن سبب الخلاف اختلاف روايات الحديث، وتفسير القضاء بالمعنى الفقهي.", "والراجح هو القول الأول، لما تقدم من أن الإتمام والقضاء بمعنى واحد، لا سيما وأن مخرج الحديث واحد، وقد أمكن رد الاختلاف في الروايات إلى معنى واحد، وعلى هذا يترتب فو ائد منها:", "١ - إذا أدرك من المغرب أو العشاء ركعتين صلى الباقي سرا؛ لأن ما يقضيه هو آخر صلاته.", "٢ - إذا أدرك ركعة من جهرية وقام يقضي ما فاته أتى بالثانية جهرا خفيفا لا يؤذي من حوله، ثم يصلي الباقي سرا.", "٣ - إذا أدرك ركعة ثم قام يأتي بالثانية قرأ الفاتحة وسورة، ثم يصلي الباقيتين بالفاتحة فقط.", "٤ - إذا أدرك مع الإمام ركعة من الثلاثية أو الرباعية جلس للتشهد الأول بعد أول ركعة يقضيها.", "ه- عموم الحديث يدل على أن ما يدركه المأموم من صلاة الجنازة هو أول صلاته، وما يقضيه هو آخرها، والله تعالى أعلم."]}, "139": {"m": "عَنْ عِمْرَانَ بْنِ حُصَيْنٍ رضي الله عنهما قَالَ: «كَانَتْ بِي بَوَاسِيرُ، فَسَأَلْتُ النّبِيّ صلى الله عليه وسلم عَنِ الصّلاةِ، فَقَالَ: صَلِ قَائِما، فَإِنْ لَمْ تَسْتَطِعْ فَقَاعِدا، فَإِنْ لَمْ تَسْتَطِعْ فَعَلَى جَنْبٍ» رَوَاهُ البُخَارِيُّ.", "s": ["أ- الحديث دليل على صفة صلاة المريض وأن لها ثلاث مر اتب:", "الأولى: أن يصلي قائماً إن قدر عليه ولو كهيئة الراكع أو معتمداً على عصا أو جدار ونحوهما.", "الثانية: أن يعجز عن القيام أو يلحقه مشقة شديدة، كأن يتألم ألماً شديداً يؤدي إلى فوات الخشوع وعدم الطمأنينة، فيصلي قاعداً يومئ بالركوع والسجود، ويجعل سجوده أخفض من ركوعه، ولم يبين صفة القعود فدل على أنه كيفما قعد جاز، سواء تربع أو افترش أو اتكأ أو احتبى، واستحب الفقهاء أن يكون متربعاً على أليتيه، ويكف ساقيه إلى فخذيه، لما جاء من حديث عائشة رضي الله عنها قالت: (رأيت رسول الله صلى الله عليه وسلم يصلي متربعاً).", "ولأن التربع في الغالب أكثر ارتياحا من الافتراش، وليحصل التفريق بين قعود القيام، والقعود الذي في محله.", "فإن قدر على الصلاة قائماً منفرداً وجالساً مع الجماعة، فقيل: يخير بينهما، ومال إليه ابن قدامة، وقيل: صلاته في الجماعة أولى، وقيل: يصلي منفرداً قائماً، قال صاحب «الإنصاف»: (هو الصواب)، لأن القيام ركن لا تصح الصلاة إلا به مع القدرة عليه، وهذا قادر، والجماعة واجبة تصح الصلاة بدونها.", "والأظهر هو القول الثاني، وهو أنه يحضر الجماعة ويصلي جالساً، لأن مصالح حضور الجماعة لا يوازيها شيء من المصالح، وأيضاً إذا وصل إلى محل الجماعة وصار عاجزًا عن القيام لم يكن واجباً عليه، وكان جلوسه في حقه بمنزلة القيام في حق القادر، فيكون حصل مصلحة الجماعة، ولم تفته مصلحة القيام، والله أعلم.", "المرتبة الثالثة: إذا عجز عن القعود صلى مضطجعاً على جنبه، وإطلاق الحديث يدل على أنه مخير بين الجنب الأيمن والأيسر، والأفضل أن يفعل ما هو أسهل له، فإن تساويا فالأيمن أفضل، ويكون وجهه إلى القبلة، وإن لم يكن عنده من يوجهه إلى القبلة صلى على حسب حاله، ويومئ برأسه إلى صدره قليلاً للركوع، ويومئ أكثر للسجود.", "المرتبة الر ابعة: أن يصلي مستلقياً على ظهره ورجلاه إلى القبلة، والأفضل أن يرفع رأسه قليلاً، ليتجه إلى القبلة، لأن في ذلك نوع استقبال، ولأن هذا أقرب ما يكون إلى صفة القائم، إذ لو قام تكون القبلة أمامه، ودليل هذه الصفة عموم قوله تعالى: {فاتقوا الله ما استطعتم} [التغابن: ١6]، وقوله صلى الله عليه وسلم: «إذا أمرتكم بأمر فأتوا منه ما استطعتم»، فإذا استطاع شيئا مما يفعل في الصلاة وجب عليه، لأنه مستطيع له.", "وقد ورد في هذه الصفة حديث علي رضي الله عنه وفيه: (فإن لم يستطع صلى مستلقياً ورجلاه إلى القبلة).", "المرتبة الخامسة: إذا لم يستطع الإيماء برأسه فالمذهب عند الحنابلة أنه يوميء بطرفه، فيغمض عينه قليلا للركوع، فإذا قال: (سمع الله لمن حمده)، فتح طرفه، فإذا سجد أغمض أكثر، ودليلهم عبارة وردت في حديث علي المتقدم: (فإن لم يستطع أومأ بطرفه)، وهذه الجملة لا وجود لها في حديث علي رضي الله عنه لا عند الدارقطني ولا عند البيهقي، والظاهر أنها لا تثبت، والحديث ضعيف، كما تقدم.", "والقول الثاني: أنه إذا عجز عن الإيماء سقطت عنه الصلاة لعجزه عنها، وهذا رواية عن الإمام أحمد، وهو قول أبي حنيفة، واختاره شيخ الإسلام ابن تيمية، وقال: (هذا القول أصح في الدليل، لأن الإيماء بالعين ليس من أعمال الصلاة، ولا يتميز فيه الركوع من السجود ولا القيام من القعود، بل هو نوع من العبث الذي لم يشرعه الله تعالى، وأما الإيماء بالرأس فهو خفضه، وهذا بعض ما أمر الله به المصلي).", "والقول الثالث: أنه تسقط عنه الأفعال لعجزه عنها دون الأقوال لقدرته عليها، والله تعالى يقول: {فاتقوا الله ما استطعتم} [التغابن: ١6]، وعلى هذا ينوي القيام بقلبه فيكبر ويقرأ، ثم ينوي الركوع فيكبر ويسبح، ثم ينوي القيام ويقول: (سمع الله لمن حمده … إلخ)، وهذا القول ذكره صاحب «الإنصاف»، وهو وجيه جداً.", "وأما قول العامة: إنه يومئ بالإصبع فهذا لا أصل له في السنة، ولم يقل به أحد من أهل العلم، إلا ما جاء في كتب بعض متأخري المالكية، والله أعلم."]}, "140": {"m": "وَرَوَى أَبُو بَكْرٍالحَنَفِيُّ، حَدّثَنَا سُفْيَانَُ، عَنْ أَبِي الزَُّبيْرِ، عََنْ جَابِرٍرضي الله عنه: «أَنَّ رَسُولَ اللَّهِ صلى الله عليه وسلم عََادَ مَرِيضا فَرَآهُ يُصَلِي عَلََى وِسَادَةٍ، فَأخَذَهَا فَرَمَى بِهَا، فََأخَذَ عُودا لِيُصَلِيَ عَلَيْهِ، فَأخَذَهُ فَرَمَى بِهِ، وَقَالَ: صَلِ عَلَى الأرْضِ إِنِ اسْتَطَعْتَ، وَإِلَاّ فَأوَْمِئْ إِيمَاءا، وَاجْعَلْ سُجُودَكَ أخْفَضَ مِنْ رُكُوعِكَ» رَوَاهُ البَيْهَقِيُّ، وَالحَافِظُ مُحَمّدُ بْنُ عَبْدِ الوَاحِدِ فِي «المُخْتَارَةِ». وَقَالَ أبُو حَاتِمٍ فِي رَفْعِهِ: «هَذَا خَطَأٌ؛ إِنّمَا هُوَ عَنْ جَابِرٍقَوْلَهُ: (أَنّهُ دَخَلَ عَلَى مَرِيضٍ)».", "s": ["الحديث دليل على أن المريض العاجز عن السجود على الأرض يسجد في الهواء، ويكون سجوده أخفض من ركوعه، ولا حاجة إلى أن يضع شيئا يسجد عليه من وسادة أو غيرها، وهذا هو الراجح من قولي أهل العلم أخذاً بهذا الدليل، كما أنه إذا لم يستطع السجود على الأرض فلا يضع يديه على الأرض، وإنما يضعهما على ركبتيه كهيئة جلوس الصلاة، لحديث ابن عمر رضي الله عنهما رفعه قال: (إن اليدين تسجدان كما يسجد الوجه، فإذا وضع أحدكم وجهه فليضع يديه، وإذا رفع فليرفعهما)، والله تعالى أعلم."], "t": ["رفع الحديث خطأ والصواب وقفه على جابر -كما ذكر المصنف-، وللحديث شاهد من حديث ابن عمر رضي الله عنهما أخرجه الطبراني في «الكبير» وقال الألباني: (هذا إسناد صحيح رجاله كلهم ثقات).", "فمن صحح الحديث فذلك لما له من الطرق والشواهد، وإعلاله بالوقف ليس بقادح فيه، فإن مثل ذلك له حكم الرفع، كما قال الشيخ عبد العزيز ابن باز، فيكون الموقوف مؤيداً للمرفوع."]}, "141": {"m": "وَعَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «رَأَيْتُ النّبِيّ صلى الله عليه وسلم يُصَلِي مُتَرَِبعا» رَوَاهُ النّسَائِيُّ، وَالدّارَقُطْنِيُّ، وَالحَاكِمُ - وَقَالَ: «عَلَى شَرْطِهِمَا» -. وَقَالَ النّسَائِيُّ: «لَا أَعْلَمُ أَحَدا رَوَى هَذَا غَيْرَأَبِي دَاوُدَ الحَفَرِيِ وَهُوَ ثِقَةٌ، وََلَا أَحْسِبُهُ إِلَاّ خَطَأا». كَذَا قَالَ، وَقَدْ تَابَعَ الحَفَرِيّ مُحَمّدُ بْنُ سَعِيدٍ بْنِ الأَصْبَهَانِيِ، وَهُوَ ثِقَةٌ، وَاللَّهُ أَعْلَمُ.", "s": ["أ- استدل الفقهاء بهذا الحديث على أن الأفضل للمصلي إذا كان يصلي جالساً أن يتربع في محل القيام.", "وصفة التربع: أن يجعل باطن القدم اليمنى تحت الفخذ اليسرى، وباطن القدم اليسرى تحت الفخذ اليمنى، ويضع الكفين على الركبتين، لأجل التفريق بين قعود القيام والقعود الذي في محله، إذ لو كان مفترشا لم يكن هناك فرق بين الجلوس في محله وبين الجلوس الذي هو بدل من القيام.", "قالوا: ولأن التربع أكثر راحة وخشوعا، بخلاف ما إذا جلس على رجله اليسرى مفترشا فقد يتعب، ولا سيما إذا طالت القراءة، كما في صلاة الليل، وهذا قول الجمهور.", "ولو صلى على غير هذه الحال أجزأ، لأن التربع - كما يقول المروزي - لم يأت في شيء من الأخبار إلا في هذا الحديث وفيه ما تقدم، ولم يثبت في كيفية جلوس المصلي قاعدا عن النبي صلى الله عليه وسلم شيء، وفي حديث عمران بن حصين رضي الله عنهما: (صل قائما فإن لم تستطع فقاعدا).", "ولم يذكر فيه صفة صلاته قاعدا، فدل على أنه يصلي قاعدا على أي حال شاء متوركا أو مفترشا أو متربعا أو متوكئا، والنبي صلى الله عليه وسلم قد ثبت أنه صلى جالسا ولم يرد في ذلك بيان كيفية جلوسه، والله تعالى أعلم.", "* * *"], "t": ["فقد أخرجه النسائي في كتاب «قيام الليل وتطوع النهار»، باب «كيف صلاة القاعد» وابن خزيمة من طريق أبي داود الحفري عن حفص، عن حميد، عن عبد الله بن شقيق، عن عائشة رضي الله عنها، قالت: … فذكرته.", "قال النسائي عقبه: (لا أعلم أحداً روى هذا الحديث غير أبي داود، وهو ثقة، ولا أحسب هذا الحديث إلا خطأ، والله تعالى أعلم).", "وهذا الحديث صححه الحاكم، وسكت عنه الذهبي، وأخرجه ابن حبان، وصححه الألباني.", "أما كلام النسائي فليس فيه الجزم بتضعيفه لأمرين:", "الأول: أن حكمه بالخطأ ظني، وأبو داود الحفري - وهو عمر بن سعيد بن عبيد - ثقة، ثم إن هذه الجملة الأخيرة لا توجد في «السنن الكبرى» (٢/ ١٤٣) الذي هو أصل الصغرى «المجتبى»، بل قال مغلطاي: إنها في بعض النسخ من «المجتبى». الثاني: أن أبا داود الحفري لم ينفرد به، فقد تابعه محمد بن سعيد الأصبهاني، ثنا حفص بن غياث به، أخرجه الحاكم (١/ ٢58) وعنه البيهقي (٢/ ٣05)، قال الحافظ: (وفي هذا تعقب على النسائي في دعواه تفرد أبي داود الحفري) والأصبهاني ثقة، وحفص بن غياث ثقة - أيضا - إلا أنه في الآخر ساء حفظه، فقد يكون هذا الحديث مما أخطأ فيه، وحميد هو الطويل كما في «الكبرى» وعند ابن حبان والبيهقي."]}, "142": {"m": "عَنْ عَائِشَةَ رضي الله عنها قَالَتْ: «الصّلاةُ أَوّلُ مَا فُرِضَتْ رَكْعَتَيْنِ، فَأُقِرّتْ صَلاةُ السّفَرِوَ أُتِمّتْ صَلاةُ الحَضَرِ. قَالَ الزُّهْرِيُّ: فَقُلْتُ لِعُرْوَةَ: فَمَا بَالُ عَائِشَةَ تُتِمُّ؟ قَالَ: تَأَوّلَتْ مَا تَأَوّلَ عُثْمَانُ» مُتّفَقٌ عَلَيْهِ. وَلِلْبُخَارِيِ عَنْهَا رضي الله عنهَا قَالَتْ: «فُرِضَتِ الصّلاةُ رَكْعَتَيْنِ، ثُمّ هَاجَرَرَسُولُ اللَّهِ صلى الله عليه وسلم فَفُرِضَتْ أَرْبَعا، وَتُرِكَتْ صَلاةُ السّفَرِعَلَى الأوّلِ».", "w": ["قوله: (فأقرت صلاة السفر) ظاهره بقاء صلاة السفر على ركعتين من أول الأمر، وليس مراداً، بل المراد أنها رجعت للحالة الأولى بعد نزول القصر في السفر، فلم يظهر فيها زيادة أصلاً، ولا يشكل على هذا قوله تعالى: ﴿فَلَيسَ عَلَيكُم جُنَاح أن تَقصُرُوا مِنَ الصَّلاةِ﴾ [النساء: ١0١] الذي يفيد أن صلاة السفر قصرت بعد أن كانت تامة، فكيف يصح القول بأنها (أقرت)؟ والجواب: أن معنى (أقرت) باعتبار ما آل إليه الأمر من التخفيف، لا أنها استمرت منذ أن فرضت؛ لأنها بالنسبة إلى صلاة الحضر التي زيد فيها إلى أربع صارت صلاة السفر مقصورة.", "قوله: (وأتمت صلاة الحضر)؛ أي: بعد الهجرة إلى المدينة أتمت الصلاة في الحضر فصارت أربع ركعات.", "قوله: (تأولت ما تأول عثمان)؛ أي: أتمت الصلاة متأولة ومجتهدة كما تأول واجتهد عثمان في إتمامه، ومراد عروة بن الزبير بهذا: التشبيه بالإتمام بتأويل، لا اتحاد تأويلهما - كما سيأتي إن شاء الله -."], "s": ["أ- الحديث دليل على أن صلاة السفر والحضر قبل الهجرة كانت ركعتين ركعتين، ثم زيد في صلاة الحضر، فصارت الظهر والعصر والعشاء أربعاً؛ لأن الحضر موضع الراحة والاستقرار، ومن فضل الله على عباده أن زادهم ركعتين، لما فيهما من الأجر العظيم والخير الكثير.", "أما المغرب فهي ثلاث منذ فرضت لتكون وتر النهار، والفجر ركعتان، وقد ثبتت على ما فرضت عليه، لطول القراءة فيها.", "ب- استدل بحديث عائشة رضي الله عنها من قال بوجوب القصر في السفر، ووجه الاستدلال: أن قولها: (فرضت) بمعنى: وجبت، فإذا كانت صلاة السفر مفروضة ركعتين لم تجز الزيادة عليها؛ لأن الله تعالى زاد صلاة الحضر دون صلاة السفر. وهذا قول أبي حنيفة، ورواية عن أحمد، وهو قول ابن حزم، وآخرين، واختاره الصنعاني والشوكاني.", "كما استدلوا بحديث ابن عباس رضي الله عنهما قال: (فرض الله الصلاة على لسان نبيكم صلى الله عليه وسلم في الحضر أربعاً، وفي السفر ركعتين، وفي الخوف ركعة).", "كما استدلوا بحديث يعلى بن أمية، قال: قلت لعمر بن الخطاب: {فليس عليكم جناح أن تقصروا من الصلاة إن خفتم أن يفتنكم الذين كفروا} [النساء: ١0١] فقد أمن الناس، فقال: عجبت مما عجبت منه، فسألت رسول الله صلى الله عليه وسلم عن ذلك فقال: «صدقة تصدق الله بها عليكم، فاقبلوا صدقته».", "فهذا يدل على وجوب القصر؛ لأنه أمر بقبول هذه الصدقة، وهي القصر، وهذا أمر مطلق فيحمل على الوجوب.", "والقول الثاني: أن القصر مستحب وليس بواجب، وهو قول عامة أهل العلم - كما يقول ابن تيمية - ومنهم الشافعي، ومالك، وأحمد في المشهور عنه، واختاره الشيخ عبد العزيز بن باز، وقال ابن تيمية: (القصر أفضل، والإتمام مكروه)، وهو رواية عن الإمام أحمد.", "واستدلوا بقوله تعالى: {وإذا ضربتم في الأرض فليس عليكم جناح أن تقصروا من الصلاة} [النساء: ١0١].", "ووجه الدلالة: أن الآية نفت الجناح - وهو الإثم - عمن قصر الصلاة، وهذا دليل على الإباحة، كما يستفاد من الآيات الأخرى التي ورد فيها نفي الجناح.", "كما استدلوا بحديث يعلى المتقدم، ووجه الدلالة: أن النبي صلى الله عليه وسلم سمى التخفيف من عدد الركعات: صدقة، فدل على أنها صدقة وفضل وتخفيف من الله تعالى، والصدقة لا يجب قبولها، بل يجب قبول العزمات، ولو كان القصر واجباً لما قال عنه: إنه صدقة، بل قال: عزمة من عزمات ربنا أو نحو ذلك مما يدل على وجوب القبول، ثم إن أول الحديث يدل على ذلك، وهو قوله: «صدقة تصدق الله بها عليكم»، أي: تفضل بإباحة ما كان ممنوعاً قبل ذلك، فيكون آخره تأكيداً لأوله.", "القول الثالث: أن المسافر مخير إن شاء أتم وإن شاء قصر، وعزاه ابن المنذر للشافعي وأبي ثور، وقال ابن الملقن: (إنه وجه للشافعية).", "واستدلوا بما سيأتي من فعل عائشة رضي الله عنها أنها كانت تتم وتقصر، كما استدلوا بفعل عثمان رضي الله عنه حيث كان يقصر صدراً من خلافته، ثم أتمها أربعاً، وكذا من خلفه كابن مسعود رضي الله عنه.", "وهذا القول لا يخلو من ضعف؛ لأن التسوية بين القصر والإتمام منقوضة باستمرار الرسول صلى الله عليه وسلم على القصر، ولم ينقل عنه أنه أتم - كما تقدم - ثم إن ابن مسعود رضي الله عنه لما بلغه أن عثمان صلى بمنى أربع ركعات قال: (إنا لل وإنا إليه راجعون، صليت مع رسول الله صلى الله عليه وسلم بمنى ركعتين، وصليت مع أبي بكر بمنى ركعتين، وصليت مع عمر بن الخطاب بمنى ركعتين، فليت حظي من أربع ركعات ركعتان متقبلتان).", "ولو كان المسافر مخيرًا لما استرجع ابن مسعود رضي الله عنه من الأمر الجائز، لكنه استرجع لما شاهده من مداومة النبي صلى الله عليه وسلم وخلفائه على صلاة ركعتين في السفر، أو يقال: إنه استرجع لترك الأولى.", "هذا وقد ذكر ابن القيم عدة أعذار لإتمام عثمان رضي الله عنه، وتعقبها، ثم ذكر أن من أحسنها أن عثمان كان قد تأهل بمنى، والمسافر إذا أقام في موضع وتزوج فيه أو كان له به زوجة فإنه يتم.", "والناظر في الأدلة المتقدمة يتبين له أن الأحوط للمسافر ألا يدع القصر، اقتداء بالنبي صلى الله عليه وسلم وخروجاً من خلاف من أوجبه، فإن القول بالوجوب قوي، لكنه قد يشكل عليه إتمام بعض الصحابة، كما تقدم، فإنه لو كان القصر واجباً ما أتم أحد منهم، ولأنكر بعضهم على بعض ترك
